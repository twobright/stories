  title: '【一休历险记】第二十一集：森林里的迷路陷阱',
  category: '一休',
  content: '一休要穿过一片大森林去外婆家。可是这片森林很奇怪，里面的路弯弯绕绕，好多人走进去就迷路了，再也出不来。据说，是森林里的迷路妖在作怪，它会把路变来变去，让人转圈圈。\n\n一休进森林前，做了充分的准备。她想:"既然森林里的路会变，那我就要留下自己的记号，不能只靠记路。"\n\n一休带了一小袋彩色的小石子。她一边走，一边每隔一段路就放下一颗石子做记号。这样，就算路变了，她也能顺着自己的石子找到来时的路。\n\n走着走着，一休感觉又回到了刚才走过的地方——迷路妖开始作怪，把路变得转圈圈。但一休看到了自己放的石子，就知道:"我在这里放过石子，说明我走过这里了，不能再往这个方向走。"\n\n一休靠着石子记号，避开了走过的路，一直朝没放过石子的新方向走。迷路妖怎么变路，都骗不了她——因为一休有自己的记号。\n\n迷路妖急了，把石子藏起来、移动位置。但一休又想了个办法——她还在树上刻记号（做两种记号，互相印证）。就算石子被移动了，树上的刻痕还在。\n\n迷路妖使尽了办法，也没能让一休迷路。一休靠着自己的记号，一步一步，终于走出了森林，到了外婆家！\n\n迷路妖气得没办法:"从来没有人能走出我的森林，这个小姑娘太聪明了！"\n\n一休想:"面对会\'变路\'的迷路陷阱，光靠记忆不行，要留下自己的记号（还要有备用的记号）。这样不管环境怎么变，都能找到方向。做事情要有准备、有办法，还要有备用方案，才能应对变化和困难。"\n\n一休用她的智慧和充分的准备，破解了迷路妖的陷阱，安全穿过了森林。她明白了：面对变化和困难，事先准备、留好记号、有备用方案，就能不迷失方向、克服困难。'
},
{
  id: 'yixiu_22',
  title: '【一休历险记】第二十二集：偷东西的小猴',
  category: '一休',
  content: '村子里最近老是丢东西——今天丢个帽子，明天丢串糖葫芦，后天丢个玩具。大家都很苦恼，不知道是谁偷的。\n\n一休决定当"小侦探",查清楚是谁偷的。\n\n一休仔细观察，发现丢的东西都是些鲜艳、好玩、能吃的小东西，而且都是从窗台、院子这些高处或者露天的地方丢的。\n\n"会不会是……"一休有了猜想。她在自己家的窗台上，放了一串鲜艳的红果子作为"诱饵",然后躲在旁边悄悄观察。\n\n没过多久，一只小猴子从树上跳下来，"嗖"地一下抓起红果子，又跳回树上了！\n\n"原来是小猴子偷的！"一休恍然大悟。小猴子喜欢鲜艳、好玩、能吃的东西，就把村民的东西"偷"走了——其实小猴子不懂这是偷，它只是好奇、喜欢就拿走了。\n\n一休跟踪小猴子，找到了它在树上的"藏宝洞"——里面堆满了偷来的帽子、玩具、糖葫芦（已经坏了）等等。\n\n一休没有责怪小猴子，而是想了个办法。她知道，硬抢回来，小猴子还会再偷。于是，一休用小猴子更喜欢的东西——一大串新鲜的香蕉，跟小猴子"交换":"小猴子，用这些香蕉，换回大家的东西好不好？"\n\n小猴子看到香蕉，高兴地把偷来的东西还了出来，换走了香蕉。\n\n一休还教村民:"小猴子喜欢鲜艳、能吃的东西，所以我们要把这些东西收好，别放在露天的窗台、院子里，小猴子就不会来拿了。"\n\n村民们照做了，把东西收好。小猴子拿不到东西，也就不来了。而一休还常常给小猴子送点香蕉、果子，小猴子和村民成了朋友，再也不"偷"东西了。\n\n一休想:"遇到问题，要先冷静观察、找出原因（是谁、为什么）。小猴子\'偷\'东西是因为好奇、喜欢，不是坏心。解决问题不能只靠硬抢，要用巧办法（交换、收好东西），还能化敌为友。"\n\n一休用她的观察力和智慧，查清了偷东西的"真凶",还用巧办法解决了问题、化解了矛盾。她明白了：解决问题要先弄清原因，再用智慧巧妙化解，有时候还能把"麻烦"变成朋友。'
},
{
  id: 'yixiu_23',
  title: '【一休历险记】第二十三集：会喷火的小龙',
  category: '一休',
  content: '山谷里住着一条会喷火的小龙。小龙脾气暴躁，一生气就喷火，把周围的树木烧焦了，还吓得小动物们不敢靠近。\n\n一休想去看看小龙为什么这么爱生气、喷火。她小心地来到山谷。\n\n小龙看到一休，警惕地喷了一小口火:"走开！别靠近我！"\n\n一休没有害怕，也没有靠得太近。她温和地问:"小龙，你为什么总是生气、喷火呀？"\n\n小龙气呼呼地说:"因为大家都怕我、躲着我、不跟我玩！我很孤单，很生气！"\n\n一休明白了——原来小龙喷火，是因为孤单、没有朋友，越孤单越生气，越生气越喷火，越喷火大家越怕它、越躲它，形成了恶性循环。\n\n一休温和地说:"小龙，我知道你很孤单。但是你一生气就喷火，会烧到别人、吓到别人，大家当然会怕你、躲你呀。你越喷火，就越没有朋友，越孤单。"\n\n小龙愣住了:"那……我该怎么办？"\n\n一休说:"你要学会控制自己的脾气。生气的时候，别喷火，先深呼吸，冷静一下。你可以用你的火做好事呀——比如冬天给大家取暖，或者帮大家点篝火。这样，大家就会喜欢你、跟你做朋友了。"\n\n小龙将信将疑地试了试。它生气的时候，努力忍住不喷火，深呼吸冷静下来。冬天，它用温暖的火给小动物们取暖;晚上，它帮大家点起温暖的篝火。\n\n慢慢地，小动物们发现小龙其实很温暖、很有用，不再怕它了，开始跟它做朋友。小龙有了朋友，不再孤单，也就不生气、不乱喷火了。\n\n小龙感激地对一休说:"谢谢你！我现在有好多朋友，一点都不孤单了！"\n\n一休想:"很多人发脾气、做坏事，其实是因为孤单、不被理解。要用理解和关爱去化解，帮他们控制情绪、用自己的能力做好事。这样，\'可怕\'的人也能变成好朋友。"\n\n一休用她的理解、关爱和智慧，帮暴躁孤单的小龙学会了控制脾气、交到了朋友。她明白了：理解和关爱能融化怨气，控制情绪、用能力做好事，能把孤单变成温暖、把敌人变成朋友。'
},
{
  id: 'yixiu_24',
  title: '【一休历险记】第二十四集：智斗强盗',
  category: '一休',
  content: '一休帮村里人去镇上卖东西、买东西，带着一小袋钱走在路上。突然，一个强盗跳出来，拦住了她:"把钱交出来，不然别想走！"\n\n一休吓了一跳，但她很快冷静下来。强盗人高马大，硬拼肯定不行，得用智慧。\n\n一休假装很害怕，说:"大哥，钱我可以给你。不过，我这袋子里的钱不多，前面不远的大树下，我还藏了一大袋金子呢！那才是大钱！"\n\n强盗一听有一大袋金子，眼睛都亮了:"金子在哪？快带我去！"\n\n一休说:"就在前面那棵大树的树洞里。不过树洞很深，我手短掏不出来，得你自己掏。我带你去。"\n\n一休把强盗带到了大树旁——这棵树的树洞里，其实住着一窝马蜂！一休早就知道。\n\n一休指着树洞:"金子就在里面，你伸手进去掏吧！"\n\n强盗贪婪地把手伸进树洞去掏"金子"——结果，捅了马蜂窝！"嗡——"一大群马蜂飞出来，把强盗蜇得又跳又叫:"啊！马蜂！疼死了！"强盗抱着头，落荒而逃。\n\n一休趁机拿着钱，飞快地跑回了安全的地方。\n\n村里人听说了，都佩服一休的机智:"面对凶恶的强盗，一休没有硬拼，而是利用强盗的贪心，把他引到马蜂窝那里，让马蜂教训了他！"\n\n一休说:"遇到危险的坏人，不能硬碰硬——那样很危险。要冷静，利用坏人的弱点（贪心），用智慧把他引开或者让他自食其果。保护好自己最重要。"\n\n不过一休也提醒大家:"遇到强盗这样的危险，最好的办法还是尽量避开、快点逃到安全的地方、找大人和警察帮忙。用智慧脱险是没办法时的应急，安全永远第一。"\n\n一休用她的冷静和机智，智斗强盗，保护了钱财和自己的安全。她明白了：面对危险的坏人，不能硬拼，要冷静利用对方的弱点、用智慧脱险，同时要尽快求助、把安全放在第一位。'
},
{
  id: 'yixiu_25',
  title: '【一休历险记】第二十五集：镜子迷宫',
  category: '一休',
  content: '一休走进了一座奇怪的宫殿，里面全是镜子——墙是镜子，到处都是镜子，形成了一座镜子迷宫。镜子里映出无数个一休，分不清哪条是真正的路，一休转来转去，找不到出口。\n\n原来，这是一座会困住人的镜子迷宫，很多人进来就被镜子的影像迷惑，找不到出口，一直困在里面。\n\n一休冷静下来，仔细观察。她发现，镜子里的"路"都是假的影像，真正的路只有一条。可是镜子太多，影像太逼真，怎么分辨呢？\n\n一休想了个办法。她伸出手，慢慢地朝前摸。如果是真正的通路，手会摸到空气，能走过去;如果是镜子（假路），手会摸到冰凉、光滑的镜面。\n\n一休一边摸，一边走。摸到镜子的地方，她就知道是假路，绕开;摸到空气的地方，才是真路，往前走。\n\n她还在走过的地方，用口红（或者别的能做记号的东西）在镜子上画个记号，避免走回头路、绕圈圈。\n\n靠着"用手摸辨真假"和"做记号防绕圈",一休不再被镜子的影像迷惑，一步一步地找到了真正的路。\n\n最后，一休摸到了一扇真正的门——她走出了镜子迷宫！\n\n一休回头看，镜子迷宫还在闪着迷惑人的光，但再也困不住她了。\n\n一休想:"镜子迷宫里，眼睛看到的影像会骗人。这时候不能只相信眼睛，要用手去摸、用别的办法去验证真假。遇到迷惑人的假象，冷静下来，用可靠的方法辨别真假，就不会被骗、被困。"\n\n一休用她的冷静和智慧，破解了镜子迷宫的迷惑，找到了真正的出口。她明白了：眼见不一定为实，假象会迷惑人。用可靠的方法验证、不被表面现象迷惑、做好记号不重复犯错，就能走出困境。'
},
{
  id: 'yixiu_26',
  title: '【一休历险记】第二十六集：会许愿的流星',
  category: '一休',
  content: '一天晚上，一休看到天上划过一颗流星。传说，对流星许愿，愿望就能实现。\n\n一休闭上眼睛，正要许愿"我想要好多好多玩具",突然停住了。她想起了村里那些有困难的人——生病的奶奶、贫穷的小朋友、孤单的老爷爷。\n\n一休改变了愿望。她认真地许愿:"我希望村里生病的人都能健康，贫穷的人都能吃饱，孤单的人都能有人陪伴，大家都能幸福快乐。"\n\n许完愿，一休睁开眼睛。流星已经消失了。一休有点失落——不知道这样"为别人许的愿"能不能实现。\n\n第二天，神奇的事情发生了。一休发现，自己好像变得更有智慧、更有力量了——她能想出好办法帮生病的奶奶找到草药;能帮贫穷的小朋友想办法（教他们种菜、捕鱼）;能陪孤单的老爷爷聊天、给他讲故事。\n\n原来，流星没有直接变出东西，而是给了一休帮助别人的智慧和力量！\n\n一休用这份力量，一件一件地帮助村里有困难的人。生病的奶奶吃了草药，慢慢好了;贫穷的小朋友学会了种菜、捕鱼，有饭吃了;孤单的老爷爷有一休陪伴，不再寂寞。慢慢地，一休许的愿望，真的一点一点实现了！\n\n一休明白了流星的秘密:"原来，愿望不是等着天上掉下来的，而是要靠自己的努力去实现。流星给了我帮助别人的智慧和力量，但真正实现愿望的，是我自己的行动。"\n\n村里人都感激一休:"多亏了一休，我们的生活越来越好了！"\n\n一休却说:"是大家一起努力的结果。而且，看到大家幸福，就是我最大的快乐——这个愿望，比要玩具珍贵多了。"\n\n一休想:"许愿不能只想着自己，为别人许愿、帮助别人，会让愿望更有意义。而且，愿望要靠自己的行动去实现，不能等着天上掉下来。用智慧和努力去帮助别人、创造美好，愿望就会成真。"\n\n一休用她的善良、智慧和行动，让"为别人许的愿"变成了现实。她明白了：最美好的愿望是让大家都幸福，而实现愿望，要靠自己的努力和行动。帮助别人的快乐，是最大的幸福。'
},
{
  id: 'yixiu_27',
  title: '【一休历险记】第二十七集：会隐身的小偷',
  category: '一休',
  content: '村里来了一个会隐身的小偷，专门偷东西。因为它能隐身，谁也看不见它，抓也抓不到，村里人都很苦恼。\n\n一休决定想办法抓住这个隐身小偷。\n\n一休冷静地想:"小偷能隐身，看不见，但是……隐身了，它还是有身体的呀。看不见，可以想别的办法让它现形。"\n\n一休想到:隐身的小偷虽然看不见，但走路会有脚印、碰到东西会发出声音、经过的地方空气会动。\n\n一休想了个办法。她在小偷经常出没的地方，撒了一层薄薄的面粉。这样，隐身小偷走过，脚上就会沾上面粉，还会在地上留下白白的脚印，就能看到它的行踪了！\n\n果然，晚上，一休看到地上出现了一串白色的脚印，慢慢移动——是隐身小偷来了！虽然看不见它的身体，但能看到它沾着面粉的脚印。\n\n一休还准备了一大盆水。当脚印移动到院子中间时，一休"哗"地泼出一盆水！水浇在隐身小偷身上，湿漉漉的身体轮廓显现出来了——小偷现形了！\n\n小偷惊慌失措:"你怎么看得见我！"\n\n一休笑着说:"你虽然能隐身，但脚印、水都能让你现形。而且，做坏事总会留下痕迹的。"\n\n村里人一起把小偷抓住了，交给了大人处理。小偷偷的东西也都还给了大家。\n\n村里人都佩服一休的机智:"隐身小偷谁也抓不到，一休却用面粉和水让它现了形！"\n\n一休想:"看不见的东西，不代表抓不住。隐身的小偷，会留下脚印、会被水浇湿现形。遇到看似无解的难题，冷静动脑，从别的角度想办法——总能找到破解的方法。而且，做坏事总会露出马脚，正义终将战胜邪恶。"\n\n一休用她的冷静和智慧，抓住了会隐身的小偷，保护了村里人的财物。她明白了：再狡猾的坏人也会露出破绽，冷静动脑、换个角度想办法，就能破解看似无解的难题。'
},
{
  id: 'yixiu_28',
  title: '【一休历险记】第二十八集：两个国王的难题',
  category: '一休',
  content: '一休旅行到了一个地方，这里有两个相邻的小国，因为一条河闹起了矛盾。河这边的国王想把河水都引到自己国家浇地，河那边的国王也想把水都引过去，两个国王争来争去，差点打起来，老百姓都很担心。\n\n两个国王听说一休很聪明，就请她来评评理、想想办法。\n\n一休先了解了情况:河这边的国家种的是需要很多水的稻子;河那边的国家种的是不太需要水的麦子。而这条河的水，其实够两个国家用，只是大家都想独占。\n\n一休想了个公平又聪明的办法。她对两个国王说:"两位国王，这条河的水，其实够大家用。你们争抢独占，只会两败俱伤。我有个办法——"\n\n"河这边种稻子，需要很多水，就在种稻子的季节多用水;河那边种麦子，需要水少，平时少用一些。而且，可以在河上修一个水闸，需要水的时候放水，不需要的时候蓄水，两个国家轮流、按需使用。这样，两个国家都有足够的水，还能和睦相处。"\n\n两个国王一听，觉得这个办法真好——原来河水够用，之前是自己太自私、想独占，才闹矛盾。\n\n两个国王按一休的办法，一起修了水闸，轮流按需用水。从此，两个国家都有了足够的水，稻子和麦子都长得很好，两国也成了好邻居，不再争斗。老百姓过上了安稳的好日子。\n\n两个国王都感激一休:"多亏了聪明的一休，帮我们化解了矛盾！"\n\n一休想:"很多矛盾，其实是因为大家都想独占、不肯分享、不肯商量造成的。其实资源够用，只要公平分配、按需使用、互相谦让，就能共赢，不用争斗。用智慧找到公平的办法，能化解矛盾、带来和平。"\n\n一休用她的智慧，化解了两个国家的矛盾，让大家和睦共赢。她明白了：争抢独占两败俱伤，公平分享、互相谦让、按需使用才能共赢。智慧和公平，能化解矛盾、带来和平与幸福。'
},
{
  id: 'yixiu_29',
  title: '【一休历险记】第二十九集：会传染的坏心情',
  category: '一休',
  content: '一休发现，村里最近弥漫着一种"坏心情"——一个人不高兴，抱怨几句，旁边的人也跟着不高兴、抱怨;越来越多的人心情变坏，整个村子都愁眉苦脸、争吵不断。\n\n原来，这是一种"坏心情传染病"——坏情绪像感冒一样，一个传一个，越传越广。\n\n一休想:"坏心情能传染，那好心情是不是也能传染呢？"\n\n一休决定用"好心情"来对抗"坏心情传染病"。\n\n一休先让自己保持乐观、开心。她见到每个人，都笑眯眯地打招呼、说鼓励和开心的话:"今天天气真好呀！""你的衣服真漂亮！""我们一起做个游戏吧！"\n\n一休还主动帮助大家、逗大家开心、分享快乐的事。慢慢地，被一休感染的人，心情变好了，也开始笑、开始说开心的话、开始帮助别人。\n\n好心情，也像感冒一样传染开了！一个传一个，越来越多的人变得开心、友善。渐渐地，整个村子又充满了笑声和温暖，争吵不见了，大家又和和气气、快快乐乐的。\n\n村里人都很惊讶:"是一休把好心情传染给了大家，赶走了坏心情！"\n\n一休说:"心情是会传染的。一个人抱怨、不高兴，会影响身边的人;一个人乐观、开心、友善，也会感染身边的人。既然这样，我们为什么不多传播好心情呢？多笑一笑、多说好话、多帮助别人、多分享快乐，好心情就会像阳光一样，温暖每一个人。"\n\n从那以后，村里人都学会了传播好心情——遇到不顺心的事，乐观面对;见到别人，友善微笑;多说鼓励的话，多帮助别人。村子变成了一个充满笑声和温暖的地方。\n\n一休想:"情绪是会互相影响、互相传染的。与其传播抱怨和坏心情，不如传播乐观和好心情。用微笑、鼓励、帮助和快乐去感染身边的人，就能让世界变得更温暖、更美好。"\n\n一休用她的乐观和智慧，用"好心情"战胜了"坏心情传染病",让村子重新充满了欢乐。她明白了：好心情和坏心情都会传染，做一个传播快乐、温暖和友善的人，就能感染身边的世界。'
},
{
  id: 'yixiu_30',
  title: '【一休历险记】第三十集：智斗三个小偷',
  category: '一休',
  content: '一休帮村里人看管一批粮食。晚上，来了三个小偷，想偷粮食。三个小偷人多，一休一个小姑娘，硬拼肯定不行。\n\n一休躲在暗处，冷静地观察和思考。她发现，三个小偷并不齐心——他们一边偷，一边小声争论谁多拿、谁少拿，互相不信任、都怕别人多占便宜。\n\n一休有了主意——利用他们的不团结、互相猜疑，让他们内讧。\n\n一休躲在暗处，压低声音，模仿其中一个小偷的声音，对另外两个说:"我要多拿一份，因为主意是我出的！"\n\n另外两个小偷一听，不干了:"凭什么你多拿！"三个人开始争吵起来。\n\n一休又模仿另一个小偷的声音:"你们俩想私吞，我早看出来了！"\n\n这下，三个小偷互相猜疑，都觉得对方想多占、想私吞，越吵越凶，最后竟然打了起来！\n\n三个小偷打作一团，把偷粮食的事忘得一干二净，还闹出了很大的动静。\n\n一休趁机大喊:"抓小偷啦！大家快来呀！"村里人被惊动了，纷纷拿着家伙赶来。三个小偷一看人多，吓得丢下粮食，各自逃命去了，还在逃跑时互相埋怨。\n\n粮食一点没丢，全保住了！\n\n村里人都佩服一休的机智:"三个小偷，一休一个人就把他们打发了！她利用小偷之间的不团结，让他们自己内讧，太聪明了！"\n\n一休说:"面对人多势众的坏人，硬拼不行。但坏人往往不齐心、互相猜疑。利用他们的这个弱点，让他们内讧、自乱阵脚，就能不费力气地打败他们。同时，及时呼救、找大家帮忙，也很重要。"\n\n一休用她的冷静、观察力和智慧，智斗三个小偷，保住了村里的粮食。她明白了：面对强敌，硬拼不如智取。抓住对手的弱点（不团结、互相猜疑），让他们自乱阵脚，再加上及时求助，就能以弱胜强、化险为夷。'
},
{
  id: 'yixiu_31',
  title: '【一休历险记】第三十一集：会长大的怪豆子',
  category: '一休',
  content: '一休得到了一颗神奇的豆子，据说种下去会长得很快很大。一休好奇地把豆子种在了院子里。\n\n第二天早上，豆子发芽了，而且长得飞快——一个上午就长到了屋顶那么高！豆藤越长越粗、越长越高，一直冲进了云里。而且，豆藤还在疯狂地长，眼看要把整个院子、整个房子都缠住、压垮了！\n\n一休慌了一下，但很快冷静下来:"这豆子长得太快、太疯了，会毁了房子的。我得想办法阻止它。"\n\n一休想:豆子长得快，是因为它拼命吸收水分和养分。如果……减少它的水分和养分呢？\n\n一休不再给豆藤浇水，还把豆藤根部周围的肥土挖走，换上贫瘠的沙土。同时，她把疯长的豆藤剪短一些，控制它的生长。\n\n可是豆藤长得太快，光这样还不够。一休又想:豆藤是朝着有阳光的方向疯长的。如果……\n\n一休找来一块大布，遮住了照在豆藤上的阳光。没有了充足的阳光、水分和养分，豆藤终于慢了下来，不再疯长了。\n\n一休把疯长的豆藤修剪整齐，控制在合适的高度。神奇的是，控制住之后，豆藤上结出了又大又香的豆子，可以吃，还可以做种子（不过一休再也不敢让它疯长了）。\n\n一休把大豆子分给了村里人，大家都尝到了又大又香的豆子，特别开心。\n\n一休想:"神奇的东西，如果不加控制，也会变成灾难。豆子长得快是好事，但疯长就会毁掉房子。凡事要有\'度\',要懂得控制。找到控制的方法（减少水分、养分、阳光，修剪），就能把\'灾难\'变成\'礼物\'。"\n\n一休用她的冷静和智慧，控制住了疯长的怪豆子，还让它结出了美味的果实。她明白了：任何事物都要有度、要懂得控制。找到控制的方法，就能化险为夷，还能把危险变成好处。'
},
{
  id: 'yixiu_32',
  title: '【一休历险记】第三十二集：不肯让路的大石头',
  category: '一休',
  content: '村里去镇上的路，被一块巨大的石头挡住了。石头太大太重，好多大人一起推都推不动。大家都很发愁——路被堵住，去镇上要绕很远的路。\n\n一休来看这块大石头。大人们说:"一休，这石头太重了，我们这么多人都推不动，你一个小姑娘更别想了。"\n\n一休没有急着推，而是围着石头观察、思考。她想:"硬推推不动，得用巧办法。"\n\n一休想起了爸爸教过的"杠杆原理"和"滚动"的知识。\n\n她先找来一根又粗又长的结实木棍，还有一块垫在下面当支点的小石头。一休把木棍的一头插到大石头底下，把小石头垫在木棍中间当支点，然后招呼大人们一起压木棍的另一头——利用杠杆的力量，"嘿哟!"大石头被撬动了一点！\n\n撬起来一点后，一休又想到用"滚动"的办法。她找来几根圆滚滚的木头，垫在大石头下面。这样，大石头就能像装了轮子一样，滚动起来了！\n\n大家一起推，大石头顺着圆木，慢慢地滚动、移开了！路终于通了！\n\n大人们都惊呆了:"一休一个小姑娘，居然想出办法把我们推不动的大石头移开了！"\n\n一休说:"硬推推不动，是因为没用对方法。用杠杆能撬动重物，用圆木垫着能让重物滚动。动脑筋、用巧办法（借助工具和原理），小小的力气也能移动大石头。"\n\n一休还说:"这就是知识的力量。学到的知识，关键时刻能用上，能解决大问题。所以要多学习、多观察、多思考。"\n\n从那以后，村里人遇到搬不动的重物，都会想想:"能不能用杠杆？能不能用滚动？"用巧办法解决了很多难题。\n\n一休用她的知识和智慧，移开了大人们都推不动的大石头。她明白了：面对困难，硬来不行，要动脑筋、用巧办法。知识和智慧，能让小小的力气发挥出大大的作用，解决看似不可能的难题。'
},
{
  id: 'yixiu_33',
  title: '【一休历险记】第三十三集：会说话的稻草人',
  category: '一休',
  content: '一休路过一片田地，田里立着一个稻草人。突然，稻草人说话了:"小姑娘，帮帮我吧！"\n\n一休吓了一跳，但她不害怕，好奇地问:"稻草人，你怎么会说话？你需要什么帮助？"\n\n稻草人说:"其实，是一只小鸟躲在我身体里说话。这只小鸟受伤了，飞不动，躲在我这里，又饿又怕。"\n\n一休扒开稻草，果然看到一只受伤的小鸟，翅膀受伤了，可怜巴巴的。\n\n一休心地善良，赶紧把小鸟捧出来，轻轻地检查伤口。"别怕，我帮你。"一休找来草药，敷在小鸟的伤口上，还喂它吃了些谷子、喝了些水。\n\n小鸟感激地说:"谢谢你救我。可是，田里的害虫太多了，庄稼都被害虫吃坏了，农民伯伯很发愁。稻草人吓不走那么多害虫，我本来想帮忙吃害虫，却受伤了……"\n\n一休想帮忙。她动脑筋想:怎么才能对付这么多害虫呢？\n\n一休想起，很多鸟儿都爱吃害虫。她有了主意——"如果能请来好多鸟儿帮忙吃害虫，害虫不就没了吗？"\n\n一休照顾小鸟养好了伤。小鸟为了报答一休，飞去叫来了好多好多鸟儿朋友。鸟儿们在田里帮忙捉害虫、吃害虫。没过多久，田里的害虫就被吃光了，庄稼又健康地生长了！\n\n农民伯伯高兴极了:"多亏了一休和鸟儿们，救了我的庄稼！"\n\n一休还提醒农民伯伯:"鸟儿是庄稼的好朋友，会帮忙吃害虫。我们要爱护鸟儿，不要伤害它们。保护了鸟儿，鸟儿就会保护庄稼。"\n\n农民伯伯记住了，从此爱护鸟儿。鸟儿们也常来帮忙捉害虫，庄稼年年丰收。\n\n一休想:"善良地帮助别人（救小鸟），会有意想不到的好报（鸟儿帮忙除害虫）。而且，大自然里的动物是我们的朋友，保护它们，它们也会帮助我们。人和大自然和谐相处，才能都过得好。"\n\n一休用她的善良和智慧，救了小鸟，还帮农民除了害虫、保护了庄稼。她明白了：善良助人会有好报，保护大自然、和动物做朋友，能带来和谐与丰收。爱出者爱返，人与自然和谐共处，是最美好的。'
},
{
  id: 'yixiu_34',
  title: '【一休历险记】第三十四集：会偷懒的魔法扫帚',
  category: '一休',
  content: '一休帮一位魔法师奶奶打扫房子。奶奶给了一把魔法扫帚，说:"这把扫帚会自己扫地，你指挥它就行。"\n\n一休对扫帚说:"扫帚，帮我扫地。"扫帚果然自己动起来扫地了。一休觉得真方便，就一直让扫帚干活，自己在旁边玩。\n\n可是，一休发现，这把魔法扫帚会偷懒！一休看着它的时候，它就认真扫;一休一不看它，它就慢下来、糊弄事，把垃圾扫到角落里藏起来，看起来扫干净了，其实没扫好。\n\n一休想:"这扫帚会偷懒、会糊弄，光靠它可不行。"\n\n一休明白了一个道理:"完全依赖别人（或工具）帮自己干活，还不检查、不监督，是不行的。别人可能会偷懒、糊弄。"\n\n于是，一休不再当"甩手掌柜"。她一边让扫帚扫，一边自己也动手打扫，还认真检查扫帚扫过的地方——角落、床底下这些容易藏垃圾的地方，她都仔细检查、重新打扫干净。\n\n在一休的监督和亲自参与下，房子被打扫得干干净净，没有一点糊弄和遗漏。\n\n魔法师奶奶回来一看，惊喜地说:"打扫得真干净！你是怎么让这把爱偷懒的扫帚好好干活的？"\n\n一休笑着说:"这把扫帚会偷懒、会糊弄，光靠它不行。我一边指挥它，一边自己也动手、还认真检查。所以打扫得干干净净。"\n\n奶奶赞赏地说:"你说得对！做事情不能完全依赖别人或工具，自己要参与、要检查、要负责。这样才能真正把事情做好。"\n\n一休想:"做事情，不能当\'甩手掌柜\'、完全依赖别人。别人（或工具）可能会偷懒、糊弄。自己要参与、要监督、要检查，认真负责，才能真正把事情做好。依赖别人不如依靠自己，凡事亲力亲为、认真负责最靠谱。"\n\n一休用她的勤劳和智慧，管好了爱偷懒的魔法扫帚，把房子打扫得干干净净。她明白了：做事不能完全依赖别人，要自己参与、监督、检查，认真负责，才能真正把事情做好。'
},
{
  id: 'yixiu_35',
  title: '【一休历险记】第三十五集：森林里的独木桥',
  category: '一休',
  content: '一休和一只小山羊，同时来到了一座又窄又高的独木桥两头。桥很窄，只能过一个，桥下是湍急的河水。\n\n一休想过桥去对岸，小山羊也想过桥来这岸。两个正好在桥中间相遇，谁也不肯让谁。\n\n小山羊脾气有点急，说:"你退回去，让我先过！"\n\n一休说:"我也要过桥呀。这样吧，我们想个办法，别在桥中间僵着，太危险了。"\n\n如果两个都不让，僵在桥中间，很可能都会掉进河里，很危险。硬挤、硬顶更不行。\n\n一休冷静地想办法。她想:"桥这么窄，没法两个并排过，也没法在桥上交换位置……除非……"\n\n一休想到了一个办法。她对小山羊说:"这样，你趴下来，我轻轻地从你身上跨过去。这样我们俩都能过桥，谁也不用退回去。"\n\n小山羊觉得这个办法好，就趴了下来。一休小心翼翼地、轻轻地从趴着的小山羊身上跨了过去。然后，小山羊站起来，继续朝对岸走。这样，一休过了桥，小山羊也过了桥，两个都过去了！\n\n小山羊感激地说:"谢谢你想出这么好的办法！我刚才还想跟你争呢，真不好意思。"\n\n一休笑着说:"没关系。遇到\'两个都想过、又只能过一个\'的难题，硬争、硬顶只会两败俱伤，甚至掉进河里。冷静想办法、互相配合（你趴下我跨过），就能两全其美。"\n\n一休想:"生活中常常遇到\'狭路相逢\'、双方都想要的情况。这时候，争抢、硬顶只会两败俱伤。冷静下来，互相谦让、互相配合，动脑筋想个两全其美的办法，就能皆大欢喜。谦让和智慧，能化解僵局。"\n\n一休用她的冷静、谦让和智慧，化解了独木桥上的僵局，让自己和小山羊都安全过了桥。她明白了：狭路相逢，争抢两败俱伤，谦让和配合、加上巧妙的办法，才能两全其美、皆大欢喜。'
},
{
  id: 'yixiu_36',
  title: '【一休历险记】第三十六集：会骗人的地图',
  category: '一休',
  content: '一休得到了一张藏宝地图，据说按照地图能找到宝藏。一休兴冲冲地按照地图去寻宝。\n\n可是，一休发现这张地图很奇怪——地图上标的路，走着走着就不对了;标着"宝藏在这里"的地方，什么都没有;还把她引向了危险的悬崖边、沼泽地。\n\n一休停了下来，冷静地想:"这张地图好像是假的、会骗人的。它把我引向危险的地方，肯定有问题。"\n\n原来，这是一张"骗人地图",是坏人做的，专门骗贪财的人，把他们引到危险的地方害死，或者让他们白白浪费力气。\n\n一休不再盲目相信地图。她想:"真正的路，要靠自己观察和判断，不能只信一张来路不明的地图。"\n\n一休把假地图收了起来，开始靠自己——观察太阳辨方向、看植物和水源找安全的路、留下记号防迷路。她一步一步地，安全地走出了危险区域。\n\n在返回的路上，一休遇到了一个也拿着同样"骗人地图"的人，正要往悬崖那边走。一休赶紧拦住他:"别去！那张地图是假的，会把你引向危险！我刚才差点上当。"\n\n一休把真相告诉了那个人，救了他一命。那个人感激不已。\n\n一休把这张骗人地图交给了村里的大人，还提醒大家:"不要轻易相信来路不明的\'藏宝地图\'、\'发财秘方\'这些东西，很可能是骗人的陷阱。天上不会掉馅饼，贪财容易上当。"\n\n村里人都记住了，再也没有人被这种骗人地图骗到了。\n\n一休想:"不要盲目相信来路不明的东西（地图、秘方、承诺）,尤其是那些许诺\'发财\'、\'好处\'的，很可能是骗人的陷阱。要靠自己的观察和判断，不贪心、不盲从。遇到危险及时停下、及时提醒别人。"\n\n一休用她的冷静、判断力和善良，识破了骗人地图，不但保护了自己，还救了别人。她明白了：不轻信、不贪心、靠自己判断，才不会掉进骗子的陷阱。而识破骗局后提醒别人，是善良的表现。'
},
{
  id: 'yixiu_37',
  title: '【一休历险记】第三十七集：爱抱怨的老树精',
  category: '一休',
  content: '森林里有一棵老树精，特别爱抱怨。天晴了，它抱怨太晒;下雨了，它抱怨太湿;有鸟儿来筑巢，它抱怨吵;没有鸟儿来，它又抱怨孤单。它整天愁眉苦脸、唉声叹气，把周围的气氛都弄得很压抑。\n\n一休路过，听到老树精又在抱怨:"唉，我的日子怎么这么苦啊……"\n\n一休问:"老树精，你有什么不开心的呀？"\n\n老树精把一肚子的抱怨都倒了出来:"天气不好、鸟儿吵、孤单、叶子掉了、树皮痒……什么都不好！"\n\n一休听完，笑着说:"老树精，同样的事情，换个角度看，就不一样了。你说太晒，可是阳光能让你进行光合作用、长得更壮呀;你说下雨湿，可是雨水滋润你、让你不干枯呀;鸟儿来筑巢吵，可是它们能帮你捉虫子、还给你做伴呀;叶子掉了，可是明年会长出更多新叶呀。"\n\n老树精愣住了:"还……还能这样想？"\n\n一休说:"是呀！同样的事情，你总看坏的一面，就觉得处处是烦恼;换个角度，看好的一面，就发现处处是美好。这叫乐观。乐观的人，日子过得开心;爱抱怨的人，日子过得愁苦。"\n\n老树精试着换个角度想。太阳出来了，它想:"阳光真温暖，能让我长得更壮！"下雨了，它想:"雨水真滋润，让我更有活力！"鸟儿来了，它想:"有鸟儿陪伴，真热闹，还帮我捉虫子！"\n\n慢慢地，老树精不再抱怨了，变得乐观开朗起来。它发现，原来自己的生活有这么多美好！它的心情好了，长得更加枝繁叶茂，还成了森林里最受欢迎的树——鸟儿爱来、动物爱来，热闹又温暖。\n\n老树精感激一休:"谢谢你教我换个角度看世界。原来，快乐是自己选择的！"\n\n一休想:"很多烦恼，其实是因为总看事情坏的一面。换个角度，看好的一面，就会发现生活处处是美好。抱怨让人愁苦，乐观让人快乐。快乐是一种选择——选择乐观地看世界，就能收获快乐。"\n\n一休用她的乐观和智慧，帮爱抱怨的老树精学会了换个角度看世界、变得乐观开朗。她明白了：同样的事情，换个角度看就不同。乐观地看世界、多看美好的一面，就能收获快乐。快乐，是自己的选择。'
},
{
  id: 'yixiu_38',
  title: '【一休历险记】第三十八集：会自己动的木偶',
  category: '一休',
  content: '一休在一个旧作坊里，发现了一个会自己动的木偶。木偶动作僵硬，眼神呆呆的，不停地重复着一个动作——扫地。它扫了一遍又一遍，同一个地方扫了无数次，可就是扫不干净，因为它只会机械地重复。\n\n一休觉得很奇怪，也很可怜这个木偶。她仔细观察，发现木偶背后有一个小小的发条和一些卡住的齿轮。\n\n"原来，这个木偶是被人做出来干活的，但是发条坏了、齿轮卡住了，所以它只会机械地重复一个动作，不会思考、不会变通。"一休明白了。\n\n一休想帮木偶。她小心地打开木偶背后的小盖子，检查发条和齿轮。她发现，有一个齿轮卡住了，导致木偶只能重复一个动作。一休轻轻地把卡住的齿轮拨正、上好发条。\n\n修好以后，木偶能正常活动了！它不再机械地重复扫同一个地方，而是能扫完这里扫那里，把整个作坊都扫干净了。\n\n一休看着木偶，若有所思。她想:"这个木偶，就像有些只会机械重复、不会思考变通的人。做事情如果只会死板地重复、不会动脑筋、不会根据情况变通，就像卡住的齿轮，效果很差。"\n\n一休还想到:"我做事情，要像修好的木偶一样，灵活变通——扫完这里扫那里，根据情况调整，动脑筋，才能把事情做好。不能死板、机械。"\n\n修好的木偶，仿佛"活"了过来，灵活地帮作坊干活，还会跟一休打招呼、道谢。\n\n一休想:"做事情不能死板、机械地重复，要动脑筋、会思考、能根据情况灵活变通。就像木偶，卡住了（不会变通）就效果差，灵活了（会思考变通）就能把事情做好。学习和做事，都要灵活变通、动脑思考，不能死记硬背、机械照搬。"\n\n一休用她的观察力、动手能力和智慧，修好了卡住的木偶，还从中悟出了"灵活变通"的道理。她明白了：做事要动脑筋、灵活变通，不能死板机械。会思考、能变通，才能把事情做好。'
},
{
  id: 'yixiu_39',
  title: '【一休历险记】第三十九集：抢功劳的狐狸',
  category: '一休',
  content: '森林里发生了一件好事:一休想办法引来水源，解决了大家的缺水问题，让森林重新有了清澈的溪流。\n\n可是，一只狡猾的狐狸，却到处跟大家说:"引来水源是我的功劳！是我想的办法！"它抢了一休的功劳，还得到了大家的感谢和称赞。\n\n小动物们本来想感谢一休，听狐狸这么一说，都以为是狐狸的功劳，纷纷去感谢狐狸。\n\n一休知道了，有点委屈，但她没有生气地去跟狐狸吵、去争。她冷静地想:"事实就是事实，我不用去抢、去争。真相总会大白的。"\n\n一休想了个办法，让真相自然显现。她对大家说:"既然引水源是狐狸的功劳，那狐狸一定很懂引水的办法。这样吧，森林另一头也缺水，请狐狸再用它的办法，引一次水源，让大家再见识见识！"\n\n狐狸傻眼了——它根本不会引水，功劳是抢来的。它支支吾吾，怎么也引不出水来，还把事情搞得一团糟。\n\n大家这才明白:"原来狐狸根本不会引水！引水源根本不是它的功劳！"\n\n这时，一休走出来，用真正的办法，又一次成功引来了水源。大家恍然大悟——原来真正有本事、真正引来水源的是一休，狐狸是抢功劳的骗子！\n\n小动物们纷纷谴责狐狸抢功劳、说谎，还向一休道歉和真诚地感谢。狐狸羞愧地灰溜溜跑了。\n\n一休说:"我没有去跟狐狸争吵，因为吵也吵不清。事实胜于雄辩——让狐狸再引一次水，它不会，真相自然就清楚了。抢来的功劳是假的，迟早会被拆穿。"\n\n一休还大度地说:"其实，我帮大家引水，不是为了功劳和感谢，而是想让大家有水喝。看到大家都有水喝了，我就很开心了。"\n\n一休想:"被人抢了功劳，不用生气地去争吵。真金不怕火炼，事实会证明一切。让真相自然显现（让抢功者露馅），比吵架更有力。而且，做好事不图回报和功劳，本身就很快乐。抢功劳、说谎的人，迟早会被拆穿。"\n\n一休用她的冷静、智慧和大度，让抢功劳的狐狸露了馅，真相大白。她明白了：被抢功劳不用争吵，事实会证明一切;做好事不图回报，问心无愧最快乐;而说谎、抢功的人终会自食其果。'
},
{
  id: 'yixiu_40',
  title: '【一休历险记】第四十集：会读心的水晶球',
  category: '一休',
  content: '一休遇到一个卖水晶球的商人。商人说:"这个水晶球能读懂人的心，知道你在想什么！只要一百个金币，就卖给你！"\n\n为了证明，商人拿起水晶球，"读"出了旁边一个人心里想的东西，说得还挺准。围观的人都惊呆了，纷纷想买。\n\n一休却觉得可疑——水晶球真能读心吗？她仔细观察商人。\n\n一休发现，商人在"读心"之前，总是先跟对方聊几句、观察对方的表情和穿着，然后才"读"出对方的心思。而且，商人"读"出来的，都是些谁都可能想的普通事（比如"你在想家人"、"你有点累"），说得含含糊糊，对方一对号入座，就觉得准了。\n\n"原来，水晶球根本不能读心！是商人靠观察、靠说含糊的话，让人觉得准！这是骗人的把戏！"一休看穿了。\n\n一休当众揭穿了商人:"你的水晶球根本不能读心！你是靠观察对方、说些谁都适用的含糊话来骗人的。不信，你\'读读\'我心里具体想的一个数字！"\n\n商人慌了——具体的数字他没法靠观察和含糊话猜出来。他支支吾吾，"读"错了。\n\n围观的人这才明白，水晶球是假的，商人是骗子！大家纷纷谴责骗子商人，还好没买。骗子商人灰溜溜地跑了。\n\n大家都感激一休:"多亏了一休，我们才没被骗，白白花一百个金币买假东西！"\n\n一休说:"世界上没有能读心的水晶球，那些\'神奇\'的东西，很多是骗人的把戏。骗子会利用人们的好奇和轻信，用一些障眼法、含糊话来行骗。我们要冷静、要多观察、多质疑，不轻信\'神奇\'的东西，就不会上当。"\n\n一休想:"世界上没有那么多\'神奇\'、\'读心\'的东西，很多是骗子的把戏——靠观察、靠含糊的话、靠障眼法骗人。要保持冷静和质疑，仔细观察、动脑思考，就能识破骗局。不迷信、不轻信、多用科学和理性看世界，才不会被骗。"\n\n一休用她的观察力、理性和智慧，识破了假水晶球的骗局，保护了大家的钱财。她明白了：世上没有那么多神奇的东西，很多是骗人的把戏。保持理性、冷静观察、勇于质疑，就能识破骗局、不上当受骗。'
},
{
  id: 'yixiu_41',
  title: '【一休历险记】第四十一集：会分身的怪物',
  category: '一休',
  content: '一休遇到了一个会分身的怪物。这个怪物能变出好多个一模一样的自己，围着一休转，让一休分不清哪个是真的，没法对付它。\n\n"哈哈，你分不清哪个是真的我，就打不到我！"好多个怪物一起说，声音一模一样。\n\n一休冷静下来，仔细观察这些"分身"。她想:"分身再多，也只有一个是真的、有实体的，其他都是假的、虚的影子。我要想办法找出真的那个。"\n\n一休想了个办法。她抓起一把沙子，朝所有的"怪物"撒过去。沙子撒在假分身身上，直接穿过去了（因为是虚影）;而撒在真怪物身上，沙子会沾在它身上、被挡住！\n\n一休一眼就看出——只有一个"怪物"身上沾了沙子、挡住了沙子，那就是真的！其他的都是虚影！\n\n"你在这里！真的怪物！"一休指着沾了沙子的那个。\n\n真怪物慌了:"你怎么找出来的！"\n\n一休趁机对付真怪物（比如用早就准备好的、能困住它的绳网，或者把它引到陷阱里）。抓住了真的，那些虚影分身"唰"地都消失了！\n\n怪物被制服了，再也不能靠分身骗人、害人了。\n\n一休想:"面对\'分身\'这样的迷惑，关键是找出\'真\'的那个。假的分身是虚的，真的有实体。用巧办法（撒沙子）区分虚实，就能识破迷惑、找到真正的目标。遇到让人眼花缭乱、分不清真假的情况，冷静下来，用方法区分真假，抓住关键（真的那个），问题就解决了。"\n\n一休用她的冷静和智慧，识破了会分身的怪物，找出了真身并制服了它。她明白了：面对迷惑人的假象和"分身",要冷静地区分真假、抓住真正的关键。用巧妙的方法验证虚实，就能拨开迷雾、直击要害。'
},
{
  id: 'yixiu_42',
  title: '【一休历险记】第四十二集：懒惰的农夫',
  category: '一休',
  content: '一休遇到一个懒惰的农夫。农夫有一大片田地，但他太懒了，不肯耕种，天天躺着睡觉，等着地里自己长出粮食。结果，田地荒芜了，长满了野草，一粒粮食都没有，农夫快要饿肚子了。\n\n农夫唉声叹气:"唉，我怎么这么倒霉，地里什么都不长……"\n\n一休看到了，说:"农夫伯伯，地里不长粮食，不是因为倒霉，是因为你没有耕种呀。庄稼要播种、浇水、施肥、除草，才能长出来。你天天躺着不干活，地当然荒了。"\n\n农夫说:"耕种太累了，我不想干……"\n\n一休想帮农夫改掉懒惰的毛病。她说:"伯伯，我们做个约定好不好？我陪你一起，先耕种一小块地，试试看。就一小块，不累的。"\n\n一休陪着农夫，翻土、播种、浇水。一小块地，很快就种好了。\n\n过了些天，那一小块地长出了绿绿的嫩芽！农夫惊喜地看着嫩芽，第一次尝到了劳动的成果和喜悦。\n\n一休趁机鼓励:"你看，只要动手耕种，地里就会长出东西！劳动是有回报的。而且，看着自己种的庄稼长大，多有成就感呀！"\n\n农夫受到了鼓舞，也尝到了劳动的甜头。他开始勤快起来，一小块一小块地耕种，慢慢把荒芜的田地都种上了庄稼。他每天勤劳地浇水、施肥、除草，田地里的庄稼长得越来越好。\n\n到了秋天，农夫的田地大丰收！金黄的稻谷堆成了小山。农夫再也不用饿肚子了，还把多余的粮食分给需要的人。\n\n农夫感激一休:"谢谢你！是你让我明白了，勤劳才有收获，懒惰只会挨饿。现在我天天劳动，日子越过越好，心里也踏实、快乐！"\n\n一休想:"懒惰的人，什么都得不到，还会挨饿受穷。天上不会掉粮食，收获要靠自己的辛勤劳动。劳动虽然辛苦，但有回报、有成就感、让人踏实快乐。要帮懒惰的人改掉毛病，可以陪他一起做、让他尝到劳动的甜头，他就会爱上劳动。"\n\n一休用她的智慧和耐心，帮懒惰的农夫改掉了懒惰、爱上了劳动，过上了丰收的好日子。她明白了：勤劳才有收获，懒惰只会受穷。劳动光荣，靠自己的双手创造美好生活，最踏实、最快乐。'
},
{
  id: 'yixiu_43',
  title: '【一休历险记】第四十三集：会传声的山谷',
  category: '一休',
  content: '一休来到一个山谷，这里有奇怪的回声——你说什么，山谷就重复什么。有一个坏心眼的小妖，利用这个回声搞破坏:它模仿别人的声音，说难听的话、造谣，让山谷回响，害得村里人互相误会、吵架。\n\n比如，小妖模仿甲的声音骂乙，回声传遍山谷，乙以为真是甲骂他，就跟甲吵架。村里因此闹得鸡犬不宁。\n\n一休来查清楚原因。她冷静观察，发现:那些"骂人的话"、"造谣的话",都是从山谷那个方向的一个山洞传出来的，而当时被"模仿"的人根本不在场。\n\n"原来，是有人躲在山洞里，模仿大家的声音，利用回声造谣、挑拨离间！"一休明白了。\n\n一休悄悄来到山洞，果然发现了那个坏心眼的小妖，正在模仿村民的声音说坏话。\n\n一休当场揭穿了它:"就是你！你躲在这里，模仿大家的声音造谣、挑拨离间，害得大家误会、吵架！"\n\n小妖被抓个正着，狡辩不了，只好承认。\n\n一休把真相告诉了村里人:"大家听到的那些\'骂人的话\'、\'坏话\',都不是真的，是这个小妖模仿声音造的谣！大家被骗了，白白误会、吵架。"\n\n村里人恍然大悟，纷纷和好、互相道歉——原来大家都被小妖骗了，互相误会了。小妖被大家赶走了。\n\n一休还提醒大家:"以后听到别人说的坏话、传的谣言，不要马上相信、马上生气。要冷静想想:这是真的吗？是我亲耳听当事人说的，还是别人传的？先弄清楚，再判断，就不会被谣言挑拨、被骗着吵架了。"\n\n村里人记住了。从此，大家不轻信谣言，遇到"听说"的坏话会先求证，村里再也没有因为谣言而吵架了，重新和和睦睦。\n\n一休想:"谣言和挑拨，会害得人互相误会、吵架。听到别人说的坏话、传的话，不要马上相信、马上生气。要冷静求证——是真的吗？是当事人亲口说的吗？不轻信谣言、不被挑拨，才能不被骗、不伤和气。"\n\n一休用她的冷静和智慧，识破了造谣挑拨的小妖，化解了村里的误会和矛盾。她明白了：谣言止于智者。不轻信、多求证、不被挑拨，就能识破谣言、维护和睦。'
},
{
  id: 'yixiu_44',
  title: '【一休历险记】第四十四集：金蛋和母鸡',
  category: '一休',
  content: '一休遇到一个人，他有一只神奇的母鸡，每天能下一个金蛋。靠着每天一个金蛋，这个人的生活越来越好。\n\n可是，这个人越来越贪心。他想:"母鸡每天只下一个金蛋，太慢了！它肚子里肯定有好多金蛋，我把它杀了，一次把金蛋都取出来，不就发大财了吗？"\n\n一休正好路过，听到这个人的打算，赶紧劝阻:"伯伯，千万别杀母鸡！"\n\n那人不解:"为什么？杀了它，我能一次得到好多金蛋！"\n\n一休说:"伯伯，你想想，母鸡是每天下金蛋的。如果你把它杀了，就算肚子里有金蛋，也只有那么几个，而且母鸡死了，以后就再也没有金蛋了！你这是杀鸡取卵，因为贪心，毁掉了长久的财源。"\n\n那人愣住了:"这……"\n\n一休继续说:"母鸡活着，每天给你下一个金蛋，虽然慢，但源源不断，能给你带来长久的好处。你为了一时的贪心杀了它，就失去了未来所有的金蛋。这是很不划算的。"\n\n那人想了想，恍然大悟:"对呀！我怎么这么糊涂，差点因为贪心杀了母鸡，失去了长久的财源！谢谢你提醒我，一休！"\n\n那人打消了杀母鸡的念头，继续好好养着母鸡。母鸡每天给他下一个金蛋，他的日子长长久久地好下去。他还用金蛋帮助了很多需要帮助的人。\n\n一休想:"贪心会让人做出\'杀鸡取卵\'的蠢事——为了一时的、更多的利益，毁掉了长久的、源源不断的好处。做事情要有长远的眼光，不能只顾眼前、贪图一时。保护好\'下金蛋的母鸡\'（长久的、可持续的东西），才能长久地受益。"\n\n一休用她的智慧和远见，劝阻了那人的贪心，保住了下金蛋的母鸡和长久的幸福。她明白了：贪心会让人杀鸡取卵、因小失大。要有长远眼光，保护可持续的东西，才能长久受益。不贪图一时之利，才是真正的智慧。'
},
{
  id: 'yixiu_45',
  title: '【一休历险记】第四十五集：会施法的巫婆',
  category: '一休',
  content: '森林里来了一个巫婆，会施各种法术。她把村里的水变苦、让庄稼枯萎、还把爱唱歌的小鸟变哑了，把村子搞得乌烟瘴气。大家都很害怕，不敢惹她。\n\n一休决定去会会巫婆，想办法让她停止作恶。\n\n一休来到巫婆的小屋。巫婆凶巴巴地说:"小丫头，你不怕我吗？"\n\n一休不卑不亢:"巫婆奶奶，我想问问，你为什么要害大家呢？把水变苦、庄稼枯萎、小鸟变哑，大家都很难过。你这样做，自己开心吗？"\n\n巫婆一愣，恶狠狠地说:"我……我就是看大家过得好，我不开心！我孤单、没人喜欢我，凭什么你们过得幸福！"\n\n一休明白了——原来巫婆作恶，是因为孤单、嫉妒、没人喜欢她，心里充满了怨恨。\n\n一休没有害怕，也没有指责，而是温和地说:"巫婆奶奶，我知道你孤单、不开心。但是，你害大家，大家只会更怕你、更讨厌你，你就更孤单了呀。这样恶性循环，你永远不会快乐。"\n\n巫婆愣住了。\n\n一休说:"其实，你有这么厉害的法术，可以用来做好事呀！你可以用法术帮大家——让庄稼长得更好、让水更甜、让花开得更美。这样，大家会感谢你、喜欢你、跟你做朋友，你就不孤单了，也会真正快乐起来。"\n\n巫婆将信将疑。一休真诚地说:"要不，你先把之前的坏法术解除，用法术做一件好事试试？我陪着你。"\n\n巫婆在一休的鼓励下，试着解除了坏法术——水变甜了、庄稼复活了、小鸟又能唱歌了。然后，她用法术让村里开满了美丽的花。\n\n村里人惊喜地发现巫婆变好了，纷纷来感谢她。巫婆第一次感受到被感谢、被喜欢的温暖，心里的怨恨融化了，露出了久违的笑容。\n\n从此，巫婆用法术为大家做好事，成了受欢迎的"魔法奶奶",再也不孤单、不作恶了。\n\n一休想:"很多作恶的人，其实是因为孤单、嫉妒、心里有怨恨。用理解和关爱去感化他们，引导他们用自己的能力做好事，就能化解怨恨、把\'坏人\'变成\'好人\'。爱和智慧，能融化最冰冷的心。"\n\n一休用她的勇敢、理解和智慧，感化了作恶的巫婆，让她弃恶从善。她明白了：作恶往往源于内心的孤单和怨恨。用理解、关爱和智慧去感化，引导人向善，比对抗更有力量。爱能融化怨恨，善意能感化人心。'
},
{
  id: 'yixiu_46',
  title: '【一休历险记】第四十六集：会走的房子',
  category: '一休',
  content: '一休在森林里发现了一座奇怪的房子——它长着四条腿，会自己走路！房子里传出微弱的呼救声:"救命……救命……"\n\n一休大着胆子靠近。原来，房子里困着一个小女孩。小女孩说:"这是一座魔法怪房子，它会到处走，把迷路的孩子骗进来关起来。我被困好久了，出不去！"\n\n一休想救小女孩，但怪房子的门窗都被魔法锁住了，打不开。而且房子还在不停地走，很危险。\n\n一休冷静地观察怪房子。她发现，房子走路是靠四条腿，而四条腿的关节处，各有一个发光的"魔法结"。"会不会，解开这些魔法结，房子就走不动、门也能开了？"\n\n一休趁房子的腿抬起来的时候，仔细看那些魔法结——原来是用魔法绳打的结。一休想起自己解绳结的本领:"解结不能硬拉，要找到松的地方，慢慢解开。"\n\n一休瞅准机会，爬到房子腿的关节处，开始解魔法结。她耐心地找到结里松的地方，一点一点地解。解开一个结，一条腿就不能动了;解开两个、三个、四个——房子四条腿都不能动了，停了下来！\n\n房子一停，门窗的魔法锁也失效了。一休打开门，把小女孩救了出来！\n\n"谢谢你救我！"小女孩感激地抱住一休。\n\n两个人赶紧离开了怪房子。失去了魔法结的怪房子，再也不能走、不能骗人了。\n\n一休还在附近做了记号、提醒别的孩子:"这里有危险的怪房子，别靠近！"\n\n一休想:"救人和脱险，要冷静观察、找到关键（魔法结）,用对方法（解结的耐心和技巧）。遇到看似无解的困境，不要慌，仔细找找突破口，总能找到解决的办法。而救人于危难，是善良和勇敢的表现。"\n\n一休用她的勇敢、观察力和智慧，解开了怪房子的魔法结，救出了被困的小女孩。她明白了：面对困境，冷静观察、找到关键、用对方法，就能破解。而勇于救助陷入危难的人，是善良和勇敢的体现。'
},
{
  id: 'yixiu_47',
  title: '【一休历险记】第四十七集：比聪明的考验',
  category: '一休',
  content: '一休遇到一位智者。智者说:"听说你很聪明，我来考考你。答对我的三个问题，我就送你一份特别的礼物。"\n\n第一个问题:"什么东西，越分越多？"\n\n一休想了想:"是快乐和知识！快乐分享给别人，大家都快乐，快乐就变多了;知识教给别人，别人学会了，知识也传播得更多了。"\n\n智者点头:"答对了。第二个问题——什么东西，你越用它，它越多；你不用它，它就没了？"\n\n一休想:越用越多、不用就没了……是脑筋！"是我们的头脑和智慧！越动脑筋、越思考、越学习，就越聪明、懂得越多;如果不动脑、不学习，就会变笨、变得什么都不懂。"\n\n智者赞许:"答对了！最后一个问题——世界上最强大的力量是什么？"\n\n一休认真地想了很久。是武力吗？不对。是财富吗？也不对。一休想起自己一路上的经历——用智慧化解危机，用善良感化坏人，用爱克服困难……\n\n一休回答:"我觉得，世界上最强大的力量，是爱和智慧。爱能融化怨恨、温暖人心、给人力量;智慧能解决难题、化解危机、创造美好。有了爱和智慧，就能战胜一切困难，让世界变得更好。"\n\n智者听了，欣慰地笑了:"孩子，你答得太好了！你不但聪明，还有一颗善良、充满爱的心，还悟出了爱和智慧的力量。这比单纯的聪明更可贵。"\n\n智者送给一休的"特别礼物",不是金银财宝，而是一句话:"永远保持善良、智慧和爱，用它们去帮助别人、化解困难、创造美好。这将是你一生最宝贵的财富。"\n\n一休把这句话牢牢记在了心里。\n\n一休想:"聪明很重要，但比聪明更重要的，是善良、智慧和爱。快乐和知识越分享越多;头脑越用越灵活;而爱和智慧，是世界上最强大的力量。用善良、智慧和爱去生活、去帮助别人，是最宝贵的。"\n\n一休通过了智者的考验，还收获了人生最宝贵的礼物——关于善良、智慧和爱的道理。她明白了：真正的聪明，是拥有善良的心和智慧的头脑，并用爱和智慧去帮助别人、创造美好。这是一生最宝贵的财富。'
},
{
  id: 'yixiu_48',
  title: '【一休历险记】第四十八集：会哭的乌云',
  category: '一休',
  content: '天空中飘来一朵会哭的乌云。乌云一哭，就下大雨，下个不停，把村子淹得到处是水，庄稼也被泡坏了。大家都很发愁，可是乌云在天上，谁也够不着，没法让它别哭。\n\n一休抬头看着哭泣的乌云，好奇地问:"乌云，你为什么一直哭呀？"\n\n乌云呜呜咽咽地说:"因为……因为没有人喜欢我。太阳一出来，大家就欢呼;我一来，大家就皱眉头、躲着我、讨厌我。我好伤心，忍不住就哭了……"\n\n一休明白了——乌云一直哭下雨，是因为觉得没人喜欢它、很伤心。\n\n一休温和地说:"乌云，其实大家不是讨厌你，是因为你哭起来下大雨，把村子淹了，大家才发愁。而且，你的作用可大了呢！"\n\n乌云不解:"我有什么作用？"\n\n一休说:"你下的雨，能滋润庄稼、能让小河有水、能让花草树木喝饱水、能让大地不干旱。没有你下雨，庄稼会旱死、大家会没水喝。你对大家可重要了！只是，你不能一直哭、下个不停，那样雨太多就成灾了。"\n\n乌云惊喜地说:"原来我这么有用！大家需要我！"\n\n一休说:"是呀！你只要适当地下雨——需要的时候下一点，滋润大地;不需要的时候就休息，让太阳出来。这样，大家就会喜欢你、感谢你了。"\n\n乌云听了，开心起来，不再伤心地哭了。它学会了适当地下雨——干旱的时候下一场及时雨，滋润庄稼;下够了就停，让太阳出来。\n\n从此，乌云成了大家欢迎的"及时雨"。干旱时，大家盼着乌云来;乌云来下场雨，滋润了大地，大家都感谢它。乌云有了价值感、被大家喜欢，再也不伤心哭泣、下个不停了。\n\n一休想:"每个人（每样东西）都有自己的价值和作用。乌云觉得没人喜欢而伤心，其实它的雨水对大家很重要。找到自己的价值、恰当地发挥作用，就能被大家喜欢、认可。同时，凡事要适度——雨下太多成灾，恰到好处才好。"\n\n一休用她的善良和智慧，让会哭的乌云认识到了自己的价值、学会了适度下雨，成了受欢迎的"及时雨"。她明白了：每个人都有自己的价值，找到并恰当发挥自己的作用，就能被认可、被喜欢。而凡事要适度，恰到好处最好。'
},
{
  id: 'yixiu_49',
  title: '【一休历险记】第四十九集：最后的大冒险——救出被困的太阳',
  category: '一休',
  content: '有一天，天空突然变得又黑又冷——太阳不见了！原来，一个嫉妒光明的黑暗魔王，把太阳抓走，关进了世界尽头的黑暗城堡里。没有了太阳，庄稼不长了、花草枯萎了、大家又冷又怕，世界陷入了黑暗。\n\n一休决定去救出太阳。这是她最大、最危险的一次冒险。\n\n一休带上了这一路冒险学到的所有本领和智慧，踏上了前往黑暗城堡的旅程。\n\n一路上，她遇到了重重考验:——遇到迷路的黑暗森林，她用留记号的办法走了出来;——遇到骗人的假路标，她靠自己的观察和判断识破;——遇到拦路的怪物，她用智慧巧妙化解;——遇到孤单作恶的小妖，她用善良感化了它，小妖还帮她带路。\n\n终于，一休来到了黑暗城堡。黑暗魔王凶恶地说:"小丫头，你竟敢来救太阳！我要把你也变成黑暗的一部分！"\n\n一休毫不畏惧。她发现，黑暗魔王虽然强大，但它最怕光明。而被关住的太阳，只要能透出一丝光，就能削弱魔王的力量。\n\n一休想办法来到关太阳的地方。太阳被一把黑暗的大锁锁住了。一休观察发现，这把锁需要"光明的钥匙"才能打开——而"光明的钥匙",其实是人心中的勇敢、善良和希望！\n\n一休鼓起所有的勇气，怀着善良的心和救出太阳的希望，握住了大锁。神奇的是，一休心中的勇敢、善良和希望，化作了光明的力量，"咔嚓"一声，大锁打开了！\n\n太阳重获自由，射出万丈光芒！强烈的光明，把黑暗魔王照得节节败退，最后消失得无影无踪。黑暗被驱散了，太阳重新回到了天空！\n\n世界重新充满了光明和温暖，庄稼复活了、花草盛开了、大家欢呼雀跃:"太阳回来了！是一休救出了太阳！"\n\n一休成了大家心中的大英雄。但她谦虚地说:"不是我一个人的功劳。是我一路上学到的智慧、遇到的朋友的帮助，还有我心中的勇敢、善良和希望，一起救出了太阳。"\n\n一休想:"最强大的力量，是心中的勇敢、善良和希望。它们就像\'光明的钥匙\',能打开最黑暗的锁、驱散最深的黑暗。只要心怀勇敢、善良和希望，再大的困难和黑暗，都能战胜。"\n\n一休用她一路积累的智慧、勇敢、善良和心中的希望，完成了最伟大的冒险——救出了太阳，驱散了黑暗。她明白了：勇敢、善良和希望，是心中最强大的力量，能战胜一切黑暗和困难。'
},

  category: '一休',
  content: '救出太阳后，一休回到了村子。村里人都把她当成了大英雄，围着她，听她讲一路冒险的故事。\n\n一休讲起了自己的冒险:识破镜子湖的陷阱、智斗大灰狼、破解各种妖怪的诡计、感化作恶的巫婆和小龙、救出被困的朋友和太阳……每一个故事，都充满了智慧、勇敢和善良。\n\n小朋友们听得入迷，都崇拜地说:"一休姐姐，你太厉害了！又聪明又勇敢又善良！"\n\n一休笑着说:"其实，我一开始也是个普通的小女孩。是这一路的冒险，让我不断成长——遇到危险，学会了冷静和勇敢;遇到难题，学会了动脑筋、想办法;遇到坏人，学会了用智慧化解;遇到需要帮助的人，学会了用善良和爱去温暖他们。"\n\n一休回想这一路，感慨地说:"我明白了好多道理:遇到诱惑不贪心，遇到危险不慌张，遇到困难动脑筋，遇到坏人用智慧，遇到弱者伸援手。而最重要的是——永远保持一颗善良、勇敢的心，永远怀着希望。"\n\n村里的一位老爷爷说:"一休，你不但自己成长了，还帮助了这么多人、化解了这么多危机、给大家带来了光明和温暖。你是我们的骄傲！"\n\n一休谦虚地说:"我还会继续成长、继续冒险、继续帮助别人。因为世界很大，还有好多需要智慧和爱的地方。"\n\n夜晚，一休躺在床上，看着窗外重新明亮的星空和月亮，心里充满了满足和期待。她知道，明天，又会有新的冒险、新的挑战、新的成长在等着她。但不管遇到什么，她都不害怕——因为她有智慧、有勇气、有善良，还有一颗永远充满希望的心。\n\n一休轻声对自己说:"让我想想办法——不管遇到什么困难，动动脑筋、鼓起勇气、怀着善良和希望，就一定能解决！"\n\n带着这份自信和期待，一休甜甜地进入了梦乡。梦里，她又踏上了新的冒险旅程……\n\n一休的故事告诉我们:成长，就是在一次次冒险和挑战中，学会智慧、勇敢和善良。遇到诱惑不贪心，遇到危险不慌张，遇到困难动脑筋，遇到坏人用智慧，遇到弱者伸援手。而最宝贵的，是永远保持一颗善良、勇敢、充满希望的心。有了这些，就没有克服不了的困难，就能成长为一个了不起的人，还能给世界带来光明和温暖。'

  id: 'yixiu_51',
  title: '【一休历险记】第五十一集：会说话的老树',
  category: '一休',
  content: '一休最喜欢在彩虹森林里散步。今天她走着走着，发现了一条从来没见过的小路。小路上铺满了金色的落叶，一直通向森林深处。\n\n"好奇怪的路，以前怎么没注意到呢？"一休好奇地沿着小路走了进去。\n\n走了一会儿，前面出现了一棵巨大无比的老树。这棵树比村子里最高的房子还高，树干粗得十个一休手拉手也围不过来。最奇怪的是，树干上有两个大洞和一条弯弯的裂缝，看起来就像一张脸——两只眼睛和一张嘴巴。\n\n一休正看着呢，那张"脸"突然动了！\n\n"小姑娘，你迷路了吗？"老树开口说话了，声音像打雷一样低沉。\n\n一休吓了一跳，往后退了几步。但她很快就不怕了，因为老树的声音虽然大，但听起来很温柔。\n\n"我没有迷路，我在探险！"一休挺起了小胸膛。\n\n老树哈哈笑了，树叶哗啦啦地抖："好久没有人敢走这条路了。小姑娘，我有一个忙想请你帮。"\n\n"什么忙？"\n\n"我的树根下面住着一窝小兔子，可是昨天一只大黑蛇钻到了我的根底下，小兔子们吓得不敢出来吃东西。我是树，没有手也没有脚，赶不走蛇。你能帮我想想办法吗？"\n\n一休蹲下来看了看树根下面。果然，黑暗的洞口里有一双闪着寒光的小眼睛——蛇正盘在里面。洞口旁边缩着几只瑟瑟发抖的小白兔。\n\n"嗯，让我想想办法。"一休托着下巴想了一会儿。\n\n她跑到旁边的草地上，找到了好几株薄荷草。一休把薄荷草揉碎了，凑到鼻子前闻了闻——好冲！然后她把揉碎的薄荷草堆在了蛇洞口。\n\n可是蛇没反应。薄荷味还不够浓。\n\n一休又想了想。她注意到旁边有一个小水塘。她跑过去，用手捧了好多水回来，把水浇到了薄荷草上。薄荷草被水一泡，味道更冲了，刺鼻的味道飘进了洞里。\n\n蛇在里面开始扭动——它受不了薄荷味。但它还是没出来，因为洞里比外面暖和。\n\n一休皱了皱眉头。不行，得让洞里比外面更不舒服。\n\n她又跑到远处，找到了一堆带刺的松果。一休把松果一颗一颗滚进了洞口——松果上的刺扎着蛇的身体，又有薄荷味呛着它的鼻子。\n\n"嘶——"蛇终于受不了了，它从洞里窜了出来，朝着远离大树的方向飞快地溜走了。\n\n小兔子们从角落里跳了出来，围着一休的脚蹦来蹦去，开心极了。\n\n"谢谢你，小姑娘！"老树的树叶沙沙响，像在鼓掌，"你真聪明。作为感谢，我告诉你一个秘密——这片森林里有七颗彩虹种子，集齐它们就能实现一个愿望。第一颗种子就在我的树冠上。"\n\n一休抬头看——树顶上果然有一颗发着红光的小种子。老树弯下一根树枝，把种子送到了一休手里。\n\n红色的种子温温的，像一颗小太阳。\n\n"其他六颗在哪里呢？"一休问。\n\n"在森林的各个角落。每一颗都有一个守护者，你需要帮助他们解决困难才能得到种子。"老树说，"不过路上会有危险。你……害怕吗？"\n\n一休把红色种子小心地放进口袋里，笑着说："我不怕！让我想想办法就好了。"\n\n老树满意地点了点头，树叶发出温柔的沙沙声，像在说："那就去吧，勇敢的小姑娘。"\n\n一休挥了挥手，沿着金色的小路继续往前走。第一颗彩虹种子已经到手了，接下来还有六颗在等着她。\n\n今天的冒险，才刚刚开始。'
},

  content: '一休沿着小路走了很久，来到了一条宽宽的大河边。河水清清的，能看到水底的石头和小鱼。河对面有一棵开满橙色花的大树——一休觉得第二颗种子可能就在那里。\n\n可是河上没有桥。河水看起来不深，但流得挺急的。\n\n一休正在想怎么过河，突然水面上冒出了一个大脑袋。那是一只巨大的乌龟，壳比桌子还大。\n\n"小姑娘，要过河吗？我可以驮你过去。"乌龟说。\n\n一休高兴极了，正要跳上去——等等。她想起了妈妈说过的话："太容易得到的东西，要多想一想。"\n\n一休看了看乌龟。乌龟的眼睛眨也不眨地盯着她，笑容看起来有点假。而且一休注意到——真正的乌龟壳是硬的，这只"乌龟"的壳上却长着水草，好像很久没动过。但是它刚才明明从水里冒出来了，怎么壳上会有生了根的水草呢？\n\n除非——它不是乌龟。\n\n一休假装很害怕地后退了几步："谢谢你，但是……你能先把头伸长一点让我看清你的脸吗？我有点怕生。"\n\n"乌龟"愣了一下，然后把脖子伸了出来——好长好长的脖子！比任何乌龟的脖子都长十倍。这哪是乌龟，分明是一只伪装成乌龟的大鳖精。\n\n"你不是乌龟！"一休指着它说。\n\n大鳖精见被识破了，一甩脖子，露出了嘴里尖尖的牙齿："哼，聪明的小丫头。那你就自己想办法过河吧，这条河是我的地盘！谁想过河都得从我肚子里过！"\n\n一休后退几步，看了看四周。河边有很多大石头和枯树枝。她注意到上游不远处，有一棵大树倒了一半，树干斜斜地伸向河面——如果再推一把，它就能倒到河中间。\n\n可是一休力气太小了，推不动大树。怎么办呢？\n\n一休看了看脚边的石头，又看了看那棵半倒的树。树根部已经松了，只有一点点泥土还连着。如果把树根下面的泥挖掉……\n\n一休捡起一块尖石头当铲子，跑到大树根部拼命挖。大鳖精在水里看着她，嘲笑道："你挖到明天也没用！"\n\n一休不理它，继续挖。挖了一会儿，泥土越来越松。但还差一点——树还是没倒。\n\n这时候一休又有了一个主意。她跑回河边，对大鳖精说："大鳖精先生，你力气一定很大吧？"\n\n"那当然！我是这条河里最有力气的！"大鳖精得意地说。\n\n"可我不信。你看那棵树，我打赌你撞不倒它。"一休指了指那棵半倒的树。\n\n"哈！就这？"大鳖精爬上岸，"看着！"它一头撞向了那棵已经被一休挖松了根的大树——\n\n"咔嚓——轰！"大树倒了！正好倒向河面，横跨两岸，变成了一座天然的桥。\n\n大鳖精愣住了："等等，你是不是故意的……"\n\n一休已经跳上了树干桥，飞快地跑向对岸。"谢谢你帮我架桥呀！"一休回头笑着喊。\n\n等大鳖精反应过来想追的时候，一休已经跳到了对岸，大树桥承受不了鳖精的重量，"咔嚓"断了，掉进了河里。\n\n大鳖精在河里气得拍水，一休在对岸朝它挥挥手，蹦蹦跳跳地走向了那棵开满橙色花的大树。\n\n树上果然挂着一颗发着橙光的彩虹种子。一休小心地把它摘下来放进口袋——两颗了！\n\n"让聪明的脑袋替代力气，"一休拍了拍口袋里两颗温暖的种子，"还有五颗，加油！"'

  title: '【一休历险记】第五十三集：迷雾里的歌声',
  category: '一休',
  content: '一休走进了森林更深处。这里的树又高又密，阳光几乎照不进来。走着走着，一团浓浓的白雾从地面升了起来，越来越浓，越来越浓——一休伸出手都看不见自己的手指了。\n\n"好大的雾啊……"一休有点紧张。她完全看不清路了。\n\n就在这时候，雾里传来了一阵好听的歌声。歌声轻柔甜美，像妈妈哼的摇篮曲。\n\n"跟着歌声走吧，那里一定有人。"一休心想。她循着歌声慢慢往前走。\n\n可是越走越不对劲——脚下的地面变得软绵绵的，像踩在棉花上。一休低头一看，她脚下是一片绿色的苔藓，苔藓下面好像是……泥潭！\n\n一休赶紧停住脚。她轻轻往后退了一步——鞋底"啪嗒"一声从烂泥里拔出来。好险！再往前一步就陷进去了。\n\n歌声还在前面响着，比刚才更好听了，像在说："来呀，来呀，再往前走一点点。"\n\n一休明白了——这歌声不是在帮她，是在骗她往泥潭里走！这一定是森林里的妖精在用歌声引诱路人掉进陷阱。\n\n"我才不上当。"一休蹲下来想办法。\n\n她摸了摸地面，用手指敲了敲——硬的地方敲起来"邦邦"响，软的地方敲起来"噗噗"闷响。一休捡起旁边的一根树枝，先在前面敲一敲，听声音判断地面是硬是软，然后再踩上去。\n\n就这样，一休一步一步地避开了泥潭，慢慢走出了危险区域。\n\n可是歌声还在响，而且一休发现——雾更浓了。歌声在她周围转来转去，好像在生气，因为一休没有掉进陷阱。\n\n"你出来！我知道你在故意骗人。"一休大声说。\n\n歌声停了。雾里出现了一个模糊的影子——是一只白色的小狐狸，长着三条尾巴。小狐狸看着一休，眼睛里全是惊讶。\n\n"你……你怎么没掉进去？"小狐狸问，"所有人听到我的歌声都会乖乖走过来的。"\n\n"因为我用脑子想了，不光用耳朵听。"一休说，"不过你为什么要骗人掉进泥潭呢？"\n\n小狐狸低下了头："我不是想害人……泥潭下面有一颗黄色的发光石头，我想让路人帮我捞出来。可是我说话没人信我（因为我是妖精），所以就用歌声引他们过来……但他们都掉进去就跑了。"\n\n"你想要的是这个吗？"一休想了想，"那颗黄色的发光石头？"\n\n"对！它是我妈妈的遗物，掉进泥潭里捞不出来了。"小狐狸的眼睛红了。\n\n一休看了看泥潭。直接走进去肯定会陷住。但如果用树枝从旁边的硬地面伸过去呢？\n\n一休找了一根最长的树枝，趴在泥潭边缘的硬地上，用树枝在泥潭里面搅动、拨拉。搅了好一会儿——"咔"，树枝碰到了一个硬东西。\n\n一休小心地用树枝把那个东西拨到了浅处，然后伸手够出来——果然是一颗发着黄色光芒的石头！\n\n"我的妈妈的石头！"小狐狸跳了起来，眼泪都掉了出来，"谢谢你谢谢你！"\n\n小狐狸捧着石头看了一会儿，然后把它举到一休面前："等等……这不是普通的石头。你看，它在发光——它是彩虹种子！我妈妈一直在守护它。"\n\n一休接过来一看——果然！和口袋里的红色、橙色种子一样，只不过这颗是黄色的。\n\n"这是我妈妈让我给\'勇敢又善良的人\'的。"小狐狸笑了，"你就是那个人。"\n\n一休把黄色种子放进口袋——三颗了。\n\n"对了，"小狐狸摇摇三条尾巴，雾渐渐散开了，"我把雾收了，给你让路。以后你在森林里如果遇到麻烦，叫三声\'小白\'，我会来帮你的。"\n\n"谢谢你，小白！"一休笑着和小狐狸挥手告别。\n\n雾散了，阳光洒进来，前面的路清清楚楚。一休拍了拍口袋里三颗温暖的种子，继续往前走去。'
},
{
  id: 'yixiu_54',
  title: '【一休历险记】第五十四集：石头巨人的谜语',
  category: '一休',
  content: '一休来到了一座小山前面。山不算高，但山路很窄，只能容一个人走过去。更麻烦的是——山路口站着一个巨人。\n\n不是真的巨人，是用石头堆成的巨人。它有三米高，身体是灰色的岩石拼成的，两只眼睛是两块亮晶晶的水晶。\n\n一休走近的时候，石头巨人突然动了。它低下巨大的脑袋，用石头摩擦的声音说："要过此山，先答我三个问题。答对了可以过，答错了……就得回头走远路。"\n\n"好啊，你问吧。"一休一点也不怕。\n\n石头巨人的第一个问题："什么东西越洗越脏？"\n\n一休想了想，笑了："水！水用来洗东西，东西干净了，水就变脏了。"\n\n石头巨人点了点头，眼睛里的水晶闪了一下："对了。第二个问题——什么东西有嘴不能说话，有床不能睡觉，有脚不能走路？"\n\n一休歪着脑袋想。有嘴不能说话……有床不能睡……有脚不能走……\n\n"河！"一休拍手说，"河有河嘴（入海口），有河床，有河脚（河的分支），但它不会说话不会睡觉也不会走路。"\n\n石头巨人又点了点头："聪明。最后一个问题——"它的声音变得严肃起来，"什么东西你看不见它，但它一直跟着你？"\n\n一休想了好久。看不见的东西……一直跟着自己……是影子吗？不对，影子看得见。是空气吗？也不对，空气不是"跟着"你。\n\n一休突然想起来了："是时间！时间看不见摸不着，但它一直一直跟着每个人，一秒都不停。"\n\n石头巨人愣了好一会儿。然后它慢慢弯下了身体——不是要攻击一休，而是在……鞠躬。\n\n"一百年来，你是第一个三道题全答对的人。"石头巨人的声音变得温和了很多，"小姑娘，你很了不起。"\n\n石头巨人伸出大手，手心里躺着一颗绿色的发光种子。"这是我守护了一百年的彩虹种子。送给你。"\n\n一休高兴地接过来——四颗了！\n\n石头巨人慢慢让开了路，然后它又开口了："小姑娘，前面的路会越来越难。但记住——真正的答案不一定在书本里，有时候在你的心里。"\n\n"谢谢你，石头巨人先生！"一休鞠了个躬，然后蹦蹦跳跳地从它身边跑过去，踏上了山路。\n\n走了几步一休回头看——石头巨人已经不动了，又变成了一堆普普通通的石头。如果不是手里多了一颗绿色种子，一休都会以为自己在做梦。\n\n"四颗了。"一休数了数口袋里的种子，"红色、橙色、黄色、绿色。还差三颗。"\n\n山路虽然窄，但一休走得很稳。阳光照在她身上，暖暖的。她知道，前面还有更有趣的冒险在等着她。'
},
{
  id: 'yixiu_55',
  title: '【一休历险记】第五十五集：暗洞里的萤火虫王',
  category: '一休',
  content: '翻过小山之后，一休发现前面的路被一座巨大的山洞挡住了。绕路要多走三天，而穿过山洞只需要半天。但山洞里面黑黑黑的，什么都看不见。\n\n"我不怕黑。"一休给自己打气。她在洞口捡了一根干树枝，想点一个火把。可是她没有打火石，也没有火柴。\n\n正发愁呢，洞口的石壁上飞来了一只小萤火虫，屁股上一闪一闪地发着绿光。\n\n"小萤火虫，你能帮我照路吗？"一休伸出手指。\n\n小萤火虫落在了一休的指尖上，可是一只萤火虫的光太微弱了，只能照亮巴掌大的地方。\n\n一休走进了山洞。小萤火虫在她指尖微微发光，只够看到脚前面一步的距离。一休慢慢走，一步一步小心翼翼。\n\n走了一会儿，一休听到了前面传来"叽叽叽"的声音——是蝙蝠！很多很多蝙蝠倒挂在洞顶上。它们被一休的脚步声惊动了，开始骚动起来。\n\n"哗——"一群蝙蝠突然飞了起来，扑打着翅膀朝一休冲来！蝙蝠虽然不咬人，但一大群扑过来还是很可怕。\n\n一休本能地蹲了下来。蝙蝠们从她头顶飞过——好险！但她的萤火虫朋友被蝙蝠的翅膀带起来的风吹跑了，绿光消失在了黑暗中。\n\n一休什么都看不见了。彻底的黑暗。\n\n"别怕别怕。"一休对自己说。她摸着洞壁慢慢走。手指沿着石壁一直摸，这样至少不会走到路中间掉进什么坑里。\n\n可是走着走着，一休的手碰到了一个奇怪的东西——黏黏的、软软的。一休"啊"了一声缩回手。\n\n黑暗中响起了一个很小很小的声音："别……别怕……我是蜗牛……"\n\n一休的心稳了下来："你怎么在这里？"\n\n"我迷路了……我进来找吃的，但蝙蝠把我吓住了，我就缩在壳里不敢动了……已经三天了……"蜗牛的声音越来越小。\n\n"别担心，我带你出去。"一休把蜗牛轻轻放在了自己肩膀上。\n\n可是问题来了——没有光，一休自己也不知道哪个方向是出口。\n\n一休站在原地想了想。洞穴有两个口——她进来的那个，和另一端的出口。出口那边应该有光线透进来。但现在一点光都没有，说明她还在洞的中间部分。\n\n那怎么判断方向呢？\n\n一休想到了一个办法——她蹲下来贴着地面感受风。洞穴两头通风的话，中间应该有微弱的气流。一休把手贴在地面，果然感觉到了一丝丝凉风——从前面吹来的。\n\n"有风的方向就是出口。"一休站起来，迎着风的方向走。\n\n走了好一阵子，前面突然出现了一丝微弱的光——是出口的光！一休加快了脚步。光越来越亮，越来越亮——\n\n"呼——"一休冲出了山洞，阳光洒了她一脸。好暖和！\n\n肩膀上的蜗牛也高兴地伸出了触角："太好了，终于出来了！"\n\n"谢谢你陪我走完黑暗的路。"一休笑着说。\n\n蜗牛说："不不不，是你救了我。作为感谢，我告诉你一个秘密。"蜗牛的壳上发出了淡淡的蓝光——壳里面竟然藏着一颗彩虹种子！蓝色的。\n\n"这是我一直背着的宝贝。可是找到能拥有它的人比宝贝本身更重要。"蜗牛说，"你在完全看不见的时候都没有放弃，还帮了我。你配得上这颗种子。"\n\n一休接过蓝色种子——五颗了！\n\n那只被蝙蝠吹跑的小萤火虫这时也飞了回来，落在一休肩上"叽叽"叫着，好像在说"对不起我刚才不见了"。\n\n一休拍了拍它说："没事，我们都很勇敢。走吧，继续冒险！"\n\n一人一虫一蜗牛，朝着阳光灿烂的前方走去。'
},

  id: 'yixiu_56',
  title: '【一休历险记】第五十六集：假公主和真怪兽',
  category: '一休',
  content: '一休走到了一片花田旁边。花田里开满了紫色的薰衣草，香香的。花田中间有一座小小的石头塔，塔顶有一面小旗子在风中飘。\n\n塔前面坐着一个穿着粉色裙子的女孩，比一休大一点。女孩正在哭。\n\n"你怎么了？"一休跑过去问。\n\n"我是这片花田的公主，"女孩抽泣着说，"有一只大怪兽住在花田下面，每天晚上都出来吃我的花。如果花被吃光了，我的魔法就会消失。你能帮我赶走怪兽吗？"\n\n"怪兽在哪里？"一休问。\n\n"就在那个洞里。"公主指着花田边缘的一个大黑洞，"可是它很大很凶，我不敢过去。"\n\n一休走到洞口看了看。洞很深，里面黑黑的，能听到很响的呼噜声——好像有什么大东西在里面睡觉。\n\n"我去看看。"一休拿起一根树枝，悄悄走进了洞口。\n\n洞里面有一只……大花猫？一休瞪大了眼睛。这根本不是什么怪兽，就是一只特别特别大的猫——大概是被什么魔法变大了。大花猫正在呼呼大睡，旁边还有吃剩的花瓣。\n\n一休退出来对"公主"说："那不是怪兽，是一只大猫。它只是吃了你的花而已。"\n\n公主的表情突然变了。她不哭了，笑容变得有点阴阴的："你确定只是一只大猫？"\n\n一休觉得不对劲了。她仔细看"公主"——公主的影子好像有点奇怪。人的影子应该跟人长得一样，可这个"公主"的影子……有尾巴！\n\n"你不是公主。"一休后退了一步。\n\n"公主"哈哈笑了起来，"噗"一声变回了原形——是一只灰色的大老鼠精！比一休还高。\n\n"聪明的小丫头，可惜发现得太晚了。"老鼠精说，"那只大猫是我变大的，就是为了引好奇的人走进洞里，然后我从后面把洞口堵住——嘿嘿嘿。"\n\n一休回头看——老鼠精真的在慢慢移动一块大石头，想堵住洞口！\n\n一休赶紧想办法。她不能让老鼠精堵住洞口，否则自己和大花猫都出不来了。\n\n"小白！小白！小白！"一休大声喊了三遍。\n\n远处的树林里传来了一声"嗖——"一道白影冲了过来——是小白！三尾小狐狸来了！\n\n小白看到了老鼠精，三条尾巴一竖，张嘴吐出了一团白色的迷雾，直接喷在了老鼠精脸上。\n\n"啊！我的眼睛！什么都看不见！"老鼠精丢下石头，抱着脸到处乱跑。\n\n一休趁机跑进洞里，用树枝在大花猫鼻子前面挠了挠——"阿嚏！"大花猫醒了。一休指着洞口说："那只老鼠把你变大了困在这里的，你不生气吗？"\n\n大花猫一看到外面正在乱跑的老鼠精——猫的本能发作了。\n\n"喵呜！！"大花猫从洞里冲了出去，一爪子拍在了老鼠精身上。老鼠精吓得魂飞魄散，变回了小老鼠的大小，"嗖"地钻进了地下逃跑了。\n\n大花猫追了一阵没追到，回来以后"噗"地缩回了正常猫的大小——老鼠精的魔法解除了。\n\n小花猫蹭了蹭一休的腿，喵喵叫着表示感谢。花田里的薰衣草在微风中轻轻摇摆，好像在庆祝胜利。\n\n一休在石塔底座里发现了一颗紫色的彩虹种子——老鼠精一直想得到它但拿不到，因为种子只有善良的人才能碰到。\n\n六颗了！还差最后一颗。\n\n小白摇着三条尾巴说："最后一颗种子在森林最深处的月亮湖。那里……很危险。"\n\n一休摸了摸口袋里六颗温暖的种子，深吸一口气："没关系。让我想想办法就好了。"'
},

  currentView: 'list', // list | reading | settings | addStory
  currentCategory: '家',
  currentStory: null,
  stories: [],
  favorites: new Set(),
  customStories: [],
  settings: {
    protagonistName: '小宝贝',
    voiceURI: '',
    speed: 0.85,
    pitch: 1.1,
    sleepTimer: 0
  },
  tts: {
    playing: false,
    paused: false,
    currentSentenceIndex: 0,
    sentences: [],
    utterance: null
  },
  sleepTimerEnd: null,
  sleepTimerInterval: null
};

// ==================== STORAGE ====================
function loadState() {
  try {
    const saved = localStorage.getItem('bedtime_stories_state');
    if (saved) {
      const data = JSON.parse(saved);
      if (data.settings) Object.assign(State.settings, data.settings);
      if (data.favorites) State.favorites = new Set(data.favorites);
      if (data.customStories) State.customStories = data.customStories;
    }
  } catch(e) { console.warn('Failed to load state', e); }
  State.stories = [...PRESET_STORIES, ...State.customStories];
}

function saveState() {
  try {
    localStorage.setItem('bedtime_stories_state', JSON.stringify({
      settings: State.settings,
      favorites: [...State.favorites],
      customStories: State.customStories
    }));
  } catch(e) { console.warn('Failed to save state', e); }
}

// ==================== HELPERS ====================
function replaceName(text) {
  const name = State.settings.protagonistName || '小宝贝';
  // 支持多种占位符格式：{主人公} ｛主人公｝ （主人公） [主人公] 【主人公】
  return text.replace(/[{｛\[【（(]主人公[}｝\]】）)]/g, name);
}

function splitSentences(text) {
  return text.split(/(?<=[。！？\n])/g).map(s => s.trim()).filter(s => s.length > 0);
}

// 清理文本中不需要朗读的符号
function cleanForTTS(text) {
  return text
    // 去除所有引号、括号、书名号
    .replace(/["""''『』「」《》【】〈〉（）(){}｛｝\[\]]/g, '')
    // 去掉破折号、省略号
    .replace(/[——…—]+/g, '')
    .replace(/\.{3,}/g, '')
    // 去掉感叹号、问号（不替换，直接删）
    .replace(/[！!？?]+/g, '')
    // 去掉冒号、分号等杂符号
    .replace(/[：:；;～~·•＊*＃#、]+/g, '')
    // 去掉句号（speechSynthesis会读"句号"）
    .replace(/[。]+/g, '，')
    // 多个逗号合并成一个
    .replace(/[，,]{2,}/g, '，')
    // 开头的逗号去掉
    .replace(/^，/, '')
    // 清理多余空格
    .replace(/\s+/g, '')
    .trim();
}

function getFilteredStories() {
  let stories = State.stories;
  if (State.currentCategory === '收藏') {
    stories = stories.filter(s => State.favorites.has(s.id));
  } else if (State.currentCategory !== '全部') {
    stories = stories.filter(s => s.category === State.currentCategory);
  }
  return stories;
}

// ==================== TTS ENGINE (浏览器 speechSynthesis) ====================

function stopTTS() {
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  State.tts.playing = false;
  State.tts.paused = false;
  State.tts.currentSentenceIndex = 0;
  State.tts.utterance = null;
  render();
}

function pauseTTS() {
  if (window.speechSynthesis && window.speechSynthesis.speaking) {
    window.speechSynthesis.pause();
    State.tts.paused = true;
    State.tts.playing = false;
    render();
  }
}

function resumeTTS() {
  if (State.tts.paused) {
    window.speechSynthesis.resume();
    State.tts.paused = false;
    State.tts.playing = true;
    render();
  }
}

// 智能选择最佳语音：优先 婷婷/Tingting zh-CN > 女声 zh-CN > 任意 zh-CN > 女声 zh > 任意 zh
function pickBestVoice(voices) {
  if (!voices || !voices.length) return null;
  const femaleNames = ['tingting','ting-ting','婷婷','xiaoxiao','晓晓','xiaoyi','meijia','美佳','sinji','yaoyao','yue','huihui','慧慧','nvshi','female','woman','女'];
  const isFemale = v => femaleNames.some(n => v.name.toLowerCase().includes(n));
  const isZhCN = v => v.lang === 'zh-CN' || v.lang.replace('_','-').toLowerCase() === 'zh-cn';
  const isZh = v => v.lang.toLowerCase().startsWith('zh');
  // 1. 婷婷/Tingting 且 zh-CN
  let v = voices.find(x => isZhCN(x) && (x.name.toLowerCase().includes('tingting') || x.name.toLowerCase().includes('ting-ting') || x.name.includes('婷婷')));
  if (v) return v;
  // 2. 任意名字含婷婷/tingting（不限地区，但排除繁体粤语）
  v = voices.find(x => (x.name.toLowerCase().includes('tingting') || x.name.includes('婷婷')) && !x.lang.toLowerCase().includes('hk') && !x.lang.toLowerCase().includes('tw'));
  if (v) return v;
  // 3. 女声 且 zh-CN
  v = voices.find(x => isZhCN(x) && isFemale(x));
  if (v) return v;
  // 4. 任意 zh-CN
  v = voices.find(x => isZhCN(x));
  if (v) return v;
  // 5. 女声 且 zh（简体优先，避开繁体）
  v = voices.find(x => isZh(x) && isFemale(x) && !x.lang.toLowerCase().includes('hk') && !x.lang.toLowerCase().includes('tw'));
  if (v) return v;
  // 6. 任意简体中文（避开繁体/粤语）
  v = voices.find(x => isZh(x) && !x.lang.toLowerCase().includes('hk') && !x.lang.toLowerCase().includes('tw'));
  if (v) return v;
  // 7. 任意中文
  v = voices.find(x => isZh(x));
  if (v) return v;
  return null;
}

function speakFromIndex(index) {
  if (index >= State.tts.sentences.length) {
    playNextStory();
    return;
  }
  State.tts.currentSentenceIndex = index;
  State.tts.playing = true;
  State.tts.paused = false;

  const text = cleanForTTS(State.tts.sentences[index]);
  if (!text) { speakFromIndex(index + 1); return; }

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.rate = State.settings.speed;
  utterance.pitch = 1.1;
  utterance.lang = 'zh-CN';

  const voices = window.speechSynthesis.getVoices();
  if (State.settings.voiceURI) {
    const selectedVoice = voices.find(v => v.voiceURI === State.settings.voiceURI);
    if (selectedVoice) utterance.voice = selectedVoice;
    else { const best = pickBestVoice(voices); if (best) utterance.voice = best; }
  } else {
    const best = pickBestVoice(voices);
    if (best) utterance.voice = best;
  }

  if (State.sleepTimerEnd) {
    const remaining = (State.sleepTimerEnd - Date.now()) / 1000;
    if (remaining <= 0) { stopTTS(); clearSleepTimer(); return; }
    if (remaining <= 30) { utterance.volume = Math.max(0.1, remaining / 30); }
  }

  utterance.onend = () => { if (State.tts.playing) speakFromIndex(index + 1); };
  utterance.onerror = (e) => { if (e.error !== 'canceled' && State.tts.playing) speakFromIndex(index + 1); };

  State.tts.utterance = utterance;
  window.speechSynthesis.speak(utterance);
  render();
}

function playTTS() {
  if (State.tts.paused) {
    resumeTTS();
    return;
  }
  if (!State.currentStory) return;
  const title = replaceName(State.currentStory.title);
  const content = replaceName(State.currentStory.content);
  State.tts.sentences = [title + '。', ...splitSentences(content)];
  speakFromIndex(0);
}

// ==================== SLEEP TIMER ====================
function startSleepTimer(minutes) {
  clearSleepTimer();
  if (minutes <= 0) return;
  State.sleepTimerEnd = Date.now() + minutes * 60 * 1000;
  State.sleepTimerInterval = setInterval(() => {
    if (State.sleepTimerEnd && Date.now() >= State.sleepTimerEnd) {
      stopTTS();
      clearSleepTimer();
    }
    render();
  }, 1000);
}

function clearSleepTimer() {
  if (State.sleepTimerInterval) {
    clearInterval(State.sleepTimerInterval);
    State.sleepTimerInterval = null;
  }
  State.sleepTimerEnd = null;
}

// ==================== RENDER ====================
function render() {
  const app = document.getElementById('app');
  if (State.currentView === 'list') {
    app.innerHTML = renderListView();
  } else if (State.currentView === 'reading') {
    app.innerHTML = renderReadingView();
  }
  // Modals render on top
  if (State.currentView === 'settings') {
    app.innerHTML = renderListView() + renderSettingsModal();
  } else if (State.currentView === 'addStory') {
    app.innerHTML = renderListView() + renderAddStoryModal();
  }
}

function renderStoryCard(story) {
  const title = replaceName(story.title);
  const preview = replaceName(story.content).substring(0, 60) + '...';
  const isFav = State.favorites.has(story.id);
  return `
    <div class="story-card" onclick="openStory('${story.id}')">
      <div class="story-card-header">
        <span class="story-title">${title}</span>
        <div class="story-card-actions">
          <button class="copy-icon-btn" onclick="event.stopPropagation();copySingleStory('${story.id}')" title="复制">📋</button>
          <button class="fav-btn ${isFav ? 'active' : ''}" onclick="event.stopPropagation();toggleFav('${story.id}')">
            ${isFav ? '★' : '☆'}
          </button>
        </div>
      </div>
      <div class="story-meta">
        <span class="category-tag">${story.category}</span>
      </div>
      <p class="story-preview">${preview}</p>

}

function openStory(id) {
  State.currentStory = State.stories.find(s => s.id === id);
  State.currentView = 'reading';
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  State.tts.playing = false;
  State.tts.paused = false;
  State.tts.currentSentenceIndex = 0;
  State.tts.utterance = null;
  render();
  // 进入故事后自动开始播放
  setTimeout(() => { playTTS(); }, 300);
}

// 播放同分类的下一个故事
function playNextStory() {
  if (!State.currentStory) { stopTTS(); return; }
  const sameCategoryStories = State.stories.filter(s => s.category === State.currentStory.category);
  const currentIndex = sameCategoryStories.findIndex(s => s.id === State.currentStory.id);
  if (currentIndex >= 0 && currentIndex < sameCategoryStories.length - 1) {
    const nextStory = sameCategoryStories[currentIndex + 1];
    State.currentStory = nextStory;
    State.tts.playing = false;
    State.tts.paused = false;
    State.tts.currentSentenceIndex = 0;
    State.tts.utterance = null;
    render();
    setTimeout(() => { playTTS(); }, 300);
  } else {
    stopTTS();
  }
}

// 复制本分类全部故事
function copyAllStories() {
  const stories = getFilteredStories();
  const text = stories.map(s => {
    const title = replaceName(s.title);
    const content = replaceName(s.content);
    return title + '\n\n' + content;
  }).join('\n\n────────────────\n\n');
  navigator.clipboard.writeText(text).then(() => {
    alert('已复制 ' + stories.length + ' 个故事到剪贴板');
  }).catch(() => {
    // fallback for older browsers
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert('已复制 ' + stories.length + ' 个故事到剪贴板');
  });
}

// 复制单个故事
function copySingleStory(id) {
  const story = State.stories.find(s => s.id === id);
  if (!story) return;
  const title = replaceName(story.title);
  const content = replaceName(story.content);
  const text = title + '\n\n' + content;
  navigator.clipboard.writeText(text).then(() => {
    alert('已复制：' + title);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert('已复制：' + title);
  });
}

function toggleFav(id) {
  if (State.favorites.has(id)) {
    State.favorites.delete(id);
  } else {
    State.favorites.add(id);
  }
  saveState();
  render();
}

// ==================== READING VIEW ====================
function renderReadingView() {
  if (!State.currentStory) return '';
  const title = replaceName(State.currentStory.title);
  const content = replaceName(State.currentStory.content);
  const contentSentences = splitSentences(content);
  const allSentences = [title + '。', ...contentSentences];
  const progress = State.tts.playing || State.tts.paused 
    ? Math.round((State.tts.currentSentenceIndex / allSentences.length) * 100) 
    : 0;

  let timerDisplay = '';
  if (State.sleepTimerEnd) {
    const remaining = Math.max(0, Math.ceil((State.sleepTimerEnd - Date.now()) / 1000));
    const mins = Math.floor(remaining / 60);

    timerDisplay = `<span class="timer-display">⏱ ${mins}:${secs.toString().padStart(2,'0')}</span>`;
  }

  return `
    <div class="page reading-page">
      <header class="header">
        <button class="icon-btn" onclick="goBack()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <h1 class="header-title reading-title">${title}</h1>
        <div style="width:40px"></div>
      </header>
      <div class="reading-content" id="reading-content">
        ${allSentences.map((s, i) => `
          <span class="sentence ${i === 0 ? 'story-title-sentence' : ''} ${i === State.tts.currentSentenceIndex && (State.tts.playing || State.tts.paused) ? 'highlight' : ''}"

      <div class="control-bar">
        ${timerDisplay}
        <div class="progress-bar">
          <div class="progress-fill" style="width:${progress}%"></div>
        </div>
        <div class="controls">
          <button class="ctrl-btn play-btn" onclick="${State.tts.playing ? 'pauseTTS()' : 'playTTS()'}">
            ${State.tts.playing 
              ? '<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>'
              : '<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>'
            }
          </button>
        </div>
      </div>
    </div>
  `;
}

function goBack() {
  stopTTS();
  State.currentView = 'list';
  State.currentStory = null;
  render();
}

function jumpToSentence(index) {
  stopTTS();
  const title = replaceName(State.currentStory.title);
  const content = replaceName(State.currentStory.content);
  State.tts.sentences = [title + '。', ...splitSentences(content)];
  speakFromIndex(index);
}

function cycleSpeed() {
  const speeds = [0.5, 0.6, 0.7, 0.75, 0.85, 1.0, 1.2, 1.5, 2.0];
  const idx = speeds.indexOf(State.settings.speed);
  State.settings.speed = speeds[(idx + 1) % speeds.length];
  saveState();
  render();
}

// ==================== SETTINGS MODAL ====================
function renderSettingsModal() {
  const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  const zhVoices = voices.filter(v => v.lang.startsWith('zh') || v.name.includes('Chinese') || v.name.includes('中文'));
  let allVoices = zhVoices.length > 0 ? zhVoices : voices;
  // 排序：zh-CN 排最前，其中含"婷婷/Tingting"的排第一
  allVoices = allVoices.slice().sort((a, b) => {
    const score = v => {
      let s = 0;
      const n = v.name.toLowerCase();
      if (v.lang === 'zh-CN' || v.lang.replace('_','-').toLowerCase() === 'zh-cn') s += 100;
      if (n.includes('tingting') || v.name.includes('婷婷')) s += 50;
      if (n.includes('hk') || n.includes('tw') || v.lang.toLowerCase().includes('hk') || v.lang.toLowerCase().includes('tw')) s -= 30;
      return s;
    };
    return score(b) - score(a);
  });
  const recommended = pickBestVoice(voices);

  return `
    <div class="modal-overlay" onclick="closeModal(event)">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
          <h2>设置</h2>
          <button class="icon-btn" onclick="State.currentView='list';render()">✕</button>
        </div>
        <div class="modal-body">
          <div class="setting-group">
            <label>主人公名字</label>
            <input type="text" class="setting-input" value="${State.settings.protagonistName}" 
                   onchange="State.settings.protagonistName=this.value;saveState();render()" 
                   placeholder="输入名字">
          </div>
          <div class="setting-group">
            <label>语音选择</label>
            <select class="setting-input" onchange="State.settings.voiceURI=this.value;saveState()">
              <option value="">自动选择（推荐）${recommended ? '：' + recommended.name : ''}</option>
              ${allVoices.map(v => `
                <option value="${v.voiceURI}" ${State.settings.voiceURI === v.voiceURI ? 'selected' : ''}>
                  ${(recommended && v.voiceURI === recommended.voiceURI) ? '⭐ ' : ''}${v.name} (${v.lang})
                </option>
              `).join('')}
            </select>
            <div style="font-size:11px;color:var(--text-dim);margin-top:4px;">共${voices.length}个语音，中文${zhVoices.length}个。⭐为自动推荐的女声</div>
          </div>
          <div class="setting-group">
            <label>语速: ${State.settings.speed.toFixed(2)}x</label>
            <input type="range" min="0.5" max="2.0" step="0.05" value="${State.settings.speed}"
                   oninput="State.settings.speed=parseFloat(this.value);saveState();render()">
          </div>
          <div class="setting-group">
            <label>睡眠定时</label>
            <div class="timer-options">
              ${[0,15,30,45,60].map(m => `
                <button class="chip ${State.settings.sleepTimer === m ? 'active' : ''}"
                        onclick="State.settings.sleepTimer=${m};saveState();${m > 0 ? `startSleepTimer(${m})` : 'clearSleepTimer()'};render()">
                  ${m === 0 ? '关闭' : m + '分钟'}
                </button>
              `).join('')}
            </div>
          </div>
          <div class="setting-group">
            <label>小工具</label>
            <button class="chip" style="width:100%;padding:12px;font-size:14px;"
                    onclick="openWatermarkTool()">🖼️ 图片去水印</button>
            <div style="font-size:11px;color:var(--text-dim);margin-top:4px;">豆包 / Gemini / 千问 生成的图会自动识别一键去除；其他水印手动涂抹。全部在本地处理，不上传</div>
          </div>
        </div>
      </div>
    </div>
  `;
}

function openWatermarkTool() {
  location.href = 'watermark.html';
}

function closeModal(e) {
  if (e.target.classList.contains('modal-overlay')) {
    State.currentView = 'list';
    render();
  }
}

// ==================== ADD STORY MODAL ====================
function renderAddStoryModal() {
  return `
    <div class="modal-overlay" onclick="closeModal(event)">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
          <h2>添加故事</h2>
          <button class="icon-btn" onclick="State.currentView='list';render()">✕</button>
        </div>
        <div class="modal-body">
          <div class="setting-group">
            <label>故事标题</label>
            <input type="text" class="setting-input" id="new-title" placeholder="例如：{主人公}的新朋友">
          </div>
          <div class="setting-group">
            <label>分类</label>
            <select class="setting-input" id="new-category">
              <option value="童话">童话</option>
              <option value="动物">动物</option>
              <option value="冒险">冒险</option>
              <option value="科学">科学</option>
              <option value="温馨">温馨</option>
              <option value="成语">成语</option>
              <option value="恐龙">恐龙</option>
              <option value="历险">历险</option>
              <option value="成长">成长</option>
            </select>
          </div>
          <div class="setting-group">
            <label>故事内容 <span class="hint">（使用 {主人公} 作为主人公占位符）</span></label>
            <textarea class="setting-input story-textarea" id="new-content" rows="8" 
                      placeholder="从前有一个..."></textarea>
          </div>
          <button class="primary-btn" onclick="addNewStory()">保存故事</button>
        </div>
      </div>
    </div>
  `;
}

function addNewStory() {
  const title = document.getElementById('new-title').value.trim();
  const category = document.getElementById('new-category').value;
  const content = document.getElementById('new-content').value.trim();
  
  if (!title || !content) {
    alert('请填写标题和内容');
    return;
  }
  
  const newStory = {
    id: 'custom_' + Date.now(),
    title: title,
    category: category,
    content: content
  };
  
  State.customStories.push(newStory);
  State.stories = [...PRESET_STORIES, ...State.customStories];
  saveState();
  State.currentView = 'list';
  render();
}

// ==================== INIT ====================
loadState();
render();

// Safari加载语音列表是异步的，需要监听
if (window.speechSynthesis) {

}
