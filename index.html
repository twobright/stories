  title: '【调皮鬼正正】第一百三十三集：把虫子放进女同学书包',
  category: '成长',
  content: '早上来幼儿园的路上，正正在花坛边发现了一条绿色的毛毛虫。毛毛虫软软的，一拱一拱地爬。\n\n"好玩！"正正把毛毛虫捏起来装进了口袋里。\n\n到了教室，正正一直憋着坏笑。他趁小美去上厕所的时候，偷偷把毛毛虫放进了小美的书包里。\n\n然后他假装什么都没发生，坐在自己的位子上等着看好戏。\n\n第二节课，李老师让大家拿出画画本。小美打开书包——\n\n"啊啊啊啊啊！！虫子！！有虫子！！"\n\n小美吓得把书包扔到了地上，哭着跳到了椅子上。旁边的小朋友也吓得尖叫。教室里一片混乱。\n\n正正在后面笑得肚子疼。\n\n可是他没注意到——毛毛虫从书包里爬出来了，正好爬到了正正的脚边。"嗯？"正正低头一看，毛毛虫正往他裤腿里爬！\n\n"啊啊啊——！！"正正也尖叫了起来，蹦起来拼命甩腿。\n\n全班都看着正正又蹦又跳的样子。李老师把毛毛虫拿走了，然后看着正正说："虫子是你放进去的吧？"\n\n正正不说话了。小美还在哭。\n\n"正正，你自己被虫子爬了也很害怕对不对？那你想想小美刚才多害怕。你把快乐建立在别人的恐惧上，这对吗？"李老师的话轻轻的但很有分量。\n\n正正摇了摇头。\n\n放学妈妈来了。这次李老师当面说的。妈妈脸上笑容消失了。\n\n车上妈妈一句话没说。正正知道，妈妈不说话比说话更可怕。\n\n到家后——"啪！"\n\n"虫子放人家书包里！你是男子汉吗？欺负女同学算什么本事！"\n\n"妈妈我错了，我以后不吓唬人了……"\n\n"明天当面给小美道歉。如果再有一次，一个星期不许看动画片。"\n\n正正认真地点了点头。这次他是真的后悔了——因为虫子爬自己身上的感觉，确实太吓人了。'
},
{
  id: 'zhengzheng_134',
  title: '【调皮鬼正正】第一百三十四集：滑梯上的"国王"',
  category: '成长',
  content: '幼儿园的大滑梯是小朋友们最喜欢的地方。每到户外活动时间，大家都排着队等着滑。\n\n可是今天，正正爬到了滑梯最上面，一屁股坐在那里不肯滑下去。\n\n"我是国王！这是我的城堡！谁都不许上来！"正正双手叉腰，得意极了。\n\n后面排队的小朋友急了："正正你快滑呀！我们也要玩！"\n\n"不行！国王说了不准。哈哈哈！"正正就是不动。\n\n小朋友们在下面干着急。有的都快哭了——户外时间就半个小时，正正占着滑梯，别人一次都玩不到。\n\n李老师走了过来："正正，下来。"\n\n"我是国王，国王不用听话！"正正嬉皮笑脸。\n\n李老师的脸严肃了："正正，我数三下。一、二……"\n\n正正知道数到三就麻烦了。他磨磨蹭蹭地滑了下来。\n\n"过来站好。"李老师把正正叫到一边。"滑梯是大家的，不是你一个人的。你霸占了滑梯，其他二十个小朋友都玩不到，你觉得公平吗？"\n\n正正不说话，低着头踢地上的小石子。\n\n"从现在开始到放学，你不能玩任何户外设施。看着别人玩。"\n\n正正的眼泪在眼眶里转。他只能站在旁边看着别的小朋友开心地滑滑梯、荡秋千。好羡慕啊。\n\n放学后妈妈知道了这件事，回家后也很生气。\n\n"你一个人霸着不让别人玩，这叫自私！你愿意别人也这样对你吗？"\n\n"不愿意……"\n\n"啪！"屁股又红了。\n\n"记住，好东西要一起分享。你想当国王可以在家里当，但不能欺负小朋友。懂了吗？"\n\n"懂了……呜呜呜……"\n\n第二天，正正乖乖排队等滑梯。轮到他的时候他很快滑下来，让后面的小朋友也能玩。\n\n李老师看到了，朝他竖了个大拇指。正正虽然没说话，但心里好开心——原来遵守规则也能得到表扬。'
},
{
  id: 'zhengzheng_135',
  title: '【调皮鬼正正】第一百三十五集：厕所里的泡泡',
  category: '成长',
  content: '正正上厕所的时候发现洗手液的瓶子可以挤出好多泡泡。他按了一下——"噗"，好大一坨白泡泡。\n\n正正的眼睛亮了。他开始疯狂地按洗手液——噗、噗、噗、噗噗噗！泡泡越来越多，水池里全是白花花的泡沫，溢出来流到了地上。\n\n正正还觉得不够。他把泡泡抹在了镜子上，在镜子上画了一个大鬼脸。然后又把泡泡涂在了门把手上——滑溜溜的，谁一开门手就打滑。\n\n正正干完坏事洗了个手就出去了，心里偷偷乐。\n\n过了一会儿，乐乐去上厕所。一开门——手一滑，脚又踩到了地上的泡泡水，"哗！"整个人滑倒在地上。\n\n"哇——"乐乐疼得大哭。\n\n李老师赶紧跑过来把乐乐扶起来。乐乐的胳膊肘蹭破了皮，流了一点血。\n\n李老师看了看厕所里的泡泡，镜子上的鬼脸——不用猜就知道是谁干的。\n\n"正正！过来！"\n\n正正知道这次闯大祸了。他看到乐乐的胳膊上贴了创可贴，心里有点慌。\n\n"乐乐摔伤了。是因为你把泡泡弄到了地上。"李老师很严肃，"这不是好玩的事，这是危险的事。如果乐乐摔的是脑袋怎么办？"\n\n正正张了张嘴，说不出话来。他……真的没想到会有人摔倒受伤。\n\n李老师让正正把厕所打扫干净。正正拿着拖把拖了好久好久，把地上的泡泡水全部擦干净了。\n\n放学后，妈妈看到老师的微信消息——照片里是乐乐受伤的胳膊。\n\n妈妈回到家二话不说——"啪！啪！啪！"这次是三下。\n\n"你闹出来的事害人家小朋友受伤了！你觉得好玩是不是？乐乐疼不疼？人家妈妈心不心疼？"\n\n正正哭得上气不接下气："我没想到会摔倒……我以后不玩洗手液了……"\n\n"明天给乐乐道歉，带上你的奥特曼贴纸送给他。"\n\n正正含着眼泪点头。他最喜欢的奥特曼贴纸要送出去了，可是想到乐乐的伤……正正觉得自己确实应该。'
},
{
  id: 'zhengzheng_136',
  title: '【调皮鬼正正】第一百三十六集：抢了别人的玩具',
  category: '成长',
  content: '今天是"带玩具来幼儿园"的日子。每个小朋友可以从家里带一个最喜欢的玩具来分享。\n\n小胖带了一辆超酷的遥控赛车——红色的，会发光，还会"滴滴"响。正正看到了，眼睛都直了。\n\n"小胖，让我玩一下。"\n\n"等我玩完了再给你。"小胖正玩得开心。\n\n可是正正等不及了。趁小胖去喝水的时候，正正一把抢过了遥控器，操控着赛车到处跑。\n\n"那是我的！还给我！"小胖回来发现车被抢了，追着正正跑。\n\n正正一边跑一边玩遥控器，赛车在地上"嗖嗖"地开。他一个不注意——遥控车撞到了桌子腿上，"咔嚓"——车头掉了一块。\n\n小胖看到自己心爱的赛车坏了，"哇——"大哭起来。那是爸爸送他的生日礼物。\n\n正正愣住了。他低头看着坏掉的赛车，手里还握着遥控器。\n\n李老师走过来，看了看地上的车，又看了看正正。她没有大声批评，而是把正正拉到一边，蹲下来轻轻说：\n\n"正正，那辆车是小胖的宝贝，就像你的奥特曼一样重要。如果别人抢了你的奥特曼还弄坏了，你什么感觉？"\n\n正正想了想自己心爱的奥特曼如果被别人摔坏了……他的鼻子一酸。\n\n"我……我不应该抢的。"\n\n"去跟小胖说对不起。"\n\n正正走到还在哭的小胖面前："对不起小胖……我不该抢你的车。"\n\n放学后妈妈知道了，很生气："人家的东西你抢，还弄坏了！"\n\n"啪！"\n\n"妈妈给你买了那么多玩具，你为什么还要抢别人的？"\n\n"我……我就是觉得他的好看……"\n\n"觉得好看就可以抢吗？想玩就好好说，人家不给你就等着。别人的东西，没有允许不能动！听到了吗？"\n\n"听到了……"\n\n周末，妈妈带着正正去玩具店，让正正用自己的零花钱买了一辆新遥控车。星期一，正正把新车送给了小胖。\n\n"这个送你，赔你的车。"正正红着脸说。\n\n小胖开心极了，他们又变回了好朋友。正正心里想：想玩别人的东西，以后好好说，借着玩就行了，干嘛要抢呢。'
},
{
  id: 'zhengzheng_137',
  title: '【调皮鬼正正】第一百三十七集：给老师起外号',
  category: '成长',
  content: '李老师今天戴了一副新眼镜，圆圆的，大大的。正正觉得好好笑——李老师戴上眼镜像猫头鹰。\n\n下课的时候，正正跟几个小朋友小声说："你们看，李老师像不像猫头鹰？以后我们叫她\'猫头鹰老师\'！哈哈哈！"\n\n几个小男生跟着笑了起来。\n\n午饭的时候，正正故意大声对旁边的人说："猫头鹰老师今天做的手工好难啊。"说完哈哈笑。\n\n旁边的小朋友也笑了。\n\n李老师听到了。她没有生气，但是她放下了筷子，安静地看了正正一眼。\n\n下午放学前，李老师把正正单独留了下来。\n\n"正正，你今天叫我什么？"\n\n正正低下了头："猫头鹰……老师……"\n\n"你觉得好笑对不对？"李老师的声音很平静，"如果有人给你起个外号，天天叫你，你开心吗？"\n\n正正想了想。之前有人叫他"正正歪歪"他就很生气。\n\n"不……不开心。"\n\n"每个人都不喜欢被叫外号。老师也是人，老师也有感受。你让其他小朋友都跟着叫，老师心里其实很难过。"\n\n正正抬头看了一眼李老师——她的眼睛有一点点红。正正第一次意识到，老师也会难过。\n\n"对不起李老师……我不该给你起外号。"\n\n李老师摸了摸正正的头："知道错了就好。以后叫人要用正式的名字，这是尊重。"\n\n回家后正正自己跟妈妈说了这件事。妈妈没有打他，但是很认真地说：\n\n"正正，你知道为什么妈妈给你取名叫\'正正\'吗？就是希望你做一个堂堂正正的人。堂堂正正的人，不在背后取笑别人。"\n\n正正点了点头，虽然这次屁股没挨打，但妈妈说的话让他心里比挨打还不好受。\n\n第二天，正正进教室后走到李老师面前，大声说："李老师早上好！你今天的眼镜很好看！"\n\n李老师笑了，弯下腰亲了一下正正的额头。'
},
{
  id: 'zhengzheng_138',
  title: '【调皮鬼正正】第一百三十八集：把小椅子当战车',
  category: '成长',
  content: '今天下雨了，不能出去玩。小朋友们在教室里自由活动。\n\n正正闲不住啊。他把自己的小椅子翻过来，四条腿朝上，然后坐在椅子背上——"我是坦克兵！冲啊！"\n\n正正用脚蹬着地面，让翻过来的椅子在教室里滑来滑去。"突突突——！开炮！"\n\n旁边几个小男生看了觉得好玩，也翻了椅子跟着滑。教室里"哗啦哗啦"的，椅子到处乱跑。\n\n"撞上了！哈哈哈！"正正的"坦克"撞到了另一个小朋友的"坦克"。\n\n可是接下来——正正的椅子撞到了角落的书架。"哗啦——！"书架上的绘本和积木盒子全掉了下来，散了一地。一盒积木"噼里啪啦"撒了满教室。\n\n更糟糕的是，有一块积木弹起来打到了坐在旁边安静看书的小雨脸上。小雨"哇"地哭了，脸上红了一块。\n\n李老师飞快地跑过来。她先检查了小雨的脸，然后转向正正。\n\n"所有人！把椅子放好！"李老师第一次提高了声音。\n\n教室里瞬间安静了。所有小男生乖乖把椅子翻回来放好。\n\n"正正，你带的头对不对？"\n\n正正点了点头。\n\n"椅子是坐的，不是当玩具的。教室是学习的地方，不是赛车场。你看看，书架倒了，积木撒了，小雨还被打到了脸。"\n\n正正看了看地上的一片狼藉，又看了看小雨脸上的红印子，不说话了。\n\n"你来收拾。所有掉下来的书和积木，你一个人收拾干净。"\n\n正正蹲在地上捡了半个多小时，捡得腰都酸了。积木一颗一颗捡回盒子里，书一本一本放回书架。\n\n放学后妈妈听说了。\n\n"在教室里开坦克？你是去上幼儿园还是去打仗？"\n\n"啪！"\n\n"还把人家小朋友脸打了！你看看你一天天的！"\n\n"啪！"\n\n正正哭着认错。那天晚上他的屁股是双倍疼——挨了两巴掌。\n\n可是正正也记住了：教室里不能闹，因为空间小人多，一闹就容易伤到别人。'
},
{
  id: 'zhengzheng_139',
  title: '【调皮鬼正正】第一百三十九集：不吃蔬菜的正正',
  category: '成长',
  content: '幼儿园的午餐时间到了。今天的菜是：米饭、红烧肉、炒西蓝花、还有紫菜蛋花汤。\n\n正正看到了红烧肉开心得不得了，可是一看到绿绿的西蓝花就皱起了眉头。\n\n"我不要吃这个绿色的树！"正正把西蓝花全部扒到了一边。\n\n李老师走过来："正正，蔬菜也要吃哦，不能只吃肉。"\n\n"不要！难吃！"正正把嘴巴闭得紧紧的。\n\n李老师没有强迫他，说了一句："那好吧，不吃也行。但是下午的小饼干，只有吃了蔬菜的小朋友才能吃。"\n\n正正才不在乎呢。他把红烧肉和米饭吃得干干净净，西蓝花一口没动。\n\n可是下午三点钟——小饼干来了。巧克力味的！正正最爱的！\n\n李老师给每个小朋友发饼干。走到正正面前，停住了："正正，你中午的蔬菜吃了吗？"\n\n正正的脸红了。他摇了摇头。\n\n"那今天没有饼干哦。说好的规则。"\n\n正正看着别的小朋友都在"嘎吱嘎吱"吃饼干，巧克力的香味飘过来。他的口水都快流下来了。可是没有他的份。\n\n正正气鼓鼓的，眼泪差点掉下来。但他知道规则就是规则。\n\n放学后正正闷闷不乐地回了家。妈妈问他今天幼儿园怎么样。\n\n"我没吃到饼干……因为我没吃蔬菜。"正正小声说。\n\n妈妈没有打他，而是说："那今晚我做西蓝花，你要不要试试？妈妈有一个让西蓝花变好吃的魔法。"\n\n晚上妈妈把西蓝花用蒜蓉炒了，还撒了一点点肉松。正正试着吃了一口——"咦？没有那么难吃嘛！"\n\n他又吃了一口。再一口。最后把一整盘都吃完了。\n\n"明天到幼儿园也要吃蔬菜哦。"妈妈说。\n\n"嗯！这样我就能吃到饼干了！"\n\n第二天中午，正正主动把蔬菜吃了。虽然没有妈妈做的好吃，但是忍一忍也吃完了。下午他终于拿到了巧克力饼干——那块饼干，正正觉得比以前吃过的任何一块都香。'
},
{
  id: 'zhengzheng_140',
  title: '【调皮鬼正正】第一百四十集：往楼下吐口水',
  category: '成长',
  content: '幼儿园的教室在二楼。正正趴在走廊的栏杆上往下看——下面是一楼的操场，有几个小班的小朋友正在做操。\n\n正正的脑子又冒出了坏主意。他"呸——"朝下面吐了一口口水。\n\n口水落在了一楼的地面上。没打到人。正正觉得好刺激，又吐了一口。\n\n这次——口水"啪嗒"正好落在了一个小班小朋友的头顶上。\n\n那个小朋友摸了摸头："什么东西？"抬头一看，正正在二楼朝下面嘻嘻笑。\n\n"老师！楼上有人吐口水！"小班的老师抬头看到了正正。\n\n五分钟后李老师把正正拎到了办公室。\n\n"正正，你在做什么？！"这是李老师第一次真的发了火。\n\n正正缩着脖子不敢说话。\n\n"从楼上往下吐口水！如果是石头呢？如果砸到小朋友的眼睛呢？高空抛物有多危险你知道吗？而且——"李老师深吸了一口气，"吐口水到别人身上，这是非常非常不尊重人的行为。你愿意别人往你头上吐口水吗？"\n\n"不……不愿意……"正正低着头，声音像蚊子一样小。\n\n"这件事非常严重。我要告诉你妈妈，你也要去给小班那个小朋友道歉。"\n\n正正被带到一楼，对着那个小朋友鞠了一个九十度的躬："对不起，我不该吐口水，我错了。"\n\n那个小朋友还太小不太懂，只是瞪着大眼睛看着正正。\n\n放学后妈妈来了。李老师说完情况后妈妈的脸色铁青。\n\n回到家——这次不是"啪"了。妈妈拿了一根小尺子。\n\n"啪啪啪！"打了三下手心。\n\n"往人头上吐口水！你是怎么想的？！猪都不这么做！"妈妈气得声音都发抖了。\n\n正正哭得稀里哗啦："我再也不了！我再也不了！"\n\n"罚你一个星期不能吃零食。如果再有这种事，送你去爷爷家待一个月，不许回来。"\n\n正正被吓住了。从那以后他再也没有在楼上乱扔过任何东西——他终于明白了，有些"好玩"的事情其实非常危险，也非常不礼貌。'
},
{
  id: 'zhengzheng_141',
  title: '【调皮鬼正正】第一百四十一集：撒谎的代价',
  category: '成长',
  content: '今天手工课，李老师让大家用黏土做小动物。每个小朋友的桌上都有一盒彩色黏土。\n\n正正做了一个大恐龙——可是他把自己的黄色黏土用完了，恐龙的肚子还没做好。他看了看旁边的小雨，小雨的黄色黏土还有好多。\n\n"小雨，借我一点黄色的。"\n\n"不行，我待会要做长颈鹿呢。"\n\n正正生气了。等小雨去上厕所的时候，他偷偷拿了小雨的黄色黏土，全部揉进了自己的恐龙里。\n\n小雨回来发现黏土少了："我的黄色呢？"\n\n她看了看正正桌上那个格外大的黄色恐龙肚子……"正正！你拿了我的！"\n\n"我没有！这是我自己的！"正正矢口否认。\n\n小雨去找了李老师。李老师走过来，拿起正正剩下的黏土盒一看——黄色的格子空了，但旁边的颜色都还在。如果是自己用完的，应该是做恐龙时各种颜色都会用一些。而且正正的恐龙肚子明显比正常的大了一倍。\n\n"正正，看着老师的眼睛。你拿了小雨的黏土吗？"\n\n"没……没有……"正正躲开了老师的目光。\n\n"真的没有？"\n\n"真的……"\n\n李老师叹了口气。她拿来了教室的监控录像回放给正正看。画面里，正正清清楚楚地从小雨桌上拿走了黏土。\n\n正正的脸"唰"地红了，恨不得找个地洞钻进去。\n\n"正正，偷拿东西已经不对了。但更不对的是撒谎。做错了事可以改，但撒谎了，以后别人怎么相信你说的话？"\n\n正正哭了出来。不是因为怕被打，而是因为他觉得丢脸极了。\n\n放学后妈妈来了。李老师这次没有当面说，而是单独发了消息。\n\n回家后妈妈让正正坐在沙发上，很认真地对他说："正正，妈妈可以接受你犯错，但是不能接受你撒谎。你做了错事告诉妈妈，妈妈虽然会批评你但不会那么生气。可你要是撒谎被拆穿了——"\n\n"啪！"手心一下。\n\n"这一下是罚你拿别人东西。"\n\n"啪！"又一下。\n\n"这一下是罚你撒谎。你记住，做人第一条就是诚实。"\n\n正正含着泪使劲点头。从那以后，不管做了什么错事，他都不撒谎了——虽然老实交代也会被骂，但至少不用再挨双倍的罚了。'
},
{
  id: 'zhengzheng_142',
  title: '【调皮鬼正正】第一百四十二集：用积木打人',
  category: '成长',
  content: '搭积木的时候，正正搭了一座好高好高的城堡。他得意极了，站起来炫耀："你们看！我的城堡最高！"\n\n可是旁边的乐乐也搭了一座很高的——比正正的还高一点点。\n\n"我的比你高！"乐乐开心地说。\n\n正正不服气。他瞪了乐乐一眼，然后——伸出手把乐乐的积木城堡推倒了！"哗啦！"积木散了一地。\n\n"你！你干嘛！！"乐乐气哭了，"我搭了好久的！"\n\n乐乐推了正正一把。正正更生气了——他拿起一块方方的积木朝乐乐扔过去。\n\n"咚！"积木打中了乐乐的额头。\n\n乐乐愣了一下，然后"哇——"大哭起来。额头上红了一块，鼓起了一个小包。\n\n教室里一下子安静了。所有小朋友都看着正正。李老师立刻跑过来。\n\n"发生什么了？"李老师检查乐乐的额头，红肿了一块。她先带乐乐去校医那里冰敷，然后回来处理正正。\n\n"正正，你为什么拿积木打人？"\n\n"他……他的比我高，我不高兴……"\n\n"因为别人比你做得好，你就动手打人？正正你想想，如果有人因为嫉妒你拿石头砸你，你怎么想？"\n\n正正不说话了。他看了看乐乐额头上的包，心里有点害怕也有点后悔。\n\n李老师的语气很严厉："正正，动手打人是最最不可以做的事。不管有多大的矛盾，都不可以打人。你这次的行为让老师非常非常失望。今天的所有活动你都不能参加，你坐在位子上反省。"\n\n正正一个人坐了一整个下午。旁边的小朋友唱歌他不能唱，做游戏他不能玩。好孤单好难受。\n\n放学后妈妈来了。一看到乐乐妈妈抱着冰袋敷头的乐乐——妈妈的脸白了。\n\n她先跟乐乐妈妈道了歉，回到家后关上门——\n\n"啪！啪！啪！啪！"四下。这是正正记忆中挨得最多的一次。\n\n"打人！你竟然打人！用积木砸人脑袋！万一砸到眼睛怎么办！"妈妈气得手都在抖。\n\n正正哭得说不出完整的话："我……我再也……不打人了……"\n\n"记住，不管多生气，手不能动。嘴巴说不过可以找老师。但是手——永远不可以伸。"\n\n这一天正正记了很久很久。从此他真的再没动手打过人。就算再生气，也只是跺跺脚或者去一个人待着冷静。'
},
{
  id: 'zhengzheng_143',
  title: '【调皮鬼正正】第一百四十三集：藏老师的粉笔',
  category: '成长',
  content: '今天早上李老师出去接电话，正正趁老师不在，跑到了讲台上。他看到了粉笔盒——里面装着红色、白色、黄色的粉笔。\n\n正正把所有粉笔偷偷塞进了自己的口袋里。然后他又把黑板擦藏到了窗帘后面。\n\n做完这些正正赶紧溜回了座位，假装什么都没发生。\n\n李老师回来了，准备在黑板上写字教大家认字。她拿起粉笔盒——空的。黑板擦也不见了。\n\n"咦？粉笔呢？"李老师找了一会儿，找不到。\n\n正正在下面偷偷笑。\n\n可是李老师没有生气，她说："好吧，今天不用粉笔了。原来计划今天教大家写自己的名字，这样下周表演的时候大家就能在签名墙上写自己的名字了。不过既然没有粉笔，那就不教了。"\n\n小朋友们发出了失望的声音："啊？不教了？"\n\n"我想写名字！"\n\n"我也想学！"\n\n大家都不开心。几个小朋友看向了正正——因为刚才有人看到正正跑到讲台那边了。\n\n"正正，是不是你？"\n\n正正的脸红了。被全班人盯着的感觉好丢人。他慢慢从口袋里掏出了粉笔，又从窗帘后面拿出了黑板擦。\n\n"对不起李老师……我以为这样很好玩……"\n\n李老师接过粉笔说："正正，你想想——你一个人觉得好玩的事情，让全班二十多个小朋友都学不到东西。一个人的快乐和二十多个人的学习，哪个更重要？"\n\n正正低下了头。他第一次意识到，自己的"好玩"可能会影响到很多很多人。\n\n放学妈妈知道后："你偷老师的教学工具？！你以为这是闹着玩的？"\n\n"啪！"\n\n"所有小朋友都因为你学不了东西。你觉得这样公平吗？"\n\n"不公平……我以后不了……"\n\n"回去写十遍\'我不偷藏别人的东西\'。"\n\n正正回到房间，认认真真地写了十遍。写到手酸——但他把这个教训记住了。'
},
{
  id: 'zhengzheng_144',
  title: '【调皮鬼正正】第一百四十四集：踩了花坛',
  category: '成长',
  content: '幼儿园门口有一个漂亮的花坛，里面种着五颜六色的小花。那是上个月全班一起种的——每个小朋友种了一棵，还给自己的花挂了名字牌。\n\n今天放学，正正和几个男生在花坛旁边追着玩。跑着跑着，正正一脚踩进了花坛里——"咔嚓"，踩断了一棵小花。\n\n"没事没事，就一棵。"正正没在意，继续跑。\n\n可是他跑得太疯了，又踩了一脚——这次踩了两棵。\n\n"正正！你踩到花了！"小美在后面喊。\n\n正正回头看了一眼被踩扁的花——其中一棵上面挂着的牌子写着"小美的花"。\n\n"小美的花……"正正咽了咽口水。\n\n小美跑过来看到自己辛辛苦苦种的花被踩成了泥，"哇"地就哭了。"我的花！我浇了好多天的！它都开花了的！"\n\n这时候李老师出来了。她看着花坛里的脚印——正正的鞋印清清楚楚的。\n\n"正正，你看看你踩坏了谁的花。"\n\n正正蹲下来看那些被踩烂的花苗。其中一棵还能看到断裂前含苞的花骨朵——本来明天就要开的。\n\n"这些花是活的。它们也有生命。你跑来跑去一脚就踩死了。"李老师的话让正正心里不好受。\n\n正正蹲在那里不说话了。他突然觉得那些被踩扁的花好可怜。\n\n"你要补种三棵花，每天负责浇水，直到它们开花为止。"李老师说。\n\n放学后妈妈来了，看到了花坛里的狼藉。\n\n回到家妈妈倒没打他，但让他写了一篇"检讨书"——五岁的检讨书就是画画。正正画了一幅画：一个小人踩到了花上面，花在哭。\n\n第二天开始，正正每天早上早来十分钟浇花。看着新种下的小花苗一天天长大，他心里竟然有一种奇怪的成就感。\n\n一个月后，三棵新花开了。正正高兴地跑去跟李老师报告："老师！我的花开了！"\n\n李老师笑着说："你看，爱护比破坏难多了。但爱护的快乐也比破坏大多了，对不对？"\n\n正正用力点了点头。'
},
{
  id: 'zhengzheng_145',
  title: '【调皮鬼正正】第一百四十五集：排队时推人',
  category: '成长',
  content: '午饭时间到了，小朋友们要排队去食堂。正正站在队伍中间，前面是小明。\n\n正正等得不耐烦了。他伸出手推了小明一下："快走啊！"\n\n小明往前一个踉跄，碰到了前面的人，前面的人又碰到更前面的人——像多米诺骨牌一样，队伍前面好几个小朋友都晃了一下。\n\n最前面的小雨没站稳，"扑通"坐在了地上。\n\n"谁推的！"李老师从后面走过来。\n\n小朋友们都转头看正正。\n\n"正正又推人了！"大家七嘴八舌。\n\n李老师把正正拉出队伍："你到最后面去。"\n\n"可是……我要到最后了就打最后一个菜了……"正正急了，他最喜欢吃第一个端出来的鸡腿。\n\n"对，去最后面。而且以后每次排队你都排最后，直到你能做到不推不挤为止。"\n\n正正不情愿地走到了队伍最后面。等他进食堂的时候，鸡腿已经没了，只剩下了他不太爱吃的鱼。\n\n正正郁闷极了，但又不好意思说什么——毕竟是自己推人在先。\n\n中午回教室，李老师单独找正正谈话："你知道为什么要排队吗？"\n\n"因为……大家一起走比较整齐？"\n\n"不只是整齐。是因为排队的时候，推推挤挤很容易摔倒。摔倒以后后面的人停不住就会踩到前面的人。这很危险。所以排队不能推。"\n\n正正第一次从"安全"的角度想了这件事。\n\n放学回家正正把今天的事说了。妈妈这次没有打他——因为正正是主动说的。\n\n"不打你了。但是你告诉妈妈，你从这件事学到了什么？"\n\n正正想了想说："排队不能推人。不然会像骨牌一样倒。还有……被罚到最后面就吃不到鸡腿了。"\n\n妈妈忍不住笑了："行吧，你这个记忆点也行。"\n\n从那以后正正排队再也不推了。不为别的——他可不想再错过鸡腿了。'
},
{
  id: 'zhengzheng_146',
  title: '【调皮鬼正正】第一百四十六集：模仿大人说脏话',
  category: '成长',
  content: '正正昨天在小区里听到了一个大哥哥说了一句脏话。正正觉得那话听起来好"厉害"——大哥哥说完以后别人都不敢惹他了。\n\n今天在幼儿园，正正和乐乐因为抢秋千吵了起来。正正脱口而出："你这个X X X！"（脏话）\n\n周围的小朋友都愣住了。乐乐也愣了。然后好几个小朋友开始学——"X X X！""X X X！"教室里一下子全是这个词。\n\n李老师的脸色变了。她用力拍了两下桌子："安静！谁第一个说的？"\n\n所有人都看向了正正。\n\n李老师把正正叫到了走廊上。这次她不是蹲下来，而是站着，从上往下看着正正。正正知道这意味着老师真的很生气。\n\n"这句话你从哪里学的？"\n\n"小区里一个大哥哥说的……"\n\n"你知道这是脏话吗？"\n\n正正摇摇头又点点头——他其实不太确定意思，只是觉得说出来很"酷"。\n\n"正正，脏话是骂人的话，说脏话不是厉害，是没素质。你知道更糟糕的是什么吗？你一个人说了，其他小朋友跟着学——你带坏了一屋子人。"\n\n正正的脸烧得厉害。他低着头不敢看老师。\n\n"从今天开始，你每天要说十句好听的话才能得到小贴纸。说一句脏话就扣三张贴纸。"\n\n放学后妈妈知道了。这一次妈妈没有立刻动手，而是坐下来问正正：\n\n"你觉得那个大哥哥说脏话很酷对不对？"\n\n正正点头。\n\n"可是你知道吗，说脏话的人在别人心里是什么样的？别人不是怕他，是看不起他。真正厉害的人不需要说脏话别人就尊重他。"\n\n正正想了想，好像确实是——幼儿园里最受欢迎的不是说话凶的人，而是像小明那样会帮助别人的人。\n\n"妈妈，我以后不说了。"\n\n"好。如果妈妈再听到你说脏话——"妈妈竖起手指，"用辣椒水漱口。"\n\n正正吓得吐了吐舌头。从此管住了嘴巴。'
},
{
  id: 'zhengzheng_147',
  title: '【调皮鬼正正】第一百四十七集：浪费粮食',
  category: '成长',
  content: '今天午餐是正正不太喜欢的——米饭配土豆炖牛肉和青菜汤。\n\n正正吃了几口牛肉，觉得米饭没味道。他开始用勺子把米饭一粒一粒弹出去——"弹！弹！弹！"米粒飞到了桌子上、地上、甚至弹到了对面小朋友的碗里。\n\n"好好玩！像放鞭炮！"正正越弹越开心。\n\n旁边的小朋友也开始学，用勺子弹米饭。很快桌面上和地上全是白白的米粒。\n\n李老师走过来了。她没有立刻说话——而是默默地蹲下来，把地上的米粒一粒一粒捡起来。\n\n教室里安静了。所有小朋友都看着老师蹲在地上捡米粒的样子。\n\n李老师捡了好几分钟才把地上的米粒都捡完了。然后她站起来，把那些脏了的米粒放在正正面前。\n\n"正正你数数，地上有多少粒米。"\n\n正正数了数："一、二、三……好多，数不清……"\n\n"大概有一百多粒。你知道一粒米要怎么来吗？农民伯伯要种水稻，要浇水，要施肥，要除草，要等它长大，要收割，要晒干，要碾成白米——一粒米从种下到到你碗里，要花整整半年时间。"\n\n正正不说话了。\n\n"你今天弹掉的这一百多粒米，农民伯伯要干好几天才能种出来。你觉得你弹着玩，对得起种米的人吗？"\n\n正正的眼眶红了。他从来没想过米饭这么来之不易。\n\n"把你碗里剩的饭吃完。以后不许浪费一粒米。"\n\n正正低头把碗里的饭一口一口全吃完了，一粒都没剩。\n\n放学后他跟妈妈说了这件事。妈妈没有打他，而是带他去了超市买了一包米，让他搬回家。\n\n那包米好重啊，正正累得满头汗。\n\n"一包米都这么重，你想想农民伯伯要种多少才能让大家都有饭吃。"\n\n从那以后，正正吃饭再也不浪费了。每次碗里最后一粒米他都会吃干净。'
},
{
  id: 'zhengzheng_148',
  title: '【调皮鬼正正】第一百四十八集：乱按电梯',
  category: '成长',
  content: '幼儿园组织小朋友去参观科技馆。大家坐电梯上三楼。正正站在电梯按钮旁边——哇，好多好多按钮！\n\n正正的手痒了。"1、2、3、4、5、6——"他把所有楼层的按钮全按了一遍！\n\n电梯门关上了。然后——到了一楼开门。没人下。关门。到了二楼又开门。没人下。关门。到了三楼开门——总算到了，可是又关门，去了四楼……\n\n"正正！你按了什么！"李老师急了。电梯每一层都停，开门关门开门关门，走走停停。\n\n后面排队等电梯的人也急了——他们按了电梯可是电梯每层都停，等了好久都坐不上。\n\n等正正他们从电梯出来的时候，其他等电梯的大人脸色都不太好看。有一个叔叔说："哪个小孩乱按的？太没规矩了。"\n\n李老师尴尬极了。她跟人家道了歉，然后把正正拉到一边。\n\n"正正，电梯不是玩具。你把所有按钮都按了，电梯每层都停，浪费了所有人的时间。而且你知道吗？电梯如果频繁开关门，是有可能出故障的。如果电梯坏了，里面的人被困住了怎么办？"\n\n正正吓了一跳。他从来没想过按按钮会有这么严重的后果。\n\n"今天参观完回去后，你要写一张道歉卡贴在电梯旁边。"\n\n正正参观科技馆的心情全没了。他一直在想着刚才的事。回去后他画了一张卡片：一个电梯和一排按钮，旁边写着（画着）"不要乱按"。\n\n放学妈妈知道后很生气："公共设施是给所有人用的！你乱按影响了多少人？你知不知道丢人？"\n\n"啪！"\n\n"以后坐电梯手给我放好。看到按钮不许碰！到了自己的楼层跟妈妈说，妈妈来按。"\n\n"知道了……"正正低着头。\n\n从那以后坐电梯的时候，正正都把手揣在口袋里。他知道了——按钮不是玩具，公共场所要为别人着想。'
},
{
  id: 'zhengzheng_149',
  title: '【调皮鬼正正】第一百四十九集：笑话别人尿裤子',
  category: '成长',
  content: '今天上课的时候，小班的一个小弟弟不小心尿裤子了。小弟弟才三岁多，吓得站在那里哭。老师正在帮他换裤子。\n\n正正路过看到了，哈哈大笑起来："哈哈哈！尿裤子了！大宝宝还尿裤子！羞羞羞！"\n\n他还拉了几个同学过来看："你们看！他尿裤子了！"\n\n小弟弟听到了正正的话，哭得更厉害了，小脸涨得通红。他把脸埋在老师怀里不肯抬头。\n\n李老师恰好经过走廊，听到了正正的话。她一步走过来，表情非常严肃：\n\n"正正！过来。"\n\n正正被李老师的语气吓住了，他从来没见老师这么严肃过。\n\n李老师把他带到走廊尽头，蹲下来看着他的眼睛说："正正，你三岁的时候也尿过裤子。你忘了吗？"\n\n正正愣住了——他确实不太记得了，但他知道三岁的时候可能是尿过的。\n\n"每个人都有做不好事情的时候。你笑话别人最丢脸的时刻，等于在别人的伤口上撒盐。那个小弟弟才三岁，他本来就很害怕很难过了，你还笑他——他会记住这件事很久很久的。"\n\n正正低下了头。他想了想如果是自己被一群人围着笑……他的脸也热了。\n\n"去跟那个小弟弟说对不起。然后今天下午，你帮他擦桌子擦椅子，做他的小哥哥。"\n\n正正走到小弟弟面前，轻轻地说："对不起，我不该笑你。我以前也尿过裤子的。没关系的。"\n\n小弟弟抬起头看了看正正，虽然眼睛还红红的，但不哭了。\n\n那天下午正正真的帮小弟弟擦了桌子，还教他叠纸飞机。小弟弟最后笑了，叫他"正正哥哥"。\n\n放学后正正跟妈妈说了今天的事。这次他是自己主动说的。\n\n妈妈摸了摸他的头："你知道错了就好。记住，永远不要笑话别人的困难。今天你帮了那个小弟弟，你做了一件比取笑别人好一百倍的事。妈妈为你后来的表现感到骄傲。"\n\n正正笑了。原来当好人的感觉比当坏蛋舒服多了。'
},
{
  id: 'zhengzheng_150',
  title: '【调皮鬼正正】第一百五十集：正正变了',
  category: '成长',
  content: '学期末到了。幼儿园要评"进步之星"——不是给最乖的小朋友，而是给这学期进步最大的。\n\n李老师站在讲台上念名字。正正坐在下面，他觉得肯定没自己的份——这学期他闯的祸太多了，挨了无数次批评，屁股也被打了不知道多少下。\n\n"进步之星——正正！"\n\n"啊？！"正正以为自己听错了。全班小朋友的目光都转向了他。\n\n"正正请上来。"李老师微笑着说。\n\n正正磨磨蹭蹭走上了讲台。李老师给他胸口贴了一朵大大的金色小红花。\n\n"大家可能觉得奇怪，正正这学期犯了很多错。但是老师想说——正正每一次犯错以后，都真的在改。"\n\n李老师开始说："他以前浪费粮食，现在每顿饭碗里干干净净。他以前推人，现在排队不推不挤。他以前取笑别人，现在还帮小班的小弟弟。他以前霸占玩具，现在学会了轮流和分享。"\n\n"犯错不可怕。可怕的是犯了错不改。正正每一次都改了，而且越改越好。这就是进步。"\n\n全班鼓掌了。正正站在讲台上，嘴巴张了张，眼眶竟然红了。\n\n放学后，正正举着金色小红花跑向妈妈："妈妈！！我得了进步之星！！"\n\n妈妈愣了一下，然后笑了，蹲下来紧紧抱住了正正。\n\n"妈妈好开心。你看，你是可以做好的对不对？"\n\n"嗯！"正正用力点头，"妈妈，虽然我还是有点调皮……但我以后会继续努力改的。"\n\n妈妈亲了亲正正的额头："调皮没关系。只要你知道什么该做什么不该做，知道犯了错要改，你就是妈妈最棒的宝贝。"\n\n那天晚上妈妈做了正正最爱吃的红烧排骨。正正吃了三大碗饭，碗里一粒米都没剩。\n\n睡觉前正正把金色小红花贴在了床头。他看着那朵花想：虽然这学期屁股被打了好多次，哭了好多回。但如果没有那些批评和那些"啪啪啪"，他也不会变成现在的正正。\n\n"明天开始新学期了。"正正闭上眼睛，"我……嗯……尽量少挨打吧。"\n\n他翻了个身，嘴角带着小小的微笑睡着了。'
},
{
  id: 'huihui_1',
  title: '【慧慧的中班故事】第一集：慧慧巧算糖果',
  category: '慧慧',
  content: '李老师带来了一大罐糖果，说要奖励表现好的小朋友。她问:"谁能猜出罐子里大概有多少颗糖？"\n\n小朋友们乱猜:"一百颗！""一千颗！""一万颗！"猜得五花八门。\n\n慧慧没有乱猜。她仔细观察，动起了脑筋:"我先数一层有多少颗，再看看有几层，乘起来就差不多了。"\n\n慧慧数了数最上面一层，大概有十颗。她又看了看，罐子里大概有五层。"十乘五等于五十，所以大概有五十颗左右。"\n\n李老师把糖倒出来一数——正好五十二颗！慧慧猜得最接近！\n\n"哇，慧慧太厉害了！"小朋友们都惊叹。\n\n李老师问:"慧慧，你怎么猜得这么准？"\n\n慧慧说:"我没有乱猜，而是想办法估算。先数一层有多少，再看有几层，乘起来就差不多了。这叫\'估算\'。"\n\n李老师表扬慧慧:"慧慧真会动脑筋！用观察和估算的方法，比乱猜准多了。这就是数学的智慧。"\n\n慧慧把估算的方法教给了大家。后来数豆子、数积木，小朋友们也会用"数一部分，再算整体"的方法了。\n\n慧慧还发现，估算在生活里很有用——大概需要多少张纸、大概要走多久、大概有多少人，都能估算。\n\n慧慧告诉大家:面对数量多的东西，不用乱猜，也不用一个一个数得头晕。可以用估算的方法——数一小部分，再推算整体，又快又接近。动脑筋、找方法，就能把难题变简单。数学的智慧，藏在生活的每一处。'
},
{
  id: 'huihui_2',
  title: '【慧慧的中班故事】第二集：慧慧的雨天妙招',
  category: '慧慧',
  content: '下大雨了，放学的时候，好多小朋友没带伞，被困在幼儿园门口，出不去，急得直跺脚。\n\n慧慧带了伞，但她没有自己撑着伞先走。她观察了一下，发现好几个没带伞的小朋友家住得近，顺路。\n\n"我们可以一起走呀！"慧慧提议，"住得近的小朋友，几个人合撑一把伞，或者你们跟着我的伞，我送你们一段。"\n\n慧慧先送住得最近的乐乐:"乐乐，你家最近，我先送你，然后再送别人。"她撑着伞，把乐乐送到了家门口。\n\n然后她又回来，送另一个小朋友。慧慧的伞虽然只有一把，但她安排得有条有理，一个一个送，让大家都没被淋到。\n\n有的小朋友说:"慧慧，你这样来回跑，自己不是要淋雨、很累吗？"\n\n慧慧说:"没关系，我有雨衣可以穿。大家一起想办法，总比一个人干着急强。而且帮助别人，我很开心。"\n\n后来，慧慧还想到:"我们可以给爸爸妈妈打电话，让他们带伞来接。没带伞的先在教室等，别在门口淋雨。"\n\n在慧慧的安排下，没带伞的小朋友有的被慧慧送回家，有的等来了爸爸妈妈，都平平安安的，没有淋雨感冒。\n\n李老师表扬慧慧:"慧慧遇到问题不慌张，还会想办法帮助大家、合理安排，真了不起。"\n\n慧慧告诉大家:遇到困难，不要干着急，冷静想办法。下雨没伞，可以合撑一把伞、可以互相帮助、可以给家人打电话。一个人的力量小，大家互相帮助、合理安排，困难就解决了。热心助人、善于想办法，是很宝贵的品质。'
},
{
  id: 'huihui_3',
  title: '【慧慧的中班故事】第三集：慧慧认识钟表',
  category: '慧慧',
  content: '慧慧对墙上的钟表很好奇:"为什么两根针不一样长？为什么它们一直在动？"\n\n她仔细观察，还问了李老师。原来，短针是时针，走得慢，指几就是几点;长针是分针，走得快，转一圈是一个小时。\n\n慧慧很快就学会了看钟表。她还发现了钟表和生活的联系:"八点上课，十二点吃午饭，三点吃点心，五点放学……原来时间安排得这么有规律！"\n\n有了看钟表的本领，慧慧做事更有计划了。她知道什么时间该做什么:该上课了、该吃饭了、该睡觉了，都能自己看钟表判断，不用别人提醒。\n\n小朋友们问:"慧慧，你怎么会看钟表呀？好难哦。"\n\n慧慧说:"不难的，我教你们。短针是时针，指几就是几点;长针是分针。你们看，现在短针指着三，长针指着十二，就是三点整，该吃点心啦！"\n\n慧慧耐心地教大家看钟表。慢慢地，小朋友们也学会了。大家能自己看时间，安排自己的活动，都觉得很有成就感。\n\n李老师说:"慧慧不但自己爱学习、学会了看钟表，还教会了大家。认识时间、管理时间，是很重要的本领。"\n\n慧慧还养成了守时的好习惯，做什么都掌握好时间，从不拖拉、从不迟到。\n\n慧慧告诉大家:认识钟表、学会看时间，是很有用的本领。短针指小时，长针指分钟。学会看时间，就能自己安排活动、管理时间，做事更有计划、更守时。时间很宝贵，学会珍惜和管理时间的人，做事更从容、更高效。'
},
{
  id: 'huihui_4',
  title: '【慧慧的中班故事】第四集：慧慧的环保小队',
  category: '慧慧',
  content: '慧慧发现，幼儿园里有的小朋友乱扔垃圾，把好好的环境弄脏了。花园里有糖纸，操场上有废纸，走廊里有果皮。\n\n慧慧决定做点什么。她组织了一个"环保小队",邀请小朋友们一起爱护环境。\n\n"我们一起来保护幼儿园的环境好不好？"慧慧号召大家，"看到垃圾就捡起来扔进垃圾桶，自己也不乱扔。"\n\n慧慧带头，弯腰把地上的糖纸、废纸捡起来，扔进垃圾桶。小朋友们看到了，也纷纷加入，一起捡垃圾。\n\n慧慧还教大家垃圾分类:"能回收的纸、瓶子放一个桶，果皮、剩饭放另一个桶。这样垃圾能变废为宝呢。"\n\n在慧慧和环保小队的努力下，幼儿园变得越来越干净了。花园里没有糖纸了，操场上没有废纸了，走廊也干干净净的。\n\n慧慧还想出了好办法——用捡来的、干净的废纸和瓶子做手工。大家用废纸折了小船、用瓶子做了花瓶，变废为宝，又好玩又环保。\n\n李老师非常赞赏:"慧慧的环保小队真棒！不但自己爱护环境，还带动大家一起保护环境，把废物变成了宝贝。这是很有意义的事。"\n\n园长也表扬了环保小队，还给他们发了"环保小卫士"的奖章。\n\n慧慧告诉大家:保护环境，人人有责。不乱扔垃圾，看到垃圾主动捡起来，还可以把废物回收利用、变废为宝。爱护环境不是一个人的事，大家一起行动，力量就大了。一个干净美丽的环境，需要每个人的努力。爱护我们的地球家园，从身边的小事做起。'

{

  title: '【慧慧的中班故事】第五集：慧慧背古诗',

  content: '李老师教大家背古诗《静夜思》。好多小朋友觉得古诗难背，背了后面忘了前面。\n\n慧慧却背得又快又好。小朋友们问:"慧慧，你怎么背得这么快呀？"\n\n慧慧说:"我不是死记硬背，而是先理解古诗的意思，再想象画面。"\n\n慧慧解释:"\'床前明月光\'——就是床前洒满了明亮的月光;\'疑是地上霜\'——月光白白的，好像地上结了霜;\'举头望明月\'——抬头看着天上的月亮;\'低头思故乡\'——低下头想念家乡。你看，这是一幅画：一个人晚上看到月光，想起了家乡。理解了、想象出画面，就好背了。"\n\n小朋友们跟着慧慧的方法，一边想象画面一边背，果然好背多了。\n\n慧慧还把古诗编成了小动作:说"举头"就抬头，说"低头"就低头。大家一边做动作一边背，又好玩又好记。\n\n慢慢地，全班小朋友都会背《静夜思》了，还理解了它的意思。\n\n李老师表扬慧慧:"慧慧背古诗有方法——理解意思、想象画面、配上动作。这样不但背得快，还记得牢，理解得深。"\n\n慧慧还爱上了古诗，又学了好几首。她发现古诗很美，短短几句就是一幅画、一个故事。\n\n慧慧告诉大家:背古诗、背东西，不要死记硬背。先理解意思，想象出画面，还可以配上动作，就能背得又快又牢，还能体会到其中的美。学习要用巧方法——理解加想象，比硬背强得多。掌握好的学习方法，学什么都事半功倍。'

  title: '【慧慧的中班故事】第六集：慧慧的分享日',
  category: '慧慧',
  content: '幼儿园有个"分享日",每个小朋友可以带一样自己喜欢的东西来，跟大家分享。\n\n慧慧想带什么呢？她没有带最贵、最新的玩具，而是带来了一本她最喜欢的图画书，还有一小盆她自己种的、开了花的小植物。\n\n分享的时候，慧慧给大家讲了图画书里的故事，讲得绘声绘色，大家都听得入迷。然后她又介绍了自己种的小花:"这是我从一颗种子开始种的，每天浇水、晒太阳，它才开出了花。分享给大家看，也希望大家都能体会种植的乐趣。"\n\n慧慧还把图画书借给想看的小朋友，把种花的方法教给感兴趣的同学。\n\n有的小朋友带了很贵的玩具，却只顾自己炫耀，不让别人碰。而慧慧带的东西不贵，却真心地跟大家分享知识和乐趣，大家都特别喜欢。\n\n李老师说:"分享日，重要的不是东西贵不贵，而是那份真心分享的快乐。慧慧分享了故事、分享了种花的乐趣、分享了知识，这样的分享最有意义。"\n\n小朋友们围着慧慧，有的听故事，有的问种花，气氛特别温暖。慧慧也很开心——把自己喜欢的东西和知识分享给大家，看到大家开心，她比自己独享还快乐。\n\n慧慧告诉大家:分享不在于东西贵不贵，而在于那份真心。分享一个好故事、一份知识、一种乐趣，比炫耀贵重的东西更有意义。真心的分享能带给别人快乐，也能让自己收获更大的快乐和友谊。分享是一种美好的品质，让快乐加倍、让友谊加深。'

{
  id: 'huihui_7',
  title: '【慧慧的中班故事】第七集：慧慧辨别方向',
  category: '慧慧',
  content: '秋游的时候，小朋友们在公园里玩。玩着玩着，几个小朋友找不到集合的凉亭在哪个方向了，有点着急。\n\n慧慧不慌。她想起了辨别方向的方法:"别急，我们来找方向。你们看，太阳现在在那边，早上太阳从东边升起，现在快中午了，太阳在南边偏高的位置。"\n\n慧慧还观察了大树:"你们看，树叶茂密的一面是朝南的，因为南边阳光多。而且，我记得来的时候，我们是从凉亭往北走的，那现在往南走，就能回到凉亭了。"\n\n慧慧带着大家，朝着南边走。走了一会儿，果然看到了集合的凉亭！\n\n"哇，慧慧带我们找到了！"小朋友们都松了一口气。\n\n李老师问:"慧慧，你怎么知道方向的？"\n\n慧慧说:"我用了好几个方法。太阳的位置能帮我们判断方向——早上在东，中午在南;大树茂密的一面朝南;还有，记住来时的方向，回去就往反方向走。这些方法结合起来，就能辨别方向了。"\n\n李老师表扬慧慧:"慧慧真是个有心人，学的知识都能用上。辨别方向，在迷路的时候特别有用。"\n\n慧慧把辨别方向的方法教给了大家。她还提醒:"如果真的迷路了，最好待在原地别乱走，等大人来找;或者找穿制服的工作人员帮忙。"\n\n小朋友们都学到了本领，觉得慧慧懂得真多。\n\n慧慧告诉大家:辨别方向是很有用的本领。可以看太阳的位置——早上在东、中午在南;可以看大树，茂密的一面朝南;还可以记住来时的路。这些知识平时多观察、多积累，关键时刻就能派上用场。当然，万一迷路，待在原地等大人、或找工作人员帮忙最安全。多学知识、多观察，能让我们更从容地面对各种情况。'

{
  id: 'huihui_8',
  title: '【慧慧的中班故事】第八集：慧慧不挑食长得壮',
  category: '慧慧',
  content: '慧慧吃饭从不挑食，什么菜都吃——青菜、萝卜、豆腐、鱼、肉，样样都吃。\n\n有的小朋友挑食，只吃肉不吃菜，或者只吃白饭不吃别的。慧慧看到了，就跟他们分享:"每种食物都有不同的营养呢。"\n\n慧慧懂得不少营养知识:"青菜里有维生素，让我们不生病;肉和鱼里有蛋白质，让我们长力气;米饭里有能量，让我们有精神;胡萝卜对眼睛好;牛奶让骨头结实……所以要什么都吃，营养才全面。"\n\n因为不挑食、营养全面，慧慧长得又高又壮，身体棒棒的，很少生病，跑得快、跳得高，精力充沛。\n\n而那些挑食的小朋友，有的长得瘦小，有的容易生病，有的没力气。\n\n李老师说:"慧慧不挑食，所以身体这么健康。小朋友们要向慧慧学习，什么都吃，营养才均衡，身体才棒。"\n\n慧慧鼓励挑食的小朋友:"不爱吃的菜，可以先吃一点点，慢慢就习惯了。为了长高、长壮、不生病，我们要什么都吃哦。"\n\n在慧慧的带动和鼓励下，挑食的小朋友也开始尝试各种食物了。慢慢地，大家都不那么挑食了，身体也越来越好。\n\n慧慧告诉大家:不要挑食，什么食物都要吃。因为不同的食物有不同的营养——蔬菜、水果、肉、鱼、蛋、奶、米饭，各有各的好处。只有什么都吃、营养均衡，才能长高长壮、身体健康、少生病。为了健康的身体，克服挑食的坏习惯，做一个什么都爱吃的健康宝宝。'
},
{
  id: 'huihui_9',
  title: '【慧慧的中班故事】第九集：慧慧帮同学找橡皮',
  category: '慧慧',
  content: '乐乐的橡皮不见了，急得到处翻，把书包、文具盒翻了个底朝天，还是找不到，急得快哭了。\n\n慧慧走过来:"别急，我帮你一起找。我们想想，你最后一次用橡皮是在哪里？"\n\n乐乐想了想:"好像是画画的时候用的。"\n\n慧慧说:"那我们就从画画的地方开始找。你画画坐在哪里？"\n\n两个人来到乐乐画画的座位。慧慧仔细地找——桌子上、抽屉里、椅子下面。"你看，橡皮会不会掉到地上了？"慧慧蹲下来看，果然，橡皮滚到了桌子腿旁边的角落里。\n\n"找到啦！"乐乐高兴极了，"慧慧，你怎么这么快就找到了？"\n\n慧慧说:"找东西不能乱翻，要动脑筋。先想想最后一次在哪里用的、可能掉在哪里，然后有条理地找——先找最可能的地方，再找周围。这样比乱翻快多了。"\n\n李老师表扬慧慧:"慧慧找东西真有方法。回忆最后使用的地方、有条理地寻找，比慌慌张张乱翻有效多了。"\n\n慧慧还提醒乐乐:"以后东西用完放回固定的地方，就不容易丢了。文具盒里,橡皮放一格,铅笔放一格,用完放回去,就好找了。"\n\n乐乐点点头，把橡皮放回了文具盒的固定位置。\n\n慧慧告诉大家:找东西要用方法，不能慌慌张张地乱翻。先冷静回忆——最后一次在哪里用的、可能掉在哪里，然后有条理地寻找——先找最可能的地方。而且，东西用完放回固定位置，就不容易丢。遇事冷静、讲方法、有条理，什么难题都能轻松解决。'
},
{
  id: 'huihui_10',
  title: '【慧慧的中班故事】第十集：慧慧的镜子游戏',
  category: '慧慧',
  content: '慧慧发现了一面小镜子，玩起来觉得很神奇。她发现镜子能反射阳光，还能照出东西。\n\n阳光照在镜子上，反射到墙上，出现了一个亮亮的光斑。慧慧移动镜子，光斑也跟着动。"好神奇！镜子能把阳光反射到别的地方！"\n\n慧慧还发现，镜子里的字是反的——"上"在镜子里变成了反的。她好奇地研究:"为什么镜子里左右会反过来呢？"\n\n慧慧把这些发现分享给小朋友们，还带大家做游戏:用镜子反射阳光，在墙上"画画";照镜子看反字，猜猜镜子里写的是什么。大家玩得可开心了，还学到了知识。\n\n不过，慧慧也提醒大家:"用镜子反射阳光的时候，千万不能照别人的眼睛，会很刺眼、伤眼睛的。我们只照墙壁玩。"她很注意安全。\n\n李老师看到了，赞赏地说:"慧慧不但爱观察、爱研究，把镜子玩出了科学道理，还特别注意安全，提醒大家不要照眼睛。真棒！"\n\n慧慧还带大家观察了更多有镜子的地方——水面能当镜子照出倒影，勺子的两面照出的样子不一样（一面正、一面倒）……原来生活里藏着这么多科学。\n\n慧慧告诉大家:生活里到处有科学，一面小镜子就藏着好多秘密——反射阳光、照出反字。多观察、多研究、多动手，就能发现这些有趣的科学道理。同时，玩的时候一定要注意安全，比如镜子不能照别人眼睛。带着好奇心探索世界，带着安全意识去玩，就能又快乐又有收获。'

  content: '新来的小朋友豆豆，因为想妈妈，一个人躲在角落里哭。别的小朋友有的不知道怎么办，有的觉得爱哭很奇怪。\n\n慧慧走过去，轻轻地坐在豆豆旁边，温柔地说:"豆豆，你是想妈妈了吗？"\n\n豆豆点点头，哭得更伤心了。\n\n慧慧没有说"别哭了"这样的话，而是轻轻拍着豆豆的背:"想妈妈是很正常的，我刚来幼儿园的时候也想妈妈。不过没关系，妈妈下午就来接你了。在幼儿园，还有老师和小朋友陪着你呢。"\n\n慧慧陪着豆豆，跟他讲幼儿园好玩的事:"我们这里有好多好玩的呢——有滑梯、有积木、有图画书，还可以做游戏。等下我带你一起玩好不好？"\n\n慢慢地，豆豆不哭了。慧慧拉着他的手，带他玩滑梯、看图画书、认识别的小朋友。豆豆脸上有了笑容，慢慢地融入了大家。\n\n到了下午，豆豆已经玩得很开心了，还交到了朋友。妈妈来接的时候，豆豆还有点舍不得走呢。\n\n李老师说:"慧慧真会安慰人。她没有简单地说\'别哭\',而是理解豆豆的心情，陪伴他、转移他的注意力，帮他融入集体。这份细心和爱心，太可贵了。"\n\n慧慧说:"别人难过的时候，需要的是理解和陪伴。我理解豆豆想妈妈的心情，所以陪着他、带他玩，让他开心起来。"\n\n慧慧告诉大家:当别人难过、哭泣的时候，不要说"别哭了"这样的话，也不要觉得别人奇怪。要理解他的心情，轻轻地陪伴、安慰他，帮他转移注意力、开心起来。理解和陪伴，是最好的安慰。一颗善解人意、充满爱心的心，能温暖每一个需要帮助的人。'

  content: '慧慧用两个纸杯和一根线，做了一个"传声筒"——两个纸杯底部用线连起来，一个人对着一个杯子说话，另一个人把杯子放在耳朵上，就能听到声音。\n\n"喂喂，能听到吗？"慧慧对着杯子小声说。\n\n"能听到！好清楚！"另一头的乐乐惊喜地说。\n\n小朋友们都觉得好神奇——明明是小声说话，通过传声筒，对方却能清楚地听到。\n\n慧慧解释:"声音是通过线传过去的。声音让线振动，振动又传到另一个杯子，就能听到了。这叫\'声音的传播\'。"\n\n大家轮流玩传声筒，玩得可开心了，还学到了声音传播的知识。\n\n慧慧还带大家做实验:把线拉直，声音传得清楚;线松了、或者捏住线，声音就传不过去了。"你看，声音要靠拉直的线来传播，捏住线，振动就停了，声音也就传不过去了。"\n\n李老师赞叹:"慧慧真会动手、动脑！用简单的材料做出传声筒，还讲清楚了科学道理。这种爱探索、爱动手的精神，太可贵了。"\n\n慧慧还教大家自己做传声筒。小朋友们回家用纸杯和线做了传声筒，跟爸爸妈妈玩，还讲科学道理给他们听。\n\n慧慧告诉大家:科学很有趣，用简单的材料就能做出好玩的科学小实验，比如传声筒。声音能通过振动传播。多动手做实验、多思考背后的道理，就能发现科学的奇妙。保持好奇心、爱动手、爱思考，你也能成为爱科学的小小发明家。生活处处有科学，等着我们去探索。'

{
  id: 'huihui_19',
  title: '【慧慧的中班故事】第十九集：慧慧的浮沉实验',
  category: '慧慧',
  content: '慧慧在玩水的时候发现了一个有趣的现象:有的东西放进水里会浮起来，有的会沉下去。\n\n她好奇地做起了实验。木块——浮起来了;石头——沉下去了;塑料玩具——浮起来了;铁钉——沉下去了;树叶——浮起来了。\n\n"为什么有的浮、有的沉呢？"慧慧动脑筋想。她发现:"轻的、里面有空气的东西容易浮，重的、实心的东西容易沉。"\n\n她还发现了更有趣的:一团橡皮泥揉成球放进水里会沉，但捏成小船的形状就能浮起来！"原来形状也有关系，做成船的形状，里面有空气，就能浮起来，所以大轮船那么重也能浮在水上。"\n\n慧慧把这些发现分享给小朋友们，还带大家一起做浮沉实验。大家找来各种小东西放进水里，猜猜是浮还是沉，玩得可开心了，还学到了科学知识。\n\n李老师赞叹:"慧慧真是个爱观察、爱实验的孩子！她自己发现了浮沉的规律，还知道了轮船为什么能浮在水上。这就是科学探索的精神。"\n\n慧慧还提醒大家玩水的安全:"玩水实验很有趣，但要在安全的地方玩，不能靠近深水，玩完要擦干手，注意别弄湿衣服着凉。"\n\n小朋友们跟着慧慧做实验，对科学产生了浓厚的兴趣。\n\n慧慧告诉大家:生活中处处有科学。玩水时就能发现浮沉的秘密——轻的、有空气的东西浮，重的、实心的东西沉;改变形状还能改变浮沉，所以大轮船能浮在水上。多观察、多动手实验、多思考，就能发现科学的奥秘。带着好奇心探索世界，同时注意安全，你就是个爱科学的小小探索家。'
},
{

  category: '慧慧',
  content: '教室里的花瓶被打碎了。有小朋友说看到慧慧在花瓶附近，怀疑是慧慧打碎的。\n\n其实不是慧慧打碎的。面对误会，慧慧没有慌张，也没有生气地跟人吵架。\n\n她冷静地说:"花瓶不是我打碎的。我确实在花瓶附近走过，但我没有碰它。我们可以一起弄清楚到底是怎么回事。"\n\n慧慧提议:"我们问问其他小朋友，有没有人看到花瓶是怎么碎的？"\n\n大家一起回忆、询问。原来，是窗户没关好，风把窗帘吹起来，带倒了花瓶。有小朋友想起来:"我看到了，是风吹的，窗帘扫倒了花瓶，那时候慧慧已经走过去了。"\n\n误会解开了！大家都明白花瓶不是慧慧打碎的。\n\n那个怀疑慧慧的小朋友不好意思地说:"慧慧，对不起，我错怪你了。"\n\n慧慧笑着说:"没关系，误会解开就好。谢谢大家帮忙弄清楚了真相。"\n\n李老师表扬慧慧:"慧慧被误会了，没有慌乱、没有吵架，而是冷静地说明情况、想办法弄清真相。这样既证明了自己，又没伤和气。真聪明、真有涵养。"\n\n慧慧说:"被误会的时候，生气吵架没有用。冷静地说清楚事实，想办法找到真相，误会自然就解开了。"\n\n慧慧告诉大家:被别人误会的时候，不要慌张、不要生气吵架。要冷静地说明事实，想办法弄清真相。事实会证明一切。诚实的人不怕被误会，因为真相总会大白。遇到误会，冷静、理智地处理，既能澄清自己，又能维护和气。冷静和智慧，能化解很多矛盾和误会。'
},
{

  content: '慧慧最爱看书了，她也特别爱护书。\n\n看书的时候，慧慧的手总是干干净净的——她看书前会洗手，不让脏东西弄脏书页。翻书的时候，她轻轻地翻，从来不折角、不撕页。看完的书，她轻轻合上，放回原来的位置，摆得整整齐齐。\n\n有的小朋友看书就不爱护——用脏手翻书，把书页弄脏;折书角当记号;还有的把书卷起来、扔在地上，把书弄得皱巴巴、破破烂烂的。\n\n慧慧看到了，就跟大家分享爱护图书的方法:"书是我们的好朋友，要爱护它。看书前洗手，轻轻翻页，不折角、不撕页，看完放回原位。这样书才能保持干净完整，让更多小朋友看。"\n\n慧慧还教大家用书签代替折角:"想记住看到哪一页，用书签夹住就行，不用折角。"她还用漂亮的卡纸做了好多书签，送给小朋友们。\n\n在慧慧的带动下，小朋友们都开始爱护图书了。读书角的书变得干净整洁，也不再有破损的了。\n\n李老师表扬慧慧:"慧慧爱看书，更爱护书。她把爱护图书的好习惯带给了大家。书是知识的宝库，爱护书，就是尊重知识。"\n\n慧慧说:"书里有那么多知识和好故事，是我们的好朋友。爱护书，它就能陪伴我们更久，也能让更多人看到。"\n\n慧慧告诉大家:书是我们的好朋友，是知识的宝库，要好好爱护。看书前洗手，轻轻翻页，不折角、不撕页，用书签做记号，看完放回原位。爱护图书，书才能保持完整、干净，让更多人看到。爱护书本，就是尊重知识、珍惜资源。养成爱护图书的好习惯，做一个爱读书、惜书本的好孩子。'

  category: '慧慧',
  content: '慧慧对影子和时间很感兴趣。她发现，一天之中，同一个东西的影子，长短和方向会变化。\n\n她做了一个小实验:在操场上插了一根小棍子，每隔一段时间就观察一次影子，还用粉笔在地上标记影子的位置。\n\n早上，影子长长的，指向西边。中午，影子短短的。下午，影子又变长，指向东边。\n\n慧慧发现:"影子的变化是有规律的！这跟太阳的位置有关。古时候的人就是用这个原理做\'日晷\'来看时间的。"\n\n慧慧给小朋友们讲解:"太阳从东边升起，影子就在西边;太阳升到头顶，影子最短;太阳往西落，影子就转到东边。看影子的长短和方向，就能大概知道时间。"\n\n小朋友们觉得太神奇了——原来影子还能当"钟表"用！\n\n慧慧带大家一起观察影子钟，记录一天里影子的变化。大家不但玩得开心，还学到了太阳、影子、时间的知识。\n\n李老师赞叹:"慧慧太爱探索了！她通过观察影子，发现了时间的规律，还了解了古人的智慧\'日晷\'。这种探索精神，非常宝贵。"\n\n慧慧还把观察记录画成了图，贴在墙上，跟大家分享她的发现。\n\n慧慧告诉大家:大自然里藏着好多科学和智慧。一根小棍子的影子，就能反映太阳的位置和时间的变化，古人还用这个原理发明了日晷来计时。多观察、多记录、多思考，就能发现这些奇妙的规律。保持探索的兴趣，你会发现，学习和探索是一件特别快乐、特别有成就感的事。'

{

  title: '【慧慧的中班故事】第二十三集：慧慧不乱发脾气',
  category: '慧慧',
  content: '慧慧搭积木的时候，辛辛苦苦搭的高塔突然倒了。换成别的小朋友，可能会生气地把积木一扔、发脾气。\n\n但慧慧没有。她深吸一口气，让自己冷静下来:"塔倒了没关系，我想想为什么倒了。"\n\n她观察倒掉的塔，发现:"哦，是因为我上面放的积木太重了，底下撑不住。下次我把重的放下面、轻的放上面，就稳了。"\n\n慧慧不慌不忙地重新搭。这次她把大的、重的积木放底下，小的、轻的放上面。果然，塔搭得又高又稳，没有倒。\n\n有小朋友问:"慧慧，你的塔倒了，你怎么不生气呀？"\n\n慧慧说:"生气有什么用呢？塔倒了，生气也不能让它重新立起来。不如冷静下来，想想为什么倒了，找到原因、改正，就能搭好了。发脾气解决不了问题，还会影响心情。"\n\n李老师表扬慧慧:"慧慧遇到挫折不发脾气，而是冷静分析、找原因、想办法。这种控制情绪、理智解决问题的能力，太难得了。"\n\n慧慧还帮那些爱发脾气的小朋友:"遇到不顺心的事，先深呼吸，数一二三，让自己冷静下来。然后想想问题出在哪、怎么解决。发脾气不但没用，还会把事情弄得更糟。"\n\n在慧慧的影响下，小朋友们遇到困难也慢慢学会了冷静，不那么爱发脾气了。\n\n慧慧告诉大家:遇到不顺心的事、遇到挫折，不要发脾气。发脾气解决不了问题，还会影响心情、伤害别人。要学会控制情绪——深呼吸、冷静下来，然后分析问题、想办法解决。冷静和理智，比发脾气有用一万倍。能管理自己情绪的人，才能更好地解决问题、更受大家欢迎。'
},
{
  id: 'huihui_24',
  title: '【慧慧的中班故事】第二十四集：慧慧帮爷爷奶奶',
  category: '慧慧',
  content: '周末，慧慧去看望爷爷奶奶。爷爷奶奶年纪大了，做很多事情都不太方便。\n\n慧慧特别懂事，主动帮爷爷奶奶做事。奶奶眼睛不好，穿针引线困难，慧慧就帮奶奶穿针:"奶奶，我眼睛好，我帮你穿针。"\n\n爷爷腿脚不方便，慧慧就帮爷爷拿东西、倒水:"爷爷，你坐着别动，我帮你拿。"\n\n吃饭的时候，慧慧主动给爷爷奶奶盛饭、夹菜:"爷爷奶奶，多吃点。"\n\n饭后，慧慧还帮忙收拾碗筷、擦桌子。\n\n爷爷奶奶乐得合不拢嘴:"我们慧慧真孝顺、真懂事！有慧慧真好。"\n\n慧慧还陪爷爷奶奶聊天，给他们讲幼儿园的趣事，唱歌给他们听。爷爷奶奶特别开心。\n\n慧慧知道，爷爷奶奶年纪大了，需要关心和照顾。她说:"爷爷奶奶疼我、爱我，我也要孝顺他们、照顾他们。"\n\n回到幼儿园，慧慧跟小朋友们分享:"我们要孝顺爷爷奶奶、爸爸妈妈。他们照顾我们、爱我们，我们也要关心他们、帮他们做力所能及的事。"\n\n李老师表扬慧慧:"慧慧真是个孝顺、懂事的好孩子。懂得关心、照顾长辈，是中华民族的传统美德。"\n\n在慧慧的带动下，小朋友们回家也开始帮爷爷奶奶、爸爸妈妈做事了，家里的长辈都特别欣慰。\n\n慧慧告诉大家:要孝顺、关心长辈。爷爷奶奶、爸爸妈妈疼爱我们、照顾我们，我们也要爱他们、关心他们、帮他们做力所能及的事——帮忙拿东西、盛饭、捶背、陪他们聊天。孝顺长辈是最美好的品德。一个懂得感恩、孝顺的孩子，会让整个家庭充满爱和温暖。'
},
{
  id: 'huihui_25',
  title: '【慧慧的中班故事】第二十五集：慧慧的磁铁发现',
  category: '慧慧',
  content: '慧慧得到了一块磁铁，玩起来发现了好多有趣的现象。\n\n磁铁能吸住铁的东西——回形针、铁钉、小铁片，都被吸住了。但是吸不住塑料、木头、纸。"原来磁铁只能吸铁做的东西！"慧慧发现。\n\n她还发现，两块磁铁，有时候会互相吸住，有时候却互相推开。"这是怎么回事呢？"慧慧研究后明白了:"磁铁有两头，一头一头凑近会吸住，同样的两头凑近会推开。"\n\n慧慧把这些发现分享给小朋友们，还带大家做磁铁游戏:用磁铁隔着纸吸回形针，让回形针"走路";用磁铁把撒在地上的铁钉快速收集起来。大家玩得可开心了，还学到了磁铁的知识。\n\n慧慧还发现了磁铁的用处:"冰箱贴能贴在冰箱上，就是因为里面有磁铁;指南针能指方向，也是磁铁的原理。磁铁的用处可大了！"\n\n李老师赞叹:"慧慧真是个爱探索的小科学家！她自己发现了磁铁的秘密，还知道了磁铁在生活中的用处。"\n\n慧慧提醒大家:"磁铁很好玩，但不能靠近手机、电视这些电器，会影响它们;小磁铁也不能放进嘴里，很危险。"她很注意安全。\n\n小朋友们跟着慧慧玩磁铁、学知识，对科学越来越感兴趣了。\n\n慧慧告诉大家:磁铁里藏着有趣的科学——它能吸铁，两块磁铁有时相吸有时相斥，还能用来做指南针、冰箱贴。多观察、多动手玩、多思考，就能发现这些科学奥秘。当然，玩的时候要注意安全。保持好奇心和探索欲，科学的世界充满了惊喜和乐趣，等着我们去发现。'
},
{
  id: 'huihui_26',
  title: '【慧慧的中班故事】第二十六集：慧慧不怕改错',
  category: '慧慧',
  content: '写数字的时候，慧慧把"6"写反了。李老师指出来:"慧慧，这个6写反了哦。"\n\n慧慧没有难过，也没有不好意思，而是大方地说:"谢谢老师指出来！我改正过来。"她认认真真地把"6"重新写对。\n\n有的小朋友被指出错误，会不高兴、会脸红、甚至会哭。但慧慧不一样，她把老师和同学指出的错误，当成帮助自己进步的好事。\n\n慧慧说:"被指出错误不是坏事呀。如果没人告诉我写反了，我可能一直写错。老师指出来，我改正了，就学会正确的写法了。这是好事呀。"\n\n慧慧还主动请小朋友们帮她检查:"你们看看我写的对不对？有错误告诉我，我改。"\n\n因为不怕改错、乐于改正，慧慧进步特别快。她的字越写越漂亮，做的事情越来越少出错。\n\n李老师表扬慧慧:"慧慧对待错误的态度真好！被指出错误不难过、不逃避，而是虚心接受、认真改正。这样才能不断进步。"\n\n慧慧还鼓励那些怕被指出错误的小朋友:"被指出错误没关系的，改正了就进步了。怕别人说、藏着错误不改，才永远学不好呢。"\n\n在慧慧的影响下，小朋友们也慢慢能虚心接受批评、改正错误了。\n\n慧慧告诉大家:被指出错误不是丢人的事，而是帮助自己进步的好事。有了错误不要难过、不要逃避、不要藏着，要虚心接受、认真改正。改正了错误，就学会了正确的做法，就进步了。虚心接受批评、勇于改正错误的人，才能越来越优秀。有错就改，善莫大焉。'
},
{
  id: 'huihui_27',
  title: '【慧慧的中班故事】第二十七集：慧慧的种子日记',
  category: '慧慧',
  content: '慧慧种了几颗不同的种子——黄豆、绿豆、还有一颗西瓜子，想看看它们怎么长大，有什么不一样。\n\n她每天观察，还画了"种子日记",记录每颗种子的变化。\n\n黄豆长得快，几天就发芽了，芽粗粗的。绿豆也发芽了，芽细一些。西瓜子长得慢，过了好久才冒出芽。\n\n慧慧发现:"不同的种子，发芽的时间、样子都不一样！有的长得快，有的长得慢;有的芽粗，有的芽细。"\n\n她还发现，同样的种子，放在阳光下的长得好，放在黑暗里的长得又黄又弱。"原来植物长大需要阳光！"\n\n慧慧坚持记录了好多天，种子日记画满了一本子。从发芽、长叶，到长高，每一步她都仔细观察、认真记录。\n\n李老师看了慧慧的种子日记，赞叹不已:"慧慧观察得这么仔细、记录得这么认真，还发现了这么多规律！这就是科学家做研究的方法呀。"\n\n慧慧把种子日记分享给小朋友们，大家都惊叹于植物生长的神奇。在慧慧的带动下，好多小朋友也开始种植物、写观察日记了。\n\n慧慧还懂得了耐心的重要:"种子长大需要时间，急不来。每天照顾它、观察它，慢慢地它就长大了。做事情也一样，要有耐心。"\n\n慧慧告诉大家:观察和记录，能让我们发现好多科学规律。不同的种子有不同的生长方式，植物长大需要阳光、水和时间。坚持观察、认真记录，就能像小科学家一样发现奥秘。而且，种植物还能培养耐心——好的事物需要时间和照顾才能长成。爱观察、有耐心、勤记录，你会收获知识，也会收获成长。'
},
{
  id: 'huihui_28',
  title: '【慧慧的中班故事】第二十八集：慧慧懂得感恩',
  category: '慧慧',
  content: '有一天，李老师问大家:"小朋友们，你们要感谢的人有哪些呀？"\n\n好多小朋友一时想不出来。慧慧却举起手，说了好多:\n\n"我要感谢爸爸妈妈，他们养育我、爱我;感谢爷爷奶奶，他们疼我;感谢李老师，教我们本领、照顾我们;感谢食堂的阿姨，给我们做好吃的饭菜;感谢门卫爷爷，保护我们的安全;感谢农民伯伯，种出粮食;感谢清洁工，把马路打扫干净;还要感谢小朋友们，陪我一起玩……"\n\n慧慧一口气说了好多要感谢的人，大家都愣住了——原来身边有这么多人在为我们付出、值得感谢。\n\n李老师感动地说:"慧慧真是个懂得感恩的孩子。她能看到身边这么多人的付出，懂得感谢。这份感恩的心，非常美好。"\n\n慧慧说:"我们能开开心心地生活，是因为有好多人在为我们付出。爸爸妈妈、老师、还有好多我们不认识的人。我们要懂得感恩，还要用行动去回报——好好学习、帮助别人、说声谢谢。"\n\n慧慧不但心里感恩，还用行动表达:她会跟食堂阿姨说"谢谢阿姨，饭菜真好吃";会跟门卫爷爷说"爷爷辛苦了";会帮爸爸妈妈做家务。\n\n在慧慧的影响下，小朋友们也开始学着发现身边人的付出、表达感谢了。\n\n慧慧告诉大家:我们要懂得感恩。我们能快乐地生活、学习，是因为有好多人在默默付出——爸爸妈妈、爷爷奶奶、老师、食堂阿姨、清洁工、农民伯伯……要怀着一颗感恩的心，看到别人的付出，真诚地说声"谢谢",还要用行动去回报。懂得感恩的人，内心更温暖、更幸福，也会被更多人喜爱。'
},
{
  id: 'huihui_29',
  title: '【慧慧的中班故事】第二十九集：慧慧的镜子里的字',
  category: '慧慧',
  content: '慧慧在照镜子的时候，发现了一件有趣的事:她拿着一本书对着镜子，书上的字在镜子里都变成反的了！"上"变成了反的，"人"字倒是看起来一样。\n\n"为什么镜子里的字是反的呢？"慧慧很好奇。\n\n她做起了实验:写一个"6",对着镜子看，变成了"9"的样子（左右反过来）;写"上",镜子里也是反的。但是像"日""目"这样左右对称的字，在镜子里看起来一样。\n\n慧慧发现了规律:"镜子会把左右反过来。左右不对称的字，在镜子里就变反了;左右对称的字，看起来一样。"\n\n她还发现了好玩的:救护车前面的字是反着写的！"这是为什么呢？"慧慧想了想明白了:"因为这样，前面的车通过后视镜看，就是正的了，能看清是救护车，好让路。真聪明！"\n\n慧慧把这些发现分享给大家，还带大家玩镜子写字游戏。大家对着镜子看反字、猜字，玩得可开心了，还学到了知识。\n\n李老师赞叹:"慧慧观察得真仔细，还能联系到救护车的字，动脑筋想明白了道理。这种爱观察、爱思考的精神真棒。"\n\n小朋友们跟着慧慧，发现生活中好多镜子的奥秘，对科学更感兴趣了。\n\n慧慧告诉大家:生活中处处有科学和智慧。镜子会把左右反过来，所以镜子里的字是反的;而救护车的字反着写，是为了让前车从后视镜看是正的。多观察、多提问、多思考"为什么",就能发现这些有趣的道理，还能明白人们的巧妙设计。保持好奇心和思考的习惯，你会越来越聪明，越来越懂得这个奇妙的世界。'
},
{
  id: 'huihui_30',
  title: '【慧慧的中班故事】第三十集：慧慧帮助迷路的小朋友',
  category: '慧慧',
  content: '在公园玩的时候，慧慧看到一个比自己小的小朋友，一个人站在路边，一边哭一边找妈妈——他和妈妈走散了，迷路了。\n\n慧慧走过去，温柔地问:"小弟弟，你是不是找不到妈妈了？别害怕，姐姐帮你。"\n\n小朋友哭着点头。慧慧一边安慰他，一边冷静地想办法:"别哭，我们一起找妈妈。你还记得妈妈长什么样、穿什么衣服吗？"\n\n慧慧知道，帮助迷路的小朋友，最好的办法是找可靠的大人帮忙。她带着小朋友，找到了公园里穿制服的工作人员:"叔叔，这个小弟弟跟妈妈走散了，能帮忙找找他的妈妈吗？"\n\n工作人员通过广播帮忙寻找。很快，着急的妈妈就找来了，紧紧抱住了迷路的孩子。\n\n小朋友的妈妈非常感激慧慧:"谢谢你，小姑娘！多亏了你帮忙，还找了工作人员。你真懂事、真聪明！"\n\n慧慧说:"不客气。我看他一个人哭，就想帮帮他。找穿制服的工作人员帮忙，是最安全、最有效的办法。"\n\n回到幼儿园，慧慧跟小朋友们分享:"如果看到迷路、有困难的小朋友，我们可以帮助他，但最好找可靠的大人——警察、保安、工作人员帮忙。自己也要记住，万一迷路了，待在原地别乱走，找穿制服的人帮忙，或者记住爸爸妈妈的电话。"\n\n李老师表扬慧慧:"慧慧不但善良，愿意帮助有困难的人，还很机智，知道找可靠的大人帮忙，方法特别对。"\n\n慧慧告诉大家:遇到迷路、有困难的小朋友，我们要有爱心去帮助他，但要用对方法——安慰他，然后找可靠的大人（警察、保安、工作人员）帮忙，这样最安全有效。自己万一迷路，也要记住:待在原地别乱走，找穿制服的人帮忙，记住家人的联系方式。善良加上智慧和安全意识，才能真正帮到别人，也保护好自己。'
},
{
  id: 'huihui_31',
  title: '【慧慧的中班故事】第三十一集：慧慧的形状游戏',
  category: '慧慧',
  content: '李老师教大家认识形状——圆形、方形、三角形。慧慧学得又快又好，还发现了形状藏在生活的各个角落。\n\n"你们看，太阳是圆形的，钟表是圆形的，皮球也是圆形的;窗户是方形的，书是方形的，桌子是方形的;红领巾是三角形的，三明治切开是三角形的，屋顶也有三角形……"慧慧兴奋地发现着。\n\n慧慧还发现了形状的特点:"圆形会滚动，所以轮子是圆的;三角形最稳固，所以好多桥、房梁用三角形;方形能整整齐齐地拼在一起，所以砖头、地砖是方的。"\n\n小朋友们跟着慧慧，在教室里、在幼儿园里找形状，玩起了"形状寻宝"游戏。大家找到了好多不同形状的东西，玩得可开心了，还学到了知识。\n\n慧慧还带大家用不同的形状拼图案:用三角形和方形拼出了小房子，用圆形拼出了小花，用各种形状拼出了小汽车。大家发挥想象，拼出了好多有趣的图案。\n\n李老师赞叹:"慧慧不但认识形状，还发现了形状的特点和用处，真会观察、会动脑筋！"\n\n慧慧说:"形状很有趣呢。认识了形状，还能发现它们藏在生活里，各有各的用处。学东西不能只记名字，还要发现它们的特点和用途。"\n\n慧慧告诉大家:形状藏在生活的每个角落——圆形、方形、三角形。它们各有特点和用处:圆形会滚动，三角形最稳固，方形好拼接。多观察生活中的形状，发现它们的特点和用途，学习就变得又有趣又有用。留心观察身边的事物，你会发现，学到的知识和生活紧紧相连，处处都有学问。'
},
{
  id: 'huihui_32',
  title: '【慧慧的中班故事】第三十二集：慧慧不浪费食物',
  category: '慧慧',
  content: '食堂里，慧慧发现有的小朋友盛了很多饭菜，却吃不完，剩下一大堆倒掉，太浪费了。\n\n慧慧吃饭有个好习惯:能吃多少盛多少，宁愿少盛、不够再添，也不多盛、剩下浪费。她盛的饭菜总是吃得干干净净。\n\n慧慧跟小朋友们分享:"盛饭的时候想想自己能吃多少，别盛太多。吃不完倒掉太浪费了。不够可以再添嘛。"\n\n她还讲了粮食的来之不易:"一碗饭，是农民伯伯春天播种、夏天顶着太阳除草浇水、秋天收割，经过好几个月才种出来的。倒掉一碗饭，就浪费了农民伯伯好多辛苦。"\n\n慧慧还想了个好办法，提醒大家:"我们可以看看今天吃什么、大概能吃多少，第一次少盛一点，吃完了再去添。这样既不浪费，又能吃饱。"\n\n在慧慧的带动下，小朋友们盛饭都注意了，不再盛太多、剩太多。食堂里倒掉的剩饭剩菜少了很多。\n\n李老师表扬慧慧:"慧慧珍惜粮食、不浪费，还带动大家养成好习惯。\'谁知盘中餐，粒粒皆辛苦\',爱惜粮食是很重要的美德。"\n\n慧慧吃饭总是把碗里吃得干干净净，一粒米都不剩。她说:"珍惜粮食，就是尊重农民伯伯的劳动，也是好习惯。"\n\n慧慧告诉大家:要珍惜粮食，不浪费。盛饭菜时能吃多少盛多少，不够再添，不要盛太多剩下倒掉。每一粒粮食都是农民伯伯辛苦种出来的，浪费粮食就是浪费别人的劳动。把碗里的饭菜吃干净，是珍惜粮食、尊重劳动的好习惯。勤俭节约，是中华民族的传统美德，从爱惜每一粒米做起。'
},
{
  id: 'huihui_33',
  title: '【慧慧的中班故事】第三十三集：慧慧的声音实验',
  category: '慧慧',
  content: '慧慧对声音很好奇。她发现，敲不同的东西，会发出不同的声音。\n\n她做起了实验:敲桌子——"咚咚";敲玻璃杯——"叮叮";敲铁盆——"当当";敲空盒子——"砰砰"。每样东西的声音都不一样。\n\n慧慧还发现，往玻璃杯里装不同多少的水，敲出来的声音也不一样!"装水少的声音高，装水多的声音低。"她装了好几个杯子，水一个比一个多，敲起来居然能敲出高低不同的音，像小乐器一样!\n\n慧慧兴奋地给大家表演"水杯音乐",还教大家一起玩。小朋友们敲出高高低低的声音，可开心了，还学到了声音的知识。\n\n慧慧解释:"声音是东西振动发出来的。不同的东西、不同多少的水，振动不一样，声音就不一样。"\n\n她还发现，捂住耳朵声音就变小，因为声音传不进来了;把耳朵贴在桌子上，轻轻敲桌子另一头，声音传得很清楚，因为声音能通过桌子传播。\n\n李老师赞叹:"慧慧真是个爱探索的孩子!她通过敲敲打打，发现了声音的奥秘，还做出了\'水杯乐器\',太有创意了!"\n\n小朋友们跟着慧慧探索声音，对科学充满了兴趣。\n\n慧慧告诉大家:声音里藏着好多科学。声音是振动产生的，不同的东西、不同的状态，发出的声音不一样。多敲敲、多听听、多动手实验，就能发现声音的奥秘，还能玩出"水杯乐器"这样有趣的东西。带着好奇心去探索身边的事物，动手又动脑，你会发现科学无处不在，学习充满乐趣。'
},
{
  id: 'huihui_34',
  title: '【慧慧的中班故事】第三十四集：慧慧守信用',
  category: '慧慧',
  content: '慧慧答应朵朵，周末把自己的一本很好看的图画书借给她。\n\n到了周末，慧慧记得清清楚楚。可是那天早上，慧慧的妈妈说要带她去游乐园玩。慧慧很想去，但她想起答应了朵朵的事。\n\n慧慧对妈妈说:"妈妈，我答应了朵朵今天把书借给她，我得先把书给朵朵送去，或者跟她说一声。不能说话不算数。"\n\n妈妈很赞赏:"慧慧真守信用!那我们先绕到朵朵家，把书给她，再去游乐园。"\n\n慧慧把书送到了朵朵家。朵朵特别高兴:"慧慧，谢谢你!你说话真算数!"\n\n原来，朵朵一直在担心慧慧会不会忘了、会不会不来。看到慧慧真的把书送来了，朵朵特别感动。\n\n慧慧说:"答应了的事就要做到呀。这是我应该做的。"\n\n送完书，慧慧才高高兴兴地去了游乐园，玩得特别开心——因为她既守了信用，又没耽误玩，心里踏踏实实的。\n\n李老师听说了这件事，表扬慧慧:"慧慧守信用，哪怕自己有别的安排，也不忘答应别人的事。这种诚信的品质，非常可贵。"\n\n慧慧还说:"如果实在做不到，也要提前告诉对方，说声对不起，不能让人白等、白失望。"\n\n慧慧告诉大家:答应了别人的事，一定要做到，这叫守信用。哪怕自己有别的安排，也要想办法兑现承诺，或者提前跟对方说明。守信用的人，才能得到别人的信任和尊重。一个说话算数、值得信赖的人，会拥有真诚的友谊。诚信是做人的根本，从守住每一个小小的承诺做起。'
},
{
  id: 'huihui_35',
  title: '【慧慧的中班故事】第三十五集：慧慧的颜色秘密',
  category: '慧慧',
  content: '画画的时候，慧慧发现了颜色的秘密:两种颜色混在一起，会变成新的颜色!\n\n她做起了实验:黄色加蓝色，变成了绿色!红色加黄色，变成了橙色!红色加蓝色，变成了紫色!\n\n"太神奇了!"慧慧兴奋地发现，"原来颜色可以变出新颜色!"\n\n她还发现，同一种颜色，加的水多，颜色就浅;加的水少，颜色就深。\n\n慧慧把这些发现分享给小朋友们，还带大家做"调色"游戏。大家用红、黄、蓝三种颜色，调出了绿色、橙色、紫色，还调出了各种深浅不同的颜色。大家玩得可开心了，画画也更漂亮了。\n\n慧慧说:"红、黄、蓝是三种基本的颜色，用它们可以调出好多好多其他颜色。画画的时候，就算颜料不全，也能自己调出想要的颜色。"\n\n有小朋友想画绿色的草，可是没有绿色颜料。慧慧教他:"用黄色加蓝色，就能调出绿色!"那个小朋友一试，果然调出了绿色，开心极了。\n\n李老师赞叹:"慧慧真爱观察、爱实验!她发现了颜色的秘密，还教大家调色，让画画变得更有趣、更方便了。"\n\n慧慧告诉大家:颜色里藏着有趣的秘密——红、黄、蓝三种基本颜色，可以调配出各种各样的新颜色，加水多少还能调出深浅。多动手实验、多观察，就能发现这些奇妙的规律。学会了调色，画画就更自由、更有趣了。带着好奇心去发现、去尝试，你会收获知识，也会收获创造的乐趣。'
},
{
  id: 'huihui_36',
  title: '【慧慧的中班故事】第三十六集：慧慧照顾生病的妈妈',
  category: '慧慧',
  content: '有一天，慧慧的妈妈生病了，发烧躺在床上，很难受。\n\n慧慧看到妈妈生病，特别心疼。平时都是妈妈照顾她，现在妈妈病了，慧慧决定照顾妈妈。\n\n慧慧学着妈妈平时照顾自己的样子，给妈妈倒了一杯温水:"妈妈，多喝水，发烧要多喝水。"她还找来毛巾，帮妈妈擦汗。\n\n妈妈想吃点东西，慧慧虽然不会做饭，但她给妈妈拿来了水果，还削了皮:"妈妈，吃点水果吧。"\n\n慧慧还很懂事，知道妈妈生病需要休息，就自己安安静静地玩，不吵妈妈:"妈妈你好好睡觉，我自己玩，不打扰你。"\n\n她还帮妈妈做了一些力所能及的事——把自己的玩具收拾好，把桌子擦干净，让妈妈不用操心。\n\n妈妈感动极了:"我们慧慧长大了，会照顾妈妈了。有慧慧真好，妈妈的病都好了一半。"\n\n慧慧还给妈妈画了一张"早日康复"的画，画上有太阳、笑脸和爱心。妈妈把画贴在床头，看着就开心。\n\n在慧慧的照顾下，加上吃药休息，妈妈的病很快就好了。\n\n慧慧在幼儿园跟小朋友们分享:"妈妈生病了，我照顾了妈妈。平时妈妈照顾我们，妈妈生病了，我们也要照顾妈妈。"\n\n李老师表扬慧慧:"慧慧真是个孝顺、懂事的好孩子。懂得照顾生病的妈妈，回报妈妈的爱，太可贵了。"\n\n慧慧告诉大家:平时爸爸妈妈照顾我们、爱我们，当他们生病、辛苦的时候，我们也要照顾他们、关心他们。给生病的家人倒水、拿东西、安安静静让他们休息、做力所能及的事，都是爱的表现。懂得关心、照顾、回报家人的爱，是最美好的品德。家人之间互相关爱，家庭才充满温暖和幸福。'
},
{
  id: 'huihui_37',
  title: '【慧慧的中班故事】第三十七集：慧慧的大小比较',
  category: '慧慧',
  content: '李老师拿出一些东西，问大家:"谁能把它们按从大到小排好队？"\n\n有大西瓜、中苹果、小樱桃，还有大盒子、中盒子、小盒子。\n\n好多小朋友排得乱七八糟，慧慧却排得又快又对。\n\n慧慧说:"排大小要仔细比较。先找出最大的放第一个，再从剩下的里面找最大的放第二个，一直到最小的。这样一个一个比，就排好了。"\n\n慧慧把西瓜、苹果、樱桃按从大到小排好，又把三个盒子按大小排好，一点都没错。\n\n李老师问:"慧慧，你怎么排得这么准？"\n\n慧慧说:"比较大小要用眼睛仔细看，还可以把它们放在一起比。有时候光看不准，就实际比一比——把两个盒子叠起来，就知道哪个大了。"\n\n慧慧还发现了有趣的:"大的东西不一定重，小的东西不一定轻。比如大气球很轻，小石头很重。大小和轻重是不一样的。"\n\n小朋友们跟着慧慧学比较大小，还玩起了"排排队"游戏——把各种东西按大小、按高矮、按长短排队。大家玩得开心，也学会了比较。\n\n李老师表扬慧慧:"慧慧比较大小有方法，还发现了大小和轻重不一样，观察真仔细!"\n\n慧慧告诉大家:比较大小要仔细观察、实际比较——找出最大的、再找次大的，一个一个排。而且，大小和轻重是两回事，大的不一定重。做事情要仔细观察、认真比较、动脑思考。掌握了比较和排序的方法，就能把杂乱的东西整理得井井有条。细心和条理，能让我们把事情做得又快又好。'
},
{
  id: 'huihui_38',
  title: '【慧慧的中班故事】第三十八集：慧慧不乱承诺',
  category: '慧慧',
  content: '好几个小朋友都来找慧慧帮忙。乐乐要慧慧帮他画画，朵朵要慧慧陪她玩，小美要慧慧教她折纸，都是同一个时间。\n\n慧慧没有全部答应下来。她想了想，诚实地说:"对不起，我不能同时帮你们所有人。同一个时间我只能做一件事。这样吧，我们排个顺序，一个一个来，好不好？"\n\n慧慧安排:"我先帮乐乐画画，画完陪朵朵玩一会儿，然后教小美折纸。这样每个人我都能帮到，只是要稍微等一等。"\n\n大家觉得这样很公平，都同意了。\n\n慧慧按照安排，认认真真地帮每个人做事，一个都没有落下，也没有敷衍。\n\n有小朋友问:"慧慧，你为什么不一口答应我们呀？"\n\n慧慧说:"因为我不能同时做那么多事呀。如果我全答应了，却做不到，反而会让大家失望。所以我要想清楚自己能做到多少，合理安排，答应了就一定做到。"\n\n李老师表扬慧慧:"慧慧不乱承诺，而是根据自己的能力合理安排，答应了就做到。这样既诚实，又负责任。"\n\n慧慧说:"承诺别人之前，要想想自己能不能做到。做不到的不要乱答应，答应了的一定要做到。这样才不会让人失望。"\n\n慧慧告诉大家:承诺别人之前，要先想想自己能不能做到。不能同时做太多事、超出能力的事，不要乱答应。可以合理安排、排个顺序，量力而行。答应了的事，就一定要认真做到。不乱承诺、说到做到，才是诚实、负责任的表现。一个靠谱的人，会赢得大家的信任。'
},
{
  id: 'huihui_39',
  title: '【慧慧的中班故事】第三十九集：慧慧的空气发现',
  category: '慧慧',
  content: '慧慧发现了一个有趣的现象:空气虽然看不见，但它是存在的!\n\n她做了个实验:把一个空塑料袋敞开口一挥，再捏紧袋口，袋子鼓鼓的——"里面装的就是空气!空气虽然看不见，但能装起来。"\n\n她还发现:对着手心吹气，能感觉到风;扇扇子，能感觉到空气流动;把空杯子倒扣着按进水里，水进不去，因为杯子里有空气挡着。\n\n"原来我们周围到处都是空气，只是看不见!"慧慧兴奋地发现。\n\n慧慧还知道了空气的重要:"我们呼吸需要空气，没有空气就不能活。小鱼在水里，靠水里的空气呼吸。植物也需要空气。空气对所有生命都很重要。"\n\n慧慧把这些发现分享给小朋友们，还带大家做空气实验——用袋子装空气、用扇子扇风、把杯子按进水里。大家玩得可开心了，还明白了空气虽然看不见却无处不在、非常重要。\n\n慧慧还提到了保护空气:"我们要保护空气干净。不能污染空气，要多种树，因为树能让空气变干净。"\n\n李老师赞叹:"慧慧真会观察和思考!空气看不见，她却通过实验证明了它的存在，还懂得空气的重要和保护空气。太棒了!"\n\n慧慧告诉大家:空气虽然看不见，却无处不在、非常重要——我们呼吸需要它，所有生命都离不开它。通过实验（用袋子装、扇扇子、杯子按水里）就能证明空气的存在。而且，我们要保护空气干净，多种树。用心观察、动手实验，就能发现看不见的科学奥秘。爱科学、爱思考、爱护环境，让世界更美好。'
},
{
  id: 'huihui_40',
  title: '【慧慧的中班故事】第四十集：慧慧的一次失误',
  category: '慧慧',
  content: '慧慧虽然平时很能干，但这一次，她也犯了个错误。\n\n值日的时候，慧慧擦桌子，一不小心把老师放在桌上的一盒彩色粉笔碰到了地上，粉笔断了好几根。\n\n慧慧愣了一下。她可以假装不知道，反正没人看见。但慧慧没有这样做。\n\n她主动找到李老师:"李老师，对不起，我擦桌子的时候不小心把粉笔碰到地上，摔断了几根。是我不小心，对不起。"\n\n李老师说:"慧慧，没关系，这是不小心的。谢谢你主动承认。断了的粉笔短一点还能用，不用太自责。"\n\n慧慧说:"以后我擦桌子会先把桌上的东西挪到安全的地方，再擦，就不会碰掉了。"\n\n慧慧把断了的粉笔小心地收好，还想了改进的办法。\n\n李老师对大家说:"你们看，慧慧虽然很能干，但也会不小心犯错。可贵的是，她犯了错主动承认，不逃避，还想办法改进，下次不再犯。这才是对待错误的正确态度。"\n\n慧慧说:"每个人都会犯错，我也不例外。犯了错不要紧，勇敢承认、想办法改进就好了。逃避和隐瞒才是不对的。"\n\n小朋友们发现，原来这么能干的慧慧也会犯错，而她对待错误的态度，更让大家佩服。\n\n慧慧告诉大家:每个人都会犯错，再能干的人也不例外。犯了错不可怕，可怕的是逃避、隐瞒。要勇敢承认错误，想办法改进，避免下次再犯。诚实地面对自己的失误，从错误中学习和改进，才能不断进步。对待错误的正确态度，比不犯错更重要。人非圣贤，孰能无过，知错能改，善莫大焉。'
},
{
  id: 'huihui_41',
  title: '【慧慧的中班故事】第四十一集：慧慧懂得轮流',

{

  title: '【慧慧的中班故事】第四十三集：慧慧的分类整理法',

  content: '李老师的教具柜乱了，好多东西混在一起，找起来很费劲。慧慧主动帮老师整理。\n\n慧慧没有胡乱地摆，而是先分类:"画画的东西放一起——蜡笔、水彩、画纸;手工的东西放一起——剪刀、胶水、彩纸;数学教具放一起——数字卡、积木;图书放一起。"\n\n分好类以后，慧慧又给每一类贴上标签，画上小图案:画笔的地方画支笔，剪刀的地方画把剪刀。"这样一看图案就知道放的是什么，找起来又快又方便。"\n\n整理好的柜子，整整齐齐、清清楚楚，要什么一下子就能找到。\n\n李老师惊喜极了:"慧慧整理得太好了!分类、贴标签，一目了然。以后找东西再也不费劲了。"\n\n慧慧说:"整理东西，先分类，把一样的放一起;再做标记，标明每一类是什么。这样又整齐又好找。"\n\n慧慧还把这个方法教给大家，帮小朋友们整理自己的柜子、书包。大家的东西都变得井井有条了。\n\n有小朋友说:"慧慧，你整理得真好!以前我找东西要翻半天，现在一下子就找到了。"\n\n慧慧说:"整理不难，关键是分类和做标记。养成随手整理、用完归位的习惯，就能一直保持整齐。"\n\n李老师表扬慧慧:"慧慧不但会整理，还乐于帮助大家，把好方法分享给大家。会整理、爱整洁，是很好的习惯和本领。"\n\n慧慧告诉大家:整理东西有好方法——先分类，把同一类的放在一起;再做标记，标明每类是什么，一目了然。这样整整齐齐、找东西又快又方便。养成分类整理、用完归位的好习惯，柜子、书包、房间都会井井有条。会整理的人做事更有条理、更高效。整洁有序的环境，也会让心情更舒畅。'

  content: '有一次，慧慧唱歌跑调了，被一个小朋友笑话:"慧慧唱歌不好听，跑调了!"\n\n慧慧有点不好意思，但她没有生气，也没有难过地哭。她大方地说:"是呀，我唱歌确实不太好，跑调了。谢谢你指出来，我会多练习的。"\n\n慧慧的态度让笑话她的小朋友反而不好意思了。\n\n慧慧说:"每个人都有做得好和做得不好的地方。我唱歌不太好，但没关系，多练习就会进步。被别人指出不足，不用生气，把它当成改进的机会就好。"\n\n从那以后，慧慧真的经常练习唱歌。她跟着音乐哼唱，请唱得好的小朋友教她。慢慢地，慧慧唱歌进步了，不再跑调了。\n\n李老师表扬慧慧:"慧慧面对批评和笑话，不生气、不气馁，而是虚心接受、努力改进。这种心态太好了。"\n\n慧慧还说:"如果别人善意地指出我们的不足，我们要感谢、要改进;如果别人是恶意嘲笑，我们也不用往心里去，做好自己就行。重要的是自己不断进步。"\n\n小朋友们发现，慧慧面对批评的态度真好——不玻璃心、不生气，还能变成进步的动力。大家都向她学习。\n\n慧慧从一个唱歌跑调的小朋友，通过努力练习，变得能唱好听的歌了。她用行动证明:面对不足，努力就能进步。\n\n慧慧告诉大家:面对批评和别人指出的不足，不要生气、不要气馁。虚心接受，把它当成改进的机会，努力练习，就能进步。做得不好没关系，重要的是有一颗虚心学习、努力改进的心。别人善意的批评要感谢，恶意的嘲笑也不必往心里去。保持好心态、不断努力，你就会越来越优秀。'

{
  id: 'huihui_45',
  title: '【慧慧的中班故事】第四十五集：慧慧的植物观察',
  category: '慧慧',
  content: '幼儿园的花园里有好多植物。慧慧最喜欢观察它们了。\n\n她发现，向日葵会跟着太阳转——早上朝东，中午朝上，下午朝西。"向日葵真有趣，它爱追着太阳!"\n\n她还发现，含羞草被碰一下，叶子就会合起来、垂下去，过一会儿又慢慢张开。"含羞草好害羞呀!"\n\n慧慧观察不同的植物:有的开花，有的结果;有的叶子大，有的叶子小;有的长得高，有的爬藤……每种植物都不一样，都很神奇。\n\n她还发现，植物长大需要阳光、水和土壤。晒不到太阳的植物长得又黄又弱，浇水太多的会烂根。"照顾植物要恰到好处。"\n\n慧慧把观察到的分享给大家，还带大家一起观察向日葵转头、逗含羞草合叶子。小朋友们觉得太神奇了，对植物产生了浓厚的兴趣。\n\n李老师赞叹:"慧慧观察得真仔细!向日葵向阳、含羞草害羞，这些有趣的现象她都发现了，还了解了植物生长的需要。"\n\n慧慧还懂得爱护植物:"我们要爱护花草，不能随便摘花、踩草。让它们好好生长，花园才美丽。"\n\n慧慧告诉大家:植物世界充满了奇妙——向日葵追着太阳转，含羞草被碰会害羞地合叶，植物长大需要阳光、水和土壤。用心观察，就能发现这些有趣的现象。同时要爱护花草树木，不随便摘花踩草。带着好奇心观察大自然、爱护大自然，你会发现世界如此美丽神奇，也会成为一个爱自然、懂生命的孩子。'

  title: '【慧慧的中班故事】第五十集：慧慧的一百分',
  category: '慧慧',
  content: '幼儿园举行了一次小小的知识比赛，考大家平时学的本领——认数字、认形状、背儿歌、讲礼貌。\n\n慧慧因为平时认真学习、积极思考、乐于探索，比赛中表现特别好，得了满分!\n\n李老师颁奖的时候说:"慧慧得了一百分!这不是运气，是她平时认真听讲、爱观察、爱思考、勤于练习的结果。"\n\n慧慧上台领奖，但她一点都不骄傲。她说:"谢谢老师和同学们。我得了好成绩，是因为平时的积累。而且，比赛不是最重要的，重要的是我们真的学到了本领。"\n\n慧慧还说:"其实每个小朋友都有自己的长处。有的唱歌好，有的画画好，有的跑步快。我们互相学习，都能进步。"\n\n有小朋友问:"慧慧，你怎么什么都会呀？"\n\n慧慧说:"我也不是什么都会。我只是喜欢学习、爱动脑筋、遇到不懂的就问、学到的就多练习。你们也可以呀!每天进步一点点，慢慢就学会好多东西了。"\n\n慧慧的话鼓励了大家。小朋友们发现，慧慧的优秀不是天生的，而是靠平时的努力和好习惯。大家都想向她学习。\n\n李老师总结:"慧慧的一百分，是聪明加勤奋的结果。她爱学习、爱思考、爱探索，还谦虚、不骄傲。这些好品质，值得每个小朋友学习。"\n\n慧慧把奖状带回家给妈妈看。妈妈骄傲地说:"慧慧真棒!但更让妈妈开心的，是你不骄傲、还愿意帮助大家一起进步。"\n\n慧慧告诉大家:好成绩不是靠运气，而是靠平时认真听讲、爱观察、爱思考、勤于练习的积累。得了好成绩也不要骄傲，因为每个人都有自己的长处，要互相学习。优秀不是天生的，是靠努力和好习惯培养的。只要爱学习、肯努力、每天进步一点点，你也能变得越来越棒。谦虚、勤奋、乐于助人，是通向优秀的道路。'
},
{
  id: 'huihui_51',
  title: '【慧慧的中班故事】第五十一集：慧慧巧解绳结',
  category: '慧慧',
  content: '小朋友们在玩绳子，乐乐不小心把绳子打成了一个死结，怎么解也解不开，急得直跺脚。\n\n"我的绳子解不开了!"乐乐快哭了。\n\n慧慧走过来:"别急，我帮你看看。"她没有用力乱拉——因为越用力拉，结会越紧。\n\n慧慧仔细观察绳结:"解结不能硬拉，越拉越紧。要先找到结里松的地方，慢慢把它弄松，再一点一点解开。"\n\n慧慧耐心地找到结里稍微松一点的地方，用手指轻轻把它挑松，然后顺着松的地方一点一点地解。慢慢地，紧紧的死结被解开了!\n\n"解开啦!"乐乐高兴极了，"慧慧，你怎么这么厉害?"\n\n慧慧说:"解绳结要有耐心，不能着急硬拉。硬拉只会越拉越紧。要先找到松的地方，慢慢弄松、一点一点解。做事情也一样，遇到难题不能急躁、不能蛮干，要冷静、要有耐心、要找对方法。"\n\n李老师表扬慧慧:"慧慧解绳结的办法真好——不硬拉，找松处，有耐心。这也是解决问题的智慧。"\n\n慧慧还教大家:"打结的时候也要注意，别打死结。而且遇到解不开的难题，可以先放一放、冷静想想，或者请别人帮忙，总能解决的。"\n\n小朋友们跟着慧慧学解绳结，也学到了遇事冷静、耐心、找方法的道理。\n\n慧慧告诉大家:遇到难题，比如解不开的绳结，不能急躁、不能蛮干。越用力硬拉，结越紧。要冷静下来，仔细观察，找到突破口（松的地方），有耐心地一点一点解决。做任何事都一样——冷静、耐心、找对方法，比急躁、蛮干有效得多。遇到困难不慌张，动脑筋、有耐心，就没有解不开的"结"。'
},
{
  id: 'huihui_52',
  title: '【慧慧的中班故事】第五十二集：慧慧懂得倾听',
  category: '慧慧',
  content: '朵朵有件开心的事想跟大家分享，可是她说话有点慢。有的小朋友没耐心，还没等朵朵说完就走开了，或者打断她。\n\n只有慧慧，耐心地听朵朵把话说完。她看着朵朵的眼睛，认真地听，还不时点头、回应:"嗯，然后呢?""真好玩!"\n\n朵朵感受到了慧慧的认真倾听，越说越开心，把一件有趣的事完完整整地分享了出来。\n\n朵朵感激地说:"慧慧，谢谢你听我说完。别人都不太愿意听我说，就你最有耐心。"\n\n慧慧说:"每个人说话都值得被认真听。我喜欢听大家分享，能听到好多有趣的事呢。而且，认真听别人说话，是对别人的尊重。"\n\n慧慧倾听的时候，从不打断别人、从不心不在焉。别人说话，她都专心听、认真回应。\n\n正因为慧慧善于倾听，大家都喜欢跟她说话、跟她分享。慧慧也因为认真听大家说，了解了每个人的想法和感受，跟大家的关系特别好。\n\n李老师表扬慧慧:"慧慧真会倾听!认真听别人说话，不打断、不走神，还给予回应。这是很重要的沟通本领，也是对别人的尊重。"\n\n慧慧还提醒大家:"我们都希望别人认真听自己说话，那我们也要认真听别人说。倾听和被倾听，是互相的。"\n\n慧慧告诉大家:认真倾听别人说话，是一种重要的本领，也是对别人的尊重。倾听的时候要专心、看着对方、不打断、给予回应。善于倾听的人，能了解别人的想法和感受，收获更多的信息和友谊。我们希望别人听我们说，就要先学会认真听别人说。倾听是良好沟通和友谊的基础，是一种美好的修养。'
},
{
  id: 'huihui_53',
  title: '【慧慧的中班故事】第五十三集：慧慧的天平游戏',
  category: '慧慧',
  content: '李老师带来了一个小天平，两边可以放东西，比较轻重。慧慧一下子就被吸引了。\n\n她做起了实验:两边各放一块积木，天平平衡了，说明一样重;一边放石头，一边放积木，放石头的一边沉下去了，说明石头重。\n\n慧慧发现:"天平能比较东西的轻重!沉下去的一边重，翘起来的一边轻，平衡就是一样重。"\n\n她还发现了有趣的:"一块大棉花和一块小石头，看起来棉花大，但放到天平上，石头反而重!原来大的不一定重。"这印证了她之前的想法——大小和轻重不一样。\n\n慧慧还用天平做数学游戏:一边放一个大积木，另一边放小积木，看要放几个小积木才能平衡。"哦，一个大积木等于三个小积木那么重!"\n\n小朋友们跟着慧慧玩天平，比较各种东西的轻重，玩得开心，还学到了知识。\n\n李老师赞叹:"慧慧真会玩、真会学!她用天平明白了轻重的比较，还发现大小和轻重不一样，甚至玩出了数学。"\n\n慧慧说:"天平真有用，能准确地比较轻重，不用猜。生活里买菜、称体重，都用到称重的原理呢。"\n\n慧慧告诉大家:天平能帮我们准确比较东西的轻重——沉的一边重，翘的一边轻，平衡就是一样重。而且，大的东西不一定重，要实际称一称才知道。多动手玩、多观察，就能明白轻重、平衡这些科学道理，还能发现它们在生活中的用处（比如买菜称重）。带着好奇心探索，用工具和实验帮助思考，学习就变得又准确又有趣。'
},
{
  id: 'huihui_54',
  title: '【慧慧的中班故事】第五十四集：慧慧不怕困难',
  category: '慧慧',
  content: '学习跳绳的时候，慧慧一开始总是跳不好，绳子老是绊脚。但她不怕困难，坚持练习。\n\n后来学拍皮球，也是一开始拍两下球就跑了。慧慧还是不放弃，一次又一次地练。\n\n学骑小三轮车、学走平衡木、学拼复杂的拼图……每一样，慧慧一开始都不会，但她从不因为困难就放弃。\n\n有小朋友问:"慧慧，这些都好难，你怎么不放弃呀?"\n\n慧慧说:"难的东西，正是需要练习才能学会的呀。如果一遇到困难就放弃，那什么都学不会了。我相信，只要不放弃、多练习，再难的事也能学会。"\n\n慧慧遇到困难的时候，会给自己打气:"再试一次!""我能行!"她还会想办法——分析哪里做得不好，然后改进。\n\n因为不怕困难、坚持努力，慧慧学会了一样又一样本领。跳绳、拍球、骑车、走平衡木……她都学会了，而且做得很好。\n\n李老师表扬慧慧:"慧慧最可贵的，就是不怕困难、坚持不懈。遇到难的事不退缩、不放弃，一直努力，所以她学会了那么多本领。"\n\n慧慧鼓励那些遇到困难就想放弃的小朋友:"别放弃!难只是暂时的，多练几次就好了。我陪你一起练!"在她的鼓励下，好多小朋友也坚持了下来，学会了本领。\n\n慧慧告诉大家:遇到困难不要害怕、不要放弃。难的东西，正是需要努力和练习才能学会的。一遇困难就放弃，什么都学不成。给自己打气"我能行",分析问题、想办法改进，坚持练习，再难的事也能学会。不怕困难、坚持不懈，是成功的关键。战胜了一个个困难，你就会变得越来越强大、越来越自信。'
},
{
  id: 'huihui_55',
  title: '【慧慧的中班故事】第五十五集：慧慧的分水果难题',
  category: '慧慧',
  content: '老师拿来六个苹果，要平均分给三个小朋友。慧慧、乐乐、朵朵，怎么分才公平呢？\n\n有小朋友想乱抢，慧慧说:"别急，我们来公平地分。六个苹果，三个人，每人分几个呢？"\n\n慧慧动脑筋:"六个苹果分给三个人，我们可以一个一个地发——先每人发一个，用了三个，还剩三个;再每人发一个，正好发完。所以每人两个!"\n\n慧慧一个一个地发，果然每人分到了两个苹果，正好分完，公平又清楚。\n\n李老师又出了个难题:"如果是五个苹果分给两个人呢？"\n\n慧慧想了想:"五个分给两个人，每人先分两个，用了四个，还剩一个。剩下的一个，可以切成两半，每人半个。这样每人两个半，公平!"\n\n李老师赞叹:"慧慧分东西又公平又会算!用一个一个发的办法，还想到把剩下的切开平分，真聪明!"\n\n小朋友们跟着慧慧学分东西:一个一个地发，最后剩下的想办法平分。大家再也不为分东西争抢了。\n\n慧慧说:"分东西要公平，可以一个一个地发，分不完的想办法平分（比如切开）。这样每个人都分得一样多，谁也不吃亏，就不会争抢了。"\n\n慧慧还说:"其实这就是数学里的\'平均分\'。学会了，生活里分东西就公平了。"\n\n慧慧告诉大家:分东西要公平，可以用"一个一个发"的方法，让每个人分得一样多;分不完的，想办法平分（比如切开）。公平地分配，大家就不会争抢、不会有矛盾。这就是数学里的平均分，在生活中很有用。用智慧和公平解决分配问题，既学到了数学，又维护了和谐。动脑筋、讲公平，能让大家都满意。'
},
{
  id: 'huihui_56',
  title: '【慧慧的中班故事】第五十六集：慧慧的爱心捐赠',
  category: '慧慧',
  content: '幼儿园组织给山区的小朋友捐赠图书和玩具。慧慧特别积极。\n\n她回家整理自己的图书和玩具，挑出了好多还很新、很好的，准备捐出去。\n\n妈妈问:"慧慧，这些都是你喜欢的，舍得捐吗?"\n\n慧慧说:"舍得!山区的小朋友没有那么多书和玩具，我把这些分享给他们，他们会很开心的。我已经看过、玩过了，让他们也享受一下。"\n\n慧慧不但捐了自己的东西，还挑的是好的、干净的，不是破旧的。她说:"要捐就捐好的。捐破破烂烂的东西，是不尊重别人。我们要真心地分享。"\n\n慧慧还在捐赠的书里夹了一张自己画的卡片，写上鼓励的话:"小朋友，好好学习，天天开心!"\n\n在慧慧的带动下，班里的小朋友也纷纷捐出了自己的好书和好玩具。大家的爱心汇集起来，装了满满好几箱，送给了山区的小朋友。\n\n后来，山区的小朋友回信了，感谢大家的爱心，还说他们特别喜欢这些书和玩具。慧慧他们都特别开心。\n\n李老师表扬慧慧:"慧慧有爱心，愿意把自己喜欢的东西分享给需要的人，还捐的是好东西、真心地祝福。这份爱心太美好了。"\n\n慧慧说:"我们有的东西，别人可能没有。把我们的东西分享给需要的人，帮助他们，是一件特别快乐、特别有意义的事。"\n\n慧慧告诉大家:要有爱心，愿意帮助需要帮助的人。把自己的好东西（好书、好玩具）分享、捐赠给更需要的人，还要真心实意、捐好的东西。帮助别人，能给别人带来快乐，自己也会收获幸福和意义。爱心是可以传递的，你帮助别人，世界就多一份温暖。做一个有爱心、乐于助人、懂得分享的孩子。'
},
{
  id: 'huihui_57',
  title: '【慧慧的中班故事】第五十七集：慧慧的镜面对称',
  category: '慧慧',
  content: '慧慧画画的时候发现，有的图案两边是一样的，像照镜子一样。比如蝴蝶——左边的翅膀和右边的翅膀一模一样，只是方向反过来。\n\n"这好神奇!两边对称，像镜子照出来的一样。"慧慧发现了"对称"。\n\n她观察周围，发现好多东西都是对称的:人的脸、身体，左右对称;树叶，两边对称;好多花朵，对称;还有蜻蜓、瓢虫……\n\n慧慧还发现了对称的用处:她把纸对折，在一边画半个图案，然后沿折线剪，展开就是一个完整的、对称的图案!用这个方法，她剪出了漂亮的对称的花朵、蝴蝶、爱心。\n\n慧慧把这个方法教给大家。小朋友们对折纸、画半个图案、剪开，展开一看——哇，完整又对称的图案，特别漂亮!大家玩得可开心了。\n\n李老师赞叹:"慧慧发现了\'对称\'的规律，还用它剪出了漂亮的图案，真是又爱观察又有创意!"\n\n慧慧说:"对称是一种美。好多东西都是对称的，看起来特别舒服、特别漂亮。发现了对称，剪纸、画画都能用上。"\n\n小朋友们跟着慧慧发现生活中的对称、剪对称的图案，既学了知识，又玩得开心。\n\n慧慧告诉大家:对称是一种奇妙的规律和美——很多东西两边是对称的，像镜子照出来一样，比如蝴蝶、树叶、人的脸。发现了对称，还能用对折剪纸的方法剪出漂亮的对称图案。多观察生活中的对称，你会发现世界处处有规律、有美。爱观察、爱发现、爱创造，学习和生活就充满了乐趣和美好。'
},
{
  id: 'huihui_58',
  title: '【慧慧的中班故事】第五十八集：慧慧不说伤人的话',
  category: '慧慧',
  content: '有一次，乐乐画了一幅画，画得不太好，有点乱。乐乐有点不好意思地拿给大家看。\n\n有的小朋友直接说:"画得真难看!""乱七八糟的!"乐乐听了很难过，低下了头。\n\n慧慧却不一样。她看了乐乐的画，先找优点:"乐乐，你这个颜色搭配得很好看!这只小动物画得很可爱。"然后温和地建议:"如果这里的线条画得再稳一点，会更漂亮哦。你已经比上次进步了呢!"\n\n乐乐听了慧慧的话，重新有了信心，笑着说:"谢谢慧慧!我再改改。"\n\n慧慧说话总是先看到别人的优点，鼓励别人，就算要提意见，也说得很温和、很委婉，不会伤害别人。\n\n李老师表扬慧慧:"慧慧说话真让人舒服。她懂得鼓励别人、肯定别人的优点，提意见也很温和。这样的话，别人爱听，还能帮到别人。"\n\n慧慧说:"同样一件事，可以说得让人难过，也可以说得让人开心。为什么不选择让人开心、又能帮到别人的说法呢?说话要考虑别人的感受，多说鼓励的话，少说伤人的话。"\n\n小朋友们发现，慧慧从来不说伤人的话，总是温暖又真诚。大家都喜欢跟慧慧说话，也学着她，说话越来越温和、越来越会鼓励人了。\n\n慧慧还说:"如果实在没有好话说，那就不说伤人的话。\'良言一句三冬暖，恶语伤人六月寒\'嘛。"\n\n慧慧告诉大家:说话要考虑别人的感受，多说鼓励、温暖的话，少说伤人的话。同样的意思，温和地说、先肯定优点再提建议，别人爱听，还能帮到别人;而尖刻、难听的话，会深深伤害别人。良言一句三冬暖，恶语伤人六月寒。学会好好说话、说暖心的话，你会受人欢迎，也会给别人带来温暖和力量。'
},
{
  id: 'huihui_59',
  title: '【慧慧的中班故事】第五十九集：慧慧的溶解实验',
  category: '慧慧',
  content: '慧慧喝糖水的时候发现，糖放进水里，搅一搅，就不见了，但水变甜了。"糖去哪儿了呢?"慧慧很好奇。\n\n她做起了实验:往水里放糖，搅拌，糖慢慢"消失"了，但水变甜了——"糖溶解在水里了!"往水里放盐，也溶解了，水变咸了。\n\n但是，她发现有的东西不溶解:往水里放沙子，搅了半天，沙子还是沙子，沉在底下;放小石头，也不溶解。\n\n慧慧发现:"有的东西能溶解在水里，像糖、盐;有的不能，像沙子、石头。"\n\n她还发现:热水比冷水溶解得快!同样的糖，放在热水里搅一搅很快就化了，放在冷水里化得慢。"温度高，溶解得快!"\n\n慧慧把这些发现分享给大家，还带大家做溶解实验。大家试着溶解糖、盐、沙子，观察哪些能溶解、哪些不能，玩得开心，也学到了知识。\n\n李老师赞叹:"慧慧从喝糖水都能发现科学!她明白了溶解的现象，还发现了热水溶解快。这种爱观察、爱思考、爱实验的精神真棒!"\n\n慧慧说:"生活里到处是科学。喝糖水、冲奶粉、化盐，都用到溶解。多问\'为什么\',多动手试一试，就能明白好多道理。"\n\n慧慧告诉大家:生活中处处有科学。有的东西能溶解在水里（像糖、盐），有的不能（像沙子、石头），而且热水溶解得更快。从喝糖水这样的小事，用心观察、动手实验、思考"为什么",就能发现溶解这样有趣的科学道理。保持好奇心，把生活当成实验室，你会发现学习科学原来这么有趣，世界这么奇妙。'
},
{
  id: 'huihui_60',
  title: '【慧慧的中班故事】第六十集：慧慧的好人缘',
  category: '慧慧',
  content: '慧慧在班里人缘特别好，大家都喜欢她、愿意跟她做朋友。\n\n为什么呢？小朋友们说:\n\n乐乐说:"慧慧乐于助人，我有困难她总帮我。"朵朵说:"慧慧会倾听，听我说话最认真。"小美说:"慧慧说话温和，从不说伤人的话，还总鼓励我。"壮壮说:"慧慧公平，分东西、当裁判都很公正。"豆豆说:"我刚来的时候害怕，是慧慧第一个安慰我、帮助我。"\n\n大家你一言我一语，说了好多慧慧的好。\n\n李老师总结:"慧慧人缘好，不是偶然的。她善良、乐于助人、诚实、公平、会倾听、说话温和、懂得分享和谦让。她用真心对待每一个人，所以大家都真心喜欢她。"\n\n慧慧听了，谦虚地说:"其实我也在向大家学习呀。每个小朋友都有优点，我们互相帮助、互相学习，一起进步。有这么多好朋友，我特别幸福。"\n\n慧慧从不因为人缘好就骄傲。她依然真诚地对待每一个人，帮助需要帮助的人，还常常主动关心别人。\n\n李老师对全班说:"想要有好人缘、有好朋友，就要像慧慧一样——善良、真诚、乐于助人、尊重别人。你怎么对待别人，别人就怎么对待你。用心待人，就能收获真挚的友谊。"\n\n小朋友们都点点头，决心向慧慧学习，做一个善良、友好的人。\n\n慧慧告诉大家:好人缘不是偶然的，是用真心换来的。善良、诚实、乐于助人、公平、会倾听、说话温和、懂得分享和谦让——用这样的品质真心对待每一个人，大家就会真心喜欢你、愿意跟你做朋友。你怎么对待别人，别人就怎么对待你。用爱心和真诚待人，就能收获满满的友谊和快乐。这是人生最宝贵的财富之一。'
},
{
  id: 'huihui_61',
  title: '【慧慧的中班故事】第六十一集：慧慧的时间管理',
  category: '慧慧',
  content: '幼儿园布置了几个小任务:画一幅画、背一首儿歌、做一个手工。慧慧安排得井井有条。\n\n有的小朋友一会儿画画、一会儿又去背儿歌、一会儿又做手工，跳来跳去，结果什么都没做好。\n\n慧慧不一样。她先做计划:"我先画画，画完再背儿歌，最后做手工。一件一件来，做完一件再做下一件。"\n\n她专心画画，画好了;然后专心背儿歌，背会了;最后专心做手工，做好了。因为一件一件专心地做，慧慧又快又好地完成了所有任务。\n\n李老师问:"慧慧，你怎么安排得这么好?"\n\n慧慧说:"做事情要一件一件来，不能跳来跳去。跳来跳去，每件事都做不好，还浪费时间。专心做完一件，再做下一件，反而又快又好。"\n\n慧慧还懂得先做重要的、着急的事:"如果有几件事，先做最重要、最着急的，再做其他的。"\n\n李老师表扬慧慧:"慧慧真会管理时间和安排事情!一件一件专心做，先做重要的，这样效率最高。"\n\n慧慧还说:"做事之前想一想顺序，做的时候专心一点，就能又快又好。这样还能省出时间玩呢!"\n\n小朋友们跟着慧慧学安排事情——先计划、按顺序、一件一件专心做。大家发现，这样做事又快又好，还不慌乱。\n\n慧慧告诉大家:做事情要会安排、会管理时间。不要跳来跳去，而要一件一件专心地做，做完一件再做下一件;有几件事的时候，先做最重要、最着急的。做事之前想想顺序，做的时候专心，就能又快又好地完成，还能省出时间。会管理时间、有条理地做事，是一种很重要的能力，能让你事半功倍。'
},
{
  id: 'huihui_62',
  title: '【慧慧的中班故事】第六十二集：慧慧的爱护公物',
  category: '慧慧',
  content: '慧慧特别爱护幼儿园的公共物品——桌椅、玩具、图书、设施，她都轻拿轻放、小心使用。\n\n坐椅子，她轻轻地拉、轻轻地坐，不用力拖拽（那样会磨坏地板、损坏椅子）;用玩具，她小心地玩，玩完放好;开关门，她轻轻地;用水龙头，用完拧紧。\n\n有的小朋友不爱护公物——用力拖椅子、摔玩具、在桌子上乱刻乱画。慧慧看到了，会提醒:"这些是大家共同用的东西，要爱护呀。弄坏了，大家就都不能用了。"\n\n有一次，慧慧发现一个玩具的螺丝松了，她主动报告老师:"李老师，这个玩具的螺丝松了，需要修一修，不然会坏的。"老师及时修好了玩具。\n\n李老师表扬慧慧:"慧慧真爱护公物，还会主动报告需要修理的地方。公共物品是大家的，爱护它们，大家才能一直用。"\n\n慧慧说:"桌椅、玩具、图书，都是大家一起用的。如果每个人都爱护，它们就能用很久，大家都受益;如果大家都不爱护、随意破坏，很快就都坏了，谁也用不成了。"\n\n在慧慧的带动下，小朋友们也开始爱护公物了。教室里的桌椅、玩具、图书都保护得很好，用了很久也不坏。\n\n慧慧告诉大家:公共物品是大家共同使用的，要好好爱护——轻拿轻放、小心使用、用完归位，发现损坏及时报告。爱护公物，它们才能用得长久，大家才能一直享用;随意破坏，很快就都坏了，谁也用不成。爱护公共财物，是每个人的责任和公德。人人爱护，我们的生活环境才会美好、便利。'
},
{
  id: 'huihui_63',
  title: '【慧慧的中班故事】第六十三集：慧慧的沉稳应对',
  category: '慧慧',
  content: '有一天，幼儿园里突然拉响了火灾演习的警报，"呜——呜——"响个不停。好多小朋友吓得慌了，有的哭，有的乱跑，乱成一团。\n\n慧慧虽然也有点紧张，但她想起了老师教的应对方法，冷静了下来。\n\n"大家别慌!"慧慧提醒身边的小朋友，"这是演习，我们按老师教的做——用手帕捂住口鼻，弯着腰，跟着老师，有秩序地走到安全的地方。不要乱跑，不要推挤。"\n\n慧慧带头，冷静地用手帕捂住口鼻，弯腰跟着队伍走。她的沉着影响了身边的小朋友，大家也慢慢冷静下来，跟着有序撤离。\n\n因为慧慧的提醒和示范，她身边的小朋友都没有乱，安全有序地撤到了操场。\n\n李老师表扬慧慧:"慧慧在警报响起、大家慌乱的时候，能保持冷静，还提醒和带动大家有序应对。这种沉着冷静，太重要了。"\n\n慧慧说:"遇到紧急情况，越慌越容易出事。要冷静下来，按平时学的方法应对。老师平时教我们的逃生方法，就是关键时刻用的。所以平时要认真学，遇事要冷静。"\n\n李老师还借这次演习，又给大家强调了火灾、地震等紧急情况的应对方法。慧慧听得最认真，还记在了心里。\n\n慧慧告诉大家:遇到紧急情况（比如火灾、地震），越慌越危险。要保持冷静，按平时学的方法应对——比如火灾时用手帕捂口鼻、弯腰、有序撤离，不推挤、不乱跑。平时要认真学习安全逃生知识，遇事才能沉着应对。冷静、沉着、掌握正确的方法，关键时刻能保护自己和他人的安全。安全知识和冷静的头脑，是最重要的护身法宝。'
},
{
  id: 'huihui_64',
  title: '【慧慧的中班故事】第六十四集：慧慧的诚实借还',
  category: '慧慧',
  content: '慧慧向朵朵借了一支很漂亮的彩色笔用。用的时候，她一不小心把笔尖摔坏了一点。\n\n慧慧没有隐瞒，也没有假装不知道。她主动告诉朵朵:"朵朵，对不起，我用你的笔的时候，不小心把笔尖摔坏了一点。我赔你一支新的。"\n\n朵朵看了看笔，说:"没关系，还能用呢。你能主动告诉我，我很高兴。"\n\n但慧慧还是坚持:"是我弄坏的，我应该负责。虽然还能用，但不如原来好了。我用零花钱赔你一支一样的吧。"\n\n慧慧用自己的零花钱，给朵朵买了一支一样的新彩色笔。\n\n朵朵很感动:"慧慧，你太诚实、太负责了!其实真的没关系的，但你这么有诚意，我们的友谊更好了。"\n\n李老师听说了，表扬慧慧:"慧慧借东西弄坏了，主动承认、主动赔偿，一点都不隐瞒。这种诚实和负责任的态度，太可贵了。"\n\n慧慧说:"借了别人的东西，就要爱护;万一弄坏了，要诚实地告诉人家、负责任地赔偿或弥补。不能隐瞒、不能装作不知道。这样别人才会信任我，才愿意再借东西给我。"\n\n正因为慧慧诚实、负责，大家都很信任她，都愿意把东西借给她。\n\n慧慧告诉大家:借了别人的东西要爱护;万一不小心弄坏了，要诚实地告诉对方，主动承担责任、赔偿或弥补，不能隐瞒。诚实和负责，会赢得别人的信任和尊重。一个借东西爱护、弄坏了诚实负责的人，大家才愿意继续帮助他、信任他。诚信，是人与人交往的基础，从借还东西这样的小事做起。'
},
{
  id: 'huihui_65',
  title: '【慧慧的中班故事】第六十五集：慧慧的光影游戏',
  category: '慧慧',
  content: '晚上，慧慧在灯光下发现，把手放在灯和墙之间，墙上会出现手的影子。她动动手指，影子也动，特别有趣。\n\n慧慧研究起了光和影:"有光被挡住，就会有影子。手挡住光，墙上就有手的影子。"\n\n她还发现:手离灯近，影子大;手离灯远，影子小。"原来影子的大小会变!"\n\n慧慧灵机一动，用手做出各种形状——用手做出小狗、小兔子、老鹰的影子，投在墙上，栩栩如生。这就是"手影戏"!\n\n慧慧把手影戏表演给小朋友们看，大家惊叹不已，也跟着学。用两只手，能做出好多小动物的影子，大家玩得可开心了。\n\n慧慧还解释:"影子是因为光被挡住形成的。物体离光源近，影子就大;离得远，影子就小。皮影戏就是用这个原理做的呢。"\n\n李老师赞叹:"慧慧真会玩、真会学!她研究了光和影的原理，还表演了手影戏，把科学变成了艺术，太有创意了!"\n\n小朋友们跟着慧慧玩手影、研究光影，既学了科学，又收获了乐趣。\n\n慧慧告诉大家:光和影里藏着有趣的科学——有光被物体挡住就会形成影子，物体离光近影子大、离光远影子小。用手挡光，还能做出各种小动物的手影戏。多观察、多动手、多思考，就能发现光影的奥秘，还能玩出艺术。科学和艺术是相通的，带着好奇心和创造力去探索，你会发现学习充满了乐趣和惊喜。'
},
{
  id: 'huihui_66',
  title: '【慧慧的中班故事】第六十六集：慧慧的谦虚好学',
  category: '慧慧',
  content: '慧慧虽然懂得很多、很能干，但她从不觉得自己什么都会，反而特别谦虚好学。\n\n看到壮壮跑步快，慧慧就向壮壮请教:"壮壮，你跑得真快，能教教我怎么跑得快吗?"看到乐乐折纸厉害，慧慧就跟乐乐学:"乐乐，这个纸飞机你折得真好，教教我好吗?"看到朵朵唱歌好听，慧慧就向朵朵学唱歌。\n\n慧慧总是发现别人的长处，虚心地向别人学习。她说:"每个人都有我值得学习的地方。三人行，必有我师。向别人学习，我就能学到更多本领。"\n\n正因为谦虚好学，慧慧的本领越来越多——她跟壮壮学会了跑得更快，跟乐乐学会了折各种纸，跟朵朵学会了唱歌……\n\n而且，慧慧向别人请教，让被请教的小朋友也很开心、很有成就感。大家都愿意教慧慧，跟她的关系也更好了。\n\n李老师表扬慧慧:"慧慧懂得这么多，还这么谦虚好学，真难得!谦虚的人才能不断进步，骄傲的人会停止成长。"\n\n慧慧说:"学无止境呀。世界上有那么多知识和本领，我懂的只是一点点。保持谦虚，向每个人学习，我才能不断进步。"\n\n小朋友们发现，慧慧越优秀越谦虚，越谦虚越优秀。大家都被她的好学精神感染，也变得爱学习、爱互相请教了。\n\n慧慧告诉大家:要谦虚好学。就算懂得很多、很能干，也不要骄傲，因为世界上的知识和本领无穷无尽，每个人都有值得我们学习的长处。三人行，必有我师。发现别人的优点、虚心向别人请教，就能不断学到新本领。谦虚使人进步，骄傲使人落后。保持一颗谦虚好学的心，你会成长得越来越优秀。'
},
{
  id: 'huihui_67',
  title: '【慧慧的中班故事】第六十七集：慧慧的钱币认识',
  category: '慧慧',
  content: '李老师教大家认识钱币——一元、五角、一角，还有硬币和纸币。慧慧学得又快又好。\n\n她不但认识了钱币，还学会了简单的换算:"一元等于两个五角，一元等于十个一角。"\n\n慧慧还知道了钱的用处和来之不易:"钱是爸爸妈妈工作赚来的，很辛苦。买东西要用钱，所以要节约，不能乱花。"\n\n李老师做了个"小超市"游戏，让大家用玩具钱币"买东西"。慧慧买东西的时候，会算清楚:"这个东西五角，我给一元，应该找我五角。"她算得又快又对。\n\n有小朋友把钱算错了，慧慧还帮忙:"你买的东西一共八角，你给了一元，应该找你两角哦。"\n\n李老师表扬慧慧:"慧慧认识钱币，还会算账、找钱，真棒!认识钱、会用钱、懂得钱来之不易，是很有用的生活本领。"\n\n慧慧说:"认识钱、会算账，买东西就不会算错、不会吃亏。而且知道钱是爸爸妈妈辛苦赚来的，就更懂得节约、不乱花钱了。"\n\n慧慧还懂得合理用钱:"该花的花，不该花的不花。买有用的东西，不乱买没用的。还可以存一部分钱。"\n\n小朋友们跟着慧慧学认钱、算账，玩"小超市"游戏，既学了知识，又懂得了节约和珍惜。\n\n慧慧告诉大家:认识钱币、学会简单的算账和找钱，是很有用的生活本领。买东西能算清楚，就不会吃亏。而且要知道，钱是爸爸妈妈辛苦工作赚来的，来之不易，所以要节约、合理使用——买有用的东西，不乱花，还可以存一些。懂得钱的价值、会理性用钱，从小养成节约的好习惯，长大才会更懂得珍惜和规划。'
},
{
  id: 'huihui_68',
  title: '【慧慧的中班故事】第六十八集：慧慧的耐心等待',
  category: '慧慧',
  content: '慧慧种了一颗凤仙花的种子，天天盼着它开花。可是，种子发芽、长叶、长高，过了好久好久都还没开花。\n\n有的小朋友种了花，看几天不开花就不耐烦了，不管了，结果花也没养活。\n\n慧慧却很有耐心。她每天认真地浇水、晒太阳、拔草，耐心地照顾，一点都不着急。"花开需要时间，急不来。我好好照顾它，它总会开花的。"\n\n慧慧一边耐心等待，一边观察记录花的变化。虽然还没开花，但她发现花苞一天天变大，充满了期待。\n\n终于，有一天早上，慧慧惊喜地发现——凤仙花开了!红红的花朵，特别漂亮!\n\n"开花啦!开花啦!"慧慧高兴极了。她耐心照顾了这么久，终于等到了花开。\n\n李老师表扬慧慧:"慧慧真有耐心!养花需要时间，她不着急、不放弃，耐心照顾，终于等到了花开。这份耐心，太可贵了。"\n\n慧慧说:"好多美好的事情，都需要耐心等待。花开需要时间，种子长大需要时间，学本领也需要时间。着急没用，放弃更不行。耐心地努力、耐心地等待，美好的结果自然会来。"\n\n小朋友们看到慧慧的花开了，都很羡慕，也明白了耐心的重要。那些没耐心的小朋友，重新开始耐心地照顾自己的花。\n\n慧慧告诉大家:好多美好的事情都需要耐心等待——花开、种子长大、学会本领，都急不来。着急、放弃都不行，要耐心地努力、耐心地等待。就像养花，天天照顾、耐心守候，终会等到花开。生活中很多事情也是这样，只要有耐心、肯坚持，美好的结果终会到来。耐心，是一种可贵的品质，能让你收获成功和惊喜。'
},
{
  id: 'huihui_69',
  title: '【慧慧的中班故事】第六十九集：慧慧的合理安排',
  category: '慧慧',
  content: '放假了，慧慧给自己安排了充实又快乐的假期生活。\n\n她没有整天看电视、玩游戏，也没有整天只是玩。慧慧合理安排:"每天上午看一会儿书、画会儿画，学点东西;下午出去运动、玩耍;还要帮爸爸妈妈做点家务;看电视、玩游戏只玩一小会儿。"\n\n她把每天的时间安排得井井有条:学习、运动、玩耍、休息、帮忙，样样都有，劳逸结合。\n\n有的小朋友假期里要么整天玩、要么整天看电视，结果开学后什么都忘了，还养成了坏习惯。而慧慧的假期过得充实又快乐，还学到了新东西、锻炼了身体。\n\n妈妈表扬慧慧:"慧慧假期安排得真好!学习、运动、玩耍、休息都有，劳逸结合，过得又充实又快乐。"\n\n慧慧说:"假期要合理安排，不能整天只玩或者只看电视。学一点、玩一点、动一动、帮帮忙，这样既放松了，又有收获，还养成了好习惯。"\n\n开学后，慧慧不但没落下，还学了新本领、身体更棒了、更懂事了。老师和同学都夸她假期过得有意义。\n\n慧慧还把安排假期的方法分享给大家，帮小朋友们也制定了充实的假期计划。\n\n慧慧告诉大家:假期要合理安排，做到劳逸结合。不能整天只玩、只看电视，也不能一直学习。安排好学习、运动、玩耍、休息、帮忙做家务的时间，让假期既放松又有收获。合理安排时间、劳逸结合、养成好习惯，假期才能过得充实、快乐又有意义。会安排生活的人，无论假期还是平时，都能过得井井有条、丰富多彩。'

{
  id: 'huihui_70',
  title: '【慧慧的中班故事】第七十集：慧慧的勇敢发言',
  category: '慧慧',
  content: '幼儿园请来了一位客人，给小朋友们讲故事，讲完后问:"谁愿意上来说说自己听到了什么、有什么感想?"\n\n好多小朋友都不敢举手，怕说不好、怕难为情。\n\n慧慧虽然也有点紧张，但她勇敢地举起了手。她走到前面，大方地、清楚地讲了自己听到的故事内容和感想，还说得很有条理。\n\n客人和老师都为慧慧鼓掌:"这个小姑娘真勇敢，说得又清楚又有条理!"\n\n慧慧回到座位，鼓励其他小朋友:"别怕，勇敢说出来就好。说得好不好没关系，重要的是敢于表达。"\n\n在慧慧的带动下，又有几个小朋友鼓起勇气举手发言了。\n\n李老师表扬慧慧:"慧慧敢于在大家面前发言，还说得清楚有条理。这种勇气和表达能力，是锻炼出来的。而且她还鼓励别人，真好。"\n\n慧慧说:"敢于表达自己的想法，是很重要的。刚开始可能会紧张、会说不好，但多锻炼几次就好了。如果因为害怕就不敢说，那永远也锻炼不了、进步不了。"\n\n慧慧平时就爱思考、敢表达，所以发言的时候又自信又有条理。她还告诉大家:"想说好，可以先想清楚要说什么，理清顺序，然后大方地、清楚地说出来。"\n\n小朋友们受到慧慧的鼓励，也越来越敢于表达自己了。\n\n慧慧告诉大家:要勇敢地表达自己的想法。在大家面前发言，刚开始会紧张、会怕说不好，这很正常。但不能因为害怕就不敢说——那样永远得不到锻炼。勇敢地举手、大方地表达，多锻炼几次就会越来越好。说之前想清楚内容和顺序，说的时候大方清楚。敢于表达、善于表达，是很重要的能力。勇敢迈出第一步，你会越来越自信。'
},
{
  id: 'huihui_71',
  title: '【慧慧的中班故事】第七十一集：慧慧的爱心传递',
  category: '慧慧',
  content: '慧慧帮助过很多小朋友。慢慢地，她发现了一件温暖的事:被她帮助过的小朋友，也开始去帮助别人了。\n\n慧慧帮豆豆融入了集体，后来豆豆也去帮助新来的小朋友;慧慧教乐乐系鞋带，后来乐乐也教别的不会系鞋带的小朋友;慧慧安慰过哭泣的朵朵，后来朵朵也会安慰难过的同学。\n\n慧慧发现:"原来，爱心是可以传递的!我帮助了别人，别人也会去帮助更多的人。就像一盏灯点亮另一盏灯，越来越亮。"\n\n有一天，慧慧不小心摔倒了，好几个小朋友都跑过来扶她、关心她——正是那些她曾经帮助过的小朋友。\n\n慧慧心里暖暖的:"我帮助别人，别人也来帮助我。爱心真的会回来呢。"\n\n李老师看到这温暖的一幕，对全班说:"你们看，慧慧播下的爱心种子，长成了一片爱心的森林。她帮助别人，别人学着她也帮助更多人，最后大家又一起关心慧慧。这就是爱的传递和回报。"\n\n慧慧说:"帮助别人，不但让别人快乐，还会让爱心传递下去，让更多人得到温暖。而且，你帮助别人，别人也会在你需要的时候帮助你。爱出者爱返。"\n\n在慧慧的影响下，班里充满了互相帮助、互相关爱的温暖气氛。大家都乐于助人，班级像一个温暖的大家庭。\n\n慧慧告诉大家:爱心是可以传递的。你帮助别人，别人会感受到温暖，也会去帮助更多的人，就像一盏灯点亮另一盏灯。而且，你真心帮助别人，别人也会在你需要时帮助你——爱出者爱返。多一份爱心、多一份帮助，世界就多一份温暖。让我们都做传递爱心的人，让爱和温暖传遍每一个角落。'

{

  category: '慧慧',
  content: '做事情的时候，慧慧特别专注。画画的时候，她专心画画，不东张西望;看书的时候，她专心看书，不受周围影响;搭积木的时候，她专心搭，一点都不分心。\n\n正因为专注，慧慧做事情又快又好。她画的画很精细，看的书记得牢，搭的积木又高又稳。\n\n有的小朋友做事总是分心——画着画着就去玩别的，看着书就走神，搭积木搭一半又跑了。结果什么都做不好。\n\n小朋友问:"慧慧，你怎么能这么专心呀?"\n\n慧慧说:"做事情的时候，我就告诉自己\'现在只做这一件事\',把注意力都放在上面，不去想别的、不去看别的。专心做，才能做好，还做得快。"\n\n慧慧还有个方法:"做事之前，先把会分心的东西收起来——比如画画时把玩具收好。这样就不容易分心了。"\n\n李老师表扬慧慧:"慧慧做事真专注!专注是一种很重要的能力。专心做一件事，才能做好、做快。三心二意，什么都做不成。"\n\n慧慧说:"专注就像用放大镜聚集阳光——注意力集中在一点，力量就大。做事分心，效果就差。"\n\n在慧慧的带动下，小朋友们也开始练习专注了——做事的时候专心一点，不分心。大家发现，专注地做事，效果好多了。\n\n慧慧告诉大家:做事情要专注。把注意力集中在正在做的事情上，不东张西望、不三心二意，才能做得又快又好。可以告诉自己"现在只做这一件事",还可以把会分心的东西先收起来。专注是一种重要的能力，专心做事的人，学得快、做得好。培养专注力，你会发现学习和做事都变得更高效、更有成就感。'
},
{
  id: 'huihui_73',
  title: '【慧慧的中班故事】第七十三集：慧慧的节日礼物',
  category: '慧慧',
  content: '母亲节到了，慧慧想给妈妈准备一份礼物。她没有让爸爸买贵重的东西，而是决定自己动手做。\n\n慧慧用彩纸和自己的巧手，做了一朵漂亮的花，还画了一张卡片，写上（画上）"妈妈，我爱你，谢谢你照顾我"。她还偷偷练习，学会了给妈妈捶背、倒水。\n\n母亲节那天，慧慧把自己做的花和卡片送给妈妈，还给妈妈捶背、倒水，说:"妈妈，节日快乐!谢谢你一直照顾我、爱我。"\n\n妈妈感动得眼睛都湿润了:"慧慧，这是妈妈收到的最好的礼物!你自己动手做的、饱含心意的礼物，比任何贵重的东西都珍贵。"\n\n慧慧说:"礼物不在于贵不贵，而在于有没有心意。我自己做的、用心准备的，才最能表达我对妈妈的爱。"\n\n慧慧还在其他节日用心准备:父亲节给爸爸做礼物，教师节给老师做贺卡，重阳节给爷爷奶奶表演节目。她的礼物都不贵，但都饱含真心，大家都特别喜欢、特别感动。\n\n李老师表扬慧慧:"慧慧懂得用心表达爱和感恩，自己动手做礼物，这份心意最珍贵。懂得感恩、会表达爱，是很美好的品质。"\n\n小朋友们也学着慧慧，用心为家人、老师准备饱含心意的礼物。\n\n慧慧告诉大家:表达爱和感恩，礼物不在于贵重，而在于心意。自己动手做的礼物——一朵纸花、一张贺卡、一个拥抱、帮忙做点事，虽然不贵，却饱含真心，最能打动人。懂得在节日里向家人、老师表达爱和感恩，用心准备饱含心意的礼物，是一种美好的品质。真心和爱，是最珍贵的礼物。'

{
  id: 'huihui_74',
  title: '【慧慧的中班故事】第七十四集：慧慧的问题清单',
  category: '慧慧',
  content: '慧慧有个好习惯——爱提问题。她的小脑袋里总有好多"为什么"。\n\n"天为什么是蓝的?""鱼为什么能在水里呼吸?""月亮为什么会变圆变缺?""彩虹是怎么来的?"\n\n慧慧把想到的问题记在一个小本子上，做成"问题清单"。有的问题她问老师，有的问爸爸妈妈，有的自己看书找答案，有的通过观察和实验去发现。\n\n每弄懂一个问题，慧慧就在本子上打个勾，特别有成就感。她的知识越来越丰富，懂得越来越多。\n\n小朋友问:"慧慧，你怎么懂这么多呀?"\n\n慧慧说:"因为我爱问\'为什么\'呀。遇到不懂的，就问、就查、就想办法弄明白。问题弄懂得越多，懂得就越多。"\n\n李老师表扬慧慧:"慧慧爱思考、爱提问，还想办法找答案。\'好问\'是一种非常好的学习习惯。爱问问题的孩子，脑子灵、懂得多。"\n\n慧慧鼓励大家:"遇到不懂的，别放过，要问、要查、要想。每弄懂一个问题，就多一份知识。不懂不可耻，不问才可惜。"\n\n在慧慧的带动下，小朋友们也爱提问了。大家有了问题就问老师、问家长、查书，学到了好多知识，脑子也越来越灵活。\n\n慧慧告诉大家:要养成爱提问、爱思考的好习惯。遇到不懂的、好奇的，就多问几个"为什么",然后通过问老师、问家长、看书、观察、实验去找答案。每弄懂一个问题，就多一份知识。不懂不可耻，不问才可惜。保持好奇心、勤于提问和思考，你会懂得越来越多，变得越来越聪明。学习，就是从一个个"为什么"开始的。'

  title: '【慧慧的中班故事】第七十七集：慧慧的巧记方位',

  content: '李老师教大家认识方位——上下、前后、左右。有的小朋友总是分不清左右。\n\n慧慧却分得清清楚楚。她有个好办法记左右:"我用右手拿勺子吃饭、拿笔写字，所以拿勺子的这只手就是右手，另一只就是左手。"\n\n她还教分不清的小朋友:"你平时用哪只手拿筷子、拿勺子，那只就是右手。记住了右手，左手就知道了。"\n\n小朋友们用这个方法，很快就分清左右了。\n\n慧慧还把方位知识用在生活里:"排队站在乐乐的左边""把书放在桌子的右上角""球在椅子下面"……她说得清清楚楚，做得准准的。\n\n慧慧还发现方位很有用:"知道方位，才能听懂别人的指路——\'往前走，在左边\';才能把东西放对地方;做操的时候，才知道往左还是往右。"\n\n李老师表扬慧慧:"慧慧分清了方位，还想出好办法教大家。认识方位是很有用的本领，在生活中处处能用到。"\n\n慧慧说:"分不清左右没关系，用\'拿勺子的手是右手\'这个办法，很快就记住了。学东西要找窍门、找方法。"\n\n小朋友们跟着慧慧学分方位，都学会了，觉得慧慧的办法真好用。\n\n慧慧告诉大家:认识方位——上下、前后、左右，是很有用的本领。分不清左右，可以用"拿勺子、拿笔的手是右手"这个方法来记。认识了方位，就能听懂指路、把东西放对地方、做操分清方向。学东西要找窍门、找好方法，就能学得又快又牢。掌握了方位知识，生活和学习都更方便。多观察、多联系生活，知识就活起来了。'

{
  id: 'huihui_78',
  title: '【慧慧的中班故事】第七十八集：慧慧的宽容大度',
  category: '慧慧',
  content: '有一次，一个小朋友不小心打翻了慧慧辛辛苦苦搭的积木城堡。那个小朋友很紧张，以为慧慧会生气。\n\n可是慧慧一点都没生气。她笑着说:"没关系，你不是故意的。积木倒了可以重新搭嘛。"\n\n那个小朋友松了口气，很感激:"慧慧，对不起，我不是故意的。谢谢你不生气。我帮你一起重新搭吧!"\n\n于是两个人一起重新搭城堡，还搭得比原来更漂亮，成了好朋友。\n\n还有一次，一个小朋友说话不小心得罪了慧慧，慧慧也没有斤斤计较，宽容地一笑而过。\n\n慧慧总是很宽容大度。别人无心的过失，她都能原谅;别人的小毛病，她能包容。她说:"每个人都会有不小心、做得不好的时候。多一份宽容和理解，大家相处才愉快。斤斤计较，只会伤了和气、让自己也不开心。"\n\n正因为宽容大度，慧慧从不跟人闹别扭、结怨。大家都喜欢跟她相处，觉得跟她在一起特别舒服、特别放松。\n\n李老师表扬慧慧:"慧慧宽容大度，别人无心之失她能原谅、能包容。这种胸怀，让她人缘特别好，也让自己心情愉快。"\n\n慧慧说:"宽容别人，其实也是善待自己。老是计较、生气，自己也不开心。多一份理解和包容，大家都轻松愉快。"\n\n小朋友们都被慧慧的宽容感染，也变得大度、不斤斤计较了，班里的气氛更和谐了。\n\n慧慧告诉大家:要宽容大度。别人无心的过失、小小的毛病，要多一份理解和包容，不斤斤计较。每个人都会有不小心、做不好的时候。宽容别人，既让大家相处愉快，也让自己心情舒畅;斤斤计较，只会伤和气、自己也不开心。宽容是一种胸怀、一种智慧。心胸宽广、大度待人，你会收获好人缘和好心情，生活也更美好。'
},
{
  id: 'huihui_79',
  title: '【慧慧的中班故事】第七十九集：慧慧教弟弟妹妹',
  category: '慧慧',
  content: '幼儿园里，中班的慧慧成了小班弟弟妹妹们喜欢的"小老师"。\n\n小班的弟弟妹妹很多本领还不会——不会系鞋带、不会自己吃饭、不会收拾玩具。慧慧就耐心地教他们。\n\n她教小弟弟系鞋带，手把手地、一遍一遍地教，不厌其烦;教小妹妹自己用勺子吃饭，鼓励她"你真棒，能自己吃啦";教弟弟妹妹们收拾玩具，还编成了儿歌"玩具玩具排排队，玩完送它回家去"。\n\n慧慧教得特别有耐心，从不嫌弃弟弟妹妹学得慢。弟弟妹妹们都特别喜欢这个又温柔又有本领的大姐姐。\n\n慧慧说:"我也是从小班过来的，那时候什么都不会，多亏了大哥哥大姐姐教我、帮我。现在我长大了、有本领了，也要去帮助更小的弟弟妹妹。"\n\n在慧慧的帮助下，好多小班的弟弟妹妹学会了系鞋带、自己吃饭、收拾玩具，进步很大。\n\n李老师表扬慧慧:"慧慧真是个好姐姐、好\'小老师\'!她耐心地教弟弟妹妹本领，把自己学到的传递下去。这份耐心和爱心，太可贵了。"\n\n慧慧说:"教别人，其实自己也更熟练了。而且看到弟弟妹妹学会本领，我特别有成就感、特别开心。帮助别人成长，是一件很快乐的事。"\n\n慧慧的行为带动了其他中班的小朋友，大家都开始去帮助、教导小班的弟弟妹妹，幼儿园里充满了互帮互助的温暖。\n\n慧慧告诉大家:自己学会了本领，可以去教更小的弟弟妹妹，把知识和本领传递下去。教别人要有耐心、有爱心，不嫌弃别人学得慢。帮助弟弟妹妹成长，不但让他们进步，自己也更熟练、更有成就感。互帮互助、传递本领和爱心，让大家一起成长。做一个乐于助人、耐心温暖的大哥哥大姐姐，是一件特别有意义、特别快乐的事。'
},
{

  content: '时间过得真快，慧慧在中班度过了充实而快乐的一年，马上要升大班了。\n\n回想这一年，慧慧学到了好多好多，也成长了好多。\n\n她更聪明了——爱观察、爱思考、爱提问、爱探索，懂得了好多知识和道理，掌握了好多学习和生活的本领。\n\n她更自律了——管好自己的时间和物品，做事有计划、有条理，能抵挡诱惑、坚持好习惯。\n\n她更勇敢了——不怕黑、不怕困难、敢于表达、遇事冷静，还能拒绝危险、保护自己。\n\n她更机智了——遇到问题会动脑筋、想办法，用智慧解决了一个又一个难题。\n\n她还更善良了——乐于助人、懂得分享和谦让、有爱心、会关心和照顾别人、传递爱心。\n\n李老师在学期末对大家说:"慧慧这一年，是我们大家学习的好榜样。她聪明、自律、勇敢、机智、善良，还谦虚好学、不骄不躁。更难得的是，她不但自己优秀，还带动、帮助大家一起进步。"\n\n全班响起了热烈的掌声。\n\n慧慧站起来，谦虚地说:"谢谢老师和同学们。其实我也还有很多要学习、要努力的地方。而且，我的成长离不开大家——是老师教导我，是同学们陪伴我、帮助我。我们是互相学习、一起进步的。升大班后，我会继续努力，做更好的自己，也希望能继续和大家一起成长。"\n\n小朋友们都说:"慧慧，我们一起进步!"\n\n放学回家，慧慧对妈妈说:"妈妈，我要升大班了。这一年我学到了好多、成长了好多。"\n\n妈妈欣慰地抱住她:"慧慧真的长大了、越来越优秀了。妈妈为你骄傲。更让妈妈开心的是，你优秀又谦虚、能干又善良，还愿意帮助大家。这些好品质，会陪伴你一生。"\n\n慧慧甜甜地笑了。她看着窗外，心里充满了对未来的期待。她知道，成长是没有终点的。升了大班，会有新的知识要学、新的挑战要面对、新的本领要掌握。但她有信心——只要保持聪明好学、自律勇敢、机智善良、谦虚努力，就能不断成长，成为一个越来越好的人。\n\n明天，又是充满希望的新一天。慧慧带着这一年的收获和成长，带着满满的自信和爱，迎接新的旅程。'
},
{

  content: '新学期，班里来了好多新同学。名字太多了，好多小朋友都记不住谁是谁。\n\n慧慧却有办法。她认真观察每个新同学的特点，然后把名字和特点联系起来记。\n\n爱笑的小朋友叫"乐乐"——她就记"爱笑的乐乐"；个子高的叫"高高"——"个子高高";戴眼镜的叫"明明"——"眼睛亮亮的明明"。\n\n没过几天，慧慧就记住了全班每个同学的名字，还能叫出来。\n\n新同学们都很惊讶："慧慧，你怎么这么快就记住我们的名字啦？"\n\n慧慧笑着说："我把你们的名字和你们的特点联系起来记。比如乐乐爱笑，我就记\'爱笑的乐乐\'。这样就记得又快又牢。"\n\n李老师也夸慧慧："慧慧真会动脑筋，用\'联想\'的方法记名字，又快又准。"\n\n被慧慧准确地叫出名字，新同学们都感到很温暖，很快就跟慧慧成了朋友。\n\n有个新来的小朋友害羞地说："慧慧，你第一个记住我的名字，我好开心。我觉得我在这里有朋友了。"\n\n慧慧还把记名字的方法教给了大家。小朋友们学着用"联想法",也慢慢记住了彼此的名字。班里大家互相叫得出名字，感情更好了。\n\n慧慧告诉大家：记东西不要死记硬背，找到好方法，把要记的东西和熟悉的、有特点的东西联系起来，就能记得又快又牢。而且，记住别人的名字、叫出别人的名字，是对别人的尊重和关心，能让人感到温暖。'
},
{

{
  id: 'huihui_83',
  title: '【慧慧的中班故事】第八十三集：慧慧的分类游戏',
  category: '慧慧',
  content: '李老师把一大盒混在一起的东西倒在桌上——有积木、蜡笔、纽扣、小珠子、贴纸，乱七八糟的。"谁能又快又好地把它们整理好？"\n\n好多小朋友一样一样地拿，拿了这个忘了那个，整理得又慢又乱。\n\n慧慧却想了个好办法。她先准备了几个小盒子，然后说："我们按种类来分！积木放一盒，蜡笔放一盒，纽扣放一盒，珠子放一盒，贴纸放一盒。"\n\n慧慧一边拿一边分类，积木归积木，蜡笔归蜡笔。很快，乱七八糟的东西就被分得整整齐齐，每一盒都是一类东西。\n\n"哇，慧慧整理得又快又整齐！"小朋友们都佩服。\n\n李老师问："慧慧，你为什么整理得这么快？"\n\n慧慧说："因为我先分类呀。把一样的东西放在一起，找起来、用起来都方便。要是全混在一起，就又乱又难找。"\n\n李老师说："这就是\'分类\'的方法！科学家研究东西，图书馆放书，超市摆商品，都用分类。慧慧真会动脑筋。"\n\n慧慧还发现，分类以后好处多多：找东西快，因为知道在哪一类里找;数数也方便，一类一类地数。\n\n她把分类的方法用到了生活里：书包里，书和文具分开放;玩具箱里，不同的玩具分格放;连画画的蜡笔，她都按颜色排好。\n\n慧慧告诉大家：分类是个好方法。把同一类的东西放在一起，不管是整理、寻找还是数数，都会变得又快又方便。学会分类，能让我们做事更有条理、更有效率。生活中处处都能用到分类的智慧。'

  title: '【慧慧的中班故事】第八十五集：慧慧的天气小观察',
  category: '慧慧',
  content: '慧慧喜欢观察天气。每天早上，她都会看看天空——今天是晴天、阴天，还是要下雨。\n\n有一天早上，慧慧发现天空乌云密布，空气闷闷的，蜻蜓飞得很低，蚂蚁在搬家。\n\n"这些都是要下雨的信号！"慧慧想起了自己观察和看书学到的知识。\n\n她提醒李老师："李老师，今天可能要下雨，我们户外活动是不是带上伞，或者早点回教室？"\n\n李老师看了看天，觉得慧慧说得有道理。果然，户外活动刚结束，大雨就哗啦啦地下起来了。因为提前有准备，小朋友们都没被淋到。\n\n"多亏了慧慧的提醒！"李老师表扬她，"慧慧真会观察天气。"\n\n慧慧还给大家分享了她的天气小知识："燕子低飞、蚂蚁搬家、蜻蜓贴地飞，是要下雨了。""早上天边红彤彤的，可能有雨；晚上天边红，第二天多是好天气。""天上鱼鳞斑一样的云，多半是好天气。"\n\n小朋友们听得津津有味，也开始学着观察天气。\n\n慧慧每天还会根据天气提醒大家穿什么衣服："今天降温了，要多穿一件。""今天出太阳了，可以少穿点。"\n\n慢慢地，慧慧成了班里的"小小天气预报员"。大家都爱听她说天气。\n\n李老师说："慧慧通过观察大自然，学到了这么多知识，还能用来帮助大家，真了不起。大自然就是一本读不完的书。"\n\n慧慧告诉大家：大自然里藏着好多知识和规律。只要用心观察天空、云彩、小动物，就能发现天气的秘密。多观察、多思考、多积累，你懂得的就会越来越多。留心生活，处处都有学问。'
},
{
  id: 'huihui_86',
  title: '【慧慧的中班故事】第八十六集：慧慧不乱花钱',
  category: '慧慧',
  content: '学校门口有个小摊，卖各种花花绿绿的小玩具、小零食。好多小朋友一有零花钱就去买，买回来的小玩具没玩几下就坏了，零食吃了对牙齿也不好。\n\n慧慧路过的时候，也很想买。那些小玩具看着真好看。但她停下来想了想："这个玩具看着好看，但是很容易坏，买回去玩两下就扔了，是不是浪费钱呢？"\n\n慧慧摸了摸口袋里的零花钱，决定不买那些没用的小玩意。\n\n有小朋友问："慧慧，你不买吗？这个多好玩呀。"\n\n慧慧说："我觉得这些玩具不结实，玩两下就坏了，买了浪费。我想把钱存起来，买真正有用、能玩很久的东西。"\n\n果然，那些买了小摊玩具的小朋友，没过几天玩具就坏了，钱也白花了。零食吃多了，还有小朋友蛀了牙。\n\n而慧慧把钱存起来，后来买了一套能拼很多花样的积木，玩了很久很久都不腻，特别值。\n\n李老师说："慧慧买东西前会想一想值不值、有没有用，这叫理性消费。不乱花钱，把钱花在真正有用的东西上，是很聪明的。"\n\n慧慧还学会了分辨：结实耐用的东西值得买；一玩就坏的、吃了不健康的，就不买。\n\n在慧慧的影响下，小朋友们也不那么乱买小摊上的东西了。\n\n慧慧告诉大家：花钱之前先想一想——这个东西有用吗？结实吗？值不值？不要看到什么就想买什么。把钱花在真正有用的东西上，才不浪费。学会理性地花钱，是一个很重要的本领。'
},
{

{

  category: '慧慧',
  content: '户外活动时，慧慧发现了一个有趣的现象——自己的影子一会儿长一会儿短，一会儿在前一会儿在后。\n\n"影子为什么会变呢？"慧慧决定研究一下。\n\n早上，她站在操场上，发现影子长长的，在西边。中午，影子变得短短的，几乎在脚下。下午，影子又变长了，跑到了东边。\n\n慧慧想了想："影子是太阳照出来的。太阳在东边，影子就在西边；太阳升到头顶，影子就短了；太阳到西边，影子就跑到东边。原来影子跟着太阳变！"\n\n她把这个发现告诉了小朋友们，还做了个游戏："我们来踩影子吧！但是要注意，影子会跟着太阳动哦。"\n\n慧慧还发现了更多：站得高，影子长；蹲下来，影子短；东西挡住太阳，就会有影子。\n\n她拉着小朋友们做实验：用手在阳光下比划，墙上就出现了各种手影——小狗、小兔子、老鹰。大家玩得可开心了。\n\n李老师看到了，惊喜地说："慧慧不但发现了影子的规律，还带大家做手影游戏，把观察变成了好玩的学习！"\n\n慧慧说："影子里藏着好多秘密呢。太阳在哪边，影子就在相反的那边；太阳越高，影子越短。观察影子，还能大概知道时间——古时候的人就是用影子来看时间的，叫\'日晷\'。"\n\n小朋友们都惊呆了，没想到小小的影子里有这么多学问。\n\n慧慧告诉大家：生活中处处有科学。一个小小的影子，就藏着太阳、光线的规律。只要你像小科学家一样，多观察、多提问、多动手实验，就能发现好多有趣的秘密。保持好奇心，世界就会向你展示它的奇妙。'
},

  title: '【慧慧的中班故事】第九十四集：慧慧不传闲话',
  category: '慧慧',
  content: '课间，几个小朋友围在一起说悄悄话。原来是有人说乐乐的坏话："乐乐昨天尿裤子了，真丢人！"这话一个传一个，越传越广。\n\n有个小朋友跑来跟慧慧说："慧慧，你知道吗？乐乐昨天尿裤子了！你快去告诉别人！"\n\n慧慧摇摇头："这样的话，我不传。乐乐不小心尿裤子，他自己已经很难为情了。我们到处说，会让他更难过的。"\n\n那个小朋友愣住了："可是……大家都在说呀。"\n\n慧慧说："大家说不代表就是对的。传别人的糗事、说别人的坏话，会伤害别人。如果是我们自己不小心尿了裤子，被大家到处传，我们会多难过呀？"\n\n那个小朋友想了想，觉得慧慧说得对，也不好意思再传了。\n\n慧慧还去安慰乐乐："乐乐，别难过。谁小时候没尿过裤子呀，这没什么。下次想上厕所早点说就好了。"\n\n乐乐感激地看着慧慧："谢谢你慧慧，别人都笑我，就你安慰我。"\n\n慧慧还悄悄劝那些传闲话的小朋友："我们别说乐乐了，他已经很难过了。将心比心，如果是自己被这样传，多难受呀。"\n\n慢慢地，传闲话的人少了，大家也不再提乐乐尿裤子的事了。乐乐又开心起来。\n\n李老师知道后，表扬慧慧："慧慧不传闲话、不说人坏话，还维护受伤害的同学，心地真善良。"\n\n慧慧告诉大家：不要传别人的闲话、糗事、坏话。这些话传来传去，会深深地伤害别人。当别人已经很难过的时候，我们应该去安慰他、维护他，而不是跟着议论。管住自己的嘴，多说温暖的话，少说伤人的话。善良的人，不会在别人的伤口上撒盐。'
},
{
  id: 'huihui_95',
  title: '【慧慧的中班故事】第九十五集：慧慧的小闹钟',
  category: '慧慧',
  content: '慧慧发现，班里好多小朋友早上总是迟到，因为起不来床、磨磨蹭蹭。\n\n慧慧从来不迟到。她有一个自己的小妙招。\n\n小朋友问："慧慧，你怎么每天都能早早到，不迟到呀？"\n\n慧慧说："我有一个小闹钟，还有一套\'早起小步骤\'。晚上我早点睡觉，睡够了早上自然就醒了。闹钟一响我就起床，不赖床。然后按顺序：刷牙、洗脸、穿衣、吃早饭。每样事情我都不磨蹭，很快就准备好了。"\n\n慧慧还说："我头天晚上就把第二天要穿的衣服、要带的东西准备好，放在床边。早上起来直接穿、直接拿，不用手忙脚乱地找，就快多了。"\n\n李老师听了，觉得慧慧的方法真好，就请慧慧给大家分享。\n\n慧慧教大家："早睡早起，睡够了才起得来;闹钟响了马上起，不赖床;头天晚上准备好第二天的东西;做事情按顺序、不磨蹭。这样就不会迟到啦。"\n\n小朋友们学着慧慧的方法，慢慢地，迟到的少了。乐乐以前天天迟到，学了慧慧的方法后，居然也能准时到了。\n\n李老师表扬慧慧："慧慧不但自己守时，还把好方法教给大家，帮助全班都养成了不迟到的好习惯。"\n\n慧慧说："守时是一种好习惯，也是尊重别人。上学不迟到，跟人约会不迟到，才不会耽误事、不会让人等。"\n\n慧慧告诉大家：不迟到、守时间，靠的是好习惯——早睡早起、不赖床、不磨蹭、提前准备。养成这些好习惯，你会发现每天的生活都从从容容、井井有条。守时的人，做事更靠谱，也更受人信赖。'
},
{
  id: 'huihui_96',
  title: '【慧慧的中班故事】第九十六集：慧慧爱护小鸟',
  category: '慧慧',
  content: '有一天，慧慧在幼儿园的树下发现了一只小鸟。小鸟从鸟窝里掉了下来，翅膀受了伤，飞不起来，在地上扑腾，叽叽地叫，好可怜。\n\n几个小朋友围过来，有的想抓小鸟玩，有的想拿石头吓它。\n\n慧慧赶紧拦住大家："别吓它！小鸟受伤了，很害怕，我们要帮助它，不能伤害它。"\n\n慧慧轻轻地、慢慢地靠近小鸟，用双手小心地把它捧起来。小鸟一开始很害怕，但慧慧的手很温柔，慢慢地它不那么抖了。\n\n慧慧找来一个小盒子，铺上柔软的纸和棉花，把小鸟放进去，还找了点水和小虫子喂它。\n\n"我们要照顾它，等它的伤好了，再放它回大自然。"慧慧说。\n\n慧慧带着小朋友们一起照顾小鸟。每天喂食、喂水，还轻声跟小鸟说话。李老师也帮忙请了懂鸟的人来看小鸟的伤。\n\n过了些天，小鸟的翅膀好了，能扑腾着飞了。\n\n"该放它回家了。"慧慧说，"它属于蓝天，不属于盒子。"\n\n慧慧带着大家来到户外，轻轻打开盒子。小鸟扑扇着翅膀，飞了起来，在天空盘旋了一圈，好像在跟大家道别，然后飞向了远方。\n\n"再见，小鸟！"小朋友们开心地挥手。\n\n李老师说："慧慧不但救助了小鸟，还懂得把它放归大自然。爱护小动物、尊重生命，慧慧做得真好。"\n\n慧慧告诉大家：小动物也是有生命的，会疼、会害怕。我们要爱护它们，不能伤害、欺负它们。遇到受伤的小动物，可以帮助它、照顾它。但是野生动物属于大自然，等它好了要放它回家，还它自由。尊重和爱护每一个小生命，是一颗善良的心最美好的样子。'
},
{
  id: 'huihui_97',
  title: '【慧慧的中班故事】第九十七集：慧慧数星星的办法',
  category: '慧慧',
  content: '晚上，幼儿园组织了一次亲子观星活动。小朋友们和爸爸妈妈一起看星星。\n\n天上的星星好多好多，数也数不清。有的小朋友数着数着就乱了："一、二、三……哎呀，数到哪了？"\n\n慧慧有办法。她说："星星太多，一颗一颗乱数会乱。我们可以把天空分成几块，一块一块地数，数完这块再数那块，就不会乱了。"\n\n她还发现了一个更好玩的："你们看，有几颗星星连起来，像一个大勺子！"那是北斗七星。\n\n慧慧指给大家看："这七颗亮亮的星星连起来，像一把勺子。找到它，顺着勺子口的方向，能找到北边呢。古时候的人在晚上就靠它辨认方向。"\n\n小朋友们都惊叹极了，原来星星还能指方向！\n\n慧慧还认识几个星座，讲给大家听。爸爸妈妈们也很惊讶，慧慧懂得这么多。\n\n慧慧说："这些都是我从书上看来的，还有爸爸教我的。多看书、多问、多观察，就懂得多了。"\n\n那天晚上，小朋友们不但学会了分区数星星，还认识了北斗七星，知道了星星能指方向。大家看着满天繁星，觉得又神奇又美丽。\n\n李老师说："慧慧把数星星变成了学知识。她爱观察、爱学习、爱思考，把看星星这件事变得又好玩又有意义。"\n\n慧慧告诉大家：面对好多好多、数不清的东西，可以分块、分类地数，就不会乱。而且，天上的星星、地上的万物，都藏着知识和奥秘。多看书、多观察、多提问，你就能懂得越来越多。保持一颗爱学习、爱探索的心，整个世界都是你的课堂。'
},
{
  id: 'huihui_98',
  title: '【慧慧的中班故事】第九十八集：慧慧不怕失败',
  category: '慧慧',
  content: '幼儿园举办折纸比赛，要折一只千纸鹤。千纸鹤有点难折，好多小朋友折了一半就折错了，一失败就灰心，把纸一扔不折了："太难了，我不折了！"\n\n慧慧也折错了好几次。第一次，翅膀折歪了；第二次，头折反了；第三次，纸都折破了。\n\n但是慧慧没有放弃。她每失败一次，就想一想："这次哪里错了？"然后改正，再折一次。\n\n折错了，她不灰心，笑着说："没关系，再来一次！失败一次，我就知道了一个不对的方法，离成功更近了。"\n\n慧慧一次又一次地折，越折越熟练。终于，一只漂亮的千纸鹤折出来了！翅膀、头、尾巴，都折得整整齐齐。\n\n"我折出来啦！"慧慧特别开心。\n\n小朋友们都很佩服："慧慧，你折错了那么多次，怎么不灰心呀？"\n\n慧慧说："失败没什么可怕的。爱迪生发明电灯，失败了好多好多次才成功呢。每一次失败，都让我知道了一个不对的方法，这样我就能越来越接近成功。放弃的人才永远学不会。"\n\n慧慧还鼓励那些放弃的小朋友："别灰心，我教你们。折错了不要紧，改一改再折。多试几次就会了。"\n\n在慧慧的鼓励下，那些放弃的小朋友重新拿起了纸。虽然也失败了好几次，但他们坚持下来，最后都折出了千纸鹤。\n\n李老师表扬慧慧："慧慧不怕失败、坚持不懈的精神，值得大家学习。失败是成功之母，只有不怕失败、坚持努力，才能成功。"\n\n慧慧告诉大家：失败一点都不可怕。做事情失败了，不要灰心、不要放弃。想一想哪里错了，改正后再试一次。每一次失败，都是在告诉我们一个不对的方法，让我们离成功更近。坚持下去，不断尝试，就一定能成功。不怕失败、勇于坚持的人，最终会收获成功的喜悦。'
},
{
  id: 'huihui_99',
  title: '【慧慧的中班故事】第九十九集：慧慧的合作精神',
  category: '慧慧',
  content: '李老师给大家出了一个任务：每个小组用积木搭一座又高又稳的塔，看哪个组搭得最高。\n\n有的组，小朋友们各搭各的，互相不商量，还抢积木，结果塔搭得东倒西歪，一下就倒了。\n\n慧慧他们组不一样。慧慧提议："我们要合作！先商量一下怎么搭。"\n\n大家一起商量：底座要用大块的积木，搭得宽宽的、稳稳的；越往上用的积木越小；每个人负责一部分，互相配合。\n\n慧慧分工："乐乐力气大，负责搭底座；朵朵手巧，负责搭中间；我来搭顶上；美美负责递积木。"\n\n大家分工合作，谁也不抢，互相帮忙。慧慧还提醒大家："轻轻放，慢慢来，别把塔碰倒了。"\n\n在大家的齐心协力下，一座又高又稳的塔搭起来了！比别的组都高。\n\n"我们赢啦！"全组小朋友高兴地欢呼、击掌。\n\n李老师问："你们组怎么搭得又高又稳？"\n\n慧慧说："因为我们合作呀！一个人的力量小，大家一起商量、分工、配合，就能做成大事。底座是乐乐搭的，中间是朵朵搭的，美美一直帮忙递积木，缺了谁都不行。"\n\n李老师表扬这一组："你们最棒的不是搭得高，而是懂得合作。团结合作，力量才大。"\n\n那些各搭各的组，也明白了合作的重要，纷纷学着一起商量、分工。\n\n慧慧告诉大家：一个人的力量是有限的，大家团结合作，力量就大了。做事情要互相商量、合理分工、彼此配合、互相帮助。团结合作，才能完成一个人做不到的大事。众人拾柴火焰高，团结就是力量。'
},
{
  id: 'huihui_100',
  title: '【慧慧的中班故事】第一百集：慧慧的一天',
  category: '慧慧',
  content: '这一天，李老师请慧慧给全班小朋友分享："慧慧，你每天都做得这么好，能跟大家说说你是怎么做的吗？"\n\n慧慧大方地站起来，跟大家分享她的一天：\n\n"早上，我按时起床，不赖床，自己刷牙洗脸穿衣服。吃早饭不挑食，吃得饱饱的，才有精神。"\n\n"到了幼儿园，我跟老师和同学问好。上课认真听讲，积极举手发言。有不懂的就问，学到新东西我很开心。"\n\n"跟同学相处，我不抢东西、不打闹，会分享、会谦让。看到同学有困难，我主动帮忙。"\n\n"玩的时候尽情玩，但遵守规则、注意安全。做危险的事我会拒绝。"\n\n"我爱看书、爱观察、爱动脑筋。遇到问题不慌张，想办法解决。"\n\n"我做事有计划、不拖延、不浪费。自己的事情自己做，还帮爸爸妈妈做家务。"\n\n"做错了事，我会勇敢承认、诚实道歉。取得成绩我不骄傲，继续努力。"\n\n小朋友们听得津津有味。李老师总结说："慧慧之所以这么优秀，是因为她把好习惯、好品质融入了每一天——聪明好学、自律守时、勇敢诚实、善良助人、机智解决问题。这些不是一天养成的，是每天坚持做到的。"\n\n慧慧谦虚地说："其实我也有做得不够好的地方，还要继续努力。而且，这些好习惯大家都能做到，只要每天坚持一点点。我相信每个小朋友都能变得越来越棒！"\n\n小朋友们受到了鼓舞，都决心向慧慧学习，养成好习惯。\n\n放学后，慧慧对妈妈说："妈妈，今天我把我的好习惯分享给了大家，希望大家都能变得更好。"\n\n妈妈骄傲地摸摸她的头："慧慧不但自己优秀，还愿意帮助大家一起进步，这是最难得的。你是个聪明、自律、勇敢、善良的好孩子，妈妈为你骄傲。"\n\n慧慧甜甜地笑了。她知道，做一个更好的自己，还能带动身边的人一起变好，是一件特别有意义、特别快乐的事情。而这一切，都源于每一天的坚持和努力。\n\n明天，又是充满希望的新一天。慧慧带着她的聪明、自律、勇敢和善良，继续快乐地成长着。'
},
{
  id: 'huihui_101',
  title: '【慧慧的中班故事】第一百零一集：自己的事情自己做',
  category: '慧慧',
  content: '早上起床，慧慧自己穿好了衣服，自己刷牙洗脸，还自己把小被子叠得整整齐齐。\n\n妈妈想帮她，慧慧摆摆手："妈妈，我是中班的小朋友了，自己的事情自己做！"\n\n到了幼儿园，好多小朋友还要老师帮忙穿外套、系鞋带。慧慧不用，她自己就能把鞋带系成一个漂亮的蝴蝶结。\n\n同桌乐乐羡慕地问："慧慧，你怎么什么都会自己做呀？"\n\n慧慧笑着说："因为我在家练习过呀。刚开始我系鞋带也系不好，可是我每天都练，练了好多次，现在就会了。"\n\n李老师看到了，表扬慧慧："慧慧真是个自立的好孩子。自己的事情自己做，这样才能越来越能干。"\n\n下午,乐乐的鞋带松了，不会系，急得快哭了。慧慧走过去："别急，我教你。"\n\n她一步一步地教乐乐："先交叉，再打个结，然后做两个小耳朵，一绕一钻，拉紧——蝴蝶结就好了！"\n\n乐乐学了好几次，终于自己系好了鞋带，开心极了。\n\n"谢谢你慧慧！"\n\n"不用谢，多练几次你就熟练了。"慧慧说。\n\n放学回家，慧慧对妈妈说："妈妈，我今天教会了乐乐系鞋带！"\n\n妈妈摸摸她的头："慧慧不但自己能干，还会帮助别人，真棒！"\n\n慧慧心里美滋滋的。她知道，学会一样本领，不但自己方便，还能帮到别人，这种感觉真好。'
