  title: '【慧慧的中班故事】第九十三集：慧慧巧过独木桥',
  category: '慧慧',
  content: '户外拓展活动，有一个项目是走"独木桥"——其实是一根离地不高的平衡木。好多小朋友走上去就晃晃悠悠，害怕得不敢走，还有的走两步就掉下来了。\n\n轮到慧慧，她没有急着走。她先观察了一下，想了想怎么才能走稳。\n\n"我知道了！"慧慧说，"眼睛要看着前方，不要看脚下；两只手张开，像小鸟的翅膀一样保持平衡；一步一步慢慢走，不要急。"\n\n慧慧照着自己想的方法，眼睛看着前方，张开双臂，稳稳地一步一步走过了独木桥，一点都没晃。\n\n"哇，慧慧走得真稳！"小朋友们都鼓起掌来。\n\n李老师问："慧慧，你怎么走得这么稳？"\n\n慧慧说："我发现，越低头看脚下，越容易晃。看着前方，张开手臂保持平衡，慢慢走，就稳了。"\n\n慧慧还耐心地教害怕的小朋友："别怕，看着前面，手张开。我在旁边扶着你，慢慢来。"\n\n在慧慧的帮助和鼓励下，那些害怕的小朋友也一个个走过了独木桥。走过去的小朋友都特别有成就感。\n\n李老师表扬慧慧："慧慧不但自己想出了走独木桥的窍门，还教给大家、鼓励大家，帮助全班都完成了挑战。"\n\n慧慧说："遇到有挑战的事，先别慌，观察一下，想想有什么窍门和方法。找到方法，再加上勇敢和练习，就能做到了。"\n\n从那以后，小朋友们遇到有难度的项目，都会先想想:"有什么方法能做好呢？"然后勇敢地去尝试。\n\n慧慧告诉大家：面对有挑战的事情，不要害怕，也不要蛮干。先观察、想方法、找窍门，然后勇敢地、一步一步地去做。掌握了正确的方法，再难的挑战也能克服。动脑筋加上勇气，就是战胜困难的法宝。'
},
{
  id: 'huihui_94',
  title: '【慧慧的中班故事】第九十四集：慧慧不传闲话',
  category: '慧慧',
  content: '课间，几个小朋友围在一起说悄悄话。原来是有人说乐乐的坏话："乐乐昨天尿裤子了，真丢人！"这话一个传一个，越传越广。\n\n有个小朋友跑来跟慧慧说："慧慧，你知道吗？乐乐昨天尿裤子了！你快去告诉别人！"\n\n慧慧摇摇头："这样的话，我不传。乐乐不小心尿裤子，他自己已经很难为情了。我们到处说，会让他更难过的。"\n\n那个小朋友愣住了："可是……大家都在说呀。"\n\n慧慧说："大家说不代表就是对的。传别人的糗事、说别人的坏话，会伤害别人。如果是我们自己不小心尿了裤子，被大家到处传，我们会多难过呀？"\n\n那个小朋友想了想，觉得慧慧说得对，也不好意思再传了。\n\n慧慧还去安慰乐乐："乐乐，别难过。谁小时候没尿过裤子呀，这没什么。下次想上厕所早点说就好了。"\n\n乐乐感激地看着慧慧："谢谢你慧慧，别人都笑我，就你安慰我。"\n\n慧慧还悄悄劝那些传闲话的小朋友："我们别说乐乐了，他已经很难过了。将心比心，如果是自己被这样传，多难受呀。"\n\n慢慢地，传闲话的人少了，大家也不再提乐乐尿裤子的事了。乐乐又开心起来。\n\n李老师知道后，表扬慧慧："慧慧不传闲话、不说人坏话，还维护受伤害的同学，心地真善良。"\n\n慧慧告诉大家：不要传别人的闲话、糗事、坏话。这些话传来传去，会深深地伤害别人。当别人已经很难过的时候，我们应该去安慰他、维护他，而不是跟着议论。管住自己的嘴，多说温暖的话，少说伤人的话。善良的人，不会在别人的伤口上撒盐。'
},
{
  id: 'huihui_95',
  title: '【慧慧的中班故事】第九十五集：慧慧的小闹钟',
  category: '慧慧',
  content: '慧慧发现，班里好多小朋友早上总是迟到，因为起不来床、磨磨蹭蹭。\n\n慧慧从来不迟到。她有一个自己的小妙招。\n\n小朋友问："慧慧，你怎么每天都能早早到，不迟到呀？"\n\n慧慧说："我有一个小闹钟，还有一套\'早起小步骤\'。晚上我早点睡觉，睡够了早上自然就醒了。闹钟一响我就起床，不赖床。然后按顺序：刷牙、洗脸、穿衣、吃早饭。每样事情我都不磨蹭，很快就准备好了。"\n\n慧慧还说："我头天晚上就把第二天要穿的衣服、要带的东西准备好，放在床边。早上起来直接穿、直接拿，不用手忙脚乱地找，就快多了。"\n\n李老师听了，觉得慧慧的方法真好，就请慧慧给大家分享。\n\n慧慧教大家："早睡早起，睡够了才起得来;闹钟响了马上起，不赖床;头天晚上准备好第二天的东西;做事情按顺序、不磨蹭。这样就不会迟到啦。"\n\n小朋友们学着慧慧的方法，慢慢地，迟到的少了。乐乐以前天天迟到，学了慧慧的方法后，居然也能准时到了。\n\n李老师表扬慧慧："慧慧不但自己守时，还把好方法教给大家，帮助全班都养成了不迟到的好习惯。"\n\n慧慧说："守时是一种好习惯，也是尊重别人。上学不迟到，跟人约会不迟到，才不会耽误事、不会让人等。"\n\n慧慧告诉大家：不迟到、守时间，靠的是好习惯——早睡早起、不赖床、不磨蹭、提前准备。养成这些好习惯，你会发现每天的生活都从从容容、井井有条。守时的人，做事更靠谱，也更受人信赖。'
},
{
  id: 'huihui_96',
  title: '【慧慧的中班故事】第九十六集：慧慧爱护小鸟',
  category: '慧慧',
  content: '有一天，慧慧在幼儿园的树下发现了一只小鸟。小鸟从鸟窝里掉了下来，翅膀受了伤，飞不起来，在地上扑腾，叽叽地叫，好可怜。\n\n几个小朋友围过来，有的想抓小鸟玩，有的想拿石头吓它。\n\n慧慧赶紧拦住大家："别吓它！小鸟受伤了，很害怕，我们要帮助它，不能伤害它。"\n\n慧慧轻轻地、慢慢地靠近小鸟，用双手小心地把它捧起来。小鸟一开始很害怕，但慧慧的手很温柔，慢慢地它不那么抖了。\n\n慧慧找来一个小盒子，铺上柔软的纸和棉花，把小鸟放进去，还找了点水和小虫子喂它。\n\n"我们要照顾它，等它的伤好了，再放它回大自然。"慧慧说。\n\n慧慧带着小朋友们一起照顾小鸟。每天喂食、喂水，还轻声跟小鸟说话。李老师也帮忙请了懂鸟的人来看小鸟的伤。\n\n过了些天，小鸟的翅膀好了，能扑腾着飞了。\n\n"该放它回家了。"慧慧说，"它属于蓝天，不属于盒子。"\n\n慧慧带着大家来到户外，轻轻打开盒子。小鸟扑扇着翅膀，飞了起来，在天空盘旋了一圈，好像在跟大家道别，然后飞向了远方。\n\n"再见，小鸟！"小朋友们开心地挥手。\n\n李老师说："慧慧不但救助了小鸟，还懂得把它放归大自然。爱护小动物、尊重生命，慧慧做得真好。"\n\n慧慧告诉大家：小动物也是有生命的，会疼、会害怕。我们要爱护它们，不能伤害、欺负它们。遇到受伤的小动物，可以帮助它、照顾它。但是野生动物属于大自然，等它好了要放它回家，还它自由。尊重和爱护每一个小生命，是一颗善良的心最美好的样子。'
},
{
  id: 'huihui_97',
  title: '【慧慧的中班故事】第九十七集：慧慧数星星的办法',
  category: '慧慧',
  content: '晚上，幼儿园组织了一次亲子观星活动。小朋友们和爸爸妈妈一起看星星。\n\n天上的星星好多好多，数也数不清。有的小朋友数着数着就乱了："一、二、三……哎呀，数到哪了？"\n\n慧慧有办法。她说："星星太多，一颗一颗乱数会乱。我们可以把天空分成几块，一块一块地数，数完这块再数那块，就不会乱了。"\n\n她还发现了一个更好玩的："你们看，有几颗星星连起来，像一个大勺子！"那是北斗七星。\n\n慧慧指给大家看："这七颗亮亮的星星连起来，像一把勺子。找到它，顺着勺子口的方向，能找到北边呢。古时候的人在晚上就靠它辨认方向。"\n\n小朋友们都惊叹极了，原来星星还能指方向！\n\n慧慧还认识几个星座，讲给大家听。爸爸妈妈们也很惊讶，慧慧懂得这么多。\n\n慧慧说："这些都是我从书上看来的，还有爸爸教我的。多看书、多问、多观察，就懂得多了。"\n\n那天晚上，小朋友们不但学会了分区数星星，还认识了北斗七星，知道了星星能指方向。大家看着满天繁星，觉得又神奇又美丽。\n\n李老师说："慧慧把数星星变成了学知识。她爱观察、爱学习、爱思考，把看星星这件事变得又好玩又有意义。"\n\n慧慧告诉大家：面对好多好多、数不清的东西，可以分块、分类地数，就不会乱。而且，天上的星星、地上的万物，都藏着知识和奥秘。多看书、多观察、多提问，你就能懂得越来越多。保持一颗爱学习、爱探索的心，整个世界都是你的课堂。'
},
{
  id: 'huihui_98',
  title: '【慧慧的中班故事】第九十八集：慧慧不怕失败',
  category: '慧慧',
  content: '幼儿园举办折纸比赛，要折一只千纸鹤。千纸鹤有点难折，好多小朋友折了一半就折错了，一失败就灰心，把纸一扔不折了："太难了，我不折了！"\n\n慧慧也折错了好几次。第一次，翅膀折歪了；第二次，头折反了；第三次，纸都折破了。\n\n但是慧慧没有放弃。她每失败一次，就想一想："这次哪里错了？"然后改正，再折一次。\n\n折错了，她不灰心，笑着说："没关系，再来一次！失败一次，我就知道了一个不对的方法，离成功更近了。"\n\n慧慧一次又一次地折，越折越熟练。终于，一只漂亮的千纸鹤折出来了！翅膀、头、尾巴，都折得整整齐齐。\n\n"我折出来啦！"慧慧特别开心。\n\n小朋友们都很佩服："慧慧，你折错了那么多次，怎么不灰心呀？"\n\n慧慧说："失败没什么可怕的。爱迪生发明电灯，失败了好多好多次才成功呢。每一次失败，都让我知道了一个不对的方法，这样我就能越来越接近成功。放弃的人才永远学不会。"\n\n慧慧还鼓励那些放弃的小朋友："别灰心，我教你们。折错了不要紧，改一改再折。多试几次就会了。"\n\n在慧慧的鼓励下，那些放弃的小朋友重新拿起了纸。虽然也失败了好几次，但他们坚持下来，最后都折出了千纸鹤。\n\n李老师表扬慧慧："慧慧不怕失败、坚持不懈的精神，值得大家学习。失败是成功之母，只有不怕失败、坚持努力，才能成功。"\n\n慧慧告诉大家：失败一点都不可怕。做事情失败了，不要灰心、不要放弃。想一想哪里错了，改正后再试一次。每一次失败，都是在告诉我们一个不对的方法，让我们离成功更近。坚持下去，不断尝试，就一定能成功。不怕失败、勇于坚持的人，最终会收获成功的喜悦。'
},

},
{

  category: '慧慧',
  content: '这一天，李老师请慧慧给全班小朋友分享："慧慧，你每天都做得这么好，能跟大家说说你是怎么做的吗？"\n\n慧慧大方地站起来，跟大家分享她的一天：\n\n"早上，我按时起床，不赖床，自己刷牙洗脸穿衣服。吃早饭不挑食，吃得饱饱的，才有精神。"\n\n"到了幼儿园，我跟老师和同学问好。上课认真听讲，积极举手发言。有不懂的就问，学到新东西我很开心。"\n\n"跟同学相处，我不抢东西、不打闹，会分享、会谦让。看到同学有困难，我主动帮忙。"\n\n"玩的时候尽情玩，但遵守规则、注意安全。做危险的事我会拒绝。"\n\n"我爱看书、爱观察、爱动脑筋。遇到问题不慌张，想办法解决。"\n\n"我做事有计划、不拖延、不浪费。自己的事情自己做，还帮爸爸妈妈做家务。"\n\n"做错了事，我会勇敢承认、诚实道歉。取得成绩我不骄傲，继续努力。"\n\n小朋友们听得津津有味。李老师总结说："慧慧之所以这么优秀，是因为她把好习惯、好品质融入了每一天——聪明好学、自律守时、勇敢诚实、善良助人、机智解决问题。这些不是一天养成的，是每天坚持做到的。"\n\n慧慧谦虚地说："其实我也有做得不够好的地方，还要继续努力。而且，这些好习惯大家都能做到，只要每天坚持一点点。我相信每个小朋友都能变得越来越棒！"\n\n小朋友们受到了鼓舞，都决心向慧慧学习，养成好习惯。\n\n放学后，慧慧对妈妈说："妈妈，今天我把我的好习惯分享给了大家，希望大家都能变得更好。"\n\n妈妈骄傲地摸摸她的头："慧慧不但自己优秀，还愿意帮助大家一起进步，这是最难得的。你是个聪明、自律、勇敢、善良的好孩子，妈妈为你骄傲。"\n\n慧慧甜甜地笑了。她知道，做一个更好的自己，还能带动身边的人一起变好，是一件特别有意义、特别快乐的事情。而这一切，都源于每一天的坚持和努力。\n\n明天，又是充满希望的新一天。慧慧带着她的聪明、自律、勇敢和善良，继续快乐地成长着。'

{

  title: '【慧慧的中班故事】第一百零一集：自己的事情自己做',
  category: '慧慧',
  content: '早上起床，慧慧自己穿好了衣服，自己刷牙洗脸，还自己把小被子叠得整整齐齐。\n\n妈妈想帮她，慧慧摆摆手："妈妈，我是中班的小朋友了，自己的事情自己做！"\n\n到了幼儿园，好多小朋友还要老师帮忙穿外套、系鞋带。慧慧不用，她自己就能把鞋带系成一个漂亮的蝴蝶结。\n\n同桌乐乐羡慕地问："慧慧，你怎么什么都会自己做呀？"\n\n慧慧笑着说："因为我在家练习过呀。刚开始我系鞋带也系不好，可是我每天都练，练了好多次，现在就会了。"\n\n李老师看到了，表扬慧慧："慧慧真是个自立的好孩子。自己的事情自己做，这样才能越来越能干。"\n\n下午,乐乐的鞋带松了，不会系，急得快哭了。慧慧走过去："别急，我教你。"\n\n她一步一步地教乐乐："先交叉，再打个结，然后做两个小耳朵，一绕一钻，拉紧——蝴蝶结就好了！"\n\n乐乐学了好几次，终于自己系好了鞋带，开心极了。\n\n"谢谢你慧慧！"\n\n"不用谢，多练几次你就熟练了。"慧慧说。\n\n放学回家，慧慧对妈妈说："妈妈，我今天教会了乐乐系鞋带！"\n\n妈妈摸摸她的头："慧慧不但自己能干，还会帮助别人，真棒！"\n\n慧慧心里美滋滋的。她知道，学会一样本领，不但自己方便，还能帮到别人，这种感觉真好。'
},
{
  id: 'huihui_102',
  title: '【慧慧的中班故事】第一百零二集：认真听讲的好处',
  category: '慧慧',
  content: '今天李老师教大家认识数字，从1数到10。\n\n有的小朋友东张西望，有的在玩橡皮，只有慧慧坐得端端正正，眼睛一直看着老师，认真地听。\n\n李老师说："今天教的数字，明天要用来做一个好玩的游戏哦。"\n\n慧慧把老师教的每个数字都记在了心里。她还发现了一个规律：数字是一个比一个大一个，2比1多1，3比2多1……\n\n第二天，李老师果然带来了数字游戏——把写着数字的卡片按从小到大排好队。\n\n好多没认真听的小朋友都排乱了，把5排到了3前面，把8排到了6前面。\n\n只有慧慧，很快就把1到10的卡片排得整整齐齐，一个都没错。\n\n"慧慧真棒！全对！"李老师奖励了慧慧一朵小红花。\n\n乐乐凑过来问："慧慧，你怎么全都记住了？"\n\n慧慧说："因为昨天老师讲的时候我认真听了呀。认真听讲，就能记住，第二天就会用了。"\n\n乐乐挠挠头："我昨天光顾着玩橡皮了……"\n\n"没关系，"慧慧说，"从今天开始认真听，就来得及。"\n\n从那以后，乐乐也学着慧慧，上课认真听讲。他发现，认真听真的能学到好多东西，而且被老师提问的时候能答上来，特别有成就感。\n\n慧慧告诉大家：上课的四十分钟，认真听讲，胜过课后自己琢磨半天。老师讲的都是最重要的，听进去了就是自己的本领。'
},
{
  id: 'huihui_103',
  title: '【慧慧的中班故事】第一百零三集：慧慧巧分蛋糕',
  category: '慧慧',
  content: '今天是小雨的生日，她带来了一个大蛋糕，要分给同一桌的四个小朋友：慧慧、乐乐、壮壮和她自己。\n\n老师把蛋糕切好了，可是切得大小不一样——有的大有的小。小朋友们都想要最大的那块，差点吵起来。\n\n"我要大的！""我先看到的！"\n\n慧慧想了想，说："别吵别吵，我有个公平的办法。"\n\n她把四块蛋糕摆在桌上，说："我们抓阄吧！我用四根小纸条，长的短的都有，谁抽到最长的先挑，第二长的第二个挑，这样最公平。"\n\n大家觉得这个主意好。抓阄以后，按顺序挑蛋糕，谁也没意见了。\n\n可是壮壮抽到了最后一个，只能拿最小的那块，有点不高兴。\n\n慧慧看到了，说："这样吧，我这块比较大，我跟壮壮换一下。反正我也吃不了那么多。"\n\n壮壮惊喜地说："真的吗？谢谢慧慧！"\n\n小雨也说："慧慧真会想办法，还这么大方！"\n\n大家开开心心地吃着蛋糕，一点都没吵架。\n\n李老师看到了，说："慧慧不但想出了公平的办法，还愿意把大的让给别人，真是又聪明又善良。"\n\n慧慧笑着说："遇到分东西的问题，想个公平的办法，大家就不会吵架了。而且分享一点也不会让自己少什么，反而更开心。"\n\n从那以后，班里再有分东西的事，小朋友们都会说："找慧慧！她有公平的好办法！"\n\n慧慧用她的聪明和大方，让大家都学会了：遇到矛盾，动脑筋找公平的办法，比争抢好得多。'
},
{
  id: 'huihui_104',
  title: '【慧慧的中班故事】第一百零四集：勇敢承认错误',
  category: '慧慧',
  content: '慧慧不小心碰倒了教室里的花盆，花盆摔碎了，泥土撒了一地。\n\n当时没有人看到。慧慧愣了一下——她可以偷偷走开，假装不知道，反正没人看见。\n\n可是慧慧摇了摇头。她径直走到李老师面前："李老师，对不起，我不小心碰倒了花盆，把它摔碎了。"\n\n李老师有点惊讶："是你自己来告诉老师的？"\n\n"是的，是我碰倒的。我应该承认。"慧慧虽然有点紧张，但还是勇敢地说了出来。\n\n李老师不但没有批评她，反而摸摸她的头："慧慧，摔碎花盆是个小意外，谁都可能碰到。但是你能主动承认，不逃避，这非常勇敢，非常诚实。老师为你骄傲。"\n\n慧慧和李老师一起把碎片清理干净，把花重新种到了新的花盆里。\n\n旁边的小朋友都看到了。乐乐悄悄说："慧慧，你不怕被批评吗？"\n\n慧慧说："做错了事，勇敢承认才对呀。如果我偷偷跑掉，心里会一直不安，而且花也没人管了。承认了，虽然当时有点害怕，但心里踏实。"\n\n过了几天，乐乐不小心弄坏了班里的图书。这次乐乐学着慧慧的样子，主动跟老师承认了。李老师也表扬了乐乐的诚实。\n\n慧慧用自己的行动告诉大家：犯错不可怕，可怕的是逃避和撒谎。勇敢地承认错误，才是真正的勇敢，也会赢得别人的尊重和信任。\n\n那盆重新种好的花，后来开出了漂亮的花朵。慧慧每次浇水的时候都会想：诚实和勇敢，就像这朵花一样，会开出美丽的结果。'
},
{
  id: 'huihui_105',
  title: '【慧慧的中班故事】第一百零五集：慧慧的时间表',
  category: '慧慧',
  content: '慧慧发现，有的小朋友总是丢三落四——今天忘带水杯，明天忘带手工材料，后天又忘了穿运动鞋。\n\n慧慧从来不会忘东西。乐乐好奇地问："慧慧，你怎么什么都记得带？"\n\n慧慧从书包里拿出一张小卡片："这是我和妈妈一起做的\'小任务表\'。每天晚上睡觉前，我照着表格准备好第二天要带的东西，放进书包。这样就不会忘了。"\n\n卡片上画着：水杯、手工材料、要穿的衣服、要交的作业……每准备好一样，慧慧就画一个小勾。\n\n乐乐觉得这个办法真好："我也想做一个！"\n\n慧慧帮乐乐一起做了一张任务表。从那以后，乐乐也不怎么丢三落四了。\n\n慧慧还有一个习惯：她做事情有计划。玩之前先想好玩多久，到时间就收玩具;吃饭的时候专心吃，不边吃边玩;该睡觉了就乖乖上床，不拖拖拉拉。\n\n"慧慧，你不想多玩一会儿吗？"有小朋友问。\n\n"想呀，"慧慧说，"但是我知道，玩过头了，晚上就睡不够，第二天就没精神。所以到了时间我就停下来。这样每天都有精神，做什么都开心。"\n\n李老师说："慧慧真是个自律的孩子。自律就是自己管好自己，该做什么的时候做什么。这是一个非常了不起的本领。"\n\n慧慧的自律让她的生活井井有条。她从不慌慌张张，因为该准备的都提前准备好了;她精力充沛,因为该休息的时候好好休息了。\n\n慧慧告诉小伙伴们：管好自己的时间和东西，看起来是小事，但坚持下来，你会发现生活变得又轻松又有序。'
},
{
  id: 'huihui_106',
  title: '【慧慧的中班故事】第一百零六集：不怕黑的慧慧',
  category: '慧慧',
  content: '幼儿园停电了，午睡室里黑黑的。好多小朋友都害怕，有的哭了，有的躲进被子里发抖。\n\n"呜呜，好黑呀，我害怕……"乐乐吓得直哆嗦。\n\n慧慧也有一点点怕，但她深吸一口气，让自己冷静下来。她想起爸爸说过的话："黑暗里其实什么都没有，跟开灯的时候是一样的房间，只是看不见而已。"\n\n慧慧安慰旁边的小朋友："别怕，这只是停电了。房间还是我们熟悉的房间，什么都没有变。老师就在旁边呢。"\n\n她还想了个办法转移大家的注意力："我们来玩\'猜声音\'的游戏吧！听听看，这是什么声音？"\n\n慧慧敲了敲床板："咚咚——这是什么声音？"\n\n"床板的声音！"小朋友们的注意力被吸引了，慢慢不那么害怕了。\n\n黑暗中，大家玩起了猜声音的游戏，笑声代替了哭声。\n\n过了一会儿，电来了，灯亮了。小朋友们发现，黑暗里真的什么可怕的东西都没有，房间还是原来的房间。\n\n李老师表扬慧慧："慧慧真勇敢，不但自己不害怕，还帮大家一起战胜了恐惧。"\n\n乐乐佩服地说："慧慧，你怎么一点都不怕黑呀？"\n\n慧慧说："其实我也有一点点怕。但是害怕的时候，越慌越怕。我就深呼吸，告诉自己\'没什么可怕的\',然后想办法让自己和大家都不害怕。勇敢不是不害怕，而是害怕的时候还能想办法。"\n\n从那以后，遇到停电或者黑暗，小朋友们都不那么怕了。因为他们记住了慧慧的话：黑暗里什么都没有，深呼吸，冷静下来，就不怕了。\n\n慧慧用她的勇敢和机智，让大家明白了：真正的勇敢，是在害怕的时候依然能保持冷静，还能帮助别人。'
},
{
  id: 'huihui_107',
  title: '【慧慧的中班故事】第一百零七集：慧慧学拼图',
  category: '慧慧',
  content: '老师发下来一盒拼图，一百块，拼起来是一幅漂亮的森林图画。\n\n好多小朋友试了几下，觉得太难了，就放弃了。"太难了，拼不出来！"\n\n慧慧却不着急。她把拼图倒在桌上，先不急着拼，而是想了想办法。\n\n"我先把边框的拼起来。"慧慧把有直边的拼图挑出来——这些是图画的四条边。她先拼出了一个框。\n\n然后她按颜色分类：绿色的是树叶，蓝色的是天空，棕色的是树干……她把颜色一样的放在一堆。\n\n"这样找起来就快多了！"慧慧一块一块地拼，天空归天空，树叶归树叶。\n\n虽然中间也有拼错的时候，但慧慧不灰心，错了就换一块试试。慢慢地，森林的图画一点点显现出来了。\n\n乐乐在旁边看得着急："慧慧，还差好多呢，你不累吗？"\n\n"不着急，"慧慧说，"一块一块拼，总能拼完的。你看，已经拼出一半了！"\n\n又拼了一会儿，最后一块拼图放上去——完整的森林图画出现了！好漂亮！\n\n"哇！慧慧拼出来了！"小朋友们都围过来看。\n\n李老师问："慧慧，这么难的拼图，你是怎么拼出来的？"\n\n慧慧说："先拼边框，再按颜色分类，然后一块一块耐心地拼。遇到难的事情，不要急，想个好办法，一步一步来，就能完成。"\n\n小朋友们跟着慧慧学方法，也慢慢能拼出拼图了。\n\n慧慧告诉大家一个道理：再难的事情，只要不放弃，想好方法，把大问题拆成小问题，耐心地一点点做，最后都能完成。就像拼图，一百块看起来吓人，可一块一块拼，总有拼完的时候。'
},
{
  id: 'huihui_108',
  title: '【慧慧的中班故事】第一百零八集：慧慧帮小蚂蚁搬家',
  category: '慧慧',
  content: '下课的时候，慧慧看到墙角有一群小蚂蚁在忙碌地搬东西。她蹲下来仔细观察。\n\n"你们在看什么呀？"小朋友们围过来。\n\n"看小蚂蚁搬家。"慧慧说，"它们排着队，一个接一个，把食物搬回家。你们看，它们多有秩序呀。"\n\n慧慧发现小蚂蚁在搬一块比它们身体大好多倍的饼干渣。一只蚂蚁搬不动，就来了好几只，一起合作把饼干渣抬起来。\n\n"哇，它们好团结！"\n\n慧慧还发现，快下雨了，蚂蚁们搬家搬得特别急。"我记得书上说过，蚂蚁搬家是要下雨的信号。它们在把家搬到高处，免得被雨水淹了。"\n\n果然，没过多久，天阴了下来，真的开始下雨了。\n\n小朋友们都惊呆了："慧慧，你怎么知道要下雨呀？"\n\n"因为我平时喜欢观察，还喜欢看书。书上说蚂蚁搬家、燕子低飞，都是要下雨的信号。今天看到蚂蚁着急搬家，我就猜到快下雨了。"\n\n李老师说："慧慧真是个善于观察、爱学习的孩子。大自然里藏着好多知识，只要用心观察，就能发现。"\n\n慧慧还提醒大家："下雨了，我们把窗户关好吧，别让雨水飘进来。"她主动去关了窗户。\n\n从那以后，小朋友们也学着慧慧，喜欢上了观察小动物、观察大自然。他们发现，原来蚂蚁、蝴蝶、小鸟身上都有好多有趣的秘密。\n\n慧慧告诉大家：多观察、多看书、多思考，你就能懂得越来越多。知识不只在课本里，也在我们身边的每一个角落。留心观察的孩子，总能发现别人发现不了的奥秘。'
},
{
  id: 'huihui_109',
  title: '【慧慧的中班故事】第一百零九集：慧慧不说谎',
  category: '慧慧',
  content: '李老师买了一盒新的彩色贴纸，放在讲台上，说等手工课的时候奖励给表现好的小朋友。\n\n下课的时候，慧慧路过讲台，特别想看看那些漂亮的贴纸。她没忍住，拿起来看了看，结果不小心把一张贴纸弄掉在地上，被踩了一脚，弄脏了。\n\n慧慧有点着急，但她没有把弄脏的贴纸藏起来。\n\n上课了，李老师发现少了一张贴纸，还有一张脏了。"是谁动了贴纸呢？"\n\n教室里安静了。慧慧站了起来："李老师，是我。我下课的时候好奇，拿起贴纸看，不小心弄掉了一张，被踩脏了。对不起。"\n\n李老师看着慧慧："你为什么要主动承认呢？其实老师不一定知道是你。"\n\n慧慧说："因为是我做的呀。就算没人知道，我自己知道。如果我不说，心里会一直不舒服。撒谎比做错事更不好。"\n\n李老师非常感动："慧慧，你知道吗？诚实比那一整盒贴纸都珍贵。你没有得到贴纸，但你得到了老师和同学们的信任，这是最宝贵的。"\n\n李老师奖励了慧慧一朵最大的小红花——不是因为她表现完美，而是因为她诚实。\n\n乐乐悄悄问："慧慧，你不觉得可惜吗？承认了就没有贴纸了。"\n\n慧慧笑着说："贴纸没了可以再有，但如果我撒了谎，大家就不相信我了，那才是真的可惜。做一个诚实的人，比什么都重要。"\n\n从那以后，班里的小朋友都更信任慧慧了。因为大家知道，慧慧说的话一定是真的。\n\n慧慧用行动告诉大家：诚实是一个人最宝贵的品质。就算会吃点小亏，也要说真话。一个诚实的人，会赢得所有人的信任和尊重，这比任何奖励都珍贵。'
},
{
  id: 'huihui_110',
  title: '【慧慧的中班故事】第一百一十集：慧慧的好办法',
  category: '慧慧',
  content: '秋游的时候，小朋友们在草地上玩。突然，乐乐的气球飞走了，挂在了一棵矮树的树枝上，够不着。\n\n乐乐急得跳起来抓，可是太高了，怎么也够不到。他快哭了："我的气球……"\n\n好几个小朋友试着跳起来抓，都够不着。有的想爬树，被老师制止了——爬树太危险。\n\n慧慧观察了一下。气球的线垂下来一截，就在树枝上挂着。\n\n"我有办法！"慧慧说。\n\n她找来了一根长长的竹竿（是老师用来撑帐篷的），然后用竹竿轻轻地去挑气球的线。\n\n试了两下，慧慧用竹竿头勾住了气球的线，轻轻一带——气球下来了！\n\n"耶！气球回来啦！"乐乐高兴地抱住了气球。\n\n小朋友们都欢呼起来："慧慧太聪明了！"\n\n李老师问："慧慧，你怎么想到用竹竿的？"\n\n慧慧说："我们的手够不着，但是竹竿长呀，可以帮我们够到高的地方。遇到够不着的东西，找一个长的工具来帮忙，就行了。爬树很危险，用竹竿又安全又管用。"\n\n李老师竖起大拇指："慧慧不但机智，还想到了安全。真棒！"\n\n从那以后，小朋友们遇到够不着的东西，都会想："找个长东西来够！"\n\n有一次乐乐的皮球滚到了桌子底下最里面，他学着慧慧的样子，找了一根长尺子把球拨了出来。\n\n慧慧告诉大家：遇到问题不要蛮干，动动脑筋，用合适的工具和方法，既安全又能解决问题。聪明的孩子，总是先想一想再行动。'
},
{
  id: 'huihui_111',
  title: '【慧慧的中班故事】第一百一十一集：慧慧坚持练习',
  category: '慧慧',
  content: '幼儿园要举办跳绳比赛。可是慧慧一开始一个都跳不过去——绳子总是绊到脚。\n\n有的小朋友跳不好就不练了："跳绳太难了，我不参加了。"\n\n慧慧没有放弃。她每天早一点到幼儿园，在操场上练习跳绳。\n\n第一天，她跳一个绊一个。第二天，能连着跳两个了。第三天，能跳五个了。\n\n练习的时候，慧慧摔过跤，绳子也抽疼过腿，但她擦擦眼泪，继续练。\n\n"慧慧，你不累吗？"乐乐问。\n\n"累呀，"慧慧擦擦汗，"但是我想跳好。今天比昨天多跳几个，就是进步。只要每天进步一点点，慢慢就能跳很多了。"\n\n一个星期后，慧慧能一口气跳二十多个了！\n\n比赛那天，慧慧跳了三十八个，得了小班组第一名！\n\n小朋友们都惊呆了："慧慧，你怎么跳得这么好呀？"\n\n慧慧说："因为我每天都练习呀。刚开始我一个都跳不过，是练出来的。世界上没有天生就会的事情，都是练出来的。"\n\n那些放弃的小朋友很后悔。慧慧鼓励他们："现在开始练还来得及！我教你们。"\n\n慧慧把自己的经验教给大家：跳的时候手腕用力，眼睛看前面，脚尖轻轻跳。她还陪着大家一起练。\n\n慢慢地，越来越多的小朋友学会了跳绳。\n\n慧慧告诉大家一个道理：熟能生巧。任何本领刚开始都很难，但只要坚持练习，每天进步一点，就一定能学会。放弃的人永远学不会，坚持的人终会成功。'
},
{
  id: 'huihui_112',
  title: '【慧慧的中班故事】第一百一十二集：慧慧不浪费',
  category: '慧慧',
  content: '午饭时间，慧慧总是把碗里的饭吃得干干净净，一粒米都不剩。\n\n有的小朋友吃饭剩好多，还把不爱吃的菜偷偷倒掉。\n\n李老师讲了一个故事："每一粒米，都是农民伯伯辛辛苦苦种出来的。春天播种，夏天顶着大太阳除草浇水，秋天才能收获。一粒米要经过好几个月才能到我们碗里。"\n\n慧慧一直都很珍惜粮食。她说："我爷爷是种地的，我知道种粮食很辛苦。所以我从来不浪费，能吃多少盛多少。"\n\n慧慧还有一个好习惯：用水的时候不开太大，洗完手赶紧关水龙头；纸巾用一张就够，不浪费；画画的纸，正面用完用反面。\n\n"慧慧，你怎么这么节约呀？"乐乐问。\n\n慧慧说："因为每样东西都来之不易呀。水是宝贵的，纸是树木做的，粮食是农民种的。我们节约一点，就是珍惜别人的劳动，也是爱护我们的地球。"\n\n李老师表扬慧慧："慧慧懂得珍惜，不浪费，这是一种非常好的品德。"\n\n在慧慧的影响下，班里的小朋友都开始节约了。吃饭不剩饭，用水不浪费，纸张两面用。\n\n李老师在墙上贴了一张"节约小明星"的表格，慧慧的名字下面贴满了小星星。\n\n慧慧告诉大家：节约不是小气，是一种美德。我们碗里的每一粒米、用的每一滴水、每一张纸，都凝聚着别人的辛苦。珍惜它们，就是对劳动的尊重。一个懂得珍惜的孩子，会更加懂得感恩。'
},
{
  id: 'huihui_113',
  title: '【慧慧的中班故事】第一百一十三集：慧慧机智救小猫',
  category: '慧慧',
  content: '放学路上，慧慧和妈妈听到了微弱的"喵喵"声。声音是从一个很深的墙缝里传出来的——一只小猫掉进去了，出不来。\n\n小猫又饿又怕，一直叫。可是墙缝太窄太深，手伸不进去，够不着小猫。\n\n围观的人越来越多，大家都想帮忙，可是谁也没办法。有人想用手掏，够不着；有人想撬墙，太危险。\n\n慧慧观察了一会儿，动起了脑筋。\n\n"我有办法！"慧慧说，"小猫爬不上来，是因为墙缝太滑了。我们可以放一块布或者一根绳子下去，让小猫抓着爬上来。"\n\n慧慧找来了一条长围巾，慢慢地放进墙缝里，一直垂到小猫旁边。\n\n一开始小猫不敢抓。慧慧轻声安慰："小猫别怕，抓住围巾，慢慢爬上来。"\n\n慧慧还让妈妈拿了一点食物的香味引导小猫往上爬。小猫闻到香味，试着抓住围巾，一点一点往上爬。\n\n大家都屏住呼吸看着。终于，小猫抓着围巾爬了上来！\n\n"太好了！小猫得救了！"围观的人都鼓起掌来。\n\n小猫得救后，蹭了蹭慧慧的腿，好像在说谢谢。\n\n一位叔叔说："这个小姑娘真聪明，我们大人都没想到的办法，她想到了！"\n\n慧慧不好意思地笑了："遇到问题冷静想一想，总能找到办法的。小猫爬不上来是因为墙滑，那就给它一个能抓住的东西。"\n\n妈妈骄傲地抱着慧慧："我的女儿又善良又机智！"\n\n慧慧告诉小伙伴们：遇到紧急情况不要慌，先冷静观察，弄清楚问题在哪里，然后想办法解决。有时候一个简单的办法，就能帮上大忙。善良加上机智，就能帮助更多需要帮助的人。'
},
{
  id: 'huihui_114',
  title: '【慧慧的中班故事】第一百一十四集：慧慧不怕困难的数学题',
  category: '慧慧',
  content: '数学课上，李老师出了一道稍微难一点的题："桌上有五个苹果，妈妈又拿来三个，然后小明吃掉了两个，现在还有几个？"\n\n好多小朋友一听有三个数字，就懵了："太难了！"\n\n慧慧没有慌。她拿出了自己的小手指，还有桌上的小积木当苹果。\n\n"先有五个苹果。"慧慧摆了五个积木。\n\n"妈妈又拿来三个。"她又加了三个，"五加三等于八，现在有八个。"\n\n"小明吃掉两个。"她拿走两个，"八减二等于六。所以还剩六个！"\n\n慧慧一步一步地算，把难题拆成了两个简单的小题：先算加法，再算减法。\n\n"哇，慧慧算对了！"李老师表扬她。\n\n乐乐佩服地说："这么难的题，你怎么算出来的？"\n\n慧慧说："题目看起来难，是因为有好几步。我把它拆开，一步一步来。先算加进来的，再算吃掉的。用积木摆出来，就看得清清楚楚了。"\n\n李老师说："慧慧的方法真好！遇到复杂的问题，把它拆成一小步一小步，就不难了。而且用实物来帮助思考，更容易理解。"\n\n慧慧教大家用积木、用手指来算数。慢慢地，小朋友们也不怕难题了。\n\n慧慧还发现，数学在生活里到处都是——分蛋糕要用除法，买东西要用加减法，排队要数数……\n\n慧慧告诉大家：难题不可怕，把大问题拆成小问题，一步一步解决，再难的题也能算出来。而且数学很有用，学好了在生活里处处能用上。爱动脑筋的孩子，会觉得数学越来越好玩。'
},
{
  id: 'huihui_115',
  title: '【慧慧的中班故事】第一百一十五集：慧慧管住了自己',
  category: '慧慧',
  content: '李老师在讲台上放了一盘香喷喷的小饼干，说："这是等一会儿手工课做完以后，奖励给大家的。现在谁都不许拿哦。"\n\n然后李老师有事出去了一会儿，教室里只剩下小朋友们和那盘饼干。\n\n饼干真香啊！有的小朋友忍不住了，偷偷拿了一块吃。"反正老师不在，吃一块没关系。"\n\n慧慧也很想吃，口水都快流出来了。但是她想起老师说的话——现在不许拿。\n\n慧慧对自己说："老师说了做完手工才能吃，我要说话算话，管住自己。"\n\n为了不去想饼干，慧慧转过身，专心地做起了手工。她把注意力放在剪纸、粘贴上，慢慢就不去想饼干了。\n\n李老师回来了，发现盘子里的饼干少了几块。她没有说什么，只是问："刚才老师不在的时候，谁没有拿饼干呀？"\n\n慧慧和几个管住了自己的小朋友举起了手。\n\n李老师笑了："你们真了不起！老师不在的时候也能管住自己，遵守约定，这叫自律。"\n\n李老师给管住自己的小朋友每人发了两块饼干作为奖励。那些没忍住偷吃的小朋友，红着脸低下了头。\n\n慧慧吃着香甜的饼干，心里特别踏实。\n\n乐乐问："慧慧，你不想吃吗？怎么忍住的？"\n\n慧慧说："想吃呀，可是老师说了不能拿。我就转过身做手工，不去看它、不去想它，就忍住了。而且，等待以后吃到的饼干，更香甜。"\n\n慧慧告诉大家：自律就是在没有人监督的时候，也能管好自己，遵守规则。忍住一时的诱惑，转移注意力，就能做到。能管住自己的人，才能做成大事。而且，靠自律得到的东西，会让你更有成就感。'
},
{
  id: 'huihui_116',
  title: '【慧慧的中班故事】第一百一十六集：慧慧帮助新同学',
  category: '慧慧',
  content: '班里来了一个新同学，叫朵朵。朵朵刚从外地转来，说话口音有点不一样，很害羞，一个人坐在角落里，不敢跟别人说话。\n\n有的小朋友觉得朵朵说话怪怪的，还偷偷笑她。朵朵更不敢开口了，眼泪在眼眶里打转。\n\n慧慧看到了，主动走过去，坐到朵朵旁边，微笑着说："你好，我叫慧慧。欢迎你来我们班！"\n\n朵朵小声说："我……我说话跟你们不一样，他们笑我……"\n\n慧慧说："说话有一点不一样没关系呀，那说明你会说不同地方的话，很厉害呢！我还想跟你学呢，你们那边怎么说\'你好\'？"\n\n朵朵教了慧慧一句家乡话，慧慧认真地学，学得有模有样。两个人一起笑了起来。\n\n慧慧拉着朵朵，带她认识班里的小朋友，带她玩滑梯、玩积木，还把自己的蜡笔借给朵朵用。\n\n慢慢地，朵朵不再害羞了，脸上有了笑容，还交到了好几个朋友。\n\n慧慧还悄悄跟那些笑朵朵的小朋友说："朵朵刚来，人生地不熟的，我们应该欢迎她、帮助她，而不是笑她。如果是你到了一个新地方，被大家笑，你会多难过呀。"\n\n小朋友们听了，都不好意思了，纷纷跟朵朵道歉，跟她做了朋友。\n\n李老师看到这一切，欣慰地说："慧慧真是个善良又有爱心的孩子。她让新同学感受到了温暖。"\n\n朵朵拉着慧慧的手说："慧慧，谢谢你。你是我在这里的第一个好朋友。"\n\n慧慧告诉大家：每个人都有不一样的地方，说话口音不同、来自不同的地方，这都很正常，不应该被嘲笑。对新来的人，我们要热情欢迎、主动帮助。善待别人，就会收获真诚的友谊。一个有爱心的孩子，走到哪里都会被人喜欢。'
},
{
  id: 'huihui_117',
  title: '【慧慧的中班故事】第一百一十七集：慧慧记住了安全规则',
  category: '慧慧',
  content: '李老师给大家上安全教育课，讲了好多安全知识：过马路要看红绿灯，红灯停绿灯行；不能跟陌生人走；不能玩火玩电；一个人在家不给陌生人开门……\n\n别的小朋友听过就忘了，只有慧慧认真记在了心里，还回家讲给爸爸妈妈听。\n\n有一天放学，慧慧和奶奶走散了。慧慧一个人站在幼儿园门口，有点着急，但她没有慌。\n\n一个陌生的叔叔走过来，笑眯眯地说："小朋友，你找不到家人了吧？叔叔带你去找，跟叔叔走。"还拿出糖果给慧慧。\n\n慧慧想起了李老师的话——不能跟陌生人走，不能吃陌生人的东西！\n\n慧慧摇摇头，礼貌但坚定地说："谢谢叔叔，不用了。老师说过不能跟陌生人走。我在这里等我奶奶，或者找门口的保安叔叔帮忙。"\n\n慧慧转身跑到了幼儿园门口的保安室，找到了穿制服的保安叔叔："保安叔叔，我和奶奶走散了，能帮我打电话给我妈妈吗？"\n\n保安叔叔帮慧慧联系了妈妈。很快，着急的奶奶就找过来了。原来奶奶只是去旁边接了个电话，一转眼慧慧就在等她了。\n\n那个陌生的叔叔见慧慧这么警惕，早就走了。\n\n奶奶知道后，惊出一身冷汗，紧紧抱住慧慧："幸好你记住了安全规则，没跟陌生人走！"\n\n李老师知道后，在全班表扬了慧慧："慧慧不但记住了安全规则，关键时刻还能用上，真是又聪明又勇敢！"\n\n慧慧告诉小伙伴们：安全知识一定要记牢，关键时刻能保护自己。找不到家人不要慌，站在原地等，或者找穿制服的警察、保安帮忙。绝对不能跟陌生人走，不吃陌生人的东西。记住这些，就能保护好自己。'
},
{
  id: 'huihui_118',
  title: '【慧慧的中班故事】第一百一十八集：慧慧的读书角',
  category: '慧慧',
  content: '慧慧最喜欢看书了。每次自由活动时间，别的小朋友玩玩具，慧慧就跑到读书角看图画书。\n\n她看恐龙的书，知道了霸王龙、三角龙；看太空的书，知道了月亮、星星、火箭；看动物的书，知道了大象用鼻子喝水、长颈鹿脖子长能吃到高处的叶子。\n\n慧慧看了好多书，懂得也越来越多。上课的时候，老师问的问题她常常能答上来，因为她在书里都看到过。\n\n"慧慧，你怎么懂这么多呀？"乐乐好奇地问。\n\n慧慧说："因为我爱看书呀。书里有好多好多知识，看得越多，懂得越多。看书就像跟很多聪明人聊天，能学到好多东西。"\n\n慧慧还把好看的书推荐给小伙伴们。她给乐乐推荐了恐龙的书，乐乐看了以后也迷上了恐龙，天天讲恐龙的故事。\n\n慢慢地，读书角的小朋友越来越多了。大家都发现，看书原来这么有意思，还能学到好多知识。\n\n李老师很高兴，在读书角添了更多的书，还设立了"读书小明星"。慧慧读的书最多，得了第一名。\n\n慧慧看书还有个好习惯——看完的书，她会轻轻放回原位，摆得整整齐齐，还爱护书本，不折页、不撕破。\n\n李老师表扬慧慧："慧慧不但爱读书，还爱护书，真是个好榜样。"\n\n慧慧告诉大家：书是知识的宝库。多读书，能让我们变得聪明、懂得道理、知道很多有趣的事。读书的孩子，眼界更宽，脑子更灵。而且，看完书要爱护它、放回原位，因为书是我们的好朋友。养成爱读书的习惯，会让你受益一辈子。'
},
{
  id: 'huihui_119',
  title: '【慧慧的中班故事】第一百一十九集：慧慧化解小争吵',
  category: '慧慧',
  content: '乐乐和壮壮为了一辆玩具汽车吵了起来。两个人都说是自己先拿到的，谁也不让谁，越吵越凶，差点要打起来。\n\n"是我先拿的！""明明是我！"\n\n周围的小朋友都不知道怎么办。慧慧走了过来。\n\n"你们别吵了，"慧慧说，"吵架解决不了问题。我们来想想办法。"\n\n慧慧先让两个人都冷静下来："你们一个一个说，到底是怎么回事？"\n\n乐乐说："我先看到这辆车，正要去拿。"\n\n壮壮说："可是我先摸到它的。"\n\n慧慧想了想，说："这样吧，你们两个都想玩，那就轮流玩。用沙漏计时，一人玩五分钟，时间到了就换另一个人。这样两个人都能玩到，公平不公平？"\n\n乐乐和壮壮想了想，都点了点头："好吧。"\n\n慧慧拿来了沙漏。乐乐先玩五分钟，然后换壮壮玩五分钟。两个人轮流玩，玩得可开心了，还一起用玩具车比赛，成了好朋友。\n\n刚才的争吵烟消云散了。\n\n李老师看到了，问慧慧："你是怎么让他们不吵的？"\n\n慧慧说："吵架的时候，两个人都在气头上，谁也听不进谁的。我先让他们冷静，然后弄清楚原因，再想一个两个人都能接受的公平办法。轮流玩，大家都有份，就不吵了。"\n\n李老师说："慧慧真会调解矛盾！这是很重要的本领呢。"\n\n从那以后，班里的小朋友有了矛盾，都爱找慧慧："慧慧，你帮我们评评理，想个办法。"慧慧成了大家的"小和事佬"。\n\n慧慧告诉大家：吵架、打架都解决不了问题，只会让事情更糟。遇到矛盾，先冷静下来，听听双方怎么说，然后想一个大家都能接受的公平办法。学会好好商量、互相谦让，就能化解矛盾，还能收获友谊。'
},
{
  id: 'huihui_120',
  title: '【慧慧的中班故事】第一百二十集：慧慧战胜了拖延',
  category: '慧慧',
  content: '李老师布置了一个小任务：每人回家画一幅"我的家人"，三天后带来。\n\n有的小朋友想着"还有三天呢，不急"，一直拖着不画。\n\n慧慧不一样。回到家，她当天就把画画好了。妈妈问："不是三天后才交吗？怎么这么着急？"\n\n慧慧说："早点做完，心里就轻松了。要是拖到最后一天，万一有别的事，或者画不好，就来不及了。"\n\n果然，到了第三天，那些拖延的小朋友慌了神。有的忘了画，早上急急忙忙乱画一张;有的画到一半发现颜料用完了，来不及买;有的熬到很晚才画完，第二天没精神。\n\n而慧慧呢，她的画早就画好了，还有时间检查、修改，把画画得特别漂亮——画上有爸爸、妈妈、爷爷、奶奶，还有她自己，一家人在一起，温馨极了。\n\n李老师把慧慧的画贴在了展示墙的最中间。"慧慧的画最用心！因为她早早就完成了，还有时间画得更好。"\n\n乐乐懊恼地说："我拖到最后一天才画，画得乱七八糟的……"\n\n慧慧安慰他："下次早点开始就好了。事情早做完，心里踏实，还有时间做得更好。"\n\n从那以后，乐乐学着慧慧，一有任务就早点开始，不再拖延了。他发现，早做完真的轻松多了，再也不用手忙脚乱了。\n\n慧慧告诉大家：不要把事情拖到最后一刻。早点开始、早点完成，不但心里轻松，还有时间检查和改进，把事情做得更好。拖延只会让自己越来越慌张。"今天能做的事，不要拖到明天"，这是一个特别好的习惯。'
},
{
  id: 'huihui_121',
  title: '【慧慧的中班故事】第一百二十一集：慧慧懂礼貌',
  category: '慧慧',
  content: '慧慧是班里最有礼貌的小朋友。\n\n早上到幼儿园，她会主动跟老师问好："李老师早上好！"见到门卫爷爷，也会甜甜地叫："爷爷好！"\n\n别人帮了她，她一定会说"谢谢"；不小心碰到别人，她会说"对不起"；想请别人帮忙，她会说"请"；放学离开，她会说"再见"。\n\n这些礼貌用语，慧慧用得特别自然。\n\n有一天，慧慧的奶奶来接她，还带来了一些点心分给小朋友们。慧慧第一个说："谢谢奶奶！"然后招呼大家："大家一起谢谢我奶奶呀。"\n\n小朋友们跟着说："谢谢奶奶！"奶奶笑得合不拢嘴。\n\n李老师说："慧慧真懂礼貌。有礼貌的孩子，走到哪里都受欢迎。"\n\n慧慧发现，有的小朋友不太会用礼貌用语。她就悄悄提醒他们。乐乐想借慧慧的橡皮，一把抢过去。慧慧笑着说："你可以说\'慧慧，可以借我用一下橡皮吗？\'这样问，我会更愿意借给你哦。"\n\n乐乐红着脸重新说了一遍："慧慧，请借我用一下橡皮，好吗？"\n\n"当然可以！"慧慧笑着把橡皮递给他。\n\n乐乐发现，有礼貌地请求，别人更愿意帮忙。慢慢地，班里的小朋友都变得有礼貌了。\n\n"请""谢谢""对不起""你好""再见"——这些礼貌用语在教室里越来越多，班里的气氛也越来越友好。\n\n慧慧告诉大家：礼貌是一个人最好的名片。见面问好、受助道谢、做错道歉、请求说"请"，这些简单的话，能让别人感到被尊重，也让自己更受欢迎。一个懂礼貌的孩子，会交到更多的朋友，也会被更多人喜爱。'
},
{
  id: 'huihui_122',
  title: '【慧慧的中班故事】第一百二十二集：慧慧不骄傲',
  category: '慧慧',
  content: '慧慧各方面都表现得很好，得了好多小红花，还常常被老师表扬。\n\n有一次，慧慧在讲故事比赛中得了第一名。有的小朋友悄悄说："慧慧总是第一，有什么了不起的。"\n\n慧慧听到了，但她没有骄傲，也没有生气。她走过去对大家说："我这次讲得好，是因为我在家练习了很多遍。其实你们也有很多我比不上的地方呀。壮壮跑步比我快，乐乐画画比我好看，朵朵唱歌比我好听。每个人都有自己的长处。"\n\n小朋友们听了，都觉得慧慧说得对，心里舒服多了。\n\n慧慧从来不因为自己表现好就看不起别人。相反，她总是发现别人的优点，还向别人学习。\n\n她跟壮壮学跑步的姿势，跟乐乐学画画的技巧，跟朵朵学唱歌。慧慧说："每个人都是我的老师，我可以向大家学习。"\n\n正因为不骄傲、爱学习，慧慧进步得特别快，懂得也越来越多。\n\n李老师说："慧慧最难得的，不是她表现好，而是她表现好却不骄傲，还虚心向别人学习。骄傲会让人停止进步，谦虚才能越来越棒。"\n\n有一次慧慧在拼图比赛中输给了朵朵，她一点都不难过，还真诚地祝贺朵朵："朵朵你拼得真快，教教我好吗？"\n\n朵朵很感动，把方法教给了慧慧。两个人的感情更好了。\n\n慧慧告诉大家：取得好成绩不要骄傲。骄傲的人会看不起别人，也会停止进步。真正聪明的人，会发现每个人的长处，虚心向别人学习。谦虚使人进步，骄傲使人落后。保持一颗谦虚好学的心，才能越来越优秀。'
},
{
  id: 'huihui_123',
  title: '【慧慧的中班故事】第一百二十三集：慧慧照顾生病的同学',
  category: '慧慧',
  content: '有一天，同桌乐乐在幼儿园突然发起烧来，脸红红的，蔫蔫地趴在桌上。\n\n慧慧第一个发现了："乐乐，你怎么了？脸好红。"她摸了摸乐乐的额头，"好烫！乐乐发烧了！"\n\n慧慧赶紧跑去告诉李老师："李老师，乐乐发烧了，额头很烫！"\n\n李老师赶紧过来，量了体温，果然发烧了。李老师一边联系乐乐的妈妈，一边让乐乐去休息室躺着。\n\n慧慧主动帮忙照顾乐乐。她给乐乐倒了一杯温水："乐乐，多喝点水，发烧要多喝水。"她还帮乐乐拿来了小毯子盖上。\n\n乐乐难受得快哭了，慧慧就坐在旁边陪着他，轻声安慰："别怕，妈妈马上就来接你了。发烧吃了药、休息一下就会好的。"\n\n慧慧还帮乐乐把书包收拾好，把他的作业本、水杯都装进去，这样妈妈来了就能直接带走。\n\n乐乐的妈妈来了，看到慧慧这么细心地照顾乐乐，特别感动："谢谢你，慧慧，这么会照顾人。"\n\n第二天，乐乐病好了，回到幼儿园，第一件事就是谢谢慧慧："慧慧，谢谢你昨天照顾我。有你陪着，我就不那么难受了。"\n\n慧慧说："我们是好朋友呀，朋友生病了当然要照顾。"\n\n李老师在班里表扬了慧慧："慧慧不但发现同学生病了及时报告老师，还细心地照顾同学，真是个有爱心的好孩子。"\n\n慧慧告诉大家：朋友生病或者有困难的时候，我们要关心他、帮助他。发现同学不舒服，要赶紧告诉老师;给生病的同学倒水、陪伴、安慰，都能让他们好受一些。关心别人、照顾别人，是一种温暖的爱心。你对别人好，别人也会对你好，友谊就是这样建立起来的。'
},
{
  id: 'huihui_124',
  title: '【慧慧的中班故事】第一百二十四集：慧慧的储蓄罐',
  category: '慧慧',
  content: '慧慧有一个小猪储蓄罐。每次得到零花钱，她都不会马上花掉，而是存一部分到储蓄罐里。\n\n有的小朋友一有零花钱就买零食、买小玩具，一下子花光了。\n\n乐乐问："慧慧，你有钱怎么不买好吃的呀？"\n\n慧慧说："我把钱存起来，是想买一样我特别想要的东西——一套画笔。它有点贵，一下子买不起。但是我每次存一点，存够了就能买了。"\n\n慧慧还有个记账本，画着小图案，记录自己存了多少、想买什么。\n\n慢慢地，储蓄罐越来越重。有一天，慧慧数了数，够买那套画笔了！\n\n慧慧用自己存的钱买了心爱的画笔，特别高兴，也特别珍惜——因为这是她一点一点存钱买来的。\n\n那些乱花钱的小朋友很羡慕："慧慧，你怎么攒下这么多钱？"\n\n慧慧说："每次少买一点零食，把钱存起来，积少成多，就能买大一点的东西了。而且，自己存钱买来的东西，会更珍惜。"\n\n慧慧还懂得分辨"需要"和"想要"。真正需要的东西才买，只是一时想要的，就忍一忍。这样她的钱花得很有计划。\n\n李老师听说了，表扬慧慧："慧慧小小年纪就懂得存钱、有计划地花钱，真了不起。"\n\n慧慧告诉小伙伴们：钱要有计划地花。不要一有钱就全花光，可以存一部分起来。积少成多，就能买到更想要的东西。还要分清楚"需要"和"想要"——需要的才买，想要的忍一忍。会管理零花钱的孩子，长大以后会更懂得珍惜和规划。'
},
{
  id: 'huihui_125',
  title: '【慧慧的中班故事】第一百二十五集：慧慧不怕出丑',
  category: '慧慧',
  content: '幼儿园要举办文艺表演，李老师问："谁愿意上台表演节目呀？"\n\n好多小朋友都不敢举手，怕在台上出丑，怕表演不好被人笑。\n\n慧慧勇敢地举起了手："老师，我愿意！我想表演唱歌。"\n\n其实慧慧唱歌也不是最好的，但她想试一试。\n\n有小朋友说："万一你唱错了，大家笑你怎么办？"\n\n慧慧说："唱错了没关系呀，重要的是我勇敢地上台了。如果因为怕出丑就不敢尝试，那永远也学不会、进步不了。"\n\n表演前，慧慧认真练习了好多遍。表演那天，虽然有点紧张，但她深吸一口气，勇敢地走上了台。\n\n慧慧的歌声响起来了。中间有一个音她唱得有点跑调，台下有几个小朋友笑了一下。但慧慧没有慌，也没有停下来，她继续认真地唱完了整首歌。\n\n唱完以后，台下响起了热烈的掌声。李老师带头鼓掌："慧慧唱得真好！最棒的是她敢于上台，从头到尾坚持唱完，非常勇敢！"\n\n那些笑过的小朋友也不好意思了——人家勇敢地上台，他们连举手都不敢。\n\n慧慧下台后，一点都不觉得丢脸，反而特别开心："我做到了！我在台上表演了！"\n\n受慧慧的鼓励，越来越多的小朋友也鼓起勇气报名表演了。大家发现，上台表演虽然有点紧张，但特别锻炼人，而且没有人真的会笑话勇敢尝试的人。\n\n慧慧告诉大家：不要怕出丑、怕失败。每个人刚开始都不完美，唱错、做错都很正常。重要的是勇敢地去尝试。如果因为害怕就什么都不敢做，那才是真的可惜。勇敢地迈出第一步，你就已经赢了。犯点小错没关系，勇于尝试的孩子最了不起。'
},
{
  id: 'huihui_126',
  title: '【慧慧的中班故事】第一百二十六集：慧慧爱护小树苗',
  category: '慧慧',
  content: '春天到了，幼儿园组织小朋友们种树。每个小朋友分到一棵小树苗，种在花园里，还挂上写着自己名字的小牌子。\n\n种下树苗只是开始。慧慧知道，小树苗需要照顾才能长大。\n\n每天来幼儿园，慧慧第一件事就是去看看她的小树苗，给它浇水。天热的时候多浇一点，下雨了就不浇。她还会帮小树苗拔掉旁边的杂草。\n\n有的小朋友种完树就不管了。他们的小树苗有的因为没浇水，叶子蔫了;有的被杂草缠住了，长不高。\n\n慧慧看到别的小朋友的树苗蔫了，就提醒他们："小树苗要每天浇水呀，不然会渴死的。"她还帮着一起照顾。\n\n日子一天天过去，慧慧的小树苗长得又高又壮，绿油油的，还发出了新芽。\n\n李老师说："慧慧的小树苗长得最好，因为她坚持照顾。种下容易，坚持照顾难。慧慧的耐心和责任心，让小树苗健康成长。"\n\n慧慧摸着自己的小树苗，高兴地说："看着它一点一点长大，好有成就感呀！"\n\n她还教大家怎么照顾树苗：什么时候浇水、怎么拔草、怎么捉虫。在慧慧的带动下，小朋友们都开始认真照顾自己的树苗了，花园里的小树苗都长得郁郁葱葱。\n\n慧慧告诉大家：种下一棵树苗，就要负责照顾它长大。这叫责任心。做任何事情都一样，开始了就要坚持负责到底，不能半途而废。而且，爱护花草树木、保护大自然，是每个人的责任。看着自己照顾的生命一天天成长，是最幸福的事。等这些小树长成大树，能给大家遮阴，那多好呀。'
},
{
  id: 'huihui_127',
  title: '【慧慧的中班故事】第一百二十七集：慧慧的观察日记',
  category: '慧慧',
  content: '慧慧在窗台上种了一颗豆子，想看看它是怎么发芽长大的。\n\n她每天观察豆子的变化，还画了一本"观察日记"。\n\n第一天：豆子埋进了土里，什么也看不见。第三天：土里冒出了一个小小的白芽。第五天：小芽变绿了，钻出了土面。第七天：长出了两片小小的嫩叶。第十天：又长高了，叶子变大了。\n\n慧慧把每一天的变化都仔细地画下来、记下来。她发现豆芽是弯弯地钻出土的，叶子会朝着有阳光的方向长。\n\n"好神奇呀！"慧慧观察得津津有味。\n\n有一天，慧慧发现豆芽有点歪，都朝着窗户那边长。她想了想："是不是因为阳光从窗户照进来，豆芽朝着阳光长呢？"\n\n慧慧做了个小实验：她把花盆转了个方向。过了几天，豆芽又朝着窗户的方向弯回去了！\n\n"果然！植物会朝着阳光生长！"慧慧兴奋地发现了这个秘密。\n\n她把观察日记带到幼儿园，给小朋友和老师看。大家都惊叹不已："慧慧观察得好仔细呀！"\n\n李老师说："慧慧不但认真观察，还会思考、会做实验，发现了\'植物向着阳光生长\'的科学道理。这就是科学家做研究的方法呀！"\n\n慧慧的观察日记激发了小朋友们的兴趣。大家也开始种豆子、养蚕、观察小动物，记录它们的变化。\n\n慧慧告诉大家：世界上有好多有趣的秘密，只要你用心观察、认真记录、动脑思考，就能发现它们。多问几个"为什么",然后想办法找到答案。爱观察、爱思考、爱动手的孩子，会发现学习原来这么有趣，世界原来这么奇妙。'
},
{
  id: 'huihui_128',
  title: '【慧慧的中班故事】第一百二十八集：慧慧遵守约定',
  category: '慧慧',
  content: '慧慧和好朋友朵朵约好了，周六上午在幼儿园门口见面，一起去图书馆看书。\n\n周六早上，天突然下起了小雨。慧慧的妈妈说："下雨了，要不别去了吧？"\n\n慧慧摇摇头："不行，我和朵朵约好了。朵朵一定会去的，如果我不去，她一个人在雨里等，多着急呀。"\n\n慧慧穿上雨衣，带上雨伞，准时来到了幼儿园门口。\n\n果然，朵朵已经在那里等着了。看到慧慧来了，朵朵特别高兴："慧慧，我就知道你一定会来！"\n\n原来朵朵也想过下雨会不会不来，但她相信慧慧一定会遵守约定。\n\n两个好朋友一起打着伞去了图书馆，度过了愉快的一天。\n\n回家的路上，朵朵说："慧慧，谢谢你冒雨来赴约。有的人一遇到点困难就不守约定了，可你没有。"\n\n慧慧说："答应了别人的事，就要做到。这是对朋友的尊重。如果我因为下雨就不来，朵朵会失望，也会不再相信我了。"\n\n李老师听说了这件事，在班里讲给大家听："慧慧遵守约定，说到做到，哪怕下雨也准时赴约。这种守信用的品质，非常可贵。"\n\n小朋友们都很佩服慧慧。大家也学着她，答应别人的事情努力做到。\n\n慧慧还说：如果真的因为特殊原因去不了，一定要提前告诉对方，说声对不起，不能让人白等。\n\n慧慧告诉大家：守信用是做人的根本。答应了的事，就算遇到困难也要尽力做到。一个说话算话的人，才能得到别人的信任和真心的友谊。如果实在做不到，也要提前告知、诚恳道歉。守信的孩子，走到哪里都会被人信赖。'
},
{
  id: 'huihui_129',
  title: '【慧慧的中班故事】第一百二十九集：慧慧的整理魔法',
  category: '慧慧',
  content: '慧慧的小柜子和书包总是整整齐齐的，什么东西放在哪里，她一清二楚，找起来又快又方便。\n\n而有的小朋友的柜子和书包乱糟糟的，找一样东西要翻半天，常常找不到，急得团团转。\n\n乐乐的书包就像一个"大杂烩"——书、蜡笔、零食、玩具全混在一起。有一次他找一支铅笔，翻了整个书包都没找到，急哭了。\n\n慧慧走过来："我来帮你，也教你一个整理的魔法。"\n\n慧慧把乐乐的东西全倒出来，然后开始分类："书放在一起，蜡笔放进笔袋，玩具放这个格子，零食放那个格子。每样东西都有自己的家。"\n\n整理好以后，乐乐的书包变得整整齐齐。他找那支铅笔，一下子就在笔袋里找到了。\n\n"哇，好神奇！"乐乐惊喜地说。\n\n慧慧说："这不是魔法，是整理的方法。把东西分类，每样东西都放在固定的地方。用完了放回原位。这样就永远不会乱，也不会找不到了。"\n\n慧慧还教大家一个口诀:"用完东西放回家，分类摆放最整齐，需要的时候找得快。"\n\n在慧慧的帮助下，小朋友们都学会了整理。教室里的柜子、书包都变得整整齐齐的。李老师再也不用帮小朋友们找丢失的东西了。\n\n李老师表扬慧慧："慧慧不但自己整理得好，还把方法教给大家，让全班都变整洁了。真是个爱整洁、乐于分享的好孩子。"\n\n慧慧告诉大家：整理东西是一个特别有用的本领。把东西分类，每样东西都有固定的位置，用完放回原处。这样不但看起来整齐，找东西也又快又方便，再也不会手忙脚乱了。养成爱整洁、会整理的好习惯，会让你的生活变得井井有条。'
},
{
  id: 'huihui_130',
  title: '【慧慧的中班故事】第一百三十集：慧慧升大班啦',
  category: '慧慧',
  content: '一学年过去了，慧慧要从中班升到大班了。\n\n期末的时候，幼儿园举办了"最佳小朋友"评选。老师和小朋友们一起投票，慧慧得票最多，当选了！\n\n李老师在颁奖的时候说："慧慧这一年表现特别棒。她聪明好学——爱看书、爱观察、爱动脑筋;她自律——管好自己的时间和物品，能抵挡诱惑;她勇敢——不怕黑、敢上台、遇事冷静;她机智——总能想出好办法解决问题;她还很善良——帮助新同学、照顾生病的伙伴、爱护小动物和花草。慧慧是我们大家学习的好榜样！"\n\n台下响起了热烈的掌声。\n\n慧慧走上台，捧着奖状，谦虚地说："谢谢老师和小朋友们。其实我也有很多要学习的地方。壮壮跑得比我快，乐乐画得比我好，朵朵唱得比我好听。我要向大家学习，继续努力！"\n\n小朋友们更喜欢慧慧了——因为她这么优秀，却一点都不骄傲。\n\n放学回家，慧慧把奖状给爸爸妈妈看。妈妈骄傲地抱住她："我们慧慧真棒！"\n\n慧慧说："妈妈，我升大班以后，会继续好好学习，做一个更好的自己。"\n\n回想这一年，慧慧学会了好多好多——自己的事情自己做，认真听讲，勇敢诚实，自律守时，机智解决问题，善良帮助别人……\n\n这些好习惯、好品质，会一直陪伴着慧慧，让她成长为一个越来越优秀的人。\n\n躺在床上，慧慧看着窗外的星星，心里想：明天又是新的一天，升了大班会有新的挑战，也会学到新的本领。不管遇到什么，只要动动脑筋、勇敢面对、不断努力，就一定没问题！\n\n慧慧甜甜地笑了，进入了美好的梦乡。梦里，她已经是一个能干的大班小朋友了，正带着弟弟妹妹们一起学习、一起成长呢。'
},
{
  id: 'jia_1',
  title: '【慧慧的家庭故事】第一集：爸爸辅导作业',
  category: '家',
  content: '晚上，慧慧在做幼儿园布置的小任务——数一数、写数字。有一道题她不会，急得皱起了眉头。\n\n"爸爸，这道题我不会……"慧慧有点沮丧。\n\n爸爸没有直接告诉她答案，而是笑眯眯地坐下来:"来，我们一起想想。这道题是问，三个苹果加两个苹果一共几个，对吗？"\n\n爸爸拿来了五个真的小橘子:"你看，这里三个橘子，再加上这两个橘子，你数数一共几个？"\n\n慧慧数了数:"一、二、三、四、五，五个！"\n\n"对啦！那三加二等于几？"\n\n"等于五！"慧慧恍然大悟，"原来这么简单！"\n\n爸爸说:"你看，遇到不会的题，别着急。我们可以用身边的东西帮忙想，把难的题变简单。慧慧真聪明，一下就懂了！"\n\n慧慧开心地把题做对了。她发现，有爸爸这样引导，学习一点都不难，还很有趣。\n\n爸爸摸摸她的头:"作业遇到不会的，先自己动脑想，想不出来可以问爸爸妈妈，但爸爸不会直接告诉你答案，而是帮你自己想明白。因为自己想明白的，才真正学会了。"\n\n慧慧点点头。从那以后，她做作业遇到难题，会先自己想，实在不会才问爸爸，而且喜欢上了动脑筋的感觉。\n\n这个温馨的夜晚，慧慧不但学会了做题，还明白了:学习要靠自己动脑，爸爸妈妈是帮手，不是"答案机"。有爱的陪伴和正确的引导，学习就变成了快乐的事。'
},
{
  id: 'jia_2',
  title: '【慧慧的家庭故事】第二集：全家一起做运动',
  category: '家',
  content: '周末的早晨，爸爸提议:"今天天气真好，我们全家一起去公园锻炼吧！"\n\n慧慧一开始还有点懒:"我想在家看动画片……"\n\n爸爸做了个鬼脸，幽默地说:"看动画片会让小肚子长肉肉，运动才能让慧慧长高高、跑快快，像小鹿一样！走喽，比比谁先到门口！"\n\n慧慧被爸爸逗笑了，一下子来了精神:"我先到！"一家人笑着出了门。\n\n在公园里，一家三口一起跑步、跳绳、做操。爸爸还带慧慧玩"追逐游戏",妈妈在旁边给他们加油。慧慧跑得满头大汗，但特别开心。\n\n爸爸边跑边说:"运动的好处可多啦——身体强壮、少生病、长得高、心情好。而且全家一起运动，多快乐呀！"\n\n慧慧跳绳跳了三十个，特别有成就感。妈妈说:"慧慧进步好大，上次才跳十个呢！坚持运动，越来越棒！"\n\n运动完，一家人坐在草地上休息，吃着水果，聊着天，暖洋洋的阳光洒在身上，特别幸福。\n\n慧慧说:"爸爸妈妈，以后我们每个周末都一起运动好不好？"\n\n"好呀！"爸爸妈妈异口同声。\n\n从那以后，全家一起运动成了慧慧家的好习惯。慧慧的身体越来越棒，一家人的感情也越来越好。\n\n慧慧明白了:运动能让身体健康、心情愉快。全家一起运动，不但锻炼了身体，还增进了感情。爸爸用幽默的方式让运动变得好玩，让慧慧爱上了锻炼。健康和快乐，是家给的最好礼物。'
},
{
  id: 'jia_3',
  title: '【慧慧的家庭故事】第三集：完成目标得奖励',
  category: '家',
  content: '慧慧想要一套新的画笔。妈妈说:"这套画笔可以有，不过我们来做个约定好不好？"\n\n妈妈和慧慧一起制定了一个"小目标":这个星期，慧慧要做到——自己按时起床、自己刷牙洗脸、认真完成幼儿园的小任务、每天帮忙做一件家务。做到了，就能得到画笔作为奖励。\n\n妈妈还做了一张"目标表",贴在墙上。慧慧每做到一项，就贴一颗小星星。\n\n慧慧特别有干劲。第一天，她按时起床、刷牙洗脸、做任务、帮忙擦桌子——贴了四颗星星！第二天、第三天……慧慧每天都努力做到。\n\n有一天早上慧慧有点想赖床，但一看墙上的目标表，就想起了约定，立刻爬起来:"我要坚持！为了画笔，也为了做到自己的约定！"\n\n一个星期过去了，慧慧的目标表贴满了星星，全部做到了！\n\n妈妈开心地把新画笔送给慧慧:"慧慧真棒！靠自己的努力完成了目标，这套画笔是你应得的奖励！"\n\n慧慧拿到画笔，特别珍惜——因为这是自己努力挣来的，比直接得到的更有意义。\n\n爸爸说:"慧慧，你看，定个目标，努力去做，做到了就有收获。这就是\'一分耕耘，一分收获\'。想要什么，靠自己努力争取，最有成就感！"\n\n慧慧用力点头。她明白了:想要的东西，可以通过定目标、努力完成来争取。靠自己努力得到的奖励，最珍贵、最有意义。而且，为了目标坚持努力的过程，还养成了好习惯。'
},
{
  id: 'jia_4',
  title: '【慧慧的家庭故事】第四集：爸爸的幽默魔法',
  category: '家',
  content: '慧慧不小心把牛奶打翻了，洒了一桌子。她有点害怕，以为爸爸会批评她。\n\n没想到，爸爸走过来，看着桌上的牛奶，一本正经地说:"哇！慧慧，你看，这滩牛奶像不像一朵白云？还有点像一只小绵羊在跑步！"\n\n慧慧被爸爸逗笑了，紧张一下子没了。\n\n爸爸拿来抹布，笑着说:"打翻牛奶没关系，谁都会有失手的时候。重要的是我们把它擦干净，下次拿杯子小心一点就好。来，我们一起把这朵\'牛奶云\'擦掉！"\n\n慧慧和爸爸一起擦桌子，还把擦的过程编成了游戏:"消灭牛奶云！嗖嗖嗖！"擦完了，两个人哈哈大笑。\n\n慧慧说:"爸爸，我以为你会骂我呢。"\n\n爸爸说:"骂你有什么用呀？牛奶又不会因为我骂你就自己回到杯子里。哈哈！犯了小错误不可怕，笑一笑，改正就好。生活里遇到不顺心的事，用幽默和乐观去面对，就没那么糟糕了。"\n\n慧慧记住了爸爸的话。后来，她遇到不顺心的小事，也学着爸爸乐观、幽默地面对——积木倒了，她说"哗，积木在跳舞";画错了，她说"这个错误变成了一只小怪兽,挺可爱"。\n\n慧慧变得越来越乐观开朗，遇到小挫折也不哭不闹，笑一笑就过去了。\n\n慧慧明白了:生活里难免有小失误、小挫折。用幽默和乐观的心态去面对，事情就没那么糟糕。爸爸的幽默魔法，让家里充满了欢笑，也让慧慧学会了乐观。笑对生活，快乐就会更多。'
},
{

  content: '爸爸发现慧慧有时候做事没条理——一会儿玩、一会儿吃、一会儿又想看书，时间安排得乱乱的。\n\n爸爸说:"慧慧，我们一起来制定一个\'每日计划\'好不好？这样每天做什么都清清楚楚，还能养成好习惯。"\n\n爸爸和慧慧一起画了一张作息表，用图画表示（因为慧慧还不太认字）:太阳升起的图案表示早上起床、牙刷图案表示刷牙、饭碗图案表示吃饭、书本图案表示学习、皮球图案表示运动、月亮图案表示睡觉……\n\n慧慧照着计划表安排自己的一天:早上按时起床、刷牙洗脸、吃早饭;上午学习、看书;下午运动、玩耍;晚上按时睡觉。\n\n一开始，慧慧还不太习惯，但慢慢地，她发现按计划做事真好——每件事都有条不紊，不慌乱，还养成了好习惯。\n\n爸爸表扬她:"慧慧按计划做事，真自律！你看，有了计划，做事情就有条理，时间也不会浪费，好习惯也养成了。"\n\n慧慧说:"按计划做事真好，我知道什么时候该做什么，不用妈妈催，自己就能安排好。"\n\n慧慧还学会了根据情况调整计划——遇到特殊的事，灵活安排，但基本的作息保持规律。\n\n慧慧明白了:制定每日计划、按计划做事，能让生活有条理、不慌乱，还能养成好习惯、不浪费时间。自律，就是自己管好自己，按计划、按规律生活。有了好的作息和计划，慧慧的生活变得井井有条，她也越来越自律、越来越能干。'

{

  title: '【慧慧的家庭故事】第七集：爸爸讲他小时候的故事',
  category: '家',
  content: '睡觉前，慧慧缠着爸爸讲故事。爸爸说:"今天爸爸给你讲讲我小时候的故事吧。"\n\n爸爸说:"爸爸小时候呀，也和你一样上幼儿园。有一次，爸爸不想练习跳绳，觉得太难了，就想放弃。你猜怎么着？"\n\n"怎么着？"慧慧睁大眼睛。\n\n"你爷爷（爸爸的爸爸）跟我说，\'再试三次，不行就休息\'。我试了三次，居然跳成功了一个！我特别开心，就继续练，最后跳得可好了，还参加了比赛呢！"\n\n慧慧听得入迷:"爸爸小时候也和我一样呀！"\n\n爸爸笑着说:"是呀。每个大人都是从小孩长大的。爸爸小时候也会遇到困难、也想过放弃、也犯过错。但是，只要不轻易放弃、肯努力，就能越来越棒。你现在遇到的困难，爸爸小时候也遇到过，都能克服的！"\n\n爸爸还讲了自己小时候的很多趣事——爬树掏鸟窝被虫子吓到、和小伙伴一起捉迷藏、第一次学骑自行车摔了好多跤才学会……慧慧听得哈哈大笑。\n\n慧慧觉得，爸爸小时候的故事真有意思，而且让她明白——原来爸爸也是这样一步步长大的，遇到困难很正常，努力就能克服。\n\n爸爸说:"好了，听完爸爸的故事，慧慧也要像小时候的爸爸一样，遇到困难不放弃、努力去克服哦。"\n\n慧慧点点头，带着爸爸的故事和鼓励，甜甜地睡着了。\n\n慧慧明白了:每个大人都是从小孩长大的，爸爸妈妈小时候也遇到过困难、也努力成长。听爸爸讲小时候的故事，不但有趣，还让慧慧明白——遇到困难很正常，只要不放弃、肯努力，就能克服，就能成长。家人的经历和鼓励，给了慧慧成长的力量和勇气。'
},
{
  id: 'jia_8',
  title: '【慧慧的家庭故事】第八集：慧慧自己整理书包',
  category: '家',
  content: '以前，慧慧的书包都是妈妈帮忙整理的。这天，妈妈说:"慧慧长大了，从今天起，自己整理书包好不好？妈妈教你怎么整理。"\n\n妈妈教慧慧:"晚上睡觉前，想想明天要带什么——水杯、手工材料、要交的东西，一样一样准备好，放进书包。这样早上就不慌乱了。"\n\n慧慧学着整理:她把水杯装好、把明天手工课要用的彩纸放进去、把要带的东西一样样检查、放好。整理好书包，她还检查了一遍，确认没有落下东西。\n\n第二天早上，因为书包头天晚上就整理好了，慧慧从从容容，一点都不慌乱，什么都没落下。\n\n而以前靠妈妈整理的时候，有时候还会落东西、早上手忙脚乱。\n\n妈妈表扬慧慧:"慧慧自己整理书包，真棒！自己的事情自己做，还养成了提前准备的好习惯。"\n\n慧慧说:"自己整理书包，我知道每样东西放在哪，用的时候好找，也不会落东西了。而且头天晚上准备好，早上就不慌了！"\n\n从那以后，整理书包成了慧慧自己的事。她每天晚上都会认真整理好第二天的书包，做事越来越有条理、越来越独立。\n\n慧慧明白了:自己的事情自己做。学会自己整理书包、提前准备好第二天要用的东西，不但锻炼了独立能力，还养成了做事有条理、提前准备的好习惯，早上再也不手忙脚乱了。长大就是从自己做好一件件小事开始的。独立、有条理的孩子，做事更从容、更能干。'
},
{
  id: 'jia_9',
  title: '【慧慧的家庭故事】第九集：爸爸妈妈的表扬和鼓励',
  category: '家',
  content: '慧慧这段时间进步很大——会自己做很多事、学习认真、还帮忙做家务。\n\n爸爸妈妈经常表扬和鼓励她。慧慧做对了事，妈妈会说:"慧慧真棒！"慧慧努力了，爸爸会说:"慧慧的努力，爸爸看到了，加油！"慧慧遇到困难没放弃，妈妈会说:"慧慧真有毅力！"\n\n慧慧在爸爸妈妈的鼓励下，越来越自信、越来越努力。\n\n有一次，慧慧尝试自己扣扣子，扣了好久也扣不好，有点灰心。妈妈鼓励她:"没关系，慢慢来，你已经比上次进步了！再试试，妈妈相信你能行。"\n\n在妈妈的鼓励下，慧慧没有放弃，又试了几次，终于把扣子扣好了！"我扣好啦！"慧慧特别开心。\n\n爸爸妈妈的表扬和鼓励，像温暖的阳光，让慧慧充满了信心和力量。\n\n不过，爸爸妈妈也不是无原则地夸。慧慧做错了事，他们会温和地指出;慧慧偷懒了，他们会提醒。但更多的是鼓励和肯定。\n\n妈妈说:"每个孩子都需要鼓励。慧慧，你真的很棒，爸爸妈妈为你骄傲。有做得不够好的地方，我们一起改进。爸爸妈妈永远支持你、爱你。"\n\n慧慧感受到了满满的爱和支持，心里暖暖的，做什么都更有动力了。\n\n慧慧明白了:爸爸妈妈的表扬和鼓励，是成长路上温暖的力量。被肯定、被鼓励，会让人更自信、更努力。当然，做错了也要虚心接受指正。在爸爸妈妈的爱和鼓励中，慧慧充满信心地成长着。家人的支持和鼓励，是孩子最大的底气和动力。'
},
{
  id: 'jia_10',
  title: '【慧慧的家庭故事】第十集：一家人的读书时间',
  category: '家',
  content: '慧慧家有一个特别的习惯——每天晚上有半个小时的"全家读书时间"。\n\n这半个小时里，一家人各自看书:爸爸看他的书，妈妈看她的书，慧慧看图画书。大家都安安静静地看，谁也不看手机、不看电视。\n\n慧慧问:"爸爸妈妈，为什么我们要一起看书呀？"\n\n爸爸说:"因为读书能让我们学到好多知识、懂得好多道理，还能让心变得安静。全家一起看书，还能互相影响、互相带动。"\n\n慧慧看着爸爸妈妈都在认真看书，自己也认真地看图画书。看完了，一家人会分享:"我今天看到了一个有趣的故事……""我学到了一个新知识……"\n\n慧慧特别喜欢这个读书时间。她看了好多图画书，懂得越来越多，还爱上了读书。\n\n爸爸说:"你看，慧慧因为爱读书，懂得比很多小朋友都多。这就是读书的好处。而且我们全家一起读书，是最好的陪伴。"\n\n妈妈说:"比起看电视、玩手机，读书对我们更有好处。全家一起读书，营造了爱学习的家庭氛围，慧慧自然就爱上了读书。"\n\n慧慧家的读书时间，成了一家人最温馨、最有意义的时光。\n\n慧慧明白了:读书能让人学到知识、懂得道理、心灵安静。全家一起读书，营造了爱学习的家庭氛围，还是最好的陪伴。爸爸妈妈以身作则爱读书，慧慧也爱上了读书。一个爱读书的家庭，会养育出爱学习的孩子。读书的习惯，会让人受益一生。'
},
{
  id: 'jia_11',
  title: '【慧慧的家庭故事】第十一集：慧慧学会了等待',
  category: '家',
  content: '慧慧想要一个新的洋娃娃。她在商店里看到了，非常喜欢，想让妈妈马上买。\n\n妈妈说:"慧慧，这个洋娃娃有点贵。而且你家里已经有好几个娃娃了。这样吧，如果你真的很想要，我们可以把它作为你生日的礼物。现在离你生日还有一个月，你等一等好不好？"\n\n慧慧一开始有点失望，但她想了想，觉得妈妈说得有道理。"好吧，我等到生日。"\n\n这一个月里，慧慧偶尔会想起那个洋娃娃，但她学会了等待，没有哭闹、没有纠缠。她还发现，越是期待，越觉得那个娃娃珍贵。\n\n终于，生日到了！妈妈把那个心心念念的洋娃娃送给了慧慧。慧慧高兴极了:"谢谢妈妈！这是我等了一个月的礼物，我太喜欢了！"\n\n因为等待了一个月，慧慧特别珍惜这个洋娃娃，玩的时候可小心了。\n\n妈妈说:"慧慧，你看，学会等待，礼物会更珍贵。想要的东西，不一定马上就能得到，有时候需要等待。而且，等待过后得到的，会更让人珍惜和开心。"\n\n爸爸补充:"这就是\'延迟满足\'。能够为了更好的结果而等待、忍耐，是一种很重要的能力。能等待的孩子，长大更有出息呢！"\n\n慧慧明白了:想要的东西不一定马上就能得到，有时候需要学会等待。为了更好的结果而耐心等待、不哭闹纠缠，是一种可贵的能力（叫"延迟满足"）。而且，等待过后得到的东西会更珍贵、更让人珍惜。学会等待和忍耐，是成长和自律的重要一课。'
},
{
  id: 'jia_12',
  title: '【慧慧的家庭故事】第十二集：爸爸教慧慧认路',
  category: '家',
  content: '周末，爸爸带慧慧出门。爸爸说:"今天，爸爸教你认认从家到公园的路，以后你就知道怎么走了。"\n\n一路上，爸爸指着标志性的东西教慧慧记路:"你看，出门先经过那个红色的大门;然后看到一棵大树就往左拐;再走过一座小桥;看到那个蓝色的滑梯，就到公园啦！"\n\n慧慧认真地记着这些标志——红大门、大树、小桥、蓝滑梯。\n\n回家的时候，爸爸说:"现在，慧慧当小向导，带爸爸回家好不好？"\n\n慧慧兴奋地当起了向导:"看到蓝滑梯，我们往回走;走过小桥;看到大树往右拐;经过红大门,就到家啦！"她真的把爸爸带回了家！\n\n"慧慧太厉害了！记路记得这么准！"爸爸表扬她。\n\n慧慧特别有成就感。爸爸说:"记路要记住路上的标志——大树、桥、特别的建筑。这样就不会迷路了。当然，你还小，出门一定要牵着大人的手，不能自己乱走。"\n\n爸爸还教慧慧:"万一和爸爸妈妈走散了，要待在原地别乱走，或者找警察叔叔、保安帮忙，还要记住爸爸妈妈的电话和家的大概位置。"\n\n慧慧把这些都记在了心里。\n\n慧慧明白了:认路要记住路上的标志性东西。学会认路、记路，是很有用的本领。同时，小朋友出门一定要牵着大人的手，不能乱走;万一走散，要待在原地或找警察、保安帮忙。爸爸不但教了慧慧认路的本领，还教了走失时的安全知识。学本领的同时注意安全，才是最聪明的。'
},
{
  id: 'jia_13',
  title: '【慧慧的家庭故事】第十三集：慧慧不乱要东西',
  category: '家',
  content: '妈妈带慧慧去超市买东西。超市里有好多好吃的、好玩的，摆得琳琅满目。\n\n有的小朋友一进超市，看到什么都要买，不买就哭闹、在地上打滚。\n\n慧慧不一样。她虽然也看到了很多喜欢的东西，但她没有乱要。她跟妈妈说:"妈妈，那个饼干看起来好好吃，但是我们家里还有零食，就不买了吧。"\n\n妈妈很惊喜:"慧慧真懂事！知道家里还有，就不重复买了。"\n\n慧慧看到一个漂亮的玩具，也很想要，但她想了想:"我已经有很多玩具了，这个跟家里的差不多，不买了。"\n\n妈妈说:"慧慧，你能分清\'需要\'和\'想要\',真棒！需要的东西才买，只是一时想要、其实用不上的，就不买。这样才不浪费钱。"\n\n买完必需的东西，妈妈主动说:"慧慧今天表现这么好，不乱要东西，妈妈奖励你选一样你最想要的小东西吧。"\n\n慧慧仔细挑选，选了一包她真正喜欢的贴纸。因为是妈妈奖励的、自己认真挑的，她特别开心。\n\n妈妈说:"你看，不乱要东西、懂得节制的孩子，反而能得到奖励。乱哭闹要东西，是得不到的。"\n\n慧慧明白了:去超市、商场，不能看到什么都要，更不能用哭闹的方式要东西。要分清"需要"和"想要"——需要的、用得上的才买，一时想要、其实用不上的就不买。懂得节制、不乱要东西的孩子，既不浪费，还会得到父母的信任和奖励。学会控制自己的欲望，是自律和懂事的表现。'
},
{
  id: 'jia_14',
  title: '【慧慧的家庭故事】第十四集：全家包饺子',
  category: '家',
  content: '周末，妈妈说:"今天我们全家一起包饺子吧！"慧慧一听，兴奋极了。\n\n妈妈和好了面、调好了馅。爸爸负责擀饺子皮，慧慧和妈妈负责包。\n\n慧慧一开始不会包，包出来的饺子歪歪扭扭，还露馅了。但她没有灰心，认真看妈妈怎么包:"放一点馅在中间，对折，然后把边捏紧。"\n\n慧慧学着包，多包几个以后，慢慢就包得好了。虽然还是没有妈妈包得漂亮，但一个比一个好。\n\n爸爸擀皮的时候，故意把一个皮擀成了长条形，逗慧慧:"看，我擀了一个\'饺子皮面条\'！"全家哈哈大笑。\n\n一家人一边包饺子，一边说说笑笑，特别温馨。慧慧还包了几个"创意饺子"——有的捏成小花的形状，有的捏成小兔子的形状。\n\n饺子煮好了，热气腾腾的。慧慧吃着自己包的饺子，特别香、特别自豪:"这是我自己包的饺子，真好吃！"\n\n妈妈说:"自己动手做的东西，就是特别香。而且全家一起包饺子，多热闹、多幸福呀！"\n\n爸爸说:"慧慧今天学会了包饺子，又多了一项本领。而且，一家人一起做事，是最快乐的时光。"\n\n慧慧明白了:全家一起动手做事——比如包饺子，不但能学到本领（包饺子），还能享受温馨快乐的家庭时光。自己动手做的东西特别香、特别有成就感。家人在一起说说笑笑、齐心协力，是最幸福的事。劳动创造快乐，陪伴创造幸福。'
},
{
  id: 'jia_15',
  title: '【慧慧的家庭故事】第十五集：慧慧承认打碎了碗',
  category: '家',
  content: '慧慧帮忙收拾碗筷的时候，一不小心，一个碗滑落，"啪"地摔碎了。\n\n当时厨房里没有别人。慧慧愣了一下——她可以偷偷把碎片藏起来，假装不知道。\n\n但慧慧没有这样做。她主动跑去告诉妈妈:"妈妈，对不起，我收拾碗的时候不小心把一个碗打碎了。"\n\n妈妈听了，第一反应是:"慧慧，你没被划伤吧？"她赶紧检查慧慧的手，"没受伤就好。碗碎了没关系，我们小心地把碎片清理掉。"\n\n妈妈一点都没有责怪慧慧，反而表扬她:"慧慧，你能主动承认、告诉妈妈，很诚实、很勇敢。打碎碗是不小心，谁都会有失手的时候。但是你没有隐瞒，这一点最难得。"\n\n妈妈教慧慧怎么安全地清理碎片:"碎片很锋利，会划伤手。要用扫把和簸箕扫，不能用手直接捡。"\n\n慧慧和妈妈小心地把碎片清理干净了。\n\n妈妈说:"以后拿碗要拿稳，一次不要拿太多。不过就算再打碎，也要像今天这样诚实地告诉妈妈，还要注意安全，别被划伤。"\n\n慧慧点点头。她庆幸自己诚实地承认了，妈妈不但没骂她，还关心她、教她道理。\n\n慧慧明白了:做错了事、闯了小祸（比如打碎碗），要诚实地承认，不能隐瞒。诚实地面对错误，会得到理解和原谅。而且，处理这类事情要注意安全——碎片锋利不能用手捡。爸爸妈妈更在乎的是孩子有没有受伤、诚不诚实，而不是那个碎掉的碗。诚实和安全，比什么都重要。'
},
{
  id: 'jia_16',
  title: '【慧慧的家庭故事】第十六集：爸爸的"错题游戏"',
  category: '家',
  content: '慧慧做数字练习的时候，有几道题做错了。她有点不开心，怕爸爸说她。\n\n爸爸看了看，没有批评她，而是笑着说:"来，我们玩个\'找错题小侦探\'的游戏！这几道题里藏着几只\'小错误怪\',我们来把它们找出来、消灭掉！"\n\n慧慧一听是游戏，来了兴趣:"好呀！小错误怪在哪里？"\n\n爸爸指着一道题:"这里有一只！三加二，你写的是六，对不对呀？我们数数看。"慧慧数了数手指:"三、四、五，是五！我写错了，六是错误怪！"她把错误改成了五。\n\n就这样，爸爸把改错题变成了"抓错误怪"的游戏。慧慧一道一道地检查、改正，把"错误怪"一只只找出来、消灭掉，玩得可开心了。\n\n改完以后，爸爸说:"慧慧真是个厉害的小侦探！把错误都找出来改正了。你看，做错题不可怕，重要的是把它改对、弄明白。改正了错误，就真正学会了！"\n\n慧慧发现，原来改错题也可以这么好玩，一点都不怕了。而且，通过改错，她真正弄懂了那几道题。\n\n从那以后，慧慧不怕做错题了。她会认真检查、改正错误，还把改错当成"抓错误怪"的游戏。她的进步特别快。\n\n爸爸说:"错题是最好的老师。每改对一道错题，就学会了一个知识。不怕犯错、认真改错的孩子，进步最快。"\n\n慧慧明白了:做错题不可怕，重要的是认真检查、改正错误、弄明白道理。改正了错误，就真正学会了。爸爸用"抓错误怪"的游戏，让改错变得好玩，让慧慧不再害怕犯错。错题是最好的老师，不怕犯错、认真改错，才能不断进步。用有趣的方式对待学习，学习就变成了快乐的探险。'
},
{
  id: 'jia_17',
  title: '【慧慧的家庭故事】第十七集：慧慧早睡早起',
  category: '家',
  content: '慧慧家有个好规矩:每天按时睡觉、按时起床。\n\n到了晚上九点，就是慧慧的睡觉时间。妈妈会说:"慧慧，该睡觉啦。"慧慧虽然有时还想玩，但她知道规矩，会乖乖去刷牙、上床睡觉。\n\n爸爸妈妈也会给慧慧讲个温馨的睡前故事，然后关灯，让慧慧安心入睡。\n\n因为按时睡觉、睡得足，慧慧每天早上都能自己按时醒来，精神饱满，不用妈妈费劲叫。\n\n有的小朋友晚上不肯睡、看电视看很晚，结果早上起不来、没精神、上幼儿园还迟到。慧慧不一样，她早睡早起，每天都精力充沛。\n\n爸爸说:"慧慧，早睡早起身体好。晚上睡够了，身体才能长高、大脑才能休息好，第二天才有精神。这是很重要的好习惯。"\n\n慧慧问:"为什么晚上要睡觉呀？"\n\n妈妈说:"因为白天玩了一天、学了一天，身体和大脑都累了，晚上睡觉就是让它们好好休息、充电。而且，小朋友是在睡觉的时候长高的哦！"\n\n慧慧一听睡觉能长高，更愿意按时睡觉了。\n\n慧慧坚持早睡早起，身体越来越棒，长得也快，每天都精神饱满、开开心心的。\n\n慧慧明白了:早睡早起是很重要的好习惯。晚上按时睡觉、睡得足，身体和大脑才能好好休息、充电，第二天才有精神，还能长高。熬夜、睡不够，会没精神、长不好、还会迟到。养成早睡早起、作息规律的好习惯，身体健康、精神饱满，才能快乐地学习和生活。规律的作息，是健康和自律的基础。'
},
{
  id: 'jia_18',
  title: '【慧慧的家庭故事】第十八集：妈妈生病慧慧照顾',
  category: '家',
  content: '有一天，妈妈感冒了，头疼、发烧，躺在床上很难受。爸爸出差了，家里只有慧慧和妈妈。\n\n慧慧看到妈妈生病，特别心疼。她想起平时妈妈怎么照顾生病的自己，决定照顾妈妈。\n\n慧慧给妈妈倒了一杯温水:"妈妈，多喝水。"她还找来毛巾，帮妈妈敷额头。\n\n妈妈想吃点东西，慧慧虽然不会做饭，但她拿来了饼干和水果，还帮妈妈剥了橘子:"妈妈，吃点东西吧。"\n\n慧慧知道妈妈需要休息，就自己安安静静地看书、玩玩具，不吵妈妈。她还主动把家里收拾得整整齐齐，让妈妈不用操心。\n\n到了吃药的时间，慧慧提醒妈妈:"妈妈，该吃药了。"还帮妈妈拿药、倒水。\n\n妈妈感动极了:"慧慧真是妈妈的贴心小棉袄！会照顾生病的妈妈了。有慧慧照顾，妈妈的病都好了一半。"\n\n慧慧还给妈妈画了一张画，画上有太阳、笑脸和爱心，写上（画上）"妈妈快点好起来"。妈妈看了，心里暖暖的。\n\n在慧慧的照顾下，加上吃药休息，妈妈的病很快就好了。\n\n妈妈康复后，抱着慧慧说:"谢谢我的好女儿。你长大了，懂得照顾妈妈了。妈妈平时照顾你，你生病时妈妈心疼;现在妈妈生病，你照顾妈妈，妈妈特别欣慰。"\n\n慧慧明白了:平时爸爸妈妈照顾我们、爱我们，当他们生病、辛苦的时候，我们也要照顾他们、关心他们。给生病的家人倒水、敷额头、拿东西、提醒吃药、安安静静让他们休息，都是爱的表现。懂得照顾家人、回报父母的爱，是最美好的品德。家人之间互相关爱，家才充满温暖。'
},
{
  id: 'jia_19',
  title: '【慧慧的家庭故事】第十九集：爸爸带慧慧修玩具',
  category: '家',
  content: '慧慧最喜欢的小汽车玩具坏了，轮子掉了，跑不动了。慧慧很难过，以为要扔掉了。\n\n爸爸说:"别急，我们看看能不能修好。坏了不一定要扔，能修的就修，这样既节约，又能锻炼动手能力。"\n\n爸爸拿来了工具，和慧慧一起研究小汽车怎么坏的:"哦，是这个轮子的小卡扣松了。我们把它重新卡好就行。"\n\n爸爸手把手地教慧慧:"你看，把轮子对准这个位置，轻轻一按，卡扣\'咔\'一下卡住，就装好了。"\n\n慧慧学着爸爸的样子，小心地把轮子装了回去。"咔！"轮子装好了！小汽车又能跑了！\n\n"修好啦！修好啦！"慧慧高兴得跳起来。\n\n爸爸说:"你看，坏了的东西，动动脑筋、动动手，很多都能修好。修好了，既省钱，又锻炼了本领，还让玩具重新\'活\'过来。这多好呀！"\n\n慧慧特别有成就感——自己参与修好了心爱的玩具。她说:"以后玩具坏了，我们都试着修修看！"\n\n从那以后，慧慧家的东西坏了，一家人会先想办法修，实在修不好才换新的。慧慧也跟着爸爸学会了一些简单的修理，动手能力越来越强。\n\n爸爸还教慧慧:"平时爱护玩具，它们就不容易坏。轻拿轻放、玩完收好。"慧慧也更爱护自己的玩具了。\n\n慧慧明白了:东西坏了不一定要扔掉，能修的就修。修理东西既节约，又能锻炼动手能力，还能让心爱的东西重新"活"过来。爸爸带着慧慧一起修玩具，不但修好了玩具，还让慧慧学会了动手、懂得了节约和爱惜。勤俭节约、爱动手，是很好的品质。爱惜物品，物尽其用。'
},
{
  id: 'jia_20',
  title: '【慧慧的家庭故事】第二十集：慧慧的分享午餐',
  category: '家',
  content: '周末，妈妈做了慧慧最爱吃的红烧排骨。慧慧盛了满满一碗，正准备开吃。\n\n这时，爸爸说:"慧慧，排骨真香。不过爸爸妈妈也想吃呢。你会怎么分享呀？"\n\n慧慧愣了一下。以前她只顾自己吃，没想过分享。但她想了想，主动把碗里的排骨夹给爸爸妈妈:"爸爸吃一块，妈妈吃一块！"\n\n爸爸妈妈很开心:"慧慧懂得分享了，真棒！"\n\n慧慧发现，把好吃的分享给爸爸妈妈，看到他们开心，自己心里也美滋滋的，比一个人独吃开心多了。\n\n妈妈说:"慧慧，一家人在一起，好吃的要一起分享。你夹给爸爸妈妈，爸爸妈妈心里暖暖的;爸爸妈妈也总会把好的留给你。这就是一家人的爱。"\n\n慧慧还发现，其实爸爸妈妈平时总是把好吃的留给她——最大的鸡腿、最甜的水果，都先给慧慧。原来爸爸妈妈一直在默默地爱她、为她着想。\n\n从那以后，吃好吃的，慧慧会主动分享给爸爸妈妈，也会给爷爷奶奶留一份。她懂得了，爱是互相的、分享是快乐的。\n\n慧慧还把分享的习惯带到了幼儿园，跟小朋友们分享零食、玩具，收获了更多的友谊和快乐。\n\n慧慧明白了:好吃的、好东西，要懂得跟家人分享。一家人互相分享、互相为对方着想，就是浓浓的爱。爸爸妈妈总把好的留给孩子，孩子也要学会分享、回报爱。分享不但不会让自己少什么，反而收获了亲情和快乐。懂得分享和感恩的孩子，家庭更温暖、内心更幸福。'
},
{
  id: 'jia_21',
  title: '【慧慧的家庭故事】第二十一集：慧慧不怕黑睡觉',
  category: '家',
  content: '慧慧以前有点怕黑，睡觉一定要开着灯。可是开灯睡觉睡不好，对眼睛也不好。\n\n爸爸决定帮慧慧克服怕黑。他没有笑话慧慧，而是温和地说:"慧慧，黑暗里其实什么都没有，跟开灯时是一样的房间。爸爸小时候也怕黑，后来发现根本没什么可怕的。"\n\n爸爸陪着慧慧，关了灯，在黑暗里跟她说话:"你听，房间里静悄悄的，很安全。爸爸妈妈就在隔壁，随时保护你。黑暗只是灯关了而已，你熟悉的一切都还在。"\n\n爸爸还给慧慧买了一个可爱的小夜灯，发出柔柔的光:"如果一开始还有点怕，就开着这个小夜灯。它像月亮一样，柔柔地陪着你。慢慢习惯了，就可以关掉了。"\n\n慧慧抱着心爱的玩偶，在小夜灯柔和的光里，感觉安心多了。爸爸妈妈还在睡前给她讲温馨的故事、亲亲她的额头，让她带着满满的安全感入睡。\n\n慢慢地，慧慧不那么怕黑了。她发现，黑暗里真的什么可怕的东西都没有，房间还是那个熟悉温暖的房间。后来，她连小夜灯都不用开了，能安心地在黑暗中睡个好觉。\n\n爸爸表扬她:"慧慧真勇敢，战胜了怕黑！你看，很多害怕，其实是想象出来的。想清楚了、习惯了，就不怕了。"\n\n慧慧明白了:怕黑是很正常的，很多小朋友都会怕。但黑暗里其实什么都没有，房间还是熟悉安全的房间，爸爸妈妈也在身边保护。克服怕黑，可以先用小夜灯过渡，慢慢习惯。想清楚"黑暗不可怕",带着安全感入睡，就能战胜恐惧。有爸爸妈妈的爱和陪伴，慧慧变得越来越勇敢。战胜恐惧，就是成长。'
},
{
  id: 'jia_22',
  title: '【慧慧的家庭故事】第二十二集：全家大扫除',
  category: '家',
  content: '到了年底，慧慧家要来一次大扫除，把家里彻底打扫干净，迎接新年。\n\n爸爸说:"大扫除是我们全家的事，每个人都要出一份力。我们来分工！"\n\n爸爸负责擦高处的窗户和灯;妈妈负责厨房和卫生间;慧慧负责整理自己的房间、擦矮处的桌椅、给花浇水。\n\n慧慧干得可认真了。她把自己的玩具、书本都整理得整整齐齐，把桌椅擦得干干净净，还给每一盆花浇了水。\n\n一家人一边打扫，一边说说笑笑。爸爸擦窗户的时候，还唱起了歌;妈妈把厨房收拾得亮亮的;慧慧的房间焕然一新。\n\n打扫累了，一家人坐下来休息，喝口水。爸爸幽默地说:"我们家现在亮得能照出人影啦！"逗得大家哈哈大笑。\n\n经过全家的努力，家里变得干干净净、整整齐齐、亮亮堂堂，特别舒服。\n\n慧慧看着自己打扫的成果，特别有成就感:"我把房间打扫得这么干净！"\n\n爸爸说:"慧慧出了大力气！你看，全家一起动手，家很快就打扫干净了。这就是团结的力量。而且，干净整洁的家，住着多舒服呀。"\n\n妈妈说:"慧慧长大了，是家里的好帮手。维护干净的家，是我们每个人的责任。"\n\n慧慧明白了:大扫除、维护家庭整洁，是全家人共同的责任，需要每个人出力。全家分工合作、一起动手，又快又好，还其乐融融。自己动手打扫，能收获成就感;干净整洁的家，住着舒服。爱家、为家出力，是每个家庭成员的责任。团结协作、共同维护，家才更美好、更温暖。'
},
{
  id: 'jia_23',
  title: '【慧慧的家庭故事】第二十三集：慧慧存钱买礼物',
  category: '家',
  content: '快到妈妈的生日了。慧慧想给妈妈买一份生日礼物，但她没有钱。\n\n慧慧想到了一个办法——用自己攒的零花钱买。可是她的零花钱不太够。\n\n爸爸知道后，说:"慧慧想给妈妈买礼物，真有孝心！这样吧，你可以通过做家务来攒钱——每帮忙做一件家务，爸爸给你一点零花钱。你攒够了，就能买礼物了。"\n\n慧慧特别有干劲。她每天认真做家务——擦桌子、扫地、整理、浇花，一点一点地攒钱。她把钱放进小猪储钱罐，看着钱一天天变多。\n\n慧慧攒钱的时候，从不乱花——看到想买的零食、玩具，她都忍住了:"我要攒钱给妈妈买生日礼物，不能乱花。"\n\n终于，慧慧攒够了钱！她和爸爸一起去商店，用自己攒的钱，给妈妈买了一条漂亮的丝巾。\n\n妈妈生日那天，慧慧把礼物送给妈妈:"妈妈，生日快乐！这是我用自己做家务攒的钱给你买的礼物！"\n\n妈妈感动得眼泪都出来了:"这是妈妈收到的最珍贵的礼物！慧慧不但有孝心，还靠自己努力攒钱买礼物，妈妈太感动了！"\n\n慧慧特别开心——用自己努力攒的钱，给妈妈买了礼物，看到妈妈这么感动、这么开心，她觉得所有的努力都值得。\n\n慧慧明白了:想给家人买礼物，可以靠自己努力攒钱（比如做家务挣零花钱）。攒钱的时候要节制、不乱花。用自己努力挣来的钱买的礼物，最珍贵、最有意义，也最能表达孝心。孝敬父母、懂得感恩，还靠自己的努力去实现，这份心意比礼物本身更珍贵。爱和努力，是最好的礼物。'
},
{
  id: 'jia_24',
  title: '【慧慧的家庭故事】第二十四集：爸爸教慧慧游泳',
  category: '家',
  content: '夏天，爸爸带慧慧去游泳池学游泳。慧慧一开始有点怕水，不敢下水。\n\n爸爸没有强迫她，而是耐心地鼓励:"别怕，爸爸在旁边保护你。我们先在浅水区玩玩水，慢慢来。"\n\n爸爸先带慧慧在浅水区玩，让她熟悉水。然后一步步教:先学憋气、把头埋进水里;再学漂浮;然后学划水、蹬腿。\n\n慧慧一开始呛了几口水，有点想放弃。爸爸鼓励她:"没关系，爸爸学游泳的时候也呛过水。多练几次就好了。你已经比刚才进步了！"\n\n在爸爸的耐心指导和鼓励下，慧慧慢慢克服了怕水，学会了憋气、漂浮，最后能划着水游一小段了！\n\n"我会游泳啦！"慧慧高兴极了。\n\n爸爸表扬她:"慧慧真勇敢！从怕水到学会游泳，你克服了恐惧、坚持练习，太棒了！"\n\n爸爸还教慧慧游泳的安全:"游泳一定要有大人陪同，不能一个人去;不能去危险的河边、水库;下水前要热身。安全永远第一。"\n\n慧慧记住了。学会游泳后，慧慧不但多了一项本领，还锻炼了身体、变得更勇敢、更自信了。\n\n爸爸说:"学任何本领都一样——一开始可能害怕、困难，但只要不放弃、多练习，就能学会。而且，学本领的同时，一定要注意安全。"\n\n慧慧明白了:学游泳（或任何新本领），一开始可能害怕、会呛水、有困难，但只要不放弃、耐心练习，就能学会。爸爸的耐心指导和鼓励，帮慧慧克服了怕水、学会了游泳，还变得更勇敢自信。同时，游泳等活动一定要注意安全——有大人陪同、不去危险水域。勇敢尝试、坚持练习、注意安全，就能掌握新本领、战胜恐惧。'
},
{
  id: 'jia_25',
  title: '【慧慧的家庭故事】第二十五集：慧慧管理零花钱',
  category: '家',
  content: '爸爸妈妈每个星期会给慧慧一些零花钱。慧慧学会了管理自己的零花钱。\n\n慧慧把零花钱分成三份:一份用来买真正需要的小东西;一份存起来（攒着买大一点的东西或者给家人买礼物）;一份用来做有意义的事（比如给需要帮助的人）。\n\n她还有一个小本子，记录自己的钱花在了哪里、存了多少。\n\n爸爸看到了，很惊喜:"慧慧真会管钱！把零花钱分成几份，有花的、有存的、有做善事的，安排得真好！"\n\n慧慧买东西前会想:"这个是不是真的需要？值不值得买？"她不乱花钱，也不把钱一下子花光。\n\n有一次，慧慧看到一个很贵但用处不大的玩具，她忍住了没买:"这个太贵了，用处又不大，不买。我把钱存起来，买更有用的。"\n\n因为会管理零花钱，慧慧总能把钱用在该用的地方，还攒下了不少，买了自己真正想要的东西，还给妈妈买过生日礼物。\n\n爸爸说:"会管钱是很重要的本领。不乱花、懂储蓄、把钱用在有意义的地方，从小养成好习惯，长大就懂得理财了。"\n\n慧慧明白了:要学会管理自己的零花钱。可以把钱分成几份——花的、存的、做善事的。买东西前想想值不值、需不需要，不乱花、不一下子花光。懂得储蓄、把钱用在有意义的地方。从小学会管理零花钱、养成理性消费和储蓄的好习惯，长大才会更懂得规划和珍惜。会管钱，是自律和智慧的表现。'
},
{
  id: 'jia_26',
  title: '【慧慧的家庭故事】第二十六集：爸爸妈妈吵架了',
  category: '家',
  content: '有一天，爸爸和妈妈因为一件小事，有点不愉快，说话的语气有点冲。慧慧看到了，有点担心、有点害怕。\n\n不过，爸爸妈妈很快就意识到了。妈妈先冷静下来，爸爸也主动说:"刚才是我语气不好，对不起。"妈妈说:"我也有不对的地方。我们好好说。"\n\n两个人心平气和地把事情说开了，误会解除了，又和好了。\n\n爸爸妈妈还特意跟慧慧解释:"慧慧，刚才爸爸妈妈有点小争执，让你担心了。爸爸妈妈告诉你——大人之间偶尔有不同意见，是正常的。重要的是，我们会冷静下来、好好沟通、互相道歉，然后和好。"\n\n妈妈说:"爸爸妈妈永远相爱，也永远爱你。偶尔有小争执，不代表不相爱了。就像你和小朋友有时候也会有小矛盾，但很快就和好了，对不对？"\n\n慧慧点点头，放心了。她还学到了——有矛盾不可怕，关键是冷静、沟通、互相理解和道歉。\n\n爸爸说:"慧慧，以后你和别人有矛盾，也要像爸爸妈妈一样——不要吵、不要闹，冷静下来好好说，该道歉道歉，该理解理解。这样矛盾就化解了。"\n\n慧慧记住了。她发现，爸爸妈妈虽然偶尔有小争执，但他们相亲相爱、互相包容，家里充满了爱。\n\n慧慧明白了:家人之间偶尔有不同意见、小争执，是正常的，不用害怕。重要的是要冷静下来、好好沟通、互相理解、主动道歉，然后和好。有矛盾不可怕，处理矛盾的方式最重要——不吵不闹，冷静沟通。爸爸妈妈用行动告诉慧慧:相爱的家人会互相包容、化解矛盾。学会正确处理矛盾，无论在家还是和朋友，都很重要。'
},
{
  id: 'jia_27',
  title: '【慧慧的家庭故事】第二十七集：慧慧坚持练琴',
  category: '家',
  content: '慧慧开始学电子琴。刚开始很有新鲜感，可是练了一段时间，她觉得又难又枯燥，想放弃。\n\n"妈妈，练琴太难了，我不想练了……"慧慧有点打退堂鼓。\n\n妈妈没有责备她，而是理解地说:"妈妈知道，练琴确实需要坚持，会觉得枯燥。学任何本领，都会经过这个\'不想练\'的阶段。但是，如果现在放弃，之前的努力就白费了，也永远学不会了。"\n\n爸爸也来鼓励:"慧慧，你还记得学游泳吗？一开始也难、也想放弃，但你坚持下来，学会了，多有成就感！练琴也是一样。我们定个小目标——每天只练二十分钟，坚持一个月，看看会不会有变化。"\n\n慧慧答应试试。妈妈还想了个办法，让练琴变得有趣——把练习曲配上慧慧喜欢的动画，一边练一边"闯关"。\n\n慧慧每天坚持练二十分钟。慢慢地，她能弹出完整的曲子了！当她第一次完整地弹出一首好听的曲子时，特别有成就感:"我会弹啦！真好听！"\n\n坚持练了一段时间，慧慧越弹越好，还在家庭聚会上表演，得到了大家的掌声。她再也不觉得练琴枯燥了，反而爱上了弹琴。\n\n爸爸说:"你看，坚持过了最难的阶段，就会尝到甜头。学本领没有不辛苦的，但坚持下来，收获的是本领和自信。"\n\n慧慧明白了:学本领（比如练琴），会经过又难又枯燥、想放弃的阶段。这时候不能放弃——放弃了之前的努力就白费，也永远学不会。要坚持，可以定小目标、想办法让它变有趣。坚持过了最难的阶段，就会越来越好、尝到成功的甜头。爸爸妈妈的理解和鼓励，帮慧慧坚持了下来。坚持不懈，是学会任何本领的关键。'
},
{
  id: 'jia_28',
  title: '【慧慧的家庭故事】第二十八集：爸爸的乐观精神',
  category: '家',
  content: '周末，一家人本来计划去游乐园玩。可是早上起来，突然下起了大雨，去不成了。慧慧特别失望，噘着嘴。\n\n爸爸看到了，没有跟着失望，反而乐呵呵地说:"下雨去不成游乐园，没关系呀！我们可以在家里办一个\'室内游乐园\'！"\n\n爸爸把沙发垫子搭成"城堡",用被子做"隧道",还画了"游乐园门票"。一家人在家里玩起了"室内游乐园"——钻隧道、爬城堡、玩游戏，笑声不断。\n\n慧慧玩得可开心了，早就忘了没去成游乐园的失望。\n\n爸爸说:"慧慧，你看，下雨去不成游乐园，是不能改变的事。与其失望、难过，不如想想办法，把\'坏事\'变成\'好事\'。在家玩不也很开心吗？"\n\n慧慧点点头。她发现，爸爸总是这么乐观——遇到不顺心的事，不抱怨、不难过，而是想办法、往好处看。\n\n爸爸还说:"生活里总会有不如意的事——下雨、生病、计划泡汤。但是，用乐观的心态去面对，总能找到快乐。乐观的人，走到哪里都开心。"\n\n雨停了以后，爸爸还说:"你看，雨后空气多清新！我们出去散散步，说不定能看到彩虹呢！"果然，天边出现了一道美丽的彩虹，慧慧高兴极了。\n\n慧慧慢慢学会了爸爸的乐观——遇到不顺心的事，不抱怨、往好处想、找办法。她变得越来越开朗、越来越快乐。\n\n慧慧明白了:生活里总会有不如意的事，这是不能避免的。但是，用乐观的心态去面对——不抱怨、往好处想、想办法把"坏事"变"好事",就总能找到快乐。爸爸的乐观精神，让家里充满了欢笑，也感染了慧慧。乐观是一种能力，也是一种选择。乐观的人，无论遇到什么，都能过得开心。'
},
{
  id: 'jia_29',
  title: '【慧慧的家庭故事】第二十九集：慧慧帮爸爸捶背',
  category: '家',
  content: '爸爸下班回来，累得躺在沙发上，说:"哎呀，今天工作好累，腰酸背疼。"\n\n慧慧听到了，主动跑过去:"爸爸，我帮你捶背！"\n\n慧慧用小拳头，轻轻地帮爸爸捶背、捏肩膀。虽然力气小，但爸爸觉得特别舒服、特别温暖。\n\n"哎呀，我的宝贝女儿真孝顺！这么一捶，爸爸的疲劳都消了一半！"爸爸开心地说。\n\n慧慧一边捶，一边跟爸爸聊今天在幼儿园的趣事，逗爸爸开心。爸爸的疲劳一下子就没了，脸上露出了笑容。\n\n妈妈看到了，也很欣慰:"慧慧真懂事，知道心疼爸爸了。"\n\n慧慧说:"爸爸每天上班这么辛苦，赚钱养家、照顾我们。我要好好孝顺爸爸，帮爸爸捶捶背、解解乏。"\n\n爸爸感动地说:"有慧慧这样贴心的女儿，再累也值得！慧慧的孝心，比什么都珍贵。"\n\n从那以后，爸爸妈妈累了，慧慧都会主动去关心——帮爸爸捶背、给妈妈倒水、陪他们聊天解闷。她成了家里的"贴心小棉袄"。\n\n慧慧发现，关心爸爸妈妈、为他们做点小事，不但让他们开心，自己心里也暖暖的、美美的。\n\n慧慧明白了:爸爸妈妈为了这个家、为了我们，每天辛苦工作。当他们累了、辛苦了，我们要懂得心疼他们、关心他们——帮忙捶背、倒水、陪伴、逗他们开心。这些小小的关心，能让爸爸妈妈感到温暖和幸福。懂得体贴、孝顺父母的孩子，是家里最贴心的宝贝。爱要用行动表达，从关心身边最亲的人做起。'
},
{
  id: 'jia_30',
  title: '【慧慧的家庭故事】第三十集：全家的运动会',
  category: '家',
  content: '周末，爸爸提议:"我们来办一个\'家庭小运动会\'吧！"慧慧一听，兴奋极了。\n\n爸爸设计了好几个比赛项目:跳绳、拍球、跑步、平衡（头顶小沙包走）。一家三口都参加，比一比。\n\n比赛开始了！跳绳比赛，慧慧跳了很多个，比爸爸还多，因为她平时坚持练习。爸爸幽默地说:"哎呀，爸爸年纪大了，跳不过小慧慧喽！"\n\n拍球比赛，慧慧也拍得很好。跑步比赛，爸爸让着慧慧，慧慧跑了第一，特别开心。头顶沙包走路，一家人小心翼翼的样子，逗得大家哈哈大笑。\n\n比完赛，爸爸给每个人都发了"奖励"——慧慧得了"运动小健将"奖，妈妈得了"优雅奖",爸爸给自己发了"幽默奖"，全家笑作一团。\n\n慧慧玩得特别开心，还锻炼了身体。她说:"家庭运动会太好玩了！我们以后经常办好不好？"\n\n爸爸说:"好呀！运动能强身健体，全家一起运动，既锻炼了身体，又增进了感情，还这么快乐。这是一举三得！"\n\n妈妈说:"慧慧因为平时坚持锻炼，运动会上表现这么好。你看，坚持锻炼是有回报的。"\n\n从那以后，家庭运动会成了慧慧家的保留节目。全家在运动中收获了健康、快乐和亲情。\n\n慧慧明白了:运动能强身健体。全家一起办运动会、一起运动，既锻炼了身体，又增进了感情，还充满欢乐，一举三得。平时坚持锻炼，运动会上就能表现好——坚持是有回报的。爸爸把运动变成了好玩的家庭活动，让慧慧爱上了运动。在快乐的家庭氛围中运动、成长，是最幸福的事。'
},
{
  id: 'jia_31',
  title: '【慧慧的家庭故事】第三十一集：慧慧不挑食的约定',
  category: '家',
  content: '慧慧偶尔还是有点挑食，不太爱吃某些蔬菜。妈妈想了个好办法。\n\n妈妈跟慧慧做了个约定:"我们来玩\'蔬菜大冒险\'的游戏。每尝试一种以前不爱吃的蔬菜，就在\'勇敢表\'上贴一颗星星。集齐十颗星星，就能实现一个小愿望！"\n\n慧慧一听是游戏，还能实现愿望，来了兴趣。\n\n第一次，慧慧鼓起勇气尝了一口以前不爱吃的胡萝卜——"咦，好像也没那么难吃。"她贴了一颗星星。\n\n妈妈还把蔬菜做得更好吃、更好看——把胡萝卜切成小花，把西蓝花做成"小树",让慧慧更有兴趣吃。\n\n慧慧一次次尝试以前不爱吃的蔬菜——胡萝卜、青椒、茄子、菠菜……每尝试一种，就贴一颗星星。她发现，很多蔬菜其实并不难吃，还很有营养。\n\n集齐十颗星星那天，慧慧实现了自己的小愿望——去公园放风筝。\n\n妈妈说:"慧慧真勇敢，敢于尝试以前不爱吃的蔬菜。你看，很多蔬菜尝试了才发现并不难吃，还很有营养。不挑食，身体才能得到全面的营养，长得高、长得壮。"\n\n慧慧从此不那么挑食了。她说:"原来蔬菜也挺好吃的！而且吃了对身体好。"\n\n慧慧明白了:挑食对身体不好，因为得不到全面的营养。很多不爱吃的食物，勇敢尝试后会发现并不难吃，还很有营养。妈妈用"蔬菜大冒险"的游戏和好吃的做法，帮慧慧克服了挑食。为了健康的身体，要什么都吃、营养均衡。用有趣的方式鼓励孩子，比强迫更有效。勇于尝试、不挑食，做一个健康的孩子。'
},
{
  id: 'jia_32',
  title: '【慧慧的家庭故事】第三十二集：爸爸教慧慧认时间',
  category: '家',
  content: '慧慧看到家里的钟表，好奇地问:"爸爸，这个圆圆的、有针的东西是什么呀？"\n\n爸爸说:"这是钟表，用来看时间的。爸爸教你认时间好不好？"\n\n爸爸耐心地教:"你看，短短的这根是时针，指着几就是几点;长长的这根是分针。现在短针指着七，长针指着十二，就是七点整。"\n\n爸爸还把时间和慧慧的生活联系起来:"七点起床，八点上幼儿园，十二点吃午饭，晚上九点睡觉……认识了时间，慧慧就能自己知道该做什么了。"\n\n慧慧学着看钟表。爸爸做了个纸板钟，让慧慧动手拨指针、认时间，还玩"几点该做什么"的游戏。\n\n慢慢地，慧慧学会了看整点的时间。她能自己看钟表判断:"现在七点了，该起床啦！""九点了，该睡觉了。"\n\n爸爸表扬她:"慧慧学会看时间了，真棒！认识时间，就能自己安排、管理时间，做事更有规律、更自律。"\n\n慧慧还发现，学会看时间后，她能自己掌握时间了——玩多久、什么时候该做什么，不用总问大人。她做事越来越有规律、越来越自律。\n\n爸爸说:"时间很宝贵，一去不复返。学会看时间、珍惜时间、合理安排时间，是很重要的本领。"\n\n慧慧明白了:认识钟表、学会看时间，是很有用的本领。短针指小时，长针指分钟。学会看时间，就能自己安排、管理时间，知道什么时候该做什么，做事更有规律、更自律。而且时间宝贵，要珍惜、要合理安排。爸爸耐心地教慧慧认时间，还联系生活、用游戏帮助理解，让慧慧学会了管理时间。会管理时间的孩子，生活更有条理。'
},
{
  id: 'jia_33',
  title: '【慧慧的家庭故事】第三十三集：慧慧的感恩日记',
  category: '家',
  content: '妈妈教慧慧做一件特别的事——每天睡前，说出三件今天要感恩的事。虽然慧慧还不会写字，就用说的，妈妈帮她记在"感恩本"上，或者画个小图案。\n\n第一天，慧慧说:"我感恩妈妈今天做了好吃的饭;感恩爸爸陪我玩;感恩今天天气好，我在公园玩得很开心。"\n\n慢慢地，慧慧养成了感恩的习惯。每天她都会发现值得感恩的事——感恩老师教她本领，感恩小朋友陪她玩，感恩爷爷奶奶疼她，感恩晴朗的天空、盛开的花朵……\n\n妈妈说:"慧慧，学会感恩，你就会发现生活里有这么多美好的事、这么多爱我们的人。懂得感恩的人，内心更快乐、更幸福。"\n\n慧慧发现，自从开始"感恩日记",她变得更快乐了——因为她总是能看到生活中的美好和别人的付出。她也更懂得珍惜和回报——感恩爸爸妈妈，就帮他们做事;感恩老师，就认真学习;感恩朋友，就真诚相待。\n\n有一天，慧慧对妈妈说:"妈妈，我今天最感恩的，就是有你和爸爸这么爱我。我也好爱你们！"妈妈感动得抱住了慧慧。\n\n慧慧的感恩，让整个家庭都充满了温暖和爱。\n\n慧慧明白了:每天想想值得感恩的事，会让我们发现生活中的美好和别人的付出——家人的爱、老师的教导、朋友的陪伴、大自然的馈赠。懂得感恩的人，内心更快乐、更幸福，也更懂得珍惜和回报。养成感恩的习惯，用一颗感恩的心看世界，你会发现处处是温暖、处处是爱。感恩，让平凡的生活闪闪发光。'
},
{
  id: 'jia_34',
  title: '【慧慧的家庭故事】第三十四集：慧慧克服拖延',
  category: '家',
  content: '慧慧有时候会拖延——该做的事情总想着"等一会儿再做"。比如，老师布置的小任务，她想着"明天再做";该收拾玩具了，她想着"等下再收"。\n\n结果，事情越拖越多，最后手忙脚乱。有一次，任务拖到最后一天才慌慌张张地做，做得不好。\n\n爸爸发现了，跟慧慧说:"慧慧，爸爸教你一个\'马上做\'的好办法。该做的事，不要拖，马上开始做。你可以想\'现在就做，做完就轻松了\'。"\n\n爸爸还教了一个方法:"如果觉得一件事太大、不想开始，就把它分成小块。比如收拾玩具，先收积木，再收娃娃，一块一块来，很快就收完了。"\n\n慧慧试着用爸爸的方法。有任务了，她告诉自己"马上做，做完就能安心玩了",立刻就开始做。该收拾了，她"先收这个，再收那个",一会儿就收完了。\n\n慧慧发现，"马上做"真好——事情很快做完了，心里轻松了，还有时间玩。而拖延只会让事情堆积、让自己更累、更慌。\n\n爸爸表扬她:"慧慧战胜了拖延，真棒！\'今天能做的事，不要拖到明天\'。马上行动，做事就轻松、高效。"\n\n慧慧还发现，早点做完作业、早点收拾好，就有更多时间玩，玩得也更安心。\n\n慧慧明白了:拖延会让事情越堆越多、让自己手忙脚乱。要养成"马上做"的好习惯——该做的事立刻开始，不拖延。如果觉得事情太大，可以分成小块一步步做。早点做完，就轻松了，还有时间玩。"今天的事今天做完",是高效和自律的表现。战胜拖延，掌控自己的时间，生活就从容多了。'
},
{
  id: 'jia_35',
  title: '【慧慧的家庭故事】第三十五集：爸爸妈妈的工作',
  category: '家',
  content: '慧慧好奇地问:"爸爸妈妈，你们每天去上班，是去做什么呀？"\n\n爸爸说:"爸爸上班，是去做爸爸的工作，用自己的本领做事，还能赚钱养家。妈妈也一样。我们工作，是为了让这个家过得更好，也是为社会做贡献。"\n\n妈妈说:"每个大人都有自己的工作——有的当医生治病救人，有的当老师教书育人，有的种地、有的开车、有的盖房子……每个工作都很重要，都在为大家服务。"\n\n慧慧问:"工作累不累呀？"\n\n爸爸笑着说:"工作会有点累，但也很有意义。爸爸妈妈努力工作，才能给你买好吃的、好玩的，供你上学，让我们的家越来越好。所以，慧慧也要珍惜哦。"\n\n慧慧听了，很感动:"原来爸爸妈妈这么辛苦，是为了这个家、为了我。我要好好珍惜，不浪费，还要好好学习、孝顺你们。"\n\n爸爸说:"慧慧懂事了！你现在的\'工作\',就是好好学习、健康成长。等你长大，也会有自己的工作，用自己的本领做事、为社会做贡献。"\n\n慧慧似懂非懂地点点头，心里种下了一颗种子——要努力学本领，长大做个有用的人。\n\n从那以后，慧慧更加珍惜爸爸妈妈的付出，更加努力学习，还常常对辛苦工作的爸爸妈妈说:"你们辛苦了！"\n\n慧慧明白了:爸爸妈妈努力工作，是为了这个家、为了孩子，也是为社会做贡献。每一份工作都很重要、都很辛苦、都很有意义。我们要珍惜爸爸妈妈的付出，不浪费，还要好好学习、孝顺父母。小朋友现在的"工作"就是好好学习、健康成长，长大后用自己的本领做贡献。懂得父母的辛苦、珍惜和感恩，是懂事的表现。'
},
{
  id: 'jia_36',
  title: '【慧慧的家庭故事】第三十六集：慧慧的诚实',
  category: '家',
  content: '慧慧在家玩皮球，一不小心把妈妈心爱的花瓶碰倒了，花瓶摔碎了。\n\n当时家里没有别人。慧慧有点害怕，想过要不要藏起来、假装不知道。\n\n但慧慧想起爸爸妈妈平时教的——要诚实。她鼓起勇气，等妈妈回来，主动承认:"妈妈，对不起，我玩皮球的时候不小心把花瓶碰碎了。"\n\n妈妈虽然有点心疼花瓶，但看到慧慧主动、诚实地承认，说:"慧慧，花瓶碎了妈妈是有点心疼，但是你能诚实地告诉妈妈，没有隐瞒，这一点妈妈很欣慰。诚实比一个花瓶珍贵多了。"\n\n妈妈还说:"不过，以后在家里玩皮球要注意，别在有易碎东西的地方玩，免得碰坏东西、也免得被碎片划伤。"\n\n慧慧点点头，帮妈妈一起清理了碎片（在妈妈指导下，注意安全）。\n\n妈妈说:"慧慧，你今天做得对。做错了事，勇敢诚实地承认，比隐瞒、撒谎强一百倍。如果你藏起来、撒谎，妈妈知道后会更失望。诚实的孩子，最让人信任和喜爱。"\n\n慧慧庆幸自己诚实地承认了。她感受到，诚实虽然当时需要勇气，但换来了妈妈的理解和信任，心里也踏实。\n\n从那以后，慧慧更加坚定了做诚实孩子的决心——不管做错了什么，都勇敢诚实地承认。\n\n慧慧明白了:做错了事、闯了祸，要勇敢诚实地承认，不能隐瞒、撒谎。诚实虽然需要勇气，但会换来理解和信任;隐瞒、撒谎则会让人更失望。爸爸妈妈更看重的是孩子诚不诚实，而不是那个碎掉的东西。诚实是最宝贵的品质，是做人的根本。做一个诚实的孩子，会赢得所有人的信任和喜爱。'
},
{
  id: 'jia_37',
  title: '【慧慧的家庭故事】第三十七集：全家看星星',
  category: '家',
  content: '夏天的夜晚，爸爸说:"今晚天气好，星星特别多。我们一家人到院子里看星星吧！"\n\n一家人躺在院子里的躺椅上，仰望星空。满天的星星一闪一闪，特别美。\n\n慧慧数着星星:"一颗、两颗、三颗……好多好多，数也数不清！"\n\n爸爸指着星星，给慧慧讲天文知识:"你看那七颗星星连起来，像一个大勺子，那叫北斗七星。顺着勺子口的方向，能找到北极星，古时候的人靠它辨认方向呢。"\n\n爸爸还讲了牛郎织女的美丽传说，讲了月亮的圆缺变化。慧慧听得入了迷。\n\n妈妈说:"宇宙好大好神奇呀。我们看到的每一颗星星，其实都是很远很远的大火球，比太阳还大呢。"\n\n慧慧惊叹:"哇，原来星星这么神奇！"她的小脑袋里充满了对宇宙的好奇和向往。\n\n一家人躺在星空下，聊着天，说着笑，特别温馨、特别幸福。慧慧靠在妈妈怀里，觉得又幸福又满足。\n\n爸爸说:"慧慧，宇宙有好多好多奥秘，等着我们去探索。你要好好学习，长大后说不定能成为科学家，去探索宇宙的奥秘呢！"\n\n慧慧眨着眼睛，心里充满了对知识和未来的向往。\n\n这个看星星的夜晚，慧慧不但学到了天文知识，还感受到了家庭的温暖和对世界的好奇。\n\n慧慧明白了:宇宙浩瀚神奇，充满了奥秘和美丽。全家一起看星星，既学到了知识（北斗七星、北极星、星星的秘密），又享受了温馨幸福的亲子时光，还激发了对世界的好奇和向往。爸爸妈妈的陪伴和引导，让慧慧爱上了探索、向往着未来。保持好奇心、热爱学习，长大去探索世界的奥秘。家的温暖和知识的启迪，都是成长的养分。'
},
{
  id: 'jia_38',
  title: '【慧慧的家庭故事】第三十八集：慧慧不乱发脾气',
  category: '家',
  content: '慧慧搭积木，怎么也搭不好，急得想发脾气、想把积木摔了。\n\n妈妈看到了，走过来温和地说:"慧慧，妈妈知道你着急。但是发脾气、摔积木解决不了问题，还会把积木摔坏、把心情弄糟。我们先深呼吸，冷静一下好不好？"\n\n妈妈教慧慧:"来，跟妈妈一起深呼吸——吸气，呼气。数一、二、三。感觉好点了吗？"\n\n慧慧跟着深呼吸，慢慢冷静下来，火气消了一些。\n\n妈妈说:"现在我们冷静地看看，积木为什么搭不好？"慧慧仔细一看:"哦，是下面搭得太窄了，所以不稳。"她把底座搭宽，果然搭稳了！\n\n慧慧高兴地说:"我搭好啦！刚才要是发脾气摔了积木，就搭不成了。"\n\n妈妈表扬她:"慧慧真棒，学会控制脾气了！你看，冷静下来、想办法，问题就解决了。发脾气不但没用，还会让事情更糟。"\n\n妈妈还教慧慧:"以后遇到不顺心、想发脾气的时候，就深呼吸、数数，让自己冷静下来。冷静了，才能想办法解决问题。"\n\n慧慧记住了。后来，她遇到不顺心的事，会先深呼吸、冷静，然后想办法，不再乱发脾气了。她的情绪管理越来越好，变得越来越平和。\n\n爸爸说:"能管理好自己情绪的人，才能更好地解决问题、更受大家欢迎。慧慧学会了控制脾气，真了不起。"\n\n慧慧明白了:遇到不顺心、着急的事，发脾气、摔东西是没用的，还会把事情弄得更糟。要学会控制情绪——深呼吸、数数，让自己冷静下来，然后想办法解决问题。管理好自己的情绪，是很重要的能力。冷静和理智，比发脾气有用得多。能控制情绪的孩子，更平和、更能干、更受欢迎。'
},
{
  id: 'jia_39',
  title: '【慧慧的家庭故事】第三十九集：慧慧帮忙照顾宠物',
  category: '家',
  content: '慧慧家养了一只小猫，叫咪咪。爸爸妈妈说:"慧慧想养宠物，那就要负责照顾它哦。养宠物是要承担责任的。"\n\n慧慧答应了。她主动承担起照顾咪咪的责任:每天给咪咪喂食、换水;帮咪咪清理猫砂;还陪咪咪玩、给它梳毛。\n\n一开始，慧慧觉得很新鲜、很有趣。可是照顾宠物要每天坚持，有时候慧慧想偷懒。但她想起了自己的承诺——养宠物就要负责，于是坚持了下来。\n\n慢慢地，咪咪和慧慧成了好朋友。咪咪一看到慧慧就"喵喵"叫，还蹭她的腿。慧慧特别开心:"咪咪认得我，喜欢我呢！"\n\n有一次，咪咪生病了，没精神、不吃东西。慧慧很着急、很心疼，赶紧告诉爸爸妈妈，一起带咪咪去看医生。咪咪病好了以后，慧慧照顾得更细心了。\n\n妈妈说:"慧慧，你照顾咪咪照顾得真好！养宠物让你学会了负责任、有爱心。一个小生命，需要我们用心照顾。"\n\n慧慧说:"照顾咪咪虽然要每天坚持、有点辛苦，但看到它健康快乐，我特别开心。而且咪咪是我的好朋友！"\n\n通过照顾咪咪，慧慧变得更有责任心、更有爱心，也懂得了照顾一个小生命的不易。\n\n慧慧明白了:养宠物是要承担责任的——每天喂食、换水、清理、陪伴，要坚持、不能偷懒。照顾一个小生命，能培养责任心和爱心。虽然辛苦，但看到宠物健康快乐、和它成为朋友，特别有意义、特别开心。养宠物让慧慧懂得了责任、爱心和坚持。用心照顾小生命，是一份珍贵的成长体验。有始有终地负责，是可贵的品质。'
},
{
  id: 'jia_40',
  title: '【慧慧的家庭故事】第四十集：爸爸的鼓励',
  category: '家',
  content: '幼儿园要举行讲故事比赛，慧慧报名了，但心里有点紧张，怕讲不好、怕在台上出错。\n\n慧慧跟爸爸说:"爸爸，我有点害怕，怕讲砸了……"\n\n爸爸没有说"别怕",而是认真地鼓励她:"慧慧，紧张是正常的，爸爸小时候上台也紧张。但是你想想，你已经认真准备、练习了很多遍，你是有实力的！就算讲错一点点也没关系，重要的是勇敢地站上台、努力地讲。"\n\n爸爸还教慧慧一个小窍门:"上台的时候，深呼吸，看着台下熟悉的面孔（比如爸爸妈妈），把练习时的样子讲出来就好。相信自己，你能行！"\n\n爸爸妈妈还在家里陪慧慧一遍遍练习，当她的"观众",给她鼓掌、提建议。\n\n比赛那天，慧慧虽然还是有点紧张，但她想起爸爸的鼓励，深呼吸，勇敢地走上了台。她看到台下爸爸妈妈鼓励的眼神，慢慢放松下来，把故事讲得又流利又生动！\n\n台下响起了热烈的掌声。慧慧讲完，特别有成就感:"我做到了！我没那么害怕了！"\n\n虽然慧慧没有拿第一名，但爸爸妈妈特别为她骄傲:"慧慧，你勇敢地站上台、认真地讲完，就已经赢了！战胜了自己的紧张，比拿名次更重要！"\n\n慧慧明白了，原来勇敢地去尝试、去挑战，本身就是一种胜利。\n\n从那以后，慧慧遇到需要上台、需要挑战的事，不再那么害怕了。她学会了勇敢面对、相信自己。\n\n慧慧明白了:面对挑战（比如上台比赛），紧张是正常的。重要的是认真准备、勇敢尝试、相信自己。就算结果不完美、没拿名次，勇敢地去挑战、战胜了自己的紧张，本身就是胜利。爸爸妈妈的鼓励和陪伴练习，给了慧慧勇气和信心。勇于挑战自己、不怕失败，是成长的重要一步。迈出勇敢的第一步，你就赢了。'
},
{
  id: 'jia_41',
  title: '【慧慧的家庭故事】第四十一集：慧慧节约用电',
  category: '家',
  content: '慧慧发现，家里有时候灯没人用还亮着、电视没人看还开着，浪费电。\n\n爸爸教慧慧节约用电:"电是很宝贵的资源。我们要节约用电——人走了就关灯，不看电视就关掉，不用的电器拔掉插头。节约用电，既省钱，又保护环境。"\n\n慧慧学会了节约用电。她养成了好习惯:离开房间随手关灯;不看电视就关掉;白天光线好就不开灯。\n\n她还成了家里的"节电小卫士",看到没人用还亮着的灯，就主动关掉;提醒家人:"这个灯没人用，关掉吧！"\n\n爸爸表扬她:"慧慧真是个节约的好孩子！随手关灯、节约用电，是很好的习惯。"\n\n爸爸还给慧慧讲了道理:"电是用煤、水、风等发出来的，来之不易。浪费电，不但浪费钱，还浪费资源、影响环境。我们每个人节约一点电，就能节约好多资源、保护地球。"\n\n慧慧记住了。她不但自己节约用电，还把这个习惯带到了幼儿园，提醒小朋友们节约用电。\n\n慧慧还懂得了节约要从各方面做起——节约用水、节约用电、节约用纸、爱惜粮食。\n\n慧慧明白了:电和水一样，是宝贵的资源，来之不易，要节约使用。节约用电——随手关灯、不用就关电器、白天少开灯。节约用电既省钱，又保护资源和环境。节约要从各方面做起，从身边的小事做起。养成节约的好习惯，珍惜每一份资源，是爱护地球、对社会负责的表现。勤俭节约，是美德。'
},
{
  id: 'jia_42',
  title: '【慧慧的家庭故事】第四十二集：慧慧学会道歉',
  category: '家',
  content: '慧慧和表弟一起玩，因为抢一个玩具，慧慧推了表弟一下，表弟摔倒哭了。\n\n妈妈看到了，把慧慧叫过来:"慧慧，你推倒了弟弟，他摔疼了、哭了。你应该怎么做呢？"\n\n慧慧有点不好意思，一开始不愿意道歉:"是他先抢我玩具的……"\n\n妈妈说:"抢玩具是可以商量的，但你推倒了弟弟、让他受伤，这是不对的。不管什么原因，推人、让人受伤都要道歉。弟弟比你小，你更应该让着他。"\n\n慧慧想了想，觉得妈妈说得对。她走到表弟面前，真诚地说:"弟弟，对不起，我不该推你。你摔疼了吧？"她还扶起弟弟，帮他揉揉摔疼的地方。\n\n表弟不哭了，说:"没关系，姐姐。"两个人又和好了，一起玩起了玩具，还学会了轮流玩。\n\n妈妈表扬慧慧:"慧慧能真诚地道歉，还照顾弟弟，真棒！道歉不丢人，反而说明你懂事、有担当。做错了事，勇敢道歉，还能化解矛盾、和好如初。"\n\n慧慧发现，说了"对不起"以后，弟弟原谅了她，两个人又开心地玩了，比僵着强多了。\n\n慧慧明白了:做错了事——比如推人、让人受伤，不管什么原因，都要真诚地道歉。道歉不丢人，反而说明懂事、有担当。而且，比自己小的要多让着。真诚的道歉能化解矛盾、和好如初。学会说"对不起",是重要的品格。勇于承认错误、真诚道歉，人与人才能和睦相处。有担当、懂谦让的孩子，最惹人喜爱。'
},
{
  id: 'jia_43',
  title: '【慧慧的家庭故事】第四十三集：全家的旅行计划',
  category: '家',
  content: '放假了，一家人打算去旅行。爸爸说:"这次旅行，我们全家一起来做计划好不好？慧慧也参与！"\n\n一家人围坐在一起，商量去哪里玩、玩几天、要带什么。慧慧兴奋地出主意:"我想去看大海！""要带上我的小水桶和铲子挖沙子！"\n\n爸爸把大家的想法都记下来，一起商量、安排。妈妈负责准备行李清单，慧慧帮忙想要带的东西:"要带换洗衣服、牙刷、水杯、防晒的帽子……"\n\n慧慧还帮忙收拾自己的行李，把自己要带的东西一样样准备好、装进小背包。\n\n爸爸说:"慧慧参与做计划、收拾行李，真能干！一起做计划，旅行才周全，大家的想法都能照顾到。"\n\n旅行前，慧慧还和爸爸一起在地图上看要去的地方，了解那里有什么好玩的。慧慧觉得，做计划的过程也很有趣，还很有期待感。\n\n旅行中，因为计划周全、东西带齐了，一家人玩得又顺利又开心。慧慧在海边挖沙子、捡贝壳、看大海，玩得可开心了。\n\n爸爸说:"你看，做好计划，旅行就顺利、周全。慧慧参与计划、自己收拾行李，既锻炼了能力，又更有参与感。"\n\n慧慧明白了:做事情要提前计划。全家一起做旅行计划——商量去哪、带什么、怎么安排，能让大家的想法都被照顾到，旅行更周全、更顺利。慧慧参与计划、自己收拾行李，锻炼了能力、增强了参与感。凡事预则立，不预则废——提前计划、准备充分，事情才能办得又好又顺。让孩子参与家庭事务，既锻炼能力，又增进亲情。'
},
{
  id: 'jia_44',
  title: '【慧慧的家庭故事】第四十四集：慧慧不比较',
  category: '家',
  content: '慧慧的同学买了一个很贵的新书包，慧慧回家跟妈妈说:"妈妈，小红的书包好漂亮好贵，我也想要一个那样的。"\n\n妈妈没有马上答应，而是跟慧慧聊了聊:"慧慧，你现在的书包还很新、很好用，对不对？"\n\n慧慧点点头:"是的，还很好用。"\n\n妈妈说:"那为什么想换新的呢？是因为小红的更贵吗？慧慧，每个家庭情况不一样，我们不用跟别人比谁的东西贵、谁的东西多。重要的是东西够用、好用。攀比这些，会让人不开心，也不是好习惯。"\n\n妈妈还说:"我们要比，就比谁更懂事、谁更爱学习、谁更善良、谁更能干。这些才是真正值得比的、有意义的。"\n\n慧慧想了想，觉得妈妈说得对。自己的书包好好的，没必要因为别人的更贵就想换。而且，跟别人比东西，比来比去也不会开心。\n\n慧慧说:"妈妈，我明白了。我的书包很好用，不用换。我要比的是谁更棒，不是谁的东西更贵。"\n\n妈妈欣慰地说:"慧慧真懂事！不攀比物质，比品格、比进步，这才是聪明的孩子。"\n\n从那以后，慧慧不再羡慕别人的贵东西了。她把心思放在了学习、做个好孩子上。她发现，自己因为懂事、爱学习、善良，得到了老师和同学的喜爱，这比任何贵重的东西都让她开心和自豪。\n\n慧慧明白了:不要和别人攀比物质——谁的东西贵、谁的东西多。每个家庭情况不同，东西够用、好用就好。攀比物质会让人不开心，也不是好习惯。要比，就比谁更懂事、更爱学习、更善良、更能干、更进步——这些才有意义、才值得。不慕虚荣、注重内在，做一个懂事、上进、善良的孩子，比拥有贵重的东西更让人自豪和快乐。'
},
{
  id: 'jia_45',
  title: '【慧慧的家庭故事】第四十五集：爸爸教慧慧下棋',
  category: '家',
  content: '爸爸教慧慧下一种简单的棋。慧慧一开始总是输，有点不高兴。\n\n爸爸说:"慧慧，输棋很正常。爸爸下了这么多年，也不是每盘都赢。重要的是从每次输里学到东西，越下越好。"\n\n慧慧问:"怎么才能不输呢？"\n\n爸爸教她:"下棋要动脑筋、要有策略。不能只看眼前一步，要想想接下来怎么走。而且要观察对手，看他想干什么。"\n\n慧慧认真学，一边下一边动脑筋想。慢慢地，她下得越来越好，有时候还能赢爸爸了（当然爸爸有时会让让她）。\n\n赢了棋，慧慧很开心;输了棋，她也不气馁，而是想想:"这盘为什么输了？下次怎么改进？"\n\n爸爸表扬她:"慧慧下棋有进步！更重要的是，你学会了输得起、还会从输里学习。下棋能锻炼脑筋、培养策略，还能锻炼输赢的心态。"\n\n慧慧发现，下棋真好玩，还能锻炼脑筋。她学会了思考、学会了策略，也学会了平静地面对输赢——赢了不骄傲，输了不气馁，从每一局中学习和进步。\n\n爸爸说:"下棋和人生一样，有输有赢。重要的是保持好心态，输了不气馁、赢了不骄傲，不断学习、不断进步。"\n\n慧慧明白了:下棋（或玩游戏、比赛）有输有赢，输了很正常，不用气馁。重要的是保持好心态——赢了不骄傲、输了不气馁，从每次输赢中学习、改进、进步。下棋还能锻炼脑筋、培养思考和策略。平静地面对输赢、从失败中学习，是很重要的心态。人生和下棋一样，胜败乃常事，保持好心态、不断进步，才能越来越强。'
},
{
  id: 'jia_46',
  title: '【慧慧的家庭故事】第四十六集：慧慧的小小责任',
  category: '家',
  content: '妈妈给慧慧分了一个"小小责任"——负责给家里的绿植浇水。妈妈说:"这些花草就交给慧慧照顾了，你要负责给它们浇水，让它们健康成长。"\n\n慧慧郑重地答应了:"好！我一定照顾好它们！"\n\n从那以后，慧慧每天都记得给花草浇水。她还观察哪些花草需要多浇水、哪些少浇水，照顾得很用心。\n\n有时候慧慧玩得开心，差点忘了浇水，但她一想起自己的责任，就赶紧去浇:"这是我的责任，不能忘！"\n\n在慧慧的精心照顾下，家里的花草长得郁郁葱葱，还开出了漂亮的花。\n\n妈妈表扬她:"慧慧真负责！把浇水的责任完成得这么好，花草都长得这么好。有责任心，是很棒的品质。"\n\n慧慧看着自己照顾的花草茁壮成长、开出美丽的花，特别有成就感:"这些花是我照顾大的！"\n\n慧慧还主动承担了更多的小责任——每天整理自己的房间、饭后帮忙收碗、照顾宠物。她把每一个责任都完成得很好。\n\n爸爸说:"慧慧有责任心，答应的事、分到的任务，都认真完成、坚持到底。这样的孩子，长大一定靠谱、可信赖。"\n\n慧慧明白了:每个人都有自己的责任。答应了、分到的任务（比如给花草浇水），就要认真完成、坚持到底，不能忘记、不能偷懒。有责任心的人，做事靠谱、值得信赖。完成责任后，看到成果（花草茁壮成长），会特别有成就感。从小承担一些力所能及的小责任，培养责任心，是重要的成长。负责任、有始有终，是可贵的品质。'
},
{
  id: 'jia_47',

  category: '家',
  content: '周末的晚上，一家人不看电视、不玩手机，而是一起玩游戏、聊天。\n\n爸爸提议玩"你比划我猜"的游戏。爸爸比划动作，慧慧和妈妈猜。爸爸比划"大象",甩着手当鼻子，慧慧一下就猜到了，全家哈哈大笑。\n\n然后玩"成语接龙"（慧慧还小，就玩"词语接龙"）、"猜谜语"。慧慧虽然小，但也能参与，还答对了好几个，特别开心。\n\n玩累了，一家人围坐在一起聊天。慧慧讲幼儿园的趣事，爸爸讲工作中好玩的事，妈妈讲小时候的故事。大家你一言我一语，笑声不断。\n\n慧慧觉得，这样的家庭时光特别温馨、特别快乐。她说:"比看电视、玩手机好玩多了！"\n\n爸爸说:"是呀。一家人在一起，聊天、玩游戏、互相陪伴，是最幸福的时光。电视、手机代替不了家人之间的陪伴和欢笑。"\n\n妈妈说:"慧慧，家是我们最温暖的港湾。有爱我们的爸爸妈妈，有温馨的家庭时光，是最大的幸福。"\n\n慧慧靠在爸爸妈妈中间，感受着满满的爱和温暖，觉得自己是世界上最幸福的孩子。\n\n从那以后，慧慧家经常有这样的欢乐时光——放下电子产品，一家人一起玩、一起聊、一起笑。这些温馨的时刻，成了慧慧童年最美好的回忆。\n\n慧慧明白了:一家人在一起玩游戏、聊天、互相陪伴，是最幸福、最温馨的时光。电视、手机代替不了家人之间真实的陪伴和欢笑。放下电子产品，多和家人互动，能增进感情、收获快乐。家是最温暖的港湾，家人的爱和陪伴是最大的幸福。珍惜和家人在一起的时光，用心陪伴，是最美好的事。'

{

  title: '【慧慧的家庭故事】第五十集：温暖的家',
  category: '家',
  content: '这一天，幼儿园老师让小朋友们说说:"你的家是什么样的？"\n\n轮到慧慧，她开心地说:"我的家，是一个充满爱和欢笑的家！"\n\n慧慧讲起了自己的家:"我的爸爸很幽默，总是把不开心的事变得好玩，还乐观地面对困难。我的妈妈很温柔，耐心地教我本领、照顾我。"\n\n"在我家，爸爸辅导我作业，用有趣的方法让我学会;全家一起运动、一起做家务、一起读书、一起玩游戏;我完成目标，就能得到奖励;我做错了事，他们温和地教我改正;我遇到困难，他们鼓励我、陪伴我。"\n\n"我在家里学会了好多——自律、诚实、乐观、有责任心、懂得体谅和感恩。爸爸妈妈用爱和智慧，陪我一点一点长大。"\n\n老师和小朋友们都听得很感动。老师说:"慧慧的家，真是一个温暖、有爱、有智慧的家。在这样的家庭里长大，慧慧才这么聪明、自律、乐观、善良。"\n\n慧慧说:"我最幸福的，就是有爱我的爸爸妈妈，有一个温暖的家。"\n\n放学回家，慧慧扑进爸爸妈妈的怀里:"爸爸妈妈，我爱你们！我们的家最温暖、最幸福！"\n\n爸爸妈妈紧紧抱住慧慧:"我们也爱你，慧慧！家有你，才更完整、更幸福。"\n\n一家三口紧紧相拥，家里充满了爱和温暖。\n\n慧慧知道，无论她将来走多远、长多大，这个充满爱的家，永远是她最温暖的港湾、最坚强的后盾。而她在家里学到的自律、诚实、乐观、责任、感恩，会陪伴她一生，让她成长为一个幸福、优秀的人。\n\n慧慧明白了:家，是一个充满爱和欢笑的地方，是最温暖的港湾。在有爱、有智慧的家庭里，通过爸爸妈妈的陪伴、引导和爱，孩子能学会自律、诚实、乐观、责任、体谅、感恩等宝贵品质，健康快乐地成长。家人之间互相关爱、互相陪伴、共同成长，是最大的幸福。珍惜家庭、感恩父母、用爱经营家，家就会永远温暖。有爱的家，是孩子一生的底气和幸福的源泉。'
},
{
  id: 'yixiu_1',
  title: '【一休历险记】第一集：会魔法的镜子湖',
  category: '一休',
  content: '一休听说森林深处有一面"魔法镜子湖",湖水像镜子一样，能照出人心里最想要的东西。她决定去看看。\n\n走了好久，一休来到了镜子湖边。湖水清清亮亮的，平静得像一面大镜子。一休往湖里一看——湖面上出现了一座金光闪闪的城堡，里面堆满了糖果、玩具和漂亮的裙子！\n\n"哇，这些都是我想要的！"一休兴奋极了。\n\n这时，湖里冒出一个水做的精灵，笑眯眯地说:"小姑娘，只要你跳进湖里，这些东西就都是你的了！快跳吧！"\n\n一休正想往下跳，突然停住了。她发现，那个水精灵的笑容有点假，而且湖边一根草都不长，还有一些小动物的脚印走到湖边就消失了……\n\n"不对劲。"一休心想，"这么好的东西，怎么会白白送给我？而且湖边连草都不长，肯定有问题。"\n\n一休捡起一块石头，扔进了湖里。"扑通"一声，湖面的城堡影像碎了，露出了下面——原来湖底是一个黑黑的大漩涡，专门把贪心的人卷下去！那个水精灵是漩涡变的怪物，用人心里想要的东西来引诱人跳下去。\n\n"你想骗我！"一休后退了几步。\n\n水精灵见被识破，凶相毕露:"哼，聪明的小丫头！可是你已经来了，就别想走了！"漩涡开始转动，湖水朝一休涌来，想把她卷进去。\n\n一休急中生智。她看到湖边有一棵大树，树根伸进了湖里。一休赶紧抱住树根，任凭湖水怎么涌，都紧紧抓住不放。\n\n漩涡使出全力，可一休就是不松手。慢慢地，漩涡累了、转不动了。原来，这个怪物只能骗人自己跳下去，没法硬把抓住东西的人拖走。\n\n一休趁漩涡没力气了，顺着树根爬上了岸，飞快地跑远了。\n\n回头看，镜子湖又变回了平静的样子，继续等着下一个贪心的人。\n\n一休擦擦汗，想:"越是看起来美好、白给的东西，越要小心。天上不会掉馅饼，动动脑筋、不贪心，才不会上当。"\n\n从那以后，一休遇到"太好的事",都会多想一想:这是真的吗？会不会是陷阱？她的机智，让她一次次躲过了危险。'
},
{
  id: 'yixiu_2',
  title: '【一休历险记】第二集：大灰狼的糖果屋',
  category: '一休',
  content: '一休在森林里散步，闻到一阵香甜的味道。顺着香味走过去，她发现了一座用糖果和饼干做的小屋——墙是巧克力的，窗户是糖片的，屋顶铺满了棉花糖！\n\n"好漂亮的糖果屋呀！"一休正看着，屋子的门开了，一个和蔼的"老奶奶"探出头:"小姑娘，快进来吧，屋里有更多好吃的糖果，随便吃！"\n\n一休正要进去，突然注意到——"老奶奶"的手上长着灰色的毛，还有尖尖的爪子!而且她的影子，分明是一只大灰狼的形状！\n\n"这不是老奶奶，是大灰狼假扮的！"一休心里一惊，但她没有表现出来。\n\n一休知道，如果直接跑，大灰狼会追上来。她得想个办法。\n\n一休装作很高兴的样子:"好呀好呀！不过奶奶，我妈妈说，吃糖果前要先洗手。您家的水井在哪里呀？"\n\n"老奶奶"指了指屋后:"在屋后面。"\n\n一休说:"那您帮我打一桶水好吗？我在这里等着。"\n\n大灰狼为了不露馅，只好装作老奶奶去屋后打水。趁它走开的一瞬间，一休撒腿就跑！\n\n大灰狼发现上当了，扔掉伪装，露出真面目，凶狠地追了上来:"小丫头，敢骗我！"\n\n一休一边跑一边想办法。她跑到了一条小河边，河上有一座独木桥。一休轻巧地跑过了独木桥，然后用力去推桥。独木桥"哗啦"掉进了河里。\n\n大灰狼追到河边，桥没了，它又不敢下水（大灰狼怕水），只能在对岸干瞪眼、气得直跺脚。\n\n一休在对岸朝大灰狼挥挥手:"大灰狼，糖果屋的把戏骗不了我！再见啦！"\n\n一休安全地回了家。她想:"陌生人给的东西不能随便要，陌生人的家不能随便进。就算看起来很和善、东西很诱人，也要多留个心眼。遇到危险不要慌，动脑筋想办法脱身。"\n\n从那以后，一休再也不会被"糖果屋"这样的诱惑骗到了。她既保护了自己，又用智慧战胜了大灰狼。'
},
{
  id: 'yixiu_3',
  title: '【一休历险记】第三集：山洞里的宝藏',
  category: '一休',
  content: '一休听说山里有个山洞，藏着宝藏。她带着好奇心去探险。\n\n山洞黑黑的，一休点了一根松枝当火把，小心地走进去。走着走着，她看到洞壁上闪闪发光——真的有宝藏！金币、宝石，堆成了小山！\n\n一休正高兴，突然，洞里响起一个低沉的声音:"想要宝藏，就回答我的问题。答对了，宝藏归你;答错了，你就永远出不去了！"\n\n原来，这是一个守护宝藏的山洞精灵。\n\n一休虽然害怕，但她冷静下来:"好，你问吧。"\n\n精灵问:"什么东西，你给别人越多，自己剩得越多？"\n\n一休想了想。给别人越多，自己剩得越多……钱给出去就少了，糖给出去也少了……什么东西越给越多呢？\n\n一休灵机一动:"是爱和快乐！把爱给别人，自己的爱不会少;把快乐分享给别人，自己会更快乐！越分享，越多！"\n\n精灵点点头:"答对了！第二个问题——什么门，永远关不上？"\n\n一休想了想:什么门关不上呢？家门能关，房门能关……一休笑了:"是\'心门\'！只要心里装着善良和爱，心门就永远为别人敞开，关不上！"\n\n"答对了！最后一个问题——"精灵的声音严肃起来，"你拿到宝藏后，会怎么用？"\n\n一休认真地想了想:"我会拿一部分帮助需要帮助的人——生病的、贫穷的、有困难的。剩下的，我要好好保管，用在有意义的地方，不乱花。"\n\n精灵沉默了一会儿，然后笑道:"哈哈，你是第一个想着帮助别人的孩子。大多数人只想着自己享受。你有一颗善良的心，宝藏配得上你！"\n\n精灵让一休拿了一些金币和宝石。一休回去后，真的用一部分帮助了村里贫穷的老人和生病的孩子，剩下的好好保管着。\n\n村里人都夸一休又聪明又善良。一休说:"聪明是用来解决问题的，善良是用来温暖别人的。有了这两样，比什么宝藏都珍贵。"\n\n一休明白了:真正的宝藏，不只是金银财宝，更是善良的心、分享的快乐和帮助别人的意义。用智慧解决难题，用善良对待世界，才是最宝贵的。'
},
{
  id: 'yixiu_4',
  title: '【一休历险记】第四集：小河里的鳄鱼',
  category: '一休',
  content: '一休要去河对岸采草药，给生病的邻居奶奶治病。可是河上没有桥，河里还住着一条凶恶的大鳄鱼。\n\n一休站在河边发愁。这时，大鳄鱼浮上水面，假惺惺地说:"小姑娘，要过河吗？我驮你过去呀！"\n\n一休才不信呢——驮到河中间，鳄鱼一定会把她吃掉。\n\n但一休急着过河救人，必须想个办法。她看了看四周，发现河边有很多大石头，还有一些浮在水面的荷叶。\n\n一休想了个主意。她对鳄鱼说:"鳄鱼大哥，我听说你们鳄鱼家族可大了，但我不信你们有很多。你能叫上你的兄弟们，排成一排让我数数吗？如果真的很多，我就相信你，让你驮我过河。"\n\n鳄鱼为了炫耀，"哗哗哗"叫来了好多兄弟，从河这边一直排到了河那边，像一座桥。\n\n一休笑了——她踩着鳄鱼的背，一只一只地数着跳过去:"一、二、三……"很快就跳到了对岸！\n\n"谢谢你们！果然很多！"一休朝鳄鱼们挥挥手，赶紧跑去采草药了。\n\n等鳄鱼们反应过来"上当了",一休早就跑远了。\n\n采完草药，一休要回来。这次鳄鱼们学乖了，不肯再排队。一休又想了个办法——她远远地扔了一块肉到下游，鳄鱼们都游过去抢肉，一休趁机踩着露出水面的石头，快速跳回了对岸。\n\n一休把草药带回来，救了生病的奶奶。奶奶感激极了:"多亏了聪明的一休！"\n\n一休说:"遇到困难和危险，不能硬来，要动脑筋想办法。用智慧战胜比自己强大的对手，就能化险为夷。"\n\n一休又一次用她的机智，既完成了任务，又保护了自己。她的聪明和善良，让她成了村里人人称赞的小英雄。'
},
{
  id: 'yixiu_5',
  title: '【一休历险记】第五集：会飞的扫把',
  category: '一休',
  content: '一休在森林里捡到了一把旧扫把。她随口说了句:"要是这扫把能飞就好了，我就能飞到天上看风景啦！"\n\n没想到，扫把突然抖了一下，飘了起来！"哇，真的能飞！"一休惊喜地骑了上去。\n\n扫把带着一休飞上了天空。一休看到了美丽的风景——绿绿的森林、弯弯的小河、五颜六色的花田。一休开心极了。\n\n可是飞着飞着，扫把突然不听话了，越飞越高、越飞越快，一休吓得紧紧抓住扫把:"停下来！停下来！"可扫把根本不听。\n\n原来，这是一把被施了坏魔法的扫把——它会把骑上来的人带到云层最深处的"迷失云海",让人再也回不来。\n\n一休努力让自己冷静下来。她想:"扫把是听我的话飞起来的，那它应该也能听我的话停下来。刚才它飞起来，是因为我说\'要是能飞就好了\'。"\n\n一休大声、清楚地说:"扫把，我命令你，慢慢地、平稳地飞回地面！"\n\n可扫把还是不听。一休又想:也许要用更明确的话。她试着说:"扫把，向下飞，回到我捡到你的那棵大树旁边！"\n\n这次，扫把慢了下来，开始往下降！原来，对付这把扫把，要给它清楚、具体的指令，它才会照做。\n\n一休一边说着清楚的指令，一边控制扫把慢慢下降。终于，扫把平稳地落回了那棵大树旁边。\n\n一休松了一口气，从扫把上下来。她把扫把靠在树上，说:"谢谢你带我看了美丽的风景，但你太危险了，我不能带你走。"\n\n一休安全地回了家。她想:"遇到失控的危险，不能慌张。要冷静地想，问题出在哪里，找到控制的方法。就像这把扫把，找到了正确的指令，就能让它听话。"\n\n一休用她的冷静和智慧，化解了一场空中的危机。她明白了，越是危险的时候，越要冷静动脑，才能找到脱险的办法。'
},
{
  id: 'yixiu_6',
  title: '【一休历险记】第六集：三个愿望的陷阱',
  category: '一休',
  content: '一休在路上遇到了一个精灵，精灵说:"小姑娘，我可以满足你三个愿望，你想要什么？"\n\n一休很高兴，但她也很警惕——天下没有白吃的午餐，这里面会不会有陷阱？\n\n一休先不急着许愿，而是问:"精灵先生，满足我的愿望，你有什么条件吗？"\n\n精灵笑了笑:"没有条件，你尽管许愿。"\n\n一休还是不放心。她仔细观察精灵，发现精灵的眼睛里闪着狡猾的光。一休决定试探一下。\n\n她说:"那我第一个愿望是——请你告诉我，实现愿望后，我会失去什么？"\n\n精灵愣住了，脸色变了变，支支吾吾:"这个……"\n\n原来，这个精灵是个骗子精灵！它满足人的愿望，但每实现一个愿望，就会偷走人的一样宝贵的东西——快乐、健康、或者亲情。很多人贪心地许愿，最后失去了最宝贵的东西，后悔莫及。\n\n一休看穿了它的把戏:"你根本不是好心！你满足愿望，是为了偷走我宝贵的东西对不对？"\n\n精灵见被识破，恼羞成怒:"哼，聪明的丫头！可惜你已经许了一个愿望（问我问题），我要拿走你的一样东西了！"\n\n一休却笑了:"我刚才的问题，是让你说出真相，这不算贪心的愿望。而且，我什么贵重的愿望都没许，你偷不走我宝贵的东西——因为我最宝贵的东西是我的善良和智慧，这些是偷不走的！"\n\n精灵气得跳脚，可是拿一休没办法，只好灰溜溜地消失了。\n\n一休安全地离开了。她想:"当有人许诺给你很多好处的时候，一定要多想想：这是真的吗？有没有陷阱？会不会失去更宝贵的东西？不贪心、多思考，就不会上当。"\n\n一休用她的机智和不贪心，识破了骗子精灵的陷阱。她明白了，真正宝贵的东西——善良、智慧、健康、亲情，是任何人都偷不走、骗不去的，也是不能用来交换的。'
},
{
  id: 'yixiu_7',
  title: '【一休历险记】第七集：黑森林的回声',
  category: '一休',
  content: '一休走进了一片黑黑的森林。这里的树又高又密，阳光照不进来，静得可怕。\n\n走着走着，一休听到前面传来求救声:"救命啊！救命啊！"\n\n一休心地善良，赶紧朝声音跑去。可是跑过去一看，什么都没有。她又听到左边传来:"救命啊！"跑过去，还是什么都没有。声音一会儿在左，一会儿在右，一会儿在前，一会儿在后，把一休引得团团转，越走越深，最后迷路了。\n\n一休停下来，冷静地想:"这声音很奇怪，一直把我引向森林深处。会不会是有什么东西在骗我？"\n\n果然，一个阴森森的声音笑了:"哈哈，小姑娘，你已经进了黑森林的深处，出不去啦！我是黑森林的回声妖，专门用求救声把好心人骗进来。"\n\n原来，回声妖利用一休的善良，用假的求救声把她引进了森林深处。\n\n一休虽然害怕，但没有慌。她想:"回声妖用声音骗我，那我也不能只靠耳朵。我要用别的办法找出路。"\n\n一休想起来:自己进森林的时候，是从有阳光的方向进来的。现在只要朝着有微光的方向走，就能出去。她还想起，来的时候踩过一些特别的蘑菇，留下了印记。\n\n一休不再理会那些"求救声",而是仔细观察——朝着有微弱光线的方向，寻找自己来时踩过的蘑菇印记。\n\n回声妖见骗不动一休了，又变换声音，一会儿模仿一休妈妈的声音:"一休，往这边来！"一会儿模仿好朋友的声音。但一休不上当了:"哼，你再怎么变声音，我也不听了！我只相信自己的眼睛和判断！"\n\n一休顺着光线和印记，一步一步地走。终于，前面的光越来越亮——她走出了黑森林！\n\n回声妖在身后气得大叫，但一休已经安全脱险了。\n\n一休想:"善良是好的，但也要有智慧，不能被坏人利用。遇到可疑的情况，不能只听声音，要冷静判断、用眼睛观察、靠自己的方法找出路。"\n\n一休用她的善良、冷静和智慧，识破了回声妖的骗局，安全走出了黑森林。她明白了：善良要配上智慧，才不会被坏人利用。'
},
{
  id: 'yixiu_8',
  title: '【一休历险记】第八集：贪吃的巨人',
  category: '一休',
  content: '一休路过一座山，山脚下住着一个巨人。巨人特别贪吃，把周围的果树、庄稼都吃光了，还要吃村里小动物的粮食。小动物们又怕又愁。\n\n一休决定帮小动物们。她来到巨人面前。巨人瓮声瓮气地说:"小不点，你也是来送吃的的吗？"\n\n一休不慌不忙:"巨人先生，我听说你特别能吃，但我不信。我打赌，有一样东西你肯定吃不完。"\n\n巨人不服气:"哈哈，我什么都吃得完！什么东西我吃不完？"\n\n一休指着旁边的一口水井:"这一整井的水，你喝得完吗？"\n\n巨人哈哈大笑:"这有什么难的！看我的！"他趴下来，"咕嘟咕嘟"地喝井水，想把水喝光来证明自己。\n\n可是井水又凉又多，巨人喝了好多好多，肚子撑得圆滚滚的，喝得直打嗝，可井水还是那么多（因为井水是活水，会不断从地下冒出来）。\n\n巨人喝得肚子疼，再也喝不下了，撑得躺在地上直哼哼:"哎哟，我的肚子……喝不下了……"\n\n一休趁机说:"巨人先生，你看，你再能吃能喝，也有吃不完喝不完的东西。而且，你把周围都吃光了，以后就没有吃的了，你自己也会饿肚子。不如我教你种果树、种庄稼，这样年年都有吃不完的东西，多好！"\n\n巨人撑着肚子想了想:"种东西？我不会呀……"\n\n一休说:"我教你！种子种下去，浇水、施肥，就会长出果子和粮食。这样你就有源源不断的食物了，不用去抢别人的。"\n\n一休教巨人种果树、种庄稼。巨人跟着学，慢慢地，山脚下又长出了果树和庄稼。巨人有了自己的食物，不再抢小动物的粮食了，还把多余的分给大家。\n\n小动物们特别感激一休。一休说:"对付贪吃的巨人，硬打不行，要用智慧。而且，与其一味索取、抢夺，不如自己创造。教会他种植，比赶走他更好。"\n\n一休用她的智慧，不但化解了巨人的威胁，还帮巨人改掉了贪吃抢夺的坏毛病，让大家都过上了好日子。'
},
{
  id: 'yixiu_9',
  title: '【一休历险记】第九集：会说谎的狐狸',
  category: '一休',
  content: '森林里有一只狐狸，特别会说谎，经常骗小动物们。今天，它又想骗一休。\n\n狐狸跑到一休面前，装出很着急的样子:"一休，不好了！你家着火了！快回去看看！"\n\n一休一听，心里一紧，正要往家跑。但她突然想起——狐狸是出了名的骗子，说的话不能全信。\n\n一休停下来，冷静地问:"狐狸，你怎么知道我家着火了？你亲眼看到的吗？"\n\n狐狸支支吾吾:"我……我听别人说的……"\n\n一休又问:"是谁说的？在哪里看到的火？"\n\n狐狸答不上来了，眼神闪躲。\n\n一休心里有数了——这是狐狸编的谎话，想骗她跑回去，好趁机做坏事（可能是想偷东西，或者引她进陷阱）。\n\n一休不动声色，说:"哦，那我先不急着回去。我先派我的好朋友老鹰飞过去看看情况，确认了再回去。"\n\n一休假装抬头喊:"老鹰朋友，帮我看看我家着火了没有！"\n\n狐狸一听一休有老鹰朋友能查证，慌了——谎话马上就要被拆穿了。它心虚地说:"那个……我可能记错了，也许不是你家……我先走了！"说完灰溜溜地跑了。\n\n一休笑了。她其实并没有什么老鹰朋友，只是用这个办法诈了狐狸一下，狐狸做贼心虚，就露馅了。\n\n一休回到家，家里好好的，根本没着火。她庆幸自己没有轻信狐狸的话。\n\n一休想:"听到消息，尤其是让人着急、害怕的消息，不要马上相信、马上行动。要先冷静地问清楚、核实一下——是真的吗？谁说的？有证据吗？这样就不会被骗子的谎话骗到了。"\n\n从那以后，狐狸再也不敢骗一休了，因为一休总能识破它的谎话。一休用她的冷静和机智，一次次识破骗局，保护了自己。她明白了：不轻信、多求证，是不被谎言欺骗的好办法。'
},
{
  id: 'yixiu_10',
  title: '【一休历险记】第十集：冰雪女王的考验',
  category: '一休',
  content: '冬天，一休听说雪山上住着一位冰雪女王，谁能通过她的考验，就能得到一朵永不凋谢的冰雪花。一休想把这朵神奇的花送给生病的奶奶，让奶奶开心，于是踏上了雪山。\n\n雪山又冷又滑，一休裹紧衣服，一步一步往上爬。终于，她来到了冰雪女王的冰宫殿。\n\n冰雪女王坐在冰王座上，冷冷地说:"想要冰雪花？先通过我的三个考验。"\n\n第一个考验:冰雪女王变出一大堆金银珠宝，说:"这些都给你，只要你放弃冰雪花，转身回家。"\n\n一休摇摇头:"我要冰雪花是为了送给生病的奶奶，让她开心。金银珠宝再多，也换不来奶奶的笑容。我不放弃。"\n\n冰雪女王眼中闪过一丝赞许，进行第二个考验:她变出一条又长又滑的冰路，路两边是万丈深渊，说:"走过这条冰路，才能拿到花。"\n\n一休看着又滑又险的冰路，有点害怕。但她想起了奶奶，鼓起了勇气。她没有硬冲，而是仔细观察——冰路上有一些凸起的冰纹，踩上去不那么滑。一休扶着旁边的冰壁，踩着冰纹，小心翼翼地、一步一步地慢慢走。虽然慢，但很稳。终于，她安全地走过了冰路。\n\n第三个考验:冰雪女王说:"最后，回答我——你觉得，什么东西比冰雪花更珍贵？"\n\n一休想了想，认真地说:"是爱。我爬雪山、走冰路，是因为爱奶奶。冰雪花再珍贵，也是因为它能表达我对奶奶的爱，才有意义。爱，比任何东西都珍贵。"\n\n冰雪女王的冰冷脸庞，露出了温暖的笑容:"你说得对。你善良、勇敢、有智慧，还有一颗充满爱的心。冰雪花，你配得上。"\n\n冰雪女王把永不凋谢的冰雪花送给了一休。一休谢过女王，小心地捧着花下了山。\n\n一休把冰雪花送给了奶奶。奶奶看着美丽的花，又感动于一休的孝心，心情一下子好了很多，病也慢慢好了起来。\n\n一休明白了:面对诱惑（金银珠宝），要坚守自己的目标和爱心;面对危险（冰路），要勇敢又不蛮干，冷静观察、小心应对;而爱，是支撑我们克服一切困难的力量，也是世界上最珍贵的东西。\n\n一休用她的坚定、勇敢、智慧和爱，通过了冰雪女王的考验，也表达了对奶奶深深的爱。'
},
{
  id: 'yixiu_11',
  title: '【一休历险记】第十一集：森林音乐会的捣乱者',
  category: '一休',
  content: '森林里要开一场音乐会，小鸟唱歌、青蛙打鼓、蟋蟀拉琴，可热闹了。一休也被邀请去听。\n\n可是，音乐会刚开始，就来了一只捣乱的乌鸦。它"哇哇哇"地大叫，声音又难听又吵，把美妙的音乐全盖住了。小动物们都捂着耳朵，音乐会没法进行了。\n\n大家想赶走乌鸦，可乌鸦飞得高，谁也够不着，它还越叫越起劲，故意捣乱。\n\n一休观察了一会儿，想出了一个办法。她没有去赶乌鸦，而是走上台，对大家说:"我们来举办一个\'歌唱比赛\'吧！看谁唱得最响亮、最特别！"\n\n乌鸦一听"比赛",来了劲——它最喜欢显摆自己的大嗓门了。"哇哇哇！我最响亮！"乌鸦拼命地叫，想赢得比赛。\n\n一休说:"乌鸦先生嗓门真大！不过，比赛要一个一个来。你先到旁边那棵最远的树上，等轮到你，我喊你，你再使劲唱，让大家听听你最响亮的声音。"\n\n乌鸦为了在比赛中获胜，乖乖飞到了最远的那棵树上等着。\n\n这样一来，乌鸦离音乐会远了，它的叫声也传不过来了。一休趁机对大家说:"好，现在音乐会继续！等这边结束，我们再去听乌鸦的\'独唱\'！"\n\n音乐会顺利地继续了，美妙的音乐又响了起来。而那只乌鸦，在远处的树上傻傻地等着"轮到它",等了好久也没等到，最后无趣地飞走了。\n\n小动物们都佩服一休的机智:"一休没有跟乌鸦硬碰硬，而是用巧办法把它支开了，音乐会才能顺利进行！"\n\n一休笑着说:"对付捣乱的人，硬赶走不一定管用，还可能让它更来劲。不如利用它爱显摆的心理，用个巧办法把它引开。动脑筋，总能找到和平解决问题的办法。"\n\n一休用她的机智，不动声色地解决了捣乱者，让森林音乐会圆满进行。大家都为聪明的一休鼓掌。'
},
{
  id: 'yixiu_12',
  title: '【一休历险记】第十二集：会变身的妖怪',
  category: '一休',
  content: '一休听说村子附近有个会变身的妖怪，专门变成人们熟悉的样子来骗人。一休决定去会会它。\n\n在森林里，一休遇到了"妈妈":"一休，妈妈来接你回家了，快跟妈妈走！"\n\n一休仔细一看——这个"妈妈"虽然长得像，但有个破绽:真妈妈左脸有颗小痣，这个"妈妈"没有！\n\n"你不是我妈妈！"一休说，"我妈妈左脸有颗痣，你没有！"\n\n"妈妈"一愣，"噗"地变回了妖怪的样子:"哼，被你看穿了！不过，我还会变别的！"\n\n妖怪又变成了一休的好朋友:"一休，我们一起去玩吧！"\n\n一休又观察:真朋友说话有个习惯，总爱先说"那个",这个"朋友"没有。而且，真朋友知道一休最喜欢的颜色。一休问:"你知道我最喜欢什么颜色吗？"\n\n妖怪答不上来，只能瞎猜，猜错了。\n\n"你也不是我朋友！"一休又识破了。\n\n妖怪变了好几次，变成一休认识的各种人，但一休每次都能通过一些细节识破——真正熟悉的人，有独特的习惯、知道只有彼此才知道的事。妖怪变得了样子，却变不出这些细节。\n\n妖怪气急败坏:"你怎么每次都能认出来！"\n\n一休说:"因为我真正了解我的家人和朋友——他们的样子、习惯、我们共同的秘密。你只能变个外表，变不出这些。所以你骗不了我。"\n\n妖怪没辙了，只好现出原形，灰溜溜地逃走了，再也不敢来骗一休了。\n\n一休回到村里，还教大家怎么识破变身妖怪:"和熟悉的人之间，可以约定一些只有你们知道的\'暗号\'或者问一些只有真正的家人朋友才知道的问题。这样，就算有人假冒，也能识破。"\n\n村里人都照做了，妖怪再也骗不到人了。\n\n一休想:"骗子可以模仿外表，但模仿不了真正的了解和感情。多观察细节、了解真正的家人朋友、约定暗号，就能识破假冒的骗子。"\n\n一休用她敏锐的观察力和智慧，识破了会变身的妖怪，保护了自己和村民。她明白了：真正的了解和用心，是任何假冒都骗不过的。'
},
{
  id: 'yixiu_13',
  title: '【一休历险记】第十三集：沙漠里的海市蜃楼',
  category: '一休',
  content: '一休为了寻找一种能治病的沙漠花，来到了一片大沙漠。沙漠又热又渴，一休走得又累又渴。\n\n突然，前方出现了一片美丽的绿洲——有清凉的湖水、茂盛的果树、还有阴凉的树荫！"太好了，有水喝了！"一休兴奋地朝绿洲跑去。\n\n可是，跑了好久，绿洲好像一直在前面，怎么也到不了。一休累得气喘吁吁。\n\n一休停下来，冷静地想:"奇怪，绿洲怎么一直到不了？会不会……这是假的？"\n\n一休想起爸爸讲过的知识:沙漠里有一种现象叫"海市蜃楼",是光线折射造成的假象，看起来有绿洲、有水，其实是空的。很多迷路的人朝海市蜃楼跑，最后累死、渴死在沙漠里。\n\n"这是海市蜃楼！是假的！"一休恍然大悟，赶紧停了下来。要是她一直追着假绿洲跑，会把力气耗尽，非常危险。\n\n一休冷静下来，回想爸爸教的沙漠求生知识:"沙漠里，白天太阳大，要找阴凉处休息，避免中暑;晚上凉快了再赶路。要节约用水，找真正的水源——比如有绿色植物、有动物出没的地方，才可能有真水。"\n\n一休不再追逐海市蜃楼，而是躲到一块大岩石的阴影下休息，节约体力和水。傍晚凉快了，她观察到远处有一群鸟儿飞向一个方向——"有鸟的地方，可能有水源！"\n\n一休朝鸟儿飞去的方向走，果然找到了一小片真正的绿洲，有清水和那种能治病的沙漠花！\n\n一休喝饱了水，采到了沙漠花，安全地走出了沙漠。\n\n一休想:"沙漠里的海市蜃楼，就像生活里那些看起来美好、其实是假的诱惑。追逐假象，只会耗尽自己。要冷静判断真假，用知识和智慧找到真正的方向。"\n\n一休靠着冷静、知识和智慧，识破了海市蜃楼的假象，在危险的沙漠中成功找到了真正的绿洲和花。她明白了：知识能救命，冷静能脱险，不被假象迷惑，才能找到真正的目标。'
},
{
  id: 'yixiu_14',
  title: '【一休历险记】第十四集：贪心的渔夫',
  category: '一休',
  content: '一休在海边遇到了一个渔夫。渔夫捞到了一条会说话的金鱼，金鱼说:"放了我，我可以满足你一个愿望。"\n\n渔夫贪心地许愿:"我要一座金山！"金鱼满足了他，海边出现了一座金山。可渔夫还不满足:"我要变成国王！"金鱼说这不在能力范围，渔夫就恼羞成怒，抓住金鱼要吃掉它。\n\n一休看到了，赶紧上前劝阻:"渔夫伯伯，别这样！金鱼已经给了你一座金山，你已经很富有了，为什么还不满足呢？"\n\n渔夫贪婪地说:"金山哪够！我要更多！我要当国王，要当全世界最有钱的人！"\n\n一休摇摇头:"伯伯，人的贪心是没有尽头的。你有了金山想当国王，当了国王还会想要更多。可是，越贪心，越不快乐，还会失去已经拥有的。"\n\n渔夫不听:"少啰嗦！我就要更多！"他还想逼金鱼满足他，结果金鱼一挣扎，游回了海里。\n\n金鱼在海里说:"贪心的人，不配拥有财富。"话音刚落，海边那座金山"哗"地消失了！渔夫因为太贪心，最后什么都没得到，还失去了金山。\n\n渔夫瘫坐在地上，后悔莫及:"我要是知足就好了……"\n\n一休说:"伯伯，知足才能常乐。如果你满足于那座金山，好好用它，就能过上好日子。可是你太贪心，想要更多更多，结果失去了一切。"\n\n一休帮渔夫想办法:"金山没了，但你还有捕鱼的本领呀。靠自己的双手勤劳地捕鱼，虽然不能一夜暴富，但能踏踏实实地过日子，还很快乐。"\n\n渔夫听了一休的话，惭愧地低下了头。他决定不再贪心，靠自己的本领勤劳地生活。后来，渔夫踏踏实实地捕鱼，日子过得平凡而快乐，再也不贪心了。\n\n一休想:"贪心是最可怕的。越贪心，越不满足，还会失去已经拥有的。知足常乐，靠自己的努力踏实生活，才是真正的幸福。"\n\n一休用她的智慧，劝导了贪心的渔夫，让他明白了知足和勤劳的道理。她明白了：贪得无厌只会失去一切，知足和勤劳才能带来真正的幸福。'
},
{
  id: 'yixiu_15',
  title: '【一休历险记】第十五集：会催眠的大蟒蛇',
  category: '一休',
  content: '一休在丛林里遇到了一条巨大的蟒蛇。蟒蛇有一双金色的眼睛，会催眠——被它的眼睛盯上，就会晕晕乎乎地失去意识，被它吃掉。\n\n蟒蛇盯上了一休，金色的眼睛开始发光，缓缓地摇晃着脑袋:"小姑娘，看着我的眼睛……乖乖地……过来……"\n\n一休感到一阵困意袭来，眼皮越来越重。但她意识到不对劲——"这是蟒蛇在催眠我！不能看它的眼睛！"\n\n一休赶紧闭上眼睛，或者看别处，不去看蟒蛇的眼睛。果然，困意消失了，她清醒了过来。\n\n蟒蛇见催眠失败，恼怒地说:"哼，居然不上当！"它张开大嘴，朝一休扑过来。\n\n一休闭着眼睛不敢看蟒蛇，但这样就看不清蟒蛇在哪里，很危险。她急中生智，想到了一个办法——用耳朵听！\n\n一休仔细听蟒蛇移动的"沙沙"声，判断它的位置。同时，她摸索着捡起地上的东西。她摸到了一面别人丢弃的小镜子（或者亮的金属片）。\n\n一休有了主意。她用镜子对着声音传来的方向——当蟒蛇又想用眼睛催眠她时，一休猛地用镜子把蟒蛇催眠的目光反射了回去！\n\n蟒蛇被自己的催眠目光反射到，"咦？"它自己被自己催眠了，晕乎乎地摇晃起来，最后"扑通"睡着了！\n\n一休趁蟒蛇睡着，赶紧跑得远远的，安全脱险了。\n\n一休想:"遇到会催眠的蟒蛇，关键是不能看它的眼睛。用别的感官（耳朵）来判断，再用智慧（镜子反射）来对付它。遇到危险，冷静动脑，总能找到办法。"\n\n一休用她的冷静和机智，破解了蟒蛇的催眠术，还让蟒蛇自食其果。她明白了：面对可怕的对手，慌乱只会送命，冷静和智慧才能救命。找到对手的弱点、以其人之道还治其人之身，就能化险为夷。'
},
{
  id: 'yixiu_16',
  title: '【一休历险记】第十六集：桥下的收费怪',
  category: '一休',
  content: '一休要过一座桥去镇上。可是桥下住着一个收费怪，它拦住过桥的人，要人交出最宝贵的东西才让过。\n\n收费怪拦住一休:"想过桥？交出你最宝贵的东西！"\n\n一休想了想，说:"我最宝贵的东西是我的智慧。可是智慧看不见摸不着，没法交给你。"\n\n收费怪不信:"那就交出你身上值钱的东西！"\n\n一休身上没什么值钱的东西，只有一个空水壶和几块干粮。她灵机一动，决定用智慧对付这个贪婪的怪物。\n\n一休说:"收费怪，我确实没什么值钱的东西。不过，我可以告诉你一个能让你得到无数宝贝的秘密，作为过桥费，怎么样？"\n\n收费怪一听有无数宝贝，眼睛都亮了:"什么秘密？快说！"\n\n一休说:"你天天守在桥下收费，能收多少呢？过桥的人本来就不多。但是，如果你不收费，让大家自由过桥，会怎么样呢？"\n\n收费怪不解:"不收费？那我不就什么都得不到了？"\n\n一休说:"你想想，如果桥能自由通过，会有越来越多的人来往，镇子会越来越热闹、越来越繁荣。到时候，你可以在桥边开一个小店，卖水、卖吃的给过桥的人。来往的人多了，你的生意就好，赚的钱比收过桥费多得多！而且，大家会感谢你、喜欢你，你不再是人人讨厌的收费怪，而是受欢迎的店主。"\n\n收费怪愣住了，从来没想过还能这样。它想了想，觉得一休说得有道理——收费让人讨厌，收入还少;开店做生意，赚得多还受欢迎。\n\n收费怪决定试一试。它不再拦路收费，而是在桥边开了个小店。果然，桥自由通行后，来往的人越来越多，收费怪的小店生意兴隆，赚了不少钱，还交了很多朋友。它再也不是讨人厌的收费怪，而是热情的"桥边店主"了。\n\n收费怪特别感激一休:"谢谢你的秘密！我现在过得比以前好多了！"\n\n一休笑着过了桥。她想:"对付贪婪、蛮横的人，硬碰硬不行。用智慧点醒他，让他明白——损人利己不如互利共赢。帮别人转变思路，比打败他更好。"\n\n一休用她的智慧，不但顺利过了桥，还帮收费怪改变了命运。她明白了：智慧能化解对立，共赢比独占更好。'
},
{
  id: 'yixiu_17',
  title: '【一休历险记】第十七集：会哭的娃娃',
  category: '一休',
  content: '一休在一间旧屋子里发现了一个漂亮的娃娃。可是这个娃娃很奇怪，一到晚上就会"呜呜"地哭，哭声凄凉，把附近的人都吓坏了，说这屋子闹鬼，没人敢住。\n\n一休不信有鬼，决定弄清楚娃娃为什么哭。\n\n晚上，一休大着胆子守在屋里。半夜，娃娃果然"呜呜"地哭了起来。一休没有害怕，而是仔细观察和倾听。\n\n她发现，娃娃的哭声，其实是风吹过娃娃身上的小孔发出的声音！原来，这个娃娃身上有几个小孔，晚上起风的时候，风穿过小孔，就发出了像哭一样的呜呜声。白天风小，就不响;晚上风大，就"哭"了。\n\n"原来根本不是鬼，是风声！"一休恍然大悟。\n\n一休还发现，娃娃身上的小孔，是因为娃娃旧了、破了洞。一休找来针线，把娃娃身上的小孔补好了。\n\n补好以后，晚上再起风，娃娃就再也不"哭"了——因为没有小孔，风穿不过去了。\n\n一休把真相告诉了大家:"这屋子根本没有鬼！娃娃\'哭\'是因为身上有小孔，晚上起风，风穿过小孔发出了呜呜声，听起来像哭。我把小孔补好，它就不\'哭\'了。"\n\n大家将信将疑地在屋里住了一晚，果然，娃娃再也没"哭",屋子里平平安安的。大家这才明白，原来是自己吓自己，被"风声"骗了。\n\n从此，这间"闹鬼"的屋子，又有人敢住了，还成了一个温暖的家。\n\n一休想:"很多看起来\'闹鬼\'、可怕的事情，其实都有科学的解释。不要盲目害怕、迷信，要冷静地观察、思考，找出真正的原因。真相往往没有想象的那么可怕。"\n\n一休用她的勇敢、冷静和爱思考，破解了"会哭的娃娃"之谜，让大家不再害怕。她明白了：世界上没有鬼怪，很多"灵异"现象都有科学的原因。用知识和理性看世界，就不会被吓到、被骗到。'
},
{
  id: 'yixiu_18',
  title: '【一休历险记】第十八集：分不公平的两只小熊',
  category: '一休',
  content: '一休在森林里遇到两只小熊在吵架。原来，它们捡到了一块大饼，可是分不均——你说我的大、我说你的大，谁也不让谁，吵得不可开交。\n\n这时，一只狡猾的狐狸走过来，假装好心:"我来帮你们分吧！"\n\n狐狸把饼分成两半，看看这块大，就咬一口;看看那块大，又咬一口。咬来咬去，饼越来越小，最后大部分都进了狐狸的肚子，只给两只小熊剩了一点点渣。\n\n两只小熊傻眼了，后悔极了——因为自己争抢、不会分，结果被狐狸钻了空子，吃了大亏。\n\n一休正好看到了这一幕。她走过来对两只小熊说:"你们看，因为你们争抢、不肯谦让，结果让狐狸占了便宜，两个人都吃了亏。"\n\n两只小熊难过地说:"那……以后我们该怎么分东西呢？"\n\n一休教它们一个公平的办法:"你们两个分东西，可以这样——让一只小熊来分，把东西分成两份;然后让另一只小熊先挑。这样，负责分的那只，为了自己不吃亏，一定会尽量分得平均;而先挑的那只，能挑到自己满意的。这样就公平了，谁也不会吃亏。"\n\n两只小熊觉得这个办法真好。后来它们又捡到东西，就用一休教的办法——一只分，一只先挑，分得公公平平，再也不吵架，也不会被狐狸占便宜了。\n\n两只小熊还成了好朋友，有好东西一起分享。\n\n一休想:"争抢和不谦让，只会让别人钻空子、让自己吃亏。分东西要公平——\'一个分，一个挑\'是个好办法。而且，谦让和分享，比争抢更能收获快乐和友谊。"\n\n一休用她的智慧，教会了两只小熊公平分东西的办法，还让它们明白了谦让和分享的道理。她明白了：智慧能化解矛盾，公平和谦让能带来和谐。'
},
{
  id: 'yixiu_19',
  title: '【一休历险记】第十九集：巨鹰的巢穴',
  category: '一休',
  content: '一休的好朋友小兔子被一只巨鹰抓走了，带到了高高的悬崖上的巢穴里。一休决定去救小兔子。\n\n悬崖又高又陡，巨鹰又凶又大，直接冲上去救肯定不行。一休躲在远处，冷静地观察。\n\n她发现，巨鹰每天中午都会飞出去觅食，要过一段时间才回来。这段时间，巢穴里就只剩小兔子了。\n\n一休还发现，悬崖虽然陡，但有一条隐蔽的小路可以爬上去，只是有点危险。\n\n一休决定趁巨鹰觅食的时候去救小兔子。中午，巨鹰飞走了。一休赶紧沿着隐蔽的小路，小心翼翼地往上爬。她手脚并用，抓紧岩石，一步一步，虽然害怕，但为了救朋友，她鼓起了勇气。\n\n终于，一休爬到了巢穴。小兔子看到一休，又惊又喜:"一休，你来救我了！"\n\n一休赶紧给小兔子解开束缚:"快，趁巨鹰没回来，我们赶紧走！"\n\n可是，就在这时，巨鹰提前回来了！它看到一休在偷它的"猎物",愤怒地扑了过来。\n\n一休临危不乱。她看到巢穴边有很多巨鹰叼来的树枝和羽毛。一休灵机一动，抓起一把羽毛和干草，等巨鹰扑近时，猛地撒向巨鹰的眼睛！巨鹰的眼睛被羽毛干草迷住，看不清了，一时扑了个空。\n\n一休趁机带着小兔子，顺着小路飞快地往下爬。巨鹰揉着眼睛追下来，但一休和小兔子已经爬到了森林里，钻进了茂密的树丛。巨鹰翅膀大，进不了密林，只能眼睁睁看着它们逃走。\n\n一休和小兔子安全地回到了村里。小兔子感激地说:"谢谢你救我，一休！你太勇敢、太聪明了！"\n\n一休说:"救朋友，不能只靠勇气，还要靠智慧。我观察了巨鹰的规律，趁它觅食时行动;遇到危险，用羽毛干草迷它的眼睛。勇敢加上智慧，才能成功。"\n\n一休用她的勇敢、观察力和机智，成功从巨鹰的巢穴救出了好朋友。她明白了：救人和脱险，既要有勇气，更要有智慧——观察规律、抓住时机、随机应变，才能化险为夷。友情，更是她勇敢的动力。'
},
{
  id: 'yixiu_20',
  title: '【一休历险记】第二十集：说大话的青蛙',
  category: '一休',
  content: '池塘里有一只爱说大话的青蛙。它总是吹牛:"我是世界上最厉害的！我能跳过大山，能游过大海，能吃掉大象！"小动物们都不喜欢它的吹牛。\n\n有一天，青蛙又在吹牛，还说:"我一口就能把整个池塘的水喝干！"\n\n一休正好路过，听到了。她决定用智慧让青蛙认识到吹牛的坏处。\n\n一休笑着说:"青蛙先生，你这么厉害，那你能一口把池塘的水喝干，我们都想见识见识！大家都来看青蛙喝干池塘水啦！"\n\n小动物们都围过来看。青蛙骑虎难下——牛已经吹出去了，不喝就露馅了。它只好硬着头皮，"咕嘟咕嘟"地喝池塘水。\n\n可是池塘的水那么多，青蛙喝了一肚子，肚子撑得圆滚滚的，水还是那么多。青蛙喝不下了，撑得肚子疼，还是没能把水喝干。\n\n小动物们都笑了:"青蛙吹牛！根本喝不干！"青蛙羞得满脸通红，恨不得找个地缝钻进去。\n\n一休走过去，对青蛙说:"青蛙先生，吹牛是要出丑的。你说大话，别人一开始可能相信，但迟早会被拆穿，到时候更丢脸。而且，吹牛的人，大家都不信任、不喜欢。"\n\n青蛙撑着肚子，惭愧地说:"我错了……我不该吹牛。"\n\n一休说:"其实，你有自己真正的本领呀——你游泳游得好，捉虫子也很厉害。这些是真本事，值得骄傲。何必吹那些做不到的牛呢？做真实的自己，用真本事赢得别人的尊重，比吹牛强多了。"\n\n青蛙听了，惭愧地低下了头。从那以后，它不再吹牛了，而是踏踏实实地展示自己真正的本领——帮大家捉害虫。慢慢地，小动物们又开始喜欢它、信任它了。\n\n一休想:"吹牛说大话，迟早会被拆穿，让自己出丑，还会失去别人的信任。做真实的自己，用真本事说话，才能赢得尊重。"\n\n一休用她的智慧，让爱吹牛的青蛙认识到了错误，学会了做真实、诚实的自己。她明白了：诚实和真本事，比吹牛说大话更让人尊重。'
},
{
