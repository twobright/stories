// ==================== STATE ====================
const State = {
  currentView: 'list', // list | reading | settings | addStory
  currentCategory: '全部',
  currentStory: null,
  stories: [],
  favorites: new Set(),
  customStories: [],
  settings: {
    protagonistName: '小宝贝',
    voiceURI: '',
    speed: 0.85,
    pitch: 1.1,
    sleepTimer: 0
  },
  tts: {
    playing: false,
    paused: false,
    currentSentenceIndex: 0,
    sentences: [],
    utterance: null
  },
  sleepTimerEnd: null,
  sleepTimerInterval: null
};

// ==================== STORAGE ====================
function loadState() {
  try {
    const saved = localStorage.getItem('bedtime_stories_state');
    if (saved) {
      const data = JSON.parse(saved);
      if (data.settings) Object.assign(State.settings, data.settings);
      if (data.favorites) State.favorites = new Set(data.favorites);
      if (data.customStories) State.customStories = data.customStories;
    }
  } catch(e) { console.warn('Failed to load state', e); }
  State.stories = [...PRESET_STORIES, ...State.customStories];
}

function saveState() {
  try {
    localStorage.setItem('bedtime_stories_state', JSON.stringify({
      settings: State.settings,
      favorites: [...State.favorites],
      customStories: State.customStories
    }));
  } catch(e) { console.warn('Failed to save state', e); }
}

// ==================== HELPERS ====================
function replaceName(text) {
  const name = State.settings.protagonistName || '小宝贝';
  // 支持多种占位符格式：{主人公} ｛主人公｝ （主人公） [主人公] 【主人公】
  return text.replace(/[{｛\[【（(]主人公[}｝\]】）)]/g, name);
}

function splitSentences(text) {
  return text.split(/(?<=[。！？\n])/g).map(s => s.trim()).filter(s => s.length > 0);
}

function getFilteredStories() {
  let stories = State.stories;
  if (State.currentCategory === '收藏') {
    stories = stories.filter(s => State.favorites.has(s.id));
  } else if (State.currentCategory !== '全部') {
    stories = stories.filter(s => s.category === State.currentCategory);
  }
  return stories;
}

// ==================== TTS ENGINE ====================
function getVoices() {
  return window.speechSynthesis.getVoices();
}

function stopTTS() {
  window.speechSynthesis.cancel();
  State.tts.playing = false;
  State.tts.paused = false;
  State.tts.currentSentenceIndex = 0;
  State.tts.utterance = null;
  render();
}

function pauseTTS() {
  if (window.speechSynthesis.speaking) {
    window.speechSynthesis.pause();
    State.tts.paused = true;
    State.tts.playing = false;
    render();
  }
}

function resumeTTS() {
  if (State.tts.paused) {
    window.speechSynthesis.resume();
    State.tts.paused = false;
    State.tts.playing = true;
    render();
  }
}

function speakFromIndex(index) {
  if (index >= State.tts.sentences.length) {
    stopTTS();
    return;
  }
  State.tts.currentSentenceIndex = index;
  State.tts.playing = true;
  State.tts.paused = false;

  const text = State.tts.sentences[index];
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.rate = State.settings.speed;
  utterance.pitch = State.settings.pitch;
  utterance.lang = 'zh-CN';

  // Set voice
  const voices = getVoices();
  if (State.settings.voiceURI) {
    const voice = voices.find(v => v.voiceURI === State.settings.voiceURI);
    if (voice) utterance.voice = voice;
  } else {
    const zhVoice = voices.find(v => v.lang.startsWith('zh'));
    if (zhVoice) utterance.voice = zhVoice;
  }

  // Check sleep timer volume fade
  if (State.sleepTimerEnd) {
    const remaining = (State.sleepTimerEnd - Date.now()) / 1000;
    if (remaining <= 0) {
      stopTTS();
      clearSleepTimer();
      return;
    }
    if (remaining <= 30) {
      utterance.volume = Math.max(0.1, remaining / 30);
    }
  }

  utterance.onend = () => {
    if (State.tts.playing) {
      speakFromIndex(index + 1);
    }
  };
  utterance.onerror = (e) => {
    if (e.error !== 'canceled') {
      speakFromIndex(index + 1);
    }
  };

  State.tts.utterance = utterance;
  window.speechSynthesis.speak(utterance);
  render();
}

function playTTS() {
  if (State.tts.paused) {
    resumeTTS();
    return;
  }
  if (!State.currentStory) return;
  const content = replaceName(State.currentStory.content);
  State.tts.sentences = splitSentences(content);
  speakFromIndex(0);
}

// ==================== SLEEP TIMER ====================
function startSleepTimer(minutes) {
  clearSleepTimer();
  if (minutes <= 0) return;
  State.sleepTimerEnd = Date.now() + minutes * 60 * 1000;
  State.sleepTimerInterval = setInterval(() => {
    if (State.sleepTimerEnd && Date.now() >= State.sleepTimerEnd) {
      stopTTS();
      clearSleepTimer();
    }
    render();
  }, 1000);
}

function clearSleepTimer() {
  if (State.sleepTimerInterval) {
    clearInterval(State.sleepTimerInterval);
    State.sleepTimerInterval = null;
  }
  State.sleepTimerEnd = null;
}

// ==================== RENDER ====================
function render() {
  const app = document.getElementById('app');
  if (State.currentView === 'list') {
    app.innerHTML = renderListView();
  } else if (State.currentView === 'reading') {
    app.innerHTML = renderReadingView();
  }
  // Modals render on top
  if (State.currentView === 'settings') {
    app.innerHTML = renderListView() + renderSettingsModal();
  } else if (State.currentView === 'addStory') {
    app.innerHTML = renderListView() + renderAddStoryModal();
  }
}

// ==================== LIST VIEW ====================

          </button>

            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
        </div>
      </header>
      <div class="categories">
        ${categories.map(c => `
          <button class="chip ${State.currentCategory === c ? 'active' : ''}" 
                  onclick="State.currentCategory='${c}';render()">
            ${c}
          </button>
        `).join('')}
      </div>
      <div class="story-list">

}

function renderStoryCard(story) {
  const title = replaceName(story.title);
  const preview = replaceName(story.content).substring(0, 60) + '...';
  const isFav = State.favorites.has(story.id);
  return `
    <div class="story-card" onclick="openStory('${story.id}')">
      <div class="story-card-header">
        <span class="story-title">${title}</span>
        <button class="fav-btn ${isFav ? 'active' : ''}" onclick="event.stopPropagation();toggleFav('${story.id}')">
          ${isFav ? '★' : '☆'}
        </button>
      </div>
      <div class="story-meta">
        <span class="category-tag">${story.category}</span>
      </div>
      <p class="story-preview">${preview}</p>
    </div>
  `;
}

function openStory(id) {
  State.currentStory = State.stories.find(s => s.id === id);
  State.currentView = 'reading';
  stopTTS();
  render();
}

function toggleFav(id) {
  if (State.favorites.has(id)) {
    State.favorites.delete(id);
  } else {
    State.favorites.add(id);
  }
  saveState();
  render();
}

// ==================== READING VIEW ====================
function renderReadingView() {
  if (!State.currentStory) return '';
  const title = replaceName(State.currentStory.title);
  const content = replaceName(State.currentStory.content);
  const sentences = splitSentences(content);
  const progress = State.tts.playing || State.tts.paused 
    ? Math.round((State.tts.currentSentenceIndex / sentences.length) * 100) 
    : 0;

  let timerDisplay = '';
  if (State.sleepTimerEnd) {
    const remaining = Math.max(0, Math.ceil((State.sleepTimerEnd - Date.now()) / 1000));
    const mins = Math.floor(remaining / 60);
    const secs = remaining % 60;
    timerDisplay = `<span class="timer-display">⏱ ${mins}:${secs.toString().padStart(2,'0')}</span>`;
  }

  return `
    <div class="page reading-page">
      <header class="header">
        <button class="icon-btn" onclick="goBack()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <h1 class="header-title reading-title">${title}</h1>
        <div style="width:40px"></div>
      </header>
      <div class="reading-content" id="reading-content">
        ${sentences.map((s, i) => `
          <span class="sentence ${i === State.tts.currentSentenceIndex && (State.tts.playing || State.tts.paused) ? 'highlight' : ''}" 
                onclick="jumpToSentence(${i})">${s}</span>
        `).join('')}
      </div>
      <div class="control-bar">
        ${timerDisplay}
        <div class="progress-bar">
          <div class="progress-fill" style="width:${progress}%"></div>
        </div>
        <div class="controls">
          <button class="ctrl-btn" onclick="stopTTS()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          </button>
          <button class="ctrl-btn play-btn" onclick="${State.tts.playing ? 'pauseTTS()' : 'playTTS()'}">
            ${State.tts.playing 
              ? '<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>'
              : '<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>'
            }
          </button>
          <div class="speed-display" onclick="cycleSpeed()">${State.settings.speed.toFixed(2)}x</div>
        </div>
      </div>
    </div>
  `;
}

function goBack() {
  stopTTS();
  State.currentView = 'list';
  State.currentStory = null;
  render();
}

function jumpToSentence(index) {
  stopTTS();
  const content = replaceName(State.currentStory.content);
  State.tts.sentences = splitSentences(content);
  speakFromIndex(index);
}

function cycleSpeed() {
  const speeds = [0.5, 0.6, 0.7, 0.75, 0.85, 1.0, 1.2, 1.5, 2.0];
  const idx = speeds.indexOf(State.settings.speed);
  State.settings.speed = speeds[(idx + 1) % speeds.length];
  saveState();
  render();
}

// ==================== SETTINGS MODAL ====================
function renderSettingsModal() {
  const voices = getVoices();
  const zhVoices = voices.filter(v => v.lang.startsWith('zh') || v.name.includes('Chinese') || v.name.includes('中文'));
  const allVoices = zhVoices.length > 0 ? zhVoices : voices;

  return `
    <div class="modal-overlay" onclick="closeModal(event)">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
          <h2>设置</h2>
          <button class="icon-btn" onclick="State.currentView='list';render()">✕</button>
        </div>
        <div class="modal-body">
          <div class="setting-group">
            <label>主人公名字</label>
            <input type="text" class="setting-input" value="${State.settings.protagonistName}" 
                   onchange="State.settings.protagonistName=this.value;saveState();render()" 
                   placeholder="输入名字">
          </div>
          <div class="setting-group">
            <label>语音选择</label>
            <select class="setting-input" onchange="State.settings.voiceURI=this.value;saveState()">
              <option value="">系统默认</option>
              ${allVoices.map(v => `
                <option value="${v.voiceURI}" ${State.settings.voiceURI === v.voiceURI ? 'selected' : ''}>
                  ${v.name} (${v.lang})
                </option>
              `).join('')}
            </select>
          </div>
          <div class="setting-group">
            <label>语速: ${State.settings.speed.toFixed(2)}x</label>
            <input type="range" min="0.5" max="2.0" step="0.05" value="${State.settings.speed}"
                   oninput="State.settings.speed=parseFloat(this.value);saveState();render()">
          </div>
          <div class="setting-group">
            <label>音调: ${State.settings.pitch.toFixed(1)}x</label>
            <input type="range" min="0.5" max="2.0" step="0.1" value="${State.settings.pitch}"
                   oninput="State.settings.pitch=parseFloat(this.value);saveState();render()">
          </div>
          <div class="setting-group">
            <label>睡眠定时</label>
            <div class="timer-options">
              ${[0,15,30,45,60].map(m => `
                <button class="chip ${State.settings.sleepTimer === m ? 'active' : ''}"
                        onclick="State.settings.sleepTimer=${m};saveState();${m > 0 ? `startSleepTimer(${m})` : 'clearSleepTimer()'};render()">
                  ${m === 0 ? '关闭' : m + '分钟'}
                </button>
              `).join('')}
            </div>
          </div>
        </div>
      </div>
    </div>
  `;
}

function closeModal(e) {
  if (e.target.classList.contains('modal-overlay')) {
    State.currentView = 'list';
    render();
  }
}

// ==================== ADD STORY MODAL ====================
function renderAddStoryModal() {
  return `
    <div class="modal-overlay" onclick="closeModal(event)">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
          <h2>添加故事</h2>
          <button class="icon-btn" onclick="State.currentView='list';render()">✕</button>
        </div>
        <div class="modal-body">
          <div class="setting-group">
            <label>故事标题</label>
            <input type="text" class="setting-input" id="new-title" placeholder="例如：{主人公}的新朋友">
          </div>
          <div class="setting-group">
            <label>分类</label>
            <select class="setting-input" id="new-category">
              <option value="童话">童话</option>
              <option value="动物">动物</option>
              <option value="冒险">冒险</option>
              <option value="科学">科学</option>
              <option value="温馨">温馨</option>
              <option value="成语">成语</option>
            </select>
          </div>
          <div class="setting-group">
            <label>故事内容 <span class="hint">（使用 {主人公} 作为主人公占位符）</span></label>
            <textarea class="setting-input story-textarea" id="new-content" rows="8" 
                      placeholder="从前有一个..."></textarea>
          </div>
          <button class="primary-btn" onclick="addNewStory()">保存故事</button>
        </div>
      </div>
    </div>
  `;
}

function addNewStory() {
  const title = document.getElementById('new-title').value.trim();
  const category = document.getElementById('new-category').value;
  const content = document.getElementById('new-content').value.trim();
  
  if (!title || !content) {
    alert('请填写标题和内容');
    return;
  }
  
  const newStory = {
    id: 'custom_' + Date.now(),
    title: title,
    category: category,
    content: content
  };
  
  State.customStories.push(newStory);
  State.stories = [...PRESET_STORIES, ...State.customStories];
  saveState();
  State.currentView = 'list';
  render();
}

// ==================== INIT ====================
loadState();

// Voices may load async
if (window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = () => {
    if (State.currentView === 'settings') render();
  };
}

render();
</script>
