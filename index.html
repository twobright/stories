  title: '【调皮鬼正正】第二十四集：不认真做操乱动',
  category: '成长',
  content: '每天早上做早操，正正从来不认真做。别人伸手他缩手，别人踢腿他乱蹦，还故意做怪动作逗旁边的小朋友笑，把整齐的队伍搞乱了。\n\n"哈哈，你们看我这个动作！"正正扭来扭去，做鬼脸，旁边几个小朋友被他逗得也不好好做操了。\n\n李老师说："正正，做早操是为了锻炼身体，让我们长得高、长得壮。你不认真做，还影响别人，既锻炼不了身体，又破坏了队伍。"\n\n正正满不在乎："做操多没意思呀。"\n\n过了一段时间，学校组织体检和体能测试。认真做操的小朋友，身体都棒棒的，跑得快、跳得高。而正正呢，因为从来不认真锻炼，跑几步就喘，跳也跳不高，体能测试成绩很差。\n\n正正这才发现，认真做操的小朋友身体都比他好。\n\n李老师说："你看，每天认真做操、锻炼身体的小朋友，身体多棒。做操看着简单，但每天坚持，就能强身健体。你总是乱动、不认真，身体自然就比别人差了。"\n\n正正后悔了。从那以后，他做操特别认真——每个动作都做到位，伸手、踢腿、弯腰、跳跃，一丝不苟。\n\n坚持了一段时间，正正发现自己身体变好了，跑步不那么累了，也长高了一些。\n\n正正明白了：做早操、锻炼身体是很重要的事，能让我们长高长壮、身体健康。不能因为觉得"没意思"就不认真做、乱动、影响别人。每天认真锻炼，坚持下来，身体才会棒棒的。健康的身体，是做一切事情的基础。'
},
{
  id: 'zhengzheng_25',
  title: '【调皮鬼正正】第二十五集：把玩具藏在书包不还',
  category: '成长',
  content: '幼儿园的公共玩具，玩完了要放回玩具箱。可是正正特别喜欢一辆小火车，玩完以后偷偷藏进了自己的书包，想带回家。\n\n"这个小火车真好玩，我要把它带回家。"正正把小火车藏了起来。\n\n第二天，别的小朋友想玩小火车，找不到了。"小火车呢？谁看到小火车了？"大家找了半天也没找到。\n\n正正装作不知道，心里却有点心虚。\n\n李老师发现玩具少了，问大家。正正低着头不说话。\n\n放学的时候，正正的书包没拉好，小火车露了出来。李老师看到了："正正，这不是幼儿园的小火车吗？怎么在你书包里？"\n\n正正脸红了，小声说："我……我太喜欢了，想带回家……"\n\n李老师说："正正，幼儿园的玩具是大家一起玩的，不是某一个人的。你把它藏起来带回家，别的小朋友就玩不到了。这跟偷东西是一样的呀。"\n\n正正很惭愧。他把小火车拿了出来，放回了玩具箱。"对不起，我不该把公共玩具藏起来。"\n\n李老师说："你要是特别喜欢，可以让爸爸妈妈给你买一个一样的。但幼儿园的玩具属于大家，不能占为己有。"\n\n正正点点头。后来妈妈知道了，也批评了他，但也答应给他买一个类似的小火车作为奖励——奖励他主动承认错误、把玩具还了回去。\n\n正正拿到了自己的小火车，特别开心，也特别珍惜。他再也不惦记幼儿园的公共玩具了。\n\n正正明白了：公共的东西属于大家，不能占为己有、偷偷带回家。那样别人就玩不到了，跟偷东西一样。喜欢的东西，可以通过正当的方式得到（比如请爸爸妈妈买）。分清楚"公共的"和"自己的",不拿不属于自己的东西，是诚实和守规矩的表现。'
},
{
  id: 'zhengzheng_26',
  title: '【调皮鬼正正】第二十六集：吃饭吧唧嘴还说话',
  category: '成长',
  content: '正正吃饭的时候，习惯特别不好。他吧唧嘴，"吧唧吧唧"地嚼得很响;嘴里塞满了饭还大声说话，饭喷得到处都是;还用手抓菜吃，弄得满手油。\n\n旁边的小朋友都不愿意跟他一起吃饭了，觉得又吵又不卫生。\n\n李老师说："正正，吃饭要有好习惯。嘴巴闭着嚼，不要吧唧嘴;嘴里有饭的时候不说话，不然会喷出来，还容易呛到;用勺子和筷子吃，不用手抓。"\n\n正正不在意："吃饭嘛，随便点。"\n\n有一天，幼儿园请来了一位客人阿姨跟大家一起吃饭。正正还是老样子，吧唧嘴、喷饭、用手抓。客人阿姨皱起了眉头，旁边的小朋友都躲得远远的。\n\n吃完饭，正正听到别的小朋友悄悄说："正正吃饭好脏好吵，我不想跟他坐一起。"\n\n正正心里很不是滋味。原来自己吃饭的样子这么让人讨厌。\n\n李老师私下跟正正说："正正，吃饭的样子反映一个人的修养。吧唧嘴、喷饭、用手抓，会让人觉得没礼貌、不卫生。养成好的吃饭习惯，别人才愿意跟你一起吃饭。"\n\n正正开始改。他学着闭嘴嚼、不喷饭、用餐具。一开始有点不习惯，但慢慢就好了。\n\n改了以后，小朋友们又愿意跟他一起吃饭了，还夸他："正正现在吃饭真斯文！"\n\n正正明白了：吃饭要有好习惯和好礼貌——闭嘴咀嚼不出声，嘴里有饭不说话，用餐具不用手抓，细嚼慢咽。好的吃饭习惯，既卫生又有礼貌，别人才愿意亲近你。餐桌礼仪，体现一个人的修养。'
},
{
  id: 'zhengzheng_27',
  title: '【调皮鬼正正】第二十七集：把别人的积木推倒',
  category: '成长',
  content: '朵朵和美美合作，搭了一座又高又漂亮的积木城堡，搭了整整一节课，正准备给老师看。\n\n正正走过来，看到那么漂亮的城堡，心里痒痒的，也不知怎么的，伸手"哗啦"一下就把城堡推倒了。\n\n"啊！我们的城堡！"朵朵和美美心疼得叫起来，辛辛苦苦搭的城堡一下子全塌了。\n\n朵朵和美美都哭了。她们搭了那么久，就这么被正正推倒了。\n\n李老师问："正正，你为什么推倒她们的城堡？"\n\n正正自己也说不清："我……我也不知道，就是想推……"\n\n李老师说："正正，别人辛辛苦苦搭的东西，你一下子推倒，她们多伤心。就算你不是故意的，也要想想后果。看到别人的成果，应该欣赏、保护，而不是破坏。"\n\n正正看着哭泣的朵朵和美美，很后悔。"对不起，我不该推倒你们的城堡。我陪你们重新搭好不好？"\n\n正正陪着朵朵和美美，一起重新搭城堡。这次他特别小心，还出了不少好主意，把城堡搭得比原来更高更漂亮。\n\n朵朵和美美看城堡又搭好了，还更漂亮了，就原谅了正正。三个人一起欣赏着城堡，都很开心。\n\n李老师说："正正，你能主动帮忙重新搭，弥补了错误，很好。以后要记住，尊重和保护别人的劳动成果。"\n\n正正明白了：别人辛辛苦苦做出来的东西，要欣赏和保护，绝不能随便破坏。破坏别人的成果，会让人非常伤心。看到好的东西，可以欣赏、可以学习，如果不小心弄坏了，要真诚道歉并帮忙弥补。爱护别人的劳动，就是尊重别人。'
},
{
  id: 'zhengzheng_28',
  title: '【调皮鬼正正】第二十八集：不肯轮流当值日生',
  category: '成长',
  content: '班里每天要选值日生，帮老师擦桌子、摆椅子、发本子。今天轮到正正了，可是正正不肯干。\n\n"为什么要我干活？我不当值日生！"正正把活儿一推，跑去玩了。\n\n结果桌子没人擦，椅子没人摆，本子没人发，教室乱糟糟的。别的小朋友都很不满："该正正值日，他却跑去玩，害我们没本子用。"\n\n李老师说："正正，值日生是大家轮流当的。每个人都要为班级出一份力。今天轮到你，你不干，就影响了整个班级。"\n\n正正说："值日太累了，我不想干。"\n\n李老师说："每个小朋友都当过值日生，大家都为班级服务过。就你不干，公平吗？而且，如果大家都像你一样不肯干，那教室谁来打扫？本子谁来发？"\n\n正正没话说了。他看到别的小朋友当值日生的时候都认认真真的，而自己却偷懒，确实不应该。\n\n正正不好意思地说："对不起，我去当值日生。"\n\n他开始擦桌子、摆椅子、发本子。虽然有点累，但当他把教室收拾得整整齐齐、给每个小朋友发好本子的时候，大家都谢谢他，李老师也表扬了他。正正心里美滋滋的，有一种为大家服务的成就感。\n\n正正发现，当值日生虽然累一点，但能为班级做贡献，被大家感谢，其实挺开心的。\n\n正正明白了：为集体服务是每个人的责任。值日生轮流当，大家都要出一份力，不能偷懒、推卸。为大家服务虽然辛苦，但很有意义，能被大家认可和感谢。人人为集体，集体才会好，自己也生活在一个更好的班级里。'
},
{
  id: 'zhengzheng_29',
  title: '【调皮鬼正正】第二十九集：把小虫子放进同学衣领',
  category: '成长',
  content: '正正在草地上抓到了一只小虫子。他又起了坏心，趁乐乐不注意，把小虫子放进了乐乐的衣领里。\n\n小虫子在乐乐的脖子和背上爬，痒痒的，乐乐吓得又叫又跳:"啊！什么东西！有虫子！"他浑身乱抖，想把虫子弄出来，急得快哭了。\n\n正正在旁边哈哈大笑："哈哈，乐乐跳舞啦！"\n\n乐乐好不容易把虫子弄出来，吓得脸都白了。他很生气也很委屈:"正正，你为什么把虫子放我衣服里！吓死我了！"\n\n李老师说："正正，把虫子放进别人衣服里，会把人吓坏的。有的小朋友很怕虫子，这样做太吓人了。而且万一是有毒的虫子，咬伤了怎么办？"\n\n正正还觉得好玩。结果没过多久，别的小朋友学他，也往正正衣领里放了一只虫子。虫子在正正背上爬，痒痒的，正正吓得又叫又跳，浑身鸡皮疙瘩，差点哭出来。\n\n"啊！快弄出来！好痒好可怕！"正正被吓得不轻。\n\n李老师走过来说："现在你知道被虫子放进衣服的感觉了吧？又痒又怕。这就是乐乐刚才的感觉。"\n\n正正被吓得心有余悸，终于明白这一点都不好玩。"对不起乐乐，我不该把虫子放你衣服里。"\n\n从那以后，正正再也不用虫子吓人了。他明白了：把虫子放进别人衣服，会把人吓得魂飞魄散，非常不友善，还可能有安全隐患。自己被吓的滋味也很难受。不能用吓唬人的方式取乐，将心比心，别人害怕的事情就不要做。'
},
{
  id: 'zhengzheng_30',
  title: '【调皮鬼正正】第三十集：正正的好朋友越来越多',
  category: '成长',
  content: '不知不觉，正正改掉了好多好多坏毛病。他不再恶作剧、不再抢东西、不再欺负人、不再破坏东西了。\n\n他学会了将心比心，做事之前先想想别人的感受;学会了分享、谦让、帮助别人;学会了守规矩、讲礼貌、爱护公物和小动物;还学会了注意安全，保护自己和别人。\n\n慢慢地，正正发现，愿意跟他玩的小朋友越来越多了。\n\n以前，因为正正老是恶作剧、欺负人，大家都躲着他，他常常一个人孤零零的。\n\n现在，正正变得友善、体贴、乐于助人，小朋友们都喜欢跟他玩。下课了，好多人来找他:"正正，一起玩吧！"做游戏分组，大家都抢着要跟正正一组。\n\n正正的心里暖暖的。他终于明白，为什么以前没人跟他玩，现在朋友却这么多。\n\n李老师在班会上说："正正这段时间进步特别大。他从一个爱恶作剧、欺负人的调皮鬼，变成了一个友善、懂事、乐于助人的好孩子。所以，喜欢他的小朋友越来越多。这告诉我们一个道理——你怎么对待别人，别人就怎么对待你。"\n\n正正站起来，不好意思地说："以前我做了好多错事，欺负了好多小朋友，对不起大家。谢谢大家还愿意跟我做朋友。我以后会继续做一个友善的人。"\n\n小朋友们都为正正鼓掌。乐乐说："正正现在可好了，是我的好朋友！"朵朵、小美、壮壮也都说正正是好朋友。\n\n放学回家，正正高兴地对妈妈说："妈妈，我现在有好多好多好朋友了！"\n\n妈妈欣慰地抱住他："因为你变成了一个善良、友好的孩子呀。你对别人好，别人自然就喜欢你、愿意跟你做朋友。这就是最大的收获。"\n\n正正深深地明白了：友善待人，才能收获友谊。你怎么对别人，别人就怎么对你。用善良、体贴、乐于助人的心去对待每一个人，就能拥有越来越多的好朋友，生活也会越来越快乐。这是正正学到的最宝贵的道理。'
},
{
  id: 'zhengzheng_31',
  title: '【调皮鬼正正】第三十一集：把玩具泡在水里',
  category: '成长',
  content: '正正有一个会说话、会走路的电动机器人玩具，可好玩了。有一天他突然想:"机器人能不能游泳呢？"\n\n于是他把电动机器人放进了水盆里。结果，机器人"滋滋"响了两声，冒了点烟，就再也不动了——进水短路，坏了。\n\n"我的机器人！"正正后悔极了，可是机器人再也不会说话、不会走路了。\n\n妈妈知道后说："正正，电动玩具是不能泡水的。里面有电池和电路，进了水就会短路烧坏。这个机器人是你的生日礼物，就这么被你弄坏了，多可惜。"\n\n正正难过地看着坏掉的机器人。这是他最喜欢的玩具，就因为自己的好奇，永远坏了。\n\n妈妈说："好奇是好事，但要先想一想、问一问，不能乱试。有的东西不能泡水，有的东西不能摔，有的东西不能拆。不了解的时候，先问大人。"\n\n正正后悔没有先问妈妈。要是问了，妈妈会告诉他电动玩具不能泡水，机器人就不会坏了。\n\n从那以后，正正对不了解的事情会先问大人:"这个能不能这样做呀？"而不是自己乱试。他也学会了爱护玩具——电动玩具不泡水、不摔打，玩完收好。\n\n正正明白了：好奇心是好的，但不能盲目乱试。有些东西有它的使用方法，用错了就会损坏。遇到不了解的事情，先想一想、问一问大人，弄清楚了再做。这样既能满足好奇心，又不会造成损失。爱护自己的东西，也是一种好习惯。'
},
{
  id: 'zhengzheng_32',
  title: '【调皮鬼正正】第三十二集：不肯跟大家分享秋千',
  category: '成长',
  content: '学校新装了一个特别酷的旋转秋千，转起来又快又好玩。所有小朋友都想玩。\n\n正正抢先坐了上去，然后就赖着不下来。别人叫他，他装作没听见，一个人转个不停。\n\n"正正，让我们也玩玩嘛！""你已经玩很久了！"小朋友们都很着急。\n\n正正就是不下来："我还想玩，你们等着。"\n\n李老师说："正正，这么好玩的秋千，大家都想玩。你一个人占着不下来，别人一次都玩不到，多不公平。好东西要大家分享。"\n\n正正还是不情愿。李老师说："这样吧，我们定个规矩，每人转两分钟就换人，这样大家都能玩到。你要是一直占着，别人会不高兴，以后有好玩的也不带你了。"\n\n正正想了想，慢慢下来了。轮流玩以后，每个小朋友都玩到了旋转秋千，玩得可开心了。正正也在排队等待中，又玩了好几次。\n\n而且，因为正正肯分享了，小朋友们都愿意跟他一起玩，还夸他大方。\n\n正正发现，自己一个人占着秋千，虽然玩得多，但大家都不高兴，气氛很僵;轮流分享着玩，虽然每次玩的时间短一点，但大家有说有笑，开心多了，自己也玩到了好几次。\n\n正正明白了：再好玩的东西，也要跟大家分享。一个人独占，会让别人不高兴，自己也少了朋友;轮流分享，大家都能玩到，气氛还特别好。学会分享，收获的是快乐和友谊。独乐乐不如众乐乐。'
},
{
  id: 'zhengzheng_33',
  title: '【调皮鬼正正】第三十三集：把纸巾扔进马桶堵住了',
  category: '成长',
  content: '正正上厕所的时候，觉得往马桶里扔东西看它冲走很好玩。他扔了一大团纸巾，又扔了一些小纸片，还想把一个小玩具也冲下去。\n\n结果，马桶被大量的纸巾堵住了！水冲不下去，反而"哗哗"地往上涨，眼看要溢出来，弄得厕所地上都是水，又脏又臭。\n\n正正吓坏了，赶紧跑去找老师。\n\n李老师和保洁阿姨来疏通马桶，费了好大劲才通开。阿姨说："马桶只能冲少量的手纸，扔太多纸巾、扔玩具进去，就会堵住。堵了以后很难通，还弄得到处是脏水。"\n\n正正很不好意思——因为自己贪玩，把马桶堵了，还害得老师和阿姨辛苦疏通，弄得厕所又脏又臭。\n\n李老师说："正正，马桶不是用来玩的，也不能乱扔东西。用适量的手纸，扔进马桶冲掉就行。其他东西，尤其是玩具、大量纸巾，绝对不能扔进去，会堵住的。"\n\n正正认真地点头，还帮着阿姨一起把厕所地面清理干净。\n\n从那以后，正正上厕所规规矩矩的，只用适量手纸，绝不往马桶里乱扔东西。他还提醒别的小朋友:"别往马桶扔东西，会堵住的！"\n\n正正明白了：马桶不是玩具，不能往里乱扔东西。扔太多纸巾或玩具会堵塞马桶，弄得又脏又臭，还要麻烦别人来疏通。正确使用公共设施，爱护卫生环境，是文明的表现。'
},
{
  id: 'zhengzheng_34',
  title: '【调皮鬼正正】第三十四集：跟小朋友比谁的爸爸厉害',
  category: '成长',
  content: '课间，正正跟小朋友们聊起了爸爸。正正说:"我爸爸开大汽车，最厉害！"\n\n乐乐说:"我爸爸是医生，能治病，更厉害！"\n\n正正不服气:"我爸爸的汽车可大了，比你爸爸厉害！"\n\n两个人争起来，都说自己爸爸厉害，谁也不让谁，最后还吵红了脸，差点打起来。\n\n李老师走过来:"你们在争什么呀？"\n\n正正和乐乐都说:"我爸爸最厉害！"\n\n李老师笑了:"每个人的爸爸都有自己的本领，都很厉害呀。正正的爸爸开大汽车，运送货物，让大家能买到东西，很厉害;乐乐的爸爸是医生，能治病救人，也很厉害。他们做的工作不一样，但都很重要，没法比谁更厉害。"\n\n正正和乐乐都愣住了。\n\n李老师说："而且，比来比去有什么意义呢？爸爸厉不厉害，是爸爸的事。你们自己厉不厉害，才是最重要的。与其争爸爸，不如自己努力，将来做个有本领的人。"\n\n正正和乐乐都不好意思了。他们的爸爸做的工作不一样，但都是靠自己的本领工作、养家，都很了不起，确实没法比。\n\n正正说:"乐乐，对不起，我不该跟你争。你爸爸是医生，很厉害。"\n\n乐乐说:"你爸爸开大汽车，也很厉害。"\n\n两个人又和好了，还互相讲起了自己爸爸工作的有趣事情，聊得可开心了。\n\n正正明白了：每个人、每份工作都有自己的价值，不能互相攀比。爸爸做什么工作都值得尊敬，因为他们都在辛勤劳动。与其攀比家里的条件，不如自己努力上进。真正的厉害，是靠自己的本领和努力，而不是比来比去。攀比伤感情，努力才有意义。'
},
{
  id: 'zhengzheng_35',
  title: '【调皮鬼正正】第三十五集：把文具盒里的东西倒出来玩',
  category: '成长',
  content: '上课的时候，正正觉得无聊，就把文具盒里的东西全倒出来玩——铅笔、橡皮、尺子、卷笔刀，摆来摆去，还把铅笔当火箭发射。\n\n"嗖！铅笔火箭发射！"一支铅笔飞出去，差点扎到前面小朋友的后背。\n\n正正玩得起劲，根本没听老师讲课。等老师提问，正正答不上来;老师让做练习，正正因为没听讲不会做，还把文具弄得掉了一地，捡了半天。\n\n李老师说："正正，上课要专心听讲，文具是用来学习的，不是用来玩的。你把文具倒出来玩，既没学到东西，还差点用铅笔伤到同学，铅笔飞出去多危险。"\n\n正正想起铅笔差点扎到同学，有点后怕——铅笔尖尖的，要是扎到人就麻烦了。\n\n李老师说："上课的时候，文具盒里的东西该用的时候拿出来用，不用的时候放好，不能当玩具玩。尤其铅笔、尺子这些有尖有棱的，玩起来很危险。"\n\n正正把文具收拾好，认真听起了课。这次他跟上了老师的讲解，练习也会做了。\n\n正正发现，专心听课，不但学到了东西，还不会像刚才那样手忙脚乱、被老师批评。\n\n正正明白了：上课要专心，文具是学习工具，不是玩具。上课玩文具，既耽误学习，又可能因为铅笔、尺子这些尖锐的东西伤到人。什么时间做什么事——上课就专心听讲，把文具用在学习上。专心的孩子才能学得好。'
},
{
  id: 'zhengzheng_36',
  title: '【调皮鬼正正】第三十六集：抢着表演不给别人机会',
  category: '成长',
  content: '幼儿园要排练节目，需要几个小朋友上台表演。李老师问:"谁想表演呀？"\n\n正正抢着举手:"我我我！我要演！"不但抢主角，还想把好几个角色都演了。\n\n"这个角色我演！那个也我演！"正正什么都想演，不给别的小朋友机会。\n\n别的小朋友也想表演，可是都被正正抢了。大家都很失落。\n\n李老师说："正正，表演是大家的事，要让每个想表演的小朋友都有机会。你一个人演好几个角色，别人就没机会了。而且一个人也演不好那么多角色呀。"\n\n正正说:"可是我想多演一点……"\n\n李老师说:"节目是大家合作完成的。你演一个角色，乐乐演一个，朵朵演一个，大家配合起来，才是一台好节目。都让你一个人演，别人不开心，节目也演不好。"\n\n正正想了想，觉得老师说得对。他把角色让了出来:"那……我演一个角色就好，其他的给大家演。"\n\n于是，正正演一个角色，其他小朋友各演一个。大家一起排练、一起配合，节目排得特别好。\n\n演出那天，每个小朋友都上台表演了，都很开心。节目获得了热烈的掌声。正正发现，跟大家一起合作表演，比自己一个人演好几个角色有意思多了，效果也好多了。\n\n正正明白了：好机会要跟大家分享，不能一个人独占。表演、发言、展示这些机会，要让每个想参与的人都有份。一个人独占所有角色，既不公平，也做不好;大家分工合作，各展所长，才能成就精彩。学会分享机会，成全别人，也成就集体。'
},
{
  id: 'zhengzheng_37',
  title: '【调皮鬼正正】第三十七集：把口香糖粘在椅子上',
  category: '成长',
  content: '正正嚼完口香糖，不知道该吐哪里，就随手把口香糖粘在了椅子底下。后来他又觉得好玩，故意把口香糖粘在了小美要坐的椅子面上。\n\n小美坐下去，站起来的时候——"呀！"裙子上粘了一大团口香糖，黏糊糊的，怎么也弄不下来，把新裙子弄脏了。\n\n小美又气又难过。李老师也很生气:"正正，口香糖粘在椅子上，粘到别人衣服上很难弄下来的。你把小美的裙子弄脏了。而且，嚼完的口香糖应该用纸包起来扔进垃圾桶，不能乱粘。"\n\n正正还没觉得严重。结果，他自己坐到别的椅子上时，也粘到了别人乱粘的口香糖，裤子上黏糊糊的一大团，怎么擦都擦不掉，难受极了。\n\n"哎呀，我裤子上怎么有口香糖！好恶心！"正正皱着眉头。\n\n李老师说:"现在你知道被口香糖粘到的难受了吧？口香糖乱粘，是很没公德心的行为。粘在椅子上、地上、墙上，都很难清理，还会弄脏别人的衣服。"\n\n正正很内疚，给小美道了歉，还帮忙一起想办法清理裙子上的口香糖（用冰块冻一下就好弄一些）。\n\n从那以后，正正嚼完口香糖，一定用纸巾包好，扔进垃圾桶，绝不乱粘。他还提醒别人:"口香糖不能乱粘，要包起来扔掉！"\n\n正正明白了：嚼完的口香糖要用纸包好扔进垃圾桶，绝不能乱粘在椅子、地上、墙上。乱粘口香糖很难清理，还会弄脏别人的衣物，是很没公德心的行为。爱护公共环境、为别人着想，从正确处理口香糖这样的小事做起。'
},
{
  id: 'zhengzheng_38',
  title: '【调皮鬼正正】第三十八集：故意不接老师的话',
  category: '成长',
  content: '李老师问正正:"正正，昨天教的儿歌你会背了吗？"\n\n正正明明会，却故意不理老师，装作没听见，扭过头去玩自己的。\n\n李老师又问了一遍，正正还是不搭理，觉得这样"很酷"。\n\n李老师有点难过:"正正，老师问你话，你应该回答。不理睬别人，是很不礼貌的。"\n\n正正还是不吭声。\n\n结果，轮到正正想问老师问题的时候——"李老师，这个怎么做呀？"李老师正在忙，没有马上回答他。正正又问了一遍，老师还是在忙别的。\n\n正正急了:"老师，你怎么不理我呀！"\n\n李老师这才说:"正正，被人不理睬的感觉不好受吧？刚才老师问你话，你也不理老师呀。你不理别人，别人也会不理你。"\n\n正正愣住了。原来被人忽视是这种感觉——又着急又难过，觉得不被尊重。而自己刚才就是这样对老师的。\n\n正正不好意思地说:"对不起老师，刚才我不该不理您。"\n\n李老师笑了:"没关系，知道了就好。别人跟你说话，要认真回应，这是最基本的礼貌。"\n\n从那以后，正正不管是老师、同学还是家人跟他说话，他都会认真回应，不再故意不理睬别人了。\n\n正正明白了：别人跟你说话，要认真回应，这是基本的礼貌和尊重。故意不理睬别人，会让别人感到被忽视、不被尊重，很难过。而且，你不理别人，别人也会不理你。用礼貌和真诚回应别人，才能得到别人的尊重和善待。'
},
{
  id: 'zhengzheng_39',
  title: '【调皮鬼正正】第三十九集：把别人的鞋带解开',
  category: '成长',
  content: '正正又想恶作剧了。他趁小朋友们不注意，偷偷把好几个小朋友的鞋带解开，想看他们摔跤的样子。\n\n结果，乐乐走路的时候踩到了松开的鞋带，"扑通"摔了一跤，膝盖磕破了。壮壮也被松开的鞋带绊了一下，差点摔倒。\n\n看到有人摔伤，正正有点慌了。李老师问清楚是正正解的鞋带，非常严肃:"正正，解开别人的鞋带，会让人踩到鞋带摔跤，很危险！乐乐都摔破膝盖了。这不是恶作剧，是害人。"\n\n正正看着乐乐摔破的膝盖，很后悔。他没想到解鞋带会害人摔伤。\n\n李老师说:"鞋带松了会绊倒人，摔跤轻则擦破皮，重则摔伤骨头、磕到头。你故意解开别人鞋带，就是制造危险。"\n\n结果没过一会儿，正正自己的鞋带也不知被谁解开了，他没注意，一脚踩上去，"哎哟"摔了一跤，膝盖也破了，疼得直咧嘴。\n\n"原来踩到鞋带摔跤这么疼……"正正这才深切体会到。\n\n李老师说:"现在你知道了吧？解开别人鞋带，就是让人面临摔跤的危险。这种恶作剧太危险了。"\n\n正正给乐乐道了歉，还学会了主动帮小朋友:"你的鞋带松了，我帮你系上，小心别踩到摔跤。"\n\n从那以后，正正再也不解别人鞋带了，看到谁鞋带松了还会提醒或帮忙系好。\n\n正正明白了：解开别人的鞋带是很危险的恶作剧，会让人踩到鞋带摔伤。摔跤可能造成严重的伤害。不能拿别人的安全开玩笑。看到别人鞋带松了，应该提醒或帮忙系好，而不是故意制造危险。关心别人的安全，才是好孩子。'
},
{
  id: 'zhengzheng_40',
  title: '【调皮鬼正正】第四十集：不肯承认自己害怕',
  category: '成长',
  content: '幼儿园组织看一部有点吓人的动画片，里面有大怪兽。正正其实有点害怕，但他为了显得勇敢，装作一点都不怕，还嘲笑那些害怕的小朋友:"胆小鬼！这有什么好怕的！"\n\n晚上回到家，正正却做了噩梦，梦见大怪兽追他，吓得哭着醒来，还不敢一个人睡觉。\n\n妈妈问:"正正，你怎么了？"\n\n正正嘴硬:"没……没什么，我不害怕。"\n\n可是他紧紧抓着妈妈的手，不肯松开，眼睛里还有泪水。\n\n妈妈温柔地说:"正正，害怕不是丢人的事。每个人都会害怕一些东西，这很正常。承认害怕，说出来，反而没那么怕了。憋在心里，假装不怕，其实更难受。"\n\n正正终于说了实话:"妈妈，那个大怪兽好可怕……我其实很害怕，还做了噩梦……"\n\n妈妈抱住他:"说出来就好了。其实那个怪兽是假的，是动画片画出来的，现实中没有的。而且，就算害怕，我们也可以想办法——比如想想开心的事，或者告诉爸爸妈妈。"\n\n妈妈陪着正正，跟他聊开心的事，慢慢地，正正不那么怕了，安心地睡着了。\n\n第二天，正正想起自己还嘲笑过害怕的小朋友，很惭愧——其实自己也害怕，只是装作不怕罢了。\n\n正正跟那些小朋友道了歉:"对不起，我不该笑你们胆小。其实我也害怕那个怪兽，昨晚还做噩梦了。"\n\n大家发现原来正正也害怕，反而觉得亲切，一起聊起了怎么克服害怕。\n\n正正明白了：害怕不是丢人的事，每个人都会害怕。假装不害怕、还嘲笑别人，是不对的，而且憋着更难受。承认自己的害怕，说出来，找大人帮忙，反而能更快克服恐惧。诚实面对自己的感受，才是真正的勇敢。'
},

  category: '成长',
  content: '美术课上，正正拿着画笔，觉得在纸上画不过瘾，就想在同学脸上画。他趁乐乐不注意，在乐乐脸上画了一道红、一道绿。\n\n"哈哈，乐乐变成大花猫了！"正正大笑。\n\n乐乐脸上被画得乱七八糟，怎么擦都擦不干净，因为是水彩颜料。而且颜料弄到了乐乐的眼睛旁边，眼睛有点刺痛，乐乐难受得直流泪。\n\n李老师赶紧带乐乐去洗脸，可是颜料还是留下了印子。而且颜料进了眼睛附近，万一进到眼睛里就危险了。\n\n李老师严肃地说:"正正，颜料是画在纸上的，不能画到人脸上！脸上的皮肤很嫩，颜料弄上去很难洗，弄到眼睛里还会伤眼睛，很危险。"\n\n正正看着乐乐脸上洗不掉的颜料印和刺痛流泪的眼睛，很后悔。\n\n李老师说:"而且，在别人脸上乱画，是很不尊重人的行为。乐乐现在脸上花花的，多难为情。"\n\n正正给乐乐道了歉，还帮乐乐一起洗脸。幸好颜料没进到眼睛里，乐乐的眼睛慢慢不疼了。\n\n从那以后，正正画画只画在纸上，绝不往人脸上、身上画。他明白了，脸上尤其是眼睛附近，绝对不能乱涂东西。\n\n正正明白了：颜料要画在纸上，绝不能画到人的脸上、身上。脸部皮肤娇嫩，颜料难清洗，弄到眼睛里还会伤害眼睛，非常危险。在别人身上乱画也很不尊重人。画画有画画的地方，尊重别人的身体，注意用品安全，才是懂事的好孩子。'
},
{
  id: 'zhengzheng_42',
  title: '【调皮鬼正正】第四十二集：不肯跟同学道谢',
  category: '成长',
  content: '正正的水彩笔掉在了地上，滚得到处都是。朵朵看到了，主动帮正正把笔一支一支捡起来，还给了他。\n\n可是正正接过笔，一句谢谢都没说，转身就走了。\n\n朵朵有点失落——她好心帮忙，正正却连声谢谢都没有。\n\n后来，正正的书本掉了，他想让朵朵帮忙捡。朵朵却说:"上次我帮你捡笔，你都没说谢谢。这次你自己捡吧。"\n\n正正愣住了。他这才想起，上次朵朵帮他捡笔，他确实没道谢。\n\n李老师说:"正正，别人帮了你，要说声谢谢。这是最基本的礼貌，也是对别人好意的回应。你不道谢，别人会觉得你不领情，以后就不愿意帮你了。"\n\n正正明白了。他走到朵朵面前:"朵朵，对不起，上次你帮我捡笔，我忘了说谢谢。谢谢你！"\n\n朵朵笑了:"没关系，这次我帮你捡书。"\n\n正正连忙说:"谢谢你，朵朵！"\n\n朵朵开开心心地帮正正捡起了书。\n\n从那以后，正正记住了:别人帮忙,一定要说谢谢。不管是老师、同学还是家人，只要帮了他,他都会真诚地道谢。\n\n正正发现，说了谢谢以后，别人都很开心，也更愿意帮助他了。一句简单的"谢谢",让大家的关系更融洽了。\n\n正正明白了：别人帮助了你，一定要真诚地说声"谢谢"。道谢是最基本的礼貌，是对别人善意的回应和尊重。不道谢，会让帮助你的人寒心，以后不愿再帮你。懂得感恩、常说谢谢的人，会得到更多的帮助和喜爱。'
},
{
  id: 'zhengzheng_43',
  title: '【调皮鬼正正】第四十三集：把午餐倒掉不吃',
  category: '成长',
  content: '今天午餐有正正不太爱吃的青菜和豆腐。正正不想吃，趁老师不注意，把大半碗饭菜偷偷倒进了垃圾桶。\n\n"倒掉就不用吃了。"正正觉得很聪明。\n\n可是，倒掉饭菜以后，正正下午就饿了。别的小朋友都吃得饱饱的，精力充沛地玩游戏，正正却饿得没力气，蔫蔫的。\n\n而且，李老师发现垃圾桶里有大半碗倒掉的饭菜:"是谁把饭菜倒掉了？"\n\n正正低着头承认了。李老师说:"正正，饭菜是农民伯伯和厨房阿姨辛苦种出来、做出来的。你倒掉这么多，太浪费了。而且你不吃饭，下午就没力气、没营养，对身体不好。"\n\n正正饿着肚子，很后悔。要是刚才把饭吃了，现在就不会饿了。\n\n李老师说:"不爱吃的菜，可以少吃一点，但不能倒掉浪费。青菜、豆腐都很有营养，能让你长高长壮。挑食、浪费都是不好的习惯。"\n\n正正想起了"粒粒皆辛苦",也想起饿肚子的难受，决定改。\n\n第二天午餐，虽然还是有不爱吃的菜，正正还是把饭菜都吃了。他发现青菜豆腐其实也没那么难吃，吃饱了下午特别有精神。\n\n从那以后，正正不再倒饭菜了。他能吃多少盛多少，盛了就吃完，不挑食、不浪费。\n\n正正明白了：饭菜是农民伯伯和厨房阿姨辛苦得来的，不能倒掉浪费。不爱吃的菜可以少盛，但要吃完，不能挑食。而且，好好吃饭才有营养、有力气、身体棒。珍惜粮食、不挑食不浪费，是对劳动的尊重，也是对自己身体的负责。'
},
{
  id: 'zhengzheng_44',
  title: '【调皮鬼正正】第四十四集：故意把玩具弄得很响',
  category: '成长',
  content: '午睡时间，大家都睡着了。正正睡不着，就拿出一个会发声的玩具，故意按得"哔哔哔""嘀嘀嘀"响个不停。\n\n响亮的玩具声把好几个小朋友吵醒了。有的揉着眼睛，有的皱着眉头，都睡不好了。\n\n李老师轻轻走过来，把玩具收走了:"正正，午睡的时候要保持安静，让大家休息。你把玩具弄得这么响，把大家都吵醒了，下午大家就没精神了。"\n\n正正小声说:"我睡不着嘛。"\n\n李老师说:"睡不着可以安静地躺着，闭上眼睛休息。但不能发出声音吵醒别人。每个人都需要安静的休息环境。"\n\n下午，那些被吵醒的小朋友都没睡好，做游戏的时候没精神，蔫蔫的。因为正正吵闹，大家下午都受影响。\n\n正正有点内疚。他想，如果自己午睡的时候被别人用玩具吵醒，肯定也会很难受。\n\n李老师说:"在需要安静的时候——比如午睡、上课、别人休息的时候，就要保持安静。这是对别人的尊重。"\n\n第二天午睡，正正就算睡不着，也安安静静地躺着，不发出一点声音。慢慢地，他自己也睡着了。下午起来，大家都精神饱满，一起玩得很开心。\n\n正正明白了：在需要安静的场合，一定要保持安静，不能发出噪音打扰别人。别人休息、学习的时候，安静是最基本的尊重。自己睡不着可以安静地待着，但绝不能影响别人。懂得为别人考虑，在该安静的时候安静，是有教养的表现。'
},
{
  id: 'zhengzheng_45',
  title: '【调皮鬼正正】第四十五集：把别人辛苦搭的沙堡踩坏',
  category: '成长',
  content: '玩沙子的时候，朵朵和美美一起堆了一座漂亮的沙堡，有城墙、有塔楼，还插了小旗子，堆了好久好久。\n\n正正跑过来，看到漂亮的沙堡，也不知怎么想的，一脚就踩了上去，把沙堡踩塌了。\n\n"啊！我们的沙堡！"朵朵和美美心疼得快哭了。堆了那么久的沙堡，一下子就没了。\n\n正正还嘻嘻笑:"塌了塌了！"\n\n李老师走过来:"正正，朵朵和美美堆了那么久的沙堡，你一脚就踩坏了，她们多伤心。别人辛苦做的东西，怎么能随便破坏呢？"\n\n正正看着两个女孩难过的样子，笑不出来了。\n\n李老师说:"如果你辛辛苦苦堆了个沙堡，被别人一脚踩坏，你什么感觉？"\n\n正正想了想，肯定会很生气很难过。\n\n"对呀，所以不能破坏别人的劳动成果。"李老师说，"你应该欣赏、保护，或者一起玩，而不是破坏。"\n\n正正很后悔:"对不起，我陪你们重新堆一个好不好？我保证堆得更漂亮！"\n\n正正陪着朵朵和美美，一起重新堆沙堡。他还想出了新主意，堆了护城河、拱桥。三个人合作，堆了一座更大更漂亮的沙堡。\n\n朵朵和美美看到新沙堡，又开心起来，原谅了正正。三个人一起给沙堡插上小旗子，玩得可高兴了。\n\n正正明白了：别人辛辛苦苦做的东西，绝不能随便破坏。破坏别人的劳动成果，会让人非常伤心。看到别人的作品，应该欣赏、保护，或者一起参与。如果不小心弄坏了，要真诚道歉并帮忙重建。尊重和爱护别人的劳动，是善良和教养的体现。'
},
{
  id: 'zhengzheng_46',
  title: '【调皮鬼正正】第四十六集：不肯排队洗手挤来挤去',
  category: '成长',
  content: '吃饭前要洗手，小朋友们在水池前排队。正正不排队，挤到最前面，还把别人挤到一边，抢着用水龙头。\n\n"我先洗！"正正一挤，把小美挤得撞到了水池边，胳膊都撞疼了。而且他这么一挤，队伍全乱了，大家你挤我我挤你，水溅得到处都是，地上湿滑滑的。\n\n李老师说:"正正，洗手也要排队。你挤来挤去，撞疼了小美，还把地上弄得湿滑滑的，容易滑倒。大家排好队，一个一个洗，又安全又有秩序。"\n\n正正说:"我想快点洗完去吃饭。"\n\n李老师说:"你挤来挤去，反而更慢更乱。大家排好队，其实很快就轮到了。而且地上溅了水，很容易滑倒摔伤。"\n\n正正重新排到队伍里。因为大家排好了队，一个一个很快就洗完了，正正也顺利洗了手。地上也没有溅那么多水了。\n\n正正发现，排队洗手，秩序井然，反而更快更安全;挤来挤去，又危险又混乱，还撞疼了同学。\n\n正正给小美道了歉:"对不起，刚才挤到你了。"\n\n从那以后，正正洗手都乖乖排队，不再挤来挤去。\n\n正正明白了：洗手也要排队，不能挤来挤去。挤挤撞撞既会撞伤同学，又会把地面弄湿滑，容易滑倒。排好队一个一个来，安全又高效。任何时候都要讲秩序，为别人和自己的安全着想。文明排队，人人受益。'
},
{
  id: 'zhengzheng_47',
  title: '【调皮鬼正正】第四十七集：把玩具借了不还给主人',
  category: '成长',
  content: '壮壮带了一个很酷的变形金刚到幼儿园。正正很喜欢，跟壮壮借:"借我玩玩吧！"\n\n壮壮说:"好，玩一会儿要还给我哦。"\n\n正正玩上了瘾，一直玩一直玩，壮壮来要，他就说"再玩一会儿""马上还",可就是不还。\n\n到了放学，正正居然把变形金刚放进了自己书包，想带回家继续玩。\n\n壮壮找不到变形金刚，急哭了:"我的变形金刚呢？那是我最喜欢的玩具！"\n\n李老师帮忙一起找，最后在正正书包里找到了。\n\n李老师说:"正正，借了别人的东西，玩完要及时还。你不但不还，还想带回家，这是不对的。壮壮多着急呀，那是他最喜欢的玩具。"\n\n正正不好意思地把变形金刚还给了壮壮:"对不起，我太喜欢了，就一直没还……"\n\n壮壮说:"借你玩可以，但要还给我呀。这是我的玩具。"\n\n李老师说:"借东西要讲信用，说好玩一会儿就还，就要按时还。你要是喜欢，可以请爸爸妈妈买一个，但不能把借来的东西占为己有。"\n\n正正认识到了错误。后来他请妈妈也给他买了一个变形金刚，特别开心。他也把自己的变形金刚借给壮壮玩，两个人一起玩，可高兴了。\n\n正正明白了：借别人的东西，玩完一定要及时归还，不能占为己有。借东西要讲信用，说好什么时候还就什么时候还。喜欢的东西可以通过正当方式得到，但不能贪心地把借来的东西留下。守信用、按时还东西，才能一直得到别人的信任和帮助。'
},
{
  id: 'zhengzheng_48',
  title: '【调皮鬼正正】第四十八集：故意在墙上乱画',
  category: '成长',
  content: '幼儿园的走廊墙上，刚刷了雪白的新墙，还贴了小朋友们的画。\n\n正正手里拿着蜡笔，觉得白墙太空了，就在墙上乱涂乱画——画了歪歪扭扭的线条，还写了些乱七八糟的符号，把雪白的墙弄得脏兮兮的。\n\n"我把墙装饰得更好看了！"正正很得意。\n\n可是大家都觉得墙被弄脏了，很难看。而且这是刚刷的新墙，被正正一画，印子很难擦掉。\n\n李老师说:"正正，墙是大家的，刚刷得白白的，多干净。你在上面乱画，弄得脏兮兮的，还擦不掉。这是破坏公共环境。"\n\n正正想擦掉，可是蜡笔画在墙上，怎么擦都擦不干净，留下了难看的印子。\n\n李老师说:"想画画，有画纸、有画本，为什么要画在墙上呢？墙上乱画，破坏了公共环境，大家看着都不舒服，清理起来也很费劲。"\n\n最后，学校只好又请人重新粉刷了那面墙，花了不少钱和工夫。正正知道后很内疚。\n\n从那以后，正正只在画纸、画本上画画，绝不在墙上乱涂。他还会提醒别人:"别在墙上画，擦不掉的，破坏公共环境。"\n\n正正明白了：不能在墙上乱涂乱画。墙是公共的，乱画会破坏环境、影响美观，而且很难清理，还要花钱重新粉刷。想画画，就画在画纸、画本上。爱护公共环境、公共设施，是每个人的责任。保持环境整洁，大家才能有一个舒适美好的地方。'
},
{
  id: 'zhengzheng_49',
  title: '【调皮鬼正正】第四十九集：抢玩具把同学弄哭',
  category: '成长',
  content: '小美正在玩一个漂亮的小娃娃，梳着娃娃的头发，给娃娃穿衣服，玩得很开心。\n\n正正走过来，一把就把娃娃抢走了:"我要玩！"\n\n小美吓了一跳，想要回娃娃:"这是我先玩的！还给我！"\n\n正正不给，还把小美推开了。小美摔坐在地上，"哇"地哭了。\n\n李老师赶紧过来，扶起小美，对正正说:"正正，小美正玩着娃娃呢，你不能抢。想玩应该等她玩完，或者礼貌地问\'可以一起玩吗\'。你抢玩具还推倒了小美，太不应该了。"\n\n正正还嘴硬:"我就想玩嘛。"\n\n李老师说:"那如果你正玩着玩具，别人一把抢走还推倒你，你什么感觉？"\n\n正正想了想，肯定又疼又气又难过。\n\n李老师说:"己所不欲，勿施于人。自己不喜欢被抢、被推，就不要这样对别人。想玩别人的玩具，要好好商量，不能抢。"\n\n正正看着哭泣的小美，惭愧地低下了头:"对不起小美，我不该抢你的娃娃，还推倒你。"\n\n小美擦擦眼泪:"你要玩可以跟我说呀，我们可以一起玩。"\n\n正正说:"那……我们能一起玩吗？"\n\n小美点点头。两个人一起给娃娃梳头、穿衣服，玩得可开心了。\n\n正正发现，一起玩比抢来玩有意思多了，还多了个朋友。\n\n正正明白了：不能抢别人正在玩的玩具，更不能推人。想玩，要礼貌地商量"可以一起玩吗"或者等别人玩完。己所不欲，勿施于人——自己不喜欢被抢被推，就不要这样对待别人。友好商量、一起分享，才能玩得开心、交到朋友。'
},
{
  id: 'zhengzheng_50',
  title: '【调皮鬼正正】第五十集：不肯听完别人说话',
  category: '成长',
  content: '乐乐想跟正正讲一件有趣的事:"正正，昨天我去动物园，看到了——"\n\n话还没说完，正正就打断:"我知道我知道，肯定是大象！"然后自顾自地说起了别的。\n\n乐乐还想说，正正又打断:"行了行了，没意思。"转身就走了。\n\n乐乐很失落——他想分享的开心事，还没说完就被正正打断、否定了。\n\n后来，正正想跟乐乐说一件事，乐乐却说:"你说吧，反正你也不听我说完。"然后不太想理正正。\n\n正正愣住了。他这才意识到，自己总是打断别人、不听别人说完，让别人很不舒服。\n\n李老师说:"正正，别人说话要听完，不能随便打断。打断别人、不听别人说完，是很不礼貌的，会让人觉得不被尊重。而且，你不听别人说，别人也不想听你说了。"\n\n正正明白了。他找到乐乐:"对不起，之前我总打断你。你昨天在动物园看到了什么呀？这次我认真听你说完。"\n\n乐乐高兴起来，把在动物园看到的长颈鹿、企鹅、还有小猴子的趣事都讲给正正听。正正认真地听着，还不时问"然后呢",两个人聊得可开心了。\n\n正正发现，认真听别人把话说完，不但是礼貌，还能听到好多有趣的事。\n\n正正明白了：别人说话要耐心听完，不能随便打断、否定。打断别人是不礼貌的，会让人觉得不被尊重。认真倾听，既是对别人的尊重，也能让自己听到更多、了解更多。学会倾听，是良好沟通和友谊的基础。你认真听别人，别人才会认真听你。'
},
{
  id: 'zhengzheng_51',
  title: '【调皮鬼正正】第五十一集：把小石子扔向小朋友',
  category: '成长',
  content: '在操场玩的时候，正正捡起地上的小石子，觉得扔石子很好玩，就朝小朋友们扔。\n\n"看我扔！"石子飞出去，打在小朋友身上。有一颗石子飞得高，差点打到乐乐的眼睛，还有一颗打到了朵朵的头，起了个小包。\n\n朵朵疼得哭了，乐乐也吓了一跳。\n\n李老师非常严肃:"正正！石子怎么能往人身上扔！石子又硬又尖，打到人会受伤的，尤其是打到眼睛、脑袋，非常危险！"\n\n正正看到朵朵头上的包，也吓了一跳，没想到石子会打伤人。\n\n李老师说:"扔石子是绝对禁止的危险行为。石子打到眼睛，可能会失明;打到脑袋，可能会造成严重的伤害。你差点打到乐乐的眼睛，多危险！"\n\n正正很害怕也很后悔:"对不起，我不知道这么危险……"\n\n李老师给大家强调安全:"任何硬的东西——石子、木棍、玩具，都不能往人身上扔，尤其不能扔向头和眼睛。这些行为会造成严重伤害，绝对不能做。"\n\n正正给朵朵道了歉，还帮她揉了揉头上的包。幸好朵朵没有大碍，乐乐的眼睛也没事，正正松了一口气。\n\n从那以后，正正再也不扔石子了，看到别人扔还会制止:"不能扔石子，会打伤人的，很危险！"\n\n正正明白了：绝对不能往人身上扔石子或任何硬的东西。石子打到人会造成严重伤害，打到眼睛可能失明，打到头部非常危险。这是关系到安全和生命的大事，绝不能拿来玩。爱护同学、注意安全，永远是第一位的。'
},
{
  id: 'zhengzheng_52',
  title: '【调皮鬼正正】第五十二集：不肯跟同学分享秘密基地',
  category: '成长',
  content: '正正在幼儿园花园的角落发现了一个隐蔽的小空间，藏在灌木后面，像一个秘密基地。他特别喜欢，把它当成了自己一个人的地盘。\n\n小朋友们发现了这个好地方，也想来玩。正正却把大家赶走:"这是我一个人的秘密基地！谁也不许来！"\n\n他一个人守着秘密基地，不让别人靠近。可是一个人在里面，玩什么都没意思，孤零零的。\n\n而别的小朋友们只好去别处玩，他们一起玩过家家、玩探险游戏，玩得可热闹了，笑声传得老远。\n\n正正一个人待在秘密基地里，听着别人的笑声，越来越觉得没劲。守着一个地盘有什么用呢，一个人玩多没意思。\n\n慧慧路过，看到正正一个人闷闷不乐，说:"正正，一个人守着秘密基地，开心吗？"\n\n正正摇摇头。\n\n慧慧说:"如果把秘密基地分享给大家，大家一起在这里玩探险、玩过家家，不是更好玩吗？好地方跟朋友一起玩，才有意思呀。"\n\n正正想了想，觉得有道理。他跑出去对小朋友们说:"我发现了一个秘密基地，你们要不要一起来玩？"\n\n小朋友们高兴地跟着正正来到秘密基地。大家在里面玩探险、藏宝藏、过家家，玩得可开心了。有了大家，秘密基地一下子热闹起来，比正正一个人待着有意思一百倍。\n\n正正明白了：好地方、好东西，一个人独占没意思，跟大家分享才快乐。独自守着一个"地盘",只会孤单;跟朋友一起分享，才能收获欢乐和友谊。分享让快乐加倍。跟大家在一起的热闹和开心，是一个人独占永远得不到的。'
},
{
  id: 'zhengzheng_53',
  title: '【调皮鬼正正】第五十三集：把废纸扔得到处都是',
  category: '成长',
  content: '做手工剪纸的时候，会产生很多纸屑和废纸。正正剪下来的纸屑，随手就往地上一扔，桌上、地上、椅子上到处都是他扔的碎纸。\n\n别的小朋友把废纸收集起来放进垃圾桶，只有正正扔得到处都是。他的座位周围像下了一场"纸屑雪",脏乱极了。\n\n李老师说:"正正，剪纸的废纸屑要收集起来扔进垃圾桶，不能乱扔。你看你周围，纸屑撒了一地，多乱呀。"\n\n正正满不在乎:"反正等会儿有人扫。"\n\n李老师说:"教室是大家的，保持整洁是每个人的责任，不能什么都指望别人。而且，你扔得到处都是，别人走过来会踩到、滑到,清理起来也很费劲。"\n\n到了打扫时间，正正周围的纸屑最多，扫也扫不完。李老师说:"正正，你自己扔的纸屑，自己收拾干净。"\n\n正正只好蹲在地上，一点一点地把纸屑捡起来，捡了好久好久，腰都酸了。\n\n"原来收拾这么多纸屑这么累……"正正后悔当初随手乱扔。\n\n李老师说:"如果剪纸的时候就把废纸放在一个盒子里，最后一起倒掉，就不会撒得到处都是，也不用这么辛苦地捡了。"\n\n从那以后，正正剪纸的时候，会在旁边放一个小盒子，把纸屑随时收进去，最后一起倒进垃圾桶。他的座位周围再也不脏乱了。\n\n正正明白了：垃圾、废纸要及时收集、扔进垃圾桶，不能乱扔。保持整洁是每个人的责任，不能指望别人。乱扔垃圾不但让环境脏乱、影响别人，最后还是要自己辛苦收拾。养成随手收拾、爱护环境的好习惯，生活才干净整洁、舒心愉快。'
},
{
  id: 'zhengzheng_54',
  title: '【调皮鬼正正】第五十四集：不肯轮流玩滑板车',
  category: '成长',
  content: '幼儿园有一辆滑板车，大家都想玩。老师说好每人玩三圈就换人。\n\n正正玩上了滑板车，玩了三圈不下来，五圈、八圈还在玩，就是不肯让给别人。\n\n"正正，该换人啦！你玩很久了！"排队的小朋友都在喊。\n\n正正装没听见，继续滑:"我还想玩！"\n\n李老师说:"正正，说好每人三圈的。你玩这么久不换，别人都玩不到，这样不守规矩，也不公平。"\n\n正正还是赖着不下来。结果，其他小朋友都很生气，说:"正正不守规矩，我们不跟他玩了！"大家都不理正正了。\n\n正正玩够了滑板车下来，想找小朋友玩，可是没人理他。他一个人孤零零的，这才觉得不好受。\n\n李老师说:"正正，你不守规矩、独占滑板车，大家都不高兴，所以不愿意跟你玩了。守规矩、懂分享，才能有朋友。"\n\n正正明白了自己错在哪里。他把滑板车让了出来:"对不起，我玩太久了。你们玩吧，以后我玩三圈就换。"\n\n小朋友们看正正认识到了错误，也就原谅了他。轮流玩滑板车，每人三圈，大家都玩到了，玩得可开心了。正正也在排队中又玩了好几次。\n\n正正明白了：玩公共的东西要守规矩、按约定轮流，不能独占。说好每人玩多久，就玩多久，到时间要让给别人。不守规矩、独占玩具，会让大家反感，失去朋友。守规矩、懂分享、讲信用，才能和大家愉快相处，也能玩得更尽兴。'
},
{
  id: 'zhengzheng_55',
  title: '【调皮鬼正正】第五十五集：把画笔咬在嘴里',
  category: '成长',
  content: '画画的时候，正正有个坏习惯——喜欢把画笔含在嘴里咬。想事情的时候咬，换颜色的时候也咬。\n\n画笔上有颜料，还有好多细菌。正正咬来咬去，把颜料吃进了嘴里，还把笔头咬坏了。\n\n李老师看到了:"正正，画笔不能咬。笔上有颜料和细菌，咬进嘴里会生病，还会把笔咬坏。"\n\n正正不在意，还是咬。结果，当天晚上，正正的肚子疼了起来——原来是把画笔上的颜料和细菌吃进了肚子。\n\n妈妈带他去看医生。医生说:"是吃了不干净的东西。以后不能咬画笔、咬手指、咬玩具这些不干净的东西。"\n\n正正喝了苦苦的药，肚子才慢慢不疼了。他很后悔，因为咬画笔害得自己肚子疼、吃苦药。\n\n李老师说:"正正，很多东西都不能放进嘴里咬——画笔、铅笔、手指、玩具。它们上面有细菌和脏东西，咬了会生病。而且咬笔、咬手指也是不好的习惯，会把牙齿弄坏、把手指咬伤。"\n\n正正认真地记住了。他改掉了咬画笔的习惯。想事情的时候，他就把笔放下,用脑子想;换颜色的时候，把笔好好拿着。\n\n慢慢地，正正不再咬东西了，肚子也没再疼过。\n\n正正明白了：不能把画笔、铅笔、手指、玩具等东西放进嘴里咬。这些东西上有细菌和脏东西，咬了会生病、闹肚子，还会损坏牙齿和物品。改掉咬东西的坏习惯，注意口腔卫生，才能健健康康。养成良好的卫生习惯，是对自己身体的爱护。'
},
{
  id: 'zhengzheng_56',
  title: '【调皮鬼正正】第五十六集：故意推倒垃圾桶找东西',
  category: '成长',
  content: '正正的一张贴纸不见了，他怀疑掉进了垃圾桶。于是他直接把垃圾桶推倒，把里面的垃圾全倒出来找。\n\n垃圾撒了一地——脏纸巾、果皮、废纸，又脏又臭。正正在垃圾堆里翻来翻去找贴纸，弄得满手都是脏东西。\n\n而且，他找完也不收拾，就把撒了一地的垃圾丢在那里跑了。\n\n李老师看到了:"正正，就算东西掉进了垃圾桶，也不能把垃圾全倒出来乱翻。你看，垃圾撒了一地，又脏又臭，还弄脏了你的手，多不卫生。"\n\n正正说:"可是我的贴纸掉进去了……"\n\n李老师说:"如果真的有东西掉进垃圾桶，可以找老师帮忙，戴上手套小心地找，找完把垃圾收拾好。而不是把垃圾桶推倒、垃圾乱撒、找完不管。而且一张贴纸，掉了就掉了，不值得翻脏垃圾、弄脏自己。"\n\n正正看着满地的脏垃圾和自己脏兮兮的手，很后悔。\n\n李老师让正正戴上手套，把撒了一地的垃圾重新收拾进垃圾桶，还把地面清理干净。正正收拾了好久，又脏又累。\n\n而且，翻了半天，那张贴纸根本不在垃圾桶里——原来是掉在了自己的书包里。正正白白弄脏了一地，还弄脏了手。\n\n正正明白了：不能把垃圾桶推倒乱翻。就算有东西掉进去，也要找大人帮忙、小心处理，找完收拾干净。垃圾又脏又不卫生，为了一件小东西翻脏垃圾、弄脏环境和自己，很不值得。爱护环境卫生，遇事冷静处理，不要冲动地制造更大的麻烦。'
},
{
  id: 'zhengzheng_57',
  title: '【调皮鬼正正】第五十七集：把同学的帽子扔来扔去',
  category: '成长',
  content: '乐乐戴了一顶新帽子，很喜欢。正正一把抢过帽子:"给我看看！"然后跟另一个小朋友玩起了"扔帽子"游戏，把乐乐的帽子扔来扔去。\n\n乐乐急得跳起来想抢回帽子:"还给我！那是我的新帽子！"可是正正他们把帽子扔得高高的，乐乐怎么也够不着。\n\n帽子被扔来扔去，掉在地上踩脏了，帽檐还被扯歪了。乐乐的新帽子被弄脏弄坏了，乐乐委屈地哭了。\n\n李老师说:"正正，抢别人的帽子扔来扔去，是很不好的行为。你看，乐乐的新帽子被弄脏弄坏了，他多伤心。而且这样戏弄别人，让乐乐又着急又难过。"\n\n正正看着乐乐哭泣的样子和被弄脏的帽子，惭愧了。\n\n李老师说:"别人的东西不能随便抢来玩，更不能扔来扔去戏弄人。你想看乐乐的帽子，可以礼貌地问\'能给我看看吗\',看完还给人家。而不是抢过来当球扔。"\n\n正正给乐乐道了歉:"对不起，我不该抢你的帽子扔着玩。"他还帮乐乐把帽子上的灰拍干净，把扯歪的帽檐弄好。\n\n乐乐虽然还是有点心疼帽子，但看正正真心道歉，也原谅了他。\n\n从那以后，正正不再抢别人的东西戏弄了。想看别人的东西，他会礼貌地问，看完好好归还。\n\n正正明白了：不能抢别人的东西扔来扔去戏弄人。这样既弄脏弄坏了别人的东西，又让人又急又难过，是很不友善的。想看别人的东西，要礼貌地征求同意，爱惜地看，然后归还。尊重别人的物品和感受，才是友善懂事的好孩子。'
},
{
  id: 'zhengzheng_58',
  title: '【调皮鬼正正】第五十八集：不肯安静排队做操',
  category: '成长',
  content: '做早操要先排队站好。别的小朋友都安安静静地排好队，只有正正在队伍里动来动去，还大声说话、推搡旁边的人，把队伍搞得乱七八糟。\n\n"正正，站好，别动！"李老师说。可正正还是不听，继续在队伍里捣乱，把整齐的队伍搞得东倒西歪。\n\n因为正正捣乱，全班的队伍都站不整齐，做操也没法开始。别的班都开始做操了，就正正这个班还乱哄哄的。\n\n李老师说:"正正，排队站好是为了整齐、有秩序。你一个人动来动去、大声说话、推搡别人，就把整个队伍搞乱了，全班都受影响。"\n\n正正满不在乎:"站队多没意思。"\n\n因为正正捣乱，全班的做操时间被耽误了，别的小朋友都很不满，觉得正正影响了大家。\n\n李老师说:"集体活动要守纪律。一个人不守纪律，就会影响整个集体。你想想，如果每个人都像你一样乱动、说话，那队伍不就乱成一团了吗？"\n\n正正看到别的小朋友都因为自己受影响、不高兴，有点惭愧。\n\n他站好了，不再乱动、不再说话。队伍一下子整齐了，做操也顺利开始了。\n\n正正发现，大家排着整整齐齐的队伍做操，特别精神、特别好看，比乱哄哄的样子好多了。\n\n正正明白了：集体活动要遵守纪律。排队要站好、安静、不推搡。一个人不守纪律，就会影响整个集体，耽误大家。守纪律、有秩序，集体才能整齐、高效地行动。每个人都是集体的一员，都要为集体的秩序出一份力。'
},
{

  category: '成长',
  content: '画画课上，洗笔的水盆里是脏兮兮的颜料水。正正端起水盆，觉得泼水很好玩，就把颜料水泼向了小朋友们。\n\n"哗！"脏脏的颜料水泼了乐乐和小美一身，衣服上全是五颜六色的脏水，还有几滴溅进了小美的眼睛里，小美疼得直揉眼睛。\n\n李老师赶紧带小美去冲洗眼睛，一边说:"正正！颜料水又脏又可能伤眼睛，怎么能泼向别人！小美的眼睛都进颜料水了，多危险！"\n\n正正被小美难受的样子吓到了，也意识到闯了大祸。\n\n李老师说:"泼水本来就不对，泼脏的颜料水更糟糕——弄脏了别人的衣服，还可能伤害眼睛。眼睛进了脏水，会发炎、会难受，严重的还会伤视力。"\n\n幸好冲洗及时，小美的眼睛没有大碍，但还是红了好一会儿。正正看着小美难受的样子，非常后悔。\n\n正正给乐乐和小美道了歉:"对不起，我不该泼颜料水，还溅到小美眼睛里……"\n\n李老师教育大家:"洗笔的脏水要小心处理，倒进指定的地方。绝不能泼向别人。任何水、尤其是脏水，都不能泼到别人身上、脸上、眼睛上。"\n\n从那以后，正正洗完笔，会小心地把脏水倒掉，绝不乱泼。他明白了眼睛的珍贵和脏水的危害。\n\n正正明白了：不能把水、尤其是脏的颜料水泼向别人。脏水弄脏别人衣服，溅进眼睛还会伤害眼睛，非常危险。眼睛是最宝贵、最脆弱的，一定要保护好。洗笔的脏水要妥善处理，绝不能拿来玩、泼向别人。注意安全卫生，爱护同学，才是好孩子。'
},
{
  id: 'zhengzheng_60',
  title: '【调皮鬼正正】第六十集：正正当上了小组长',
  category: '成长',
  content: '因为正正进步很大，变得友善、懂事、乐于助人，李老师决定让他当一次小组长，带领小组完成任务。\n\n以前的正正当组长只会瞎指挥。这次，正正想起了以前的教训，决定做一个好组长。\n\n小组任务是一起做一幅拼贴画。正正先跟组员们商量:"我们画什么好呢？大家出出主意。"\n\n乐乐说画海洋，朵朵说画森林，小美说画天空。正正没有独断，而是说:"要不我们画一幅\'美丽的大自然\',把海洋、森林、天空都画进去，每个人负责一部分，好不好？"\n\n大家都同意了。正正合理分工:"乐乐画海洋，朵朵画森林，小美画天空，我来把大家的画拼在一起。有困难我们互相帮忙。"\n\n做的过程中，朵朵的树画得不太好，正正没有嫌弃，而是鼓励她:"没关系，我帮你，我们一起画。"美美剪纸剪不好，正正也耐心帮忙。\n\n大家分工合作、互相帮助，把拼贴画做得特别漂亮——蓝色的海洋、绿色的森林、蓝天白云，拼在一起美极了。\n\n李老师看了，非常惊喜:"这幅画做得真好！正正，你这个组长当得真棒——会商量、会分工、会鼓励和帮助组员。大家配合得真好！"\n\n组员们也都说:"正正是个好组长，跟他一组真开心！"\n\n正正心里美滋滋的。他终于明白了当组长的真谛——不是发号施令、耍威风，而是团结大家、分工合作、互相帮助，一起把事情做好。\n\n正正明白了：当组长（领头人），不是为了指挥别人、显示威风，而是要团结大家、跟大家商量、合理分工、鼓励和帮助组员。以身作则、为大家服务，才能带领集体做好事情，也才能赢得大家的信任和喜爱。真正的领导力，是让每个人都发光发热。'
},
{
  id: 'zhengzheng_61',
  title: '【调皮鬼正正】第六十一集：不肯跟老师说实话',
  category: '成长',
  content: '正正把班里的图书弄破了，怕被批评，就把破了的书藏到了书架最里面，假装什么都没发生。\n\n李老师整理图书的时候，发现有一本书破了，问大家:"谁把这本书弄破了？"\n\n正正低着头，不敢承认。别的小朋友也都摇头。\n\n因为没人承认，李老师说:"那今天大家先不看图书了，等弄清楚是谁弄破的、以后怎么爱护图书，再看。"\n\n小朋友们都很失望，因为他们最喜欢看图书了。大家你看看我，我看看你，因为一个人不承认，全班都看不了书。\n\n正正心里很不好受。他看到大家失望的样子，越来越愧疚。\n\n最后，正正鼓起勇气站起来:"李老师，是我……我不小心把书弄破了，还藏了起来，没敢承认。对不起。"\n\n李老师走过来，温和地说:"正正，谢谢你终于说了实话。把书弄破是不小心，可以原谅。但是藏起来、不承认，让全班都看不了书，这样不对。诚实地承认错误，比什么都重要。"\n\n正正惭愧地说:"对不起，我不该藏起来、不说实话。"\n\n李老师说:"知错能改就是好孩子。我们一起把书修补好吧。"\n\n正正和李老师一起用胶带把破了的书小心地粘好、修补好。修好以后，大家又可以看图书了。\n\n正正发现，诚实地承认错误，虽然当时有点难为情，但心里踏实了，问题也解决了，大家也原谅了他。而藏着掖着、不说实话，只会让事情更糟，还连累大家。\n\n正正明白了：做错了事要诚实承认，不能隐瞒、逃避。隐瞒错误不但解决不了问题，还会连累别人、让自己一直不安。诚实地面对错误、承担责任、想办法弥补，才能真正解决问题，也才能赢得别人的原谅和信任。诚实，是最可贵的品质。'
},
{
  id: 'zhengzheng_62',
  title: '【调皮鬼正正】第六十二集：抢着玩不顾小同学',
  category: '成长',
  content: '幼儿园的中班和小班一起在操场玩。小班的弟弟妹妹们个子小、力气弱。\n\n玩滑梯的时候，正正不管小班的弟弟妹妹，横冲直撞地抢着玩，把一个小班的小弟弟撞倒了。小弟弟摔坐在地上，哇哇大哭。\n\n李老师说:"正正，小班的弟弟妹妹比你们小，你要让着他们、照顾他们，怎么能撞倒小弟弟呢？"\n\n正正说:"我就想快点玩嘛。"\n\n李老师说:"你是中班的大哥哥了，比小班的弟弟妹妹大。大的应该照顾小的、让着小的，而不是跟他们抢、撞倒他们。你看小弟弟摔哭了，多可怜。"\n\n正正看着哭泣的小弟弟，想起自己刚上幼儿园、还是小班的时候，也是又小又胆怯，多希望大哥哥大姐姐照顾呀。\n\n正正惭愧地把小弟弟扶起来:"小弟弟，对不起，哥哥不是故意撞你的。不哭了，哥哥带你玩滑梯好不好？"\n\n正正牵着小弟弟的手，让小弟弟先玩，还在滑梯下面接住他，保护他的安全。小弟弟不哭了，玩得可开心了，还甜甜地叫正正"哥哥"。\n\n正正心里暖暖的。照顾比自己小的弟弟妹妹，原来这么有成就感。\n\n李老师表扬正正:"正正现在会照顾小弟弟了，真是个好哥哥！"\n\n从那以后，正正跟小班的弟弟妹妹一起玩时，总是让着他们、照顾他们，成了弟弟妹妹们喜欢的大哥哥。\n\n正正明白了：大的要照顾小的、让着小的。自己是大哥哥大姐姐，面对比自己小、比自己弱的弟弟妹妹，要多一份照顾和谦让，保护他们的安全，而不是跟他们争抢。照顾弱小、友爱他人，是一种美德，也能收获弟弟妹妹的爱戴和自己的成就感。'
},
{
  id: 'zhengzheng_63',
  title: '【调皮鬼正正】第六十三集：把玩具当武器打闹',
  category: '成长',
  content: '正正和几个小朋友玩打仗游戏，他抓起硬硬的玩具当"武器",互相打来打去。\n\n"啪！"正正用玩具打在乐乐的胳膊上，乐乐疼得叫起来。乐乐也拿玩具还击，打在正正头上，正正也疼得直叫。两个人越打越凶，玩具你来我往，都打疼了对方。\n\n最后，正正的头被打起了一个包，乐乐的胳膊也青了一块。两个人都受了伤，还差点打到眼睛。\n\n李老师赶紧制止:"住手！你们怎么能用玩具打人！硬玩具打在身上会受伤的，打到头、打到眼睛更危险！"\n\n正正和乐乐都捂着疼的地方，不敢吭声。\n\n李老师说:"玩具是用来玩的，不是用来当武器打人的。打仗游戏可以玩，但绝不能用东西真打，那样会打伤人。你看你们俩，都打伤了。"\n\n正正和乐乐互相看了看对方的伤，都很后悔——本来是玩游戏，结果打伤了好朋友，也打伤了自己。\n\n李老师说:"玩游戏要注意安全，不能真打、不能拿东西打人。可以玩不会伤人的游戏，比如假装的、不接触的。开心地玩，但要保证安全，不能受伤。"\n\n正正和乐乐互相道了歉，还互相揉了揉伤的地方，又和好了。他们改玩别的不会受伤的游戏，玩得又开心又安全。\n\n正正明白了：玩具是用来玩的，不能当武器打人。硬东西打在身上会受伤，打到头和眼睛非常危险。玩游戏要注意安全，绝不能真打、拿东西打人。开开心心地玩，前提是保证安全、不伤害别人和自己。安全第一，快乐第二。'
},
{
  id: 'zhengzheng_64',
  title: '【调皮鬼正正】第六十四集：不肯收拾自己弄乱的东西',
  category: '成长',
  content: '正正玩完拼图，把拼图撒了一桌子一地，就想跑去玩别的。\n\n李老师说:"正正，玩完拼图要收拾好，放回盒子里。"\n\n正正说:"我不想收拾，太麻烦了。"说完就跑了。\n\n拼图撒了一地，别的小朋友走过来踩到了拼图，还差点滑倒。而且，下一个想玩拼图的小朋友，发现拼图乱七八糟、少了好几块，没法玩了。\n\n李老师把正正叫回来:"正正，自己弄乱的东西要自己收拾好。你不收拾，别人会踩到、滑倒，下一个玩的人也没法玩。这是你的责任。"\n\n正正嘟囔着:"为什么要我收拾……"\n\n李老师说:"因为是你玩的、你弄乱的呀。自己的事情自己负责。如果每个人玩完都不收拾，那教室不就乱成一团了吗？"\n\n正正只好回来收拾。可是拼图撒得到处都是，有的还被踩坏了、踩到了角落里，正正找了好久、捡了好久才收拾好，累得腰都酸了。\n\n"早知道就好好收拾了，现在更麻烦……"正正后悔道。\n\n李老师说:"其实，玩的时候就注意，玩完及时收拾，很快就好了。堆到最后一起收，或者撒得到处都是，反而更累。"\n\n从那以后，正正玩完东西都会自己收拾好，放回原处。他发现，养成随手收拾的习惯，其实一点都不麻烦，还让环境整整齐齐。\n\n正正明白了：自己弄乱的东西要自己收拾好，这是自己的责任，不能推给别人。玩完及时归位，既方便别人，又保持整洁。不收拾会影响别人、造成危险，最后还是要自己更辛苦地收拾。养成自己的事情自己负责、随手收拾的好习惯，生活才井井有条。'
},
{
  id: 'zhengzheng_65',
  title: '【调皮鬼正正】第六十五集：故意学别人哭',
  category: '成长',
  content: '朵朵摔了一跤，膝盖磕破了，疼得哭了起来。\n\n正正不但不安慰，还故意学朵朵哭:"呜呜呜，学你哭，好好笑！"他夸张地学朵朵哭的样子，还叫别的小朋友一起看、一起笑。\n\n朵朵本来摔疼了就很难过，被正正这么一学一笑，更伤心了，哭得更厉害了。\n\n李老师非常严肃:"正正！朵朵摔伤了，正疼着、难过着，你不但不安慰，还学她哭、笑话她！这太没有同情心了！"\n\n正正被老师严厉的样子镇住了。\n\n李老师说:"别人受伤、难过的时候，需要的是安慰和帮助，不是嘲笑。你学别人哭、笑话别人的痛苦，会让人更伤心。如果是你摔伤了哭，别人却学你、笑你，你什么感觉？"\n\n正正想了想，那一定会更难过、更委屈。\n\n正正惭愧地低下了头，走到朵朵面前:"朵朵，对不起，我不该学你哭、笑话你。你的膝盖还疼吗？"\n\n他帮朵朵吹了吹伤口，扶她去医务室，还一直安慰她:"别怕，一会儿就不疼了。"\n\n朵朵感受到了正正的关心，慢慢不哭了，也原谅了正正。\n\n李老师说:"正正，你从笑话朵朵到安慰朵朵，这是很大的进步。别人痛苦的时候，伸出援手、给予安慰，才是有同情心、有爱心的表现。"\n\n正正明白了：别人受伤、难过、痛苦的时候，绝不能嘲笑、模仿，那样太残忍了，会让人更伤心。应该给予安慰、关心和帮助。有同情心，能体会别人的痛苦，在别人难过时伸出援手，是一颗善良温暖的心。将心比心，善待每一个需要帮助的人。'
},
{
  id: 'zhengzheng_66',
  title: '【调皮鬼正正】第六十六集：把别人的作业本弄湿',
  category: '成长',
  content: '正正端着一杯水，在教室里晃来晃去。经过乐乐的座位时，他一不小心，水洒在了乐乐刚做完的作业本上。\n\n乐乐认认真真做了一下午的作业，被水一泡，字都晕开了，本子也皱巴巴的，没法看了。\n\n乐乐心疼得快哭了:"我的作业！做了一下午呢！"\n\n正正一开始想溜走，装作不知道。但看到乐乐那么难过，他停住了脚步。\n\n正正想起自己以前也有作业被弄坏的经历，那种一下午的努力白费的感觉，真的很难受。\n\n正正主动承认:"乐乐，对不起，是我端水不小心洒在你作业本上的。"\n\n李老师说:"正正，端水要小心，不能在教室里晃来晃去。你把乐乐的作业弄湿了，他一下午的努力都白费了。"\n\n正正很内疚。他帮乐乐把湿的作业本小心地用纸吸干，又主动说:"乐乐，我陪你重新做一遍作业好不好？我帮你。"\n\n正正陪着乐乐，一起重新做了作业。有了正正帮忙，作业很快就做完了。乐乐看正正这么有诚意，就原谅了他。\n\n李老师表扬正正:"正正，你能主动承认错误，还帮乐乐重新做作业弥补，很好。以后端水要小心，不要在有人的地方晃。"\n\n从那以后，正正端水、端东西都小心翼翼的，走稳走慢，绝不在别人的座位旁边晃悠。\n\n正正明白了：端水、端东西要小心，不能在教室里晃来晃去，尤其不能在别人的作业、书本旁边。弄湿弄坏别人的东西，会让别人的努力白费，非常可惜。做错了事要主动承认、想办法弥补。小心谨慎、为别人着想，才能避免给别人造成损失。'
},
{
  id: 'zhengzheng_67',
  title: '【调皮鬼正正】第六十七集：不肯跟大家一起收拾教室',
  category: '成长',
  content: '放学前，李老师说:"大家一起收拾教室，把玩具、图书归位，把地上的垃圾捡起来。"\n\n小朋友们都动起手来，只有正正站在一边不干:"我又没弄乱，凭什么要我收拾。"\n\n大家都在忙，就正正一个人闲着，还在旁边玩。别的小朋友很不高兴:"大家都在收拾，就正正不干活。"\n\n李老师说:"正正，收拾教室是大家的事。教室是我们共同的家，需要每个人一起维护。就算不全是你弄乱的，作为班里的一员，也要出一份力。"\n\n正正说:"可是我累了……"\n\n李老师说:"大家都累了，但都在为班级出力。如果每个人都像你一样\'我没弄乱、我不收拾\',那教室谁来打扫呢？集体的事，需要每个人一起承担。"\n\n正正看看大家，都在认真地收拾，就他一个人袖手旁观，确实不应该。\n\n正正不好意思地加入了收拾的队伍。他捡垃圾、摆椅子、整理图书。大家一起干，很快就把教室收拾得干干净净、整整齐齐。\n\n看着焕然一新的教室，正正心里有一种为集体出力的成就感。而且，大家一起干活，有说有笑，还挺开心的。\n\n李老师表扬大家:"看，大家一起动手，教室很快就干净了。这就是集体的力量。谢谢每一个出力的小朋友。"\n\n正正也得到了表扬，心里美滋滋的。\n\n正正明白了：集体的事，需要每个人一起承担，不能只顾自己、袖手旁观。教室是大家共同的家，收拾、维护是每个人的责任，不能因为"不是自己弄乱的"就不干。为集体出力，既是责任，也能收获成就感和快乐。人人为集体，集体才温暖美好。'
},
{
  id: 'zhengzheng_68',
  title: '【调皮鬼正正】第六十八集：把小朋友的画藏起来',
  category: '成长',
  content: '小美画了一幅画，准备交给老师参加比赛。正正嫉妒小美画得好，趁小美不注意，把画藏了起来。\n\n到了交画的时候，小美找不到自己的画了，急得团团转、快哭了:"我的画呢？我画了好久的……"她找遍了教室都没找到，眼看比赛就要错过了。\n\n正正躲在一边，心里有点得意，又有点心虚。\n\n李老师帮小美一起找，最后在正正的柜子里找到了那幅画。\n\n李老师严肃地问:"正正，小美的画怎么在你柜子里？"\n\n正正低下头，小声说:"我……我嫉妒她画得好，就把画藏起来了……"\n\n李老师说:"正正，嫉妒别人、藏起别人的东西，是很不好的行为。你差点害小美错过比赛，她多着急、多难过。别人画得好，你应该学习，而不是嫉妒、破坏。"\n\n正正很惭愧。他把画还给小美，真诚地道歉:"小美，对不起，我不该藏你的画。你画得好，我应该向你学习，不该嫉妒你。"\n\n小美拿回画，虽然生气，但看正正真心悔改，也原谅了他。她还说:"你要是喜欢画画，我可以教你呀。"\n\n后来，小美真的教正正画画，正正的画也进步了。两个人成了好朋友。\n\n李老师说:"看到别人优秀，正确的做法是欣赏、学习、努力追赶，而不是嫉妒、破坏。嫉妒会让人做出伤害别人的事，最后也害了自己。"\n\n正正明白了：嫉妒别人、藏起或破坏别人的东西，是很不好的行为，既伤害别人，又不能让自己变好。看到别人优秀，应该真心欣赏、虚心学习、努力追赶。把嫉妒变成动力，向优秀的人学习，自己才能进步。心胸开阔、见贤思齐，才能不断成长。'
},
{
  id: 'zhengzheng_69',
  title: '【调皮鬼正正】第六十九集：不肯听劝乱爬高',
  category: '成长',
  content: '正正看到教室的柜子很高，就想爬上去，觉得站得高很威风。\n\n小朋友们劝他:"正正，别爬，太高了，会摔下来的！"李老师也说:"正正，快下来，爬那么高很危险！"\n\n可是正正不听:"我厉害着呢，不会摔的！"他继续往上爬，爬到了柜子顶上。\n\n结果，柜子晃了一下，正正没站稳，"啊——"从高高的柜子上摔了下来！幸好李老师眼疾手快，冲过去接住了他，不然后果不堪设想。\n\n饶是这样，正正也摔得不轻，胳膊擦破了皮，还吓得大哭起来。\n\n李老师又后怕又生气:"正正！让你别爬高你不听！从这么高摔下来，要是没接住，会摔成重伤的！爬高太危险了！"\n\n正正吓得脸都白了，摔疼了，也后怕不已。要不是老师接住，真不知道会摔成什么样。\n\n李老师说:"正正，大家劝你、老师拦你，都是为了你的安全。你不听劝，非要爬高，差点出大事。爬高、站在危险的地方，是绝对不能做的。"\n\n正正含着泪点头:"我知道错了……我不该爬高，也不该不听劝……"\n\n李老师说:"别人的劝告，尤其是关于安全的，一定要听。不能逞能、冒险。安全比\'威风\'重要一万倍。"\n\n从那以后，正正再也不爬高了，也学会了听劝。别人提醒有危险，他一定会停下来。\n\n正正明白了：不能爬高、站在危险的地方，那样很容易摔成重伤。别人的劝告、尤其是关于安全的提醒，一定要听。逞能、冒险、不听劝，会让自己陷入危险。听从劝告、远离危险、珍惜安全，才是真正的聪明和勇敢。生命安全，永远是第一位的。'
},
{
  id: 'zhengzheng_70',
  title: '【调皮鬼正正】第七十集：把颜料涂在同学的书包上',
  category: '成长',
  content: '乐乐有一个新书包，上面有他最喜欢的卡通图案。正正觉得书包太"素"了，就用颜料在乐乐的书包上乱涂，涂得五颜六色、乱七八糟。\n\n"我帮你的书包\'化妆\'!"正正很得意。\n\n可是乐乐看到心爱的新书包被涂得乱七八糟，"哇"地哭了。颜料涂在书包上，怎么洗都洗不干净，新书包被弄脏毁了。\n\n李老师说:"正正，书包是乐乐的，你怎么能在上面乱涂颜料呢？你把乐乐的新书包弄脏了，他多心疼。"\n\n正正说:"我以为会更好看……"\n\n李老师说:"就算你觉得好看，那也是别人的东西，没经过同意不能乱动、乱涂。而且颜料涂上去洗不掉，把新书包都毁了。别人的东西要尊重、要爱护。"\n\n正正看着乐乐哭泣的样子和被毁的书包，很后悔。\n\n正正真诚地道歉:"乐乐，对不起，我不该在你书包上乱涂颜料。"他还想办法帮乐乐清洗书包，可是颜料实在洗不掉了。\n\n最后，正正用自己攒的零花钱，赔了乐乐一个新书包。虽然心疼零花钱，但正正知道这是自己该负的责任。\n\n乐乐拿到新书包，也原谅了正正。\n\n从那以后，正正绝不乱动、乱涂别人的东西了。他明白了，别人的东西再"素",也是别人的，要尊重。\n\n正正明白了：不能在别人的东西上乱涂乱画，哪怕你觉得"更好看"。别人的东西要经过同意才能动，更不能弄脏弄坏。颜料涂上去洗不掉，会毁了别人心爱的东西。尊重别人的物品，不擅自处置，弄坏了要负责赔偿。尊重他人，是最基本的修养。'
},
{
  id: 'zhengzheng_71',
  title: '【调皮鬼正正】第七十一集：不肯把好位置让给同学',
  category: '成长',
  content: '看木偶戏表演的时候，前排的位置能看得最清楚，大家都想坐。正正抢到了最前排最中间的好位置。\n\n这时候，个子矮小的朵朵坐在后排，被前面的小朋友挡住了，什么都看不到，急得直探头。\n\n李老师说:"正正，朵朵个子小，坐在后面看不到。你坐在最前面，能不能跟朵朵换一下，让她也能看到表演？"\n\n正正不愿意:"我先抢到的，凭什么让给她。"\n\n李老师说:"朵朵个子小，被挡住了完全看不到，多可惜呀。你个子高一点，坐后面一点还能看到。互相谦让、照顾个子小的同学，是一种美德。"\n\n正正还是有点不情愿。但他看到朵朵一直探着头、什么都看不到、快哭了的样子，心软了。\n\n正正想起自己如果什么都看不到，也会很失望。\n\n"那……朵朵，你来坐我这里吧，我个子高，坐后面也能看到。"正正把好位置让给了朵朵。\n\n朵朵坐到前排，终于能看清木偶戏了，开心极了:"谢谢你正正！"\n\n正正坐到后面，虽然位置差一点，但也能看到表演。而且，因为他谦让了朵朵，心里有一种助人的快乐，看戏也格外开心。\n\n李老师表扬正正:"正正会谦让、会照顾同学了，真棒！"\n\n正正明白了：好位置、好东西，要懂得谦让，尤其要照顾比自己小、比自己有困难的同学。把方便让给更需要的人，自己吃点亏没关系，还能收获助人的快乐和大家的尊重。谦让和照顾他人，是一种温暖的美德，能让集体更和谐。'
},
{
  id: 'zhengzheng_72',
  title: '【调皮鬼正正】第七十二集：故意大声打扰别人看书',
  category: '成长',
  content: '阅读时间，大家都安安静静地在读书角看图画书。只有正正，觉得安静太无聊，就故意大声说话、唱歌、拍桌子，打扰大家看书。\n\n"哈哈，你们看这个！"正正大声嚷嚷，还发出各种怪声音。\n\n正在专心看书的小朋友都被他吵得看不下去了，有的皱眉，有的捂耳朵。安静的读书角被正正搞得乱哄哄的。\n\n李老师说:"正正，读书的时候要保持安静。大家都在专心看书，你大声吵闹，打扰了所有人。这是很不礼貌的。"\n\n正正说:"看书多无聊呀。"\n\n李老师说:"你觉得无聊，可以安静地也看看书，说不定会发现书里的乐趣。但你不能因为自己无聊，就吵闹打扰别人。每个人都有安静看书的权利。"\n\n正正看到大家都被自己吵得看不成书、很不高兴，有点惭愧。\n\n李老师递给正正一本恐龙的图画书:"正正，你看看这本，里面有好多恐龙呢。"\n\n正正翻开一看，哇，好多恐龙——霸王龙、三角龙、剑龙……可有意思了。他一下子看入迷了，安静地看了起来。\n\n原来看书这么有意思！正正看得津津有味，再也不吵闹了。读书角又恢复了安静，大家都能专心看书了。\n\n正正明白了：在图书馆、读书角等安静的场所，一定要保持安静，不能吵闹打扰别人。每个人都有安静学习、阅读的权利。而且，静下心来读书，会发现书里有好多有趣的世界。尊重他人、遵守公共场所的安静，同时享受阅读的乐趣，是文明又有内涵的表现。'
},
{
  id: 'zhengzheng_73',
  title: '【调皮鬼正正】第七十三集：把玩具车往人身上开',
  category: '成长',
  content: '正正玩遥控汽车，觉得把车开向别人、撞别人的脚很好玩。他操控着遥控车，"嗖"地开向小朋友们的脚。\n\n车撞到了小美的脚，小美"哎哟"一声。正正又把车开向别人，撞得大家躲来躲去。有个小朋友躲车的时候差点摔倒。\n\n李老师说:"正正，遥控车不能往人身上开、撞别人。车撞到脚会疼，别人躲车还可能摔倒受伤。玩具车应该在空地上开，不能拿来撞人。"\n\n正正说:"我觉得撞人很好玩。"\n\n李老师说:"你觉得好玩，可是被撞的人会疼、会烦、还可能摔倒。而且，如果车开得快，撞到小朋友，或者小朋友躲避时摔倒，都会受伤。"\n\n正正想了想，如果别人拿车撞自己的脚，自己也会又疼又烦。\n\n结果，另一个小朋友学正正，把遥控车开向了正正，撞到了正正的脚。正正"哎哟"一声，还躲避不及差点摔倒。\n\n"原来被车撞这么讨厌……"正正明白了。\n\n李老师说:"现在你知道被撞的感觉了吧？玩具车要在空地上玩，比赛谁开得稳、开得快，不能拿来撞人。"\n\n正正给小美道了歉，然后跟小朋友们在空地上比赛开遥控车，看谁开得又快又稳、谁能绕过障碍。这样玩，又开心又安全，大家都玩得很尽兴。\n\n正正明白了：遥控车、玩具车要在空地上玩，不能往人身上开、撞别人。撞人会让人疼、烦，躲避时还可能摔倒受伤。玩玩具要注意安全，不能拿来伤害或戏弄别人。想想好玩又安全的玩法，比如比赛、绕障碍，大家一起玩才尽兴。安全和友善，是玩耍的前提。'
},
{
  id: 'zhengzheng_74',
  title: '【调皮鬼正正】第七十四集：不肯承认拿了同学的东西',
  category: '成长',
  content: '小美有一块很漂亮的橡皮，粉色的，还是草莓形状的。正正很喜欢，趁小美不注意，偷偷拿走了，藏进了自己的口袋。\n\n小美发现橡皮不见了，很着急:"我的草莓橡皮呢？"她找遍了都没找到。\n\n李老师问大家:"有谁看到小美的橡皮了吗？"\n\n正正低着头，不敢承认，心里怦怦直跳。\n\n李老师说:"如果是不小心拿错了，或者捡到了，请还给小美。诚实的孩子最棒。"\n\n正正犹豫着，手里攥着那块橡皮。他想起以前李老师讲的诚实的道理，也想起小美着急的样子。\n\n最后，正正鼓起勇气，把橡皮拿了出来:"李老师，小美的橡皮……在我这里。我很喜欢，就拿走了……对不起。"\n\n李老师走过来，温和地说:"正正，你能承认，很勇敢。但是，别人的东西，喜欢也不能拿走。这样是不对的。你要是喜欢，可以请妈妈买一个一样的。"\n\n正正把橡皮还给小美，真诚地道歉:"小美，对不起，我太喜欢你的橡皮了，就拿走了。我不该拿别人的东西。"\n\n小美拿回橡皮，看正正诚实地承认了，也原谅了他。她还说:"你要是喜欢，下次我可以借你用。"\n\n后来，妈妈也给正正买了一块草莓橡皮。正正特别开心，也明白了——想要的东西，要通过正当的方式得到，不能拿别人的。\n\n正正明白了：别人的东西，再喜欢也不能拿走、占为己有，那是不诚实、不对的行为。喜欢的东西，可以请爸爸妈妈买，或者礼貌地借。做错了事要勇敢诚实地承认、归还、道歉。诚实、不拿别人的东西，是做人最基本的品德。'
},
{
  id: 'zhengzheng_75',
  title: '【调皮鬼正正】第七十五集：不专心听讲要重做',
  category: '成长',
  content: '手工课上，李老师在教大家折纸青蛙的步骤。正正没有专心听，一边听一边玩纸，东张西望。\n\n老师讲完，大家开始折。别的小朋友都记住了步骤，折得又快又好。只有正正，因为没认真听，不知道怎么折，折得乱七八糟，青蛙一点都不像。\n\n"我不会折……"正正看着别人都折好了，自己却折不出来，很着急。\n\n李老师说:"正正，刚才老师教步骤的时候，你没有专心听，所以现在不会折。认真听讲，才能学会。"\n\n正正很后悔。他只好请老师再教一遍。李老师又单独教了正正一遍，这次正正认认真真地听、认认真真地记每一个步骤。\n\n跟着老师，正正一步一步地折:先对折，再翻过来，然后折出腿……终于，一只可爱的纸青蛙折出来了！还能一按就跳呢。\n\n"我折出来啦！"正正特别开心。\n\n李老师说:"你看，认真听、认真学，就能学会。刚才你不专心，所以不会，还得重新学一遍，多花了时间。要是一开始就认真听，早就学会了。"\n\n正正明白了，专心听讲能省好多时间，还能一次就学会。\n\n从那以后，正正上课、听老师讲步骤的时候，都特别专心，眼睛看着老师，认真地听、认真地记。他学东西也越来越快了。\n\n正正明白了：学习新东西的时候，一定要专心听讲。认真听、认真记，才能学会、学好。不专心，就会学不会，还得重新学，浪费时间。专心听讲是最重要的学习习惯。用心听、用心学，才能又快又好地掌握新本领。'
},
{
  id: 'zhengzheng_76',
  title: '【调皮鬼正正】第七十六集：把水彩笔盖弄丢不盖',
  category: '成长',
  content: '正正用水彩笔画画，用完从来不盖笔帽，把笔帽随手一扔，弄得到处都是，还找不到。\n\n结果，没盖笔帽的水彩笔很快就干了，画不出颜色了。正正想画画，笔却干得写不出来，只好扔掉。好好的一盒水彩笔，因为不盖笔帽，很快就干了大半。\n\n李老师说:"正正，水彩笔用完要盖好笔帽。不盖笔帽，笔里的水分就跑掉了，笔很快就干了，不能用了。你看，你的笔都干了，多浪费。"\n\n正正看着一堆干掉的水彩笔，很心疼——这些笔本来可以用很久的，就因为自己不盖笔帽，早早地干掉了。\n\n李老师说:"很多东西都要好好保管、爱护。水彩笔用完盖笔帽、胶水用完拧紧盖子、书本不乱折。爱护物品，它们才能用得久。"\n\n正正后悔没有好好爱护水彩笔。他把还没干的笔都仔细盖好了笔帽。\n\n妈妈知道后，又给正正买了一盒新的水彩笔，叮嘱他:"这次要爱护哦，用完盖好笔帽。"\n\n正正这次特别注意，每次用完水彩笔都仔细盖好笔帽。这盒水彩笔用了好久好久都没干，一直很好用。\n\n正正发现，爱护物品，东西就能用得久，还省钱、省事。\n\n正正明白了：东西要好好爱护、保管。水彩笔用完要盖笔帽，不然会干掉不能用。爱护物品——盖好盖子、放回原处、轻拿轻放，物品才能用得长久。不爱护，东西就容易坏、容易丢，既浪费又麻烦。养成爱护物品的好习惯，是珍惜和负责的表现。'
},
{
  id: 'zhengzheng_77',
  title: '【调皮鬼正正】第七十七集：不肯跟同学好好合作',
  category: '成长',
  content: '李老师让两人一组，合作完成一幅画。正正和乐乐一组。\n\n可是正正什么都要自己说了算，不听乐乐的意见:"要画海洋！""这里要涂蓝色！""不对，听我的！"乐乐说什么，正正都不同意，还嫌乐乐画得不好。\n\n两个人合作得很不愉快，画也画得乱七八糟——因为正正不合作、不听意见，两个人各画各的，画面一点都不协调。\n\n别的组因为好好合作、互相商量，画得又漂亮又协调。\n\n李老师说:"正正，合作要互相商量、互相尊重，不能什么都你说了算。你不听乐乐的意见，两个人没法配合，画当然画不好。"\n\n正正说:"可是我觉得我的想法好……"\n\n李老师说:"合作不是一个人说了算，而是两个人的智慧加在一起。乐乐也有好想法呀。你们商量着来，把两个人的好主意结合起来，才能画得更好。"\n\n正正想了想，觉得有道理。他跟乐乐重新商量:"乐乐，对不起，刚才我太自我了。这次我们商量着来。你想画什么？"\n\n乐乐说:"我想画海底世界，有小鱼、珊瑚、海龟。"\n\n正正说:"好主意！那我画大鲸鱼和海草，你画小鱼和珊瑚，我们合起来就是一个完整的海底世界！"\n\n两个人商量着、配合着，你画一部分我画一部分，还互相出主意。这次，他们的画又漂亮又协调，海底世界丰富多彩。\n\n李老师表扬他们:"这次合作得真好！两个人的想法结合起来，画得比一个人好多了。"\n\n正正明白了：合作要互相商量、互相尊重、互相配合，不能一个人说了算。每个人都有好想法，把大家的智慧结合起来，才能做得更好。合作中要学会倾听别人的意见、尊重伙伴。团结协作、集思广益，才能取得一加一大于二的好效果。'
},
{
  id: 'zhengzheng_78',
  title: '【调皮鬼正正】第七十八集：把玩具摔在地上发脾气',
  category: '成长',
  content: '正正搭积木，怎么也搭不好，塔总是倒。他越搭越急，最后发起脾气来，"啪"地把积木摔在地上，还大喊大叫:"讨厌！我不搭了！"\n\n积木撒了一地，有的还被摔坏了。正正气呼呼地坐在地上，谁也不理。\n\n李老师走过来，轻声说:"正正，搭不好可以慢慢来，为什么要发脾气、摔积木呢？摔东西既解决不了问题，还会把玩具摔坏。"\n\n正正气鼓鼓地说:"我搭不好，塔老是倒！"\n\n李老师说:"塔倒了，我们可以想想为什么倒——是不是底座不够稳？是不是上面太重？发脾气、摔东西是没用的，还会伤害玩具、影响心情。冷静下来，想想办法，才能解决问题。"\n\n正正冷静了一下。李老师陪他一起分析:"你看，底座搭得太小了，所以不稳。我们把底座搭大一点、宽一点，是不是就稳了？"\n\n正正试着把底座搭得又大又宽，然后一层一层往上搭。这次，塔稳稳地立住了，越搭越高，没有倒！\n\n"我搭好了！"正正高兴极了。\n\n李老师说:"你看，冷静下来、想办法，问题就解决了。发脾气摔东西，什么都解决不了，还会把玩具摔坏、把自己气坏。"\n\n正正明白了自己刚才发脾气多不应该。他把摔在地上的积木捡起来，还有一块摔坏了，他很心疼。\n\n从那以后，正正遇到困难不再发脾气、摔东西了。他学会了冷静下来，想办法解决问题。\n\n正正明白了：遇到困难、做不好的时候，发脾气、摔东西是没用的，只会把东西摔坏、把心情弄糟。应该冷静下来，分析问题出在哪里，想办法解决。控制情绪、冷静思考、耐心尝试，才能克服困难。发脾气解决不了任何问题，冷静和智慧才能。'
},
{
  id: 'zhengzheng_79',
  title: '【调皮鬼正正】第七十九集：不肯原谅同学的无心之失',
  category: '成长',
  content: '乐乐不小心碰倒了正正的水杯，水洒了正正一点。乐乐赶紧道歉:"正正，对不起，我不是故意的。"\n\n可是正正不依不饶，非常生气:"你把我水杯碰倒了！我不原谅你！"\n\n乐乐一再道歉，还帮正正擦桌子、倒了新的水，可正正就是不肯原谅，还气呼呼地不理乐乐，一整天都板着脸。\n\n李老师说:"正正，乐乐是不小心碰倒的，又不是故意的，还马上道歉、帮你擦干净、倒了新水。他这么有诚意，你为什么不肯原谅呢？"\n\n正正说:"他把我水杯碰倒了嘛。"\n\n李老师说:"每个人都会有不小心的时候。乐乐不是故意的，还真诚地道歉、弥补了。这种无心之失，应该原谅呀。如果是你不小心碰倒了别人的东西，道了歉，别人却一直不原谅你、不理你，你什么感觉？"\n\n正正想了想，那一定会很难受、很内疚。而且乐乐已经道歉、弥补了，自己还揪着不放，确实有点过分。\n\n正正的气消了一些。他对乐乐说:"乐乐……其实也没什么，就洒了一点水。我不该一直生气不理你。"\n\n乐乐高兴起来:"那你原谅我啦？"\n\n正正点点头:"原谅你了。我们还是好朋友。"\n\n两个人又和好了，一起玩了起来。正正发现，原谅了别人，自己心里也轻松了，气也消了，比一直生气舒服多了。\n\n正正明白了：别人无心之失、不是故意犯的错，只要真诚地道歉、弥补了，就应该原谅。人人都会有不小心的时候，要多一份宽容和体谅。一直揪着别人的小错不放、不肯原谅，既伤害友谊，也让自己不开心。学会宽容和原谅，人与人相处才会和谐愉快，自己的心情也会更好。'
},
{
  id: 'zhengzheng_80',
  title: '【调皮鬼正正】第八十集：正正长大了',
  category: '成长',
  content: '又是一个学期过去了。正正回想这段时间，自己犯了好多错，也改了好多好多。\n\n他从一个爱恶作剧、抢东西、破坏东西、欺负人、不守规矩的调皮鬼，变成了一个友善、诚实、守规矩、乐于助人、懂得分享和谦让的好孩子。\n\n他学会了将心比心，做事之前先想想别人的感受;学会了诚实，做错了事勇敢承认;学会了分享和谦让，好东西跟大家分享;学会了守规矩、讲礼貌、爱护公物和小动物;学会了注意安全，保护自己和别人;还学会了控制情绪、宽容待人、团结合作。\n\n期末，幼儿园又评选"进步之星"。李老师郑重地宣布:"这学期进步最大的小朋友，还是——正正！"\n\n全班响起了热烈的掌声。\n\n李老师说:"正正这学期进步特别大。他每一次犯错，都认真改正;每一个坏毛病，都努力改掉。现在的正正，是一个人人喜欢的好孩子。这告诉我们，犯错不可怕，只要肯改，就能越来越好。"\n\n正正走上台，戴上了"进步之星"的奖章。他看着台下的小朋友们——乐乐、小美、朵朵、壮壮，还有好多好朋友，都在为他鼓掌。\n\n正正说:"以前我做了好多错事，谢谢老师和同学们一直帮助我、包容我。我以后会继续做一个友善、诚实、懂事的好孩子。"\n\n放学回家，正正把奖章给妈妈看:"妈妈，我又得了进步之星！"\n\n妈妈欣慰地抱住他:"我们正正真的长大了、懂事了。妈妈为你骄傲。"\n\n正正想起这段时间——虽然犯错时被批评过、被打过屁股、哭过、后悔过，但正是这些，让他一点一点变好、变懂事。\n\n正正明白了一个最重要的道理:人都会犯错，但只要肯认错、肯改正、肯为别人着想，就能不断进步，成为一个更好的人。而一个友善、诚实、懂事的人，会拥有很多好朋友，会被大家喜爱，也会生活得更快乐。\n\n窗外，夕阳洒下温暖的光。正正带着他的成长和进步，带着满满的爱和友谊，继续快乐地长大。明天，又是充满希望的新一天。'
},

  category: '成长',
  content: '手工课上，李老师发了五颜六色的橡皮泥。正正玩着玩着，又想出了坏点子。他趁前面小美不注意，把一团绿色的橡皮泥悄悄粘在了小美的辫子上。\n\n"嘿嘿，小美变成青蛙了！"正正在后面偷笑。\n\n小美不知道，还在认真捏小兔子。等她下课去照镜子，才发现辫子上粘了一大团橡皮泥，怎么揪都揪不下来，头发全黏在了一起。\n\n小美"哇"地哭了。妈妈来接的时候，橡皮泥已经干在头发上，最后只能剪掉了一小撮头发。小美的辫子少了一块，难看极了。\n\n李老师把正正叫过来："正正，你看小美的头发被剪掉了，她多伤心。橡皮泥粘在头发上很难弄下来的。"\n\n正正看着小美一边哭一边摸自己少了一块的辫子，心里很不是滋味。\n\n放学后妈妈知道了——"啪！"屁股上挨了一下。"你怎么能把橡皮泥粘人家头发上！小姑娘多爱美呀，头发都被你害得剪掉了！"\n\n正正哭着认错："我错了……我不该粘小美头发……"\n\n第二天，正正用自己的零花钱买了一个漂亮的发夹送给小美，真诚地道了歉。发夹正好夹住了剪短的那块头发，小美这才又笑了。\n\n从那以后，正正再也不敢把橡皮泥乱粘了。他知道了，有些东西粘上去容易，弄下来可就难了，还会伤害到别人。'
},

  content: '午饭时间，正正吃饭不老实。他把米饭捏成小团，用勺子当弹弓，"啪"地弹到对面乐乐的脸上。\n\n"哈哈，打中了！"正正觉得很好玩，又弹了一颗，这次弹到了小美的衣服上。\n\n米饭粘在小美的新衣服上，油乎乎的，留下一个印子。小美很生气也很难过。\n\n李老师走过来，脸色很严肃："正正，粮食是用来吃的，不是用来弹着玩的。你把饭弹到别人身上，弄脏了小美的衣服，还浪费了粮食。"\n\n正正还在笑，觉得没什么。\n\n李老师捡起地上被弹掉的米饭，说："正正，你知道吗？一粒米，农民伯伯要种好几个月才能收获。你这样弹着玩，糟蹋了农民伯伯的辛苦。而且饭菜掉地上就不能吃了，多浪费。"\n\n正正看着地上的饭粒，想起了"粒粒皆辛苦"的儿歌。\n\n放学后妈妈也批评了他："吃饭要好好吃，不能玩食物。你把饭弹到小美身上，人家衣服脏了，还得回家洗。你想想小美多委屈。"\n\n正正低下了头："对不起，我以后好好吃饭，不玩饭了。"\n\n第二天，正正跟小美道了歉。吃午饭的时候，他一口一口认认真真地吃，把碗里的饭吃得干干净净，一粒都没剩，也没有再玩食物。\n\n李老师表扬他："正正今天吃饭真乖！这才是爱惜粮食的好孩子。"\n\n从那以后，正正吃饭再也不玩了。他知道了，粮食来之不易，要珍惜；也知道了，把食物弹到别人身上，是很不礼貌、很不尊重人的行为。'

{

  title: '【调皮鬼正正】第八十八集：故意关灯吓人',
  category: '成长',
  content: '午睡室有点暗，正正发现了墙上的电灯开关。他觉得开关灯很好玩，就跑过去"啪"地把灯全关了。\n\n教室一下子黑了，还没睡着的小朋友吓得叫起来。正正又"啪"地开灯，"啪"地关灯，开开关关，把大家吓得一惊一乍的。\n\n胆小的朵朵吓得哭了，还有小朋友被突然的黑暗吓得从床上摔了下来。\n\n李老师赶紧过来，把正正拉开："正正，不能乱开关灯！突然关灯，大家看不见，会摔倒、会害怕。而且反复开关，灯泡容易坏。"\n\n正正还觉得好玩："黑乎乎的多刺激呀。"\n\n李老师说："你觉得刺激，可是朵朵吓哭了，还有小朋友摔下床。你的\'好玩\'建立在别人的害怕和危险上，这样对吗？"\n\n正正看着哭泣的朵朵和摔疼的小朋友，不吭声了。\n\n李老师还讲了安全知识："电是很危险的，插座、开关、电线都不能乱碰。小手湿的时候更不能碰电，会触电的，非常危险！"\n\n正正吓了一跳，原来电这么危险。\n\n放学后妈妈知道了，严肃地说："电不是玩具！乱碰电很危险，会触电！以后开关灯让大人来，你不要乱动。"\n\n正正认真地点头："我知道了，电很危险，我不乱碰了。"\n\n第二天，正正跟朵朵和摔倒的小朋友道了歉。他还记住了安全用电的规矩：不用湿手碰电，不乱插插座，不乱开关电器。\n\n从那以后，正正再也不乱开关灯吓人了。他还成了安全小卫士，看到有小朋友想玩插座，就赶紧制止："危险！不能碰电！"'
},
{
  id: 'zhengzheng_89',
  title: '【调皮鬼正正】第八十九集：把鼻涕抹在墙上',
  category: '成长',
  content: '正正感冒了，流鼻涕。可他懒得用纸巾，也不擦，鼻涕流下来就用手一抹，然后把手上的鼻涕抹在墙上、桌子上、椅子上。\n\n墙上、桌上到处都是他抹的鼻涕印子，又脏又恶心。别的小朋友都不敢碰他抹过的地方。\n\n李老师看到了，皱起了眉头："正正，流鼻涕要用纸巾擦，擦完扔进垃圾桶。你把鼻涕抹得到处都是，又脏又不卫生，还会把感冒传染给别人。"\n\n正正满不在乎："擦了还会流嘛。"\n\n结果，正正抹过的桌子，别的小朋友碰到了，也开始有人感冒了。而且教室里到处是鼻涕印，看着就恶心，大家都嫌弃地躲着正正。\n\n正正发现没人愿意跟他玩了，还有小朋友说他"脏"。他这才觉得难为情。\n\n李老师教他正确的方法："流鼻涕，拿一张纸巾，把鼻涕擦干净，然后把纸巾扔进垃圾桶。打喷嚏要用手肘捂住嘴巴。这样既卫生，又不会传染给别人。"\n\n正正学着做。他用纸巾把鼻涕擦干净，扔进垃圾桶，还把自己抹脏的地方擦干净了。\n\n放学后妈妈给他准备了一包纸巾放在书包里："感冒了记得用纸巾，讲卫生的孩子才招人喜欢。"\n\n第二天，正正随身带着纸巾，流鼻涕就擦，擦完就扔。他还把纸巾分给其他感冒的小朋友。\n\n慢慢地，大家又愿意跟干干净净的正正玩了。正正明白了：讲卫生不但是为了自己健康，也是尊重别人。一个爱干净、讲卫生的孩子，才会受大家欢迎。'

{
  id: 'zhengzheng_90',
  title: '【调皮鬼正正】第九十集：抢着玩不让别人碰',
  category: '成长',
  content: '幼儿园来了一套新的过家家玩具——有小锅、小碗、小勺子，还有假的蔬菜水果。所有小朋友都想玩。\n\n正正第一个冲过去，把所有玩具都抱在怀里："这些都是我的！谁也不许碰！"\n\n别的小朋友想玩，正正一样都不给。他一个人抱着一大堆玩具，可是手就那么两只，根本玩不过来。玩具堆在他面前，他也就玩玩这个、看看那个，其实一点都不好玩。\n\n而别的小朋友因为没有玩具，就三三两两地一起玩别的游戏，玩得可开心了，有说有笑。\n\n正正一个人抱着一堆玩具，孤零零的，看着别人开心地玩，心里酸酸的。\n\n李老师走过来，坐在正正旁边："正正，你抱着这么多玩具，玩得开心吗？"\n\n正正摇摇头："一个人玩……没意思。"\n\n"过家家本来就是要几个人一起玩才好玩呀。你当爸爸，别人当妈妈、当宝宝，一起做饭、照顾娃娃，多有意思。可是你把玩具全占了，没人跟你玩，当然没意思了。"\n\n正正明白了。他把玩具分给了大家："我们一起玩过家家好不好？我当爸爸！"\n\n小朋友们高兴地围过来。有人当妈妈，有人当宝宝，正正当爸爸，大家一起"做饭""喂娃娃",玩得可热闹了。\n\n正正发现，跟大家一起玩，比一个人抱着一堆玩具有意思一百倍！\n\n李老师说："玩具是大家一起玩的。分享出去，你不但不会少了快乐，反而收获了更多的快乐和朋友。"\n\n从那以后，正正不再独占玩具了。他明白了：独占只会让自己孤单，分享才能收获快乐和友谊。'

{

  category: '成长',
  content: '正正觉得看别人摔跤很好笑。做游戏的时候，他趁小朋友跑过来，故意伸出脚一绊。\n\n"哎哟！"乐乐被绊了一跤，摔在地上，膝盖磕破了皮，流血了。\n\n正正在旁边哈哈大笑："哈哈，摔了个狗啃泥！"\n\n李老师赶紧扶起乐乐，帮他处理伤口。乐乐疼得直掉眼泪。\n\n李老师非常严肃地看着正正："正正，故意绊倒别人是很危险、很不友善的行为！你看乐乐膝盖都摔破流血了。要是摔到头，那多严重！"\n\n正正还在笑，觉得没什么大不了。\n\n结果，就在当天下午，正正自己跑的时候，被地上的一个玩具绊倒了，"扑通"摔了一跤，膝盖也摔破了，疼得他哇哇大哭。\n\n摔跤的滋味一点都不好受——又疼，膝盖火辣辣的，还流血了。正正这才知道，摔跤真的很疼，一点都不好笑。\n\n李老师走过来说："现在你知道摔跤有多疼了吧？这就是乐乐上午的感觉，还是被你故意绊倒的。"\n\n正正捂着膝盖，想起了被自己绊倒的乐乐，心里特别愧疚。"对不起乐乐……我不该绊你，摔跤真的好疼……"\n\n乐乐虽然也疼，但还是原谅了正正。\n\n李老师教育大家："绝对不能故意绊倒别人、推别人。这些行为很危险，会让人受重伤。同学之间要友爱，不能互相伤害。"\n\n从那以后，正正再也不故意绊人了。他不但自己不做危险的事，看到别人打闹推搡，还会提醒："别推别绊，摔倒了很疼很危险的！"正正用自己摔的那一跤，记住了这个教训。'

{
  id: 'zhengzheng_92',
  title: '【调皮鬼正正】第九十二集：把玩具塞进嘴里',
  category: '成长',
  content: '正正玩积木的时候，看到有一块小小的圆积木，觉得像糖果。他不管三七二十一，直接塞进了嘴里，含着玩。\n\n"你们看，我含着积木！"正正含糊不清地说，还想逗大家笑。\n\n结果说着说着，正正一不小心，那块小积木滑到了喉咙口，卡住了！正正一下子喘不上气，脸憋得通红，用手拼命抓喉咙，说不出话来。\n\n李老师眼疾手快，赶紧跑过来，用正确的方法帮正正把积木拍了出来。积木"啪"地掉在地上，正正"哇"地大哭起来，又害怕又难受。\n\n刚才那一下，把正正和所有人都吓坏了。要是积木没弄出来，那可太危险了。\n\n李老师惊魂未定地说："正正，小东西绝对不能放进嘴里！积木、纽扣、小珠子这些小东西，一不小心卡进喉咙，会喘不上气，非常非常危险！"\n\n正正吓得脸都白了，一个劲地点头："我再也不敢了……"\n\n李老师给大家上了一堂重要的安全课："小朋友们记住，除了食物，任何东西都不能放进嘴里、鼻子里、耳朵里。尤其是小的东西，卡住了会有生命危险。"\n\n放学后妈妈知道了，后怕地抱住正正："吓死妈妈了！以后千万不能把玩具放嘴里！"\n\n正正认真地保证："我知道了，只有吃的东西才能放嘴里，玩具绝对不放。"\n\n从那以后，正正再也不把小东西放进嘴里了。他还成了班里的安全小提醒员，看到有小弟弟小妹妹想把玩具往嘴里放，他就赶紧制止："不能吃！会卡住的，很危险！"\n\n正正用那次惊险的经历，牢牢记住了：小东西不入口，安全最重要。'

{

  title: '【调皮鬼正正】第九十三集：不承认弄坏了东西',
  category: '成长',
  content: '正正玩球的时候，一脚把球踢飞了，"哗啦"一声，把窗台上的一盆花打翻了，花盆摔碎了。\n\n没有人看到。正正赶紧把球捡起来，装作什么都没发生，跑到一边去玩了。\n\n过了一会儿，李老师发现花盆碎了，问大家："是谁打碎了花盆呀？"\n\n大家都摇头。正正也低着头装作不知道，心里却怦怦直跳。\n\n因为找不到是谁弄的，李老师说："那今天大家都不能去户外玩了，因为要留在教室里查清楚这件事。"\n\n小朋友们都很失望，本来最喜欢户外活动了。大家你看看我，我看看你，因为一个人不承认，全班都被连累了。\n\n正正心里很不好受。他看到小朋友们因为自己失望的样子，越来越愧疚。\n\n最后，正正鼓起勇气站了起来："李老师，是我……是我踢球打碎了花盆。对不起，我一开始不敢承认。"\n\n李老师走过来，没有大声批评，而是说："正正，谢谢你最后能诚实地站出来。打碎花盆是不小心，可以原谅。但是不承认、让全班被连累，这样不好。如果你一开始就承认，大家早就能出去玩了。"\n\n正正惭愧地低下了头："对不起，连累大家了。"\n\n李老师说："知错就改还是好孩子。走，我们一起把碎片清理干净，然后大家去户外玩。"\n\n正正主动清理了碎片，还跟全班道了歉。小朋友们看他这么诚实，也原谅了他。\n\n从那以后，正正做错了事会第一时间承认，不再逃避。他明白了：逃避和隐瞒只会让事情更糟，还会连累别人；勇敢承认，虽然当时难为情，但能更快解决问题，也能赢得大家的原谅。'

  title: '【调皮鬼正正】第九十六集：不肯跟大家道歉',
  category: '成长',
  content: '正正不小心撞倒了小美搭的积木城堡。小美搭了好久，眼看就要完工了，一下子全塌了。\n\n"你赔我！"小美很生气。\n\n正正明明是自己撞的，却嘴硬："谁让你搭在这里的，又不是我故意的，我才不道歉！"\n\n小美气得哭了。正正梗着脖子，就是不肯说"对不起"。\n\n李老师走过来，了解了情况，对正正说："正正，你撞倒了小美的城堡，虽然不是故意的，但也应该说声对不起呀。"\n\n"又不是故意的，为什么要道歉！"正正还是不肯。\n\n李老师说："不是故意的，也给别人造成了损失和难过。一句真诚的\'对不起\',能让别人心里好受很多。道歉不丢人，反而说明你懂事、有担当。"\n\n正正还是别扭着不说。这时候，别的小朋友都不愿意跟他玩了——因为他做错了事还不道歉，太没礼貌了。\n\n正正一个人待着，觉得很孤单。他偷偷看着小美难过的样子，心里其实也不好受。\n\n终于，正正走到小美面前，小声说："小美……对不起，我撞倒了你的城堡。"\n\n小美抬起头："真的吗？"\n\n"真的。对不起。我陪你重新搭一个好不好？"\n\n小美笑了："好呀！"\n\n两个人一起重新搭了城堡，还搭得比原来更高更漂亮。正正发现，说出"对不起"以后，心里的别扭一下子没有了，反而轻松了。\n\n李老师说："看，一句对不起，就化解了矛盾，还多了一个朋友。道歉是一种勇气，也是一种礼貌。"\n\n从那以后，正正做错了事，会主动说"对不起"。他明白了：不管是不是故意的，只要给别人造成了麻烦或难过，就该真诚道歉。道歉不但不丢人，还能化解矛盾、赢得友谊。'
},
{
  id: 'zhengzheng_97',
  title: '【调皮鬼正正】第九十七集：把粉笔头扔来扔去',
  category: '成长',
  content: '李老师下课后，正正跑到讲台上，抓起一把粉笔头，当子弹一样扔来扔去。\n\n"接招！"正正把粉笔头扔向小朋友们。粉笔头砸在身上，还弄得到处都是白色的粉笔灰。\n\n有一个粉笔头正好扔进了乐乐的眼睛里，乐乐疼得捂着眼睛直流泪。粉笔灰进了眼睛，又疼又难受。\n\n李老师赶紧带乐乐去用清水冲洗眼睛。冲了好久，乐乐的眼睛才好受一点，但还是红红的。\n\n李老师非常严肃地对正正说："正正，粉笔头怎么能往人身上扔，还扔进了乐乐的眼睛！粉笔灰进眼睛很疼，弄不好会伤到眼睛的。眼睛多重要啊！"\n\n正正吓坏了，他没想到扔粉笔头会伤到乐乐的眼睛。\n\n看着乐乐红红的眼睛，正正很害怕也很后悔："对不起乐乐，我不该扔粉笔头……"\n\n李老师教育大家："任何东西都不能往人身上扔，尤其不能扔到脸上、眼睛上。眼睛非常脆弱，受伤了很难恢复。粉笔是用来写字的，不是用来扔的。"\n\n正正主动打扫了教室里的粉笔灰，还一直守在乐乐旁边，关心地问："你的眼睛好点了吗？"\n\n幸好，乐乐的眼睛冲洗后没有大碍，慢慢就不疼了。正正松了一口气。\n\n从那以后，正正再也不乱扔东西了，尤其记住了不能往人脸上、眼睛上扔任何东西。他还会提醒别人："别往脸上扔，会伤到眼睛的！"\n\n正正深深地记住了：眼睛是最宝贵的，一定要保护好，绝不能拿危险的行为开玩笑。'
},
{
  id: 'zhengzheng_98',
  title: '【调皮鬼正正】第九十八集：踢翻垃圾桶',
  category: '成长',
  content: '正正走过垃圾桶的时候，觉得踢一脚很好玩，"咚"地一脚把垃圾桶踢翻了。垃圾撒了一地——果皮、废纸、脏纸巾，又脏又臭。\n\n"哈哈，垃圾飞出来了！"正正觉得很好玩，扬长而去，也不收拾。\n\n教室里一下子变得又脏又臭。苍蝇都飞过来了。小朋友们捂着鼻子，都不愿意靠近那片脏乱的地方。\n\n李老师看到了，把正正叫回来："正正，是你踢翻的垃圾桶吧？你看，垃圾撒了一地，又脏又臭，还招来了苍蝇。大家都没法好好待了。"\n\n正正看着满地的垃圾，也觉得挺恶心的。\n\n"垃圾桶是用来装垃圾、保持教室干净的。你把它踢翻了，垃圾撒了一地，比原来脏一百倍。"李老师说，"现在你来把垃圾捡起来，重新装好。"\n\n正正只好戴上手套，一样一样地把撒出来的垃圾捡回垃圾桶。果皮黏糊糊的，脏纸巾臭烘烘的，正正捡得直皱眉头。捡了好久，还得把地面拖干净。\n\n"原来收拾垃圾这么脏这么累……"正正后悔极了。\n\n李老师说："保持干净很不容易，弄脏却只要一秒钟。垃圾桶是我们的好帮手，帮我们收集垃圾，应该爱护它，而不是踢翻它。"\n\n好不容易把地面收拾干净了，教室又变得整洁了。正正看着干净的教室，长舒了一口气。\n\n从那以后，正正不但不踢垃圾桶了，还会主动把垃圾扔进垃圾桶，看到垃圾桶满了会提醒老师。\n\n正正明白了：破坏很容易，收拾很辛苦。爱护公共物品、保持环境整洁，是每个人的责任。干净整洁的环境，需要大家一起维护。'
},
{
  id: 'zhengzheng_99',
  title: '【调皮鬼正正】第九十九集：学别人说话取笑人',
  category: '成长',
  content: '班里有个小朋友叫丁丁，说话有点结巴，一着急就"我我我……"半天说不出来。\n\n正正觉得好玩，就故意学丁丁说话："我我我……哈哈哈，你看丁丁说话多好笑！"他还带着别的小朋友一起学、一起笑。\n\n丁丁本来就因为说话结巴很自卑，被正正这么一学一笑，更难过了。他低着头，眼泪在眼眶里打转，从此更不敢开口说话了。\n\n李老师发现了，把正正叫过来，很认真地说："正正，丁丁说话结巴，不是他的错，他自己也很着急。你学他、笑他，会让他更自卑、更难过。这是很伤人的。"\n\n正正还没觉得有什么："我就是觉得好玩嘛。"\n\n李老师说："那老师问你，如果有人因为你跑步慢就天天学你、笑你，你开心吗？"\n\n正正跑步是最慢的，最怕别人说这个。他摇摇头："不开心。"\n\n"丁丁也一样。每个人都有自己的不足，不应该被取笑。而且，丁丁说话结巴，我们更应该耐心听他说完，鼓励他，而不是笑他。"\n\n正正想起丁丁难过的样子，很惭愧。\n\n第二天，正正主动找到丁丁："对不起，我不该学你说话取笑你。"他还耐心地听丁丁把话说完，一点都不着急，"你慢慢说，我等你。"\n\n在正正和大家的鼓励下，丁丁不那么紧张了，说话反而流利了一些，也慢慢开朗起来。\n\n李老师说："正正，你从取笑丁丁到鼓励丁丁，进步真大。每个人都需要被尊重、被鼓励。"\n\n从那以后，正正再也不取笑别人的缺点了。他懂得了：每个人都有不足，取笑别人的缺点是很残忍的。对有困难的人，我们应该多一点耐心、多一点鼓励，而不是嘲笑。善待别人，才是真正的善良。'
},
{
  id: 'zhengzheng_100',
  title: '【调皮鬼正正】第一百集：正正学会了将心比心',
  category: '成长',
  content: '这段时间，正正犯了好多错，也改了好多。他渐渐发现，自己每次犯错，都是因为只顾自己开心，没有想过别人的感受。\n\n这一天，李老师给大家讲了一个道理："小朋友们，做任何事情之前，都可以先想一想——如果这件事发生在我身上，我会是什么感觉？这叫\'将心比心\'。"\n\n正正听了，若有所思。\n\n他想起自己把橡皮泥粘在小美头发上——如果别人把橡皮泥粘我头上，我会很生气。他想起自己绊倒乐乐——如果别人绊我，摔得那么疼，我会很难过。他想起自己取笑丁丁——如果别人笑我跑得慢，我会很自卑。\n\n"原来，只要我做事之前想一想别人的感受，就不会做那些伤害别人的事了！"正正恍然大悟。\n\n从那以后，正正做事之前都会先想一想：这样做，别人会开心还是难过？会不会伤害到别人？\n\n想拿别人的东西时，他会想："如果别人不问我就拿我的东西，我会不高兴。"于是他学会了先征求同意。\n\n想恶作剧时，他会想："如果别人这样吓我、捉弄我，我会害怕难过。"于是他忍住了。\n\n慢慢地，正正变成了一个会为别人着想的好孩子。小朋友们都喜欢跟他玩，因为他不再捉弄人、伤害人了，还很体贴。\n\n李老师在班里表扬正正："正正最大的进步，就是学会了将心比心。一个会为别人着想的孩子，才是真正长大了、懂事了。"\n\n正正不好意思地笑了。他把"将心比心"这四个字记在了心里。\n\n这天放学，正正对妈妈说："妈妈，我学会了一个本领——做事情之前先想想别人的感受。这样我就不会惹祸、不会伤害别人了。"\n\n妈妈欣慰地抱住他："我们正正真的长大了。这是最重要的本领，比什么都珍贵。"\n\n从那以后，那个爱惹祸的调皮鬼正正，慢慢变成了一个善良、体贴、人人喜爱的好孩子。因为他懂得了：世界上最重要的事情之一，就是学会站在别人的角度，为别人着想。'
},
{

  content: '上课的时候，正正的手总是闲不住。一会儿玩橡皮，一会儿抠桌子，一会儿转笔，一会儿又去戳前面小朋友的后背。\n\n李老师在讲小蝌蚪找妈妈的故事，讲得可有意思了。可是正正一点都没听——他忙着把橡皮切成一小块一小块的。\n\n讲完故事，李老师问："小蝌蚪最后找到妈妈了吗？它的妈妈是谁呀？"\n\n小朋友们都举手："青蛙！小蝌蚪的妈妈是青蛙！"\n\n只有正正答不上来。他刚才光顾着玩橡皮，根本没听故事。\n\n"正正，你知道答案吗？"李老师问。\n\n正正摇摇头，脸红了。\n\n放学的时候，别的小朋友都能回家给爸爸妈妈讲小蝌蚪找妈妈的故事，只有正正讲不出来。\n\n"妈妈，今天老师讲了什么故事？"正正想讲又讲不出来，很懊恼。\n\n李老师悄悄跟正正说："你看，上课做小动作，就错过了这么好听的故事。手闲不住的时候，可以把手放在腿上，或者轻轻握起来，专心听讲。"\n\n第二天上课，正正努力把手放在腿上，专心听李老师讲故事。这次讲的是三只小猪。正正听得津津有味，还举手回答了问题。\n\n放学回家，正正兴奋地给妈妈讲了三只小猪盖房子的故事，讲得绘声绘色。\n\n"专心听讲原来能学到这么多好东西！"正正发现，认真听讲比做小动作有意思多了。'
},
{
  id: 'zhengzheng_106',
  title: '【调皮鬼正正】第一百零六集：抢玩具不排队',
  category: '成长',
  content: '幼儿园新到了一辆很酷的玩具消防车，红红的，还会响铃。所有小朋友都想玩。\n\n老师说："大家排队轮流玩，一个人玩三分钟。"\n\n小朋友们乖乖排起了队。可是正正不排队，直接冲过去一把抢过了消防车。"我先玩！我先玩！"\n\n排在最前面的小雨都快哭了："我排了好久了……"\n\n正正抱着消防车不撒手，玩了好久好久都不还。后面排队的小朋友等啊等，一个都玩不到。\n\n李老师走过来，把消防车轻轻拿了回来。"正正，你抢玩具还不排队，后面这么多小朋友都玩不到。今天你最后一个玩。"\n\n正正被排到了队伍的最后面。他看着前面一个一个小朋友都玩到了消防车，每个人都玩得好开心。轮到正正的时候，已经快放学了，他只玩了一分钟就得回家了。\n\n"为什么我只能玩一分钟……"正正很沮丧。\n\n"因为你不排队抢玩具，所以要排到最后。如果大家都像你一样抢，那玩具就会被抢坏，谁也玩不成。"李老师说，"排队虽然要等，但每个人都能公平地玩到。"\n\n第二天又有小朋友玩滑板车。这次正正乖乖排到了队伍后面。虽然等了一会儿，但轮到他的时候他玩得可开心了，后面的小朋友也在等着，大家都很有秩序。\n\n正正明白了：排队等一等，人人都有份；抢来抢去，最后大家都不开心。'
},
{
  id: 'zhengzheng_107',
  title: '【调皮鬼正正】第一百零七集：不肯午睡',
  category: '成长',
  content: '午睡时间到了，小朋友们都躺在小床上闭眼睛。只有正正睡不着，也不想睡。\n\n他悄悄爬起来，在教室里走来走去。他觉得午睡是浪费时间——"我一点都不困，为什么要睡觉？"\n\n正正玩了一会儿积木，又翻了翻图画书，还偷偷吃了一块饼干。他觉得不睡觉真好，可以玩这么多东西。\n\n可是到了下午，问题来了。做游戏的时候，正正打起了瞌睡，跑着跑着差点摔倒。画画的时候，他趴在桌子上睡着了，口水流了一画纸。唱歌的时候，别的小朋友精神饱满，正正却打了一个又一个哈欠。\n\n"正正怎么没精神呀？"李老师问。\n\n正正揉着眼睛："我好困……"\n\n"因为你中午没睡午觉呀。"李老师说，"午睡是为了让身体休息，下午才有精神玩耍和学习。你中午不睡，下午就没力气了。你看别的小朋友睡了午觉，现在多有精神。"\n\n正正看看周围——小朋友们又蹦又跳，就他一个人蔫蔫的，像霜打的茄子。\n\n第二天午睡，正正试着闭上眼睛躺好。躺着躺着，他真的睡着了。\n\n下午起床，正正觉得浑身有劲，跑得比谁都快，玩得比谁都开心。\n\n"原来睡了午觉下午这么有精神！"正正这才明白，午睡不是浪费时间，是给身体充电呢。从那以后他乖乖午睡了。'
},
{
  id: 'zhengzheng_108',
  title: '【调皮鬼正正】第一百零八集：把颜料抹在墙上',
  category: '成长',
  content: '美术课上，正正觉得在纸上画画太没意思了。他把手指伸进颜料盒，蘸了红的、蓝的、黄的，然后往教室的白墙上抹。\n\n"看！我在墙上画画！"正正在墙上抹出了乱七八糟的一大片。\n\n其他小朋友也想学，但李老师及时制止了。她看着被弄脏的白墙，很严肃："正正，墙是大家的，不是用来乱涂的。你把墙弄脏了，别的班的小朋友看到会觉得我们班不爱干净。"\n\n正正还觉得挺好看："可是我觉得很漂亮呀。"\n\n"那我们一起把它擦掉，你就知道了。"李老师拿来了抹布和水桶。\n\n正正开始擦墙。颜料干在墙上很难擦，红色的印子怎么擦都擦不掉。正正擦了一个下午，胳膊酸得抬不起来，墙上还是留着淡淡的颜色印子。\n\n"擦不掉了……"正正快哭了。\n\n李老师说："对呀，有些东西弄脏了就很难恢复原样了。想画画，纸上、画板上都可以画，为什么要画在墙上呢？"\n\n正正看着自己怎么也擦不干净的墙，特别后悔。\n\n后来学校请人重新把墙刷白，花了好多钱。正正知道后更内疚了。\n\n从那以后正正只在纸上和画板上画画。他还会提醒别的小朋友："不能在墙上画哦，擦不掉的，我试过！"想画大幅的画时，他就用好几张纸拼在一起画。'
},
{
  id: 'zhengzheng_109',
  title: '【调皮鬼正正】第一百零九集：抢着说话不举手',
  category: '成长',
  content: '李老师上课提问："谁知道天上会飞的动物有哪些？"\n\n正正不举手，直接大声喊出来："鸟！蝴蝶！蜜蜂！"他一个人把答案全喊了，别的小朋友都没机会说。\n\n其他小朋友刚举起手，正正又抢着喊："还有蜻蜓！还有蝙蝠！"\n\n教室里乱哄哄的，因为正正一直插嘴，别的小朋友都插不上话，慢慢地大家都不举手了。\n\n李老师停了下来："正正，上课要先举手，老师叫到你才能回答。你一直抢着说，别的小朋友就没机会了。而且大家一起喊，教室就乱了，谁也听不清。"\n\n正正不服气："可是我知道答案嘛！"\n\n"知道答案是好事。但要用正确的方式表达。你举手，老师看到你想回答，叫你的名字，你再说。这样才有秩序。"\n\n李老师又问了一个问题："水里游的动物有哪些？"\n\n这次正正忍住了，高高举起了手。可是他太想说了，屁股都从椅子上抬起来了，但就是没喊出来。\n\n"正正，你来回答。"李老师叫他。\n\n"鱼！还有乌龟！"正正终于说出来了，特别有成就感。\n\n"看，举手被叫到再回答，是不是更好？"\n\n正正点点头。他发现举手等老师叫，虽然要忍一忍，但被叫到名字回答问题的感觉，比乱喊神气多了。从那以后他学会了先举手。'
},
{
  id: 'zhengzheng_110',
  title: '【调皮鬼正正】第一百一十集：把鞋子藏起来',
  category: '成长',
  content: '午睡起来，小朋友们要穿鞋。正正趁大家不注意，把小胖的一只鞋子藏到了柜子后面。\n\n"我的鞋子呢？"小胖找不到鞋子，急得团团转。他只穿着一只鞋，一只脚光着，在教室里一瘸一拐地找。\n\n正正躲在旁边偷笑："哈哈，找不到了吧！"\n\n小胖找了好久都找不到，最后急得哭了。眼看要放学了，小胖妈妈来接他，看到儿子只穿一只鞋，还以为出了什么事。\n\n李老师帮着一起找，终于在柜子后面找到了。她看了看正正的表情，就知道是怎么回事了。\n\n"正正，是你藏的吧？"\n\n正正点点头。\n\n"你看小胖找鞋找得多着急，都哭了。他妈妈也担心了。你觉得好玩，可是给别人带来了这么多麻烦和难过。"\n\n正正看着小胖红红的眼睛，有点不好意思了。\n\n第二天，轮到正正倒霉了——不是别人藏他鞋，而是他自己把鞋忘在了操场。放学找不到鞋，正正也急得团团转，光着脚满校园找。那种着急的感觉，跟昨天的小胖一模一样。\n\n找到鞋以后，正正主动跟小胖道歉："对不起，昨天藏你鞋子。我今天自己丢了鞋，才知道找不到鞋有多着急。"\n\n小胖原谅了他。从那以后，正正再也不藏别人的东西了。因为他体会过了，找不到东西的那种又急又慌的感觉，真的很难受。'
},
{
  id: 'zhengzheng_111',
  title: '【调皮鬼正正】第一百一十一集：不洗手就吃东西',
  category: '成长',
  content: '玩完泥巴，又摸了地上的小虫子，正正的手黑乎乎的。到了吃点心的时间，李老师说："大家先去洗手。"\n\n小朋友们排队去洗手，只有正正嫌麻烦。"洗什么手，我的手又不脏。"他看着自己黑乎乎的手，直接抓起饼干就往嘴里塞。\n\n其他小朋友洗完手回来，干干净净地吃点心。正正呢，把脏手上的泥巴、细菌都吃进了肚子里。\n\n当天晚上，正正的肚子开始疼了。"哎哟哎哟，妈妈我肚子疼……"\n\n妈妈带他去看医生。医生说："吃了不干净的东西，细菌进了肚子，所以肚子疼。"正正被扎了针，还喝了苦苦的药，难受了一整晚。\n\n第二天正正没能去幼儿园，只能躺在家里养病。他错过了幼儿园的做游戏、听故事，一个人躺在床上好无聊。\n\n"都怪我没洗手……"正正后悔极了。\n\n病好了以后，正正回到幼儿园。这次吃点心前，他第一个跑去洗手，用肥皂搓得干干净净——手心手背、指头缝都洗到。\n\n"正正今天怎么这么爱洗手了？"李老师笑着问。\n\n"因为不洗手会肚子疼，还要打针喝苦药！"正正认真地说，"手上有看不见的细菌，会让人生病的。"\n\n从那以后正正养成了饭前洗手的好习惯。他还会提醒别的小朋友："吃东西前一定要洗手哦，不然细菌进肚子会生病的！"'
},
{
  id: 'zhengzheng_112',
  title: '【调皮鬼正正】第一百一十二集：给小朋友起外号',
  category: '成长',
  content: '班上有个小朋友个子胖胖的，叫壮壮。正正给他起了个外号叫"大肉包"。\n\n"大肉包！大肉包！"正正一看到壮壮就这么叫，还带着别的小朋友一起叫。\n\n壮壮很难过，低着头不说话。他本来很爱笑的，现在一到幼儿园就闷闷不乐。\n\n有一天，壮壮不想来幼儿园了。他跟妈妈说："他们都叫我大肉包，我不想去了……"\n\n李老师知道了这件事。她把正正叫过来，没有直接批评他，而是问："正正，如果有人天天叫你\'招风耳\'，你开心吗？"\n\n正正的耳朵确实有点大，他最怕别人说这个了。"不开心！我讨厌别人说我耳朵！"\n\n"那壮壮被叫\'大肉包\'，他开心吗？"\n\n正正愣住了。他想起壮壮低着头难过的样子。"他……他肯定也不开心。"\n\n"每个人都有自己不喜欢被说的地方。起外号取笑别人，会让人很受伤。壮壮都不想来幼儿园了，你知道吗？"\n\n正正没想到一个外号会让壮壮这么难过。他低下了头。\n\n第二天，正正主动找到壮壮："对不起，我不该叫你大肉包。以后我叫你壮壮，好不好？"\n\n壮壮抬起头，眼睛亮了："真的吗？"\n\n"真的！而且你力气大，可以帮大家搬东西，可厉害了！"\n\n壮壮笑了。从那以后正正再也不给人起难听的外号了。他学会了用真名字叫人，还会发现每个小朋友的优点。班里又变得和和气气的了。'
},
{
  id: 'zhengzheng_113',
  title: '【调皮鬼正正】第一百一十三集：把画画本撕坏',
  category: '成长',
  content: '正正和乐乐因为一支蓝色蜡笔吵了起来。两个人都想用。\n\n"给我！""是我先拿的！"\n\n正正抢不过，一气之下，抓起乐乐的画画本"哗啦"撕了两页！乐乐画了好久的画被撕坏了。\n\n"我的画！"乐乐大哭起来。那是他准备送给妈妈的生日礼物。\n\n正正一开始还嘴硬："谁让你不给我蜡笔！"\n\n李老师走过来，捡起被撕坏的画。"正正，你看，乐乐画了这么久的画，被你一下子撕坏了。生气可以，但不能撕别人的东西、伤害别人。"\n\n正正看着地上的碎纸片，慢慢冷静下来。乐乐哭得那么伤心，那幅画再也拼不回去了。\n\n"生气的时候，可以跟老师说，可以深呼吸，可以数一二三。但绝对不能动手破坏东西、打人。"李老师说。\n\n正正很后悔。他捡起碎纸片，想帮乐乐把画拼回去，可是撕坏的画怎么也拼不好了。\n\n"对不起乐乐……我帮你重新画一张好不好？"\n\n正正陪着乐乐重新画了一张送给妈妈的画。他帮乐乐涂颜色、画小花，画了整整一个下午。\n\n新画画好了，比原来的还漂亮。乐乐终于笑了。\n\n从那以后，正正生气的时候会先深呼吸，数到十。他记住了：生气是可以的，但绝不能因为生气就去破坏东西、伤害别人。'
},
{
  id: 'zhengzheng_114',
  title: '【调皮鬼正正】第一百一十四集：故意踩水坑溅人',
  category: '成长',
  content: '下过雨，地上有好多水坑。正正最喜欢踩水坑了——"啪唧！啪唧！"\n\n可是他不光自己踩，还故意踩到有小朋友经过的地方，把泥水溅到别人身上。\n\n小美穿着漂亮的白裙子走过，正正"啪"地一脚踩进旁边的水坑，泥水溅了小美一身。\n\n"呀！我的裙子！"小美的白裙子上全是泥点子。\n\n正正哈哈大笑："哈哈，变成花裙子了！"\n\n小美委屈地哭了。李老师走过来，看到小美脏兮兮的裙子。\n\n"正正，踩水坑可以，但不能溅到别人身上。小美的裙子脏了，回家还要辛苦妈妈洗，而且她今天要一直穿着脏裙子，多难受。"\n\n正正还没觉得有什么。\n\n结果，走着走着，另一个调皮的小朋友也踩水坑，把泥水溅到了正正身上。正正的衣服、裤子、脸上全是泥点子，凉冰冰、脏兮兮的，可难受了。\n\n"喂！你把我弄脏了！"正正生气地喊。\n\n李老师走过来说："现在你知道被溅一身泥的感觉了吧？这就是小美刚才的感觉。"\n\n正正低下了头。凉凉的泥水贴在身上真难受，而且脏兮兮的一整天都不舒服。\n\n"对不起小美……"正正真心地道歉。\n\n从那以后，正正踩水坑的时候会看看周围有没有人，专门找没人的水坑踩，绝不溅到别人。他知道了，自己的快乐不能建立在别人的难受上。'
},
{
  id: 'zhengzheng_115',
  title: '【调皮鬼正正】第一百一十五集：不收拾玩具',
  category: '成长',
  content: '正正最爱玩积木了。他把一大盒积木全倒出来，搭了城堡、汽车、火车。玩得可开心了。\n\n可是玩完以后，李老师说："大家把玩具收拾好，放回原位。"\n\n正正才不收拾呢，他把积木一扔就跑去玩别的了。地上撒了满满一地的积木。\n\n结果，别的小朋友走过来的时候，"哎哟！"踩到了积木，摔了一跤。还有小朋友被积木硌得脚疼。\n\n到了放学，李老师说："玩具没收好的小朋友，不能回家哦。"\n\n大家都收好了自己的玩具，只有正正撒了一地。正正只好一个人蹲在地上收拾。这么多积木，一颗一颗捡回盒子里，捡了好久好久。\n\n别的小朋友都被爸爸妈妈接走了，正正还在收拾，妈妈在门口等得着急。\n\n"为什么别人都走了，就我还在这里……"正正一边捡一边嘟囔。\n\n"因为别人玩完都收好了，只有你没收。"李老师说，"玩具玩完要放回原位，这样下次才好找，地上也不会绊倒人。收拾是自己的责任。"\n\n正正终于把积木都收好了。他发现，如果玩的时候就一样一样收，其实很快。可是全堆在一起最后一起收，就特别累。\n\n第二天，正正玩完积木，主动一颗一颗收回了盒子里，摆得整整齐齐。\n\n"正正真棒，会自己收拾玩具了！"李老师表扬他。\n\n正正得意地笑了。他现在明白了：自己拿出来的东西，要自己放回去。'
},
{
  id: 'zhengzheng_116',
  title: '【调皮鬼正正】第一百一十六集：撒谎说没打人',
  category: '成长',
  content: '正正和小明抢秋千，正正推了小明一把，小明摔倒了，膝盖磕破了皮。\n\n李老师问："小明怎么摔倒的？"\n\n正正赶紧说："不是我！他自己摔的！我没碰他！"\n\n可是旁边好几个小朋友都看到了："是正正推的！我们都看到了！"\n\n正正还嘴硬："我没有！你们乱说！"\n\n李老师看着正正，很认真地说："正正，做错了事不可怕，可怕的是说谎。你推了小明，这是一个错。你又说谎不承认，这是第二个错。两个错加在一起，比一个错严重多了。"\n\n正正的脸红了，低下了头。\n\n"如果你一开始就承认\'是我推的，对不起\'，老师会觉得你是个诚实的孩子。可是你说谎，老师就没办法相信你说的话了。以后你说真话，别人也会怀疑。"\n\n正正想了想，说谎被拆穿的感觉真难受，比认错还丢脸。他小声说："对不起……是我推的。我不该撒谎。"\n\n"这就对了。"李老师说，"知错能改，还是好孩子。"\n\n正正扶起小明，帮他吹了吹磕破的膝盖，还陪他去医务室贴了创可贴。\n\n从那以后，正正做错了事会主动承认。他发现，诚实地说"对不起，是我错了"，虽然当时有点难为情，但心里踏实，大家也更信任他了。说谎才是最累最丢脸的。'
},
{
  id: 'zhengzheng_117',
  title: '【调皮鬼正正】第一百一十七集：把零食藏起来独吃',
  category: '成长',
  content: '正正的妈妈给他带了一大包好吃的饼干到幼儿园。分享时间到了，老师鼓励大家把带来的零食分给好朋友一起吃。\n\n可是正正不想分。他偷偷把饼干藏到了柜子里，趁没人的时候一个人躲在角落里吃。\n\n别的小朋友都在分享——小美分了糖果，乐乐分了果冻，大家你一口我一口，吃得可开心了，还一起玩得热热闹闹的。\n\n正正一个人躲在角落里吃饼干，吃着吃着觉得没意思。别人分享的时候有说有笑，就他一个人。而且他吃不完那么多饼干，最后饼干受潮变软了，不好吃了。\n\n第二天，小美带了草莓，分给了每个小朋友，就是没分给正正。乐乐带了巧克力，也没给正正。\n\n"为什么不分给我？"正正问。\n\n小美说："因为昨天你的饼干没有分给我们呀。"\n\n正正这才明白，原来分享是互相的。他昨天独吃，今天别人就不愿意分给他了。\n\n正正想起自己一个人躲着吃的孤单，又看看别人分享时的热闹开心，他懂了。\n\n第三天，正正带了一大包山楂片，主动分给了每一个小朋友。"给你！给你！大家一起吃！"\n\n小朋友们都很开心，也把自己的零食分给了正正。大家围坐在一起，分享着各种各样的零食，有说有笑。\n\n正正吃着大家分享的零食，心里美滋滋的。他发现：一个人独吃，味道再好也孤单；和大家分享，普通的零食也变得特别香甜。分享的快乐，比独吃多得多。'
},
{
  id: 'zhengzheng_118',
  title: '【调皮鬼正正】第一百一十八集：故意大声吵闹',
  category: '成长',
  content: '午睡的时候，别的小朋友都睡着了，教室里静悄悄的。正正睡不着，觉得太安静了没意思。\n\n他故意大声喊："啊——！"把好几个小朋友吵醒了。\n\n正正觉得好玩，又敲桌子，又唱歌，还学怪兽叫。教室里被他搞得乱糟糟的，好多小朋友都被吵醒了，揉着眼睛起来。\n\n李老师走过来，轻声但严肃地说："正正，你看，大家都被你吵醒了。他们睡不好，下午就没精神。你自己不困，也要安静，不能打扰别人休息。"\n\n正正被单独带到了活动室。"你在这里待着，等大家午睡结束再回去。"\n\n正正一个人在活动室里，没有小伙伴，什么也不能玩，特别无聊。他这才发现，一个人待着真没意思。\n\n午睡结束了，正正回到教室。可是这天下午，因为好几个小朋友被他吵得没睡好，做游戏的时候都没什么精神，游戏没玩起来。正正想找小朋友玩，大家都蔫蔫的。\n\n"都怪我把大家吵醒了……"正正有点内疚。\n\n李老师说："在需要安静的地方就要安静，比如午睡时、上课时、图书馆里。这是对别人的尊重。你想说话想玩，可以等到该玩的时候。"\n\n正正记住了。第二天午睡，他就算睡不着，也安安静静地躺着，不发出声音。慢慢地，他自己也睡着了。\n\n下午起来，全班小朋友都精神饱满，一起玩了好玩的游戏。正正玩得特别开心，他明白了：安静的时候保持安静，大家才能一起享受热闹的时候。'
},
{
  id: 'zhengzheng_119',
  title: '【调皮鬼正正】第一百一十九集：不好好穿衣服',
  category: '成长',
  content: '天气变冷了，李老师提醒大家：户外活动要穿好外套。\n\n正正嫌穿外套麻烦，把外套一甩扔在了椅子上。"我不冷！穿外套多难受！"他就穿着单薄的小衬衫跑出去玩了。\n\n外面风很大，别的小朋友都穿着暖暖的外套，只有正正冻得瑟瑟发抖，鼻涕都流出来了。可他还嘴硬："我不冷！"\n\n玩着玩着，正正冷得受不了了，缩着脖子，抱着胳膊，一点都玩不起来了。\n\n李老师把他的外套拿出来："快穿上吧，别冻感冒了。"\n\n正正这次乖乖穿上了外套。暖和多了，他又能开心地玩了。\n\n可是已经晚了。当天晚上，正正就打起了喷嚏，第二天发起了烧，感冒了。他难受得躺在床上，头晕晕的，还得喝苦药。\n\n"都怪我不穿外套……"正正难受地说。\n\n生病的这几天，正正没能去幼儿园，一个人在家躺着，又无聊又难受。他好想念幼儿园的小伙伴啊。\n\n病好了回到幼儿园，正正学乖了。天冷了，他会主动穿上外套；出汗了，会先擦干再脱；下雨了，会记得带伞。\n\n"正正现在知道照顾自己了。"李老师表扬他。\n\n正正认真地说："因为不穿外套会感冒，感冒可难受了，还不能来幼儿园玩！"\n\n从那以后，正正学会了根据天气照顾自己——冷了加衣，热了减衣。他知道了，好好穿衣服不是麻烦，是在保护自己的身体。'
},
{
  id: 'zhengzheng_120',
  title: '【调皮鬼正正】第一百二十集：抢着开门撞到人',
  category: '成长',
  content: '每次进出教室，正正都要抢着第一个冲过去开门。"我来开门！我来！"\n\n他不管三七二十一，用力一推门——"砰！"门正好撞到了后面走过来的小雨，把小雨的鼻子撞红了。\n\n小雨捂着鼻子哭了。李老师赶紧过来看。"正正，开门要慢慢开，先看看门后面有没有人。你这样猛推门，很容易撞到人。"\n\n正正没在意："我又不是故意的。"\n\n结果没过几天，另一个小朋友抢着开门，"砰"地一下正好撞到了正正的脑袋。正正疼得直捂脑袋，眼泪都出来了。\n\n"哎哟！好疼！谁开的门！"\n\n李老师走过来说："现在你知道被门撞的滋味了吧？这就是那天小雨的感觉。"\n\n正正揉着脑袋，想起了那天被自己撞哭的小雨。"原来被门撞这么疼……对不起小雨。"\n\n李老师教大家开门的正确方法："开门的时候慢一点，先看看门后有没有人，轻轻地开。进门以后，如果后面还有人，要扶着门等一下，别让门弹回去撞到人。"\n\n正正学会了。以后开门他都会先喊一声"我要开门啦"，然后慢慢地推，还会回头看看后面有没有小朋友。进门后他会帮后面的人扶着门。\n\n"谢谢正正帮我扶门！"小朋友们都夸他。\n\n正正美滋滋的。他发现，慢慢开门、帮别人扶门，不但不会撞到人，还能得到大家的感谢。原来礼貌又安全的方式，比抢着冲更好。'
},
{
  id: 'zhengzheng_121',
  title: '【调皮鬼正正】第一百二十一集：乱丢纸屑',
  category: '成长',
  content: '正正吃完糖，随手把糖纸一扔。撕了张纸，随手一扔。用完的纸巾，也随手一扔。教室的地上到处都是他丢的垃圾。\n\n"正正，垃圾要扔到垃圾桶里。"李老师提醒他。\n\n"垃圾桶那么远，扔地上多方便。"正正满不在乎。\n\n可是慢慢地，正正周围变得又脏又乱，全是纸屑。别的小朋友都不愿意坐在他旁边了。\n\n有一天，李老师组织大家玩"寻宝游戏",把小卡片藏在教室各处。可是正正丢的纸屑太多了，卡片混在纸屑里根本找不到。因为地上太脏，游戏没法好好玩。\n\n"都是谁乱丢的垃圾呀，把游戏都搞乱了。"小朋友们抱怨。\n\n正正的脸红了——都是他丢的。\n\n李老师说："正正，你看，你乱丢垃圾，不但自己周围脏，还影响了大家。今天你负责把教室的垃圾都捡起来，扔到垃圾桶。"\n\n正正拿着垃圾袋，一片一片地捡纸屑。捡了好多好多，装了大半袋。捡得腰都酸了。\n\n"原来我丢了这么多垃圾……"正正自己都吓了一跳。\n\n捡完垃圾，教室变得干干净净的。正正看着整洁的教室，心里舒服多了。\n\n李老师说："你看，干净的教室多舒服。垃圾桶虽然远几步，但走过去扔掉，就能保持干净。"\n\n从那以后，正正养成了好习惯——垃圾一定扔进垃圾桶，哪怕多走几步。他还会捡起地上别人丢的垃圾。教室里，正正的座位周围总是最干净的。'
},
{
  id: 'zhengzheng_122',
  title: '【调皮鬼正正】第一百二十二集：假装肚子疼骗人',
  category: '成长',
  content: '今天有正正最不喜欢的跳舞课。正正不想跳，就假装肚子疼："哎哟，我肚子好疼，不能跳舞……"\n\n李老师关心地让他在旁边休息。正正躲过了跳舞课，心里偷着乐。\n\n可是接下来是他最喜欢的做游戏时间。正正兴奋地想去玩——可是李老师说："你肚子疼，还是在旁边休息吧，别玩得太累。"\n\n正正只能眼巴巴地看着别的小朋友做游戏，自己不能玩。他后悔死了。\n\n更糟糕的是，因为"肚子疼",李老师给正正妈妈打了电话。妈妈担心地提前来接他，还带他去看了医生。\n\n医生检查了半天："肚子没问题呀。"\n\n妈妈这才知道正正是装的。回到家，妈妈很严肃地说："正正，你为了不跳舞就装病，害妈妈担心，还耽误了大家。而且——如果你以后真的肚子疼，喊\'狼来了\',大家还会相信你吗？"\n\n正正想起了狼来了的故事——那个总是撒谎的放羊娃，最后真的有狼来了，没人相信他。\n\n正正低下了头："对不起，我以后不装病了。"\n\n"不喜欢跳舞可以跟老师说，我们一起想办法。但不能装病骗人。"妈妈说。\n\n第二天，正正跟李老师说了实话："老师，其实我不太会跳舞，怕跳不好被笑话。"\n\n李老师笑了："没关系，跳舞不用跳得多好，开心就行。老师教你，慢慢来。"\n\n正正试着跳了跳，发现其实挺好玩的，也没人笑他。从那以后，正正有什么想法都直接说，再也不装病骗人了。他知道了，诚实的孩子才能被信任。'
},
{
  id: 'zhengzheng_123',
  title: '【调皮鬼正正】第一百二十三集：抢别人的座位',
  category: '成长',
  content: '每个小朋友都有自己固定的座位，上面贴着名字。可是正正觉得靠窗的座位好，能看到外面的风景。\n\n那个靠窗的座位是小美的。趁小美还没来，正正一屁股坐了上去。"这个位置归我了！"\n\n小美来了，发现自己的座位被占了。"这是我的座位呀……"\n\n"先到先得！"正正赖着不走。\n\n小美只好委屈地坐到了正正的座位上。可是那样一来，正正的东西和小美的东西都乱了，小美找不到自己的蜡笔，正正也找不到自己的书。上课的时候乱成一团。\n\n李老师发现了："正正，为什么坐在小美的座位上？"\n\n"我喜欢靠窗的位置。"\n\n"每个人的座位都是安排好的，上面有名字。你坐了小美的座位，小美就没地方坐了，东西也乱了。这样对小美公平吗？"\n\n正正想了想，如果自己的座位被别人占了，自己也会不高兴的。\n\n"而且，"李老师说，"如果你真的喜欢靠窗的位置，可以跟老师说，跟小美商量,而不是直接抢。"\n\n正正回到了自己的座位，跟小美道了歉。\n\n后来李老师说，每周会轮换座位，让每个小朋友都有机会坐靠窗的位置。正正很期待轮到自己。\n\n轮到正正坐靠窗座位那周，他特别开心，看着窗外的大树和小鸟。他发现，用商量和等待得到的，比抢来的更让人安心。\n\n从那以后，正正不抢别人座位了。想要什么会好好说、好好商量。他明白了：每个人的东西都要被尊重，不能仗着"先到"就抢占。'
},
{
  id: 'zhengzheng_124',
  title: '【调皮鬼正正】第一百二十四集：不听指挥乱跑',
  category: '成长',
  content: '今天幼儿园组织去公园春游。李老师再三叮嘱："大家要跟着队伍走，不能乱跑，要拉着旁边小朋友的手。"\n\n可是正正一到公园就撒开手，东跑西跑。看到蝴蝶追蝴蝶，看到小鸟追小鸟，一会儿就不见了踪影。\n\n李老师数人数的时候发现少了一个——正正不见了！\n\n老师和小朋友们都很着急，到处找正正。"正正！正正！你在哪里？"\n\n正正呢？他追蝴蝶追到了一片陌生的树林，回头一看——找不到老师和小朋友了！\n\n正正害怕极了，周围一个认识的人都没有，他大声哭了起来："老师……妈妈……我找不到你们了……"\n\n正正一个人在陌生的地方，又怕又急，蚊子咬，太阳晒，还担心遇到坏人。他从来没有这么害怕过。\n\n幸好李老师最后在树林里找到了正正。看到老师，正正一下子扑进老师怀里大哭："老师！我好害怕！"\n\n"正正，这就是不听指挥乱跑的后果。"李老师抱着他说，"如果老师没找到你，你自己在陌生的地方多危险呀。集体出去，一定要跟着队伍。"\n\n正正吓得不轻，紧紧拉着老师的手，再也不敢乱跑了。\n\n接下来的春游，正正乖乖跟着队伍，拉着小伙伴的手，一步都不敢乱走。虽然看到蝴蝶也想追，但他忍住了，只是用眼睛看。\n\n从那以后，正正明白了：集体活动跟着队伍走，不是不自由，是为了安全。走丢的那种害怕，他再也不想经历第二次了。'
},
{
  id: 'zhengzheng_125',
  title: '【调皮鬼正正】第一百二十五集：嘲笑摔倒的小朋友',
  category: '成长',
  content: '跑步的时候，小胖不小心摔了一跤，趴在地上。\n\n正正指着小胖哈哈大笑："哈哈！小胖摔了个大屁墩！好好笑！"他还叫别的小朋友一起看："快看快看，小胖摔跤了！"\n\n小胖趴在地上，膝盖摔破了，又疼又难为情，眼泪在眼眶里打转。\n\n李老师赶紧扶起小胖，一边帮他吹伤口，一边看着正正："正正，别人摔倒了受伤了，你不去帮忙，还嘲笑他，这样对吗？"\n\n正正还在笑："可是他摔的样子很好笑嘛。"\n\n结果，就在当天下午，正正自己跑得太快，"扑通"也摔了一跤，膝盖也破了，摔得可疼了。\n\n这时候，有个小朋友学着正正的样子笑他："哈哈！正正摔了个大屁墩！"\n\n正正又疼又羞，眼泪一下子涌出来了。被人嘲笑的感觉太难受了。\n\n这时候，是小胖走过来，扶起了正正，还帮他吹了吹伤口："别哭，不疼不疼。"\n\n正正愣住了。他嘲笑过小胖，可小胖摔倒的时候，小胖却来帮他。\n\n正正惭愧极了："小胖，对不起……我不该笑你摔跤。"\n\n小胖说："没关系，摔跤谁都会摔的。"\n\n李老师说："正正，你现在知道了吧？别人有困难的时候，需要的是帮助，不是嘲笑。今天你摔倒，小胖帮了你，这就是善良。"\n\n从那以后，正正看到有小朋友摔倒或者遇到困难，第一反应不再是笑，而是跑过去问："你没事吧？我扶你。"\n\n他学会了善良——在别人难过、受伤的时候，伸出援手，而不是嘲笑。'
},
{
  id: 'zhengzheng_126',
  title: '【调皮鬼正正】第一百二十六集：玩火柴很危险',
  category: '成长',
  content: '正正在家里发现了一盒火柴。他觉得"嚓"地一下能点着火，好神奇好好玩。\n\n他偷偷拿了火柴，带到了幼儿园，想给小朋友们表演。"我会变火！你们看！"\n\n正正正准备划火柴，李老师眼疾手快，一下子把火柴收走了。"正正！火柴绝对不能玩！"\n\n李老师的表情从来没有这么严肃过。她把所有小朋友叫到一起，认真地说："小朋友们，火是很危险的东西。玩火柴、打火机，一不小心就会烧到自己，烧到衣服，甚至引起大火，把房子都烧掉。"\n\n李老师给大家看了一段消防安全的动画：小火苗一下子变成了大火，烧毁了房子，好可怕。\n\n正正吓得脸都白了。他没想到小小的火柴会这么危险。\n\n"火只能由大人使用，小朋友绝对不能碰火柴、打火机、蜡烛这些会着火的东西。"李老师说，"看到这些东西，要离远一点，还要告诉大人。"\n\n正正把火柴的事告诉了妈妈。妈妈也吓了一跳，把家里的火柴、打火机都收到了正正够不到的地方。\n\n"正正，你能主动告诉妈妈，很棒。"妈妈说，"但以后千万不能再碰这些东西了。火不是玩具，是很危险的。"\n\n正正用力点头。他把李老师教的记得牢牢的：不玩火，不玩电,不碰危险的东西。\n\n后来幼儿园做安全教育，正正还举手回答："火柴打火机不能玩！会引起火灾！"老师表扬了他。\n\n从那以后，正正成了小小安全员。看到有小朋友想玩危险的东西，他会赶紧制止："这个危险，不能玩！要告诉老师！"'
},
{
  id: 'zhengzheng_127',
  title: '【调皮鬼正正】第一百二十七集：说话不算话',
  category: '成长',
  content: '正正跟乐乐约好了，明天要把自己的恐龙玩具带来给乐乐玩。乐乐特别期待，晚上高兴得都睡不着。\n\n可是第二天，正正没带。"我忘了。"\n\n"那明天呢？"乐乐问。\n\n"明天一定带！我保证！"\n\n第二天，正正又没带。第三天，还是没带。乐乐每天满怀期待地等，每天都失望。\n\n后来，乐乐有一辆新的遥控汽车，正正特别想玩。"乐乐，借我玩玩你的遥控车吧！"\n\n乐乐摇摇头："不借。"\n\n"为什么呀？"\n\n"因为你说话不算话。你答应带恐龙给我玩，说了好多次都没带。你的话不能信。"\n\n正正愣住了。他这才发现，因为自己一次次说话不算话，乐乐已经不相信他了。\n\n李老师知道后说："正正，答应了别人的事就要做到，这叫守信用。你一次次不兑现承诺，别人就再也不相信你了。信任一旦没了，就很难再建立起来。"\n\n正正很后悔。他回家第一件事就是把恐龙玩具装进书包，怕再忘了。\n\n第二天，正正一到幼儿园就把恐龙玩具拿给乐乐："对不起，我说话不算话这么多次。这个恐龙给你玩，我以后答应的事一定做到。"\n\n乐乐很惊喜，两个人一起玩恐龙玩得很开心。慢慢地，乐乐又开始相信正正了。\n\n从那以后，正正答应别人的事，都会记在心里，努力做到。做不到的事，他就不轻易答应。他明白了：说话算话，别人才会信任你；一个守信用的人，才有真正的好朋友。'
},
{
  id: 'zhengzheng_128',
  title: '【调皮鬼正正】第一百二十八集：不尊重老师',
  category: '成长',
  content: '李老师在讲课，正正却在下面做鬼脸，学老师说话的样子，逗得旁边的小朋友哈哈笑。\n\n老师让大家安静，正正却故意大声接话；老师转身写字，正正就朝老师的背影扮鬼脸。\n\n李老师转过身，看到正正在扮鬼脸。她没有生气，只是有点难过地说："正正，老师每天认真地给你们准备好玩的课、好听的故事，是希望你们学到东西。你这样不尊重老师，老师心里很难过。"\n\n正正看到李老师难过的样子，愣了一下。他从来没想过老师也会难过。\n\n放学后，正正看到李老师还在教室里忙——她在给明天的手工课剪纸，剪了好多好多漂亮的小花，手指都磨红了。她还在批改小朋友们的画，给每一幅都画上小星星。\n\n"老师，你怎么还不回家？"正正问。\n\n"要给你们准备明天的课呀。"李老师笑着说，"明天教你们做纸花，你看漂亮吗？"\n\n正正看着那些精心剪的纸花，心里很不是滋味。原来老师为了他们，下班了还在辛苦地准备。而自己上课却扮鬼脸捣乱，不尊重老师。\n\n"老师，对不起……我上课不该扮鬼脸捣乱。"正正真心地说。\n\n李老师摸摸他的头："知道错了就好。老师不要求你们多听话，只希望你们上课认真一点，这是对老师劳动的尊重。"\n\n第二天上课，正正坐得端端正正，认真听讲，还帮老师发了本子。做纸花的时候，他做得特别认真。\n\n"老师，这朵纸花送给你，谢谢你每天教我们。"正正把自己做的纸花送给了李老师。\n\n李老师特别感动，笑得特别开心。正正也明白了：老师为大家付出了很多，尊重老师、认真上课，就是对老师最好的回报。'
},
{
  id: 'zhengzheng_129',
  title: '【调皮鬼正正】第一百二十九集：欺负新来的小朋友',
  category: '成长',
  content: '班里来了一个新小朋友，叫豆豆。豆豆刚来，什么都不熟悉，很害羞，一个人坐在角落里。\n\n正正不但不欢迎豆豆，还带头欺负他。"新来的什么都不会！"正正抢豆豆的橡皮，藏豆豆的书，还不让豆豆一起玩游戏。\n\n豆豆本来就害怕陌生环境，被正正这么一欺负，更难过了。他一个人躲在角落里，好几次都想哭。\n\n有一天，李老师给大家讲了一个故事："想象一下，如果你转到了一个新幼儿园，谁都不认识，你会是什么感觉？如果新同学都欺负你、不跟你玩，你会多难过？"\n\n正正想了想——如果是自己一个人去陌生的地方，谁都不认识，还被欺负……那太可怕了，太孤单了。\n\n正正看了看角落里孤零零的豆豆。他想起自己刚上幼儿园时，也是又害怕又想家。\n\n正正走到豆豆身边："豆豆，对不起，我不该欺负你。我们一起玩吧？"\n\n正正把豆豆拉进了游戏里，教他玩滑梯，带他认识班里的小朋友，还把自己的玩具分给豆豆玩。\n\n豆豆慢慢地不害羞了，脸上有了笑容。他悄悄跟正正说："谢谢你，正正。你是我在这里第一个朋友。"\n\n正正心里暖暖的。原来帮助别人、欢迎新朋友，这么让人开心。\n\n后来又有新小朋友来，正正总是第一个跑过去："你好！我叫正正！我带你熟悉这里！"他成了班里最热情的"小主人"。\n\n从那以后，正正明白了：新来的人最需要温暖和帮助。欺负别人只会让人难过，而友善待人，能收获真正的友谊。'
},
{
  id: 'zhengzheng_130',
  title: '【调皮鬼正正】第一百三十集：正正成了小榜样',
  category: '成长',
  content: '日子一天天过去，正正变了好多好多。\n\n他不再乱涂胶水、不再抢玩具、不再撒谎、不再嘲笑别人、不再乱丢垃圾……那些以前让老师头疼、让小朋友讨厌的坏毛病，正正一个一个都改掉了。\n\n这天，幼儿园要评选"进步之星"。李老师站在台上说："这学期进步最大的小朋友是——正正！"\n\n全班响起了热烈的掌声。正正简直不敢相信自己的耳朵——他以前可是有名的"调皮大王"呀！\n\n李老师说："正正刚来的时候，确实很调皮，犯了很多错。但是他每一次犯错以后都认真改正，越变越好。现在的正正，会排队、会分享、会帮助新同学、会尊重老师，还成了我们班的小小安全员。这就是最了不起的进步！"\n\n正正走上台，胸前戴上了闪闪发亮的"进步之星"奖章。\n\n放学后，正正把奖章给妈妈看："妈妈！我得了进步之星！"\n\n妈妈又惊又喜，把正正抱了起来："我们正正真的长大了！妈妈为你骄傲！"\n\n正正想起了这段时间——因为犯错被老师批评过，被妈妈打过屁股，也哭过、后悔过。但正是这些，让他明白了什么该做、什么不该做。\n\n"妈妈，"正正认真地说，"我以后还会调皮吗？"\n\n妈妈笑了："也许还会犯一些小错误，因为你还是个孩子嘛。但没关系，只要你像现在这样，犯了错就改，你就会一直进步。"\n\n正正用力点头。他把"进步之星"奖章挂在了床头，每天睡觉前看一看。\n\n第二天，一个新来的小朋友怯生生地站在门口。正正第一个跑过去，笑着伸出手："你好！我叫正正！欢迎来到我们班！以后我们就是好朋友啦！"\n\n阳光照进教室，正正的笑容特别灿烂。那个曾经的"调皮大王",如今成了大家心里的好榜样。'
},
{
  id: 'zhengzheng_131',
  title: '【调皮鬼正正】第一百三十一集：水彩笔大战',
  category: '成长',
  content: '今天美术课画画。李老师发下来彩色水彩笔，让小朋友们画"我的家"。\n\n正正画了一会儿就觉得无聊了。他看了看旁边的小胖，小胖正认真地画房子。正正的鬼脑筋一转——他拿起蓝色水彩笔，趁小胖不注意，在小胖的白纸上画了一道长长的蓝线。\n\n"哈哈哈！你的画多了一条河！"正正笑得前仰后合。\n\n小胖一看自己的画被划了，"哇——"哭了起来。\n\n正正觉得好好玩。他又拿起红色笔，在前桌小美的辫子上画了一道红色。\n\n"啊！！我的头发！！"小美摸到辫子上黏糊糊的，也哭了。\n\n教室里一下子乱了套。李老师走过来一看——小胖的画毁了，小美的辫子变红了，正正还在那里笑。\n\n"正正！你过来！"李老师严肃地说。\n\n正正被叫到了教室前面罚站。全班小朋友都看着他。正正低着头，不笑了。\n\n"正正，画笔是用来画画的，不是用来欺负同学的。你说，该怎么办？"\n\n"我……我给小胖重新画一张……给小美洗头发……"正正小声说。\n\n放学的时候，李老师把事情告诉了正正妈妈。妈妈的脸一下子就黑了。\n\n回到家——"啪！"屁股上挨了一巴掌。\n\n"你怎么能在别人身上画画！你怎么能把人家小朋友弄哭！"妈妈生气地说。\n\n正正哇哇哭："妈妈我错了我错了……"\n\n"错哪了？"\n\n"不应该拿笔画别人的画和辫子……"\n\n"明天给小胖和小美道歉。记住了吗？"\n\n"记住了……呜呜呜……"\n\n第二天，正正带了一块新橡皮送给小胖，又带了一个漂亮的发卡送给小美，认认真真地说了对不起。\n\n小胖和小美原谅他了。不过正正的屁股疼了一整天。'
},

  title: '【调皮鬼正正】第一百三十二集：午睡捣乱',
  category: '成长',
  content: '幼儿园每天中午都要午睡。小朋友们躺在小床上，盖着小被子，乖乖闭眼睛。\n\n可是正正根本睡不着。他眼睛转来转去，脑子里全是坏主意。\n\n正正悄悄爬起来，把旁边睡着的小明的鞋子左右脚换了一下。然后又把另一边乐乐的小被子角系在了床腿上。最后他还把老师放在桌上的闹钟调快了一个小时。\n\n做完这些"恶作剧"，正正才心满意足地躺回去睡了。\n\n起床铃响了。小明穿鞋的时候发现左右脚反了，走路歪歪扭扭的。乐乐掀被子的时候被系住了，"哗啦"连人带被子翻到了地上。\n\n"哈哈哈——"正正笑得在床上打滚。\n\n可是没笑多久。李老师看了看闹钟说："咦，怎么比正常时间快了一个小时？"老师一下子就想到了——这肯定是正正干的。\n\n"正正，过来。"\n\n正正磨磨蹭蹭走过去。李老师蹲下来平视着他的眼睛说："午睡的时候别的小朋友都在休息，你这样闹，大家下午上课都没精神。而且乐乐摔地上了，如果磕到脑袋怎么办？"\n\n正正低下了头。他确实没想到乐乐会摔倒。\n\n"这周五的小红花，你没有了。"\n\n正正的嘴巴撅起来了，眼眶红红的。他最想集够小红花换那个玩具恐龙了。\n\n放学后妈妈来接。李老师又把事情说了。\n\n回到家——"啪！啪！"这次屁股挨了两下。\n\n"午睡时间是休息的！你搞恶作剧害小朋友摔跤！万一摔出事来你负得起责吗！"妈妈气得声音都变了。\n\n"妈妈我真的知道错了呜呜呜……我以后午睡乖乖睡觉……"\n\n"说到做到？"\n\n"说到做到！"\n\n那天晚上正正躺在床上摸着自己红红的屁股，心想：以后午睡……还是老实睡觉吧。'
