  content: '龙龙独自在火山脚下觅食，一只成年棘龙挡住了它的去路。棘龙比龙龙大五倍，背上的帆像一面巨大的旗帜，爪子比龙龙的脑袋还大。\n\n"小东西，这片河滩是我的猎场，你给我滚。"棘龙低下头，鱼腥味扑面而来。\n\n龙龙后退了几步，但它注意到脚下的地面有些微微发烫——它们正站在一条地热裂缝附近。缝隙里不时冒出热气，地面偶尔会喷出滚烫的蒸汽。\n\n"棘龙大哥，我马上就走。"龙龙装作害怕地往后退，同时偷偷观察地热裂缝的走向。它发现棘龙正好站在一个蒸汽口旁边。\n\n"不过走之前，我想问你一个问题。"龙龙故意拖延时间，"你觉得今天地面是不是特别热？"\n\n棘龙还没回答，"噗——"一股滚烫的蒸汽从它脚下喷了出来！棘龙被烫得嗷嗷叫，跳起来四处乱窜。\n\n龙龙趁机绕过棘龙，沿着安全的路线跑了。它一边跑一边回头看——棘龙还在那里一瘸一拐地走，嘴里骂骂咧咧。\n\n可是龙龙跑着跑着发现前面的路断了——一条宽阔的岩浆河挡住了去路！后面棘龙虽然被烫了脚，但也追过来了，怒气冲冲。\n\n龙龙左右看了看，发现岩浆河上漂着几块还没完全融化的黑色火山岩——它们像浮冰一样在岩浆上慢慢移动。龙龙知道这些岩石表面温度虽高但不至于伤脚——霸王龙的脚底比其他恐龙厚得多。\n\n它咬了咬牙，跳上了第一块火山岩。岩石在岩浆上晃了晃，龙龙立刻跳向第二块、第三块——棘龙追到了岸边，但它脚底被烫伤了，根本不敢踩上去。\n\n龙龙跳到对岸，回头看到棘龙在那边气得直甩尾巴。它吐了吐舌头，然后消失在了对面的蕨类丛林里。\n\n"既要动脑子，也要有胆量。"龙龙对自己说，继续踏上了冒险的旅程。'
},
{
  id: 'dino_2',
  title: '【龙龙历险记】第二集：翼龙的天空陷阱',
  category: '恐龙',
  content: '龙龙穿越一片开阔的平原时，天空突然暗了下来。它抬头一看，三只巨大的翼龙在头顶盘旋，翼展足有十几米。\n\n"又一只落单的小恐龙，今天运气不错。"领头的翼龙对同伴说。\n\n龙龙知道在平原上无处可藏。翼龙俯冲的速度极快，就算跑也跑不过。它唯一的优势是——翼龙没法在地面上灵活活动。\n\n龙龙迅速跑向平原边缘的一片针叶林。针叶树高大茂密，翼龙的巨大翅膀没法穿越树冠间的缝隙。龙龙钻进了树林。\n\n"哼，等你出来。"翼龙们在树林上方盘旋，等得很耐心。\n\n龙龙躲了一会儿，发现翼龙没有离开的意思——它们准备打持久战。可龙龙不能一直待在林子里，它还要赶路找妈妈。\n\n龙龙想了个办法。它在林子里找到了一些干枯的巨型蕨类叶子，把它们堆成一个大堆。然后它找了两块燧石——砰砰几下擦出火星，点燃了干叶堆。\n\n浓烟滚滚地升上天空。翼龙被烟呛得睁不开眼，翅膀上沾了灰，飞行变得不稳。"该死的烟！"翼龙们扑扇着翅膀往远处飞。\n\n龙龙趁着烟雾的掩护，从林子另一头冲了出去，拼命往另一片有洞穴的山丘跑去。\n\n可就在它快到山丘的时候——"呼！"一只翼龙从侧面俯冲下来！原来有一只绕到了下风向，没被烟影响到。\n\n龙龙来不及躲，翼龙的爪子已经抓住了它的后背。巨大的力量把它往上提——龙龙被抓起来了！\n\n就在翼龙得意地往高处飞的时候，龙龙张开了它那霸王龙标志性的大嘴——虽然它小，但牙齿已经很锋利了。它一口咬在了翼龙的脚趾上！\n\n"啊——"翼龙疼得松了爪子。龙龙在两米多的高度掉了下来，"砰"地摔在了一堆厚厚的苔藓上。虽然摔得不轻，但好歹没受重伤。\n\n翼龙捂着流血的脚飞走了，再也不敢来招惹这只"小刺头"。\n\n龙龙从苔藓里爬起来，揉了揉摔疼的屁股。"霸王龙的牙，关键时刻真管用。"'
},
{

  category: '恐龙',
  content: '龙龙走进了一片看起来平静的沼泽地。水面上漂着绿色的浮萍，偶尔有气泡冒上来。一切看起来很安宁。\n\n龙龙渴了，低头想喝水。突然它注意到——水面上有一双眼睛在看它！那不是倒影，是一只巨大的帝鳄潜伏在水下，只露出两只眼睛和鼻孔。\n\n龙龙吓得后退了一步。帝鳄没有动——它在等龙龙再靠近一些。\n\n龙龙没有离开。它确实很渴，必须找到水喝。它绕着沼泽走了一圈，发现到处都有帝鳄潜伏的痕迹——这是它们的地盘。\n\n龙龙想了想，捡起一根粗树枝，用力扔进了沼泽的另一头。"哗！"水面炸开了——两只帝鳄同时扑向了落水点，以为是猎物来了。\n\n龙龙趁机跑到刚才帝鳄扑出去后空出来的水域，快速低头喝了几大口水。\n\n可就在它喝水的时候，脚下的"地面"动了！龙龙低头一看——它踩的不是岸边的泥地，而是一只伪装成泥土的超巨型帝鳄的背！\n\n帝鳄感受到了重量，开始翻身。龙龙脚下突然天旋地转。\n\n千钧一发之际，龙龙用尾巴猛地抽在了旁边一棵树上。借着反弹的力量，它的身体弹射出去，"扑通"落在了真正的硬地上。\n\n帝鳄翻转过来张开大嘴，但龙龙已经滚到了安全距离之外。它嘴里还叼着几片被帝鳄背上的泥溅到的蕨类叶子。\n\n龙龙爬起来狂奔，心脏砰砰乱跳。跑出很远后它才停下来，拍着胸口说："以后喝水……得找流动的小溪。死水潭太吓人了。"\n\n从此龙龙学会了——在白垩纪，任何看起来安全的地方，都可能藏着致命的危险。'

  category: '恐龙',

  title: '【龙龙历险记】第九集：伪装大师——窃蛋龙的阴谋',
  category: '恐龙',
  content: '龙龙走到了一片恐龙蛋的孵化场。好几种恐龙的蛋都在这里，阳光和地热帮助它们孵化。一只温柔的慈母龙正在照看一窝蛋。\n\n龙龙走过去打了个招呼："阿姨好！"慈母龙友善地点了点头。\n\n可龙龙总觉得旁边那只"慈母龙"有点奇怪——它的颜色和真正的慈母龙几乎一样，但动作不太对。真的慈母龙走路很稳重，这只却有点鬼鬼祟祟的。\n\n龙龙假装离开，偷偷绕到后面观察。果然！那只"慈母龙"趁真慈母龙不注意，悄悄把嘴伸向了蛋窝——它是一只窃蛋龙！它用类似的颜色和体型伪装成了慈母龙，混在孵化场里偷蛋。\n\n龙龙想喊，但如果只是喊一声，窃蛋龙可能会狡辩说自己也是慈母龙。必须让它露出原形。\n\n龙龙捡了一块小石子，精准地弹到了窃蛋龙的尾巴根部——那是恐龙最痒的地方。窃蛋龙忍不住用后脚挠了一下，这一挠暴露了它的真面目：它的后爪是弯曲的利爪，和慈母龙平坦的后脚完全不同。\n\n"它是窃蛋龙！"龙龙大喊。\n\n慈母龙群一看那利爪，立刻愤怒地围了上来。窃蛋龙见事情败露，丢下半偷出来的蛋就跑。但慈母龙群体型大，堵住了它的退路。\n\n窃蛋龙被赶出了孵化场，再也不敢回来。慈母龙们感激地对龙龙说："小霸王龙，多亏了你。以后你从这里过都是我们的贵宾。"\n\n龙龙挥挥小短手，心里美滋滋的。它又多了一群朋友——而且从此经过这里都能得到慈母龙群的保护。'
},
{
  id: 'dino_10',
  title: '【龙龙历险记】第十集：骨头峡谷的决战',
  category: '恐龙',
  content: '龙龙走进了一条狭长的峡谷。峡谷地面上散落着无数白骨——这里是食肉恐龙的猎杀场，很多恐龙被追进死路后在这里丧命。\n\n龙龙正想快步通过，前面忽然出现了一只南方巨兽龙——白垩纪最大的食肉恐龙之一，体型是龙龙的七八倍。它一直在这条峡谷里守株待兔。\n\n龙龙转身想跑，发现后面的路上也出现了两只迅猛龙——它们是和巨兽龙合作的，专门负责把猎物赶进峡谷。\n\n前有巨兽龙，后有迅猛龙，两侧是光滑的峡谷壁。看起来死路一条。\n\n龙龙低头看了看地上的白骨，突然有了主意。它用脚拨拉开一堆骨头，发现下面有一条被骨头遮住的窄缝——峡谷壁的底部有裂缝，只够小型恐龙通过。\n\n可是迅猛龙也够小，能追进去。龙龙得先拖住它们。\n\n龙龙叼起一根长骨头——那是某只大恐龙的肋骨——横在窄缝入口。然后它钻了进去。\n\n巨兽龙追到跟前但太大了根本塞不进去。迅猛龙追过来想钻缝，却被横在入口的肋骨卡住了——它们必须花时间挪开骨头才能进去。\n\n龙龙在缝隙里拼命往前爬。缝隙越来越窄，有的地方得侧身才能过。它听到身后迅猛龙挪开了骨头也钻了进来——但它们比龙龙稍微大一点，在最窄的地方卡住了！\n\n龙龙从缝隙的另一端钻了出来——是峡谷外面的一片树林。它终于安全了。\n\n身后的缝隙里传来了迅猛龙憋屈的叫声。龙龙回头看了一眼那个裂缝口，笑了："有时候，个子小也是优势。"'
},
{
  id: 'dino_11',
  title: '【龙龙历险记】第十一集：毒水河的谜题',
  category: '恐龙',
  content: '龙龙面前出现了一条宽阔的河流。河水是正常的蓝绿色，看起来没问题。但龙龙注意到了一个异常——河岸边一棵树都没有，地面上连草也不长，光秃秃的。\n\n更奇怪的是，河对岸躺着几只恐龙的尸体，身上没有任何伤痕。\n\n"这河水有毒。"龙龙判断。上游一定有什么矿物质渗入了河里，无色无味但致命。\n\n可是龙龙必须过河。河太宽了跳不过去，也没有可以踩的石头。怎么办？\n\n龙龙沿着河岸往上游走了很久。终于，它发现了一个地方——河面上方有一棵巨大的倒下的银杏树横跨两岸，像天然的桥。但那棵树已经很老了，表面满是裂纹，不知道能不能承受重量。\n\n龙龙试着把一条后腿踩上去——树干咔嚓响了一声。不太稳。\n\n龙龙退回来想了想，然后它开始做一件看起来很蠢的事——它在岸边收集了大量的轻质浮木和蕨叶，铺在了银杏树干上面，做了一条加宽加厚的"通道"。分散重量后，每一步的压力就小了很多。\n\n龙龙小心翼翼地踩着铺好的通道往前走。走到中间的时候，"咔嚓——"树干裂开了一条缝！\n\n龙龙没有停下来，反而加速跑了起来——跑比站着压力更短暂。它像短跑运动员一样冲刺——在树干彻底断裂的前一刻，龙龙纵身一跃，踩着最后一片铺好的蕨叶跳上了对岸！\n\n"轰——"身后银杏树断成两截，掉进了毒水河里。\n\n龙龙趴在安全的地面上喘着粗气，看着河面上翻起的白色浪花。"好险……不过，问题总是有解决办法的，关键是别着急，多观察。"'
},
{
  id: 'dino_12',
  title: '【龙龙历险记】第十二集：声音的武器',
  category: '恐龙',
  content: '龙龙走进了一片回声谷。这里两边的悬崖形成了天然的扩音器，任何声音都会被放大好几倍。\n\n不幸的是，一只阿贝力龙也走了进来。阿贝力龙比龙龙大三倍，虽然手臂比龙龙的还短，但脑袋上有骨质突起，撞击力惊人。\n\n"正好饿了。"阿贝力龙歪着脑袋看着龙龙。\n\n龙龙后退了几步。它看了看两边的悬崖壁，心里有了一个大胆的想法。\n\n它深吸一口气，然后张开大嘴——对着悬崖壁发出了它能发出的最大声音的咆哮。\n\n"吼——"\n\n回声谷把这声咆哮放大了十倍！声波在两壁之间来回反弹，越来越响。"吼——吼——吼——"听起来就像一群成年霸王龙同时在咆哮。\n\n阿贝力龙被这个巨大的回声吓了一跳。"一……一群霸王龙？！"它惊恐地四处张望。\n\n龙龙趁机又吼了几声，每一声都被回声谷放大成恐怖的"群龙怒吼"。\n\n阿贝力龙魂飞魄散，转身就往回跑，甚至撞在了石壁上都顾不得疼，拼了命地逃出了回声谷。\n\n龙龙收住了嗓子，嗓子有点疼，但它咧嘴笑了。"我虽然小，但我的声音可以很大。尤其是在对的地方。"\n\n龙龙走出回声谷继续赶路。它把这个地点记在了心里——以后如果再有大家伙追它，引到这里来准没错。'
},
{
  id: 'dino_13',
  title: '【龙龙历险记】第十三集：琥珀森林的黏糊危机',
  category: '恐龙',
  content: '龙龙发现了一片美丽的琥珀森林——阳光穿过金黄色的树脂，整片树林闪闪发光。树干上流淌着大量的松脂，像金色的瀑布。\n\n龙龙被美景吸引，走进了树林深处。但它很快发现了问题——脚下越来越黏。地面上积了一层厚厚的松脂！\n\n龙龙抬脚时"啪嗒"一声，每一步都很费力。更糟糕的是，它的一只后脚被一块特别厚的松脂粘住了，怎么拽也拽不出来。\n\n就在这时，一群原角龙（虽然不吃肉但领地意识极强）发现了闯入者，正气冲冲地从树林另一头赶来。\n\n龙龙用力扯腿——扯不动。它换了个策略，用爪子在粘住的松脂周围刨土，把粘着松脂的那块地面整个挖起来——虽然脚上还粘着一坨松脂泥巴，但至少能走了。\n\n龙龙拖着沉重的脚往外跑。跑到一半，它注意到阳光照射下的地面上有些干燥的沙土没被松脂覆盖——那是动物走过的老路，松脂被踩干了。\n\n龙龙跳上了干路。原角龙群追到了松脂地带，它们的四条腿全被粘住了——它们比龙龙重，陷得更深！\n\n龙龙沿着干路一直跑出了琥珀森林。出来后，它找了一块大石头，用石头的尖角慢慢把脚上的松脂凿掉。\n\n"漂亮的地方也有陷阱。"龙龙总结道，"不过也给了我一个启发——松脂可以当武器用，粘住追兵的脚。"它记下了琥珀森林的位置。'
},
{
  id: 'dino_14',
  title: '【龙龙历险记】第十四集：友谊的背叛',
  category: '恐龙',
  content: '龙龙在路上遇到了一只看起来很友好的似鸟龙。似鸟龙自称叫"快快"，说自己也在旅行，提议和龙龙结伴同行。\n\n龙龙高兴极了——旅途中太孤单了，有个伙伴多好。两个小恐龙一起走了好几天，聊天、找食物、轮流放哨。龙龙完全信任了快快。\n\n可是第四天晚上，龙龙被一阵脚步声惊醒。它睁眼一看——快快不见了。远处的灌木丛后面传来快快的声音，还有……其他似鸟龙的声音。\n\n"它就睡在那边，今晚吃了它我们能饱好几天。"快快的声音。\n\n龙龙的心凉了。快快从一开始就在计划着把它当食物——花几天时间取得信任，让龙龙放松警惕，然后召来同伴……\n\n龙龙悄悄起身，克制住心中的愤怒和悲伤。它没有直接逃跑——那样会暴露行踪。相反，它把自己的睡窝里堆了一堆树叶和石头，让远远看去像有东西在睡觉。\n\n然后龙龙悄无声息地爬上了旁边的一棵矮树（虽然难爬但拼了命抓住了）。\n\n似鸟龙群冲向了"龙龙的睡窝"——扑了个空。"它跑了！"快快惊叫。\n\n趁似鸟龙群在下面乱找的时候，龙龙从树上跳到了另一侧，利用夜色掩护狂奔而去。\n\n跑了很远之后，龙龙停下来。它没有哭，但心里很疼。\n\n"以后不是不能交朋友，"龙龙对自己说，"但要用时间来验证真心。太快太好的友谊，要多留一个心眼。"\n\n这次经历让龙龙长大了不少。'
},
{
  id: 'dino_15',
  title: '【龙龙历险记】第十五集：地下河的黑暗旅程',
  category: '恐龙',
  content: '龙龙发现了一个山洞，洞里传来流水声。它钻进去一看——洞里有一条地下河，河水清澈，在黑暗中闪着荧光（是水里的荧光浮游生物）。\n\n龙龙沿着地下河走，希望这条河能通往山的另一边——那样就不用爬山了。\n\n走了一会儿，洞顶越来越低，龙龙得弯着腰走。突然身后传来了"咔哒咔哒"的声音——有东西在后面跟着它。龙龙回头看——是一群巨型洞穴蜈蚣，每只都有龙龙的手臂那么长，密密麻麻地从洞壁上爬来。\n\n龙龙加速往前跑。洞越来越窄，地下河也越来越急。\n\n前方出现了一个岔路——左边的洞口有微弱的光线透进来，右边的洞口黑漆漆但风更大。光线意味着可能有出口，但也可能只是裂缝。风大意味着通道长但通向外面。\n\n蜈蚣群越来越近。龙龙没时间细想，选择了右边——因为蜈蚣怕风（龙龙观察到它们在有气流的地方会绕道走）。\n\n果然，一钻进右边的通道，迎面的冷风让身后的蜈蚣停了下来，不敢再追。\n\n但新的问题来了——通道尽头是一个悬崖，下面就是地下河的一个瀑布！水流冲入了下面的深潭。\n\n龙龙别无选择。身后蜈蚣虽然暂时不追了，但它们在等风停。\n\n龙龙深吸一口气，跳了下去。\n\n"哗——"冰冷的水包裹了它的全身。龙龙在水里拼命划动四肢。水流很急，把它冲向了下游。它努力保持头在水面上方。\n\n转了几个弯后，前面出现了亮光——出口！地下河从山腰的一个洞口流了出去。龙龙被水流冲了出来，"扑通"掉进了山外的一个小池塘里。\n\n它从水里爬上来，阳光刺得它眯起了眼睛。浑身湿透，冷得直抖，但——安全了。\n\n"地下探险真刺激，"龙龙抖了抖水，"下次还是不了。"'
},
{
  id: 'dino_16',
  title: '【龙龙历险记】第十六集：恐龙蛋保卫战',
  category: '恐龙',
  content: '龙龙在一条小溪边休息时，发现了一窝被遗弃的恐龙蛋。蛋壳上有裂纹了——小恐龙快孵出来了，但蛋妈妈不知去了哪里。\n\n龙龙不忍心离开。它决定守着这窝蛋等蛋妈妈回来。\n\n第一个麻烦来了——太阳太大了，蛋会被晒坏。龙龙折了些大蕨叶搭了个简易遮阳棚。\n\n第二个麻烦更严重——一只偷蛋龙闻着味道来了，围着蛋窝转圈。龙龙张开嘴吼了一声，偷蛋龙跑开了。但它没走远，就在附近等着机会。\n\n龙龙不能一直不睡觉不吃东西。它想了个办法：在蛋窝周围堆了一圈带刺的植物枝条，又找来一些气味刺鼻的腐烂浆果涂在外层——偷蛋龙靠近就会被刺扎到，而且气味能掩盖蛋的味道。\n\n到了晚上，更大的麻烦来了——一只鲨齿龙路过，对蛋产生了兴趣。它比偷蛋龙大得多，带刺的植物和臭味根本不管用。\n\n龙龙只能正面对抗。它站在蛋窝前面，用尽全力吼叫。鲨齿龙停了一下——毕竟龙龙是霸王龙，哪怕小的，它也得掂量掂量。\n\n龙龙灵机一动，后退几步踩在一根干树枝上——"啪！"响声让鲨齿龙又犹豫了一下。龙龙开始有节奏地踩树枝、踢石头，制造出大量噪声。同时它尽量挺胸抬头，让自己看起来比实际更大。\n\n鲨齿龙最终觉得为了几颗蛋犯不着冒险惹霸王龙（哪怕是小的），转身走了。\n\n第二天清早，蛋妈妈回来了——是一只副栉龙。它看到龙龙守在蛋窝旁边又惊又感动。\n\n"你……一只霸王龙在守护我的蛋？"\n\n"它们快孵出来了，不能没人照看。"龙龙笑着说。\n\n就在这时，"咔嚓——"蛋壳裂开了，第一只小副栉龙探出了头。它睁开眼睛，第一个看到的是龙龙。\n\n"妈妈？"小副栉龙对龙龙叫。\n\n龙龙和副栉龙妈妈对视了一眼，都笑了。'
},

  title: '【龙龙历险记】第十七集：泥石流中的选择',
  category: '恐龙',
  content: '连日暴雨后的一天，龙龙走在山谷中。它突然感到脚下在颤抖，远处传来了闷雷般的声音——不是雷，是泥石流！\n\n山坡上巨大的泥水混合着石块和树木倾泻而下。龙龙扭头就跑，但泥石流的速度比它快得多。\n\n跑了几步，龙龙看到前方有两条路：左边是一条上坡路，通向高处的岩石平台，但路很窄很陡；右边是一片开阔地，可以跑得更快但海拔低。\n\n多数恐龙会选择右边——因为跑得快。但龙龙选了左边。\n\n它拼命往坡上爬。小短手在关键时刻帮了忙——虽然短，但爪子能抓住石头的缝隙。泥石流已经涌到了坡底，水位在快速上升。\n\n爬到一半，龙龙脚下的石头松了——它整个身体滑了下去半米！龙龙用尾巴猛地抽在岩壁上，勉强稳住了身体。泥水已经淹到了它的膝盖。\n\n"不能停！"龙龙咬牙继续爬。一步、两步、三步——终于爬上了岩石平台！它趴在平台上回头看，整个山谷已经变成了一片泥海。那片"跑得快"的开阔地已经被完全淹没了——如果选了右边，现在就被泥石流冲走了。\n\n龙龙大口喘气。就在它以为安全的时候——"咔嚓！"平台的一角在泥水的冲刷下开始崩裂！\n\n龙龙赶紧往平台内侧退。平台不大，崩塌在继续。它看到平台上方还有一排岩石突起，像梯子一样。\n\n龙龙跳起来咬住了最低的那块突起石头，用后腿蹬着往上爬。一块又一块，它攀上了更高的位置。\n\n等泥石流过去后，龙龙从高处慢慢爬了下来。山谷面目全非，但龙龙毫发无伤。\n\n"选择比速度更重要。"龙龙望着被泥石流改变了地貌的山谷说，"有时候慢一点的路反而是活路。"'
},
{
  id: 'dino_18',
  title: '【龙龙历险记】第十八集：智斗恐爪龙兄弟',
  category: '恐龙',
  content: '龙龙在丛林里遇到了两只恐爪龙兄弟。恐爪龙以聪明著称，它们是白垩纪的"战术家"——总是配合默契地合作捕猎。\n\n"嘿嘿，小霸王龙，你的肉肯定很嫩。"大的那只说。"哥，我们左右包抄。"小的那只说。\n\n两只恐爪龙一左一右向龙龙逼近。它们的弯曲巨爪高高翘起，随时准备扑过来。\n\n龙龙知道不能力敌——恐爪龙虽然比它小一点，但两只配合起来比一只大恐龙还可怕。它必须破坏它们的配合。\n\n龙龙假装往左跑——左边的恐爪龙立刻堵上来。龙龙突然急转弯往右——右边的也堵上了。完美的配合。\n\n但龙龙注意到了一个细节：每次它做动作的时候，两只恐爪龙会互相看一眼确认位置。它们的配合依赖视觉交流。\n\n龙龙跑到了一棵巨大的银杏树后面。这棵树太粗了，两只恐爪龙站在两边互相看不见对方。\n\n"来呀！"龙龙从左边露了一下头，左边的恐爪龙猛扑过来。龙龙迅速缩回去，从右边探出身体。右边的也猛扑。\n\n两只恐爪龙同时从两侧扑向树干——"嘭！"它们在树干两边撞了个面对面，脑袋磕在了一起。\n\n趁它们晕头转向的时候，龙龙拔腿就跑。但恐爪龙恢复得很快——几秒钟后就追上来了。\n\n龙龙跑到了一条很窄的独木桥上——一根横跨小溪的倒木。只够一只恐龙走。两只恐爪龙不能并排，只能单个追。\n\n可就在龙龙跑到桥中间的时候——木头断了！龙龙掉进了溪水里。\n\n但溪水不深，龙龙站了起来。两只恐爪龙在断桥这头没法过来，而溪水对面的岸太陡了它们跳不过去。\n\n龙龙从溪里爬上对岸，回头对气急败坏的恐爪龙兄弟挥了挥小短手："两个脑袋不一定比一个好使哦。"\n\n恐爪龙兄弟互相埋怨了起来——这大概是它们配合以来第一次失手。'
},
{
  id: 'dino_19',
  title: '【龙龙历险记】第十九集：火山爆发前夕',
  category: '恐龙',
  content: '龙龙来到了一片富饶的谷地。这里食物丰富，水源充足，住着很多恐龙。龙龙打算在这里休息几天。\n\n但它注意到了一些奇怪的现象——地面微微发热，池塘里的水冒着气泡，小型动物和昆虫都在往谷外跑。最明显的是，谷地中央那座"安静的山"顶端在冒黑烟。\n\n"这是火山要爆发的前兆！"龙龙惊觉。\n\n它跑去告诉谷地里的其他恐龙，但没有人相信它。一只腕龙低头看了看它说："小家伙，这座山冒烟冒了好多年了，从来没爆发过。别大惊小怪。"\n\n一群鸭嘴龙也笑它大惊小怪。连之前交好的三角龙朋友都说："可能只是地热吧。"\n\n龙龙急了。它知道自己不能强迫别人相信，但也不能见死不救。\n\n它想了一个办法——去找了谷地里最受尊敬的长者：一只年迈的雷龙老爷爷。雷龙爷爷活了很多很多年，见多识广。\n\n"爷爷，您看这些迹象……"龙龙把观察到的现象一一列举。\n\n雷龙爷爷沉默了很久，然后点了点头："你说得对。上一次看到这种景象是在我年轻的时候……那次火山爆发毁了整片东部平原。"\n\n雷龙爷爷用它那震天的声音宣布了撤离。老爷爷的话，大家还是听的。\n\n恐龙群开始有序撤离。但走得最慢的是那些体型巨大的腕龙和雷龙——它们步伐太慢了。\n\n龙龙在后面催促着落后的恐龙。地面的震动越来越强。\n\n突然——"轰！！！"火山顶端炸开了！赤红色的岩浆喷向天空，火山灰遮住了太阳。\n\n"快跑！不要回头！"龙龙用尽全力大吼。\n\n岩浆开始顺着山坡流下来。恐龙群拼命跑向谷口。龙龙跑在最后面，因为它在确保没有掉队的。\n\n一只小三角龙摔倒了，龙龙一口咬住它后背的骨刺把它拽起来："不能停！"\n\n滚烫的气浪追着恐龙群。谷口就在前面了——大家拼命冲了出去。\n\n恐龙群冲出谷口后回头看——整个谷地被岩浆吞没了。就在十分钟前，那里还是它们的家。\n\n"多亏了那只小霸王龙……"腕龙愣愣地说。之前嘲笑龙龙的恐龙们都沉默了。\n\n龙龙没有在意这些。它只是庆幸——所有人都安全出来了。\n\n"相信自己的判断。"龙龙望着喷发的火山说，"就算全世界都不信你，但事实会证明一切。"'
},

  title: '【龙龙历险记】第二十集：重逢',
  category: '恐龙',
  content: '自从和妈妈走散后，龙龙已经独自旅行了很长很长时间。它走过了火山、沼泽、峡谷、森林和大海。它变强了，变聪明了，也变得更勇敢了。但每个夜晚入睡前，它最想的还是妈妈。\n\n这一天，龙龙翻过了一座大山，面前出现了一片广阔的平原。平原上有一群霸王龙——成年的。龙龙的心脏狂跳起来。\n\n它小心翼翼地靠近。霸王龙群很警惕，一只大公霸王龙朝它低吼了一声："小东西，你是谁家的？"\n\n龙龙还没回答，就看到族群后方有一只母霸王龙猛地抬起了头。她盯着龙龙看了几秒，然后开始朝这边跑——越跑越快，地面都在颤抖。\n\n"龙龙！！"\n\n是妈妈的声音。\n\n龙龙的眼泪一下子涌了出来。它冲了过去——"妈妈！！"\n\n霸王龙妈妈用巨大的脑袋轻轻蹭着龙龙，眼角也闪着泪光。"我找了你好久好久……我以为再也见不到你了。"\n\n"妈妈，我也找了你好久。"龙龙把头埋在妈妈的脖子下面，像个小宝宝一样。\n\n大公霸王龙愣了："什么？这是你的孩子？它一只小霸王龙怎么穿越了那么多危险地带活着走到这里的？"\n\n妈妈低头看着龙龙，骄傲地说："因为它不光有霸王龙的力量，还有比力量更厉害的东西。"\n\n"什么？"\n\n"脑子。"龙龙笑着接了一句。\n\n整个霸王龙族群都笑了。\n\n那天晚上，龙龙睡在了妈妈的怀里，比任何一个夜晚都安稳。它做了一个梦——梦见了自己一路上遇到的所有朋友：三角龙、慈母龙、大象般的雷龙爷爷……\n\n梦里，它对它们说："谢谢你们。因为有你们，我的旅途才不孤单。"\n\n龙龙知道，冒险不会结束。等它长大了，它会变成白垩纪大陆上最聪明的霸王龙。\n\n不是最大的，不是最凶的，但一定是最聪明的。\n\n因为它始终相信——\n\n力量可以解决一时的问题，但智慧可以解决一生的问题。'

  content: '幼儿园的大滑梯是小朋友们最喜欢的地方。每到户外活动时间，大家都排着队等着滑。\n\n可是今天，正正爬到了滑梯最上面，一屁股坐在那里不肯滑下去。\n\n"我是国王！这是我的城堡！谁都不许上来！"正正双手叉腰，得意极了。\n\n后面排队的小朋友急了："正正你快滑呀！我们也要玩！"\n\n"不行！国王说了不准。哈哈哈！"正正就是不动。\n\n小朋友们在下面干着急。有的都快哭了——户外时间就半个小时，正正占着滑梯，别人一次都玩不到。\n\n李老师走了过来："正正，下来。"\n\n"我是国王，国王不用听话！"正正嬉皮笑脸。\n\n李老师的脸严肃了："正正，我数三下。一、二……"\n\n正正知道数到三就麻烦了。他磨磨蹭蹭地滑了下来。\n\n"过来站好。"李老师把正正叫到一边。"滑梯是大家的，不是你一个人的。你霸占了滑梯，其他二十个小朋友都玩不到，你觉得公平吗？"\n\n正正不说话，低着头踢地上的小石子。\n\n"从现在开始到放学，你不能玩任何户外设施。看着别人玩。"\n\n正正的眼泪在眼眶里转。他只能站在旁边看着别的小朋友开心地滑滑梯、荡秋千。好羡慕啊。\n\n放学后妈妈知道了这件事，回家后也很生气。\n\n"你一个人霸着不让别人玩，这叫自私！你愿意别人也这样对你吗？"\n\n"不愿意……"\n\n"啪！"屁股又红了。\n\n"记住，好东西要一起分享。你想当国王可以在家里当，但不能欺负小朋友。懂了吗？"\n\n"懂了……呜呜呜……"\n\n第二天，正正乖乖排队等滑梯。轮到他的时候他很快滑下来，让后面的小朋友也能玩。\n\n李老师看到了，朝他竖了个大拇指。正正虽然没说话，但心里好开心——原来遵守规则也能得到表扬。'
},
{
  id: 'zhengzheng_5',
  title: '【调皮鬼正正】第五集：厕所里的泡泡',
  category: '成长',
  content: '正正上厕所的时候发现洗手液的瓶子可以挤出好多泡泡。他按了一下——"噗"，好大一坨白泡泡。\n\n正正的眼睛亮了。他开始疯狂地按洗手液——噗、噗、噗、噗噗噗！泡泡越来越多，水池里全是白花花的泡沫，溢出来流到了地上。\n\n正正还觉得不够。他把泡泡抹在了镜子上，在镜子上画了一个大鬼脸。然后又把泡泡涂在了门把手上——滑溜溜的，谁一开门手就打滑。\n\n正正干完坏事洗了个手就出去了，心里偷偷乐。\n\n过了一会儿，乐乐去上厕所。一开门——手一滑，脚又踩到了地上的泡泡水，"哗！"整个人滑倒在地上。\n\n"哇——"乐乐疼得大哭。\n\n李老师赶紧跑过来把乐乐扶起来。乐乐的胳膊肘蹭破了皮，流了一点血。\n\n李老师看了看厕所里的泡泡，镜子上的鬼脸——不用猜就知道是谁干的。\n\n"正正！过来！"\n\n正正知道这次闯大祸了。他看到乐乐的胳膊上贴了创可贴，心里有点慌。\n\n"乐乐摔伤了。是因为你把泡泡弄到了地上。"李老师很严肃，"这不是好玩的事，这是危险的事。如果乐乐摔的是脑袋怎么办？"\n\n正正张了张嘴，说不出话来。他……真的没想到会有人摔倒受伤。\n\n李老师让正正把厕所打扫干净。正正拿着拖把拖了好久好久，把地上的泡泡水全部擦干净了。\n\n放学后，妈妈看到老师的微信消息——照片里是乐乐受伤的胳膊。\n\n妈妈回到家二话不说——"啪！啪！啪！"这次是三下。\n\n"你闹出来的事害人家小朋友受伤了！你觉得好玩是不是？乐乐疼不疼？人家妈妈心不心疼？"\n\n正正哭得上气不接下气："我没想到会摔倒……我以后不玩洗手液了……"\n\n"明天给乐乐道歉，带上你的奥特曼贴纸送给他。"\n\n正正含着眼泪点头。他最喜欢的奥特曼贴纸要送出去了，可是想到乐乐的伤……正正觉得自己确实应该。'
},

  title: '【调皮鬼正正】第六集：抢了别人的玩具',
  category: '成长',
  content: '今天是"带玩具来幼儿园"的日子。每个小朋友可以从家里带一个最喜欢的玩具来分享。\n\n小胖带了一辆超酷的遥控赛车——红色的，会发光，还会"滴滴"响。正正看到了，眼睛都直了。\n\n"小胖，让我玩一下。"\n\n"等我玩完了再给你。"小胖正玩得开心。\n\n可是正正等不及了。趁小胖去喝水的时候，正正一把抢过了遥控器，操控着赛车到处跑。\n\n"那是我的！还给我！"小胖回来发现车被抢了，追着正正跑。\n\n正正一边跑一边玩遥控器，赛车在地上"嗖嗖"地开。他一个不注意——遥控车撞到了桌子腿上，"咔嚓"——车头掉了一块。\n\n小胖看到自己心爱的赛车坏了，"哇——"大哭起来。那是爸爸送他的生日礼物。\n\n正正愣住了。他低头看着坏掉的赛车，手里还握着遥控器。\n\n李老师走过来，看了看地上的车，又看了看正正。她没有大声批评，而是把正正拉到一边，蹲下来轻轻说：\n\n"正正，那辆车是小胖的宝贝，就像你的奥特曼一样重要。如果别人抢了你的奥特曼还弄坏了，你什么感觉？"\n\n正正想了想自己心爱的奥特曼如果被别人摔坏了……他的鼻子一酸。\n\n"我……我不应该抢的。"\n\n"去跟小胖说对不起。"\n\n正正走到还在哭的小胖面前："对不起小胖……我不该抢你的车。"\n\n放学后妈妈知道了，很生气："人家的东西你抢，还弄坏了！"\n\n"啪！"\n\n"妈妈给你买了那么多玩具，你为什么还要抢别人的？"\n\n"我……我就是觉得他的好看……"\n\n"觉得好看就可以抢吗？想玩就好好说，人家不给你就等着。别人的东西，没有允许不能动！听到了吗？"\n\n"听到了……"\n\n周末，妈妈带着正正去玩具店，让正正用自己的零花钱买了一辆新遥控车。星期一，正正把新车送给了小胖。\n\n"这个送你，赔你的车。"正正红着脸说。\n\n小胖开心极了，他们又变回了好朋友。正正心里想：想玩别人的东西，以后好好说，借着玩就行了，干嘛要抢呢。'

  category: '成长',
  content: '李老师今天戴了一副新眼镜，圆圆的，大大的。正正觉得好好笑——李老师戴上眼镜像猫头鹰。\n\n下课的时候，正正跟几个小朋友小声说："你们看，李老师像不像猫头鹰？以后我们叫她\'猫头鹰老师\'！哈哈哈！"\n\n几个小男生跟着笑了起来。\n\n午饭的时候，正正故意大声对旁边的人说："猫头鹰老师今天做的手工好难啊。"说完哈哈笑。\n\n旁边的小朋友也笑了。\n\n李老师听到了。她没有生气，但是她放下了筷子，安静地看了正正一眼。\n\n下午放学前，李老师把正正单独留了下来。\n\n"正正，你今天叫我什么？"\n\n正正低下了头："猫头鹰……老师……"\n\n"你觉得好笑对不对？"李老师的声音很平静，"如果有人给你起个外号，天天叫你，你开心吗？"\n\n正正想了想。之前有人叫他"正正歪歪"他就很生气。\n\n"不……不开心。"\n\n"每个人都不喜欢被叫外号。老师也是人，老师也有感受。你让其他小朋友都跟着叫，老师心里其实很难过。"\n\n正正抬头看了一眼李老师——她的眼睛有一点点红。正正第一次意识到，老师也会难过。\n\n"对不起李老师……我不该给你起外号。"\n\n李老师摸了摸正正的头："知道错了就好。以后叫人要用正式的名字，这是尊重。"\n\n回家后正正自己跟妈妈说了这件事。妈妈没有打他，但是很认真地说：\n\n"正正，你知道为什么妈妈给你取名叫\'正正\'吗？就是希望你做一个堂堂正正的人。堂堂正正的人，不在背后取笑别人。"\n\n正正点了点头，虽然这次屁股没挨打，但妈妈说的话让他心里比挨打还不好受。\n\n第二天，正正进教室后走到李老师面前，大声说："李老师早上好！你今天的眼镜很好看！"\n\n李老师笑了，弯下腰亲了一下正正的额头。'

  category: '成长',
  content: '今天下雨了，不能出去玩。小朋友们在教室里自由活动。\n\n正正闲不住啊。他把自己的小椅子翻过来，四条腿朝上，然后坐在椅子背上——"我是坦克兵！冲啊！"\n\n正正用脚蹬着地面，让翻过来的椅子在教室里滑来滑去。"突突突——！开炮！"\n\n旁边几个小男生看了觉得好玩，也翻了椅子跟着滑。教室里"哗啦哗啦"的，椅子到处乱跑。\n\n"撞上了！哈哈哈！"正正的"坦克"撞到了另一个小朋友的"坦克"。\n\n可是接下来——正正的椅子撞到了角落的书架。"哗啦——！"书架上的绘本和积木盒子全掉了下来，散了一地。一盒积木"噼里啪啦"撒了满教室。\n\n更糟糕的是，有一块积木弹起来打到了坐在旁边安静看书的小雨脸上。小雨"哇"地哭了，脸上红了一块。\n\n李老师飞快地跑过来。她先检查了小雨的脸，然后转向正正。\n\n"所有人！把椅子放好！"李老师第一次提高了声音。\n\n教室里瞬间安静了。所有小男生乖乖把椅子翻回来放好。\n\n"正正，你带的头对不对？"\n\n正正点了点头。\n\n"椅子是坐的，不是当玩具的。教室是学习的地方，不是赛车场。你看看，书架倒了，积木撒了，小雨还被打到了脸。"\n\n正正看了看地上的一片狼藉，又看了看小雨脸上的红印子，不说话了。\n\n"你来收拾。所有掉下来的书和积木，你一个人收拾干净。"\n\n正正蹲在地上捡了半个多小时，捡得腰都酸了。积木一颗一颗捡回盒子里，书一本一本放回书架。\n\n放学后妈妈听说了。\n\n"在教室里开坦克？你是去上幼儿园还是去打仗？"\n\n"啪！"\n\n"还把人家小朋友脸打了！你看看你一天天的！"\n\n"啪！"\n\n正正哭着认错。那天晚上他的屁股是双倍疼——挨了两巴掌。\n\n可是正正也记住了：教室里不能闹，因为空间小人多，一闹就容易伤到别人。'

  category: '成长',
  content: '幼儿园的午餐时间到了。今天的菜是：米饭、红烧肉、炒西蓝花、还有紫菜蛋花汤。\n\n正正看到了红烧肉开心得不得了，可是一看到绿绿的西蓝花就皱起了眉头。\n\n"我不要吃这个绿色的树！"正正把西蓝花全部扒到了一边。\n\n李老师走过来："正正，蔬菜也要吃哦，不能只吃肉。"\n\n"不要！难吃！"正正把嘴巴闭得紧紧的。\n\n李老师没有强迫他，说了一句："那好吧，不吃也行。但是下午的小饼干，只有吃了蔬菜的小朋友才能吃。"\n\n正正才不在乎呢。他把红烧肉和米饭吃得干干净净，西蓝花一口没动。\n\n可是下午三点钟——小饼干来了。巧克力味的！正正最爱的！\n\n李老师给每个小朋友发饼干。走到正正面前，停住了："正正，你中午的蔬菜吃了吗？"\n\n正正的脸红了。他摇了摇头。\n\n"那今天没有饼干哦。说好的规则。"\n\n正正看着别的小朋友都在"嘎吱嘎吱"吃饼干，巧克力的香味飘过来。他的口水都快流下来了。可是没有他的份。\n\n正正气鼓鼓的，眼泪差点掉下来。但他知道规则就是规则。\n\n放学后正正闷闷不乐地回了家。妈妈问他今天幼儿园怎么样。\n\n"我没吃到饼干……因为我没吃蔬菜。"正正小声说。\n\n妈妈没有打他，而是说："那今晚我做西蓝花，你要不要试试？妈妈有一个让西蓝花变好吃的魔法。"\n\n晚上妈妈把西蓝花用蒜蓉炒了，还撒了一点点肉松。正正试着吃了一口——"咦？没有那么难吃嘛！"\n\n他又吃了一口。再一口。最后把一整盘都吃完了。\n\n"明天到幼儿园也要吃蔬菜哦。"妈妈说。\n\n"嗯！这样我就能吃到饼干了！"\n\n第二天中午，正正主动把蔬菜吃了。虽然没有妈妈做的好吃，但是忍一忍也吃完了。下午他终于拿到了巧克力饼干——那块饼干，正正觉得比以前吃过的任何一块都香。'

  content: '幼儿园的教室在二楼。正正趴在走廊的栏杆上往下看——下面是一楼的操场，有几个小班的小朋友正在做操。\n\n正正的脑子又冒出了坏主意。他"呸——"朝下面吐了一口口水。\n\n口水落在了一楼的地面上。没打到人。正正觉得好刺激，又吐了一口。\n\n这次——口水"啪嗒"正好落在了一个小班小朋友的头顶上。\n\n那个小朋友摸了摸头："什么东西？"抬头一看，正正在二楼朝下面嘻嘻笑。\n\n"老师！楼上有人吐口水！"小班的老师抬头看到了正正。\n\n五分钟后李老师把正正拎到了办公室。\n\n"正正，你在做什么？！"这是李老师第一次真的发了火。\n\n正正缩着脖子不敢说话。\n\n"从楼上往下吐口水！如果是石头呢？如果砸到小朋友的眼睛呢？高空抛物有多危险你知道吗？而且——"李老师深吸了一口气，"吐口水到别人身上，这是非常非常不尊重人的行为。你愿意别人往你头上吐口水吗？"\n\n"不……不愿意……"正正低着头，声音像蚊子一样小。\n\n"这件事非常严重。我要告诉你妈妈，你也要去给小班那个小朋友道歉。"\n\n正正被带到一楼，对着那个小朋友鞠了一个九十度的躬："对不起，我不该吐口水，我错了。"\n\n那个小朋友还太小不太懂，只是瞪着大眼睛看着正正。\n\n放学后妈妈来了。李老师说完情况后妈妈的脸色铁青。\n\n回到家——这次不是"啪"了。妈妈拿了一根小尺子。\n\n"啪啪啪！"打了三下手心。\n\n"往人头上吐口水！你是怎么想的？！猪都不这么做！"妈妈气得声音都发抖了。\n\n正正哭得稀里哗啦："我再也不了！我再也不了！"\n\n"罚你一个星期不能吃零食。如果再有这种事，送你去爷爷家待一个月，不许回来。"\n\n正正被吓住了。从那以后他再也没有在楼上乱扔过任何东西——他终于明白了，有些"好玩"的事情其实非常危险，也非常不礼貌。'

  title: '【调皮鬼正正】第十一集：撒谎的代价',
  category: '成长',
  content: '今天手工课，李老师让大家用黏土做小动物。每个小朋友的桌上都有一盒彩色黏土。\n\n正正做了一个大恐龙——可是他把自己的黄色黏土用完了，恐龙的肚子还没做好。他看了看旁边的小雨，小雨的黄色黏土还有好多。\n\n"小雨，借我一点黄色的。"\n\n"不行，我待会要做长颈鹿呢。"\n\n正正生气了。等小雨去上厕所的时候，他偷偷拿了小雨的黄色黏土，全部揉进了自己的恐龙里。\n\n小雨回来发现黏土少了："我的黄色呢？"\n\n她看了看正正桌上那个格外大的黄色恐龙肚子……"正正！你拿了我的！"\n\n"我没有！这是我自己的！"正正矢口否认。\n\n小雨去找了李老师。李老师走过来，拿起正正剩下的黏土盒一看——黄色的格子空了，但旁边的颜色都还在。如果是自己用完的，应该是做恐龙时各种颜色都会用一些。而且正正的恐龙肚子明显比正常的大了一倍。\n\n"正正，看着老师的眼睛。你拿了小雨的黏土吗？"\n\n"没……没有……"正正躲开了老师的目光。\n\n"真的没有？"\n\n"真的……"\n\n李老师叹了口气。她拿来了教室的监控录像回放给正正看。画面里，正正清清楚楚地从小雨桌上拿走了黏土。\n\n正正的脸"唰"地红了，恨不得找个地洞钻进去。\n\n"正正，偷拿东西已经不对了。但更不对的是撒谎。做错了事可以改，但撒谎了，以后别人怎么相信你说的话？"\n\n正正哭了出来。不是因为怕被打，而是因为他觉得丢脸极了。\n\n放学后妈妈来了。李老师这次没有当面说，而是单独发了消息。\n\n回家后妈妈让正正坐在沙发上，很认真地对他说："正正，妈妈可以接受你犯错，但是不能接受你撒谎。你做了错事告诉妈妈，妈妈虽然会批评你但不会那么生气。可你要是撒谎被拆穿了——"\n\n"啪！"手心一下。\n\n"这一下是罚你拿别人东西。"\n\n"啪！"又一下。\n\n"这一下是罚你撒谎。你记住，做人第一条就是诚实。"\n\n正正含着泪使劲点头。从那以后，不管做了什么错事，他都不撒谎了——虽然老实交代也会被骂，但至少不用再挨双倍的罚了。'
},
{
  id: 'zhengzheng_12',
  title: '【调皮鬼正正】第十二集：用积木打人',
  category: '成长',
  content: '搭积木的时候，正正搭了一座好高好高的城堡。他得意极了，站起来炫耀："你们看！我的城堡最高！"\n\n可是旁边的乐乐也搭了一座很高的——比正正的还高一点点。\n\n"我的比你高！"乐乐开心地说。\n\n正正不服气。他瞪了乐乐一眼，然后——伸出手把乐乐的积木城堡推倒了！"哗啦！"积木散了一地。\n\n"你！你干嘛！！"乐乐气哭了，"我搭了好久的！"\n\n乐乐推了正正一把。正正更生气了——他拿起一块方方的积木朝乐乐扔过去。\n\n"咚！"积木打中了乐乐的额头。\n\n乐乐愣了一下，然后"哇——"大哭起来。额头上红了一块，鼓起了一个小包。\n\n教室里一下子安静了。所有小朋友都看着正正。李老师立刻跑过来。\n\n"发生什么了？"李老师检查乐乐的额头，红肿了一块。她先带乐乐去校医那里冰敷，然后回来处理正正。\n\n"正正，你为什么拿积木打人？"\n\n"他……他的比我高，我不高兴……"\n\n"因为别人比你做得好，你就动手打人？正正你想想，如果有人因为嫉妒你拿石头砸你，你怎么想？"\n\n正正不说话了。他看了看乐乐额头上的包，心里有点害怕也有点后悔。\n\n李老师的语气很严厉："正正，动手打人是最最不可以做的事。不管有多大的矛盾，都不可以打人。你这次的行为让老师非常非常失望。今天的所有活动你都不能参加，你坐在位子上反省。"\n\n正正一个人坐了一整个下午。旁边的小朋友唱歌他不能唱，做游戏他不能玩。好孤单好难受。\n\n放学后妈妈来了。一看到乐乐妈妈抱着冰袋敷头的乐乐——妈妈的脸白了。\n\n她先跟乐乐妈妈道了歉，回到家后关上门——\n\n"啪！啪！啪！啪！"四下。这是正正记忆中挨得最多的一次。\n\n"打人！你竟然打人！用积木砸人脑袋！万一砸到眼睛怎么办！"妈妈气得手都在抖。\n\n正正哭得说不出完整的话："我……我再也……不打人了……"\n\n"记住，不管多生气，手不能动。嘴巴说不过可以找老师。但是手——永远不可以伸。"\n\n这一天正正记了很久很久。从此他真的再没动手打过人。就算再生气，也只是跺跺脚或者去一个人待着冷静。'
},

  content: '今天早上李老师出去接电话，正正趁老师不在，跑到了讲台上。他看到了粉笔盒——里面装着红色、白色、黄色的粉笔。\n\n正正把所有粉笔偷偷塞进了自己的口袋里。然后他又把黑板擦藏到了窗帘后面。\n\n做完这些正正赶紧溜回了座位，假装什么都没发生。\n\n李老师回来了，准备在黑板上写字教大家认字。她拿起粉笔盒——空的。黑板擦也不见了。\n\n"咦？粉笔呢？"李老师找了一会儿，找不到。\n\n正正在下面偷偷笑。\n\n可是李老师没有生气，她说："好吧，今天不用粉笔了。原来计划今天教大家写自己的名字，这样下周表演的时候大家就能在签名墙上写自己的名字了。不过既然没有粉笔，那就不教了。"\n\n小朋友们发出了失望的声音："啊？不教了？"\n\n"我想写名字！"\n\n"我也想学！"\n\n大家都不开心。几个小朋友看向了正正——因为刚才有人看到正正跑到讲台那边了。\n\n"正正，是不是你？"\n\n正正的脸红了。被全班人盯着的感觉好丢人。他慢慢从口袋里掏出了粉笔，又从窗帘后面拿出了黑板擦。\n\n"对不起李老师……我以为这样很好玩……"\n\n李老师接过粉笔说："正正，你想想——你一个人觉得好玩的事情，让全班二十多个小朋友都学不到东西。一个人的快乐和二十多个人的学习，哪个更重要？"\n\n正正低下了头。他第一次意识到，自己的"好玩"可能会影响到很多很多人。\n\n放学妈妈知道后："你偷老师的教学工具？！你以为这是闹着玩的？"\n\n"啪！"\n\n"所有小朋友都因为你学不了东西。你觉得这样公平吗？"\n\n"不公平……我以后不了……"\n\n"回去写十遍\'我不偷藏别人的东西\'。"\n\n正正回到房间，认认真真地写了十遍。写到手酸——但他把这个教训记住了。'

  title: '【调皮鬼正正】第十四集：踩了花坛',
  category: '成长',
  content: '幼儿园门口有一个漂亮的花坛，里面种着五颜六色的小花。那是上个月全班一起种的——每个小朋友种了一棵，还给自己的花挂了名字牌。\n\n今天放学，正正和几个男生在花坛旁边追着玩。跑着跑着，正正一脚踩进了花坛里——"咔嚓"，踩断了一棵小花。\n\n"没事没事，就一棵。"正正没在意，继续跑。\n\n可是他跑得太疯了，又踩了一脚——这次踩了两棵。\n\n"正正！你踩到花了！"小美在后面喊。\n\n正正回头看了一眼被踩扁的花——其中一棵上面挂着的牌子写着"小美的花"。\n\n"小美的花……"正正咽了咽口水。\n\n小美跑过来看到自己辛辛苦苦种的花被踩成了泥，"哇"地就哭了。"我的花！我浇了好多天的！它都开花了的！"\n\n这时候李老师出来了。她看着花坛里的脚印——正正的鞋印清清楚楚的。\n\n"正正，你看看你踩坏了谁的花。"\n\n正正蹲下来看那些被踩烂的花苗。其中一棵还能看到断裂前含苞的花骨朵——本来明天就要开的。\n\n"这些花是活的。它们也有生命。你跑来跑去一脚就踩死了。"李老师的话让正正心里不好受。\n\n正正蹲在那里不说话了。他突然觉得那些被踩扁的花好可怜。\n\n"你要补种三棵花，每天负责浇水，直到它们开花为止。"李老师说。\n\n放学后妈妈来了，看到了花坛里的狼藉。\n\n回到家妈妈倒没打他，但让他写了一篇"检讨书"——五岁的检讨书就是画画。正正画了一幅画：一个小人踩到了花上面，花在哭。\n\n第二天开始，正正每天早上早来十分钟浇花。看着新种下的小花苗一天天长大，他心里竟然有一种奇怪的成就感。\n\n一个月后，三棵新花开了。正正高兴地跑去跟李老师报告："老师！我的花开了！"\n\n李老师笑着说："你看，爱护比破坏难多了。但爱护的快乐也比破坏大多了，对不对？"\n\n正正用力点了点头。'

  content: '午饭时间到了，小朋友们要排队去食堂。正正站在队伍中间，前面是小明。\n\n正正等得不耐烦了。他伸出手推了小明一下："快走啊！"\n\n小明往前一个踉跄，碰到了前面的人，前面的人又碰到更前面的人——像多米诺骨牌一样，队伍前面好几个小朋友都晃了一下。\n\n最前面的小雨没站稳，"扑通"坐在了地上。\n\n"谁推的！"李老师从后面走过来。\n\n小朋友们都转头看正正。\n\n"正正又推人了！"大家七嘴八舌。\n\n李老师把正正拉出队伍："你到最后面去。"\n\n"可是……我要到最后了就打最后一个菜了……"正正急了，他最喜欢吃第一个端出来的鸡腿。\n\n"对，去最后面。而且以后每次排队你都排最后，直到你能做到不推不挤为止。"\n\n正正不情愿地走到了队伍最后面。等他进食堂的时候，鸡腿已经没了，只剩下了他不太爱吃的鱼。\n\n正正郁闷极了，但又不好意思说什么——毕竟是自己推人在先。\n\n中午回教室，李老师单独找正正谈话："你知道为什么要排队吗？"\n\n"因为……大家一起走比较整齐？"\n\n"不只是整齐。是因为排队的时候，推推挤挤很容易摔倒。摔倒以后后面的人停不住就会踩到前面的人。这很危险。所以排队不能推。"\n\n正正第一次从"安全"的角度想了这件事。\n\n放学回家正正把今天的事说了。妈妈这次没有打他——因为正正是主动说的。\n\n"不打你了。但是你告诉妈妈，你从这件事学到了什么？"\n\n正正想了想说："排队不能推人。不然会像骨牌一样倒。还有……被罚到最后面就吃不到鸡腿了。"\n\n妈妈忍不住笑了："行吧，你这个记忆点也行。"\n\n从那以后正正排队再也不推了。不为别的——他可不想再错过鸡腿了。'

  content: '正正昨天在小区里听到了一个大哥哥说了一句脏话。正正觉得那话听起来好"厉害"——大哥哥说完以后别人都不敢惹他了。\n\n今天在幼儿园，正正和乐乐因为抢秋千吵了起来。正正脱口而出："你这个X X X！"（脏话）\n\n周围的小朋友都愣住了。乐乐也愣了。然后好几个小朋友开始学——"X X X！""X X X！"教室里一下子全是这个词。\n\n李老师的脸色变了。她用力拍了两下桌子："安静！谁第一个说的？"\n\n所有人都看向了正正。\n\n李老师把正正叫到了走廊上。这次她不是蹲下来，而是站着，从上往下看着正正。正正知道这意味着老师真的很生气。\n\n"这句话你从哪里学的？"\n\n"小区里一个大哥哥说的……"\n\n"你知道这是脏话吗？"\n\n正正摇摇头又点点头——他其实不太确定意思，只是觉得说出来很"酷"。\n\n"正正，脏话是骂人的话，说脏话不是厉害，是没素质。你知道更糟糕的是什么吗？你一个人说了，其他小朋友跟着学——你带坏了一屋子人。"\n\n正正的脸烧得厉害。他低着头不敢看老师。\n\n"从今天开始，你每天要说十句好听的话才能得到小贴纸。说一句脏话就扣三张贴纸。"\n\n放学后妈妈知道了。这一次妈妈没有立刻动手，而是坐下来问正正：\n\n"你觉得那个大哥哥说脏话很酷对不对？"\n\n正正点头。\n\n"可是你知道吗，说脏话的人在别人心里是什么样的？别人不是怕他，是看不起他。真正厉害的人不需要说脏话别人就尊重他。"\n\n正正想了想，好像确实是——幼儿园里最受欢迎的不是说话凶的人，而是像小明那样会帮助别人的人。\n\n"妈妈，我以后不说了。"\n\n"好。如果妈妈再听到你说脏话——"妈妈竖起手指，"用辣椒水漱口。"\n\n正正吓得吐了吐舌头。从此管住了嘴巴。'

  content: '幼儿园组织小朋友去参观科技馆。大家坐电梯上三楼。正正站在电梯按钮旁边——哇，好多好多按钮！\n\n正正的手痒了。"1、2、3、4、5、6——"他把所有楼层的按钮全按了一遍！\n\n电梯门关上了。然后——到了一楼开门。没人下。关门。到了二楼又开门。没人下。关门。到了三楼开门——总算到了，可是又关门，去了四楼……\n\n"正正！你按了什么！"李老师急了。电梯每一层都停，开门关门开门关门，走走停停。\n\n后面排队等电梯的人也急了——他们按了电梯可是电梯每层都停，等了好久都坐不上。\n\n等正正他们从电梯出来的时候，其他等电梯的大人脸色都不太好看。有一个叔叔说："哪个小孩乱按的？太没规矩了。"\n\n李老师尴尬极了。她跟人家道了歉，然后把正正拉到一边。\n\n"正正，电梯不是玩具。你把所有按钮都按了，电梯每层都停，浪费了所有人的时间。而且你知道吗？电梯如果频繁开关门，是有可能出故障的。如果电梯坏了，里面的人被困住了怎么办？"\n\n正正吓了一跳。他从来没想过按按钮会有这么严重的后果。\n\n"今天参观完回去后，你要写一张道歉卡贴在电梯旁边。"\n\n正正参观科技馆的心情全没了。他一直在想着刚才的事。回去后他画了一张卡片：一个电梯和一排按钮，旁边写着（画着）"不要乱按"。\n\n放学妈妈知道后很生气："公共设施是给所有人用的！你乱按影响了多少人？你知不知道丢人？"\n\n"啪！"\n\n"以后坐电梯手给我放好。看到按钮不许碰！到了自己的楼层跟妈妈说，妈妈来按。"\n\n"知道了……"正正低着头。\n\n从那以后坐电梯的时候，正正都把手揣在口袋里。他知道了——按钮不是玩具，公共场所要为别人着想。'

  category: '成长',
  content: '今天上课的时候，小班的一个小弟弟不小心尿裤子了。小弟弟才三岁多，吓得站在那里哭。老师正在帮他换裤子。\n\n正正路过看到了，哈哈大笑起来："哈哈哈！尿裤子了！大宝宝还尿裤子！羞羞羞！"\n\n他还拉了几个同学过来看："你们看！他尿裤子了！"\n\n小弟弟听到了正正的话，哭得更厉害了，小脸涨得通红。他把脸埋在老师怀里不肯抬头。\n\n李老师恰好经过走廊，听到了正正的话。她一步走过来，表情非常严肃：\n\n"正正！过来。"\n\n正正被李老师的语气吓住了，他从来没见老师这么严肃过。\n\n李老师把他带到走廊尽头，蹲下来看着他的眼睛说："正正，你三岁的时候也尿过裤子。你忘了吗？"\n\n正正愣住了——他确实不太记得了，但他知道三岁的时候可能是尿过的。\n\n"每个人都有做不好事情的时候。你笑话别人最丢脸的时刻，等于在别人的伤口上撒盐。那个小弟弟才三岁，他本来就很害怕很难过了，你还笑他——他会记住这件事很久很久的。"\n\n正正低下了头。他想了想如果是自己被一群人围着笑……他的脸也热了。\n\n"去跟那个小弟弟说对不起。然后今天下午，你帮他擦桌子擦椅子，做他的小哥哥。"\n\n正正走到小弟弟面前，轻轻地说："对不起，我不该笑你。我以前也尿过裤子的。没关系的。"\n\n小弟弟抬起头看了看正正，虽然眼睛还红红的，但不哭了。\n\n那天下午正正真的帮小弟弟擦了桌子，还教他叠纸飞机。小弟弟最后笑了，叫他"正正哥哥"。\n\n放学后正正跟妈妈说了今天的事。这次他是自己主动说的。\n\n妈妈摸了摸他的头："你知道错了就好。记住，永远不要笑话别人的困难。今天你帮了那个小弟弟，你做了一件比取笑别人好一百倍的事。妈妈为你后来的表现感到骄傲。"\n\n正正笑了。原来当好人的感觉比当坏蛋舒服多了。'

  id: 'yixiu_1',
  title: '【一休历险记】第一集：会说话的老树',
  category: '一休',
  content: '一休最喜欢在彩虹森林里散步。今天她走着走着，发现了一条从来没见过的小路。小路上铺满了金色的落叶，一直通向森林深处。\n\n"好奇怪的路，以前怎么没注意到呢？"一休好奇地沿着小路走了进去。\n\n走了一会儿，前面出现了一棵巨大无比的老树。这棵树比村子里最高的房子还高，树干粗得十个一休手拉手也围不过来。最奇怪的是，树干上有两个大洞和一条弯弯的裂缝，看起来就像一张脸——两只眼睛和一张嘴巴。\n\n一休正看着呢，那张"脸"突然动了！\n\n"小姑娘，你迷路了吗？"老树开口说话了，声音像打雷一样低沉。\n\n一休吓了一跳，往后退了几步。但她很快就不怕了，因为老树的声音虽然大，但听起来很温柔。\n\n"我没有迷路，我在探险！"一休挺起了小胸膛。\n\n老树哈哈笑了，树叶哗啦啦地抖："好久没有人敢走这条路了。小姑娘，我有一个忙想请你帮。"\n\n"什么忙？"\n\n"我的树根下面住着一窝小兔子，可是昨天一只大黑蛇钻到了我的根底下，小兔子们吓得不敢出来吃东西。我是树，没有手也没有脚，赶不走蛇。你能帮我想想办法吗？"\n\n一休蹲下来看了看树根下面。果然，黑暗的洞口里有一双闪着寒光的小眼睛——蛇正盘在里面。洞口旁边缩着几只瑟瑟发抖的小白兔。\n\n"嗯，让我想想办法。"一休托着下巴想了一会儿。\n\n她跑到旁边的草地上，找到了好几株薄荷草。一休把薄荷草揉碎了，凑到鼻子前闻了闻——好冲！然后她把揉碎的薄荷草堆在了蛇洞口。\n\n可是蛇没反应。薄荷味还不够浓。\n\n一休又想了想。她注意到旁边有一个小水塘。她跑过去，用手捧了好多水回来，把水浇到了薄荷草上。薄荷草被水一泡，味道更冲了，刺鼻的味道飘进了洞里。\n\n蛇在里面开始扭动——它受不了薄荷味。但它还是没出来，因为洞里比外面暖和。\n\n一休皱了皱眉头。不行，得让洞里比外面更不舒服。\n\n她又跑到远处，找到了一堆带刺的松果。一休把松果一颗一颗滚进了洞口——松果上的刺扎着蛇的身体，又有薄荷味呛着它的鼻子。\n\n"嘶——"蛇终于受不了了，它从洞里窜了出来，朝着远离大树的方向飞快地溜走了。\n\n小兔子们从角落里跳了出来，围着一休的脚蹦来蹦去，开心极了。\n\n"谢谢你，小姑娘！"老树的树叶沙沙响，像在鼓掌，"你真聪明。作为感谢，我告诉你一个秘密——这片森林里有七颗彩虹种子，集齐它们就能实现一个愿望。第一颗种子就在我的树冠上。"\n\n一休抬头看——树顶上果然有一颗发着红光的小种子。老树弯下一根树枝，把种子送到了一休手里。\n\n红色的种子温温的，像一颗小太阳。\n\n"其他六颗在哪里呢？"一休问。\n\n"在森林的各个角落。每一颗都有一个守护者，你需要帮助他们解决困难才能得到种子。"老树说，"不过路上会有危险。你……害怕吗？"\n\n一休把红色种子小心地放进口袋里，笑着说："我不怕！让我想想办法就好了。"\n\n老树满意地点了点头，树叶发出温柔的沙沙声，像在说："那就去吧，勇敢的小姑娘。"\n\n一休挥了挥手，沿着金色的小路继续往前走。第一颗彩虹种子已经到手了，接下来还有六颗在等着她。\n\n今天的冒险，才刚刚开始。'
},

  title: '【一休历险记】第二集：河里的水怪',
  category: '一休',
  content: '一休沿着小路走了很久，来到了一条宽宽的大河边。河水清清的，能看到水底的石头和小鱼。河对面有一棵开满橙色花的大树——一休觉得第二颗种子可能就在那里。\n\n可是河上没有桥。河水看起来不深，但流得挺急的。\n\n一休正在想怎么过河，突然水面上冒出了一个大脑袋。那是一只巨大的乌龟，壳比桌子还大。\n\n"小姑娘，要过河吗？我可以驮你过去。"乌龟说。\n\n一休高兴极了，正要跳上去——等等。她想起了妈妈说过的话："太容易得到的东西，要多想一想。"\n\n一休看了看乌龟。乌龟的眼睛眨也不眨地盯着她，笑容看起来有点假。而且一休注意到——真正的乌龟壳是硬的，这只"乌龟"的壳上却长着水草，好像很久没动过。但是它刚才明明从水里冒出来了，怎么壳上会有生了根的水草呢？\n\n除非——它不是乌龟。\n\n一休假装很害怕地后退了几步："谢谢你，但是……你能先把头伸长一点让我看清你的脸吗？我有点怕生。"\n\n"乌龟"愣了一下，然后把脖子伸了出来——好长好长的脖子！比任何乌龟的脖子都长十倍。这哪是乌龟，分明是一只伪装成乌龟的大鳖精。\n\n"你不是乌龟！"一休指着它说。\n\n大鳖精见被识破了，一甩脖子，露出了嘴里尖尖的牙齿："哼，聪明的小丫头。那你就自己想办法过河吧，这条河是我的地盘！谁想过河都得从我肚子里过！"\n\n一休后退几步，看了看四周。河边有很多大石头和枯树枝。她注意到上游不远处，有一棵大树倒了一半，树干斜斜地伸向河面——如果再推一把，它就能倒到河中间。\n\n可是一休力气太小了，推不动大树。怎么办呢？\n\n一休看了看脚边的石头，又看了看那棵半倒的树。树根部已经松了，只有一点点泥土还连着。如果把树根下面的泥挖掉……\n\n一休捡起一块尖石头当铲子，跑到大树根部拼命挖。大鳖精在水里看着她，嘲笑道："你挖到明天也没用！"\n\n一休不理它，继续挖。挖了一会儿，泥土越来越松。但还差一点——树还是没倒。\n\n这时候一休又有了一个主意。她跑回河边，对大鳖精说："大鳖精先生，你力气一定很大吧？"\n\n"那当然！我是这条河里最有力气的！"大鳖精得意地说。\n\n"可我不信。你看那棵树，我打赌你撞不倒它。"一休指了指那棵半倒的树。\n\n"哈！就这？"大鳖精爬上岸，"看着！"它一头撞向了那棵已经被一休挖松了根的大树——\n\n"咔嚓——轰！"大树倒了！正好倒向河面，横跨两岸，变成了一座天然的桥。\n\n大鳖精愣住了："等等，你是不是故意的……"\n\n一休已经跳上了树干桥，飞快地跑向对岸。"谢谢你帮我架桥呀！"一休回头笑着喊。\n\n等大鳖精反应过来想追的时候，一休已经跳到了对岸，大树桥承受不了鳖精的重量，"咔嚓"断了，掉进了河里。\n\n大鳖精在河里气得拍水，一休在对岸朝它挥挥手，蹦蹦跳跳地走向了那棵开满橙色花的大树。\n\n树上果然挂着一颗发着橙光的彩虹种子。一休小心地把它摘下来放进口袋——两颗了！\n\n"让聪明的脑袋替代力气，"一休拍了拍口袋里两颗温暖的种子，"还有五颗，加油！"'

  title: '【一休历险记】第三集：迷雾里的歌声',
  category: '一休',
  content: '一休走进了森林更深处。这里的树又高又密，阳光几乎照不进来。走着走着，一团浓浓的白雾从地面升了起来，越来越浓，越来越浓——一休伸出手都看不见自己的手指了。\n\n"好大的雾啊……"一休有点紧张。她完全看不清路了。\n\n就在这时候，雾里传来了一阵好听的歌声。歌声轻柔甜美，像妈妈哼的摇篮曲。\n\n"跟着歌声走吧，那里一定有人。"一休心想。她循着歌声慢慢往前走。\n\n可是越走越不对劲——脚下的地面变得软绵绵的，像踩在棉花上。一休低头一看，她脚下是一片绿色的苔藓，苔藓下面好像是……泥潭！\n\n一休赶紧停住脚。她轻轻往后退了一步——鞋底"啪嗒"一声从烂泥里拔出来。好险！再往前一步就陷进去了。\n\n歌声还在前面响着，比刚才更好听了，像在说："来呀，来呀，再往前走一点点。"\n\n一休明白了——这歌声不是在帮她，是在骗她往泥潭里走！这一定是森林里的妖精在用歌声引诱路人掉进陷阱。\n\n"我才不上当。"一休蹲下来想办法。\n\n她摸了摸地面，用手指敲了敲——硬的地方敲起来"邦邦"响，软的地方敲起来"噗噗"闷响。一休捡起旁边的一根树枝，先在前面敲一敲，听声音判断地面是硬是软，然后再踩上去。\n\n就这样，一休一步一步地避开了泥潭，慢慢走出了危险区域。\n\n可是歌声还在响，而且一休发现——雾更浓了。歌声在她周围转来转去，好像在生气，因为一休没有掉进陷阱。\n\n"你出来！我知道你在故意骗人。"一休大声说。\n\n歌声停了。雾里出现了一个模糊的影子——是一只白色的小狐狸，长着三条尾巴。小狐狸看着一休，眼睛里全是惊讶。\n\n"你……你怎么没掉进去？"小狐狸问，"所有人听到我的歌声都会乖乖走过来的。"\n\n"因为我用脑子想了，不光用耳朵听。"一休说，"不过你为什么要骗人掉进泥潭呢？"\n\n小狐狸低下了头："我不是想害人……泥潭下面有一颗黄色的发光石头，我想让路人帮我捞出来。可是我说话没人信我（因为我是妖精），所以就用歌声引他们过来……但他们都掉进去就跑了。"\n\n"你想要的是这个吗？"一休想了想，"那颗黄色的发光石头？"\n\n"对！它是我妈妈的遗物，掉进泥潭里捞不出来了。"小狐狸的眼睛红了。\n\n一休看了看泥潭。直接走进去肯定会陷住。但如果用树枝从旁边的硬地面伸过去呢？\n\n一休找了一根最长的树枝，趴在泥潭边缘的硬地上，用树枝在泥潭里面搅动、拨拉。搅了好一会儿——"咔"，树枝碰到了一个硬东西。\n\n一休小心地用树枝把那个东西拨到了浅处，然后伸手够出来——果然是一颗发着黄色光芒的石头！\n\n"我的妈妈的石头！"小狐狸跳了起来，眼泪都掉了出来，"谢谢你谢谢你！"\n\n小狐狸捧着石头看了一会儿，然后把它举到一休面前："等等……这不是普通的石头。你看，它在发光——它是彩虹种子！我妈妈一直在守护它。"\n\n一休接过来一看——果然！和口袋里的红色、橙色种子一样，只不过这颗是黄色的。\n\n"这是我妈妈让我给\'勇敢又善良的人\'的。"小狐狸笑了，"你就是那个人。"\n\n一休把黄色种子放进口袋——三颗了。\n\n"对了，"小狐狸摇摇三条尾巴，雾渐渐散开了，"我把雾收了，给你让路。以后你在森林里如果遇到麻烦，叫三声\'小白\'，我会来帮你的。"\n\n"谢谢你，小白！"一休笑着和小狐狸挥手告别。\n\n雾散了，阳光洒进来，前面的路清清楚楚。一休拍了拍口袋里三颗温暖的种子，继续往前走去。'
},
{
  id: 'yixiu_4',
  title: '【一休历险记】第四集：石头巨人的谜语',
  category: '一休',
  content: '一休来到了一座小山前面。山不算高，但山路很窄，只能容一个人走过去。更麻烦的是——山路口站着一个巨人。\n\n不是真的巨人，是用石头堆成的巨人。它有三米高，身体是灰色的岩石拼成的，两只眼睛是两块亮晶晶的水晶。\n\n一休走近的时候，石头巨人突然动了。它低下巨大的脑袋，用石头摩擦的声音说："要过此山，先答我三个问题。答对了可以过，答错了……就得回头走远路。"\n\n"好啊，你问吧。"一休一点也不怕。\n\n石头巨人的第一个问题："什么东西越洗越脏？"\n\n一休想了想，笑了："水！水用来洗东西，东西干净了，水就变脏了。"\n\n石头巨人点了点头，眼睛里的水晶闪了一下："对了。第二个问题——什么东西有嘴不能说话，有床不能睡觉，有脚不能走路？"\n\n一休歪着脑袋想。有嘴不能说话……有床不能睡……有脚不能走……\n\n"河！"一休拍手说，"河有河嘴（入海口），有河床，有河脚（河的分支），但它不会说话不会睡觉也不会走路。"\n\n石头巨人又点了点头："聪明。最后一个问题——"它的声音变得严肃起来，"什么东西你看不见它，但它一直跟着你？"\n\n一休想了好久。看不见的东西……一直跟着自己……是影子吗？不对，影子看得见。是空气吗？也不对，空气不是"跟着"你。\n\n一休突然想起来了："是时间！时间看不见摸不着，但它一直一直跟着每个人，一秒都不停。"\n\n石头巨人愣了好一会儿。然后它慢慢弯下了身体——不是要攻击一休，而是在……鞠躬。\n\n"一百年来，你是第一个三道题全答对的人。"石头巨人的声音变得温和了很多，"小姑娘，你很了不起。"\n\n石头巨人伸出大手，手心里躺着一颗绿色的发光种子。"这是我守护了一百年的彩虹种子。送给你。"\n\n一休高兴地接过来——四颗了！\n\n石头巨人慢慢让开了路，然后它又开口了："小姑娘，前面的路会越来越难。但记住——真正的答案不一定在书本里，有时候在你的心里。"\n\n"谢谢你，石头巨人先生！"一休鞠了个躬，然后蹦蹦跳跳地从它身边跑过去，踏上了山路。\n\n走了几步一休回头看——石头巨人已经不动了，又变成了一堆普普通通的石头。如果不是手里多了一颗绿色种子，一休都会以为自己在做梦。\n\n"四颗了。"一休数了数口袋里的种子，"红色、橙色、黄色、绿色。还差三颗。"\n\n山路虽然窄，但一休走得很稳。阳光照在她身上，暖暖的。她知道，前面还有更有趣的冒险在等着她。'
},
{
  id: 'yixiu_5',
  title: '【一休历险记】第五集：暗洞里的萤火虫王',
  category: '一休',
  content: '翻过小山之后，一休发现前面的路被一座巨大的山洞挡住了。绕路要多走三天，而穿过山洞只需要半天。但山洞里面黑黑黑的，什么都看不见。\n\n"我不怕黑。"一休给自己打气。她在洞口捡了一根干树枝，想点一个火把。可是她没有打火石，也没有火柴。\n\n正发愁呢，洞口的石壁上飞来了一只小萤火虫，屁股上一闪一闪地发着绿光。\n\n"小萤火虫，你能帮我照路吗？"一休伸出手指。\n\n小萤火虫落在了一休的指尖上，可是一只萤火虫的光太微弱了，只能照亮巴掌大的地方。\n\n一休走进了山洞。小萤火虫在她指尖微微发光，只够看到脚前面一步的距离。一休慢慢走，一步一步小心翼翼。\n\n走了一会儿，一休听到了前面传来"叽叽叽"的声音——是蝙蝠！很多很多蝙蝠倒挂在洞顶上。它们被一休的脚步声惊动了，开始骚动起来。\n\n"哗——"一群蝙蝠突然飞了起来，扑打着翅膀朝一休冲来！蝙蝠虽然不咬人，但一大群扑过来还是很可怕。\n\n一休本能地蹲了下来。蝙蝠们从她头顶飞过——好险！但她的萤火虫朋友被蝙蝠的翅膀带起来的风吹跑了，绿光消失在了黑暗中。\n\n一休什么都看不见了。彻底的黑暗。\n\n"别怕别怕。"一休对自己说。她摸着洞壁慢慢走。手指沿着石壁一直摸，这样至少不会走到路中间掉进什么坑里。\n\n可是走着走着，一休的手碰到了一个奇怪的东西——黏黏的、软软的。一休"啊"了一声缩回手。\n\n黑暗中响起了一个很小很小的声音："别……别怕……我是蜗牛……"\n\n一休的心稳了下来："你怎么在这里？"\n\n"我迷路了……我进来找吃的，但蝙蝠把我吓住了，我就缩在壳里不敢动了……已经三天了……"蜗牛的声音越来越小。\n\n"别担心，我带你出去。"一休把蜗牛轻轻放在了自己肩膀上。\n\n可是问题来了——没有光，一休自己也不知道哪个方向是出口。\n\n一休站在原地想了想。洞穴有两个口——她进来的那个，和另一端的出口。出口那边应该有光线透进来。但现在一点光都没有，说明她还在洞的中间部分。\n\n那怎么判断方向呢？\n\n一休想到了一个办法——她蹲下来贴着地面感受风。洞穴两头通风的话，中间应该有微弱的气流。一休把手贴在地面，果然感觉到了一丝丝凉风——从前面吹来的。\n\n"有风的方向就是出口。"一休站起来，迎着风的方向走。\n\n走了好一阵子，前面突然出现了一丝微弱的光——是出口的光！一休加快了脚步。光越来越亮，越来越亮——\n\n"呼——"一休冲出了山洞，阳光洒了她一脸。好暖和！\n\n肩膀上的蜗牛也高兴地伸出了触角："太好了，终于出来了！"\n\n"谢谢你陪我走完黑暗的路。"一休笑着说。\n\n蜗牛说："不不不，是你救了我。作为感谢，我告诉你一个秘密。"蜗牛的壳上发出了淡淡的蓝光——壳里面竟然藏着一颗彩虹种子！蓝色的。\n\n"这是我一直背着的宝贝。可是找到能拥有它的人比宝贝本身更重要。"蜗牛说，"你在完全看不见的时候都没有放弃，还帮了我。你配得上这颗种子。"\n\n一休接过蓝色种子——五颗了！\n\n那只被蝙蝠吹跑的小萤火虫这时也飞了回来，落在一休肩上"叽叽"叫着，好像在说"对不起我刚才不见了"。\n\n一休拍了拍它说："没事，我们都很勇敢。走吧，继续冒险！"\n\n一人一虫一蜗牛，朝着阳光灿烂的前方走去。'
},

  id: 'yixiu_6',
  title: '【一休历险记】第六集：假公主和真怪兽',
  category: '一休',
  content: '一休走到了一片花田旁边。花田里开满了紫色的薰衣草，香香的。花田中间有一座小小的石头塔，塔顶有一面小旗子在风中飘。\n\n塔前面坐着一个穿着粉色裙子的女孩，比一休大一点。女孩正在哭。\n\n"你怎么了？"一休跑过去问。\n\n"我是这片花田的公主，"女孩抽泣着说，"有一只大怪兽住在花田下面，每天晚上都出来吃我的花。如果花被吃光了，我的魔法就会消失。你能帮我赶走怪兽吗？"\n\n"怪兽在哪里？"一休问。\n\n"就在那个洞里。"公主指着花田边缘的一个大黑洞，"可是它很大很凶，我不敢过去。"\n\n一休走到洞口看了看。洞很深，里面黑黑的，能听到很响的呼噜声——好像有什么大东西在里面睡觉。\n\n"我去看看。"一休拿起一根树枝，悄悄走进了洞口。\n\n洞里面有一只……大花猫？一休瞪大了眼睛。这根本不是什么怪兽，就是一只特别特别大的猫——大概是被什么魔法变大了。大花猫正在呼呼大睡，旁边还有吃剩的花瓣。\n\n一休退出来对"公主"说："那不是怪兽，是一只大猫。它只是吃了你的花而已。"\n\n公主的表情突然变了。她不哭了，笑容变得有点阴阴的："你确定只是一只大猫？"\n\n一休觉得不对劲了。她仔细看"公主"——公主的影子好像有点奇怪。人的影子应该跟人长得一样，可这个"公主"的影子……有尾巴！\n\n"你不是公主。"一休后退了一步。\n\n"公主"哈哈笑了起来，"噗"一声变回了原形——是一只灰色的大老鼠精！比一休还高。\n\n"聪明的小丫头，可惜发现得太晚了。"老鼠精说，"那只大猫是我变大的，就是为了引好奇的人走进洞里，然后我从后面把洞口堵住——嘿嘿嘿。"\n\n一休回头看——老鼠精真的在慢慢移动一块大石头，想堵住洞口！\n\n一休赶紧想办法。她不能让老鼠精堵住洞口，否则自己和大花猫都出不来了。\n\n"小白！小白！小白！"一休大声喊了三遍。\n\n远处的树林里传来了一声"嗖——"一道白影冲了过来——是小白！三尾小狐狸来了！\n\n小白看到了老鼠精，三条尾巴一竖，张嘴吐出了一团白色的迷雾，直接喷在了老鼠精脸上。\n\n"啊！我的眼睛！什么都看不见！"老鼠精丢下石头，抱着脸到处乱跑。\n\n一休趁机跑进洞里，用树枝在大花猫鼻子前面挠了挠——"阿嚏！"大花猫醒了。一休指着洞口说："那只老鼠把你变大了困在这里的，你不生气吗？"\n\n大花猫一看到外面正在乱跑的老鼠精——猫的本能发作了。\n\n"喵呜！！"大花猫从洞里冲了出去，一爪子拍在了老鼠精身上。老鼠精吓得魂飞魄散，变回了小老鼠的大小，"嗖"地钻进了地下逃跑了。\n\n大花猫追了一阵没追到，回来以后"噗"地缩回了正常猫的大小——老鼠精的魔法解除了。\n\n小花猫蹭了蹭一休的腿，喵喵叫着表示感谢。花田里的薰衣草在微风中轻轻摇摆，好像在庆祝胜利。\n\n一休在石塔底座里发现了一颗紫色的彩虹种子——老鼠精一直想得到它但拿不到，因为种子只有善良的人才能碰到。\n\n六颗了！还差最后一颗。\n\n小白摇着三条尾巴说："最后一颗种子在森林最深处的月亮湖。那里……很危险。"\n\n一休摸了摸口袋里六颗温暖的种子，深吸一口气："没关系。让我想想办法就好了。"'

  title: '【一休历险记】第七集：月亮湖和七色彩虹',
  category: '一休',
  content: '一休带着小白和小花猫一起出发了。萤火虫也跟着，在一休头顶飞来飞去当小灯笼。\n\n走了很久很久，森林越来越安静，树越来越高。终于，前面出现了一片开阔的湖面——月亮湖。\n\n湖水是银色的，像真的月亮化成了水一样。湖面平静得像一面镜子，倒映着天上所有的星星。好美啊。\n\n湖的正中间有一座小岛，小岛上有一棵发着七彩光芒的小树。树上挂着最后一颗种子——彩虹色的，比前面所有种子都亮。\n\n"就在那里！"一休兴奋地说。可是怎么过去呢？湖面很宽，游过去的话水太凉了。\n\n一休四周看了看，湖边有一些圆圆的大荷叶，大得像伞一样。一休试着踩上去——能撑住！荷叶很结实。\n\n一休开始踩着荷叶一片一片往湖中间跳。小白太重了跳不上荷叶，只能在岸边等。小花猫和萤火虫跟着一休一起。\n\n跳到湖中间的时候，水面突然不平静了。"咕噜咕噜——"水底冒出了一串大泡泡，然后一个巨大的银色鱼头从水里冒了出来。\n\n是一条巨型锦鲤——比一休的房子还大。它用巨大的眼睛盯着一休看。\n\n"你是来拿最后一颗种子的？"大鱼的声音像流水一样柔和。\n\n"是的！"一休站在荷叶上，努力保持平衡。\n\n"这颗种子不是靠聪明就能拿到的。"大鱼说，"前六颗种子考验了你的智慧、勇气、善良和坚持。但最后一颗——考验的是你的心。"\n\n"我的心？"\n\n"告诉我，你集齐七颗种子以后，想许什么愿望？"\n\n一休想了想。一路上她遇到了好多朋友——老树、小兔子们、小白狐狸、蜗牛、大花猫、萤火虫。她想到了什么愿望呢？\n\n"我想让彩虹森林永远平安。"一休说，"这样我的朋友们就不用害怕坏蛇、坏鳖精、老鼠精了。"\n\n大鱼的眼睛闪了闪："你不是为自己许愿？你可以许任何愿望——变成公主、有吃不完的糖果、会飞……"\n\n一休摇了摇头："那些东西没有的话也没关系。但如果朋友们不安全，我会一直担心的。"\n\n大鱼沉默了一会儿，然后它整个身体沉入了水中。一休以为它走了——突然，湖面"哗——"一大团水柱升了起来，把一休连着荷叶一起托到了小岛上。\n\n一休稳稳落在了小岛上，面前就是那棵七彩小树。彩虹色的种子在枝头闪耀着光芒，比星星还亮。\n\n一休伸手轻轻摘下了种子。它比别的种子都暖，像捧着一颗小太阳。\n\n"七颗种子都集齐了。"一休把它们都拿出来，放在手心里——红、橙、黄、绿、蓝、紫、彩虹色，七颗种子在她手里排成一排，发出了温柔的七色光芒。\n\n光芒越来越亮，越来越亮。七颗种子慢慢飘了起来，在空中转了一圈，然后"嗖嗖嗖"地飞向了天空——\n\n天上出现了一道最美最美的彩虹。不是普通的彩虹，是一道会发光的、永远不消失的彩虹。它横跨整个森林，让森林里每个角落都洒满了温柔的七色光。\n\n大鱼从水里探出头来："你的愿望实现了。从今以后，彩虹之光会保护这片森林。坏东西再也不敢来了。"\n\n一休看着天上的彩虹笑了。小白从岸边朝她摇尾巴，萤火虫在空中画着圈圈，小花猫喵喵叫着。\n\n大鱼又浮上来一次，用水柱把一休送回了岸边。\n\n小白跑过来蹭了蹭一休的手："一休，你是我见过的最勇敢也最善良的人类。"\n\n一休抱起小花猫，萤火虫落在了她的辫子上。"回家吧，"一休笑着说，"妈妈该担心了。"\n\n她沿着来时的路往回走。头顶上那道永远的彩虹一路照着她，像妈妈的手一样温暖。\n\n一休知道，她以后还会有更多的冒险。但不管遇到什么，只要动动脑筋，只要有朋友在身边——就没有解决不了的问题。'
},
{
  id: 'duck_1',
  title: '【唐老鸭和花栗鼠】第一集：石头足球',
  category: '唐老鸭',
  content: '花栗鼠实在不喜欢再跟唐老鸭玩了，因为唐老鸭每次都要开人家的玩笑或者是捉弄人家。好比昨天来说吧，唐老鸭把花栗鼠的一个足球踢到很远很远的树林里，害他找了好久好久才找到那一个足球。\n\n花栗鼠越想越不甘心，她心里想，我今天一定要给唐老鸭一个教训。\n\n花栗鼠找到一个又圆又大的石头，然后用水彩把石头画得像一个足球一样，放在草地上。\n\n不久唐老鸭来了。唐老鸭有一个坏毛病，那就是当他看到足球一定要踢。所以当唐老鸭看到草地上有一个足球，马上就跑过去，不管三七二十一用力一踢。\n\n"啊！痛死我了！啊！这怎么回事啊！怎么会有这么硬的足球啊！哎呀！"\n\n唐老鸭抱着他的腿痛得跳来跳去。花栗鼠躲在一棵大树上笑得好开心啊。\n\n从此以后唐老鸭再也不敢乱踢别人的足球了。'
},
{
  id: 'duck_2',
  title: '【唐老鸭和花栗鼠】第二集：偷吃松果的贼',
  category: '唐老鸭',
  content: '花栗鼠辛辛苦苦地在树洞里存了一大堆松果，准备冬天吃。每一颗都是她爬到最高的松树上摘下来的，累得手都酸了。\n\n可是有一天早上，花栗鼠发现自己的松果少了好多。是谁偷的呢？\n\n花栗鼠在树洞门口发现了一串大大的脚印——鸭子的脚印！扁扁的，三个脚趾头，除了唐老鸭还有谁。\n\n"气死我了！"花栗鼠握着小拳头。可是她不能直接去找唐老鸭吵架，因为唐老鸭个子大，吵不过他。得想个聪明的办法。\n\n花栗鼠想啊想，嘿嘿笑了起来。\n\n她跑到厨房里，拿了好多辣椒粉。然后她把几颗松果掰开，把辣椒粉塞到了松果壳里面，再合上放回原来的位置。从外面看，这些松果跟普通松果一模一样。\n\n然后花栗鼠假装出门了，其实她偷偷爬到了旁边的树上躲着看。\n\n果然！没过多久，唐老鸭鬼鬼祟祟地来了。他左看看右看看，确认花栗鼠不在家，就伸手进树洞里抓松果。\n\n唐老鸭抓了一大把松果，坐在草地上就开始剥着吃。第一颗正常的松果，"嗯，真香！"第二颗也正常。第三颗——\n\n"噗！！！啊啊啊啊！辣死了！！辣死了！！水！水！给我水！！！"\n\n唐老鸭的脸一下子变得通红，眼泪哗啦啦地流，鼻涕也流出来了。他张着嘴巴到处跑，"呱呱呱"地叫着冲到了小河边，把整个脑袋埋进了水里。\n\n"咕噜咕噜咕噜——"唐老鸭在水里灌了一肚子水，才觉得嘴巴没那么辣了。\n\n花栗鼠在树上笑得差点掉下来。她大声说："唐老鸭！偷人家东西的滋味好不好啊？"\n\n唐老鸭抬起湿淋淋的脑袋，看到了花栗鼠，脸更红了——这次是害臊。\n\n"我……我以后不偷你松果了……"唐老鸭小声说。\n\n"说话算话？"\n\n"算话……呱……"唐老鸭打了一个辣嗝，又跑去喝水了。\n\n从此以后唐老鸭再也没偷过花栗鼠的松果。不过每次看到松果，他还是会忍不住打个喷嚏——那个辣味儿，他一辈子都忘不了。'
},
{
  id: 'duck_3',
  title: '【唐老鸭和花栗鼠】第三集：水枪大王',
  category: '唐老鸭',
  content: '唐老鸭不知道从哪里弄来了一把超大的水枪。那水枪比花栗鼠的身体还长，能喷好远好远的水。\n\n唐老鸭带着水枪到处喷人。他喷了小鸟一身水，小鸟的毛都贴在身上飞不起来了。他喷了小兔子一脸水，小兔子哭着跑回了家。最后他看到了花栗鼠正在草地上晒太阳。\n\n"哗——！"唐老鸭对着花栗鼠就是一枪。花栗鼠整个被水淋透了，像一只落水的小老鼠。\n\n"哈哈哈哈！你看你，变成小湿鼠了！"唐老鸭笑得在地上打滚。\n\n花栗鼠气得浑身发抖。她湿漉漉地回了家，一边拧衣服上的水一边想办法。\n\n第二天，花栗鼠来找唐老鸭说："唐老鸭，我发现了一个秘密宝藏洞，里面有好多好多金币！但是洞口太小，我进不去。你帮我一起去看看好不好？"\n\n唐老鸭一听到金币，眼睛都放光了："在哪里在哪里？快带我去！"\n\n花栗鼠带着唐老鸭走了一段路，来到了一棵大树旁边。树根下面有一个洞口。\n\n"就在里面，你先把头伸进去看看。"花栗鼠说。\n\n唐老鸭也没多想，趴在地上把脑袋伸进了洞口——里面黑黑的，什么也看不见。"我什么都看不到啊，你骗——"\n\n话没说完——"哗！！！！"一大桶水从树上倒了下来，正好浇在唐老鸭屁股和后背上。\n\n原来花栗鼠昨天晚上就在树上绑了一桶水，用绳子系着。花栗鼠只要一拉绳子，水就倒下来。\n\n唐老鸭从洞口拔出脑袋，浑身上下湿透了。水从他的帽子上滴滴答答地流，活像一只落汤鸡——不对，落汤鸭。\n\n"你！你故意的！"唐老鸭气得呱呱叫。\n\n花栗鼠抱着肚子笑："昨天你喷我水的时候挺开心的呀？今天轮到你了，感觉怎么样？"\n\n唐老鸭张了张嘴，说不出话来。他想想自己昨天拿水枪喷人的时候确实很讨厌。现在自己被浇了一头，才知道有多难受。\n\n"我……我以后不拿水枪喷人了。"唐老鸭耷拉着翅膀说。\n\n"真的？"\n\n唐老鸭使劲点头："真的真的！我把水枪扔了还不行吗！"\n\n花栗鼠这才满意了。她递给唐老鸭一条干毛巾："擦擦吧，别感冒了。"\n\n唐老鸭接过毛巾，心想：以后还是别招惹花栗鼠了，这个小家伙报仇的办法比自己狠多了。'
},
{
  id: 'duck_4',
  title: '【唐老鸭和花栗鼠】第四集：吹牛大王',
  category: '唐老鸭',
  content: '唐老鸭有一个毛病——特别爱吹牛。\n\n今天唐老鸭在草地上对一群小动物吹牛："我告诉你们，我昨天一个人打败了一只大灰熊！大灰熊比我高三倍，可是我一拳就把它打跑了！"\n\n小动物们都"哇"地张大了嘴巴。只有花栗鼠在旁边翻白眼——她知道唐老鸭昨天明明在家睡觉，连门都没出。\n\n唐老鸭越吹越起劲："我还能举起一棵大树呢！而且我跑步比兔子还快！"\n\n花栗鼠忍不住了，她说："唐老鸭，你真的那么厉害吗？那我们比一比好不好？"\n\n"比什么？"唐老鸭假装很轻松地说，心里有点慌。\n\n"你不是说你比兔子跑得快吗？那我们比赛跑步。从这棵树跑到那棵树，谁先到谁赢。输了的人要当着所有人的面说——我是吹牛大王。"\n\n唐老鸭骑虎难下——这么多动物看着呢，不比的话就等于承认自己吹牛了。"比就比！谁怕谁！"\n\n比赛开始了。花栗鼠个子虽然小，但她轻巧得很，"嗖嗖嗖"就跑出去了。唐老鸭的鸭子脚是扁的，跑起来"啪嗒啪嗒"地拍着地面，又慢又笨。\n\n跑到一半唐老鸭就喘不上气了。花栗鼠已经到了终点在那里喝水了。\n\n"唐老鸭你好慢啊！说好的比兔子还快呢？"花栗鼠笑着喊。\n\n唐老鸭红着脸跑到终点的时候，所有小动物都看着他。\n\n"来吧，说你的。"花栗鼠双手抱在胸前。\n\n唐老鸭低着头，小声嘟囔："我是……吹牛大王……"\n\n"大声点！后面的听不见。"\n\n"我是吹牛大王！！"唐老鸭闭着眼睛喊了出来。\n\n小动物们全笑了。唐老鸭的脸红得像西红柿。\n\n花栗鼠走过去拍了拍唐老鸭的背说："不用不好意思啦。其实你也有很多真的优点啊——你游泳特别好，你的嗓门也最大。干嘛非要编假的呢？"\n\n唐老鸭抬起头想了想，好像也是。他游泳确实比谁都快，这是真本事，根本不用吹牛。\n\n从那以后唐老鸭不怎么吹牛了。偶尔想吹的时候，一想起当着所有人面前喊"我是吹牛大王"的那个画面，嘴巴就自动闭上了。'
},
{
  id: 'duck_5',
  title: '【唐老鸭和花栗鼠】第五集：不还玩具的唐老鸭',
  category: '唐老鸭',
  content: '花栗鼠有一辆特别好看的红色小汽车玩具。四个轮子能转，车门能开，按喇叭还能"嘀嘀"响。花栗鼠宝贝得不得了。\n\n唐老鸭看到了，说："花栗鼠，你的小汽车借我玩一天好不好？就一天，明天就还。"\n\n花栗鼠犹豫了一下，但想着大家是朋友，就答应了："好吧，明天一定要还哦。"\n\n第二天花栗鼠去找唐老鸭要车。唐老鸭说："再借一天嘛，就一天。"\n\n第三天去要，唐老鸭说："我还没玩够呢，后天还。"\n\n第四天第五天第六天……唐老鸭每次都有新借口。一个星期过去了，小汽车还在唐老鸭家里。\n\n花栗鼠生气了。但她不想跟唐老鸭吵架，她要想一个让唐老鸭自己主动还回来的办法。\n\n花栗鼠跑去跟小兔子借了一辆更大更酷的蓝色遥控赛车。那辆赛车能遥控，跑起来特别快，还能翻跟斗。\n\n花栗鼠在唐老鸭家门口的空地上玩遥控赛车。赛车"嗖嗖嗖"地跑来跑去，一会儿翻个跟斗，一会儿来个漂移。\n\n唐老鸭从窗户里看到了，眼珠子都快掉出来了。他跑出来说："哇！这个车好酷！花栗鼠你借我玩玩！"\n\n花栗鼠说："可以呀。不过这是小兔子的车，小兔子说了，要用东西来换着玩。你有什么可以拿来换？"\n\n唐老鸭想了想："我有弹弓？"\n\n"不要。"\n\n"我有一顶帽子？"\n\n"不要。"\n\n唐老鸭着急了："那你要什么嘛？"\n\n花栗鼠指了指唐老鸭的窗台——那里放着她的红色小汽车。"把那辆红色小汽车还给我，我就让你玩一次遥控赛车。"\n\n唐老鸭愣了一下，脸红了。他跑回家拿出了红色小汽车，递给花栗鼠："给你给你……"\n\n花栗鼠接过自己心爱的小汽车，检查了一下——还好没坏。她把遥控器递给唐老鸭："玩十分钟哦，十分钟后还。"\n\n唐老鸭高高兴兴地玩了十分钟遥控赛车，然后乖乖还了回来。\n\n花栗鼠抱着自己的红色小汽车，对唐老鸭说："以后借了东西要按时还。不然下次没人愿意借给你了。"\n\n唐老鸭挠了挠脑袋："知道了知道了……"\n\n从那以后唐老鸭借东西都会按时还了。因为他发现——守信用的人，别人才愿意把好东西跟你分享。'
},
{
  id: 'duck_6',
  title: '【唐老鸭和花栗鼠】第六集：半夜吓人',
  category: '唐老鸭',
  content: '唐老鸭觉得万圣节还没到就可以吓人了。他在网上买了一个鬼面具——白色的脸，黑色的眼窝，还有一张大嘴巴，看起来很吓人。\n\n晚上天黑了以后，唐老鸭戴上鬼面具，偷偷跑到花栗鼠家门口。他躲在花栗鼠家的窗户下面，等花栗鼠开窗户的时候突然跳起来——\n\n"嗷——！！"唐老鸭学着鬼叫。\n\n"啊啊啊啊！！"花栗鼠吓得从椅子上摔了下来，整个人缩在墙角瑟瑟发抖。\n\n唐老鸭摘下面具哈哈大笑："是我是我！哈哈哈你的表情太好笑了！"\n\n花栗鼠气得快哭了。她好久好久才从害怕中缓过来。那天晚上她一个人在家，差点吓出心脏病。\n\n花栗鼠决定——要让唐老鸭知道被吓的感觉。\n\n第二天白天，花栗鼠去找了住在森林边上的猫头鹰爷爷。猫头鹰爷爷的叫声很特别——"呜——呜——"低沉又瘆人，尤其是晚上听到特别像鬼叫。\n\n花栗鼠跟猫头鹰爷爷说了唐老鸭吓人的事，猫头鹰爷爷答应帮忙。\n\n当天晚上，唐老鸭正一个人走夜路回家。路过树林的时候——\n\n"呜——呜——"一个低沉恐怖的声音从头顶上方传来。\n\n唐老鸭停住了脚步，脖子后面的毛都竖起来了。"谁……谁在那里？"\n\n"呜——呜——唐老鸭——我是树林里的鬼——"声音越来越近。\n\n唐老鸭吓得腿都软了："别别别！我不是故意的！别来找我！"\n\n树上猛地飞下来一个黑影——巨大的翅膀张开——两只又大又圆的黄色眼睛在黑暗中发光。\n\n"鬼啊！！！"唐老鸭撒腿就跑，鞋子都跑掉了一只。他跑回家锁上门，窗帘全拉上，缩在被窝里抖了一整夜。\n\n第二天一大早，花栗鼠来敲唐老鸭的门。唐老鸭眼睛下面全是黑眼圈——一夜没睡。\n\n"唐老鸭，昨晚睡得好吗？"花栗鼠笑嘻嘻地问。\n\n唐老鸭看到花栗鼠的笑容，突然明白了："是你干的！那个鬼是你找来的！"\n\n"不是鬼，是猫头鹰爷爷。"花栗鼠说，"你昨天半夜吓我的时候，我也是这么害怕的。现在你知道了吧？"\n\n唐老鸭想起了自己昨晚有多怕，又想起花栗鼠被他吓的时候也是一样怕。他低下了脑袋。\n\n"对不起……我以后不吓人了。被吓真的好难受。"\n\n花栗鼠满意地点了点头："那把你那个鬼面具扔了吧。"\n\n唐老鸭跑进屋把面具拿出来，直接扔进了垃圾桶。\n\n从此唐老鸭再也没有半夜吓过人。因为他深深地记得那种——一个人在黑暗中听到恐怖声音时，心脏快要跳出来的感觉。'
},
{
  id: 'duck_7',
  title: '【唐老鸭和花栗鼠】第七集：画画比赛',
  category: '唐老鸭',
  content: '森林里要举办一场画画比赛，谁画得最好看就能得到一盒最高级的彩色蜡笔——64色的那种，花栗鼠做梦都想要。\n\n花栗鼠花了整整三天画了一幅画：蓝天白云下面，一片绿草地，草地上开满了五颜六色的小花，一只蝴蝶在花上面飞。画得真好看。\n\n唐老鸭也想要那盒蜡笔。可是唐老鸭画画不怎么样——他画的圆圈歪歪扭扭的，涂色还涂出格。\n\n比赛那天早上，花栗鼠把自己的画放在了门口晾干。她进屋去喝了杯水。\n\n等她出来的时候——画不见了！\n\n花栗鼠急得到处找。草地上找了，树洞里找了，都没有。她突然看到唐老鸭正抱着一幅画走过来——那幅画好像很眼熟。\n\n"唐老鸭！那是我的画！"花栗鼠追了上去。\n\n"什么你的画？这是我画的！"唐老鸭捂着画不让她看。\n\n花栗鼠急得快哭了。可是她没有证据。唐老鸭已经在画的右下角写上了自己的名字。\n\n花栗鼠想了想——对了！她画那幅画的时候在画的背面写了日期和自己的名字。唐老鸭肯定不知道。\n\n比赛开始了。评委兔子老师把所有人的画挂在墙上。唐老鸭得意洋洋地交了"自己的画"。\n\n兔子老师看了所有的画，觉得唐老鸭交的那幅最好。正要宣布唐老鸭获胜的时候——\n\n花栗鼠举手说："老师，能不能请你翻到那幅画的背面看看？"\n\n兔子老师翻过来一看——背面清清楚楚写着"花栗鼠画，星期一"。笔迹和画的风格一看就是一个人的。\n\n所有人都看向了唐老鸭。唐老鸭的脸白了，然后红了，然后又白了。\n\n"唐老鸭，这幅画是你画的还是花栗鼠画的？"兔子老师严肃地问。\n\n唐老鸭低下了头，声音像蚊子一样小："是……是花栗鼠画的……我偷的……"\n\n全场安静了。唐老鸭恨不得找个地洞钻进去。\n\n最后，花栗鼠得到了那盒64色的蜡笔。唐老鸭被取消了比赛资格，还当着所有人的面向花栗鼠道了歉。\n\n回家路上唐老鸭一直低着头。花栗鼠走到他旁边说："你如果想画画，我可以教你。用自己的手画出来的，才是真的。"\n\n唐老鸭愣了一下，然后小声说："你……你真的愿意教我？"\n\n"嗯。但你得保证——再也不偷别人的东西。"\n\n"我保证！"\n\n从那以后，每个周末唐老鸭都跟花栗鼠学画画。他画得虽然没有花栗鼠好，但每一幅都是自己认认真真画出来的，他觉得比偷来的画让人开心一百倍。'
},
{
  id: 'duck_8',
  title: '【唐老鸭和花栗鼠】第八集：不排队的唐老鸭',
  category: '唐老鸭',
  content: '森林里新开了一家冰淇淋店。今天是第一天开业，所有小动物都来排队买冰淇淋。队伍好长好长，从店门口一直排到了大树那边。\n\n花栗鼠排在队伍中间。她已经等了好久了，前面还有十几只小动物。太阳好晒啊，可是为了吃到草莓味的冰淇淋，值得等。\n\n正等着呢，唐老鸭大摇大摆地走了过来。他看了看长长的队伍，撇了撇嘴——他才不想排队呢。\n\n唐老鸭直接走到了队伍最前面，挤到了第一个位置。"老板，给我一个巧克力味的！"\n\n"喂！排队！"后面的小动物们喊了起来。\n\n"我就不排。"唐老鸭得意地说，"谁让我个子大呢。"\n\n花栗鼠看到了，气得咬牙。可是唐老鸭确实个子大，没人敢上去拉他。\n\n冰淇淋店的猪老板也很为难——唐老鸭挡在窗口，后面的人都买不了。\n\n花栗鼠想了一个办法。她跑出队伍，绕到了冰淇淋店的后面。她对猪老板小声说了几句话。猪老板听了以后笑了笑，点了点头。\n\n猪老板对唐老鸭说："好的客人，您要巧克力味的对吧？不过我们有一个新规矩——第一个买的客人要试吃一个\'特别口味\'。免费的哦！"\n\n唐老鸭一听免费的，更高兴了："什么特别口味？给我给我！"\n\n猪老板递出来一个冰淇淋甜筒。唐老鸭接过来一大口咬下去——\n\n"噗！！！什么味道！！"\n\n那是芥末味的冰淇淋。猪老板按照花栗鼠的主意做的。唐老鸭的脸皱成一团，眼泪鼻涕全出来了，辣得他在地上跳来跳去。\n\n所有排队的小动物都哈哈大笑。\n\n唐老鸭跑到旁边吐了好久，回来红着脸问："为什么给我芥末的！"\n\n猪老板笑着说："插队的人只能吃特别口味。排队的人才能选自己喜欢的口味哦。"\n\n唐老鸭看了看后面那些排着队的小动物，它们一个个买到了自己最喜欢的口味——草莓的、香草的、芒果的。\n\n唐老鸭委屈巴巴地走到了队伍最后面。等了好久好久，终于轮到他了。\n\n"这次给我正常的巧克力味……求你了。"\n\n猪老板笑着递给他一个大大的巧克力冰淇淋。唐老鸭吃了一口——真好吃。不知道是不是等了很久的关系，这个冰淇淋比什么都香。\n\n从那以后唐老鸭乖乖排队了。他发现——等待虽然很无聊，但得到的东西会更甜。'
},
{
  id: 'duck_9',
  title: '【唐老鸭和花栗鼠】第九集：乱扔垃圾',
  category: '唐老鸭',
  content: '唐老鸭吃东西从来不扔垃圾桶。香蕉皮随手一丢，糖纸随风飘，喝完的饮料瓶子到处滚。整个草地都被他弄得乱七八糟。\n\n花栗鼠每次路过都很生气："唐老鸭，你能不能不要乱扔垃圾？草地都被你弄脏了！"\n\n"哎呀，反正会有人捡的嘛。"唐老鸭满不在乎地又丢了一个苹果核。\n\n花栗鼠决定给唐老鸭一个终身难忘的教训。\n\n接下来的三天里，花栗鼠把唐老鸭扔的所有垃圾都捡了起来——香蕉皮、糖纸、饮料瓶、果核、塑料袋……统统收起来，装了满满一大袋子。\n\n第四天早上，唐老鸭打开自己的家门——\n\n"啊！！！这是什么！！"\n\n他的门口堆满了垃圾。香蕉皮、糖纸、饮料瓶……全部堆在门口，又脏又臭。唐老鸭一脚踩到了香蕉皮上，"哗——"滑了个四脚朝天。\n\n"谁！谁把垃圾倒我家门口的！"唐老鸭气得呱呱叫。\n\n花栗鼠从旁边走过来："这些全是你自己扔的。我帮你收好了，现在还给你。"\n\n唐老鸭看着那一大堆垃圾——天啊，自己三天就制造了这么多垃圾？堆在一起竟然这么多这么臭？\n\n"这……这都是我扔的？"\n\n"一样不少。"花栗鼠点点头，"你在草地上扔的时候觉得无所谓，因为垃圾分散在各个角落你看不到。可是它们不会消失，只是被你的眼睛忽略了。"\n\n唐老鸭看着自己家门口这堆又脏又臭的垃圾，想象了一下——如果所有人都像他一样乱扔，整个森林会变成什么样子。\n\n"我……我收拾。"唐老鸭找了个垃圾袋，默默地把门口的垃圾一样一样装了进去。装了整整两大袋。\n\n收拾完以后唐老鸭累得满头汗。他对花栗鼠说："这些垃圾应该扔到哪里去？"\n\n花栗鼠带他走到了森林边上的垃圾回收站："瓶子放这里，果皮放那里，纸放那里。"\n\n唐老鸭把垃圾分好类扔了进去。看着干干净净的地面，他突然觉得——干净的感觉真舒服。\n\n从那以后唐老鸭变成了森林里最爱干净的人。他不但不乱扔垃圾了，还经常帮忙捡别人扔的垃圾。因为他永远记得——家门口堆满臭垃圾的那个早晨。'
},
{
  id: 'duck_10',
  title: '【唐老鸭和花栗鼠】第十集：好朋友',
  category: '唐老鸭',
  content: '一转眼，唐老鸭认识花栗鼠已经很久了。\n\n他不再乱踢别人的球了。不再偷别人的松果了。不再拿水枪喷人了。不再吹牛了。不再不还东西了。不再吓唬人了。不再偷画了。不再插队了。不再乱扔垃圾了。\n\n唐老鸭变了好多好多。虽然偶尔还是会犯一点小毛病，但比以前好多了。\n\n今天是花栗鼠的生日。\n\n唐老鸭一大早就起来了。他想给花栗鼠一个惊喜。可是——他不知道花栗鼠喜欢什么礼物。\n\n唐老鸭想了想：花栗鼠喜欢松果，可是送松果太普通了。花栗鼠喜欢画画，可是唐老鸭画得不好……\n\n等等。唐老鸭跟花栗鼠学了好几个月的画了。虽然画得不如花栗鼠好，但比以前好了很多。\n\n唐老鸭拿出画笔和纸，认认真真地画了一幅画。画的是——他和花栗鼠一起站在草地上，旁边画了一棵大树、蓝天白云，还有一行歪歪扭扭的字："花栗鼠，谢谢你教我变好。生日快乐。"\n\n画好以后唐老鸭又用自己的零花钱去商店买了一个小蛋糕——草莓味的，因为他知道花栗鼠最喜欢草莓。\n\n唐老鸭捧着画和蛋糕来到花栗鼠家门口，紧张地敲了敲门。\n\n花栗鼠开了门。看到唐老鸭捧着蛋糕和一幅画站在门口，愣住了。\n\n"花栗鼠……生日快乐。"唐老鸭红着脸把东西递过去。\n\n花栗鼠接过画看了看——虽然画得还是歪歪扭扭的，颜色涂得也不太均匀。可是那行字"谢谢你教我变好"让花栗鼠鼻子一酸，眼睛有点湿了。\n\n"你……你记得我的生日？"\n\n"当然记得啊！你是我最好的朋友。"唐老鸭说，"虽然以前我总是欺负你……对不起。"\n\n花栗鼠笑了。她把唐老鸭拉进家门："快进来吃蛋糕。我也有东西给你看——"\n\n花栗鼠从柜子里拿出了一幅画。画上面是唐老鸭和花栗鼠在一起踢足球。这次画的足球是真的足球，不是石头。两个人都在笑。\n\n"这是我画的。"花栗鼠说，"你虽然以前坏毛病很多，但你每一次都改了。能改正错误的人，就是好人。我很高兴你是我的朋友。"\n\n唐老鸭的眼眶红了。他"呱"了一声，假装清嗓子，不让眼泪掉出来。\n\n"快吃蛋糕吧！化了就不好吃了。"花栗鼠赶紧打岔。\n\n两个好朋友坐在花栗鼠温暖的小树洞里，一起吃着草莓蛋糕。窗外的阳光照进来，暖暖的。\n\n唐老鸭心想：有一个愿意教你变好的朋友，比有一百个不管你的朋友都好。\n\n花栗鼠心想：有一个愿意改正错误的朋友，比什么都值得珍惜。\n\n阳光下，两个好朋友笑着碰了碰杯子里的果汁。\n\n"干杯！""干杯！呱！"'
},

  title: '【唐老鸭和花栗鼠】第十一集：抄作业的唐老鸭',
  category: '唐老鸭',
  content: '森林学校布置了作业——画一幅"我最喜欢的地方"。每个小动物都得自己画。\n\n花栗鼠画了一棵大橡树，树上挂满了金色的松果，树下面铺着柔软的落叶。她画了一整个下午，用了十二种颜色，画得特别用心。\n\n唐老鸭呢？他一笔都没动。他在家里看了一下午的动画片，把作业忘得干干净净。\n\n第二天早上要交作业了，唐老鸭急了。他看了看自己空白的纸，又看了看花栗鼠放在桌上还没交的画。\n\n"反正花栗鼠画的是一棵树，我也画一棵树不就行了？"唐老鸭拿出画笔，照着花栗鼠的画抄了起来。\n\n他画得歪歪扭扭的，颜色也涂出了格，但大致能看出来是同一棵树、同一个构图。\n\n交作业的时候，山羊老师把两幅画放在一起——咦？怎么两幅画画的东西一模一样？连树上松果的位置都一样？\n\n"花栗鼠，唐老鸭，你们两个过来。"山羊老师说。\n\n花栗鼠一看唐老鸭的画，气得脸都红了："他抄我的！"\n\n唐老鸭嘴硬："才没有！我也喜欢那棵树！"\n\n山羊老师笑了笑说："好吧，那我问你们一个问题。花栗鼠，你画的树上有几颗松果？"\n\n"七颗。"花栗鼠不假思索地回答。\n\n"唐老鸭，你画的树上有几颗松果？"\n\n唐老鸭愣住了。他抄的时候根本没数，画了多少颗他完全不知道。"呃……五颗？不对……八颗？"\n\n山羊老师把两幅画翻过来。花栗鼠的画背后写着创作日期——是三天前的。唐老鸭的画背后的颜料还是湿的——今天早上刚画的。\n\n全班小动物都看着唐老鸭。唐老鸭的脸红得像他的画笔上的红颜料。\n\n"唐老鸭，抄作业是不诚实的行为。你的这幅画零分。另外，你要重新画一幅不一样的。而且不能画树——得画别的。"山羊老师说。\n\n唐老鸭低着头回到了座位上。\n\n放学后花栗鼠本来很生气，但看到唐老鸭垂头丧气的样子，又有点不忍心了。她走过去说："你如果不知道画什么，我可以陪你去找灵感。但你必须自己画。"\n\n唐老鸭抬起头看着花栗鼠："你……不生我气了？"\n\n"气。但帮你不代表不气你。赶紧走吧，天黑之前得找到你真正喜欢的地方。"\n\n两个人走了一圈森林。最后唐老鸭停在了小河边——夕阳照在河面上，金灿灿的。\n\n"就画这个！"唐老鸭高兴地说。\n\n他坐在河边认认真真画了一个小时。虽然画得不如花栗鼠好看，但是夕阳的颜色他画得很用心——橙色、红色、金色混在一起，还真有那么点意思。\n\n第二天唐老鸭交了新画。山羊老师看了看，点了点头："虽然不完美，但这是你自己的作品。很好。"\n\n唐老鸭第一次因为自己画的画被表扬，心里比吃了蜜还甜。他终于明白了——自己做出来的东西，哪怕不完美，也比抄来的强一万倍。'
},
{
  id: 'duck_12',
  title: '【唐老鸭和花栗鼠】第十二集：说谎的鼻子',
  category: '唐老鸭',
  content: '唐老鸭打碎了妈妈最喜欢的花瓶。\n\n"不是我！是花栗鼠来家里玩的时候打碎的！"唐老鸭指着地上的碎片对妈妈说。\n\n花栗鼠今天根本没去唐老鸭家。可是唐老鸭妈妈信了，打电话跟花栗鼠妈妈"告状"了。\n\n花栗鼠在家被妈妈问了半天："你今天去唐老鸭家了吗？"\n\n"我没去啊！我一整天都在家画画！"花栗鼠委屈极了。\n\n花栗鼠妈妈相信自己女儿，但这件事得弄清楚。花栗鼠气冲冲地跑去找唐老鸭。\n\n"唐老鸭！你为什么说是我打碎的？我今天根本没去你家！"\n\n唐老鸭心虚地不敢看她："我……我没说……"\n\n"你妈妈都打电话来了！"花栗鼠眼睛红了，"你骗人还赖到我头上，你太过分了！"\n\n唐老鸭还是不承认。花栗鼠气得转身就走，不理唐老鸭了。\n\n一连三天，花栗鼠都不跟唐老鸭说话。唐老鸭去找她玩，她把门关上了。唐老鸭跟她打招呼，她扭过头去。\n\n唐老鸭开始慌了。他发现——没有花栗鼠的日子好无聊。没人陪他玩，没人跟他说话，连被花栗鼠骂都没有了。\n\n第四天，唐老鸭受不了了。\n\n他跑回家跟妈妈说了实话："妈妈……花瓶是我打碎的。不是花栗鼠。我说谎了。对不起。"\n\n唐老鸭妈妈虽然生气，但更多的是欣慰："你能主动承认错误，妈妈原谅你。但你必须去跟花栗鼠和她妈妈道歉。"\n\n唐老鸭来到了花栗鼠家门口，手里捧着自己用零花钱买的一包花栗鼠最爱吃的榛子。他敲了敲门。\n\n花栗鼠开门，看到唐老鸭眼睛红红的，手里捧着榛子。\n\n"花栗鼠……对不起。花瓶是我打碎的，我不应该赖你。我已经跟我妈妈说了实话了。"唐老鸭低着头说，"你能原谅我吗？我以后再也不说谎了。"\n\n花栗鼠看着唐老鸭。她能看出来他是真的后悔了——鼻子都红了，明显哭过。\n\n"你知道为什么说谎最可怕吗？"花栗鼠说，"不是因为被拆穿会丢脸。而是因为被冤枉的人会很伤心。我那三天每天都很难过，因为我明明没做错事却被怪。"\n\n唐老鸭的眼泪掉了下来："我知道了……真的知道了……"\n\n花栗鼠叹了口气，接过了榛子："好吧，原谅你了。但如果再有下一次——我一个月不跟你说话。"\n\n"绝对没有下一次！"唐老鸭拼命摇头。\n\n从那以后唐老鸭再也没说过谎。因为他知道了——说谎不是只骗了一个人，而是伤害了被冤枉的人的心。而且失去朋友信任的那三天，比任何惩罚都难受。'
},
{
  id: 'duck_13',
  title: '【唐老鸭和花栗鼠】第十三集：大嗓门',
  category: '唐老鸭',
  content: '唐老鸭的嗓门特别大。他说话从来不分场合，在哪里都是那个音量——\n\n图书馆里："花栗鼠！！你在哪呢！！"所有人都被吓了一跳，图书都从架子上震了下来。\n\n小兔子家的宝宝正在睡午觉，唐老鸭路过门口喊了一句："兔子！！你在家吗！！"宝宝被吵醒了，哇哇大哭。\n\n花栗鼠和唐老鸭一起散步的时候，唐老鸭说话的声音大得花栗鼠的耳朵嗡嗡响。花栗鼠说了好多次"你能不能小声点"，唐老鸭总是答应了过三秒钟又吼起来。\n\n花栗鼠决定让唐老鸭体会一下被大声吵的感觉。\n\n她去找了啄木鸟先生帮忙。啄木鸟的嘴巴啄起木头来"嗒嗒嗒嗒嗒"，比打鼓还响。\n\n第二天一大早——天才蒙蒙亮——唐老鸭还在甜甜地睡觉呢。\n\n"嗒嗒嗒嗒嗒嗒嗒！！！"\n\n啄木鸟在唐老鸭家门口的那棵树上使劲啄。那声音好像有人拿锤子在敲唐老鸭的脑壳。\n\n"啊啊啊！！什么声音！！"唐老鸭从床上弹了起来，吓得枕头都飞了。\n\n他捂着耳朵冲出门外。啄木鸟还在啄——嗒嗒嗒嗒嗒嗒！\n\n"别啄了！！太吵了！！我受不了！！"唐老鸭快崩溃了。\n\n这时候花栗鼠从旁边走出来，双手抱在胸前："怎么样？被吵的感觉好不好？"\n\n唐老鸭瞪着花栗鼠："是你让啄木鸟来的？！"\n\n"对啊。你每天大吼大叫的时候，我们就是这个感觉。而且你比啄木鸟还吵。"\n\n啄木鸟又啄了一下——"嗒！"\n\n"行了行了！我知道了！我以后小声说话还不行吗！"唐老鸭捂着耳朵求饶。\n\n花栗鼠朝啄木鸟挥挥手，啄木鸟飞走了。安静了。\n\n唐老鸭长长松了一口气。他第一次觉得——安静真好。\n\n从那以后唐老鸭说话小声了很多。偶尔忍不住想大嗓门的时候，花栗鼠只需要做一个啄木鸟啄木头的动作，唐老鸭就立刻把音量调低了。\n\n"我不想再被啄木鸟叫醒了……"唐老鸭每次想到那个早晨就打哆嗦。'
},
{
  id: 'duck_14',
  title: '【唐老鸭和花栗鼠】第十四集：不守时的唐老鸭',
  category: '唐老鸭',
  content: '唐老鸭约花栗鼠下午两点在大树下面见面一起去摘浆果。花栗鼠两点准时到了。\n\n两点一刻，唐老鸭没来。两点半，还没来。三点了，还是没来。\n\n花栗鼠在大树下面等了一整个小时。太阳晒得她头顶发烫，蚊子咬了她三个包。\n\n三点十分唐老鸭才大摇大摆地过来："哟，花栗鼠你来了啊！"\n\n"你迟到了一个多小时！！"花栗鼠气得跺脚。\n\n"哎呀，就晚了一小会儿嘛。"唐老鸭满不在乎。\n\n花栗鼠被气得话都说不出来了。可她没有跟唐老鸭吵——她决定让唐老鸭尝尝等人的滋味。\n\n过了几天，花栗鼠对唐老鸭说："周六上午九点，森林那边有一个卖玩具的市集，只开一个早上。我带你去好不好？九点在我家门口集合。"\n\n唐老鸭一听有玩具市集，兴奋极了："好好好！九点准到！"\n\n周六早上九点，唐老鸭真的准时到了花栗鼠家门口。可是花栗鼠家门关着。\n\n唐老鸭敲门——没人应。"花栗鼠！花栗鼠！"没有回应。\n\n唐老鸭等了十分钟。又十分钟。又十分钟。\n\n太阳越来越晒，唐老鸭越来越急。他想去玩具市集啊，可是他不知道路。\n\n九点半了。十点了。十点半——玩具市集说是只开到十点半就收摊了。\n\n唐老鸭急得在门口转来转去，差点哭出来。\n\n这时候花栗鼠的门终于开了。花栗鼠穿着睡衣打着哈欠走出来："啊，唐老鸭你来了啊？"\n\n"你去哪了！！玩具市集都关了！！我等了你一个半小时！！"唐老鸭快急疯了。\n\n花栗鼠看着他说："一个半小时很长吗？我上次等了你一个小时你还觉得\'就晚了一小会儿\'呢。"\n\n唐老鸭愣住了。\n\n"被人放鸽子的感觉怎么样？又热又急又委屈对不对？这就是我每次等你的感觉。"\n\n唐老鸭张了张嘴，说不出话来。他终于知道了——等人真的好难受。尤其是不知道对方什么时候来、或者会不会来的那种焦虑。\n\n"对不起……"唐老鸭低着头说，"我以后不迟到了。"\n\n花栗鼠笑了："好消息是——玩具市集其实是下午两点才开。我故意说错了时间。走吧，我们中午出发刚好来得及。"\n\n"什么！还有！"唐老鸭高兴得跳了起来。\n\n那天下午两个人准时到了市集，唐老鸭买了一个很酷的弹弓（保证不弹人）。花栗鼠买了一盒新蜡笔。\n\n从那以后唐老鸭再也不迟到了。他还专门买了一块小手表戴在翅膀上——因为他知道了，守时是对朋友最基本的尊重。'

  id: 'duck_15',
  title: '【唐老鸭和花栗鼠】第十五集：唐老鸭学会了道谢',
  category: '唐老鸭',
  content: '花栗鼠发现唐老鸭有一个坏毛病是他自己都没注意到的——他从来不说"谢谢"。\n\n别人帮了他，他觉得理所当然。花栗鼠借给他铅笔——"给我用用"，用完了直接还回去，一声谢谢都没有。小兔子让他先走——他大摇大摆走过去连看都不看人家一眼。刺猬帮他捡了掉在地上的帽子递给他——他抢过来戴上就走了。\n\n花栗鼠提醒过他好几次："人家帮了你应该说谢谢。"\n\n"有什么好谢的，又不是什么大事。"唐老鸭不以为然。\n\n花栗鼠决定让唐老鸭知道——没有"谢谢"的世界是什么样的。\n\n她偷偷跟森林里的朋友们商量了一个计划。从明天开始，所有人帮了唐老鸭以后，如果唐老鸭不说谢谢——就把帮他的东西拿回来。\n\n第二天，唐老鸭去上学。路上下雨了，小兔子借了他一把伞。唐老鸭接过去就打开走了，一个字没说。\n\n小兔子追上来把伞拿回去了："不客气的人不配用我的伞。"\n\n唐老鸭淋着雨傻眼了。\n\n到了学校，唐老鸭忘带课本了。刺猬把自己的课本递给他看。唐老鸭拿过来翻开就读，头也没抬。\n\n刺猬把课本抽回去了："不说谢谢就不借。"\n\n唐老鸭愣住了。\n\n中午吃饭，唐老鸭的饭盒打不开。花栗鼠帮他拧开了盖子。唐老鸭伸手要接——花栗鼠把盖子又盖回去了。\n\n"你是不是忘了说什么？"花栗鼠看着他。\n\n唐老鸭看了看周围——所有人都在看着他。他回想了一下今天发生的事——被收回去的伞、被抽走的课本……\n\n"是不是……应该说谢谢？"唐老鸭小声说。\n\n"终于想起来了！"花栗鼠笑了。\n\n唐老鸭红着脸对花栗鼠说："谢……谢谢你帮我开盒子。"\n\n花栗鼠把饭盒递给他："这才对嘛。"\n\n唐老鸭又跑去找小兔子："谢谢你早上借我伞，虽然我没接住……"小兔子笑着又把伞借给了他。\n\n又跑去找刺猬："谢谢你愿意借我课本看！"刺猬把书推过来了。\n\n唐老鸭发现——说"谢谢"原来这么简单，只要两个字。可是这两个字说出来以后，别人脸上都会笑。而且大家都更愿意帮他了。\n\n那天晚上回家，唐老鸭对妈妈说："妈妈，谢谢你做的晚饭。"\n\n唐老鸭妈妈惊讶地看着儿子——这还是她的唐老鸭吗？\n\n"还有……谢谢你每天早上叫我起床。谢谢你帮我洗衣服。谢谢你……"唐老鸭数起来发现，原来妈妈每天帮他做了那么多事。\n\n唐老鸭妈妈眼睛有点红了，把唐老鸭抱了起来。\n\n从那以后，"谢谢"成了唐老鸭说得最多的两个字。他终于明白了——感恩不是什么大道理，就是在别人对你好的时候，让对方知道你看到了、你记住了。'

  content: '唐老鸭又发明了一个新的恶作剧——踩影子。太阳出来的时候每个人都有影子，唐老鸭就追着别人的影子踩。\n\n"踩到了踩到了！哈哈哈！"唐老鸭追着花栗鼠的影子跑，每次踩到都大声笑。\n\n花栗鼠的影子那么小，唐老鸭的脚那么大，每次踩下来花栗鼠都得赶紧跑开免得被踩到真脚。\n\n"你别踩了！很烦！"花栗鼠说。\n\n"踩影子又不疼，你急什么呀？"唐老鸭一边追一边笑。\n\n花栗鼠想了一个办法。第二天中午太阳最大的时候，她约唐老鸭在操场见面。\n\n"唐老鸭，我们来玩踩影子的游戏好不好？谁先踩到对方影子十次谁赢。"\n\n"好啊！我肯定赢！"唐老鸭自信满满。\n\n游戏开始了。唐老鸭追花栗鼠的影子——可是花栗鼠太灵活了，小小的身体一闪一闪，唐老鸭根本踩不到。\n\n而花栗鼠踩唐老鸭的影子太容易了——唐老鸭的影子又大又长，怎么都躲不开。"一次！两次！三次！"花栗鼠轻轻松松踩到了十次。\n\n唐老鸭一次都没踩到花栗鼠。他累得满头汗，趴在地上喘粗气。\n\n"怎么样？被人追着踩的感觉好不好玩？"花栗鼠蹲在他面前问。\n\n唐老鸭喘着气摇头："不好玩……跑得好累……而且一直被踩很烦……"\n\n"这就对了。你以前踩别人影子的时候，别人就是这么累这么烦的。"\n\n唐老鸭趴在地上想了想，是哦，以前别人被他追的时候也是这样拼命跑，跑得满头汗。他只顾着自己开心，没想过别人有多烦。\n\n"我不踩了……"唐老鸭爬起来，"这游戏不好玩。"\n\n从那以后唐老鸭再也没追着踩别人影子了。因为他知道了——当对方不觉得好玩的时候，那就不是游戏，是欺负。'
},

  category: '唐老鸭',
  content: '唐老鸭跟小猪在一起玩的时候，偷偷说花栗鼠坏话："花栗鼠画画其实一点都不好看，她就是自己觉得自己厉害。而且她抠门，松果都不分给别人吃。"\n\n小猪听了没说话，但他是个大嘴巴。第二天这话传到了花栗鼠耳朵里。\n\n花栗鼠听完心里难受极了。她一直把唐老鸭当朋友，可唐老鸭在背后这样说她。\n\n花栗鼠没有去找唐老鸭吵架。她想了一个更聪明的办法。\n\n她找了小兔子、刺猬和小猪，说："接下来几天，不管唐老鸭说什么话你们都传给他听到的那个人好不好？让他知道话传来传去是什么感觉。"\n\n大家都答应了。\n\n第二天，唐老鸭跟小兔子说："刺猬跑步好慢，像个球在滚。"\n\n一个小时后刺猬就知道了。刺猬气得竖起了全身的刺，两天没跟唐老鸭说话。\n\n唐老鸭又跟刺猬说："小猪太胖了，走路地都抖。"\n\n小猪知道后伤心得一个人坐在角落里不吃饭。\n\n然后有人跑来告诉唐老鸭："花栗鼠说你唱歌像杀鸡一样难听。"\n\n唐老鸭一听火冒三丈："她怎么能这么说我！我唱歌明明……"\n\n他正要生气——突然愣住了。\n\n等等。花栗鼠说他唱歌难听，他就这么生气。那他说花栗鼠画画不好看的时候，花栗鼠是不是也一样气？\n\n唐老鸭安静了下来。他想起了这几天——刺猬不理他了，小猪不开心了。都是因为他在背后说的那些话。\n\n"原来背后说坏话……别人知道以后会这么难受。"唐老鸭低下了头。\n\n他跑去找花栗鼠："你真的说我唱歌像杀鸡吗？"\n\n花栗鼠摇头："我没说。是我让人编的，就是想让你体会一下被别人在背后议论的感觉。"\n\n唐老鸭沉默了很久，然后说："对不起。我不应该在背后说你坏话。被人背后议论……真的很难受。"\n\n"你愿意跟我一起去跟刺猬和小猪道歉吗？"花栗鼠问。\n\n唐老鸭点点头。那天下午他挨个找了每个被他说过坏话的朋友道歉。虽然大家原谅了他，但唐老鸭知道——说出去的话像泼出去的水，收不回来。以后说话之前，得先想想：这话如果被那个人听到，他会不会难受？'

  content: '森林学校要考试了。山羊老师说这次考得好的同学可以得到一个神秘大奖。\n\n花栗鼠每天晚上认认真真复习，把每一道题都弄懂了。唐老鸭呢？他每天在家看动画片，课本连翻都没翻。\n\n考试那天，唐老鸭看着卷子——一个字也不会写。他急得满头汗。\n\n唐老鸭偷偷往旁边看——花栗鼠正低头认真写呢。唐老鸭把脖子伸得长长的，偷看花栗鼠的答案，赶紧抄到自己卷子上。\n\n花栗鼠感觉到了旁边有人在看自己。她瞟了一眼——果然是唐老鸭在抄。\n\n花栗鼠没有声张。她故意把剩下几道题写了错误的答案。\n\n唐老鸭看到花栗鼠继续写了，赶紧又抄了后面几道。抄完了他得意地想："嘿嘿，花栗鼠可是班里第一名，抄她的肯定满分。"\n\n第二天成绩出来了。花栗鼠——100分（她交卷前把故意写错的改回来了）。唐老鸭——60分。\n\n"怎么回事！我明明抄的花栗鼠的啊！"唐老鸭看着卷子傻眼了。后面几道题全错了。\n\n花栗鼠走过来说："我发现你在抄我，所以故意写了几个错的。你抄走了。"\n\n唐老鸭的脸红一阵白一阵。\n\n"如果你抄到的答案不对呢？考试的时候只能靠自己。你自己什么都不会，抄来的东西也分不清对错。"\n\n唐老鸭垂着头不说话了。他不但没得到大奖，还因为班上最低分被山羊老师留下来补课。\n\n最惨的是——其他小动物都知道他作弊了，看他的眼神都怪怪的。\n\n那天放学后唐老鸭主动找花栗鼠："你能教我学习吗？我不想再作弊了。被人知道作弊的感觉比不及格还丢人。"\n\n花栗鼠点点头："可以。但条件是——每天放学后先复习半小时再玩。"\n\n唐老鸭用力点头。从那以后他每天跟花栗鼠一起学习。虽然成绩没有花栗鼠好，但每一分都是自己考出来的，唐老鸭觉得比什么都踏实。'

  category: '唐老鸭',
  content: '唐老鸭和花栗鼠一起搭积木。搭了好高好高的一座塔。\n\n唐老鸭要往上放最后一块积木的时候，手一抖——"哗啦！"整座塔倒了。\n\n"是你碰到桌子了！"唐老鸭立刻指着花栗鼠说。\n\n"我明明坐着没动啊！"花栗鼠很委屈。\n\n"就是你！你动了一下脚！"唐老鸭就是不承认是自己弄倒的。\n\n花栗鼠叹了口气，不跟他争了。两个人重新搭。搭了半天又搭好了。\n\n这次花栗鼠放最后一块——"哗啦！"又倒了。这次是花栗鼠手滑了。\n\n花栗鼠立刻说："啊，对不起！是我没放好。"\n\n唐老鸭愣了一下。他发现——花栗鼠承认是自己弄倒的以后，他一点都不生气。反而觉得"没关系，再搭一次吧。"\n\n可是刚才他弄倒塔的时候死不承认，花栗鼠就很生气很委屈。\n\n"为什么你说\'对不起是我的错\'以后，我一点都不生气呢？"唐老鸭问。\n\n"因为认错了就代表你尊重对方。对方会觉得你是个诚实的人，就不会生气了。"花栗鼠说，"但如果明明是你的错你还赖别人——对方会觉得你不尊重他，又委屈又生气。"\n\n唐老鸭想了想，好像真的是这样。他犹豫了一下，然后小声说："那个……刚才第一次塔倒了……其实是我手抖了。对不起。"\n\n花栗鼠笑了："看，你说出来了，我现在一点都不生气了对吧？"\n\n唐老鸭也笑了。原来认错不会被骂得更惨，反而会让事情变得轻松。\n\n从那以后唐老鸭学会了四个字——"是我的错"。虽然每次说的时候脸还是会红，但他发现只要主动认错，没有人会真的为难他。'

  content: '唐老鸭洗手的时候喜欢把水龙头开到最大。水"哗哗哗"地流，溅得到处都是。洗完手他也不关水龙头就走了。\n\n花栗鼠路过厕所看到水在白白流，赶紧跑去关掉。"唐老鸭！你又没关水龙头！"\n\n"哎呀，水又不要钱。"唐老鸭满不在乎。\n\n花栗鼠决定让唐老鸭知道水的珍贵。\n\n周末，花栗鼠约唐老鸭去爬后山。走了好久好久，太阳越来越大，两个人越来越渴。\n\n"好渴啊，有水吗？"唐老鸭舔着嘴唇问。\n\n"没带。"花栗鼠说（她其实在背包里藏了一瓶，但暂时不拿出来）。\n\n唐老鸭渴得嗓子冒烟。他到处找水——石头缝里没有，树叶上也没有。他多想有一杯凉水啊，哪怕一小口都行。\n\n"如果这里有水龙头就好了……"唐老鸭有气无力地说。\n\n花栗鼠说："你平时一开水龙头就有水，从来不觉得水珍贵。可是当你真的渴得不行又找不到水的时候，才知道每一滴水都很重要。"\n\n唐老鸭沉默了。他想起自己每次开着水龙头不关，白花花的水就那么流走了。\n\n花栗鼠拿出了藏着的那瓶水："喝吧。"\n\n唐老鸭接过来喝了一口——天啊，从来没有觉得水这么好喝过。他小心翼翼地喝，每一口都很珍惜，没有像以前那样大口大口浪费。\n\n回家后唐老鸭在水龙头旁边贴了一张纸条——"用完请关好"。而且每次洗手他都把水开到最小，够用就行。\n\n因为他永远记得那天在山上渴得嗓子冒烟的感觉——水不是无限的，珍惜它才是对的。'

  title: '【唐老鸭和花栗鼠】第二十三集：撕别人的书',
  category: '唐老鸭',
  content: '唐老鸭跟乐乐吵架了，原因很小——乐乐不小心踩了他一脚。\n\n唐老鸭气不过，趁乐乐不注意，把乐乐放在桌上的故事书撕了两页下来揉成了纸团扔掉了。\n\n乐乐回来发现书被撕了，哭得好伤心。那本书是他妈妈送他的生日礼物，他每天晚上都要读的。\n\n花栗鼠知道以后非常生气。她对唐老鸭说："唐老鸭，把你最喜欢的那本漫画书拿过来。"\n\n"干嘛？"唐老鸭警惕地问。\n\n"你撕了乐乐的书，那我也撕你的书。让你感受一下。"\n\n"不行！那是我最喜欢的！"唐老鸭抱紧了自己的漫画书。\n\n"你看，你都知道自己的书被撕了会心疼。那乐乐的书是他妈妈送的生日礼物——比你那本还重要十倍。你撕的时候想过他多心疼吗？"\n\n唐老鸭不说话了。他低头看着自己的漫画书，想象了一下如果被人撕了两页的感觉——光想想就觉得受不了。\n\n"那……我应该怎么办？"\n\n"用你的零花钱买一本一模一样的书赔给乐乐。然后当面道歉。"\n\n唐老鸭掏出了自己攒了很久的零花钱。本来想买一个新玩具的，现在得买书赔人了。他心疼得不行，可他知道这是自己该做的。\n\n他捧着新书去找乐乐："对不起……我不该撕你的书。这本新的赔你。"\n\n乐乐接过新书，虽然还有点不高兴，但看到唐老鸭真心道歉了，点了点头："下次别这样了。"\n\n唐老鸭从乐乐家出来以后跟花栗鼠说："买那本书花了我半个月的零花钱……"\n\n"这就叫代价。"花栗鼠说，"生气的时候破坏别人的东西只要一秒钟，但弥补需要很久很久。所以——生气的时候，手不要动。"\n\n唐老鸭把这句话记住了。以后再生气的时候，他宁愿去操场跑两圈发泄，也不动手毁别人的东西了。'
},
{
  id: 'duck_24',
  title: '【唐老鸭和花栗鼠】第二十四集：不爱洗澡',
  category: '唐老鸭',
  content: '唐老鸭已经三天没洗澡了。他身上的味道——好吧，说得好听叫"自然味"，说得难听就是臭。\n\n花栗鼠站在唐老鸭旁边，闻了一下，脸都皱起来了："唐老鸭你多久没洗澡了？"\n\n"洗什么澡，浪费时间。"唐老鸭不在乎。\n\n可是别的小动物都开始躲着唐老鸭走了。小兔子捂着鼻子跑开了，刺猬远远绕道走，连大大咧咧的小猪都说："哥们你比我还味儿大……"\n\n唐老鸭发现没人愿意跟他玩了，可他还不知道为什么。"你们怎么都躲着我啊？"\n\n没人好意思直说。\n\n花栗鼠决定直接点。她拿来了一面大镜子和一个密封的塑料袋。\n\n"唐老鸭，你把头伸进这个袋子里闻三秒钟。"花栗鼠把袋子递过去——那是她偷偷从唐老鸭换下来的脏T恤旁边放了一天的袋子，里面全是唐老鸭的味道。\n\n唐老鸭不明所以地把头凑过去闻了一下——\n\n"呕——！！什么东西这么臭！！"唐老鸭差点吐了。\n\n"这就是你身上的味道。你自己闻惯了所以不觉得，但别人闻到的就是这样。"\n\n唐老鸭的脸从红变成了紫。他终于知道为什么大家都躲着他了。\n\n那天晚上唐老鸭洗了一个史上最长的澡——打了三遍肥皂，洗了两遍头发。出来以后香喷喷的。\n\n第二天唐老鸭出门，小兔子主动跑过来跟他玩了。"唐老鸭今天好香啊！"\n\n唐老鸭红着脸笑了。从此以后他每天都洗澡了——因为他再也不想体验那个"臭袋子"的味道了。'
},
{
  id: 'duck_25',
  title: '【唐老鸭和花栗鼠】第二十五集：欺负小的',
  category: '唐老鸭',
  content: '森林里搬来了一只很小很小的小仓鼠，叫豆豆。豆豆比花栗鼠还小，说话细细的，胆子也很小。\n\n唐老鸭看到豆豆这么小，觉得欺负它很有"意思"——他故意挡住豆豆的路不让过，故意拿走豆豆的零食，还故意把豆豆叫成"小豆丁"来取笑。\n\n豆豆每次都不敢反抗，只是低头跑开了。\n\n花栗鼠看到了很生气。她找到唐老鸭说："你欺负豆豆干嘛？它那么小。"\n\n"我又没打它，就是逗着玩嘛。"唐老鸭满不在乎。\n\n花栗鼠想了想，第二天带唐老鸭去了森林另一边——那里住着一只很大很大的棕熊。棕熊比唐老鸭大十倍。\n\n花栗鼠事先跟棕熊说好了计划。唐老鸭一到，棕熊就走过来挡住了唐老鸭的路："让开，小鸭子。"\n\n唐老鸭赶紧让开了。\n\n棕熊又拿走了唐老鸭手里的苹果："这个归我了。"\n\n"喂！那是我的！"唐老鸭想抢回来——可是看看棕熊那个个头，他不敢。\n\n棕熊又低头看着唐老鸭笑："小鸭丁，今天天气不错啊。"\n\n唐老鸭的脸涨得通红。他又气又怕又委屈——可是棕熊太大了，他什么都做不了。\n\n花栗鼠从旁边走出来："怎么样？被比你大的人欺负是什么感觉？"\n\n唐老鸭愣了一下。\n\n"你对豆豆做的事情，跟棕熊刚才对你做的一模一样。挡路、拿东西、叫外号。你觉得不舒服——豆豆每天都这么不舒服。"\n\n棕熊把苹果还给了唐老鸭："小伙子，我是配合花栗鼠演的。但你好好想想吧。"\n\n唐老鸭抱着苹果站在那里好久没说话。他想起了自己刚才多无助多委屈——那种感觉太难受了。而他每天都在让豆豆感受这种难受。\n\n第二天唐老鸭主动找到了豆豆："对不起，以前是我不对。以后没人敢欺负你了——因为我保护你。"\n\n豆豆用小小的眼睛看着唐老鸭，怯生生地笑了。\n\n从那以后唐老鸭不但不欺负豆豆了，还成了豆豆的"保镖"。谁敢欺负小的，唐老鸭第一个不答应——因为他太知道弱小者被欺负时的感觉了。'
},
{
  id: 'duck_26',
  title: '【唐老鸭和花栗鼠】第二十六集：总找借口',
  category: '唐老鸭',
  content: '唐老鸭有一个本事——不管做错了什么事，他总能找到一个借口。\n\n作业没做？"我的笔坏了。"迟到了？"路上有只蜗牛挡路。"把别人东西弄坏了？"是它自己松了。"\n\n花栗鼠听了快崩溃了。每次唐老鸭犯了错，都有一万个借口，就是不能痛痛快快说一句"是我的错"。\n\n这天唐老鸭跟花栗鼠约好了一起做手工——要用花栗鼠的剪刀。唐老鸭用的时候手一滑，"咔"，剪刀断了。\n\n"花栗鼠……你的剪刀质量太差了，我轻轻一用就断了。"唐老鸭又在找借口。\n\n花栗鼠这次没有发火。她平静地说："好，那我的剪刀质量差。那你赔我一把新的吧？毕竟是在你手上断的。"\n\n"可是……是它自己质量不好……"\n\n"那如果你借别人的车开，车坏了。你说\'车质量不好\'就完了吗？在你手上坏的你就得负责。不管原因是什么。"\n\n唐老鸭张了张嘴——借口的话到了嘴边又咽了回去。他发现不管什么借口，最后结果都是一样的：东西坏了得赔。\n\n"行……我赔你一把新剪刀。"\n\n花栗鼠笑了："这才对嘛。其实大家都知道你的借口是编的。找借口只会让人觉得你不靠谱。直接说\'对不起我弄坏了我赔你\'——反而大家会觉得你是个男子汉。"\n\n唐老鸭想了想，好像真的是。以前他找了那么多借口，可别人该不原谅还是不原谅。反而花栗鼠每次直接认错，大家都很快就原谅她了。\n\n"以后……我不找借口了。"唐老鸭小声说。\n\n"好。但你先去买一把新剪刀回来。"花栗鼠笑着催他。\n\n唐老鸭跑去商店买了一把最好的剪刀回来赔给花栗鼠。虽然花了零花钱，但心里痛快——比编一堆谎话舒服多了。'
},
{
  id: 'duck_27',
  title: '【唐老鸭和花栗鼠】第二十七集：把功劳抢走',
  category: '唐老鸭',
  content: '森林学校的科学课上要做小组项目。唐老鸭和花栗鼠还有小兔子一组，他们要做一个小风车。\n\n花栗鼠负责画设计图，小兔子负责剪裁纸片，唐老鸭……唐老鸭在旁边看着玩了一下午。\n\n"唐老鸭你也帮忙啊！"花栗鼠说。\n\n"我在……我在想创意。"唐老鸭嘴上这么说，其实什么也没做。\n\n最后风车做好了。转起来很漂亮——花栗鼠和小兔子累得手指都酸了。\n\n上台展示的时候，山羊老师问："这个风车是谁想的主意？"\n\n唐老鸭"嗖"地站起来："是我！设计图是我画的！创意也是我的！"\n\n花栗鼠和小兔子呆住了。\n\n山羊老师看了看花栗鼠和小兔子的表情，又看了看唐老鸭。"那花栗鼠和小兔子做了什么呢？"\n\n"她们帮了点小忙……"唐老鸭轻描淡写地说。\n\n花栗鼠没有当场揭穿唐老鸭。她只是说了一句："老师，设计图上有我的签名。"\n\n山羊老师翻过设计图一看——右下角清楚写着"花栗鼠设计"。\n\n教室里安静了。所有人都看向唐老鸭。唐老鸭的脸慢慢红了。\n\n"唐老鸭，抢别人的功劳是非常不好的行为。"山羊老师严肃地说，"这次的小组项目你不及格。花栗鼠和小兔子满分。"\n\n放学后唐老鸭追上了花栗鼠："你为什么不当场骂我……"\n\n"因为事实会说话。"花栗鼠说，"你可以抢嘴上的功劳，但抢不走真正付出了的事实。而且你发现了吗——你什么都没做就站出来邀功，所有人都看出来了。"\n\n唐老鸭低着头半天没说话。\n\n"下次做项目，你真的出力了，不用抢——别人自然会承认你的贡献。"\n\n唐老鸭点了点头。下一次小组作业，他是第一个动手的。做完以后山羊老师问起来，花栗鼠主动说："唐老鸭这次负责了最难的部分。"\n\n那种被真心认可的感觉——比抢来的假功劳好一万倍。'
},
{
  id: 'duck_28',
  title: '【唐老鸭和花栗鼠】第二十八集：不守规则玩游戏',
  category: '唐老鸭',
  content: '大家一起玩捉迷藏。规则很简单——数到二十，然后去找人。找到了就换那个人来数。\n\n唐老鸭数数的时候只数到了十就睁眼偷看。他看到花栗鼠躲在大树后面，就直接跑过去："找到你了！"\n\n"你才数了十个！还没到二十呢！"花栗鼠抗议。\n\n"我数得快嘛，有什么关系。"唐老鸭耍赖。\n\n后来轮到花栗鼠来找。唐老鸭藏好了——可是他等不及被找到，自己从躲的地方跑出来说："你找不到我吧！我赢了！"\n\n"这不是这么玩的啊！"大家都急了。\n\n唐老鸭不守规则玩游戏，每次都改规则让自己赢。时间长了——没人愿意跟他玩了。\n\n"我们去那边玩，别叫唐老鸭。"小兔子小声跟花栗鼠说。\n\n花栗鼠摇了摇头。她有更好的办法。\n\n第二天花栗鼠组织了一场跳绳比赛。她故意制定了一个对唐老鸭非常不利的规则——鸭子脚大跳绳很笨拙。\n\n比赛开始后唐老鸭跳了三下就被绊倒了。"这规则不公平！对我太难了！"\n\n花栗鼠说："规则就是规则啊。你不是说规则不重要吗？你每次玩游戏都不遵守规则，别人也可以制定对你不公平的规则呀。"\n\n唐老鸭愣住了。"可是……那对我不公平……"\n\n"对啊。所以规则是用来保护所有人的。大家都遵守同样的规则，每个人才能玩得开心。你一个人不守规则，看起来你赢了——但最后没人愿意跟你玩了。这叫赢了比赛输了朋友。"\n\n唐老鸭想了想，好像确实是这样。他以前耍赖赢的那些游戏，赢完了也不开心，因为大家都黑着脸。\n\n"以后我守规则。"唐老鸭说。\n\n那天下午大家重新玩了一次捉迷藏。唐老鸭老老实实数到了二十才睁眼。虽然这次他没赢，但大家玩得特别开心，唐老鸭也发现——遵守规则然后靠本事赢了，那种快乐比耍赖赢了好一百倍。'
},
{
  id: 'duck_29',
  title: '【唐老鸭和花栗鼠】第二十九集：乱起绰号',
  category: '唐老鸭',
  content: '唐老鸭特别爱给人起绰号——还是那种让人不开心的绰号。\n\n他叫小猪"肉球"，叫长颈鹿"电线杆"，叫小兔子"大门牙"，叫花栗鼠"小老鼠"。\n\n每次唐老鸭喊这些绰号的时候哈哈大笑，好像很好玩。可是被叫的人一点都不开心——小猪每次都低着头走开，兔子气得耳朵都立起来了。\n\n花栗鼠被叫"小老鼠"的时候特别生气："我是花栗鼠！不是老鼠！你再叫试试！"\n\n"小老鼠小老鼠~"唐老鸭越不让叫越叫得开心。\n\n花栗鼠决定以牙还牙。她想了一个唐老鸭最不喜欢的绰号——"扁脚怪"。因为唐老鸭最在意的就是自己扁扁的鸭子脚。\n\n第二天开始，花栗鼠见到唐老鸭就喊："扁脚怪早上好！""扁脚怪你去哪？""扁脚怪你吃饭了吗？"\n\n唐老鸭第一次听到的时候脸就黑了："你叫我什么？！"\n\n"扁脚怪呀。怎么了？不是挺好玩的吗？你不是最喜欢叫绰号嘛。"花栗鼠笑眯眯地说。\n\n唐老鸭气得呱呱叫："你别叫了！很难听！"\n\n"你叫我小老鼠我也觉得很难听。你叫小猪肉球，小猪也很难过。"\n\n唐老鸭闭嘴了。他想起了自己被叫"扁脚怪"时的那种感觉——像被人揪住了最不喜欢的部分使劲嘲笑。这种感觉……太难受了。\n\n"好……我不叫了。你也别叫我扁脚怪了。"\n\n"成交。"花栗鼠伸出手，两个人握了握手。\n\n从那以后唐老鸭再也没给人起过难听的绰号。他发现用人家的名字好好叫，人家才会也好好叫你。互相尊重就这么简单。'
},
{
  id: 'duck_30',
  title: '【唐老鸭和花栗鼠】第三十集：输不起',
  category: '唐老鸭',
  content: '唐老鸭下棋输了。\n\n"我不玩了！"他把棋盘一掀，棋子撒了一地。\n\n唐老鸭每次输了都这样——要么掀桌子，要么说"不算不算重来"，要么干脆说对方作弊然后气冲冲走了。\n\n花栗鼠赢了却高兴不起来——唐老鸭掀了棋盘搞得到处都是，她还得一颗颗捡起来。\n\n"唐老鸭，你能不能输得起？"花栗鼠蹲在地上捡棋子。\n\n"我没输！是那颗棋子放错了！"唐老鸭还在找借口。\n\n花栗鼠想了想，第二天她组织了一个"唐老鸭必赢锦标赛"——所有项目都是唐老鸭最擅长的：游泳、大嗓门比赛、吃东西比赛。\n\n唐老鸭果然全赢了。他开心得呱呱叫："我是冠军！哈哈哈！"\n\n花栗鼠鼓了掌。然后她说："你看，你赢了我也没有掀桌子没有骂人没有说不算。因为你确实比我厉害。我输了但我没有不开心——因为比赛本来就会有赢有输。"\n\n唐老鸭愣了一下。\n\n"你想想——如果每次你赢了，我都把奖牌扔你脸上说不算，你什么感觉？"\n\n唐老鸭想了想："很烦……我赢了都不让我高兴一下。"\n\n"对呀。你每次输了掀桌子，赢的那个人也是这么烦的。本来赢了应该开心的，结果还得受你的气。"\n\n唐老鸭沉默了。\n\n"输了不丢人。每个人都会输。但输了以后掀桌子骂人——那才丢人。"花栗鼠说。\n\n唐老鸭慢慢蹲下来，把昨天撒了一地的棋子一颗颗捡了起来。捡完以后他说："再来一局？这次……我输了不掀桌了。"\n\n花栗鼠笑了："好。"\n\n那局唐老鸭又输了。但这次他深吸了一口气，忍住了想掀桌的冲动，伸出手说："你赢了。打得好。"\n\n花栗鼠握了握他的手。唐老鸭发现——认输的时候说一声"你赢了"，其实没有想象中那么难。'
},
{

  title: '【唐老鸭和花栗鼠】第三十一集：偷看日记',
  category: '唐老鸭',
  content: '花栗鼠有一本漂亮的小日记本，粉色封面上画着小花。她每天晚上都会在里面写几句话。\n\n有一天花栗鼠去上厕所，日记本放在了桌上。唐老鸭看到了——好奇心一上来手就痒了。他翻开了花栗鼠的日记本偷偷看。\n\n"今天唐老鸭又做了傻事，但我觉得他其实是个好人……"唐老鸭看到这里，偷偷笑了。\n\n正看得入迷呢——"你在干什么！！"花栗鼠回来了，看到唐老鸭拿着自己的日记本，脸色一下子变了。\n\n"你偷看我的日记！！"花栗鼠冲过来一把抢回日记本，眼泪立刻就出来了。"那是我的秘密！你怎么能偷看！！"\n\n唐老鸭吓了一跳——他从来没见花栗鼠哭过这么凶。"我就看了一点点嘛……"\n\n"一点点也不行！！日记是最私密的东西！！"花栗鼠抱着日记本蹲在地上哭。\n\n唐老鸭慌了。他这才意识到自己闯了大祸。日记里写的是花栗鼠最真实的想法——那是她不想让任何人知道的秘密。被人偷看了就像被人扒光了衣服一样难堪。\n\n"对不起……对不起……"唐老鸭蹲在花栗鼠旁边不知道该怎么办。\n\n花栗鼠哭了好久才停。她没有像平时那样想办法整唐老鸭——因为这次她真的太伤心了。\n\n"你走吧。我今天不想见你。"\n\n唐老鸭灰溜溜地走了。那天晚上他翻来覆去睡不着——花栗鼠哭的样子一直在他脑袋里。他知道自己做了一件特别特别错的事。\n\n第二天唐老鸭买了一个新的日记本，上面有锁——需要钥匙才能打开。他把日记本和钥匙放在了花栗鼠家门口，旁边附了一张纸条："对不起。我保证永远不会再看你的秘密了。这本有锁，以后谁都打不开。"\n\n花栗鼠打开门看到了礼物。她想了想，虽然还是有点生气，但她知道唐老鸭是真心后悔了。\n\n"我原谅你了。但你要记住——每个人都有不想被别人知道的事。尊重别人的秘密，就是最基本的尊重。"\n\n唐老鸭重重地点了点头。从那以后他再也没碰过别人的私人物品——不是自己的东西，未经允许绝不碰。'
},
{

  title: '【唐老鸭和花栗鼠】第三十二集：总是打断别人说话',
  category: '唐老鸭',
  content: '花栗鼠在跟大家讲她周末去海边玩的事情。她刚说了一句"海边的沙子好细好——"\n\n唐老鸭突然插嘴："我上个月也去过海边！我还抓了一只大螃蟹呢！"\n\n花栗鼠等唐老鸭说完想继续讲——"然后我看到了一只海——"\n\n"海鸥对不对？我也看到了！而且我还喂了它面包！"唐老鸭又抢话了。\n\n每次花栗鼠开口说话不到五秒钟就被唐老鸭打断，全变成了唐老鸭的故事。花栗鼠一个完整的句子都没说完过。\n\n最后花栗鼠不说了，闭着嘴看着唐老鸭。唐老鸭还在滔滔不绝地说自己的事。\n\n花栗鼠安静地等唐老鸭说了五分钟。然后她开口了："唐老鸭——"\n\n唐老鸭刚想插嘴，花栗鼠举起了一只手："我还没说完。"\n\n唐老鸭闭嘴了。\n\n"你知道今天这十分钟里你打断了我几次吗？七次。我一个完整的故事都没讲完过。"\n\n"可是我也想说话嘛……"\n\n"想说话可以等别人说完了再说。你没发现吗——每次你打断别人以后，别人就不想再说了。因为有一种感觉叫\'不被尊重\'。"\n\n花栗鼠对唐老鸭说："接下来我讲我的故事——你不能插嘴。等我说完了，你再讲你的。我保证认真听你的。好不好？"\n\n唐老鸭犹豫了一下，点了点头。\n\n花栗鼠完完整整地讲完了海边的故事——大概讲了三分钟。唐老鸭憋得好辛苦，好几次想插嘴但忍住了。\n\n"好了，现在轮到你了。"花栗鼠说。\n\n唐老鸭开始讲自己的海边故事。花栗鼠一次都没打断他，还不时点头说"嗯嗯""然后呢？"\n\n唐老鸭讲完以后觉得好舒服——被人认真听着说话的感觉真好。\n\n"明白了吗？轮流说、认真听，大家都舒服。"花栗鼠说。\n\n从那以后唐老鸭学会了一件事：别人说话的时候闭嘴听。虽然有时候忍不住想插嘴，但他会捏一下自己的腿提醒自己——等别人说完。'
},
{
  id: 'duck_33',
  title: '【唐老鸭和花栗鼠】第三十三集：不肯分享',
  category: '唐老鸭',
  content: '唐老鸭的妈妈给他买了一大盒饼干——巧克力味、草莓味、香草味，足足有三十块。\n\n唐老鸭抱着饼干盒来到了草地上。花栗鼠、小兔子、刺猬都看到了，眼睛都亮了。\n\n"唐老鸭，能分我一块吗？"花栗鼠问。\n\n"不行！这是我的！全部都是我的！"唐老鸭把盒子紧紧抱在怀里。\n\n他坐在草地上一块一块地吃。吃了第一块好开心，第二块也好吃，第三块第四块第五块……吃到第十块的时候他已经有点腻了。可是他还不分给别人——"我的东西凭什么分给你们！"\n\n其他小动物看了一会儿就散了。花栗鼠也走了。\n\n唐老鸭一个人坐在那里，面前还剩二十块饼干。他已经吃不下了——肚子撑得难受。但饼干放久了会变软不好吃。\n\n最后唐老鸭只能看着饼干慢慢变软、变不脆。他一个人吃不完浪费了一大半。\n\n第二天花栗鼠的妈妈寄来了一大袋新鲜的松子。花栗鼠拿到草地上——"大家来吃呀！"\n\n小兔子来了，刺猬来了，小猪来了。花栗鼠一人分了一把。大家围坐在一起边吃边聊天边笑——好开心啊。\n\n唐老鸭在旁边看着。他发现——花栗鼠分掉了大部分松子，自己只留了一小把。可是她看起来比唐老鸭昨天抱着三十块饼干独吃的时候开心一百倍。\n\n"花栗鼠……能分我一点吗？"唐老鸭小声走过去问。\n\n花栗鼠笑了："当然可以呀。"她递给唐老鸭一大把松子。\n\n唐老鸭红着脸接过来，坐在了大家中间。\n\n"你看，分享了东西虽然少了，但快乐多了。"花栗鼠说，"一个人抱着一大盒饼干吃不完浪费掉——不如大家一起吃一点点，开开心心的。"\n\n唐老鸭嚼着松子想了想——确实。昨天他一个人守着饼干盒，虽然"拥有"很多，但一点都不快乐。今天只有一把松子，可是跟朋友一起吃，比什么都香。\n\n从那以后唐老鸭学会了分享。他发现一个道理：东西分出去了，看起来少了，但快乐反而多了。'
},
{

  category: '唐老鸭',
  content: '唐老鸭今天不想上学。因为今天有体育课——要跑步考试，他最怕跑步了。\n\n"妈妈……我肚子好疼……"唐老鸭躺在床上装作难受的样子。\n\n妈妈一摸额头没有发烧，看了看唐老鸭的表情——嗯，有点像装的。但妈妈还是说："那今天就在家休息吧。"\n\n唐老鸭高兴坏了。妈妈一出门他就从床上蹦起来看动画片、吃零食、玩玩具，一点都不像肚子疼的样子。\n\n可是下午花栗鼠来了。她是代表山羊老师来送东西的——一张补考通知单。\n\n"山羊老师说你今天缺考了，下周一单独补考。而且因为是请假补考，要比平时多跑200米。"\n\n唐老鸭脸绿了："什么？！多跑200米？！"\n\n"对呀。这是规定。请假的人补考加量。"\n\n唐老鸭傻眼了。他本来是为了躲避跑步才装病的——结果不但没躲掉，还得多跑！\n\n花栗鼠看着唐老鸭活蹦乱跳的样子笑了笑："你肚子看起来好了嘛。"\n\n唐老鸭的脸红了。被拆穿了。\n\n"逃避只会让问题变大，不会让问题消失。"花栗鼠说，"今天跑800米就完事了，现在变成了下周跑1000米。值吗？"\n\n唐老鸭要哭了。真的不值。\n\n花栗鼠拍了拍他的背："别担心，这几天我陪你练。每天练一点，1000米也能跑完的。"\n\n那一周花栗鼠每天放学后都陪唐老鸭在操场跑步。从跑200米就喘到能跑完800米不停。\n\n周一补考那天，唐老鸭虽然跑得满头汗，但居然跑完了1000米——及格了！\n\n"我跑完了！！"唐老鸭趴在终点线上喘着气笑了。\n\n"看吧，面对它比逃避它简单得多。"花栗鼠递给他一瓶水。\n\n从那以后唐老鸭再也没有假装生病逃学了。因为他知道——今天逃掉的明天还是得面对，而且只会更难。不如直接面对，解决掉。'
},
{

  category: '唐老鸭',
  content: '小兔子养了一只小仓鼠，毛茸茸的好可爱。小兔子带着小仓鼠在草地上晒太阳。\n\n唐老鸭跑过来："让我摸摸让我摸摸！"不等小兔子回答，他就伸手去抓小仓鼠。\n\n小仓鼠被突然伸来的大手吓坏了，"吱"地叫了一声，从小兔子手里跳出去跑了。\n\n"我的仓鼠！"小兔子急得追着跑，追了好久才把受惊的小仓鼠找回来。\n\n唐老鸭还觉得好玩："它跑得好快哈哈哈！"\n\n花栗鼠摇摇头。她从家里带来了自己养的一只蜗牛——放在了唐老鸭面前。\n\n"唐老鸭，你看我的蜗牛。"\n\n唐老鸭刚想伸手去碰——花栗鼠突然"啪"地拍了一下桌子。\n\n唐老鸭吓了一大跳，手一缩"哇"地叫了一声。\n\n"你害怕了对吧？"花栗鼠说，"你刚才突然伸手去抓仓鼠的时候，仓鼠就是这种感觉——被突然的大手吓到了。小动物比我们胆子小得多，突然被陌生人抓会吓得心脏砰砰跳。"\n\n唐老鸭摸了摸自己还在"扑通扑通"跳的胸口。是挺吓人的。\n\n"想摸别人的宠物要先问主人可不可以，然后慢慢伸手让它闻闻你的味道，等它不怕了再轻轻摸。不能突然去抓。"\n\n唐老鸭点了点头。他跑去找小兔子道了歉，然后按照花栗鼠说的方法——先慢慢伸手让仓鼠闻了闻，等仓鼠自己爬到他手上以后才轻轻摸。\n\n"哇，它好软好暖。"唐老鸭小心翼翼地摸着仓鼠，笑得好温柔。\n\n小兔子也笑了。这才是正确的摸宠物方式。'

{
  id: 'duck_36',
  title: '【唐老鸭和花栗鼠】第三十六集：唐老鸭学会了安慰人',
  category: '唐老鸭',
  content: '花栗鼠的奶奶生病了。花栗鼠一个人坐在大树下面，不说话，眼睛红红的。\n\n唐老鸭走过来看到花栗鼠不开心。他想说点什么让花栗鼠高兴起来——\n\n"别哭了嘛！有什么大不了的！"\n\n花栗鼠没有回应。\n\n"你哭有什么用啊？哭又不能治好你奶奶。"唐老鸭又说。\n\n花栗鼠的眼泪流得更多了。她站起来跑走了。\n\n唐老鸭愣住了。他本来想让花栗鼠不难过的，怎么反而让她更难过了？\n\n他去问了小兔子："花栗鼠在哭，我说了\'别哭了没什么大不了的\'，她反而更难过了。我做错了什么？"\n\n小兔子说："人家难过的时候你说\'没什么大不了\'——就等于在说她不应该难过，不应该有感觉。这会让她觉得你不理解她。"\n\n"那应该说什么？"\n\n"有时候不用说什么。就坐在她旁边陪着她就够了。或者说\'我知道你很难过，我陪你\'。"\n\n唐老鸭想了想，重新找到了花栗鼠。这次他没说话，只是默默地坐在了花栗鼠旁边。\n\n过了一会儿，唐老鸭小声说了一句："你奶奶会好起来的。我陪你。"\n\n花栗鼠没说话，但她靠在了唐老鸭的肩膀上。两个人就这样安静地坐着，很久很久。\n\n后来花栗鼠说："谢谢你。你在这里陪我就够了。"\n\n唐老鸭学到了——安慰人不是叫人家"别难过"。而是让对方知道：不管你多难过，我都在你身边。有时候什么都不用说，陪着就是最好的安慰。'

  category: '唐老鸭',
  content: '唐老鸭不小心踩坏了花栗鼠种的小花。花栗鼠很伤心——那盆花她养了两个月。\n\n唐老鸭觉得不好意思，可他不想说"对不起"——他觉得说对不起很丢面子。\n\n于是唐老鸭去买了一盒巧克力，放在花栗鼠家门口就走了。他心想：送个礼物不就行了嘛，跟说对不起一样的。\n\n花栗鼠看到了巧克力，可她一点都没有变开心。\n\n第二天唐老鸭问："你吃巧克力了吗？好吃不？"\n\n"唐老鸭，你为什么送我巧克力？"\n\n"因为……就是想送。"唐老鸭不承认是因为踩了花。\n\n"你踩了我的花你知道吗？"\n\n"知……知道……"\n\n"那你应该说什么？"\n\n唐老鸭抿着嘴不说话。\n\n花栗鼠把巧克力递了回去："我不要巧克力。我要一句道歉。真心的道歉比一百盒巧克力都管用。"\n\n唐老鸭接过巧克力，站在那里半天。终于——\n\n"对不起。我踩坏了你的花。我不是故意的。"\n\n花栗鼠笑了："这才对嘛。"\n\n"那巧克力你要不要？"唐老鸭举着盒子问。\n\n"现在要了！"花栗鼠拿过来打开，分给唐老鸭一半。"道歉以后再送礼才有意义——因为它是表达歉意的，不是用来代替歉意的。"\n\n唐老鸭咬着巧克力想了想。确实——如果只送礼不道歉，对方会觉得"你是不是花钱了事不认错"。可如果先真心道歉了，再送一个小礼物，那就变成了诚意满满的感觉。\n\n"以后先说对不起……再看要不要送东西。"唐老鸭自己总结。\n\n花栗鼠点点头。唐老鸭终于学会了——嘴上那句"对不起"比任何礼物都重要。'

  category: '唐老鸭',
  content: '小蜗牛说他想当赛车手。\n\n唐老鸭笑得肚子疼："你？赛车手？哈哈哈！你是世界上最慢的动物！你当赛车手？笑死我了！"\n\n小蜗牛的头缩回了壳里，半天不出来。\n\n花栗鼠走过来拍了拍蜗牛的壳："别听他的。有梦想是好事。"\n\n然后花栗鼠转向唐老鸭："唐老鸭，你的梦想是什么？"\n\n"我想当歌手！"唐老鸭得意地说。\n\n"可是你唱歌……"花栗鼠憋了一下，"算了不说了。如果我现在说\'你嗓子那么差怎么可能当歌手哈哈哈\'——你什么感觉？"\n\n唐老鸭的笑容僵住了。\n\n"不舒服对吧？每个人的梦想都值得被尊重。不管看起来多\'不可能\'——那是人家的梦想，不是你来评判的。小蜗牛也许当不了赛车手，但也许他能当设计赛车的工程师呢？谁知道。"\n\n唐老鸭沉默了。他想起刚才小蜗牛缩进壳里的样子——那是梦想被踩碎的样子。\n\n"对不起，小蜗牛。"唐老鸭走到蜗牛旁边蹲下来，"你的梦想很酷。不管别人怎么说，你继续加油。"\n\n小蜗牛慢慢探出了头，眼睛里有亮光："真的？你觉得我的梦想酷？"\n\n"真的。"唐老鸭认真地点头。\n\n小蜗牛笑了——虽然它笑起来很慢，但那个笑容很暖。\n\n唐老鸭学到了：嘲笑别人的梦想是最残忍的事之一。因为梦想是一个人心里最柔软的地方——你的一句嘲笑可能就把它彻底碾碎了。'

  category: '唐老鸭',
  content: '唐老鸭每次需要帮助都去找花栗鼠。"花栗鼠帮我写作业""花栗鼠帮我搬东西""花栗鼠帮我想办法"——花栗鼠就像他的万能助手。\n\n可是当花栗鼠需要帮忙的时候呢？\n\n"唐老鸭帮我抬一下这个箱子好吗？"\n\n"我累了，你自己弄吧。"\n\n"唐老鸭明天能帮我浇花吗？我要去看奶奶。"\n\n"我明天有事。"\n\n花栗鼠发现——唐老鸭永远在要求别人帮他，可从来不帮别人。\n\n花栗鼠决定不说破，让唐老鸭自己感受一下。\n\n接下来一周花栗鼠每次唐老鸭求她帮忙都回答："我累了""我有事""你自己弄吧"——跟唐老鸭以前拒绝她用的一模一样的话。\n\n第一天唐老鸭没在意。第二天有点不高兴。第三天急了——"花栗鼠你怎么什么都不帮我了！"\n\n"我也想问你同一个问题呀。"花栗鼠平静地说，"我帮你的时候你觉得理所当然。你不帮我的时候你也觉得理所当然。这公平吗？"\n\n唐老鸭想反驳——但他一时间想不起来自己什么时候帮过花栗鼠。想了好久……真的一次都想不起来。\n\n"友谊是互相的。"花栗鼠说，"你帮我我帮你才叫朋友。如果只有一个人一直在付出另一个人一直在索取——那不叫朋友，叫免费保姆。"\n\n唐老鸭脸红了。\n\n第二天花栗鼠家在搬东西。唐老鸭主动跑来了："我帮你搬！"\n\n花栗鼠愣了一下，然后笑了："好呀。"\n\n两个人一起搬完了所有箱子。虽然累得满头汗，但唐老鸭觉得——帮朋友做事的感觉原来这么好。\n\n从那以后唐老鸭记住了一句话：想要别人对你好，你得先对别人好。'

{

  category: '唐老鸭',
  content: '学期快结束了。山羊老师让每个人说一说这学期自己改掉了什么坏毛病。\n\n轮到唐老鸭了。他站起来想了好久——因为他的坏毛病实在太多了，改了好多个。\n\n"我……这学期学会了说谢谢。不再偷看别人的东西了。不打断别人说话了。跟人比较的时候少了。不嘲笑别人的梦想了……"唐老鸭数着手指头，"还有不说别人坏话了。不玩手机不理人了。不找借口了。考试不作弊了……"\n\n全班小动物听着都笑了——唐老鸭的坏毛病可真多。但大家笑的不是嘲笑，是善意的笑——因为唐老鸭真的每一个都在改。\n\n山羊老师说："唐老鸭虽然毛病多，但他每次都在认真改正。这就是进步。进步不是没有缺点，而是一直在变好。"\n\n放学后唐老鸭和花栗鼠走在回家的路上。\n\n"花栗鼠，谢谢你一直教我。"唐老鸭说。\n\n"我没有教你呀。我只是让你自己体会到了。"花栗鼠说。\n\n"但如果没有你……我大概还是那个到处惹人烦的臭鸭子吧。"\n\n花栗鼠笑了："你本来就不坏。只是有些事情不知道不对而已。知道了就会改——这就够了。"\n\n夕阳照在两个小小的身影上。一只鸭子和一只花栗鼠，肩并肩走在回家的路上。\n\n虽然唐老鸭知道自己以后肯定还会犯新的毛病——但没关系。只要花栗鼠在身边提醒他，他就有信心一个一个改掉。\n\n因为有一个愿意帮你变好的朋友——是这世界上最幸运的事。'
},
{
  id: 'duck_41',
  title: '【唐老鸭和花栗鼠】第四十一集：故意让人着急',
  category: '唐老鸭',
  content: '唐老鸭发现让别人着急很好玩。他会故意把花栗鼠的东西藏起来，然后看着花栗鼠急得团团转，他在旁边偷着乐。\n\n今天唐老鸭把花栗鼠的钥匙偷偷藏到了树洞里。花栗鼠找了半个小时找不到，急得快哭了——因为家里炉子上还煮着汤呢，再不回去汤就糊了。\n\n"唐老鸭你看到我钥匙了吗？！"\n\n唐老鸭忍着笑说："没有啊。"\n\n花栗鼠急得到处翻，最后汤真的糊了，整个厨房都是焦味。花栗鼠坐在地上哭了。\n\n唐老鸭这才觉得不好玩了。他默默把钥匙从树洞里拿出来放在了花栗鼠能看到的地方。\n\n花栗鼠擦了眼泪看到了钥匙。她知道是唐老鸭藏的。\n\n"你觉得让我着急很好玩是不是？"花栗鼠的声音冷冷的。\n\n唐老鸭不说话了。\n\n"如果有人把你妈妈的手机藏起来，你妈妈急得到处找，你觉得好笑吗？"\n\n唐老鸭摇了摇头。\n\n"让别人着急不是好玩——是坏。因为着急的人心脏会跳得很快，会害怕，会慌张。你以为是小事，对别人来说可能是大事。我的汤糊了，锅差点烧坏。如果真着火了呢？"\n\n唐老鸭吓了一跳。他没想过藏钥匙会引发这么严重的后果。\n\n"对不起……我以后不藏你东西了。"\n\n"你赔我一锅汤。"花栗鼠说。\n\n唐老鸭乖乖去花栗鼠家帮忙洗了烧糊的锅——刷了快一个小时才刷干净。手都酸了。\n\n从此唐老鸭再也不故意藏别人东西了。因为那个糊锅的味道和刷锅的辛苦他永远忘不了。'
},
{
  id: 'duck_42',
  title: '【唐老鸭和花栗鼠】第四十二集：见到长辈不打招呼',
  category: '唐老鸭',
  content: '唐老鸭每次遇到邻居的爷爷奶奶叔叔阿姨，都低着头走过去，假装没看到。从来不主动打招呼。\n\n花栗鼠的妈妈跟花栗鼠说了这事："那个唐老鸭怎么每次看到我都不叫人呢？"\n\n花栗鼠决定让唐老鸭学会打招呼。\n\n她设计了一个小实验。第二天花栗鼠带唐老鸭一起出门买东西。路上碰到了卖水果的熊伯伯。\n\n花栗鼠大声说："熊伯伯好！"\n\n熊伯伯笑得好开心："花栗鼠好呀！来，送你一个苹果。"\n\n唐老鸭走过去什么都没说。熊伯伯看了他一眼就转头忙自己的了。\n\n接着碰到了开面包店的兔奶奶。花栗鼠说："兔奶奶好！"\n\n兔奶奶高兴地说："乖孩子！今天店里刚出炉的面包，给你一个尝尝。"\n\n唐老鸭走过去沉默着。兔奶奶看都没看他一眼。\n\n一路上花栗鼠收到了苹果、面包、还有一颗糖。唐老鸭什么都没有。\n\n"为什么她们都给你东西不给我？"唐老鸭郁闷地问。\n\n"因为我叫人了呀。长辈被小朋友问好会很开心，开心了就想对你好。你不打招呼——人家觉得你不礼貌，自然不会理你。"\n\n"可是……我不好意思叫……"\n\n"第一次叫可能会害羞。但叫完了对方笑着回应你的时候，你就不害羞了。试试看？"\n\n他们又碰到了卖糖果的松鼠阿姨。唐老鸭深吸一口气，小声说了一句："松鼠阿姨好……"\n\n松鼠阿姨愣了一下，然后笑得好灿烂："唐老鸭呀！好久没听到你打招呼了！来，拿一颗太妃糖。"\n\n唐老鸭红着脸接过糖。剥开一吃——好甜。\n\n从那以后唐老鸭见到长辈都会打招呼了。虽然有时候声音还是小小的，但每次对方笑着回应他的时候他就觉得——其实叫人一点都不难，还能让人开心。'
},
{
  id: 'duck_43',
  title: '【唐老鸭和花栗鼠】第四十三集：做事半途而废',
  category: '唐老鸭',
  content: '唐老鸭想学画画。第一天画了一棵树——歪歪扭扭的。"太难了不学了！"\n\n唐老鸭想学跳绳。跳了五下就被绳子绊了。"太难了不跳了！"\n\n唐老鸭想学折纸飞机。折到一半折错了。"太难了不折了！"\n\n什么事情都做了一半就放弃。花栗鼠看在眼里急在心里。\n\n"唐老鸭，你难道什么都不想学会吗？"\n\n"想是想……可是太难了学不会。"\n\n花栗鼠带唐老鸭去了池塘边。"你还记得你刚学游泳的时候吗？"\n\n唐老鸭想了想。"记得……一开始根本不会，呛了好多水。"\n\n"可是你现在游得比谁都好对不对？你当时也觉得\'太难了\'——但你没有放弃。为什么？"\n\n唐老鸭想了想："因为……我真的很想学会游泳。"\n\n"那就对了。你对游泳有足够的想要——所以你坚持了。画画跳绳折飞机也一样，只要你真的想学会，就得接受一开始很难的阶段。没有人一开始就什么都会。"\n\n花栗鼠从口袋里拿出了自己第一次画的画——歪歪扭扭比唐老鸭画得还难看。"这是我五岁的时候画的。再看看我现在画的。"\n\n唐老鸭对比了一下——天壤之别。\n\n"我练了一年多才从那么丑画到现在这样的。如果我第一天就放弃了——我就永远只会画歪歪扭扭的东西。"\n\n唐老鸭好像明白了。\n\n"这样吧，"花栗鼠说，"你选一个最想学的。我们每天练十分钟。坚持一个月看看效果。"\n\n唐老鸭选了画画。每天放学后画十分钟——第一周还是很难看。第二周稍微有点样子了。第三周——"咦？好像有点好看了？"第四周——他画了一只鸭子，虽然不完美但一看就知道是鸭子。\n\n"我画出来了！！"唐老鸭高兴得呱呱叫。\n\n花栗鼠笑着说："这就是坚持的力量。还想放弃吗？"\n\n"不想了！我还要画更多！"\n\n从那以后唐老鸭学任何东西都给自己定一个"至少坚持一个月"的规矩。他发现——很多以为"太难"的事情，坚持一个月以后都没那么难了。'
},
{
  id: 'duck_44',
  title: '【唐老鸭和花栗鼠】第四十四集：总说"我不会"',
  category: '唐老鸭',
  content: '唐老鸭最近有一个口头禅——"我不会"。\n\n"唐老鸭你帮我系个蝴蝶结吧。""我不会。"\n\n"唐老鸭你试试这道数学题？""我不会。"\n\n"唐老鸭你自己泡个方便面？""我不会。"\n\n唐老鸭把"我不会"当成了万能挡箭牌。只要说了这三个字就什么都不用做了——多方便。\n\n可花栗鼠发现，唐老鸭说的"我不会"有一半其实是"我不想做"或者"我懒得学"。\n\n花栗鼠决定给唐老鸭一个教训。周末她约唐老鸭去野餐。到了地方以后——\n\n"唐老鸭你帮我铺毯子吧。"\n\n"我不会。"\n\n"好。那我不铺了。我们坐在泥地上吃。"\n\n唐老鸭看着泥巴地："呃……那还是我来铺吧。"他拿起毯子——其实铺毯子哪有什么"会不会"的，往地上摊开不就行了？\n\n"唐老鸭你帮我打开这个罐头？"\n\n"我不——"唐老鸭刚想说"不会"，看了一眼花栗鼠的表情，改口了，"……我试试。"他拿起罐头拉了拉拉环——打开了。\n\n"你看，你不是不会，你是没试。"花栗鼠说。\n\n那天野餐的所有事情花栗鼠都让唐老鸭自己做——铺毯子、开罐头、倒水、切面包、收垃圾。唐老鸭发现——全部他都会！根本没有什么不会的！\n\n"以后能不能把\'我不会\'改成\'我试试\'？"花栗鼠说，"试了真的不会，没关系我教你。但别连试都不试就说不会——那不是不会，是不想。"\n\n唐老鸭红着脸点了点头。从此"我不会"从他的词典里消失了，变成了"我试试"。\n\n结果他发现世界上百分之八十的事情——试了就会了。'

  content: '"唐老鸭明天陪我去图书馆好不好？""好好好！"——结果第二天唐老鸭没来。\n\n"唐老鸭帮我带一瓶水好吗？""没问题！"——结果忘了。\n\n"唐老鸭你答应周末教我游泳的！""啊？我说过吗？"\n\n唐老鸭嘴上什么都答应，可真到了要做的时候全忘了。他觉得嘴上说一声"好"又不费力——可对方是当真的呀。\n\n花栗鼠被放了鸽子太多次了。这次她想了一个办法。\n\n"唐老鸭，我要开一家\'承诺银行\'。你每次答应我的事情我记下来。做到了加一分，做不到扣两分。分数归零了——以后我再也不相信你说的任何话。"\n\n唐老鸭不在意："好好好！"——又是随口答应。\n\n花栗鼠拿出小本子认真记了下来。\n\n第二天唐老鸭说"我明天给你带苹果"——没带。扣两分。\n\n第三天说"我帮你浇花"——忘了。又扣两分。\n\n分数掉得很快。一周后唐老鸭的分数变成了负数。\n\n花栗鼠合上本子："你的信用破产了。从今天开始，你说的任何承诺我都不会信了。"\n\n"什么意思？"\n\n"就是你说的话我当放屁。你说来找我？我不等你。你说帮我？我不指望你。因为你的承诺一文不值。"\n\n唐老鸭的脸一下子白了。"那……那怎么办？"\n\n"得重新赚信用。从现在开始每一个承诺都要兑现。连续做到十次，我才恢复信任。"\n\n唐老鸭这次是真的紧张了。接下来他说出口的每一个"好"都特别慎重——答应之前先想清楚自己到底能不能做到。做不到的就诚实说"不好意思我做不到"。\n\n连续两周，唐老鸭答应的事情全做到了。\n\n花栗鼠终于又对他笑了："信用恢复了。但记住——信任建立要很久，摧毁只要一次。珍惜别人的信任。"\n\n唐老鸭使劲点头。他终于学会了一件事：别轻易承诺，但承诺了就一定做到。'

  title: '【唐老鸭和花栗鼠】第四十六集：不爱惜公共设施',
  category: '唐老鸭',
  content: '森林公园里新安了一套滑梯和秋千。亮晶晶的，好漂亮。小动物们排队玩，每个人都很爱惜。\n\n唐老鸭玩的时候就不一样了——他用脚踹秋千的柱子，在滑梯上刻字，还把安全栏杆掰来掰去。\n\n"唐老鸭！别弄坏了！"花栗鼠喊。\n\n"又不是我家的，坏了有人修。"唐老鸭不在乎。\n\n一周后，秋千被唐老鸭踹松了一颗螺丝。小兔子荡秋千的时候"咔嚓"——链条断了！小兔子摔在了地上哇哇大哭。\n\n所有人都看向了唐老鸭。\n\n"不……不是我弄的……"唐老鸭心虚了。\n\n花栗鼠指着秋千柱子上唐老鸭踹出来的凹痕："这是谁的脚印？"\n\n唐老鸭不说话了。\n\n公园管理员熊伯伯来了。他检查了秋千说："螺丝被外力撬松了。如果找到是谁弄的，要赔修理费。"\n\n唐老鸭低着头站了出来："是我踹的……"\n\n"那你来修吧。"熊伯伯递给他扳手和新螺丝，"自己拧好。"\n\n唐老鸭蹲在地上拧螺丝，手都磨红了。拧完以后熊伯伯检查了一遍说："以后公共设施你爱惜着用。坏了不是\'有人修\'——坏了可能伤到人。今天小兔子只是摔了一下，如果磕到头呢？"\n\n唐老鸭想起小兔子哭着摔在地上的样子，后怕得不行。\n\n从那以后唐老鸭变成了森林公园的"设施监督员"——他不但自己不弄坏东西了，还会提醒别的小动物要爱惜公共设施。因为他比任何人都清楚：坏了的设施会伤到人。'
},
{
  id: 'duck_47',
  title: '【唐老鸭和花栗鼠】第四十七集：只顾自己开心',
  category: '唐老鸭',
  content: '下雨天唐老鸭穿着雨衣在水坑里跳。"哗！哗！哗！"水花溅得好高好高。\n\n可他没注意到——花栗鼠正好站在旁边，被溅了一身脏水。\n\n"唐老鸭！你看看你溅我一身！"花栗鼠低头看着自己今天新穿的裙子——全是泥点子。\n\n"哎呀没事嘛，回去洗洗就好了。"唐老鸭继续跳。\n\n花栗鼠气得转身就走了。\n\n第二天花栗鼠约唐老鸭一起做蛋糕。花栗鼠负责搅拌面粉，唐老鸭看着就觉得好好玩——他拿起打蛋器使劲搅！"呼呼呼！"\n\n面粉飞了满厨房。花栗鼠的脸上全是白粉，头发里也是，刚洗的厨房也白了。\n\n唐老鸭笑得在地上打滚："你变成白毛兔了哈哈哈！"\n\n花栗鼠抹了一把脸上的面粉，把一碗面糊直接扣在了唐老鸭头上。\n\n"啊！！"唐老鸭愣住了。面糊顺着他的脑袋往下流，黏糊糊的。\n\n"怎么？不好玩吗？"花栗鼠说，"你溅我水觉得好玩、喷我面粉觉得好玩。现在你被扣了一碗面糊——好不好玩？"\n\n唐老鸭看着自己身上黏糊糊的面糊，一点都笑不出来了。又黏又难受。\n\n"你在做一件让自己开心的事情之前，先看看周围有没有人会因此不开心。快乐不应该建立在别人的痛苦上。"\n\n唐老鸭顶着面糊点了点头。他花了半个小时才把头发上的面糊洗干净。\n\n从此以后在水坑旁边跳的时候，他都会先看看周围有没有人。在做任何"好玩"的事之前先想想——别人会不会被影响到。'
},
{
  id: 'duck_48',
  title: '【唐老鸭和花栗鼠】第四十八集：不尊重别人的劳动',
  category: '唐老鸭',
  content: '花栗鼠花了一整天打扫自己的小树洞——扫地、擦窗户、整理书架、洗窗帘。累得腰都直不起来了，但看着干干净净的家好开心。\n\n唐老鸭来串门了。他一进门穿着满是泥的鞋子就踩了进来——地板上全是泥脚印。他顺手把外套扔在了刚整理好的沙发上，又从书架上随手抽了一本书翻了几页丢在了茶几上。\n\n五分钟之内，花栗鼠打扫了一整天的房间又变乱了。\n\n花栗鼠看着地上的泥脚印和乱七八糟的客厅，眼泪在眼眶里转。\n\n"唐老鸭，你出去。"\n\n"怎么了？"唐老鸭莫名其妙。\n\n"你把我打扫了一天的房间弄脏了弄乱了。你出去。"\n\n唐老鸭被赶了出来。他站在门外想了想——他刚才做了什么？他只是进了个门啊……\n\n花栗鼠隔着门说："明天你来我家帮我打扫一整天。你体验一下收拾干净以后被人五分钟弄乱是什么感觉。"\n\n第二天唐老鸭来花栗鼠家扫了一整天。扫地拖地擦桌子整理书架……累得呱呱叫。好不容易弄完了——花栗鼠穿着泥鞋走了进来。\n\n"等等！你踩脏了——"唐老鸭的话卡在了嗓子里。\n\n花栗鼠笑了笑换了干净鞋："看到了吧？当你辛苦打扫干净的地方被人随随便便弄脏——你是什么心情？"\n\n"很……很生气。很心疼自己的劳动。"\n\n"所以去别人家要换鞋、要保持干净、东西从哪拿的放回哪去。尊重别人的劳动——就是尊重别人的时间和努力。"\n\n唐老鸭认真记住了。从那以后去任何人家里他都会换鞋、不乱丢东西。因为他永远记得自己打扫一天累得半死的感觉——再也不想让别人经历那种被破坏的心情。'
},
{
  id: 'duck_49',
  title: '【唐老鸭和花栗鼠】第四十九集：不会说"不"',
  category: '唐老鸭',
  content: '这集是花栗鼠教唐老鸭的另一面——有时候唐老鸭的问题不是坏毛病，而是太好说话了。\n\n小猪让唐老鸭帮他写作业。唐老鸭不想帮，可他说了"好吧"。\n\n刺猬让唐老鸭帮他搬家（搬了三趟好重的箱子）。唐老鸭自己还有事，可他说了"好吧"。\n\n大熊让唐老鸭帮他守东西（守了一下午哪都去不了）。唐老鸭很不情愿，可他还是说了"好吧"。\n\n唐老鸭每天累得不行——因为他不知道怎么拒绝别人。他怕说"不"会被人讨厌。\n\n花栗鼠看到唐老鸭累得像一滩泥一样趴在草地上，问他怎么了。\n\n唐老鸭把事情说了。花栗鼠叹了口气："唐老鸭，你知道吗——帮助别人是好事，但不能什么都帮。如果帮了别人让自己太累太委屈——那就不应该帮。"\n\n"可是……我怕他们不跟我做朋友了。"\n\n"真正的朋友不会因为你拒绝了一次就不跟你玩了。如果有人因为你拒绝帮忙就翻脸——那他本来就不是真朋友，他只是在利用你。"\n\n花栗鼠教唐老鸭说三句话：\n\n"对不起我今天有事帮不了。"\n\n"这个我不太方便，你找别人好吗？"\n\n"我可以帮你一点，但全部帮不了。"\n\n唐老鸭练习了好几遍。第二天小猪又来让他帮写作业——\n\n"对不起，作业得自己做。我可以教你但不能帮你写。"\n\n小猪愣了一下，然后说："也是……那你教我第三题吧。"\n\n唐老鸭发现——拒绝了以后小猪并没有翻脸，反而换了一个合理的请求。\n\n从那以后唐老鸭学会了说"不"。他发现自己轻松了好多，而且真正的朋友一个都没少。'
},
{
  id: 'duck_50',
  title: '【唐老鸭和花栗鼠】第五十集：五季总结——唐老鸭的毕业典礼',
  category: '唐老鸭',
  content: '今天是森林学校的毕业典礼。唐老鸭要从幼儿班升到小学班了。\n\n山羊老师让每个同学上台说一句话总结自己的幼儿班时光。\n\n轮到唐老鸭了。他站上台——台下坐着所有的小动物朋友们。花栗鼠坐在第一排朝他笑。\n\n唐老鸭深吸一口气说："我在幼儿班的时候犯了大概……一百个错吧。"\n\n全场笑了。\n\n"我踢过石头足球，偷过松果，喷过别人水枪，吹过牛，抢过玩具，吓过人，偷过画，插过队，扔过垃圾，说过谎，打过人，藏过粉笔，踩过花，推过队友，说过脏话，浪费过粮食，乱按过电梯，笑话过别人，抄过作业，不认过错，浪费过水，比较过别人，撕过书，看过手机不理人，欺负过小的，找过借口，抢过功劳，不守过规则，起过绰号，输不起掀过桌子，偷看过日记，打断过别人说话，不肯分享过，装过病逃学，乱碰过宠物，不会安慰人，不道歉只送礼，嘲笑过梦想，只索取不付出，让人着急过，不打招呼，半途而废过，说\'不会\'偷懒，乱答应不兑现，弄坏过公共设施，只顾自己开心，不尊重人家打扫……"\n\n唐老鸭数着数着自己都惊了——怎么这么多。\n\n"可是——每一个我都改了。"唐老鸭抬起头，声音变大了，"而且我知道，我能改掉这些全是因为一个人。"\n\n他看向了第一排的花栗鼠。\n\n"花栗鼠没有放弃过我。每次我犯了错她都会想办法让我自己体会到——不是骂我，而是让我感受到。她是我见过的最聪明也最耐心的朋友。"\n\n花栗鼠的眼睛有点红了。\n\n"所以我想跟她说——谢谢你。谢谢你没有放弃那个又笨又坏又调皮的唐老鸭。"\n\n全场鼓掌了。\n\n毕业典礼结束后，唐老鸭和花栗鼠一起走在回家的路上。夕阳把他们的影子拉得好长好长。\n\n"花栗鼠，我到了小学班还会犯新毛病吗？"\n\n"肯定会。"花栗鼠笑了，"但没关系。你已经学会了最重要的事——犯了错不害怕，改就行了。"\n\n"那你还陪我吗？"\n\n"永远都陪你呀，笨鸭子。"\n\n两个好朋友肩并肩走在夕阳下面。未来的路还很长，但只要有彼此在，什么都不怕。'
},
{
  id: 'lele_1',
  title: '【乐乐学数学】第一集：分草莓',
  category: '数学',
  content: '今天是周末，妈妈买回来一盒草莓。红红的、圆圆的草莓，上面还带着绿色的小叶子。\n\n"乐乐，数数看，一共有几颗草莓？"妈妈把草莓放在桌上。\n\n乐乐用手指一颗一颗地点："一、二、三、四、五、六、七、八、九、十！十颗草莓！"\n\n"真棒！那现在要分给全家人吃哦。爸爸两颗，妈妈两颗，剩下的都给你。你算算你能吃几颗？"\n\n乐乐掰着手指头想。十颗草莓，爸爸拿走两颗，就剩下——\n\n"叮！"背包里的叮叮跳了出来，小小的身体像一个发光的计算器，屏幕上显示着笑脸。\n\n"乐乐，想想看，十减二等于几？"叮叮提示。\n\n乐乐在桌上摆了十颗草莓，然后拿走两颗放到爸爸的盘子里。数了数剩下的："一二三四五六七八——八颗！十减二等于八！"\n\n"对啦！那八颗再减去妈妈的两颗呢？"\n\n乐乐又拿走两颗放到妈妈的盘子里。数了数："一二三四五六——六颗！八减二等于六！"\n\n"所以乐乐能吃六颗草莓哦！"叮叮开心地转了个圈。\n\n乐乐高兴极了。她捧着六颗草莓吃得满嘴红红的。\n\n吃着吃着她突然想到一个问题："叮叮，爸爸两颗加妈妈两颗加我六颗，一共是多少？"\n\n"你算算看？"\n\n乐乐用手指数：二加二等于四，四加六等于——"十！又变回十了！"\n\n"没错！分出去的加起来还是原来那么多。这就是数学的奇妙之处。"叮叮笑着说。\n\n乐乐舔了舔手指上的草莓汁："数学真好吃——啊不，真好玩！"'
},
{

  title: '【乐乐学数学】第二集：坐公交车',
  category: '数学',
  content: '乐乐和妈妈坐公交车去公园。叮叮悄悄在背包里看着。\n\n公交车到了第一站。乐乐透过窗户看到站台上站着三个人。车门一开，三个人都上来了。\n\n"车上本来有四个人，上来了三个人。乐乐你算算现在车上几个人？"妈妈问。\n\n乐乐伸出手指："四加三……四、五、六、七！七个人！"\n\n"真棒！"\n\n公交车继续开。到了第二站，有两个人下了车。\n\n"七个人下去了两个，还剩几个？"\n\n乐乐想了想："七减二……七、六、五！五个人！"\n\n到了第三站，一下子上来了五个人！车上一下子热闹了。\n\n"五加五等于几？"\n\n乐乐掰着手指头——一只手五个手指，另一只手五个手指，合起来是——"十个！好多人呀！"\n\n叮叮在背包里小声说："乐乐，你发现了吗？五加五等于十。两只手合起来就是十。"\n\n乐乐看了看自己的两只手，嘻嘻笑了："我的手就是计算器呢！"\n\n到了公园站，乐乐和妈妈下了车。乐乐回头看了一眼公交车："十个人减去我和妈妈两个人，车上还剩……八个人！"\n\n妈妈竖起了大拇指。乐乐开心地蹦蹦跳跳进了公园大门。\n\n叮叮在背包里打了个小哈欠："生活里到处都是数学呀。"'
},
{
  id: 'lele_3',
  title: '【乐乐学数学】第三集：搭积木塔',
  category: '数学',
  content: '乐乐和好朋友小明一起搭积木塔。他们有十块积木——红色五块，蓝色五块。\n\n"我们轮流放吧！"乐乐说，"我放一块你放一块。"\n\n乐乐放了一块红色的。小明放了一块蓝色的。乐乐又放了一块红色的。小明又放了一块蓝色的。\n\n放了一会儿，乐乐数了数塔上面已经有的积木："一二三四五六——六块了！"\n\n"那还剩几块没放？"叮叮从背包里冒出个小脑袋问。\n\n"十减六……"乐乐想了想，"四块！"\n\n"对！那这四块里面几块红的几块蓝的？"\n\n乐乐数了数已经放上去的："红色放了三块，蓝色放了三块。本来红色有五块，放了三块，还剩五减三等于……二块！蓝色也是还剩两块！"\n\n"二加二等于四，跟刚才算的一样！"乐乐开心地拍了拍手。\n\n小明说："那我们继续搭。我再放一块蓝的——现在塔上有几块了？"\n\n"六加一等于七！"乐乐秒答。\n\n"我再放一块红的！"乐乐也放了一块。\n\n"七加一等于八！"\n\n最后两块——一红一蓝——也放上去了。"八加一等于九，九加一等于十！全部放完了！"\n\n十块积木搭成了一座高高的塔。红蓝红蓝相间，好漂亮。\n\n"叮叮，我发现了一个规律——每次加一就多一块，加到十就是全部了！"\n\n叮叮笑了："你发现了\'顺序数数\'的秘密。数学里这叫\'逐一递增\'。很棒哦。"\n\n乐乐看着漂亮的积木塔，觉得数学真像搭积木——一块一块来，就能搭出很大的东西。'

{
  id: 'lele_4',
  title: '【乐乐学数学】第四集：糖果店的难题',
  category: '数学',
  content: '乐乐攒了十个金币（就是小贴纸换的奖励币）。今天妈妈带她去森林糖果店买糖。\n\n糖果店里有好多好多糖：- 棒棒糖，一颗两个金币- 软糖，一颗一个金币- 巧克力豆，一包三个金币\n\n"乐乐，你有十个金币。你想买什么？"妈妈说。\n\n乐乐想了想："我想要一颗棒棒糖和一包巧克力豆！"\n\n"那你算算要花多少金币？"\n\n叮叮悄悄提示："棒棒糖两个，巧克力豆三个。加起来呢？"\n\n"二加三等于……五！花五个金币！"\n\n"那你还剩多少？"\n\n"十减五等于……五！还剩五个金币！"\n\n乐乐拿着剩下的五个金币又看了看。"我还想买软糖！软糖一颗一个金币，五个金币能买几颗？"\n\n"一个金币一颗，五个金币——"叮叮闪了闪。\n\n"五颗！"乐乐数着手指，"一个买一颗，两个买两颗，三个三颗，四个四颗，五个五颗！"\n\n乐乐最后买了：一颗棒棒糖、一包巧克力豆、五颗软糖。金币刚好花光——"二加三加五等于十！"\n\n回家路上乐乐把五颗软糖分给了妈妈两颗。"五减二等于三，我还有三颗。"\n\n妈妈笑着说："乐乐现在买东西都会算账了呢。"\n\n叮叮在背包里得意地说："会数学的人买东西不吃亏哦。"'

{

// ==================== STATE ====================
const State = {
  currentView: 'list', // list | reading | settings | addStory
  currentCategory: '恐龙',
  currentStory: null,
  stories: [],
  favorites: new Set(),
  customStories: [],
  settings: {
    protagonistName: '小宝贝',
    voiceURI: '',
    speed: 0.85,
    pitch: 1.1,
    sleepTimer: 0
  },
  tts: {
    playing: false,
    paused: false,
    currentSentenceIndex: 0,
    sentences: [],
    utterance: null
  },
  sleepTimerEnd: null,
  sleepTimerInterval: null
};

// ==================== STORAGE ====================
function loadState() {
  try {
    const saved = localStorage.getItem('bedtime_stories_state');
    if (saved) {
      const data = JSON.parse(saved);
      if (data.settings) Object.assign(State.settings, data.settings);
      if (data.favorites) State.favorites = new Set(data.favorites);
      if (data.customStories) State.customStories = data.customStories;
    }
  } catch(e) { console.warn('Failed to load state', e); }
  State.stories = [...PRESET_STORIES, ...State.customStories];
}

function saveState() {
  try {
    localStorage.setItem('bedtime_stories_state', JSON.stringify({
      settings: State.settings,
      favorites: [...State.favorites],
      customStories: State.customStories
    }));
  } catch(e) { console.warn('Failed to save state', e); }
}

// ==================== HELPERS ====================
function replaceName(text) {
  const name = State.settings.protagonistName || '小宝贝';
  // 支持多种占位符格式：{主人公} ｛主人公｝ （主人公） [主人公] 【主人公】
  return text.replace(/[{｛\[【（(]主人公[}｝\]】）)]/g, name);
}

function splitSentences(text) {
  return text.split(/(?<=[。！？\n])/g).map(s => s.trim()).filter(s => s.length > 0);
}

// 清理文本中不需要朗读的符号
function cleanForTTS(text) {
  return text
    // 去除所有引号、括号、书名号
    .replace(/["""''『』「」《》【】〈〉（）(){}｛｝\[\]]/g, '')
    // 去掉破折号、省略号
    .replace(/[——…—]+/g, '')
    .replace(/\.{3,}/g, '')
    // 去掉感叹号、问号（不替换，直接删）
    .replace(/[！!？?]+/g, '')
    // 去掉冒号、分号等杂符号
    .replace(/[：:；;～~·•＊*＃#、]+/g, '')
    // 去掉句号（speechSynthesis会读"句号"）
    .replace(/[。]+/g, '，')
    // 多个逗号合并成一个
    .replace(/[，,]{2,}/g, '，')
    // 开头的逗号去掉
    .replace(/^，/, '')
    // 清理多余空格
    .replace(/\s+/g, '')
    .trim();
}

function getFilteredStories() {
  let stories = State.stories;
  if (State.currentCategory === '收藏') {
    stories = stories.filter(s => State.favorites.has(s.id));
  } else if (State.currentCategory !== '全部') {
    stories = stories.filter(s => s.category === State.currentCategory);
  }
  return stories;
}

// ==================== TTS ENGINE (浏览器 speechSynthesis) ====================

function stopTTS() {
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  State.tts.playing = false;
  State.tts.paused = false;
  State.tts.currentSentenceIndex = 0;
  State.tts.utterance = null;
  render();
}

function pauseTTS() {
  if (window.speechSynthesis && window.speechSynthesis.speaking) {
    window.speechSynthesis.pause();
    State.tts.paused = true;
    State.tts.playing = false;
    render();
  }
}

function resumeTTS() {
  if (State.tts.paused) {
    window.speechSynthesis.resume();
    State.tts.paused = false;
    State.tts.playing = true;
    render();
  }
}

function speakFromIndex(index) {
  if (index >= State.tts.sentences.length) {
    playNextStory();
    return;
  }
  State.tts.currentSentenceIndex = index;
  State.tts.playing = true;
  State.tts.paused = false;

  const text = cleanForTTS(State.tts.sentences[index]);
  if (!text) { speakFromIndex(index + 1); return; }

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.rate = State.settings.speed;
  utterance.pitch = 1.1;
  utterance.lang = 'zh-CN';

  const voices = window.speechSynthesis.getVoices();
  const zhVoice = voices.find(v => v.lang.startsWith('zh'));
  if (zhVoice) utterance.voice = zhVoice;

  if (State.sleepTimerEnd) {
    const remaining = (State.sleepTimerEnd - Date.now()) / 1000;
    if (remaining <= 0) { stopTTS(); clearSleepTimer(); return; }
    if (remaining <= 30) { utterance.volume = Math.max(0.1, remaining / 30); }
  }

  utterance.onend = () => { if (State.tts.playing) speakFromIndex(index + 1); };
  utterance.onerror = (e) => { if (e.error !== 'canceled' && State.tts.playing) speakFromIndex(index + 1); };

  State.tts.utterance = utterance;
  window.speechSynthesis.speak(utterance);
  render();
}

function playTTS() {
  if (State.tts.paused) {
    resumeTTS();
    return;
  }
  if (!State.currentStory) return;
  const title = replaceName(State.currentStory.title);
  const content = replaceName(State.currentStory.content);
  State.tts.sentences = [title + '。', ...splitSentences(content)];
  speakFromIndex(0);
}

// ==================== SLEEP TIMER ====================
function startSleepTimer(minutes) {
  clearSleepTimer();
  if (minutes <= 0) return;
  State.sleepTimerEnd = Date.now() + minutes * 60 * 1000;
  State.sleepTimerInterval = setInterval(() => {
    if (State.sleepTimerEnd && Date.now() >= State.sleepTimerEnd) {
      stopTTS();
      clearSleepTimer();
    }
    render();
  }, 1000);
}

function clearSleepTimer() {
  if (State.sleepTimerInterval) {
    clearInterval(State.sleepTimerInterval);
    State.sleepTimerInterval = null;
  }
  State.sleepTimerEnd = null;
}

// ==================== RENDER ====================
function render() {
  const app = document.getElementById('app');
  if (State.currentView === 'list') {
    app.innerHTML = renderListView();
  } else if (State.currentView === 'reading') {
    app.innerHTML = renderReadingView();
  }
  // Modals render on top
  if (State.currentView === 'settings') {
    app.innerHTML = renderListView() + renderSettingsModal();
  } else if (State.currentView === 'addStory') {
    app.innerHTML = renderListView() + renderAddStoryModal();
  }
}
