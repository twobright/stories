{
  id: 'zhengzheng_37',
  title: '【调皮鬼正正】第三十七集：把零食藏起来独吃',
  category: '成长',
  content: '正正的妈妈给他带了一大包好吃的饼干到幼儿园。分享时间到了，老师鼓励大家把带来的零食分给好朋友一起吃。\n\n可是正正不想分。他偷偷把饼干藏到了柜子里，趁没人的时候一个人躲在角落里吃。\n\n别的小朋友都在分享——小美分了糖果，乐乐分了果冻，大家你一口我一口，吃得可开心了，还一起玩得热热闹闹的。\n\n正正一个人躲在角落里吃饼干，吃着吃着觉得没意思。别人分享的时候有说有笑，就他一个人。而且他吃不完那么多饼干，最后饼干受潮变软了，不好吃了。\n\n第二天，小美带了草莓，分给了每个小朋友，就是没分给正正。乐乐带了巧克力，也没给正正。\n\n"为什么不分给我？"正正问。\n\n小美说："因为昨天你的饼干没有分给我们呀。"\n\n正正这才明白，原来分享是互相的。他昨天独吃，今天别人就不愿意分给他了。\n\n正正想起自己一个人躲着吃的孤单，又看看别人分享时的热闹开心，他懂了。\n\n第三天，正正带了一大包山楂片，主动分给了每一个小朋友。"给你！给你！大家一起吃！"\n\n小朋友们都很开心，也把自己的零食分给了正正。大家围坐在一起，分享着各种各样的零食，有说有笑。\n\n正正吃着大家分享的零食，心里美滋滋的。他发现：一个人独吃，味道再好也孤单；和大家分享，普通的零食也变得特别香甜。分享的快乐，比独吃多得多。'
},
{
  id: 'zhengzheng_38',
  title: '【调皮鬼正正】第三十八集：故意大声吵闹',
  category: '成长',
  content: '午睡的时候，别的小朋友都睡着了，教室里静悄悄的。正正睡不着，觉得太安静了没意思。\n\n他故意大声喊："啊——！"把好几个小朋友吵醒了。\n\n正正觉得好玩，又敲桌子，又唱歌，还学怪兽叫。教室里被他搞得乱糟糟的，好多小朋友都被吵醒了，揉着眼睛起来。\n\n李老师走过来，轻声但严肃地说："正正，你看，大家都被你吵醒了。他们睡不好，下午就没精神。你自己不困，也要安静，不能打扰别人休息。"\n\n正正被单独带到了活动室。"你在这里待着，等大家午睡结束再回去。"\n\n正正一个人在活动室里，没有小伙伴，什么也不能玩，特别无聊。他这才发现，一个人待着真没意思。\n\n午睡结束了，正正回到教室。可是这天下午，因为好几个小朋友被他吵得没睡好，做游戏的时候都没什么精神，游戏没玩起来。正正想找小朋友玩，大家都蔫蔫的。\n\n"都怪我把大家吵醒了……"正正有点内疚。\n\n李老师说："在需要安静的地方就要安静，比如午睡时、上课时、图书馆里。这是对别人的尊重。你想说话想玩，可以等到该玩的时候。"\n\n正正记住了。第二天午睡，他就算睡不着，也安安静静地躺着，不发出声音。慢慢地，他自己也睡着了。\n\n下午起来，全班小朋友都精神饱满，一起玩了好玩的游戏。正正玩得特别开心，他明白了：安静的时候保持安静，大家才能一起享受热闹的时候。'
},
{

  title: '【调皮鬼正正】第三十九集：不好好穿衣服',
  category: '成长',
  content: '天气变冷了，李老师提醒大家：户外活动要穿好外套。\n\n正正嫌穿外套麻烦，把外套一甩扔在了椅子上。"我不冷！穿外套多难受！"他就穿着单薄的小衬衫跑出去玩了。\n\n外面风很大，别的小朋友都穿着暖暖的外套，只有正正冻得瑟瑟发抖，鼻涕都流出来了。可他还嘴硬："我不冷！"\n\n玩着玩着，正正冷得受不了了，缩着脖子，抱着胳膊，一点都玩不起来了。\n\n李老师把他的外套拿出来："快穿上吧，别冻感冒了。"\n\n正正这次乖乖穿上了外套。暖和多了，他又能开心地玩了。\n\n可是已经晚了。当天晚上，正正就打起了喷嚏，第二天发起了烧，感冒了。他难受得躺在床上，头晕晕的，还得喝苦药。\n\n"都怪我不穿外套……"正正难受地说。\n\n生病的这几天，正正没能去幼儿园，一个人在家躺着，又无聊又难受。他好想念幼儿园的小伙伴啊。\n\n病好了回到幼儿园，正正学乖了。天冷了，他会主动穿上外套；出汗了，会先擦干再脱；下雨了，会记得带伞。\n\n"正正现在知道照顾自己了。"李老师表扬他。\n\n正正认真地说："因为不穿外套会感冒，感冒可难受了，还不能来幼儿园玩！"\n\n从那以后，正正学会了根据天气照顾自己——冷了加衣，热了减衣。他知道了，好好穿衣服不是麻烦，是在保护自己的身体。'

{
  id: 'zhengzheng_40',
  title: '【调皮鬼正正】第四十集：抢着开门撞到人',
  category: '成长',
  content: '每次进出教室，正正都要抢着第一个冲过去开门。"我来开门！我来！"\n\n他不管三七二十一，用力一推门——"砰！"门正好撞到了后面走过来的小雨，把小雨的鼻子撞红了。\n\n小雨捂着鼻子哭了。李老师赶紧过来看。"正正，开门要慢慢开，先看看门后面有没有人。你这样猛推门，很容易撞到人。"\n\n正正没在意："我又不是故意的。"\n\n结果没过几天，另一个小朋友抢着开门，"砰"地一下正好撞到了正正的脑袋。正正疼得直捂脑袋，眼泪都出来了。\n\n"哎哟！好疼！谁开的门！"\n\n李老师走过来说："现在你知道被门撞的滋味了吧？这就是那天小雨的感觉。"\n\n正正揉着脑袋，想起了那天被自己撞哭的小雨。"原来被门撞这么疼……对不起小雨。"\n\n李老师教大家开门的正确方法："开门的时候慢一点，先看看门后有没有人，轻轻地开。进门以后，如果后面还有人，要扶着门等一下，别让门弹回去撞到人。"\n\n正正学会了。以后开门他都会先喊一声"我要开门啦"，然后慢慢地推，还会回头看看后面有没有小朋友。进门后他会帮后面的人扶着门。\n\n"谢谢正正帮我扶门！"小朋友们都夸他。\n\n正正美滋滋的。他发现，慢慢开门、帮别人扶门，不但不会撞到人，还能得到大家的感谢。原来礼貌又安全的方式，比抢着冲更好。'

  category: '成长',
  content: '正正吃完糖，随手把糖纸一扔。撕了张纸，随手一扔。用完的纸巾，也随手一扔。教室的地上到处都是他丢的垃圾。\n\n"正正，垃圾要扔到垃圾桶里。"李老师提醒他。\n\n"垃圾桶那么远，扔地上多方便。"正正满不在乎。\n\n可是慢慢地，正正周围变得又脏又乱，全是纸屑。别的小朋友都不愿意坐在他旁边了。\n\n有一天，李老师组织大家玩"寻宝游戏",把小卡片藏在教室各处。可是正正丢的纸屑太多了，卡片混在纸屑里根本找不到。因为地上太脏，游戏没法好好玩。\n\n"都是谁乱丢的垃圾呀，把游戏都搞乱了。"小朋友们抱怨。\n\n正正的脸红了——都是他丢的。\n\n李老师说："正正，你看，你乱丢垃圾，不但自己周围脏，还影响了大家。今天你负责把教室的垃圾都捡起来，扔到垃圾桶。"\n\n正正拿着垃圾袋，一片一片地捡纸屑。捡了好多好多，装了大半袋。捡得腰都酸了。\n\n"原来我丢了这么多垃圾……"正正自己都吓了一跳。\n\n捡完垃圾，教室变得干干净净的。正正看着整洁的教室，心里舒服多了。\n\n李老师说："你看，干净的教室多舒服。垃圾桶虽然远几步，但走过去扔掉，就能保持干净。"\n\n从那以后，正正养成了好习惯——垃圾一定扔进垃圾桶，哪怕多走几步。他还会捡起地上别人丢的垃圾。教室里，正正的座位周围总是最干净的。'

{
  id: 'zhengzheng_42',

  category: '成长',
  content: '今天有正正最不喜欢的跳舞课。正正不想跳，就假装肚子疼："哎哟，我肚子好疼，不能跳舞……"\n\n李老师关心地让他在旁边休息。正正躲过了跳舞课，心里偷着乐。\n\n可是接下来是他最喜欢的做游戏时间。正正兴奋地想去玩——可是李老师说："你肚子疼，还是在旁边休息吧，别玩得太累。"\n\n正正只能眼巴巴地看着别的小朋友做游戏，自己不能玩。他后悔死了。\n\n更糟糕的是，因为"肚子疼",李老师给正正妈妈打了电话。妈妈担心地提前来接他，还带他去看了医生。\n\n医生检查了半天："肚子没问题呀。"\n\n妈妈这才知道正正是装的。回到家，妈妈很严肃地说："正正，你为了不跳舞就装病，害妈妈担心，还耽误了大家。而且——如果你以后真的肚子疼，喊\'狼来了\',大家还会相信你吗？"\n\n正正想起了狼来了的故事——那个总是撒谎的放羊娃，最后真的有狼来了，没人相信他。\n\n正正低下了头："对不起，我以后不装病了。"\n\n"不喜欢跳舞可以跟老师说，我们一起想办法。但不能装病骗人。"妈妈说。\n\n第二天，正正跟李老师说了实话："老师，其实我不太会跳舞，怕跳不好被笑话。"\n\n李老师笑了："没关系，跳舞不用跳得多好，开心就行。老师教你，慢慢来。"\n\n正正试着跳了跳，发现其实挺好玩的，也没人笑他。从那以后，正正有什么想法都直接说，再也不装病骗人了。他知道了，诚实的孩子才能被信任。'

  content: '每个小朋友都有自己固定的座位，上面贴着名字。可是正正觉得靠窗的座位好，能看到外面的风景。\n\n那个靠窗的座位是小美的。趁小美还没来，正正一屁股坐了上去。"这个位置归我了！"\n\n小美来了，发现自己的座位被占了。"这是我的座位呀……"\n\n"先到先得！"正正赖着不走。\n\n小美只好委屈地坐到了正正的座位上。可是那样一来，正正的东西和小美的东西都乱了，小美找不到自己的蜡笔，正正也找不到自己的书。上课的时候乱成一团。\n\n李老师发现了："正正，为什么坐在小美的座位上？"\n\n"我喜欢靠窗的位置。"\n\n"每个人的座位都是安排好的，上面有名字。你坐了小美的座位，小美就没地方坐了，东西也乱了。这样对小美公平吗？"\n\n正正想了想，如果自己的座位被别人占了，自己也会不高兴的。\n\n"而且，"李老师说，"如果你真的喜欢靠窗的位置，可以跟老师说，跟小美商量,而不是直接抢。"\n\n正正回到了自己的座位，跟小美道了歉。\n\n后来李老师说，每周会轮换座位，让每个小朋友都有机会坐靠窗的位置。正正很期待轮到自己。\n\n轮到正正坐靠窗座位那周，他特别开心，看着窗外的大树和小鸟。他发现，用商量和等待得到的，比抢来的更让人安心。\n\n从那以后，正正不抢别人座位了。想要什么会好好说、好好商量。他明白了：每个人的东西都要被尊重，不能仗着"先到"就抢占。'

  title: '【调皮鬼正正】第四十四集：不听指挥乱跑',
  category: '成长',
  content: '今天幼儿园组织去公园春游。李老师再三叮嘱："大家要跟着队伍走，不能乱跑，要拉着旁边小朋友的手。"\n\n可是正正一到公园就撒开手，东跑西跑。看到蝴蝶追蝴蝶，看到小鸟追小鸟，一会儿就不见了踪影。\n\n李老师数人数的时候发现少了一个——正正不见了！\n\n老师和小朋友们都很着急，到处找正正。"正正！正正！你在哪里？"\n\n正正呢？他追蝴蝶追到了一片陌生的树林，回头一看——找不到老师和小朋友了！\n\n正正害怕极了，周围一个认识的人都没有，他大声哭了起来："老师……妈妈……我找不到你们了……"\n\n正正一个人在陌生的地方，又怕又急，蚊子咬，太阳晒，还担心遇到坏人。他从来没有这么害怕过。\n\n幸好李老师最后在树林里找到了正正。看到老师，正正一下子扑进老师怀里大哭："老师！我好害怕！"\n\n"正正，这就是不听指挥乱跑的后果。"李老师抱着他说，"如果老师没找到你，你自己在陌生的地方多危险呀。集体出去，一定要跟着队伍。"\n\n正正吓得不轻，紧紧拉着老师的手，再也不敢乱跑了。\n\n接下来的春游，正正乖乖跟着队伍，拉着小伙伴的手，一步都不敢乱走。虽然看到蝴蝶也想追，但他忍住了，只是用眼睛看。\n\n从那以后，正正明白了：集体活动跟着队伍走，不是不自由，是为了安全。走丢的那种害怕，他再也不想经历第二次了。'
},
{
  id: 'zhengzheng_45',
  title: '【调皮鬼正正】第四十五集：嘲笑摔倒的小朋友',
  category: '成长',
  content: '跑步的时候，小胖不小心摔了一跤，趴在地上。\n\n正正指着小胖哈哈大笑："哈哈！小胖摔了个大屁墩！好好笑！"他还叫别的小朋友一起看："快看快看，小胖摔跤了！"\n\n小胖趴在地上，膝盖摔破了，又疼又难为情，眼泪在眼眶里打转。\n\n李老师赶紧扶起小胖，一边帮他吹伤口，一边看着正正："正正，别人摔倒了受伤了，你不去帮忙，还嘲笑他，这样对吗？"\n\n正正还在笑："可是他摔的样子很好笑嘛。"\n\n结果，就在当天下午，正正自己跑得太快，"扑通"也摔了一跤，膝盖也破了，摔得可疼了。\n\n这时候，有个小朋友学着正正的样子笑他："哈哈！正正摔了个大屁墩！"\n\n正正又疼又羞，眼泪一下子涌出来了。被人嘲笑的感觉太难受了。\n\n这时候，是小胖走过来，扶起了正正，还帮他吹了吹伤口："别哭，不疼不疼。"\n\n正正愣住了。他嘲笑过小胖，可小胖摔倒的时候，小胖却来帮他。\n\n正正惭愧极了："小胖，对不起……我不该笑你摔跤。"\n\n小胖说："没关系，摔跤谁都会摔的。"\n\n李老师说："正正，你现在知道了吧？别人有困难的时候，需要的是帮助，不是嘲笑。今天你摔倒，小胖帮了你，这就是善良。"\n\n从那以后，正正看到有小朋友摔倒或者遇到困难，第一反应不再是笑，而是跑过去问："你没事吧？我扶你。"\n\n他学会了善良——在别人难过、受伤的时候，伸出援手，而不是嘲笑。'
},
{
  id: 'zhengzheng_46',
  title: '【调皮鬼正正】第四十六集：玩火柴很危险',
  category: '成长',
  content: '正正在家里发现了一盒火柴。他觉得"嚓"地一下能点着火，好神奇好好玩。\n\n他偷偷拿了火柴，带到了幼儿园，想给小朋友们表演。"我会变火！你们看！"\n\n正正正准备划火柴，李老师眼疾手快，一下子把火柴收走了。"正正！火柴绝对不能玩！"\n\n李老师的表情从来没有这么严肃过。她把所有小朋友叫到一起，认真地说："小朋友们，火是很危险的东西。玩火柴、打火机，一不小心就会烧到自己，烧到衣服，甚至引起大火，把房子都烧掉。"\n\n李老师给大家看了一段消防安全的动画：小火苗一下子变成了大火，烧毁了房子，好可怕。\n\n正正吓得脸都白了。他没想到小小的火柴会这么危险。\n\n"火只能由大人使用，小朋友绝对不能碰火柴、打火机、蜡烛这些会着火的东西。"李老师说，"看到这些东西，要离远一点，还要告诉大人。"\n\n正正把火柴的事告诉了妈妈。妈妈也吓了一跳，把家里的火柴、打火机都收到了正正够不到的地方。\n\n"正正，你能主动告诉妈妈，很棒。"妈妈说，"但以后千万不能再碰这些东西了。火不是玩具，是很危险的。"\n\n正正用力点头。他把李老师教的记得牢牢的：不玩火，不玩电,不碰危险的东西。\n\n后来幼儿园做安全教育，正正还举手回答："火柴打火机不能玩！会引起火灾！"老师表扬了他。\n\n从那以后，正正成了小小安全员。看到有小朋友想玩危险的东西，他会赶紧制止："这个危险，不能玩！要告诉老师！"'
},
{
  id: 'zhengzheng_47',
  title: '【调皮鬼正正】第四十七集：说话不算话',
  category: '成长',
  content: '正正跟乐乐约好了，明天要把自己的恐龙玩具带来给乐乐玩。乐乐特别期待，晚上高兴得都睡不着。\n\n可是第二天，正正没带。"我忘了。"\n\n"那明天呢？"乐乐问。\n\n"明天一定带！我保证！"\n\n第二天，正正又没带。第三天，还是没带。乐乐每天满怀期待地等，每天都失望。\n\n后来，乐乐有一辆新的遥控汽车，正正特别想玩。"乐乐，借我玩玩你的遥控车吧！"\n\n乐乐摇摇头："不借。"\n\n"为什么呀？"\n\n"因为你说话不算话。你答应带恐龙给我玩，说了好多次都没带。你的话不能信。"\n\n正正愣住了。他这才发现，因为自己一次次说话不算话，乐乐已经不相信他了。\n\n李老师知道后说："正正，答应了别人的事就要做到，这叫守信用。你一次次不兑现承诺，别人就再也不相信你了。信任一旦没了，就很难再建立起来。"\n\n正正很后悔。他回家第一件事就是把恐龙玩具装进书包，怕再忘了。\n\n第二天，正正一到幼儿园就把恐龙玩具拿给乐乐："对不起，我说话不算话这么多次。这个恐龙给你玩，我以后答应的事一定做到。"\n\n乐乐很惊喜，两个人一起玩恐龙玩得很开心。慢慢地，乐乐又开始相信正正了。\n\n从那以后，正正答应别人的事，都会记在心里，努力做到。做不到的事，他就不轻易答应。他明白了：说话算话，别人才会信任你；一个守信用的人，才有真正的好朋友。'
},
{
  id: 'zhengzheng_48',
  title: '【调皮鬼正正】第四十八集：不尊重老师',
  category: '成长',
  content: '李老师在讲课，正正却在下面做鬼脸，学老师说话的样子，逗得旁边的小朋友哈哈笑。\n\n老师让大家安静，正正却故意大声接话；老师转身写字，正正就朝老师的背影扮鬼脸。\n\n李老师转过身，看到正正在扮鬼脸。她没有生气，只是有点难过地说："正正，老师每天认真地给你们准备好玩的课、好听的故事，是希望你们学到东西。你这样不尊重老师，老师心里很难过。"\n\n正正看到李老师难过的样子，愣了一下。他从来没想过老师也会难过。\n\n放学后，正正看到李老师还在教室里忙——她在给明天的手工课剪纸，剪了好多好多漂亮的小花，手指都磨红了。她还在批改小朋友们的画，给每一幅都画上小星星。\n\n"老师，你怎么还不回家？"正正问。\n\n"要给你们准备明天的课呀。"李老师笑着说，"明天教你们做纸花，你看漂亮吗？"\n\n正正看着那些精心剪的纸花，心里很不是滋味。原来老师为了他们，下班了还在辛苦地准备。而自己上课却扮鬼脸捣乱，不尊重老师。\n\n"老师，对不起……我上课不该扮鬼脸捣乱。"正正真心地说。\n\n李老师摸摸他的头："知道错了就好。老师不要求你们多听话，只希望你们上课认真一点，这是对老师劳动的尊重。"\n\n第二天上课，正正坐得端端正正，认真听讲，还帮老师发了本子。做纸花的时候，他做得特别认真。\n\n"老师，这朵纸花送给你，谢谢你每天教我们。"正正把自己做的纸花送给了李老师。\n\n李老师特别感动，笑得特别开心。正正也明白了：老师为大家付出了很多，尊重老师、认真上课，就是对老师最好的回报。'
},
{
  id: 'zhengzheng_49',
  title: '【调皮鬼正正】第四十九集：欺负新来的小朋友',
  category: '成长',
  content: '班里来了一个新小朋友，叫豆豆。豆豆刚来，什么都不熟悉，很害羞，一个人坐在角落里。\n\n正正不但不欢迎豆豆，还带头欺负他。"新来的什么都不会！"正正抢豆豆的橡皮，藏豆豆的书，还不让豆豆一起玩游戏。\n\n豆豆本来就害怕陌生环境，被正正这么一欺负，更难过了。他一个人躲在角落里，好几次都想哭。\n\n有一天，李老师给大家讲了一个故事："想象一下，如果你转到了一个新幼儿园，谁都不认识，你会是什么感觉？如果新同学都欺负你、不跟你玩，你会多难过？"\n\n正正想了想——如果是自己一个人去陌生的地方，谁都不认识，还被欺负……那太可怕了，太孤单了。\n\n正正看了看角落里孤零零的豆豆。他想起自己刚上幼儿园时，也是又害怕又想家。\n\n正正走到豆豆身边："豆豆，对不起，我不该欺负你。我们一起玩吧？"\n\n正正把豆豆拉进了游戏里，教他玩滑梯，带他认识班里的小朋友，还把自己的玩具分给豆豆玩。\n\n豆豆慢慢地不害羞了，脸上有了笑容。他悄悄跟正正说："谢谢你，正正。你是我在这里第一个朋友。"\n\n正正心里暖暖的。原来帮助别人、欢迎新朋友，这么让人开心。\n\n后来又有新小朋友来，正正总是第一个跑过去："你好！我叫正正！我带你熟悉这里！"他成了班里最热情的"小主人"。\n\n从那以后，正正明白了：新来的人最需要温暖和帮助。欺负别人只会让人难过，而友善待人，能收获真正的友谊。'
},
{

  category: '成长',
  content: '日子一天天过去，正正变了好多好多。\n\n他不再乱涂胶水、不再抢玩具、不再撒谎、不再嘲笑别人、不再乱丢垃圾……那些以前让老师头疼、让小朋友讨厌的坏毛病，正正一个一个都改掉了。\n\n这天，幼儿园要评选"进步之星"。李老师站在台上说："这学期进步最大的小朋友是——正正！"\n\n全班响起了热烈的掌声。正正简直不敢相信自己的耳朵——他以前可是有名的"调皮大王"呀！\n\n李老师说："正正刚来的时候，确实很调皮，犯了很多错。但是他每一次犯错以后都认真改正，越变越好。现在的正正，会排队、会分享、会帮助新同学、会尊重老师，还成了我们班的小小安全员。这就是最了不起的进步！"\n\n正正走上台，胸前戴上了闪闪发亮的"进步之星"奖章。\n\n放学后，正正把奖章给妈妈看："妈妈！我得了进步之星！"\n\n妈妈又惊又喜，把正正抱了起来："我们正正真的长大了！妈妈为你骄傲！"\n\n正正想起了这段时间——因为犯错被老师批评过，被妈妈打过屁股，也哭过、后悔过。但正是这些，让他明白了什么该做、什么不该做。\n\n"妈妈，"正正认真地说，"我以后还会调皮吗？"\n\n妈妈笑了："也许还会犯一些小错误，因为你还是个孩子嘛。但没关系，只要你像现在这样，犯了错就改，你就会一直进步。"\n\n正正用力点头。他把"进步之星"奖章挂在了床头，每天睡觉前看一看。\n\n第二天，一个新来的小朋友怯生生地站在门口。正正第一个跑过去，笑着伸出手："你好！我叫正正！欢迎来到我们班！以后我们就是好朋友啦！"\n\n阳光照进教室，正正的笑容特别灿烂。那个曾经的"调皮大王",如今成了大家心里的好榜样。'

  title: '【调皮鬼正正】第五十三集：把虫子放进女同学书包',
  category: '成长',
  content: '早上来幼儿园的路上，正正在花坛边发现了一条绿色的毛毛虫。毛毛虫软软的，一拱一拱地爬。\n\n"好玩！"正正把毛毛虫捏起来装进了口袋里。\n\n到了教室，正正一直憋着坏笑。他趁小美去上厕所的时候，偷偷把毛毛虫放进了小美的书包里。\n\n然后他假装什么都没发生，坐在自己的位子上等着看好戏。\n\n第二节课，李老师让大家拿出画画本。小美打开书包——\n\n"啊啊啊啊啊！！虫子！！有虫子！！"\n\n小美吓得把书包扔到了地上，哭着跳到了椅子上。旁边的小朋友也吓得尖叫。教室里一片混乱。\n\n正正在后面笑得肚子疼。\n\n可是他没注意到——毛毛虫从书包里爬出来了，正好爬到了正正的脚边。"嗯？"正正低头一看，毛毛虫正往他裤腿里爬！\n\n"啊啊啊——！！"正正也尖叫了起来，蹦起来拼命甩腿。\n\n全班都看着正正又蹦又跳的样子。李老师把毛毛虫拿走了，然后看着正正说："虫子是你放进去的吧？"\n\n正正不说话了。小美还在哭。\n\n"正正，你自己被虫子爬了也很害怕对不对？那你想想小美刚才多害怕。你把快乐建立在别人的恐惧上，这对吗？"李老师的话轻轻的但很有分量。\n\n正正摇了摇头。\n\n放学妈妈来了。这次李老师当面说的。妈妈脸上笑容消失了。\n\n车上妈妈一句话没说。正正知道，妈妈不说话比说话更可怕。\n\n到家后——"啪！"\n\n"虫子放人家书包里！你是男子汉吗？欺负女同学算什么本事！"\n\n"妈妈我错了，我以后不吓唬人了……"\n\n"明天当面给小美道歉。如果再有一次，一个星期不许看动画片。"\n\n正正认真地点了点头。这次他是真的后悔了——因为虫子爬自己身上的感觉，确实太吓人了。'
},
{
  id: 'zhengzheng_54',
  title: '【调皮鬼正正】第五十四集：滑梯上的"国王"',
  category: '成长',
  content: '幼儿园的大滑梯是小朋友们最喜欢的地方。每到户外活动时间，大家都排着队等着滑。\n\n可是今天，正正爬到了滑梯最上面，一屁股坐在那里不肯滑下去。\n\n"我是国王！这是我的城堡！谁都不许上来！"正正双手叉腰，得意极了。\n\n后面排队的小朋友急了："正正你快滑呀！我们也要玩！"\n\n"不行！国王说了不准。哈哈哈！"正正就是不动。\n\n小朋友们在下面干着急。有的都快哭了——户外时间就半个小时，正正占着滑梯，别人一次都玩不到。\n\n李老师走了过来："正正，下来。"\n\n"我是国王，国王不用听话！"正正嬉皮笑脸。\n\n李老师的脸严肃了："正正，我数三下。一、二……"\n\n正正知道数到三就麻烦了。他磨磨蹭蹭地滑了下来。\n\n"过来站好。"李老师把正正叫到一边。"滑梯是大家的，不是你一个人的。你霸占了滑梯，其他二十个小朋友都玩不到，你觉得公平吗？"\n\n正正不说话，低着头踢地上的小石子。\n\n"从现在开始到放学，你不能玩任何户外设施。看着别人玩。"\n\n正正的眼泪在眼眶里转。他只能站在旁边看着别的小朋友开心地滑滑梯、荡秋千。好羡慕啊。\n\n放学后妈妈知道了这件事，回家后也很生气。\n\n"你一个人霸着不让别人玩，这叫自私！你愿意别人也这样对你吗？"\n\n"不愿意……"\n\n"啪！"屁股又红了。\n\n"记住，好东西要一起分享。你想当国王可以在家里当，但不能欺负小朋友。懂了吗？"\n\n"懂了……呜呜呜……"\n\n第二天，正正乖乖排队等滑梯。轮到他的时候他很快滑下来，让后面的小朋友也能玩。\n\n李老师看到了，朝他竖了个大拇指。正正虽然没说话，但心里好开心——原来遵守规则也能得到表扬。'
},
{
  id: 'zhengzheng_55',
  title: '【调皮鬼正正】第五十五集：厕所里的泡泡',
  category: '成长',
  content: '正正上厕所的时候发现洗手液的瓶子可以挤出好多泡泡。他按了一下——"噗"，好大一坨白泡泡。\n\n正正的眼睛亮了。他开始疯狂地按洗手液——噗、噗、噗、噗噗噗！泡泡越来越多，水池里全是白花花的泡沫，溢出来流到了地上。\n\n正正还觉得不够。他把泡泡抹在了镜子上，在镜子上画了一个大鬼脸。然后又把泡泡涂在了门把手上——滑溜溜的，谁一开门手就打滑。\n\n正正干完坏事洗了个手就出去了，心里偷偷乐。\n\n过了一会儿，乐乐去上厕所。一开门——手一滑，脚又踩到了地上的泡泡水，"哗！"整个人滑倒在地上。\n\n"哇——"乐乐疼得大哭。\n\n李老师赶紧跑过来把乐乐扶起来。乐乐的胳膊肘蹭破了皮，流了一点血。\n\n李老师看了看厕所里的泡泡，镜子上的鬼脸——不用猜就知道是谁干的。\n\n"正正！过来！"\n\n正正知道这次闯大祸了。他看到乐乐的胳膊上贴了创可贴，心里有点慌。\n\n"乐乐摔伤了。是因为你把泡泡弄到了地上。"李老师很严肃，"这不是好玩的事，这是危险的事。如果乐乐摔的是脑袋怎么办？"\n\n正正张了张嘴，说不出话来。他……真的没想到会有人摔倒受伤。\n\n李老师让正正把厕所打扫干净。正正拿着拖把拖了好久好久，把地上的泡泡水全部擦干净了。\n\n放学后，妈妈看到老师的微信消息——照片里是乐乐受伤的胳膊。\n\n妈妈回到家二话不说——"啪！啪！啪！"这次是三下。\n\n"你闹出来的事害人家小朋友受伤了！你觉得好玩是不是？乐乐疼不疼？人家妈妈心不心疼？"\n\n正正哭得上气不接下气："我没想到会摔倒……我以后不玩洗手液了……"\n\n"明天给乐乐道歉，带上你的奥特曼贴纸送给他。"\n\n正正含着眼泪点头。他最喜欢的奥特曼贴纸要送出去了，可是想到乐乐的伤……正正觉得自己确实应该。'
},
{
  id: 'zhengzheng_56',
  title: '【调皮鬼正正】第五十六集：抢了别人的玩具',
  category: '成长',
  content: '今天是"带玩具来幼儿园"的日子。每个小朋友可以从家里带一个最喜欢的玩具来分享。\n\n小胖带了一辆超酷的遥控赛车——红色的，会发光，还会"滴滴"响。正正看到了，眼睛都直了。\n\n"小胖，让我玩一下。"\n\n"等我玩完了再给你。"小胖正玩得开心。\n\n可是正正等不及了。趁小胖去喝水的时候，正正一把抢过了遥控器，操控着赛车到处跑。\n\n"那是我的！还给我！"小胖回来发现车被抢了，追着正正跑。\n\n正正一边跑一边玩遥控器，赛车在地上"嗖嗖"地开。他一个不注意——遥控车撞到了桌子腿上，"咔嚓"——车头掉了一块。\n\n小胖看到自己心爱的赛车坏了，"哇——"大哭起来。那是爸爸送他的生日礼物。\n\n正正愣住了。他低头看着坏掉的赛车，手里还握着遥控器。\n\n李老师走过来，看了看地上的车，又看了看正正。她没有大声批评，而是把正正拉到一边，蹲下来轻轻说：\n\n"正正，那辆车是小胖的宝贝，就像你的奥特曼一样重要。如果别人抢了你的奥特曼还弄坏了，你什么感觉？"\n\n正正想了想自己心爱的奥特曼如果被别人摔坏了……他的鼻子一酸。\n\n"我……我不应该抢的。"\n\n"去跟小胖说对不起。"\n\n正正走到还在哭的小胖面前："对不起小胖……我不该抢你的车。"\n\n放学后妈妈知道了，很生气："人家的东西你抢，还弄坏了！"\n\n"啪！"\n\n"妈妈给你买了那么多玩具，你为什么还要抢别人的？"\n\n"我……我就是觉得他的好看……"\n\n"觉得好看就可以抢吗？想玩就好好说，人家不给你就等着。别人的东西，没有允许不能动！听到了吗？"\n\n"听到了……"\n\n周末，妈妈带着正正去玩具店，让正正用自己的零花钱买了一辆新遥控车。星期一，正正把新车送给了小胖。\n\n"这个送你，赔你的车。"正正红着脸说。\n\n小胖开心极了，他们又变回了好朋友。正正心里想：想玩别人的东西，以后好好说，借着玩就行了，干嘛要抢呢。'
},
{
  id: 'zhengzheng_57',
  title: '【调皮鬼正正】第五十七集：给老师起外号',
  category: '成长',
  content: '李老师今天戴了一副新眼镜，圆圆的，大大的。正正觉得好好笑——李老师戴上眼镜像猫头鹰。\n\n下课的时候，正正跟几个小朋友小声说："你们看，李老师像不像猫头鹰？以后我们叫她\'猫头鹰老师\'！哈哈哈！"\n\n几个小男生跟着笑了起来。\n\n午饭的时候，正正故意大声对旁边的人说："猫头鹰老师今天做的手工好难啊。"说完哈哈笑。\n\n旁边的小朋友也笑了。\n\n李老师听到了。她没有生气，但是她放下了筷子，安静地看了正正一眼。\n\n下午放学前，李老师把正正单独留了下来。\n\n"正正，你今天叫我什么？"\n\n正正低下了头："猫头鹰……老师……"\n\n"你觉得好笑对不对？"李老师的声音很平静，"如果有人给你起个外号，天天叫你，你开心吗？"\n\n正正想了想。之前有人叫他"正正歪歪"他就很生气。\n\n"不……不开心。"\n\n"每个人都不喜欢被叫外号。老师也是人，老师也有感受。你让其他小朋友都跟着叫，老师心里其实很难过。"\n\n正正抬头看了一眼李老师——她的眼睛有一点点红。正正第一次意识到，老师也会难过。\n\n"对不起李老师……我不该给你起外号。"\n\n李老师摸了摸正正的头："知道错了就好。以后叫人要用正式的名字，这是尊重。"\n\n回家后正正自己跟妈妈说了这件事。妈妈没有打他，但是很认真地说：\n\n"正正，你知道为什么妈妈给你取名叫\'正正\'吗？就是希望你做一个堂堂正正的人。堂堂正正的人，不在背后取笑别人。"\n\n正正点了点头，虽然这次屁股没挨打，但妈妈说的话让他心里比挨打还不好受。\n\n第二天，正正进教室后走到李老师面前，大声说："李老师早上好！你今天的眼镜很好看！"\n\n李老师笑了，弯下腰亲了一下正正的额头。'
},
{
  id: 'zhengzheng_58',
  title: '【调皮鬼正正】第五十八集：把小椅子当战车',
  category: '成长',
  content: '今天下雨了，不能出去玩。小朋友们在教室里自由活动。\n\n正正闲不住啊。他把自己的小椅子翻过来，四条腿朝上，然后坐在椅子背上——"我是坦克兵！冲啊！"\n\n正正用脚蹬着地面，让翻过来的椅子在教室里滑来滑去。"突突突——！开炮！"\n\n旁边几个小男生看了觉得好玩，也翻了椅子跟着滑。教室里"哗啦哗啦"的，椅子到处乱跑。\n\n"撞上了！哈哈哈！"正正的"坦克"撞到了另一个小朋友的"坦克"。\n\n可是接下来——正正的椅子撞到了角落的书架。"哗啦——！"书架上的绘本和积木盒子全掉了下来，散了一地。一盒积木"噼里啪啦"撒了满教室。\n\n更糟糕的是，有一块积木弹起来打到了坐在旁边安静看书的小雨脸上。小雨"哇"地哭了，脸上红了一块。\n\n李老师飞快地跑过来。她先检查了小雨的脸，然后转向正正。\n\n"所有人！把椅子放好！"李老师第一次提高了声音。\n\n教室里瞬间安静了。所有小男生乖乖把椅子翻回来放好。\n\n"正正，你带的头对不对？"\n\n正正点了点头。\n\n"椅子是坐的，不是当玩具的。教室是学习的地方，不是赛车场。你看看，书架倒了，积木撒了，小雨还被打到了脸。"\n\n正正看了看地上的一片狼藉，又看了看小雨脸上的红印子，不说话了。\n\n"你来收拾。所有掉下来的书和积木，你一个人收拾干净。"\n\n正正蹲在地上捡了半个多小时，捡得腰都酸了。积木一颗一颗捡回盒子里，书一本一本放回书架。\n\n放学后妈妈听说了。\n\n"在教室里开坦克？你是去上幼儿园还是去打仗？"\n\n"啪！"\n\n"还把人家小朋友脸打了！你看看你一天天的！"\n\n"啪！"\n\n正正哭着认错。那天晚上他的屁股是双倍疼——挨了两巴掌。\n\n可是正正也记住了：教室里不能闹，因为空间小人多，一闹就容易伤到别人。'
},
{
  id: 'zhengzheng_59',
  title: '【调皮鬼正正】第五十九集：不吃蔬菜的正正',
  category: '成长',
  content: '幼儿园的午餐时间到了。今天的菜是：米饭、红烧肉、炒西蓝花、还有紫菜蛋花汤。\n\n正正看到了红烧肉开心得不得了，可是一看到绿绿的西蓝花就皱起了眉头。\n\n"我不要吃这个绿色的树！"正正把西蓝花全部扒到了一边。\n\n李老师走过来："正正，蔬菜也要吃哦，不能只吃肉。"\n\n"不要！难吃！"正正把嘴巴闭得紧紧的。\n\n李老师没有强迫他，说了一句："那好吧，不吃也行。但是下午的小饼干，只有吃了蔬菜的小朋友才能吃。"\n\n正正才不在乎呢。他把红烧肉和米饭吃得干干净净，西蓝花一口没动。\n\n可是下午三点钟——小饼干来了。巧克力味的！正正最爱的！\n\n李老师给每个小朋友发饼干。走到正正面前，停住了："正正，你中午的蔬菜吃了吗？"\n\n正正的脸红了。他摇了摇头。\n\n"那今天没有饼干哦。说好的规则。"\n\n正正看着别的小朋友都在"嘎吱嘎吱"吃饼干，巧克力的香味飘过来。他的口水都快流下来了。可是没有他的份。\n\n正正气鼓鼓的，眼泪差点掉下来。但他知道规则就是规则。\n\n放学后正正闷闷不乐地回了家。妈妈问他今天幼儿园怎么样。\n\n"我没吃到饼干……因为我没吃蔬菜。"正正小声说。\n\n妈妈没有打他，而是说："那今晚我做西蓝花，你要不要试试？妈妈有一个让西蓝花变好吃的魔法。"\n\n晚上妈妈把西蓝花用蒜蓉炒了，还撒了一点点肉松。正正试着吃了一口——"咦？没有那么难吃嘛！"\n\n他又吃了一口。再一口。最后把一整盘都吃完了。\n\n"明天到幼儿园也要吃蔬菜哦。"妈妈说。\n\n"嗯！这样我就能吃到饼干了！"\n\n第二天中午，正正主动把蔬菜吃了。虽然没有妈妈做的好吃，但是忍一忍也吃完了。下午他终于拿到了巧克力饼干——那块饼干，正正觉得比以前吃过的任何一块都香。'
},
{
  id: 'zhengzheng_60',
  title: '【调皮鬼正正】第六十集：往楼下吐口水',
  category: '成长',
  content: '幼儿园的教室在二楼。正正趴在走廊的栏杆上往下看——下面是一楼的操场，有几个小班的小朋友正在做操。\n\n正正的脑子又冒出了坏主意。他"呸——"朝下面吐了一口口水。\n\n口水落在了一楼的地面上。没打到人。正正觉得好刺激，又吐了一口。\n\n这次——口水"啪嗒"正好落在了一个小班小朋友的头顶上。\n\n那个小朋友摸了摸头："什么东西？"抬头一看，正正在二楼朝下面嘻嘻笑。\n\n"老师！楼上有人吐口水！"小班的老师抬头看到了正正。\n\n五分钟后李老师把正正拎到了办公室。\n\n"正正，你在做什么？！"这是李老师第一次真的发了火。\n\n正正缩着脖子不敢说话。\n\n"从楼上往下吐口水！如果是石头呢？如果砸到小朋友的眼睛呢？高空抛物有多危险你知道吗？而且——"李老师深吸了一口气，"吐口水到别人身上，这是非常非常不尊重人的行为。你愿意别人往你头上吐口水吗？"\n\n"不……不愿意……"正正低着头，声音像蚊子一样小。\n\n"这件事非常严重。我要告诉你妈妈，你也要去给小班那个小朋友道歉。"\n\n正正被带到一楼，对着那个小朋友鞠了一个九十度的躬："对不起，我不该吐口水，我错了。"\n\n那个小朋友还太小不太懂，只是瞪着大眼睛看着正正。\n\n放学后妈妈来了。李老师说完情况后妈妈的脸色铁青。\n\n回到家——这次不是"啪"了。妈妈拿了一根小尺子。\n\n"啪啪啪！"打了三下手心。\n\n"往人头上吐口水！你是怎么想的？！猪都不这么做！"妈妈气得声音都发抖了。\n\n正正哭得稀里哗啦："我再也不了！我再也不了！"\n\n"罚你一个星期不能吃零食。如果再有这种事，送你去爷爷家待一个月，不许回来。"\n\n正正被吓住了。从那以后他再也没有在楼上乱扔过任何东西——他终于明白了，有些"好玩"的事情其实非常危险，也非常不礼貌。'
},
{
  id: 'zhengzheng_61',
  title: '【调皮鬼正正】第六十一集：撒谎的代价',
  category: '成长',
  content: '今天手工课，李老师让大家用黏土做小动物。每个小朋友的桌上都有一盒彩色黏土。\n\n正正做了一个大恐龙——可是他把自己的黄色黏土用完了，恐龙的肚子还没做好。他看了看旁边的小雨，小雨的黄色黏土还有好多。\n\n"小雨，借我一点黄色的。"\n\n"不行，我待会要做长颈鹿呢。"\n\n正正生气了。等小雨去上厕所的时候，他偷偷拿了小雨的黄色黏土，全部揉进了自己的恐龙里。\n\n小雨回来发现黏土少了："我的黄色呢？"\n\n她看了看正正桌上那个格外大的黄色恐龙肚子……"正正！你拿了我的！"\n\n"我没有！这是我自己的！"正正矢口否认。\n\n小雨去找了李老师。李老师走过来，拿起正正剩下的黏土盒一看——黄色的格子空了，但旁边的颜色都还在。如果是自己用完的，应该是做恐龙时各种颜色都会用一些。而且正正的恐龙肚子明显比正常的大了一倍。\n\n"正正，看着老师的眼睛。你拿了小雨的黏土吗？"\n\n"没……没有……"正正躲开了老师的目光。\n\n"真的没有？"\n\n"真的……"\n\n李老师叹了口气。她拿来了教室的监控录像回放给正正看。画面里，正正清清楚楚地从小雨桌上拿走了黏土。\n\n正正的脸"唰"地红了，恨不得找个地洞钻进去。\n\n"正正，偷拿东西已经不对了。但更不对的是撒谎。做错了事可以改，但撒谎了，以后别人怎么相信你说的话？"\n\n正正哭了出来。不是因为怕被打，而是因为他觉得丢脸极了。\n\n放学后妈妈来了。李老师这次没有当面说，而是单独发了消息。\n\n回家后妈妈让正正坐在沙发上，很认真地对他说："正正，妈妈可以接受你犯错，但是不能接受你撒谎。你做了错事告诉妈妈，妈妈虽然会批评你但不会那么生气。可你要是撒谎被拆穿了——"\n\n"啪！"手心一下。\n\n"这一下是罚你拿别人东西。"\n\n"啪！"又一下。\n\n"这一下是罚你撒谎。你记住，做人第一条就是诚实。"\n\n正正含着泪使劲点头。从那以后，不管做了什么错事，他都不撒谎了——虽然老实交代也会被骂，但至少不用再挨双倍的罚了。'
},
{
  id: 'zhengzheng_62',
  title: '【调皮鬼正正】第六十二集：用积木打人',
  category: '成长',
  content: '搭积木的时候，正正搭了一座好高好高的城堡。他得意极了，站起来炫耀："你们看！我的城堡最高！"\n\n可是旁边的乐乐也搭了一座很高的——比正正的还高一点点。\n\n"我的比你高！"乐乐开心地说。\n\n正正不服气。他瞪了乐乐一眼，然后——伸出手把乐乐的积木城堡推倒了！"哗啦！"积木散了一地。\n\n"你！你干嘛！！"乐乐气哭了，"我搭了好久的！"\n\n乐乐推了正正一把。正正更生气了——他拿起一块方方的积木朝乐乐扔过去。\n\n"咚！"积木打中了乐乐的额头。\n\n乐乐愣了一下，然后"哇——"大哭起来。额头上红了一块，鼓起了一个小包。\n\n教室里一下子安静了。所有小朋友都看着正正。李老师立刻跑过来。\n\n"发生什么了？"李老师检查乐乐的额头，红肿了一块。她先带乐乐去校医那里冰敷，然后回来处理正正。\n\n"正正，你为什么拿积木打人？"\n\n"他……他的比我高，我不高兴……"\n\n"因为别人比你做得好，你就动手打人？正正你想想，如果有人因为嫉妒你拿石头砸你，你怎么想？"\n\n正正不说话了。他看了看乐乐额头上的包，心里有点害怕也有点后悔。\n\n李老师的语气很严厉："正正，动手打人是最最不可以做的事。不管有多大的矛盾，都不可以打人。你这次的行为让老师非常非常失望。今天的所有活动你都不能参加，你坐在位子上反省。"\n\n正正一个人坐了一整个下午。旁边的小朋友唱歌他不能唱，做游戏他不能玩。好孤单好难受。\n\n放学后妈妈来了。一看到乐乐妈妈抱着冰袋敷头的乐乐——妈妈的脸白了。\n\n她先跟乐乐妈妈道了歉，回到家后关上门——\n\n"啪！啪！啪！啪！"四下。这是正正记忆中挨得最多的一次。\n\n"打人！你竟然打人！用积木砸人脑袋！万一砸到眼睛怎么办！"妈妈气得手都在抖。\n\n正正哭得说不出完整的话："我……我再也……不打人了……"\n\n"记住，不管多生气，手不能动。嘴巴说不过可以找老师。但是手——永远不可以伸。"\n\n这一天正正记了很久很久。从此他真的再没动手打过人。就算再生气，也只是跺跺脚或者去一个人待着冷静。'
},
{
  id: 'zhengzheng_63',
  title: '【调皮鬼正正】第六十三集：藏老师的粉笔',
  category: '成长',
  content: '今天早上李老师出去接电话，正正趁老师不在，跑到了讲台上。他看到了粉笔盒——里面装着红色、白色、黄色的粉笔。\n\n正正把所有粉笔偷偷塞进了自己的口袋里。然后他又把黑板擦藏到了窗帘后面。\n\n做完这些正正赶紧溜回了座位，假装什么都没发生。\n\n李老师回来了，准备在黑板上写字教大家认字。她拿起粉笔盒——空的。黑板擦也不见了。\n\n"咦？粉笔呢？"李老师找了一会儿，找不到。\n\n正正在下面偷偷笑。\n\n可是李老师没有生气，她说："好吧，今天不用粉笔了。原来计划今天教大家写自己的名字，这样下周表演的时候大家就能在签名墙上写自己的名字了。不过既然没有粉笔，那就不教了。"\n\n小朋友们发出了失望的声音："啊？不教了？"\n\n"我想写名字！"\n\n"我也想学！"\n\n大家都不开心。几个小朋友看向了正正——因为刚才有人看到正正跑到讲台那边了。\n\n"正正，是不是你？"\n\n正正的脸红了。被全班人盯着的感觉好丢人。他慢慢从口袋里掏出了粉笔，又从窗帘后面拿出了黑板擦。\n\n"对不起李老师……我以为这样很好玩……"\n\n李老师接过粉笔说："正正，你想想——你一个人觉得好玩的事情，让全班二十多个小朋友都学不到东西。一个人的快乐和二十多个人的学习，哪个更重要？"\n\n正正低下了头。他第一次意识到，自己的"好玩"可能会影响到很多很多人。\n\n放学妈妈知道后："你偷老师的教学工具？！你以为这是闹着玩的？"\n\n"啪！"\n\n"所有小朋友都因为你学不了东西。你觉得这样公平吗？"\n\n"不公平……我以后不了……"\n\n"回去写十遍\'我不偷藏别人的东西\'。"\n\n正正回到房间，认认真真地写了十遍。写到手酸——但他把这个教训记住了。'
},
{
  id: 'zhengzheng_64',
  title: '【调皮鬼正正】第六十四集：踩了花坛',
  category: '成长',
  content: '幼儿园门口有一个漂亮的花坛，里面种着五颜六色的小花。那是上个月全班一起种的——每个小朋友种了一棵，还给自己的花挂了名字牌。\n\n今天放学，正正和几个男生在花坛旁边追着玩。跑着跑着，正正一脚踩进了花坛里——"咔嚓"，踩断了一棵小花。\n\n"没事没事，就一棵。"正正没在意，继续跑。\n\n可是他跑得太疯了，又踩了一脚——这次踩了两棵。\n\n"正正！你踩到花了！"小美在后面喊。\n\n正正回头看了一眼被踩扁的花——其中一棵上面挂着的牌子写着"小美的花"。\n\n"小美的花……"正正咽了咽口水。\n\n小美跑过来看到自己辛辛苦苦种的花被踩成了泥，"哇"地就哭了。"我的花！我浇了好多天的！它都开花了的！"\n\n这时候李老师出来了。她看着花坛里的脚印——正正的鞋印清清楚楚的。\n\n"正正，你看看你踩坏了谁的花。"\n\n正正蹲下来看那些被踩烂的花苗。其中一棵还能看到断裂前含苞的花骨朵——本来明天就要开的。\n\n"这些花是活的。它们也有生命。你跑来跑去一脚就踩死了。"李老师的话让正正心里不好受。\n\n正正蹲在那里不说话了。他突然觉得那些被踩扁的花好可怜。\n\n"你要补种三棵花，每天负责浇水，直到它们开花为止。"李老师说。\n\n放学后妈妈来了，看到了花坛里的狼藉。\n\n回到家妈妈倒没打他，但让他写了一篇"检讨书"——五岁的检讨书就是画画。正正画了一幅画：一个小人踩到了花上面，花在哭。\n\n第二天开始，正正每天早上早来十分钟浇花。看着新种下的小花苗一天天长大，他心里竟然有一种奇怪的成就感。\n\n一个月后，三棵新花开了。正正高兴地跑去跟李老师报告："老师！我的花开了！"\n\n李老师笑着说："你看，爱护比破坏难多了。但爱护的快乐也比破坏大多了，对不对？"\n\n正正用力点了点头。'

  title: '【调皮鬼正正】第六十五集：排队时推人',
  category: '成长',
  content: '午饭时间到了，小朋友们要排队去食堂。正正站在队伍中间，前面是小明。\n\n正正等得不耐烦了。他伸出手推了小明一下："快走啊！"\n\n小明往前一个踉跄，碰到了前面的人，前面的人又碰到更前面的人——像多米诺骨牌一样，队伍前面好几个小朋友都晃了一下。\n\n最前面的小雨没站稳，"扑通"坐在了地上。\n\n"谁推的！"李老师从后面走过来。\n\n小朋友们都转头看正正。\n\n"正正又推人了！"大家七嘴八舌。\n\n李老师把正正拉出队伍："你到最后面去。"\n\n"可是……我要到最后了就打最后一个菜了……"正正急了，他最喜欢吃第一个端出来的鸡腿。\n\n"对，去最后面。而且以后每次排队你都排最后，直到你能做到不推不挤为止。"\n\n正正不情愿地走到了队伍最后面。等他进食堂的时候，鸡腿已经没了，只剩下了他不太爱吃的鱼。\n\n正正郁闷极了，但又不好意思说什么——毕竟是自己推人在先。\n\n中午回教室，李老师单独找正正谈话："你知道为什么要排队吗？"\n\n"因为……大家一起走比较整齐？"\n\n"不只是整齐。是因为排队的时候，推推挤挤很容易摔倒。摔倒以后后面的人停不住就会踩到前面的人。这很危险。所以排队不能推。"\n\n正正第一次从"安全"的角度想了这件事。\n\n放学回家正正把今天的事说了。妈妈这次没有打他——因为正正是主动说的。\n\n"不打你了。但是你告诉妈妈，你从这件事学到了什么？"\n\n正正想了想说："排队不能推人。不然会像骨牌一样倒。还有……被罚到最后面就吃不到鸡腿了。"\n\n妈妈忍不住笑了："行吧，你这个记忆点也行。"\n\n从那以后正正排队再也不推了。不为别的——他可不想再错过鸡腿了。'

  category: '成长',
  content: '正正昨天在小区里听到了一个大哥哥说了一句脏话。正正觉得那话听起来好"厉害"——大哥哥说完以后别人都不敢惹他了。\n\n今天在幼儿园，正正和乐乐因为抢秋千吵了起来。正正脱口而出："你这个X X X！"（脏话）\n\n周围的小朋友都愣住了。乐乐也愣了。然后好几个小朋友开始学——"X X X！""X X X！"教室里一下子全是这个词。\n\n李老师的脸色变了。她用力拍了两下桌子："安静！谁第一个说的？"\n\n所有人都看向了正正。\n\n李老师把正正叫到了走廊上。这次她不是蹲下来，而是站着，从上往下看着正正。正正知道这意味着老师真的很生气。\n\n"这句话你从哪里学的？"\n\n"小区里一个大哥哥说的……"\n\n"你知道这是脏话吗？"\n\n正正摇摇头又点点头——他其实不太确定意思，只是觉得说出来很"酷"。\n\n"正正，脏话是骂人的话，说脏话不是厉害，是没素质。你知道更糟糕的是什么吗？你一个人说了，其他小朋友跟着学——你带坏了一屋子人。"\n\n正正的脸烧得厉害。他低着头不敢看老师。\n\n"从今天开始，你每天要说十句好听的话才能得到小贴纸。说一句脏话就扣三张贴纸。"\n\n放学后妈妈知道了。这一次妈妈没有立刻动手，而是坐下来问正正：\n\n"你觉得那个大哥哥说脏话很酷对不对？"\n\n正正点头。\n\n"可是你知道吗，说脏话的人在别人心里是什么样的？别人不是怕他，是看不起他。真正厉害的人不需要说脏话别人就尊重他。"\n\n正正想了想，好像确实是——幼儿园里最受欢迎的不是说话凶的人，而是像小明那样会帮助别人的人。\n\n"妈妈，我以后不说了。"\n\n"好。如果妈妈再听到你说脏话——"妈妈竖起手指，"用辣椒水漱口。"\n\n正正吓得吐了吐舌头。从此管住了嘴巴。'

  title: '【调皮鬼正正】第六十七集：浪费粮食',
  category: '成长',
  content: '今天午餐是正正不太喜欢的——米饭配土豆炖牛肉和青菜汤。\n\n正正吃了几口牛肉，觉得米饭没味道。他开始用勺子把米饭一粒一粒弹出去——"弹！弹！弹！"米粒飞到了桌子上、地上、甚至弹到了对面小朋友的碗里。\n\n"好好玩！像放鞭炮！"正正越弹越开心。\n\n旁边的小朋友也开始学，用勺子弹米饭。很快桌面上和地上全是白白的米粒。\n\n李老师走过来了。她没有立刻说话——而是默默地蹲下来，把地上的米粒一粒一粒捡起来。\n\n教室里安静了。所有小朋友都看着老师蹲在地上捡米粒的样子。\n\n李老师捡了好几分钟才把地上的米粒都捡完了。然后她站起来，把那些脏了的米粒放在正正面前。\n\n"正正你数数，地上有多少粒米。"\n\n正正数了数："一、二、三……好多，数不清……"\n\n"大概有一百多粒。你知道一粒米要怎么来吗？农民伯伯要种水稻，要浇水，要施肥，要除草，要等它长大，要收割，要晒干，要碾成白米——一粒米从种下到到你碗里，要花整整半年时间。"\n\n正正不说话了。\n\n"你今天弹掉的这一百多粒米，农民伯伯要干好几天才能种出来。你觉得你弹着玩，对得起种米的人吗？"\n\n正正的眼眶红了。他从来没想过米饭这么来之不易。\n\n"把你碗里剩的饭吃完。以后不许浪费一粒米。"\n\n正正低头把碗里的饭一口一口全吃完了，一粒都没剩。\n\n放学后他跟妈妈说了这件事。妈妈没有打他，而是带他去了超市买了一包米，让他搬回家。\n\n那包米好重啊，正正累得满头汗。\n\n"一包米都这么重，你想想农民伯伯要种多少才能让大家都有饭吃。"\n\n从那以后，正正吃饭再也不浪费了。每次碗里最后一粒米他都会吃干净。'
},
{

  title: '【调皮鬼正正】第六十八集：乱按电梯',
  category: '成长',
  content: '幼儿园组织小朋友去参观科技馆。大家坐电梯上三楼。正正站在电梯按钮旁边——哇，好多好多按钮！\n\n正正的手痒了。"1、2、3、4、5、6——"他把所有楼层的按钮全按了一遍！\n\n电梯门关上了。然后——到了一楼开门。没人下。关门。到了二楼又开门。没人下。关门。到了三楼开门——总算到了，可是又关门，去了四楼……\n\n"正正！你按了什么！"李老师急了。电梯每一层都停，开门关门开门关门，走走停停。\n\n后面排队等电梯的人也急了——他们按了电梯可是电梯每层都停，等了好久都坐不上。\n\n等正正他们从电梯出来的时候，其他等电梯的大人脸色都不太好看。有一个叔叔说："哪个小孩乱按的？太没规矩了。"\n\n李老师尴尬极了。她跟人家道了歉，然后把正正拉到一边。\n\n"正正，电梯不是玩具。你把所有按钮都按了，电梯每层都停，浪费了所有人的时间。而且你知道吗？电梯如果频繁开关门，是有可能出故障的。如果电梯坏了，里面的人被困住了怎么办？"\n\n正正吓了一跳。他从来没想过按按钮会有这么严重的后果。\n\n"今天参观完回去后，你要写一张道歉卡贴在电梯旁边。"\n\n正正参观科技馆的心情全没了。他一直在想着刚才的事。回去后他画了一张卡片：一个电梯和一排按钮，旁边写着（画着）"不要乱按"。\n\n放学妈妈知道后很生气："公共设施是给所有人用的！你乱按影响了多少人？你知不知道丢人？"\n\n"啪！"\n\n"以后坐电梯手给我放好。看到按钮不许碰！到了自己的楼层跟妈妈说，妈妈来按。"\n\n"知道了……"正正低着头。\n\n从那以后坐电梯的时候，正正都把手揣在口袋里。他知道了——按钮不是玩具，公共场所要为别人着想。'
},
{
  id: 'zhengzheng_69',
  title: '【调皮鬼正正】第六十九集：笑话别人尿裤子',
  category: '成长',
  content: '今天上课的时候，小班的一个小弟弟不小心尿裤子了。小弟弟才三岁多，吓得站在那里哭。老师正在帮他换裤子。\n\n正正路过看到了，哈哈大笑起来："哈哈哈！尿裤子了！大宝宝还尿裤子！羞羞羞！"\n\n他还拉了几个同学过来看："你们看！他尿裤子了！"\n\n小弟弟听到了正正的话，哭得更厉害了，小脸涨得通红。他把脸埋在老师怀里不肯抬头。\n\n李老师恰好经过走廊，听到了正正的话。她一步走过来，表情非常严肃：\n\n"正正！过来。"\n\n正正被李老师的语气吓住了，他从来没见老师这么严肃过。\n\n李老师把他带到走廊尽头，蹲下来看着他的眼睛说："正正，你三岁的时候也尿过裤子。你忘了吗？"\n\n正正愣住了——他确实不太记得了，但他知道三岁的时候可能是尿过的。\n\n"每个人都有做不好事情的时候。你笑话别人最丢脸的时刻，等于在别人的伤口上撒盐。那个小弟弟才三岁，他本来就很害怕很难过了，你还笑他——他会记住这件事很久很久的。"\n\n正正低下了头。他想了想如果是自己被一群人围着笑……他的脸也热了。\n\n"去跟那个小弟弟说对不起。然后今天下午，你帮他擦桌子擦椅子，做他的小哥哥。"\n\n正正走到小弟弟面前，轻轻地说："对不起，我不该笑你。我以前也尿过裤子的。没关系的。"\n\n小弟弟抬起头看了看正正，虽然眼睛还红红的，但不哭了。\n\n那天下午正正真的帮小弟弟擦了桌子，还教他叠纸飞机。小弟弟最后笑了，叫他"正正哥哥"。\n\n放学后正正跟妈妈说了今天的事。这次他是自己主动说的。\n\n妈妈摸了摸他的头："你知道错了就好。记住，永远不要笑话别人的困难。今天你帮了那个小弟弟，你做了一件比取笑别人好一百倍的事。妈妈为你后来的表现感到骄傲。"\n\n正正笑了。原来当好人的感觉比当坏蛋舒服多了。'
},

  title: '【调皮鬼正正】第七十集：正正变了',
  category: '成长',
  content: '学期末到了。幼儿园要评"进步之星"——不是给最乖的小朋友，而是给这学期进步最大的。\n\n李老师站在讲台上念名字。正正坐在下面，他觉得肯定没自己的份——这学期他闯的祸太多了，挨了无数次批评，屁股也被打了不知道多少下。\n\n"进步之星——正正！"\n\n"啊？！"正正以为自己听错了。全班小朋友的目光都转向了他。\n\n"正正请上来。"李老师微笑着说。\n\n正正磨磨蹭蹭走上了讲台。李老师给他胸口贴了一朵大大的金色小红花。\n\n"大家可能觉得奇怪，正正这学期犯了很多错。但是老师想说——正正每一次犯错以后，都真的在改。"\n\n李老师开始说："他以前浪费粮食，现在每顿饭碗里干干净净。他以前推人，现在排队不推不挤。他以前取笑别人，现在还帮小班的小弟弟。他以前霸占玩具，现在学会了轮流和分享。"\n\n"犯错不可怕。可怕的是犯了错不改。正正每一次都改了，而且越改越好。这就是进步。"\n\n全班鼓掌了。正正站在讲台上，嘴巴张了张，眼眶竟然红了。\n\n放学后，正正举着金色小红花跑向妈妈："妈妈！！我得了进步之星！！"\n\n妈妈愣了一下，然后笑了，蹲下来紧紧抱住了正正。\n\n"妈妈好开心。你看，你是可以做好的对不对？"\n\n"嗯！"正正用力点头，"妈妈，虽然我还是有点调皮……但我以后会继续努力改的。"\n\n妈妈亲了亲正正的额头："调皮没关系。只要你知道什么该做什么不该做，知道犯了错要改，你就是妈妈最棒的宝贝。"\n\n那天晚上妈妈做了正正最爱吃的红烧排骨。正正吃了三大碗饭，碗里一粒米都没剩。\n\n睡觉前正正把金色小红花贴在了床头。他看着那朵花想：虽然这学期屁股被打了好多次，哭了好多回。但如果没有那些批评和那些"啪啪啪"，他也不会变成现在的正正。\n\n"明天开始新学期了。"正正闭上眼睛，"我……嗯……尽量少挨打吧。"\n\n他翻了个身，嘴角带着小小的微笑睡着了。'
},
{

  title: '【慧慧的中班故事】第一集：慧慧巧记名字',

  content: '新学期，班里来了好多新同学。名字太多了，好多小朋友都记不住谁是谁。\n\n慧慧却有办法。她认真观察每个新同学的特点，然后把名字和特点联系起来记。\n\n爱笑的小朋友叫"乐乐"——她就记"爱笑的乐乐"；个子高的叫"高高"——"个子高高";戴眼镜的叫"明明"——"眼睛亮亮的明明"。\n\n没过几天，慧慧就记住了全班每个同学的名字，还能叫出来。\n\n新同学们都很惊讶："慧慧，你怎么这么快就记住我们的名字啦？"\n\n慧慧笑着说："我把你们的名字和你们的特点联系起来记。比如乐乐爱笑，我就记\'爱笑的乐乐\'。这样就记得又快又牢。"\n\n李老师也夸慧慧："慧慧真会动脑筋，用\'联想\'的方法记名字，又快又准。"\n\n被慧慧准确地叫出名字，新同学们都感到很温暖，很快就跟慧慧成了朋友。\n\n有个新来的小朋友害羞地说："慧慧，你第一个记住我的名字，我好开心。我觉得我在这里有朋友了。"\n\n慧慧还把记名字的方法教给了大家。小朋友们学着用"联想法",也慢慢记住了彼此的名字。班里大家互相叫得出名字，感情更好了。\n\n慧慧告诉大家：记东西不要死记硬背，找到好方法，把要记的东西和熟悉的、有特点的东西联系起来，就能记得又快又牢。而且，记住别人的名字、叫出别人的名字，是对别人的尊重和关心，能让人感到温暖。'
},
{

  content: '夏天，幼儿园门口来了一辆冰淇淋车。小朋友们放学后都想买，排起了长长的队。\n\n太阳好晒，队伍好长，好多小朋友等得不耐烦，开始插队、推挤，队伍乱成一团。\n\n慧慧安安静静地排在队伍里，一步一步往前挪，一点都不急。\n\n前面有个小朋友想插到慧慧前面。慧慧礼貌地说："请到后面排队好吗？大家都在等，插队对后面的人不公平。"\n\n那个小朋友不好意思地到后面排队去了。\n\n有小朋友问慧慧："这么热，你不着急吗？"\n\n慧慧说："着急也没用呀，插队还会引起混乱。大家都排好队，一个一个来，反而更快。你插队、我插队，队伍就乱了，谁也买不成。"\n\n果然，那些插队推挤的地方乱成一团，卖冰淇淋的叔叔都没法好好卖了。而慧慧这边排得整整齐齐的，很快就轮到了。\n\n慧慧买到冰淇淋，心情特别好。她还帮卖冰淇淋的叔叔维持秩序："大家排好队，一个一个来，很快就都能买到啦！"\n\n在慧慧的带动下，混乱的队伍慢慢变得有序了。大家发现，排好队反而买得更快。\n\n李老师听说了，表扬慧慧："慧慧不但自己遵守秩序，还帮助大家维持秩序，真是个懂事的好孩子。"\n\n慧慧告诉大家：排队是一种文明。虽然要等一等，但公平又有序，其实更快。插队、推挤看起来占了便宜，实际上会让队伍更乱，大家都更慢。遵守秩序，人人受益。'

{
  id: 'huihui_3',
  title: '【慧慧的中班故事】第三集：慧慧的分类游戏',
  category: '慧慧',
  content: '李老师把一大盒混在一起的东西倒在桌上——有积木、蜡笔、纽扣、小珠子、贴纸，乱七八糟的。"谁能又快又好地把它们整理好？"\n\n好多小朋友一样一样地拿，拿了这个忘了那个，整理得又慢又乱。\n\n慧慧却想了个好办法。她先准备了几个小盒子，然后说："我们按种类来分！积木放一盒，蜡笔放一盒，纽扣放一盒，珠子放一盒，贴纸放一盒。"\n\n慧慧一边拿一边分类，积木归积木，蜡笔归蜡笔。很快，乱七八糟的东西就被分得整整齐齐，每一盒都是一类东西。\n\n"哇，慧慧整理得又快又整齐！"小朋友们都佩服。\n\n李老师问："慧慧，你为什么整理得这么快？"\n\n慧慧说："因为我先分类呀。把一样的东西放在一起，找起来、用起来都方便。要是全混在一起，就又乱又难找。"\n\n李老师说："这就是\'分类\'的方法！科学家研究东西，图书馆放书，超市摆商品，都用分类。慧慧真会动脑筋。"\n\n慧慧还发现，分类以后好处多多：找东西快，因为知道在哪一类里找;数数也方便，一类一类地数。\n\n她把分类的方法用到了生活里：书包里，书和文具分开放;玩具箱里，不同的玩具分格放;连画画的蜡笔，她都按颜色排好。\n\n慧慧告诉大家：分类是个好方法。把同一类的东西放在一起，不管是整理、寻找还是数数，都会变得又快又方便。学会分类，能让我们做事更有条理、更有效率。生活中处处都能用到分类的智慧。'

  content: '慧慧喜欢观察天气。每天早上，她都会看看天空——今天是晴天、阴天，还是要下雨。\n\n有一天早上，慧慧发现天空乌云密布，空气闷闷的，蜻蜓飞得很低，蚂蚁在搬家。\n\n"这些都是要下雨的信号！"慧慧想起了自己观察和看书学到的知识。\n\n她提醒李老师："李老师，今天可能要下雨，我们户外活动是不是带上伞，或者早点回教室？"\n\n李老师看了看天，觉得慧慧说得有道理。果然，户外活动刚结束，大雨就哗啦啦地下起来了。因为提前有准备，小朋友们都没被淋到。\n\n"多亏了慧慧的提醒！"李老师表扬她，"慧慧真会观察天气。"\n\n慧慧还给大家分享了她的天气小知识："燕子低飞、蚂蚁搬家、蜻蜓贴地飞，是要下雨了。""早上天边红彤彤的，可能有雨；晚上天边红，第二天多是好天气。""天上鱼鳞斑一样的云，多半是好天气。"\n\n小朋友们听得津津有味，也开始学着观察天气。\n\n慧慧每天还会根据天气提醒大家穿什么衣服："今天降温了，要多穿一件。""今天出太阳了，可以少穿点。"\n\n慢慢地，慧慧成了班里的"小小天气预报员"。大家都爱听她说天气。\n\n李老师说："慧慧通过观察大自然，学到了这么多知识，还能用来帮助大家，真了不起。大自然就是一本读不完的书。"\n\n慧慧告诉大家：大自然里藏着好多知识和规律。只要用心观察天空、云彩、小动物，就能发现天气的秘密。多观察、多思考、多积累，你懂得的就会越来越多。留心生活，处处都有学问。'
},

  category: '慧慧',
  content: '学校门口有个小摊，卖各种花花绿绿的小玩具、小零食。好多小朋友一有零花钱就去买，买回来的小玩具没玩几下就坏了，零食吃了对牙齿也不好。\n\n慧慧路过的时候，也很想买。那些小玩具看着真好看。但她停下来想了想："这个玩具看着好看，但是很容易坏，买回去玩两下就扔了，是不是浪费钱呢？"\n\n慧慧摸了摸口袋里的零花钱，决定不买那些没用的小玩意。\n\n有小朋友问："慧慧，你不买吗？这个多好玩呀。"\n\n慧慧说："我觉得这些玩具不结实，玩两下就坏了，买了浪费。我想把钱存起来，买真正有用、能玩很久的东西。"\n\n果然，那些买了小摊玩具的小朋友，没过几天玩具就坏了，钱也白花了。零食吃多了，还有小朋友蛀了牙。\n\n而慧慧把钱存起来，后来买了一套能拼很多花样的积木，玩了很久很久都不腻，特别值。\n\n李老师说："慧慧买东西前会想一想值不值、有没有用，这叫理性消费。不乱花钱，把钱花在真正有用的东西上，是很聪明的。"\n\n慧慧还学会了分辨：结实耐用的东西值得买；一玩就坏的、吃了不健康的，就不买。\n\n在慧慧的影响下，小朋友们也不那么乱买小摊上的东西了。\n\n慧慧告诉大家：花钱之前先想一想——这个东西有用吗？结实吗？值不值？不要看到什么就想买什么。把钱花在真正有用的东西上，才不浪费。学会理性地花钱，是一个很重要的本领。'

  content: '课间，几个小朋友围在一起说悄悄话。原来是有人说乐乐的坏话："乐乐昨天尿裤子了，真丢人！"这话一个传一个，越传越广。\n\n有个小朋友跑来跟慧慧说："慧慧，你知道吗？乐乐昨天尿裤子了！你快去告诉别人！"\n\n慧慧摇摇头："这样的话，我不传。乐乐不小心尿裤子，他自己已经很难为情了。我们到处说，会让他更难过的。"\n\n那个小朋友愣住了："可是……大家都在说呀。"\n\n慧慧说："大家说不代表就是对的。传别人的糗事、说别人的坏话，会伤害别人。如果是我们自己不小心尿了裤子，被大家到处传，我们会多难过呀？"\n\n那个小朋友想了想，觉得慧慧说得对，也不好意思再传了。\n\n慧慧还去安慰乐乐："乐乐，别难过。谁小时候没尿过裤子呀，这没什么。下次想上厕所早点说就好了。"\n\n乐乐感激地看着慧慧："谢谢你慧慧，别人都笑我，就你安慰我。"\n\n慧慧还悄悄劝那些传闲话的小朋友："我们别说乐乐了，他已经很难过了。将心比心，如果是自己被这样传，多难受呀。"\n\n慢慢地，传闲话的人少了，大家也不再提乐乐尿裤子的事了。乐乐又开心起来。\n\n李老师知道后，表扬慧慧："慧慧不传闲话、不说人坏话，还维护受伤害的同学，心地真善良。"\n\n慧慧告诉大家：不要传别人的闲话、糗事、坏话。这些话传来传去，会深深地伤害别人。当别人已经很难过的时候，我们应该去安慰他、维护他，而不是跟着议论。管住自己的嘴，多说温暖的话，少说伤人的话。善良的人，不会在别人的伤口上撒盐。'
},
{

  title: '【慧慧的中班故事】第十五集：慧慧的小闹钟',
  category: '慧慧',
  content: '慧慧发现，班里好多小朋友早上总是迟到，因为起不来床、磨磨蹭蹭。\n\n慧慧从来不迟到。她有一个自己的小妙招。\n\n小朋友问："慧慧，你怎么每天都能早早到，不迟到呀？"\n\n慧慧说："我有一个小闹钟，还有一套\'早起小步骤\'。晚上我早点睡觉，睡够了早上自然就醒了。闹钟一响我就起床，不赖床。然后按顺序：刷牙、洗脸、穿衣、吃早饭。每样事情我都不磨蹭，很快就准备好了。"\n\n慧慧还说："我头天晚上就把第二天要穿的衣服、要带的东西准备好，放在床边。早上起来直接穿、直接拿，不用手忙脚乱地找，就快多了。"\n\n李老师听了，觉得慧慧的方法真好，就请慧慧给大家分享。\n\n慧慧教大家："早睡早起，睡够了才起得来;闹钟响了马上起，不赖床;头天晚上准备好第二天的东西;做事情按顺序、不磨蹭。这样就不会迟到啦。"\n\n小朋友们学着慧慧的方法，慢慢地，迟到的少了。乐乐以前天天迟到，学了慧慧的方法后，居然也能准时到了。\n\n李老师表扬慧慧："慧慧不但自己守时，还把好方法教给大家，帮助全班都养成了不迟到的好习惯。"\n\n慧慧说："守时是一种好习惯，也是尊重别人。上学不迟到，跟人约会不迟到，才不会耽误事、不会让人等。"\n\n慧慧告诉大家：不迟到、守时间，靠的是好习惯——早睡早起、不赖床、不磨蹭、提前准备。养成这些好习惯，你会发现每天的生活都从从容容、井井有条。守时的人，做事更靠谱，也更受人信赖。'
},
{
  id: 'huihui_16',
  title: '【慧慧的中班故事】第十六集：慧慧爱护小鸟',
  category: '慧慧',
  content: '有一天，慧慧在幼儿园的树下发现了一只小鸟。小鸟从鸟窝里掉了下来，翅膀受了伤，飞不起来，在地上扑腾，叽叽地叫，好可怜。\n\n几个小朋友围过来，有的想抓小鸟玩，有的想拿石头吓它。\n\n慧慧赶紧拦住大家："别吓它！小鸟受伤了，很害怕，我们要帮助它，不能伤害它。"\n\n慧慧轻轻地、慢慢地靠近小鸟，用双手小心地把它捧起来。小鸟一开始很害怕，但慧慧的手很温柔，慢慢地它不那么抖了。\n\n慧慧找来一个小盒子，铺上柔软的纸和棉花，把小鸟放进去，还找了点水和小虫子喂它。\n\n"我们要照顾它，等它的伤好了，再放它回大自然。"慧慧说。\n\n慧慧带着小朋友们一起照顾小鸟。每天喂食、喂水，还轻声跟小鸟说话。李老师也帮忙请了懂鸟的人来看小鸟的伤。\n\n过了些天，小鸟的翅膀好了，能扑腾着飞了。\n\n"该放它回家了。"慧慧说，"它属于蓝天，不属于盒子。"\n\n慧慧带着大家来到户外，轻轻打开盒子。小鸟扑扇着翅膀，飞了起来，在天空盘旋了一圈，好像在跟大家道别，然后飞向了远方。\n\n"再见，小鸟！"小朋友们开心地挥手。\n\n李老师说："慧慧不但救助了小鸟，还懂得把它放归大自然。爱护小动物、尊重生命，慧慧做得真好。"\n\n慧慧告诉大家：小动物也是有生命的，会疼、会害怕。我们要爱护它们，不能伤害、欺负它们。遇到受伤的小动物，可以帮助它、照顾它。但是野生动物属于大自然，等它好了要放它回家，还它自由。尊重和爱护每一个小生命，是一颗善良的心最美好的样子。'
},
{
  id: 'huihui_17',
  title: '【慧慧的中班故事】第十七集：慧慧数星星的办法',
  category: '慧慧',
  content: '晚上，幼儿园组织了一次亲子观星活动。小朋友们和爸爸妈妈一起看星星。\n\n天上的星星好多好多，数也数不清。有的小朋友数着数着就乱了："一、二、三……哎呀，数到哪了？"\n\n慧慧有办法。她说："星星太多，一颗一颗乱数会乱。我们可以把天空分成几块，一块一块地数，数完这块再数那块，就不会乱了。"\n\n她还发现了一个更好玩的："你们看，有几颗星星连起来，像一个大勺子！"那是北斗七星。\n\n慧慧指给大家看："这七颗亮亮的星星连起来，像一把勺子。找到它，顺着勺子口的方向，能找到北边呢。古时候的人在晚上就靠它辨认方向。"\n\n小朋友们都惊叹极了，原来星星还能指方向！\n\n慧慧还认识几个星座，讲给大家听。爸爸妈妈们也很惊讶，慧慧懂得这么多。\n\n慧慧说："这些都是我从书上看来的，还有爸爸教我的。多看书、多问、多观察，就懂得多了。"\n\n那天晚上，小朋友们不但学会了分区数星星，还认识了北斗七星，知道了星星能指方向。大家看着满天繁星，觉得又神奇又美丽。\n\n李老师说："慧慧把数星星变成了学知识。她爱观察、爱学习、爱思考，把看星星这件事变得又好玩又有意义。"\n\n慧慧告诉大家：面对好多好多、数不清的东西，可以分块、分类地数，就不会乱。而且，天上的星星、地上的万物，都藏着知识和奥秘。多看书、多观察、多提问，你就能懂得越来越多。保持一颗爱学习、爱探索的心，整个世界都是你的课堂。'

{

  category: '慧慧',
  content: '幼儿园举办折纸比赛，要折一只千纸鹤。千纸鹤有点难折，好多小朋友折了一半就折错了，一失败就灰心，把纸一扔不折了："太难了，我不折了！"\n\n慧慧也折错了好几次。第一次，翅膀折歪了；第二次，头折反了；第三次，纸都折破了。\n\n但是慧慧没有放弃。她每失败一次，就想一想："这次哪里错了？"然后改正，再折一次。\n\n折错了，她不灰心，笑着说："没关系，再来一次！失败一次，我就知道了一个不对的方法，离成功更近了。"\n\n慧慧一次又一次地折，越折越熟练。终于，一只漂亮的千纸鹤折出来了！翅膀、头、尾巴，都折得整整齐齐。\n\n"我折出来啦！"慧慧特别开心。\n\n小朋友们都很佩服："慧慧，你折错了那么多次，怎么不灰心呀？"\n\n慧慧说："失败没什么可怕的。爱迪生发明电灯，失败了好多好多次才成功呢。每一次失败，都让我知道了一个不对的方法，这样我就能越来越接近成功。放弃的人才永远学不会。"\n\n慧慧还鼓励那些放弃的小朋友："别灰心，我教你们。折错了不要紧，改一改再折。多试几次就会了。"\n\n在慧慧的鼓励下，那些放弃的小朋友重新拿起了纸。虽然也失败了好几次，但他们坚持下来，最后都折出了千纸鹤。\n\n李老师表扬慧慧："慧慧不怕失败、坚持不懈的精神，值得大家学习。失败是成功之母，只有不怕失败、坚持努力，才能成功。"\n\n慧慧告诉大家：失败一点都不可怕。做事情失败了，不要灰心、不要放弃。想一想哪里错了，改正后再试一次。每一次失败，都是在告诉我们一个不对的方法，让我们离成功更近。坚持下去，不断尝试，就一定能成功。不怕失败、勇于坚持的人，最终会收获成功的喜悦。'
},

{

  title: '【慧慧的中班故事】第二十三集：慧慧巧分蛋糕',
  category: '慧慧',
  content: '今天是小雨的生日，她带来了一个大蛋糕，要分给同一桌的四个小朋友：慧慧、乐乐、壮壮和她自己。\n\n老师把蛋糕切好了，可是切得大小不一样——有的大有的小。小朋友们都想要最大的那块，差点吵起来。\n\n"我要大的！""我先看到的！"\n\n慧慧想了想，说："别吵别吵，我有个公平的办法。"\n\n她把四块蛋糕摆在桌上，说："我们抓阄吧！我用四根小纸条，长的短的都有，谁抽到最长的先挑，第二长的第二个挑，这样最公平。"\n\n大家觉得这个主意好。抓阄以后，按顺序挑蛋糕，谁也没意见了。\n\n可是壮壮抽到了最后一个，只能拿最小的那块，有点不高兴。\n\n慧慧看到了，说："这样吧，我这块比较大，我跟壮壮换一下。反正我也吃不了那么多。"\n\n壮壮惊喜地说："真的吗？谢谢慧慧！"\n\n小雨也说："慧慧真会想办法，还这么大方！"\n\n大家开开心心地吃着蛋糕，一点都没吵架。\n\n李老师看到了，说："慧慧不但想出了公平的办法，还愿意把大的让给别人，真是又聪明又善良。"\n\n慧慧笑着说："遇到分东西的问题，想个公平的办法，大家就不会吵架了。而且分享一点也不会让自己少什么，反而更开心。"\n\n从那以后，班里再有分东西的事，小朋友们都会说："找慧慧！她有公平的好办法！"\n\n慧慧用她的聪明和大方，让大家都学会了：遇到矛盾，动脑筋找公平的办法，比争抢好得多。'
},
{
  id: 'huihui_24',
  title: '【慧慧的中班故事】第二十四集：勇敢承认错误',
  category: '慧慧',
  content: '慧慧不小心碰倒了教室里的花盆，花盆摔碎了，泥土撒了一地。\n\n当时没有人看到。慧慧愣了一下——她可以偷偷走开，假装不知道，反正没人看见。\n\n可是慧慧摇了摇头。她径直走到李老师面前："李老师，对不起，我不小心碰倒了花盆，把它摔碎了。"\n\n李老师有点惊讶："是你自己来告诉老师的？"\n\n"是的，是我碰倒的。我应该承认。"慧慧虽然有点紧张，但还是勇敢地说了出来。\n\n李老师不但没有批评她，反而摸摸她的头："慧慧，摔碎花盆是个小意外，谁都可能碰到。但是你能主动承认，不逃避，这非常勇敢，非常诚实。老师为你骄傲。"\n\n慧慧和李老师一起把碎片清理干净，把花重新种到了新的花盆里。\n\n旁边的小朋友都看到了。乐乐悄悄说："慧慧，你不怕被批评吗？"\n\n慧慧说："做错了事，勇敢承认才对呀。如果我偷偷跑掉，心里会一直不安，而且花也没人管了。承认了，虽然当时有点害怕，但心里踏实。"\n\n过了几天，乐乐不小心弄坏了班里的图书。这次乐乐学着慧慧的样子，主动跟老师承认了。李老师也表扬了乐乐的诚实。\n\n慧慧用自己的行动告诉大家：犯错不可怕，可怕的是逃避和撒谎。勇敢地承认错误，才是真正的勇敢，也会赢得别人的尊重和信任。\n\n那盆重新种好的花，后来开出了漂亮的花朵。慧慧每次浇水的时候都会想：诚实和勇敢，就像这朵花一样，会开出美丽的结果。'
},
{
  id: 'huihui_25',
  title: '【慧慧的中班故事】第二十五集：慧慧的时间表',
  category: '慧慧',
  content: '慧慧发现，有的小朋友总是丢三落四——今天忘带水杯，明天忘带手工材料，后天又忘了穿运动鞋。\n\n慧慧从来不会忘东西。乐乐好奇地问："慧慧，你怎么什么都记得带？"\n\n慧慧从书包里拿出一张小卡片："这是我和妈妈一起做的\'小任务表\'。每天晚上睡觉前，我照着表格准备好第二天要带的东西，放进书包。这样就不会忘了。"\n\n卡片上画着：水杯、手工材料、要穿的衣服、要交的作业……每准备好一样，慧慧就画一个小勾。\n\n乐乐觉得这个办法真好："我也想做一个！"\n\n慧慧帮乐乐一起做了一张任务表。从那以后，乐乐也不怎么丢三落四了。\n\n慧慧还有一个习惯：她做事情有计划。玩之前先想好玩多久，到时间就收玩具;吃饭的时候专心吃，不边吃边玩;该睡觉了就乖乖上床，不拖拖拉拉。\n\n"慧慧，你不想多玩一会儿吗？"有小朋友问。\n\n"想呀，"慧慧说，"但是我知道，玩过头了，晚上就睡不够，第二天就没精神。所以到了时间我就停下来。这样每天都有精神，做什么都开心。"\n\n李老师说："慧慧真是个自律的孩子。自律就是自己管好自己，该做什么的时候做什么。这是一个非常了不起的本领。"\n\n慧慧的自律让她的生活井井有条。她从不慌慌张张，因为该准备的都提前准备好了;她精力充沛,因为该休息的时候好好休息了。\n\n慧慧告诉小伙伴们：管好自己的时间和东西，看起来是小事，但坚持下来，你会发现生活变得又轻松又有序。'
},
{
  id: 'huihui_26',
  title: '【慧慧的中班故事】第二十六集：不怕黑的慧慧',
  category: '慧慧',
  content: '幼儿园停电了，午睡室里黑黑的。好多小朋友都害怕，有的哭了，有的躲进被子里发抖。\n\n"呜呜，好黑呀，我害怕……"乐乐吓得直哆嗦。\n\n慧慧也有一点点怕，但她深吸一口气，让自己冷静下来。她想起爸爸说过的话："黑暗里其实什么都没有，跟开灯的时候是一样的房间，只是看不见而已。"\n\n慧慧安慰旁边的小朋友："别怕，这只是停电了。房间还是我们熟悉的房间，什么都没有变。老师就在旁边呢。"\n\n她还想了个办法转移大家的注意力："我们来玩\'猜声音\'的游戏吧！听听看，这是什么声音？"\n\n慧慧敲了敲床板："咚咚——这是什么声音？"\n\n"床板的声音！"小朋友们的注意力被吸引了，慢慢不那么害怕了。\n\n黑暗中，大家玩起了猜声音的游戏，笑声代替了哭声。\n\n过了一会儿，电来了，灯亮了。小朋友们发现，黑暗里真的什么可怕的东西都没有，房间还是原来的房间。\n\n李老师表扬慧慧："慧慧真勇敢，不但自己不害怕，还帮大家一起战胜了恐惧。"\n\n乐乐佩服地说："慧慧，你怎么一点都不怕黑呀？"\n\n慧慧说："其实我也有一点点怕。但是害怕的时候，越慌越怕。我就深呼吸，告诉自己\'没什么可怕的\',然后想办法让自己和大家都不害怕。勇敢不是不害怕，而是害怕的时候还能想办法。"\n\n从那以后，遇到停电或者黑暗，小朋友们都不那么怕了。因为他们记住了慧慧的话：黑暗里什么都没有，深呼吸，冷静下来，就不怕了。\n\n慧慧用她的勇敢和机智，让大家明白了：真正的勇敢，是在害怕的时候依然能保持冷静，还能帮助别人。'
},
{
  id: 'huihui_27',
  title: '【慧慧的中班故事】第二十七集：慧慧学拼图',
  category: '慧慧',
  content: '老师发下来一盒拼图，一百块，拼起来是一幅漂亮的森林图画。\n\n好多小朋友试了几下，觉得太难了，就放弃了。"太难了，拼不出来！"\n\n慧慧却不着急。她把拼图倒在桌上，先不急着拼，而是想了想办法。\n\n"我先把边框的拼起来。"慧慧把有直边的拼图挑出来——这些是图画的四条边。她先拼出了一个框。\n\n然后她按颜色分类：绿色的是树叶，蓝色的是天空，棕色的是树干……她把颜色一样的放在一堆。\n\n"这样找起来就快多了！"慧慧一块一块地拼，天空归天空，树叶归树叶。\n\n虽然中间也有拼错的时候，但慧慧不灰心，错了就换一块试试。慢慢地，森林的图画一点点显现出来了。\n\n乐乐在旁边看得着急："慧慧，还差好多呢，你不累吗？"\n\n"不着急，"慧慧说，"一块一块拼，总能拼完的。你看，已经拼出一半了！"\n\n又拼了一会儿，最后一块拼图放上去——完整的森林图画出现了！好漂亮！\n\n"哇！慧慧拼出来了！"小朋友们都围过来看。\n\n李老师问："慧慧，这么难的拼图，你是怎么拼出来的？"\n\n慧慧说："先拼边框，再按颜色分类，然后一块一块耐心地拼。遇到难的事情，不要急，想个好办法，一步一步来，就能完成。"\n\n小朋友们跟着慧慧学方法，也慢慢能拼出拼图了。\n\n慧慧告诉大家一个道理：再难的事情，只要不放弃，想好方法，把大问题拆成小问题，耐心地一点点做，最后都能完成。就像拼图，一百块看起来吓人，可一块一块拼，总有拼完的时候。'
},
{
  id: 'huihui_28',
  title: '【慧慧的中班故事】第二十八集：慧慧帮小蚂蚁搬家',
  category: '慧慧',
  content: '下课的时候，慧慧看到墙角有一群小蚂蚁在忙碌地搬东西。她蹲下来仔细观察。\n\n"你们在看什么呀？"小朋友们围过来。\n\n"看小蚂蚁搬家。"慧慧说，"它们排着队，一个接一个，把食物搬回家。你们看，它们多有秩序呀。"\n\n慧慧发现小蚂蚁在搬一块比它们身体大好多倍的饼干渣。一只蚂蚁搬不动，就来了好几只，一起合作把饼干渣抬起来。\n\n"哇，它们好团结！"\n\n慧慧还发现，快下雨了，蚂蚁们搬家搬得特别急。"我记得书上说过，蚂蚁搬家是要下雨的信号。它们在把家搬到高处，免得被雨水淹了。"\n\n果然，没过多久，天阴了下来，真的开始下雨了。\n\n小朋友们都惊呆了："慧慧，你怎么知道要下雨呀？"\n\n"因为我平时喜欢观察，还喜欢看书。书上说蚂蚁搬家、燕子低飞，都是要下雨的信号。今天看到蚂蚁着急搬家，我就猜到快下雨了。"\n\n李老师说："慧慧真是个善于观察、爱学习的孩子。大自然里藏着好多知识，只要用心观察，就能发现。"\n\n慧慧还提醒大家："下雨了，我们把窗户关好吧，别让雨水飘进来。"她主动去关了窗户。\n\n从那以后，小朋友们也学着慧慧，喜欢上了观察小动物、观察大自然。他们发现，原来蚂蚁、蝴蝶、小鸟身上都有好多有趣的秘密。\n\n慧慧告诉大家：多观察、多看书、多思考，你就能懂得越来越多。知识不只在课本里，也在我们身边的每一个角落。留心观察的孩子，总能发现别人发现不了的奥秘。'
},
{
  id: 'huihui_29',
  title: '【慧慧的中班故事】第二十九集：慧慧不说谎',
  category: '慧慧',
  content: '李老师买了一盒新的彩色贴纸，放在讲台上，说等手工课的时候奖励给表现好的小朋友。\n\n下课的时候，慧慧路过讲台，特别想看看那些漂亮的贴纸。她没忍住，拿起来看了看，结果不小心把一张贴纸弄掉在地上，被踩了一脚，弄脏了。\n\n慧慧有点着急，但她没有把弄脏的贴纸藏起来。\n\n上课了，李老师发现少了一张贴纸，还有一张脏了。"是谁动了贴纸呢？"\n\n教室里安静了。慧慧站了起来："李老师，是我。我下课的时候好奇，拿起贴纸看，不小心弄掉了一张，被踩脏了。对不起。"\n\n李老师看着慧慧："你为什么要主动承认呢？其实老师不一定知道是你。"\n\n慧慧说："因为是我做的呀。就算没人知道，我自己知道。如果我不说，心里会一直不舒服。撒谎比做错事更不好。"\n\n李老师非常感动："慧慧，你知道吗？诚实比那一整盒贴纸都珍贵。你没有得到贴纸，但你得到了老师和同学们的信任，这是最宝贵的。"\n\n李老师奖励了慧慧一朵最大的小红花——不是因为她表现完美，而是因为她诚实。\n\n乐乐悄悄问："慧慧，你不觉得可惜吗？承认了就没有贴纸了。"\n\n慧慧笑着说："贴纸没了可以再有，但如果我撒了谎，大家就不相信我了，那才是真的可惜。做一个诚实的人，比什么都重要。"\n\n从那以后，班里的小朋友都更信任慧慧了。因为大家知道，慧慧说的话一定是真的。\n\n慧慧用行动告诉大家：诚实是一个人最宝贵的品质。就算会吃点小亏，也要说真话。一个诚实的人，会赢得所有人的信任和尊重，这比任何奖励都珍贵。'
},
{
  id: 'huihui_30',
  title: '【慧慧的中班故事】第三十集：慧慧的好办法',
  category: '慧慧',
  content: '秋游的时候，小朋友们在草地上玩。突然，乐乐的气球飞走了，挂在了一棵矮树的树枝上，够不着。\n\n乐乐急得跳起来抓，可是太高了，怎么也够不到。他快哭了："我的气球……"\n\n好几个小朋友试着跳起来抓，都够不着。有的想爬树，被老师制止了——爬树太危险。\n\n慧慧观察了一下。气球的线垂下来一截，就在树枝上挂着。\n\n"我有办法！"慧慧说。\n\n她找来了一根长长的竹竿（是老师用来撑帐篷的），然后用竹竿轻轻地去挑气球的线。\n\n试了两下，慧慧用竹竿头勾住了气球的线，轻轻一带——气球下来了！\n\n"耶！气球回来啦！"乐乐高兴地抱住了气球。\n\n小朋友们都欢呼起来："慧慧太聪明了！"\n\n李老师问："慧慧，你怎么想到用竹竿的？"\n\n慧慧说："我们的手够不着，但是竹竿长呀，可以帮我们够到高的地方。遇到够不着的东西，找一个长的工具来帮忙，就行了。爬树很危险，用竹竿又安全又管用。"\n\n李老师竖起大拇指："慧慧不但机智，还想到了安全。真棒！"\n\n从那以后，小朋友们遇到够不着的东西，都会想："找个长东西来够！"\n\n有一次乐乐的皮球滚到了桌子底下最里面，他学着慧慧的样子，找了一根长尺子把球拨了出来。\n\n慧慧告诉大家：遇到问题不要蛮干，动动脑筋，用合适的工具和方法，既安全又能解决问题。聪明的孩子，总是先想一想再行动。'
},
{
  id: 'huihui_31',
  title: '【慧慧的中班故事】第三十一集：慧慧坚持练习',
  category: '慧慧',
  content: '幼儿园要举办跳绳比赛。可是慧慧一开始一个都跳不过去——绳子总是绊到脚。\n\n有的小朋友跳不好就不练了："跳绳太难了，我不参加了。"\n\n慧慧没有放弃。她每天早一点到幼儿园，在操场上练习跳绳。\n\n第一天，她跳一个绊一个。第二天，能连着跳两个了。第三天，能跳五个了。\n\n练习的时候，慧慧摔过跤，绳子也抽疼过腿，但她擦擦眼泪，继续练。\n\n"慧慧，你不累吗？"乐乐问。\n\n"累呀，"慧慧擦擦汗，"但是我想跳好。今天比昨天多跳几个，就是进步。只要每天进步一点点，慢慢就能跳很多了。"\n\n一个星期后，慧慧能一口气跳二十多个了！\n\n比赛那天，慧慧跳了三十八个，得了小班组第一名！\n\n小朋友们都惊呆了："慧慧，你怎么跳得这么好呀？"\n\n慧慧说："因为我每天都练习呀。刚开始我一个都跳不过，是练出来的。世界上没有天生就会的事情，都是练出来的。"\n\n那些放弃的小朋友很后悔。慧慧鼓励他们："现在开始练还来得及！我教你们。"\n\n慧慧把自己的经验教给大家：跳的时候手腕用力，眼睛看前面，脚尖轻轻跳。她还陪着大家一起练。\n\n慢慢地，越来越多的小朋友学会了跳绳。\n\n慧慧告诉大家一个道理：熟能生巧。任何本领刚开始都很难，但只要坚持练习，每天进步一点，就一定能学会。放弃的人永远学不会，坚持的人终会成功。'
},
{
  id: 'huihui_32',
  title: '【慧慧的中班故事】第三十二集：慧慧不浪费',
  category: '慧慧',
  content: '午饭时间，慧慧总是把碗里的饭吃得干干净净，一粒米都不剩。\n\n有的小朋友吃饭剩好多，还把不爱吃的菜偷偷倒掉。\n\n李老师讲了一个故事："每一粒米，都是农民伯伯辛辛苦苦种出来的。春天播种，夏天顶着大太阳除草浇水，秋天才能收获。一粒米要经过好几个月才能到我们碗里。"\n\n慧慧一直都很珍惜粮食。她说："我爷爷是种地的，我知道种粮食很辛苦。所以我从来不浪费，能吃多少盛多少。"\n\n慧慧还有一个好习惯：用水的时候不开太大，洗完手赶紧关水龙头；纸巾用一张就够，不浪费；画画的纸，正面用完用反面。\n\n"慧慧，你怎么这么节约呀？"乐乐问。\n\n慧慧说："因为每样东西都来之不易呀。水是宝贵的，纸是树木做的，粮食是农民种的。我们节约一点，就是珍惜别人的劳动，也是爱护我们的地球。"\n\n李老师表扬慧慧："慧慧懂得珍惜，不浪费，这是一种非常好的品德。"\n\n在慧慧的影响下，班里的小朋友都开始节约了。吃饭不剩饭，用水不浪费，纸张两面用。\n\n李老师在墙上贴了一张"节约小明星"的表格，慧慧的名字下面贴满了小星星。\n\n慧慧告诉大家：节约不是小气，是一种美德。我们碗里的每一粒米、用的每一滴水、每一张纸，都凝聚着别人的辛苦。珍惜它们，就是对劳动的尊重。一个懂得珍惜的孩子，会更加懂得感恩。'
},
{
  id: 'huihui_33',
  title: '【慧慧的中班故事】第三十三集：慧慧机智救小猫',
  category: '慧慧',
  content: '放学路上，慧慧和妈妈听到了微弱的"喵喵"声。声音是从一个很深的墙缝里传出来的——一只小猫掉进去了，出不来。\n\n小猫又饿又怕，一直叫。可是墙缝太窄太深，手伸不进去，够不着小猫。\n\n围观的人越来越多，大家都想帮忙，可是谁也没办法。有人想用手掏，够不着；有人想撬墙，太危险。\n\n慧慧观察了一会儿，动起了脑筋。\n\n"我有办法！"慧慧说，"小猫爬不上来，是因为墙缝太滑了。我们可以放一块布或者一根绳子下去，让小猫抓着爬上来。"\n\n慧慧找来了一条长围巾，慢慢地放进墙缝里，一直垂到小猫旁边。\n\n一开始小猫不敢抓。慧慧轻声安慰："小猫别怕，抓住围巾，慢慢爬上来。"\n\n慧慧还让妈妈拿了一点食物的香味引导小猫往上爬。小猫闻到香味，试着抓住围巾，一点一点往上爬。\n\n大家都屏住呼吸看着。终于，小猫抓着围巾爬了上来！\n\n"太好了！小猫得救了！"围观的人都鼓起掌来。\n\n小猫得救后，蹭了蹭慧慧的腿，好像在说谢谢。\n\n一位叔叔说："这个小姑娘真聪明，我们大人都没想到的办法，她想到了！"\n\n慧慧不好意思地笑了："遇到问题冷静想一想，总能找到办法的。小猫爬不上来是因为墙滑，那就给它一个能抓住的东西。"\n\n妈妈骄傲地抱着慧慧："我的女儿又善良又机智！"\n\n慧慧告诉小伙伴们：遇到紧急情况不要慌，先冷静观察，弄清楚问题在哪里，然后想办法解决。有时候一个简单的办法，就能帮上大忙。善良加上机智，就能帮助更多需要帮助的人。'
},
{
  id: 'huihui_34',
  title: '【慧慧的中班故事】第三十四集：慧慧不怕困难的数学题',
  category: '慧慧',
  content: '数学课上，李老师出了一道稍微难一点的题："桌上有五个苹果，妈妈又拿来三个，然后小明吃掉了两个，现在还有几个？"\n\n好多小朋友一听有三个数字，就懵了："太难了！"\n\n慧慧没有慌。她拿出了自己的小手指，还有桌上的小积木当苹果。\n\n"先有五个苹果。"慧慧摆了五个积木。\n\n"妈妈又拿来三个。"她又加了三个，"五加三等于八，现在有八个。"\n\n"小明吃掉两个。"她拿走两个，"八减二等于六。所以还剩六个！"\n\n慧慧一步一步地算，把难题拆成了两个简单的小题：先算加法，再算减法。\n\n"哇，慧慧算对了！"李老师表扬她。\n\n乐乐佩服地说："这么难的题，你怎么算出来的？"\n\n慧慧说："题目看起来难，是因为有好几步。我把它拆开，一步一步来。先算加进来的，再算吃掉的。用积木摆出来，就看得清清楚楚了。"\n\n李老师说："慧慧的方法真好！遇到复杂的问题，把它拆成一小步一小步，就不难了。而且用实物来帮助思考，更容易理解。"\n\n慧慧教大家用积木、用手指来算数。慢慢地，小朋友们也不怕难题了。\n\n慧慧还发现，数学在生活里到处都是——分蛋糕要用除法，买东西要用加减法，排队要数数……\n\n慧慧告诉大家：难题不可怕，把大问题拆成小问题，一步一步解决，再难的题也能算出来。而且数学很有用，学好了在生活里处处能用上。爱动脑筋的孩子，会觉得数学越来越好玩。'
},
{
  id: 'huihui_35',
  title: '【慧慧的中班故事】第三十五集：慧慧管住了自己',
  category: '慧慧',
  content: '李老师在讲台上放了一盘香喷喷的小饼干，说："这是等一会儿手工课做完以后，奖励给大家的。现在谁都不许拿哦。"\n\n然后李老师有事出去了一会儿，教室里只剩下小朋友们和那盘饼干。\n\n饼干真香啊！有的小朋友忍不住了，偷偷拿了一块吃。"反正老师不在，吃一块没关系。"\n\n慧慧也很想吃，口水都快流出来了。但是她想起老师说的话——现在不许拿。\n\n慧慧对自己说："老师说了做完手工才能吃，我要说话算话，管住自己。"\n\n为了不去想饼干，慧慧转过身，专心地做起了手工。她把注意力放在剪纸、粘贴上，慢慢就不去想饼干了。\n\n李老师回来了，发现盘子里的饼干少了几块。她没有说什么，只是问："刚才老师不在的时候，谁没有拿饼干呀？"\n\n慧慧和几个管住了自己的小朋友举起了手。\n\n李老师笑了："你们真了不起！老师不在的时候也能管住自己，遵守约定，这叫自律。"\n\n李老师给管住自己的小朋友每人发了两块饼干作为奖励。那些没忍住偷吃的小朋友，红着脸低下了头。\n\n慧慧吃着香甜的饼干，心里特别踏实。\n\n乐乐问："慧慧，你不想吃吗？怎么忍住的？"\n\n慧慧说："想吃呀，可是老师说了不能拿。我就转过身做手工，不去看它、不去想它，就忍住了。而且，等待以后吃到的饼干，更香甜。"\n\n慧慧告诉大家：自律就是在没有人监督的时候，也能管好自己，遵守规则。忍住一时的诱惑，转移注意力，就能做到。能管住自己的人，才能做成大事。而且，靠自律得到的东西，会让你更有成就感。'
},
{
  id: 'huihui_36',
  title: '【慧慧的中班故事】第三十六集：慧慧帮助新同学',
  category: '慧慧',
  content: '班里来了一个新同学，叫朵朵。朵朵刚从外地转来，说话口音有点不一样，很害羞，一个人坐在角落里，不敢跟别人说话。\n\n有的小朋友觉得朵朵说话怪怪的，还偷偷笑她。朵朵更不敢开口了，眼泪在眼眶里打转。\n\n慧慧看到了，主动走过去，坐到朵朵旁边，微笑着说："你好，我叫慧慧。欢迎你来我们班！"\n\n朵朵小声说："我……我说话跟你们不一样，他们笑我……"\n\n慧慧说："说话有一点不一样没关系呀，那说明你会说不同地方的话，很厉害呢！我还想跟你学呢，你们那边怎么说\'你好\'？"\n\n朵朵教了慧慧一句家乡话，慧慧认真地学，学得有模有样。两个人一起笑了起来。\n\n慧慧拉着朵朵，带她认识班里的小朋友，带她玩滑梯、玩积木，还把自己的蜡笔借给朵朵用。\n\n慢慢地，朵朵不再害羞了，脸上有了笑容，还交到了好几个朋友。\n\n慧慧还悄悄跟那些笑朵朵的小朋友说："朵朵刚来，人生地不熟的，我们应该欢迎她、帮助她，而不是笑她。如果是你到了一个新地方，被大家笑，你会多难过呀。"\n\n小朋友们听了，都不好意思了，纷纷跟朵朵道歉，跟她做了朋友。\n\n李老师看到这一切，欣慰地说："慧慧真是个善良又有爱心的孩子。她让新同学感受到了温暖。"\n\n朵朵拉着慧慧的手说："慧慧，谢谢你。你是我在这里的第一个好朋友。"\n\n慧慧告诉大家：每个人都有不一样的地方，说话口音不同、来自不同的地方，这都很正常，不应该被嘲笑。对新来的人，我们要热情欢迎、主动帮助。善待别人，就会收获真诚的友谊。一个有爱心的孩子，走到哪里都会被人喜欢。'
},
{
  id: 'huihui_37',
  title: '【慧慧的中班故事】第三十七集：慧慧记住了安全规则',
  category: '慧慧',
  content: '李老师给大家上安全教育课，讲了好多安全知识：过马路要看红绿灯，红灯停绿灯行；不能跟陌生人走；不能玩火玩电；一个人在家不给陌生人开门……\n\n别的小朋友听过就忘了，只有慧慧认真记在了心里，还回家讲给爸爸妈妈听。\n\n有一天放学，慧慧和奶奶走散了。慧慧一个人站在幼儿园门口，有点着急，但她没有慌。\n\n一个陌生的叔叔走过来，笑眯眯地说："小朋友，你找不到家人了吧？叔叔带你去找，跟叔叔走。"还拿出糖果给慧慧。\n\n慧慧想起了李老师的话——不能跟陌生人走，不能吃陌生人的东西！\n\n慧慧摇摇头，礼貌但坚定地说："谢谢叔叔，不用了。老师说过不能跟陌生人走。我在这里等我奶奶，或者找门口的保安叔叔帮忙。"\n\n慧慧转身跑到了幼儿园门口的保安室，找到了穿制服的保安叔叔："保安叔叔，我和奶奶走散了，能帮我打电话给我妈妈吗？"\n\n保安叔叔帮慧慧联系了妈妈。很快，着急的奶奶就找过来了。原来奶奶只是去旁边接了个电话，一转眼慧慧就在等她了。\n\n那个陌生的叔叔见慧慧这么警惕，早就走了。\n\n奶奶知道后，惊出一身冷汗，紧紧抱住慧慧："幸好你记住了安全规则，没跟陌生人走！"\n\n李老师知道后，在全班表扬了慧慧："慧慧不但记住了安全规则，关键时刻还能用上，真是又聪明又勇敢！"\n\n慧慧告诉小伙伴们：安全知识一定要记牢，关键时刻能保护自己。找不到家人不要慌，站在原地等，或者找穿制服的警察、保安帮忙。绝对不能跟陌生人走，不吃陌生人的东西。记住这些，就能保护好自己。'
},
{
  id: 'huihui_38',
  title: '【慧慧的中班故事】第三十八集：慧慧的读书角',
  category: '慧慧',
  content: '慧慧最喜欢看书了。每次自由活动时间，别的小朋友玩玩具，慧慧就跑到读书角看图画书。\n\n她看恐龙的书，知道了霸王龙、三角龙；看太空的书，知道了月亮、星星、火箭；看动物的书，知道了大象用鼻子喝水、长颈鹿脖子长能吃到高处的叶子。\n\n慧慧看了好多书，懂得也越来越多。上课的时候，老师问的问题她常常能答上来，因为她在书里都看到过。\n\n"慧慧，你怎么懂这么多呀？"乐乐好奇地问。\n\n慧慧说："因为我爱看书呀。书里有好多好多知识，看得越多，懂得越多。看书就像跟很多聪明人聊天，能学到好多东西。"\n\n慧慧还把好看的书推荐给小伙伴们。她给乐乐推荐了恐龙的书，乐乐看了以后也迷上了恐龙，天天讲恐龙的故事。\n\n慢慢地，读书角的小朋友越来越多了。大家都发现，看书原来这么有意思，还能学到好多知识。\n\n李老师很高兴，在读书角添了更多的书，还设立了"读书小明星"。慧慧读的书最多，得了第一名。\n\n慧慧看书还有个好习惯——看完的书，她会轻轻放回原位，摆得整整齐齐，还爱护书本，不折页、不撕破。\n\n李老师表扬慧慧："慧慧不但爱读书，还爱护书，真是个好榜样。"\n\n慧慧告诉大家：书是知识的宝库。多读书，能让我们变得聪明、懂得道理、知道很多有趣的事。读书的孩子，眼界更宽，脑子更灵。而且，看完书要爱护它、放回原位，因为书是我们的好朋友。养成爱读书的习惯，会让你受益一辈子。'
},
{
  id: 'huihui_39',
  title: '【慧慧的中班故事】第三十九集：慧慧化解小争吵',
  category: '慧慧',
  content: '乐乐和壮壮为了一辆玩具汽车吵了起来。两个人都说是自己先拿到的，谁也不让谁，越吵越凶，差点要打起来。\n\n"是我先拿的！""明明是我！"\n\n周围的小朋友都不知道怎么办。慧慧走了过来。\n\n"你们别吵了，"慧慧说，"吵架解决不了问题。我们来想想办法。"\n\n慧慧先让两个人都冷静下来："你们一个一个说，到底是怎么回事？"\n\n乐乐说："我先看到这辆车，正要去拿。"\n\n壮壮说："可是我先摸到它的。"\n\n慧慧想了想，说："这样吧，你们两个都想玩，那就轮流玩。用沙漏计时，一人玩五分钟，时间到了就换另一个人。这样两个人都能玩到，公平不公平？"\n\n乐乐和壮壮想了想，都点了点头："好吧。"\n\n慧慧拿来了沙漏。乐乐先玩五分钟，然后换壮壮玩五分钟。两个人轮流玩，玩得可开心了，还一起用玩具车比赛，成了好朋友。\n\n刚才的争吵烟消云散了。\n\n李老师看到了，问慧慧："你是怎么让他们不吵的？"\n\n慧慧说："吵架的时候，两个人都在气头上，谁也听不进谁的。我先让他们冷静，然后弄清楚原因，再想一个两个人都能接受的公平办法。轮流玩，大家都有份，就不吵了。"\n\n李老师说："慧慧真会调解矛盾！这是很重要的本领呢。"\n\n从那以后，班里的小朋友有了矛盾，都爱找慧慧："慧慧，你帮我们评评理，想个办法。"慧慧成了大家的"小和事佬"。\n\n慧慧告诉大家：吵架、打架都解决不了问题，只会让事情更糟。遇到矛盾，先冷静下来，听听双方怎么说，然后想一个大家都能接受的公平办法。学会好好商量、互相谦让，就能化解矛盾，还能收获友谊。'
},
{
  id: 'huihui_40',
  title: '【慧慧的中班故事】第四十集：慧慧战胜了拖延',
  category: '慧慧',
  content: '李老师布置了一个小任务：每人回家画一幅"我的家人"，三天后带来。\n\n有的小朋友想着"还有三天呢，不急"，一直拖着不画。\n\n慧慧不一样。回到家，她当天就把画画好了。妈妈问："不是三天后才交吗？怎么这么着急？"\n\n慧慧说："早点做完，心里就轻松了。要是拖到最后一天，万一有别的事，或者画不好，就来不及了。"\n\n果然，到了第三天，那些拖延的小朋友慌了神。有的忘了画，早上急急忙忙乱画一张;有的画到一半发现颜料用完了，来不及买;有的熬到很晚才画完，第二天没精神。\n\n而慧慧呢，她的画早就画好了，还有时间检查、修改，把画画得特别漂亮——画上有爸爸、妈妈、爷爷、奶奶，还有她自己，一家人在一起，温馨极了。\n\n李老师把慧慧的画贴在了展示墙的最中间。"慧慧的画最用心！因为她早早就完成了，还有时间画得更好。"\n\n乐乐懊恼地说："我拖到最后一天才画，画得乱七八糟的……"\n\n慧慧安慰他："下次早点开始就好了。事情早做完，心里踏实，还有时间做得更好。"\n\n从那以后，乐乐学着慧慧，一有任务就早点开始，不再拖延了。他发现，早做完真的轻松多了，再也不用手忙脚乱了。\n\n慧慧告诉大家：不要把事情拖到最后一刻。早点开始、早点完成，不但心里轻松，还有时间检查和改进，把事情做得更好。拖延只会让自己越来越慌张。"今天能做的事，不要拖到明天"，这是一个特别好的习惯。'
},
{
  id: 'huihui_41',
  title: '【慧慧的中班故事】第四十一集：慧慧懂礼貌',
  category: '慧慧',
  content: '慧慧是班里最有礼貌的小朋友。\n\n早上到幼儿园，她会主动跟老师问好："李老师早上好！"见到门卫爷爷，也会甜甜地叫："爷爷好！"\n\n别人帮了她，她一定会说"谢谢"；不小心碰到别人，她会说"对不起"；想请别人帮忙，她会说"请"；放学离开，她会说"再见"。\n\n这些礼貌用语，慧慧用得特别自然。\n\n有一天，慧慧的奶奶来接她，还带来了一些点心分给小朋友们。慧慧第一个说："谢谢奶奶！"然后招呼大家："大家一起谢谢我奶奶呀。"\n\n小朋友们跟着说："谢谢奶奶！"奶奶笑得合不拢嘴。\n\n李老师说："慧慧真懂礼貌。有礼貌的孩子，走到哪里都受欢迎。"\n\n慧慧发现，有的小朋友不太会用礼貌用语。她就悄悄提醒他们。乐乐想借慧慧的橡皮，一把抢过去。慧慧笑着说："你可以说\'慧慧，可以借我用一下橡皮吗？\'这样问，我会更愿意借给你哦。"\n\n乐乐红着脸重新说了一遍："慧慧，请借我用一下橡皮，好吗？"\n\n"当然可以！"慧慧笑着把橡皮递给他。\n\n乐乐发现，有礼貌地请求，别人更愿意帮忙。慢慢地，班里的小朋友都变得有礼貌了。\n\n"请""谢谢""对不起""你好""再见"——这些礼貌用语在教室里越来越多，班里的气氛也越来越友好。\n\n慧慧告诉大家：礼貌是一个人最好的名片。见面问好、受助道谢、做错道歉、请求说"请"，这些简单的话，能让别人感到被尊重，也让自己更受欢迎。一个懂礼貌的孩子，会交到更多的朋友，也会被更多人喜爱。'
},
{
  id: 'huihui_42',
  title: '【慧慧的中班故事】第四十二集：慧慧不骄傲',
  category: '慧慧',
  content: '慧慧各方面都表现得很好，得了好多小红花，还常常被老师表扬。\n\n有一次，慧慧在讲故事比赛中得了第一名。有的小朋友悄悄说："慧慧总是第一，有什么了不起的。"\n\n慧慧听到了，但她没有骄傲，也没有生气。她走过去对大家说："我这次讲得好，是因为我在家练习了很多遍。其实你们也有很多我比不上的地方呀。壮壮跑步比我快，乐乐画画比我好看，朵朵唱歌比我好听。每个人都有自己的长处。"\n\n小朋友们听了，都觉得慧慧说得对，心里舒服多了。\n\n慧慧从来不因为自己表现好就看不起别人。相反，她总是发现别人的优点，还向别人学习。\n\n她跟壮壮学跑步的姿势，跟乐乐学画画的技巧，跟朵朵学唱歌。慧慧说："每个人都是我的老师，我可以向大家学习。"\n\n正因为不骄傲、爱学习，慧慧进步得特别快，懂得也越来越多。\n\n李老师说："慧慧最难得的，不是她表现好，而是她表现好却不骄傲，还虚心向别人学习。骄傲会让人停止进步，谦虚才能越来越棒。"\n\n有一次慧慧在拼图比赛中输给了朵朵，她一点都不难过，还真诚地祝贺朵朵："朵朵你拼得真快，教教我好吗？"\n\n朵朵很感动，把方法教给了慧慧。两个人的感情更好了。\n\n慧慧告诉大家：取得好成绩不要骄傲。骄傲的人会看不起别人，也会停止进步。真正聪明的人，会发现每个人的长处，虚心向别人学习。谦虚使人进步，骄傲使人落后。保持一颗谦虚好学的心，才能越来越优秀。'
},
{
  id: 'huihui_43',
  title: '【慧慧的中班故事】第四十三集：慧慧照顾生病的同学',
  category: '慧慧',
  content: '有一天，同桌乐乐在幼儿园突然发起烧来，脸红红的，蔫蔫地趴在桌上。\n\n慧慧第一个发现了："乐乐，你怎么了？脸好红。"她摸了摸乐乐的额头，"好烫！乐乐发烧了！"\n\n慧慧赶紧跑去告诉李老师："李老师，乐乐发烧了，额头很烫！"\n\n李老师赶紧过来，量了体温，果然发烧了。李老师一边联系乐乐的妈妈，一边让乐乐去休息室躺着。\n\n慧慧主动帮忙照顾乐乐。她给乐乐倒了一杯温水："乐乐，多喝点水，发烧要多喝水。"她还帮乐乐拿来了小毯子盖上。\n\n乐乐难受得快哭了，慧慧就坐在旁边陪着他，轻声安慰："别怕，妈妈马上就来接你了。发烧吃了药、休息一下就会好的。"\n\n慧慧还帮乐乐把书包收拾好，把他的作业本、水杯都装进去，这样妈妈来了就能直接带走。\n\n乐乐的妈妈来了，看到慧慧这么细心地照顾乐乐，特别感动："谢谢你，慧慧，这么会照顾人。"\n\n第二天，乐乐病好了，回到幼儿园，第一件事就是谢谢慧慧："慧慧，谢谢你昨天照顾我。有你陪着，我就不那么难受了。"\n\n慧慧说："我们是好朋友呀，朋友生病了当然要照顾。"\n\n李老师在班里表扬了慧慧："慧慧不但发现同学生病了及时报告老师，还细心地照顾同学，真是个有爱心的好孩子。"\n\n慧慧告诉大家：朋友生病或者有困难的时候，我们要关心他、帮助他。发现同学不舒服，要赶紧告诉老师;给生病的同学倒水、陪伴、安慰，都能让他们好受一些。关心别人、照顾别人，是一种温暖的爱心。你对别人好，别人也会对你好，友谊就是这样建立起来的。'
},
{
  id: 'huihui_44',
  title: '【慧慧的中班故事】第四十四集：慧慧的储蓄罐',
  category: '慧慧',
  content: '慧慧有一个小猪储蓄罐。每次得到零花钱，她都不会马上花掉，而是存一部分到储蓄罐里。\n\n有的小朋友一有零花钱就买零食、买小玩具，一下子花光了。\n\n乐乐问："慧慧，你有钱怎么不买好吃的呀？"\n\n慧慧说："我把钱存起来，是想买一样我特别想要的东西——一套画笔。它有点贵，一下子买不起。但是我每次存一点，存够了就能买了。"\n\n慧慧还有个记账本，画着小图案，记录自己存了多少、想买什么。\n\n慢慢地，储蓄罐越来越重。有一天，慧慧数了数，够买那套画笔了！\n\n慧慧用自己存的钱买了心爱的画笔，特别高兴，也特别珍惜——因为这是她一点一点存钱买来的。\n\n那些乱花钱的小朋友很羡慕："慧慧，你怎么攒下这么多钱？"\n\n慧慧说："每次少买一点零食，把钱存起来，积少成多，就能买大一点的东西了。而且，自己存钱买来的东西，会更珍惜。"\n\n慧慧还懂得分辨"需要"和"想要"。真正需要的东西才买，只是一时想要的，就忍一忍。这样她的钱花得很有计划。\n\n李老师听说了，表扬慧慧："慧慧小小年纪就懂得存钱、有计划地花钱，真了不起。"\n\n慧慧告诉小伙伴们：钱要有计划地花。不要一有钱就全花光，可以存一部分起来。积少成多，就能买到更想要的东西。还要分清楚"需要"和"想要"——需要的才买，想要的忍一忍。会管理零花钱的孩子，长大以后会更懂得珍惜和规划。'
},
{
  id: 'huihui_45',
  title: '【慧慧的中班故事】第四十五集：慧慧不怕出丑',
  category: '慧慧',
  content: '幼儿园要举办文艺表演，李老师问："谁愿意上台表演节目呀？"\n\n好多小朋友都不敢举手，怕在台上出丑，怕表演不好被人笑。\n\n慧慧勇敢地举起了手："老师，我愿意！我想表演唱歌。"\n\n其实慧慧唱歌也不是最好的，但她想试一试。\n\n有小朋友说："万一你唱错了，大家笑你怎么办？"\n\n慧慧说："唱错了没关系呀，重要的是我勇敢地上台了。如果因为怕出丑就不敢尝试，那永远也学不会、进步不了。"\n\n表演前，慧慧认真练习了好多遍。表演那天，虽然有点紧张，但她深吸一口气，勇敢地走上了台。\n\n慧慧的歌声响起来了。中间有一个音她唱得有点跑调，台下有几个小朋友笑了一下。但慧慧没有慌，也没有停下来，她继续认真地唱完了整首歌。\n\n唱完以后，台下响起了热烈的掌声。李老师带头鼓掌："慧慧唱得真好！最棒的是她敢于上台，从头到尾坚持唱完，非常勇敢！"\n\n那些笑过的小朋友也不好意思了——人家勇敢地上台，他们连举手都不敢。\n\n慧慧下台后，一点都不觉得丢脸，反而特别开心："我做到了！我在台上表演了！"\n\n受慧慧的鼓励，越来越多的小朋友也鼓起勇气报名表演了。大家发现，上台表演虽然有点紧张，但特别锻炼人，而且没有人真的会笑话勇敢尝试的人。\n\n慧慧告诉大家：不要怕出丑、怕失败。每个人刚开始都不完美，唱错、做错都很正常。重要的是勇敢地去尝试。如果因为害怕就什么都不敢做，那才是真的可惜。勇敢地迈出第一步，你就已经赢了。犯点小错没关系，勇于尝试的孩子最了不起。'
},
{
  id: 'huihui_46',
  title: '【慧慧的中班故事】第四十六集：慧慧爱护小树苗',
  category: '慧慧',
  content: '春天到了，幼儿园组织小朋友们种树。每个小朋友分到一棵小树苗，种在花园里，还挂上写着自己名字的小牌子。\n\n种下树苗只是开始。慧慧知道，小树苗需要照顾才能长大。\n\n每天来幼儿园，慧慧第一件事就是去看看她的小树苗，给它浇水。天热的时候多浇一点，下雨了就不浇。她还会帮小树苗拔掉旁边的杂草。\n\n有的小朋友种完树就不管了。他们的小树苗有的因为没浇水，叶子蔫了;有的被杂草缠住了，长不高。\n\n慧慧看到别的小朋友的树苗蔫了，就提醒他们："小树苗要每天浇水呀，不然会渴死的。"她还帮着一起照顾。\n\n日子一天天过去，慧慧的小树苗长得又高又壮，绿油油的，还发出了新芽。\n\n李老师说："慧慧的小树苗长得最好，因为她坚持照顾。种下容易，坚持照顾难。慧慧的耐心和责任心，让小树苗健康成长。"\n\n慧慧摸着自己的小树苗，高兴地说："看着它一点一点长大，好有成就感呀！"\n\n她还教大家怎么照顾树苗：什么时候浇水、怎么拔草、怎么捉虫。在慧慧的带动下，小朋友们都开始认真照顾自己的树苗了，花园里的小树苗都长得郁郁葱葱。\n\n慧慧告诉大家：种下一棵树苗，就要负责照顾它长大。这叫责任心。做任何事情都一样，开始了就要坚持负责到底，不能半途而废。而且，爱护花草树木、保护大自然，是每个人的责任。看着自己照顾的生命一天天成长，是最幸福的事。等这些小树长成大树，能给大家遮阴，那多好呀。'
},
{
  id: 'huihui_47',
  title: '【慧慧的中班故事】第四十七集：慧慧的观察日记',
  category: '慧慧',
  content: '慧慧在窗台上种了一颗豆子，想看看它是怎么发芽长大的。\n\n她每天观察豆子的变化，还画了一本"观察日记"。\n\n第一天：豆子埋进了土里，什么也看不见。第三天：土里冒出了一个小小的白芽。第五天：小芽变绿了，钻出了土面。第七天：长出了两片小小的嫩叶。第十天：又长高了，叶子变大了。\n\n慧慧把每一天的变化都仔细地画下来、记下来。她发现豆芽是弯弯地钻出土的，叶子会朝着有阳光的方向长。\n\n"好神奇呀！"慧慧观察得津津有味。\n\n有一天，慧慧发现豆芽有点歪，都朝着窗户那边长。她想了想："是不是因为阳光从窗户照进来，豆芽朝着阳光长呢？"\n\n慧慧做了个小实验：她把花盆转了个方向。过了几天，豆芽又朝着窗户的方向弯回去了！\n\n"果然！植物会朝着阳光生长！"慧慧兴奋地发现了这个秘密。\n\n她把观察日记带到幼儿园，给小朋友和老师看。大家都惊叹不已："慧慧观察得好仔细呀！"\n\n李老师说："慧慧不但认真观察，还会思考、会做实验，发现了\'植物向着阳光生长\'的科学道理。这就是科学家做研究的方法呀！"\n\n慧慧的观察日记激发了小朋友们的兴趣。大家也开始种豆子、养蚕、观察小动物，记录它们的变化。\n\n慧慧告诉大家：世界上有好多有趣的秘密，只要你用心观察、认真记录、动脑思考，就能发现它们。多问几个"为什么",然后想办法找到答案。爱观察、爱思考、爱动手的孩子，会发现学习原来这么有趣，世界原来这么奇妙。'
},
{
  id: 'huihui_48',
  title: '【慧慧的中班故事】第四十八集：慧慧遵守约定',
  category: '慧慧',
  content: '慧慧和好朋友朵朵约好了，周六上午在幼儿园门口见面，一起去图书馆看书。\n\n周六早上，天突然下起了小雨。慧慧的妈妈说："下雨了，要不别去了吧？"\n\n慧慧摇摇头："不行，我和朵朵约好了。朵朵一定会去的，如果我不去，她一个人在雨里等，多着急呀。"\n\n慧慧穿上雨衣，带上雨伞，准时来到了幼儿园门口。\n\n果然，朵朵已经在那里等着了。看到慧慧来了，朵朵特别高兴："慧慧，我就知道你一定会来！"\n\n原来朵朵也想过下雨会不会不来，但她相信慧慧一定会遵守约定。\n\n两个好朋友一起打着伞去了图书馆，度过了愉快的一天。\n\n回家的路上，朵朵说："慧慧，谢谢你冒雨来赴约。有的人一遇到点困难就不守约定了，可你没有。"\n\n慧慧说："答应了别人的事，就要做到。这是对朋友的尊重。如果我因为下雨就不来，朵朵会失望，也会不再相信我了。"\n\n李老师听说了这件事，在班里讲给大家听："慧慧遵守约定，说到做到，哪怕下雨也准时赴约。这种守信用的品质，非常可贵。"\n\n小朋友们都很佩服慧慧。大家也学着她，答应别人的事情努力做到。\n\n慧慧还说：如果真的因为特殊原因去不了，一定要提前告诉对方，说声对不起，不能让人白等。\n\n慧慧告诉大家：守信用是做人的根本。答应了的事，就算遇到困难也要尽力做到。一个说话算话的人，才能得到别人的信任和真心的友谊。如果实在做不到，也要提前告知、诚恳道歉。守信的孩子，走到哪里都会被人信赖。'
},
{
  id: 'huihui_49',
  title: '【慧慧的中班故事】第四十九集：慧慧的整理魔法',
  category: '慧慧',
  content: '慧慧的小柜子和书包总是整整齐齐的，什么东西放在哪里，她一清二楚，找起来又快又方便。\n\n而有的小朋友的柜子和书包乱糟糟的，找一样东西要翻半天，常常找不到，急得团团转。\n\n乐乐的书包就像一个"大杂烩"——书、蜡笔、零食、玩具全混在一起。有一次他找一支铅笔，翻了整个书包都没找到，急哭了。\n\n慧慧走过来："我来帮你，也教你一个整理的魔法。"\n\n慧慧把乐乐的东西全倒出来，然后开始分类："书放在一起，蜡笔放进笔袋，玩具放这个格子，零食放那个格子。每样东西都有自己的家。"\n\n整理好以后，乐乐的书包变得整整齐齐。他找那支铅笔，一下子就在笔袋里找到了。\n\n"哇，好神奇！"乐乐惊喜地说。\n\n慧慧说："这不是魔法，是整理的方法。把东西分类，每样东西都放在固定的地方。用完了放回原位。这样就永远不会乱，也不会找不到了。"\n\n慧慧还教大家一个口诀:"用完东西放回家，分类摆放最整齐，需要的时候找得快。"\n\n在慧慧的帮助下，小朋友们都学会了整理。教室里的柜子、书包都变得整整齐齐的。李老师再也不用帮小朋友们找丢失的东西了。\n\n李老师表扬慧慧："慧慧不但自己整理得好，还把方法教给大家，让全班都变整洁了。真是个爱整洁、乐于分享的好孩子。"\n\n慧慧告诉大家：整理东西是一个特别有用的本领。把东西分类，每样东西都有固定的位置，用完放回原处。这样不但看起来整齐，找东西也又快又方便，再也不会手忙脚乱了。养成爱整洁、会整理的好习惯，会让你的生活变得井井有条。'
},
{
  id: 'huihui_50',

  category: '慧慧',

// ==================== STATE ====================
const State = {
  currentView: 'list', // list | reading | settings | addStory
  currentCategory: '恐龙',
  currentStory: null,
  stories: [],
  favorites: new Set(),
  customStories: [],
  settings: {
    protagonistName: '小宝贝',
    voiceURI: '',
    speed: 0.85,
    pitch: 1.1,
    sleepTimer: 0
  },
  tts: {
    playing: false,
    paused: false,
    currentSentenceIndex: 0,
    sentences: [],
    utterance: null
  },
  sleepTimerEnd: null,
  sleepTimerInterval: null
};

// ==================== STORAGE ====================
function loadState() {
  try {
    const saved = localStorage.getItem('bedtime_stories_state');
    if (saved) {
      const data = JSON.parse(saved);
      if (data.settings) Object.assign(State.settings, data.settings);
      if (data.favorites) State.favorites = new Set(data.favorites);
      if (data.customStories) State.customStories = data.customStories;
    }
  } catch(e) { console.warn('Failed to load state', e); }
  State.stories = [...PRESET_STORIES, ...State.customStories];
}

function saveState() {
  try {
    localStorage.setItem('bedtime_stories_state', JSON.stringify({
      settings: State.settings,
      favorites: [...State.favorites],
      customStories: State.customStories
    }));
  } catch(e) { console.warn('Failed to save state', e); }
}

// ==================== HELPERS ====================
function replaceName(text) {
  const name = State.settings.protagonistName || '小宝贝';
  // 支持多种占位符格式：{主人公} ｛主人公｝ （主人公） [主人公] 【主人公】
  return text.replace(/[{｛\[【（(]主人公[}｝\]】）)]/g, name);
}

function splitSentences(text) {
  return text.split(/(?<=[。！？\n])/g).map(s => s.trim()).filter(s => s.length > 0);
}

// 清理文本中不需要朗读的符号
function cleanForTTS(text) {
  return text
    // 去除所有引号、括号、书名号
    .replace(/["""''『』「」《》【】〈〉（）(){}｛｝\[\]]/g, '')
    // 去掉破折号、省略号
    .replace(/[——…—]+/g, '')
    .replace(/\.{3,}/g, '')
    // 去掉感叹号、问号（不替换，直接删）
    .replace(/[！!？?]+/g, '')
    // 去掉冒号、分号等杂符号
    .replace(/[：:；;～~·•＊*＃#、]+/g, '')
    // 去掉句号（speechSynthesis会读"句号"）
    .replace(/[。]+/g, '，')
    // 多个逗号合并成一个
    .replace(/[，,]{2,}/g, '，')
    // 开头的逗号去掉
    .replace(/^，/, '')
    // 清理多余空格
    .replace(/\s+/g, '')
    .trim();
}

function getFilteredStories() {
  let stories = State.stories;
  if (State.currentCategory === '收藏') {
    stories = stories.filter(s => State.favorites.has(s.id));
  } else if (State.currentCategory !== '全部') {
    stories = stories.filter(s => s.category === State.currentCategory);
  }
  return stories;
}

// ==================== TTS ENGINE (浏览器 speechSynthesis) ====================

function stopTTS() {
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  State.tts.playing = false;
  State.tts.paused = false;
  State.tts.currentSentenceIndex = 0;
  State.tts.utterance = null;
  render();
}

function pauseTTS() {
  if (window.speechSynthesis && window.speechSynthesis.speaking) {
    window.speechSynthesis.pause();
    State.tts.paused = true;
    State.tts.playing = false;
    render();
  }
}

function resumeTTS() {
  if (State.tts.paused) {
    window.speechSynthesis.resume();
    State.tts.paused = false;
    State.tts.playing = true;
    render();
  }
}

function speakFromIndex(index) {
  if (index >= State.tts.sentences.length) {
    playNextStory();
    return;
  }
  State.tts.currentSentenceIndex = index;
  State.tts.playing = true;
  State.tts.paused = false;

  const text = cleanForTTS(State.tts.sentences[index]);
  if (!text) { speakFromIndex(index + 1); return; }

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.rate = State.settings.speed;
  utterance.pitch = 1.1;
  utterance.lang = 'zh-CN';

  const voices = window.speechSynthesis.getVoices();
  if (State.settings.voiceURI) {
    const selectedVoice = voices.find(v => v.voiceURI === State.settings.voiceURI);
    if (selectedVoice) utterance.voice = selectedVoice;
  } else {
    const zhVoice = voices.find(v => v.lang.startsWith('zh'));
    if (zhVoice) utterance.voice = zhVoice;
  }

  if (State.sleepTimerEnd) {
    const remaining = (State.sleepTimerEnd - Date.now()) / 1000;
    if (remaining <= 0) { stopTTS(); clearSleepTimer(); return; }
    if (remaining <= 30) { utterance.volume = Math.max(0.1, remaining / 30); }
  }

  utterance.onend = () => { if (State.tts.playing) speakFromIndex(index + 1); };
  utterance.onerror = (e) => { if (e.error !== 'canceled' && State.tts.playing) speakFromIndex(index + 1); };

  State.tts.utterance = utterance;
  window.speechSynthesis.speak(utterance);
  render();
}

function playTTS() {
  if (State.tts.paused) {
    resumeTTS();
    return;
  }
  if (!State.currentStory) return;
  const title = replaceName(State.currentStory.title);
  const content = replaceName(State.currentStory.content);
  State.tts.sentences = [title + '。', ...splitSentences(content)];
  speakFromIndex(0);
}

// ==================== SLEEP TIMER ====================
function startSleepTimer(minutes) {
  clearSleepTimer();
  if (minutes <= 0) return;
  State.sleepTimerEnd = Date.now() + minutes * 60 * 1000;
  State.sleepTimerInterval = setInterval(() => {
    if (State.sleepTimerEnd && Date.now() >= State.sleepTimerEnd) {
      stopTTS();
      clearSleepTimer();
    }
    render();
  }, 1000);
}

function clearSleepTimer() {
  if (State.sleepTimerInterval) {
    clearInterval(State.sleepTimerInterval);
    State.sleepTimerInterval = null;
  }
  State.sleepTimerEnd = null;
}

// ==================== RENDER ====================
function render() {
  const app = document.getElementById('app');
  if (State.currentView === 'list') {
    app.innerHTML = renderListView();
  } else if (State.currentView === 'reading') {
    app.innerHTML = renderReadingView();
  }
  // Modals render on top
  if (State.currentView === 'settings') {
    app.innerHTML = renderListView() + renderSettingsModal();
  } else if (State.currentView === 'addStory') {
    app.innerHTML = renderListView() + renderAddStoryModal();
  }
}

// ==================== LIST VIEW ====================

          </button>

function renderStoryCard(story) {
  const title = replaceName(story.title);
  const preview = replaceName(story.content).substring(0, 60) + '...';
  const isFav = State.favorites.has(story.id);
  return `
    <div class="story-card" onclick="openStory('${story.id}')">
      <div class="story-card-header">
        <span class="story-title">${title}</span>
        <div class="story-card-actions">
          <button class="copy-icon-btn" onclick="event.stopPropagation();copySingleStory('${story.id}')" title="复制">📋</button>
          <button class="fav-btn ${isFav ? 'active' : ''}" onclick="event.stopPropagation();toggleFav('${story.id}')">
            ${isFav ? '★' : '☆'}
          </button>
        </div>
      </div>
      <div class="story-meta">
        <span class="category-tag">${story.category}</span>
      </div>
      <p class="story-preview">${preview}</p>
    </div>
  `;
}

function openStory(id) {
  State.currentStory = State.stories.find(s => s.id === id);
  State.currentView = 'reading';
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  State.tts.playing = false;
  State.tts.paused = false;
  State.tts.currentSentenceIndex = 0;
  State.tts.utterance = null;
  render();
  // 进入故事后自动开始播放
  setTimeout(() => { playTTS(); }, 300);
}

// 播放同分类的下一个故事
function playNextStory() {
  if (!State.currentStory) { stopTTS(); return; }
  const sameCategoryStories = State.stories.filter(s => s.category === State.currentStory.category);
  const currentIndex = sameCategoryStories.findIndex(s => s.id === State.currentStory.id);
  if (currentIndex >= 0 && currentIndex < sameCategoryStories.length - 1) {
    const nextStory = sameCategoryStories[currentIndex + 1];
    State.currentStory = nextStory;
    State.tts.playing = false;
    State.tts.paused = false;
    State.tts.currentSentenceIndex = 0;
    State.tts.utterance = null;
    render();
    setTimeout(() => { playTTS(); }, 300);
  } else {
    stopTTS();
  }
}

// 复制本分类全部故事
function copyAllStories() {
  const stories = getFilteredStories();
  const text = stories.map(s => {
    const title = replaceName(s.title);
    const content = replaceName(s.content);
    return title + '\n\n' + content;
  }).join('\n\n────────────────\n\n');
  navigator.clipboard.writeText(text).then(() => {
    alert('已复制 ' + stories.length + ' 个故事到剪贴板');
  }).catch(() => {
    // fallback for older browsers
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert('已复制 ' + stories.length + ' 个故事到剪贴板');
  });
}

// 复制单个故事
function copySingleStory(id) {
  const story = State.stories.find(s => s.id === id);
  if (!story) return;
  const title = replaceName(story.title);
  const content = replaceName(story.content);
  const text = title + '\n\n' + content;
  navigator.clipboard.writeText(text).then(() => {
    alert('已复制：' + title);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert('已复制：' + title);
  });
}

function toggleFav(id) {
  if (State.favorites.has(id)) {
    State.favorites.delete(id);
  } else {
    State.favorites.add(id);
  }
  saveState();
  render();
}

// ==================== READING VIEW ====================
function renderReadingView() {
  if (!State.currentStory) return '';
  const title = replaceName(State.currentStory.title);
  const content = replaceName(State.currentStory.content);
  const contentSentences = splitSentences(content);
  const allSentences = [title + '。', ...contentSentences];
  const progress = State.tts.playing || State.tts.paused 
    ? Math.round((State.tts.currentSentenceIndex / allSentences.length) * 100) 
    : 0;

  let timerDisplay = '';
  if (State.sleepTimerEnd) {
    const remaining = Math.max(0, Math.ceil((State.sleepTimerEnd - Date.now()) / 1000));
    const mins = Math.floor(remaining / 60);
    const secs = remaining % 60;
    timerDisplay = `<span class="timer-display">⏱ ${mins}:${secs.toString().padStart(2,'0')}</span>`;
  }

  return `
    <div class="page reading-page">
      <header class="header">
        <button class="icon-btn" onclick="goBack()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <h1 class="header-title reading-title">${title}</h1>
        <div style="width:40px"></div>
      </header>
      <div class="reading-content" id="reading-content">
        ${allSentences.map((s, i) => `
          <span class="sentence ${i === 0 ? 'story-title-sentence' : ''} ${i === State.tts.currentSentenceIndex && (State.tts.playing || State.tts.paused) ? 'highlight' : ''}" 
                onclick="jumpToSentence(${i})">${s}</span>
        `).join('')}
      </div>
      <div class="control-bar">
        ${timerDisplay}
        <div class="progress-bar">
          <div class="progress-fill" style="width:${progress}%"></div>
        </div>
        <div class="controls">
          <button class="ctrl-btn play-btn" onclick="${State.tts.playing ? 'pauseTTS()' : 'playTTS()'}">
            ${State.tts.playing 
              ? '<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>'
              : '<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>'
            }
          </button>
        </div>
      </div>
    </div>
  `;
}

function goBack() {
  stopTTS();
  State.currentView = 'list';
  State.currentStory = null;
  render();
}

function jumpToSentence(index) {
  stopTTS();
  const title = replaceName(State.currentStory.title);
  const content = replaceName(State.currentStory.content);
  State.tts.sentences = [title + '。', ...splitSentences(content)];
  speakFromIndex(index);
}

function cycleSpeed() {
  const speeds = [0.5, 0.6, 0.7, 0.75, 0.85, 1.0, 1.2, 1.5, 2.0];
  const idx = speeds.indexOf(State.settings.speed);
  State.settings.speed = speeds[(idx + 1) % speeds.length];
  saveState();
  render();
}

          <button class="icon-btn" onclick="State.currentView='list';render()">✕</button>

function addNewStory() {
  const title = document.getElementById('new-title').value.trim();
  const category = document.getElementById('new-category').value;
  const content = document.getElementById('new-content').value.trim();
  
  if (!title || !content) {
    alert('请填写标题和内容');
    return;
  }
  
  const newStory = {
    id: 'custom_' + Date.now(),
    title: title,
    category: category,
    content: content
  };
  
  State.customStories.push(newStory);
  State.stories = [...PRESET_STORIES, ...State.customStories];
  saveState();
  State.currentView = 'list';
  render();
}

// ==================== INIT ====================
loadState();
render();

// Safari加载语音列表是异步的，需要监听
if (window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = () => { if (State.currentView === 'settings') render(); };
}
